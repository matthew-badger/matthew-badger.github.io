<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 3: More Limits and Continuity</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="% Lines beginning with % are comments and never appear on a slide.\n\\title{Lecture 3: More Limits and Continuity}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 9, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n%\\slide{Today}\n\n%\\begin{itemize}\n%\\item Limits that run away to $\\pm\\infty$, and vertical asymptotes\n%\\item The \\alert{Limit Laws}\n%\\item The squeeze law\n%\\item What $x^y$ means, and where $e$ comes from\n%\\item \\alert{Continuity} and the Intermediate Value Theorem\n%\\item Limits at infinity, and horizontal asymptotes\n%\\end{itemize}\n\n%$$\\text{\\ }$$\n\n%$$\\text{Last time we built the definitions. Today we compute.}$$\n\n\\section{Where We Are}\n\n\\slide{Neighborhoods, With and Without the Center}\n\nA limit at $a$ never looks at $f(a)$. It reads the values of $f$ on a \\accent{deleted} neighborhood of $a$ and asks whether they settle down.\n\n\\begin{js}[size=1680x300, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = -3, XR = 3, PAD = 200;\nconst YB = h * 0.56;\nfunction X(v) { return PAD + (v - XL) / (XR - XL) * (w - 2 * PAD); }\nfunction txt(s, x, y, f, c) {\n  ctx.font = f; ctx.fillStyle = c; ctx.textAlign = 'center'; ctx.fillText(s, x, y);\n}\nconst deleted = step >= 1;\nonFrame(function (t) {\n  const r = 0.5 + 0.85 * (1 + Math.sin(t * 0.8)) / 2;\n  ctx.clearRect(0, 0, w, h);\n  ctx.globalAlpha = 0.32; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(-r), YB - 46, X(r) - X(-r), 92);\n  ctx.globalAlpha = 1;\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5;\n  ctx.beginPath(); ctx.moveTo(PAD - 90, YB); ctx.lineTo(w - PAD + 90, YB); ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  [-r, r].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(X(v), YB - 62); ctx.lineTo(X(v), YB + 62); ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  ctx.beginPath(); ctx.arc(X(0), YB, 12, 0, 6.2832);\n  if (deleted) {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.red; ctx.lineWidth = 4; ctx.stroke();\n  } else { ctx.fillStyle = colors.teal; ctx.fill(); }\n  txt('a', X(0), YB + 52, '600 26px ' + FM, colors.teal);\n  txt('a ' + MN + ' r', X(-r), YB - 80, '24px ' + FM, colors.burnt);\n  txt('a + r', X(r), YB - 80, '24px ' + FM, colors.burnt);\n  txt(deleted ? '0 < |x ' + MN + ' a| < r' : '|x ' + MN + ' a| < r',\n      w / 2, 46, '600 32px ' + FM, deleted ? colors.red : colors.teal2);\n  txt(deleted ? 'deleted neighborhood of a' : 'neighborhood of a',\n      w / 2, h - 20, '24px ' + FM, '#7a8788');\n});\n\\end{js}\n\n\\uncover<1->{The value $f(a)$ has no vote. It may be anything at all, and it may not exist.}\n\n\\slide{A Limit Exists When the Two Sides Agree}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x430, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212', DEL = '\\u03b4';\nconst XL = -0.15, XR = 3.1, YB = 0, YT = 3.3;\nconst L = 60, R = 26, T = 74, B = 56;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction fL(x) { return 0.8 * x + 0.4; }\nfunction fR(x) { return 2.6 - 0.5 * x; }\nfunction curve(f, x0, x1) {\n  ctx.beginPath();\n  for (let p = 0; p <= 200; p++) {\n    const x = x0 + (x1 - x0) * p / 200;\n    if (p) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x)));\n  }\n  ctx.stroke();\n}\nfunction dot(x, y, filled) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 10, 0, 6.2832);\n  if (filled) { ctx.fillStyle = colors.teal; ctx.fill(); }\n  else {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\n  }\n}\nonFrame(function (t) {\n  const d = 0.05 + 0.85 * (1 + Math.cos(t * 0.85)) / 2;\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(XL), Y(YB)); ctx.lineTo(X(XR), Y(YB));\n  ctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\n  ctx.stroke();\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n  ctx.beginPath(); ctx.moveTo(X(1), Y(YB)); ctx.lineTo(X(1), Y(YT)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4; ctx.lineCap = 'round';\n  curve(fL, XL, 1); curve(fR, 1, XR);\n  dot(1, fL(1), false); dot(1, fR(1), true);\n  [[1 - d, fL(1 - d), colors.red], [1 + d, fR(1 + d), colors.burnt]].forEach(function (q) {\n    ctx.strokeStyle = q[2]; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);\n    ctx.beginPath(); ctx.moveTo(X(q[0]), Y(q[1])); ctx.lineTo(X(XL), Y(q[1])); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.beginPath(); ctx.arc(X(q[0]), Y(q[1]), 9, 0, 6.2832);\n    ctx.fillStyle = q[2]; ctx.fill();\n  });\n  ctx.font = '600 24px ' + FM; ctx.textAlign = 'center'; ctx.fillStyle = '#111';\n  ctx.fillText('x = 1', X(1), h - 18);\n  ctx.textAlign = 'left';\n  ctx.fillStyle = colors.red;\n  ctx.fillText('f(1 ' + MN + ' ' + DEL + ') = ' + fL(1 - d).toFixed(2), 8, 30);\n  ctx.fillStyle = colors.burnt;\n  ctx.fillText('f(1 + ' + DEL + ') = ' + fR(1 + d).toFixed(2), 8, 60);\n});\n\\end{js}\n\\columnbreak\n\n$$\\lim_{x \\to 1^-} f(x) = 1.2, \\qquad \\lim_{x \\to 1^+} f(x) = 2.1$$\n\n\\uncover<1->{Both one-sided limits exist. They disagree, hence $\\displaystyle\\lim_{x \\to 1} f(x)$ does not exist.}\n\n\\uncover<2->{\\accent{$\\displaystyle\\lim_{x \\to a} f(x) = L$ exactly when both one-sided limits exist and both equal $L$.}}\n\\end{twocol}\n\n\\slide{Reading Limits Off a Graph}\n\n\\begin{js}[size=1680x480, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -0.5, XR = 6.5, YB = -0.3, YT = 4.9;\nconst L = 96, R = 40, T = 26, B = 68;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction f1(x) { return 3 - 0.25 * (x - 1) * (x - 1); }\nfunction f2(x) { return 4 - 0.35 * (x - 3) * (x - 3); }\nconst MARK = [0, 1, 3, 5];\nif (step >= 1) {\n  const m = MARK[Math.min(step, 3)];\n  ctx.globalAlpha = 0.30; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(m - 0.32), Y(YT), X(m + 0.32) - X(m - 0.32), Y(YB) - Y(YT));\n  ctx.globalAlpha = 1;\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\nfor (let k = 1; k <= 6; k++) {\n  ctx.beginPath(); ctx.moveTo(X(k), Y(YB)); ctx.lineTo(X(k), Y(YT)); ctx.stroke();\n}\nfor (let k = 1; k <= 4; k++) {\n  ctx.beginPath(); ctx.moveTo(X(XL), Y(k)); ctx.lineTo(X(XR), Y(k)); ctx.stroke();\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\nctx.stroke();\nctx.font = '24px ' + FM; ctx.fillStyle = '#666'; ctx.textAlign = 'center';\nfor (let k = 1; k <= 6; k++) ctx.fillText(String(k), X(k), Y(0) + 34);\nctx.textAlign = 'right';\nfor (let k = 1; k <= 4; k++) ctx.fillText(String(k), X(0) - 14, Y(k) + 8);\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n[[f1, 0, 3], [f2, 3, 6]].forEach(function (seg) {\n  ctx.beginPath();\n  for (let p = 0; p <= 300; p++) {\n    const x = seg[1] + (seg[2] - seg[1]) * p / 300;\n    if (p) ctx.lineTo(X(x), Y(seg[0](x))); else ctx.moveTo(X(x), Y(seg[0](x)));\n  }\n  ctx.stroke();\n});\nfunction dot(x, y, filled) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 10, 0, 6.2832);\n  if (filled) { ctx.fillStyle = colors.teal; ctx.fill(); }\n  else {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\n  }\n}\ndot(1, 3, false); dot(1, 1.4, true);\ndot(3, 2, false); dot(3, 4, true);\ndot(5, f2(5), true);\nctx.font = '600 26px ' + FM; ctx.fillStyle = colors.teal; ctx.textAlign = 'center';\n[1, 3, 5].forEach(function (m) { ctx.fillText('a = ' + m, X(m), h - 20); });\n\\end{js}\n\n\\begin{itemize}[tight]\n\\item[]\\uncover<1->{At $a = 1$: $\\displaystyle\\lim_{x \\to 1} f(x) = 3$ while $f(1) = 1.4$. The limit exists and misses the value.}\n\\item[]\\uncover<2->{At $a = 3$: left limit $2$, right limit $4$, so no limit. Here $f(3) = 4$.}\n\\item[]\\uncover<3->{At $a = 5$: $\\displaystyle\\lim_{x \\to 5} f(x) = f(5) = 2.6$. Limit and value agree. \\accent{Remember this case.}}\n\\end{itemize}\n\n\\section{Limits That Run Away}\n\n\\slide{When the Values Have No Ceiling}\n\n$\\accent{\\displaystyle\\lim_{x \\to a} f(x) = +\\infty}$ says more than \"no limit\". It says the values pass \\emph{every} height $M$ and stay past it once $x$ is close enough to $a$. Use $f(x) < -M$ for $-\\infty$, and one side of $a$ for a one-sided version.\n\n\\begin{js}[size=1680x520, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212', INF = '\\u221e', TO = '\\u2192', DEL = '\\u03b4';\nconst PA = {\n  XL: -0.75, XR: 0.75, YB: 0, YT: 150, M0: 6, M1: 130, two: false,\n  f: function (x) { return 1 / (x * x); },\n  d: function (M) { return 1 / Math.sqrt(M); },\n  lab: 'y = 1/x\\u00b2      both sides ' + TO + ' +' + INF\n};\nconst PB = {\n  XL: -0.75, XR: 0.75, YB: -46, YT: 46, M0: 5, M1: 34, two: true,\n  f: function (x) { return 1 / x; },\n  d: function (M) { return 1 / M; },\n  lab: 'y = 1/x      left ' + TO + ' ' + MN + INF + ',   right ' + TO + ' +' + INF\n};\nfunction panel(ox, pw, c, u) {\n  const L = 74, R = 44, T = 34, B = 92;\n  const PW = pw - L - R, PH = h - T - B;\n  const X = function (v) { return ox + L + (v - c.XL) / (c.XR - c.XL) * PW; };\n  const Y = function (v) { return T + PH - (v - c.YB) / (c.YT - c.YB) * PH; };\n  const M = c.M0 * Math.pow(c.M1 / c.M0, u), d = c.d(M);\n  ctx.globalAlpha = 0.30; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(c.XL), T, PW, Y(M) - T);\n  if (c.two) ctx.fillRect(X(c.XL), Y(-M), PW, T + PH - Y(-M));\n  ctx.fillStyle = colors.blue3;\n  ctx.fillRect(X(-d), T, X(d) - X(-d), PH);\n  ctx.globalAlpha = 1;\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\n  ctx.beginPath(); ctx.moveTo(X(c.XL), Y(M)); ctx.lineTo(X(c.XR), Y(M));\n  if (c.two) { ctx.moveTo(X(c.XL), Y(-M)); ctx.lineTo(X(c.XR), Y(-M)); }\n  ctx.stroke();\n  ctx.strokeStyle = colors.blue;\n  ctx.beginPath();\n  ctx.moveTo(X(-d), T); ctx.lineTo(X(-d), T + PH);\n  ctx.moveTo(X(d), T); ctx.lineTo(X(d), T + PH);\n  ctx.stroke(); ctx.setLineDash([]);\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(c.XL), Y(Math.max(c.YB, 0))); ctx.lineTo(X(c.XR), Y(Math.max(c.YB, 0)));\n  ctx.stroke();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 1200; p++) {\n    const x = c.XL + (c.XR - c.XL) * p / 1200;\n    if (Math.abs(x) < 0.0015) { pen = false; continue; }\n    const y = c.f(x);\n    if (y < c.YB || y > c.YT) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n  ctx.font = '24px ' + FM; ctx.fillStyle = colors.red; ctx.textAlign = 'right';\n  ctx.fillText('y = M', X(c.XR) - 6, Y(M) - 12);\n  if (c.two) ctx.fillText('y = ' + MN + 'M', X(c.XR) - 6, Y(-M) + 32);\n  ctx.font = '600 24px ' + FM; ctx.fillStyle = colors.teal; ctx.textAlign = 'center';\n  ctx.fillText('M = ' + M.toFixed(0) + '     ' + DEL + ' = ' + d.toFixed(3),\n    ox + pw / 2, h - 56);\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = '#111';\n  ctx.fillText(c.lab, ox + pw / 2, h - 20);\n}\nconst held = (canvas.__u === undefined) ? 1 : canvas.__u;\nonFrame(function (t) {\n  const u = Math.min((t % 5.6) / 4.2, 1);\n  ctx.clearRect(0, 0, w, h);\n  if (step >= 1) {\n    panel(0, w / 2, PA, held);\n    panel(w / 2, w / 2, PB, u);\n  } else {\n    canvas.__u = u;\n    panel(0, w / 2, PA, u);\n  }\n});\n\\end{js}\n\n\\uncover<1->{Raise the ceiling as high as you like. The curve is above it for every $x$ inside the blue strip, and the strip never empties.}\n\n\\slide{Vertical Asymptotes}\n\n\\begin{definition}{Vertical asymptote}\nThe line $x = a$ is a \\accent{vertical asymptote} of $f$ if at least one of the two one-sided limits of $f$ at $a$ is $+\\infty$ or $-\\infty$.\n\\end{definition}\n\n\\pause\n\n\\begin{itemize}\n\\item One side is enough. The graph of $\\ln x$ has the vertical asymptote $x = 0$, and $\\ln x$ is not even defined to the left of $0$.\n\\pause\n\\item The two sides need not match. For $1/x$ the left side falls and the right side climbs.\n\\pause\n\\item A zero denominator is a place to \\emph{look}, not a guarantee. We will see one that fails in a moment.\n\\end{itemize}\n\n\\slide{Where Are the Vertical Asymptotes?}\n\n$$f(x) = \\frac{x+1}{(x-2)(x+3)}$$\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x460, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -7, XR = 6, YB = -3.6, YT = 3.6;\nconst L = 54, R = 26, T = 24, B = 56;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction f(x) { return (x + 1) / ((x - 2) * (x + 3)); }\nconst POLE = [-3, 2];\nif (step >= 1) {\n  const m = step === 1 ? 2 : -3;\n  ctx.globalAlpha = 0.30; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(m - 0.55), T, X(m + 0.55) - X(m - 0.55), PH);\n  ctx.globalAlpha = 1;\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\nPOLE.forEach(function (v) {\n  ctx.beginPath(); ctx.moveTo(X(v), T); ctx.lineTo(X(v), T + PH); ctx.stroke();\n});\nctx.setLineDash([]);\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 1400; p++) {\n  const x = XL + (XR - XL) * p / 1400;\n  if (Math.abs(x - 2) < 0.006 || Math.abs(x + 3) < 0.006) { pen = false; continue; }\n  const y = f(x);\n  if (y < YB || y > YT) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke();\nctx.beginPath(); ctx.arc(X(-1), Y(0), 9, 0, 6.2832);\nctx.fillStyle = colors.teal; ctx.fill();\nctx.font = '600 24px ' + FM; ctx.fillStyle = colors.red; ctx.textAlign = 'center';\nctx.fillText('x = ' + '\\u2212' + '3', X(-3), h - 18);\nctx.fillText('x = 2', X(2), h - 18);\n\\end{js}\n\\columnbreak\n\n\\uncover<1->{Near $x = 2$ the factors $x+1$ and $x+3$ are close to $3$ and $5$, both positive, and only $x - 2$ changes sign. Hence\n$$\\lim_{x \\to 2^-} f(x) = -\\infty, \\qquad \\lim_{x \\to 2^+} f(x) = +\\infty.$$}\n\n\\uncover<2->{Near $x = -3$ we have $x + 1 \\approx -2$ and $x - 2 \\approx -5$, and the quotient of those is positive. Thus $f(x) \\approx 0.4/(x+3)$, which gives\n$$\\lim_{x \\to -3^-} f(x) = -\\infty, \\qquad \\lim_{x \\to -3^+} f(x) = +\\infty.$$}\n\\end{twocol}\n\n\\slide{You Try}\n\nFind every vertical asymptote of $\\displaystyle g(x) = \\frac{1}{x-4}$, and give the one-sided limits there.\n\n\\pause\n\n\\begin{twocol}[3 2]\nThe numerator is never $0$ and the denominator vanishes only at $4$, so $x = 4$ is the only candidate. Just left of $4$ the denominator is a small negative number and just right of it a small positive one, hence\n$$\\lim_{x \\to 4^-} g(x) = -\\infty, \\qquad \\lim_{x \\to 4^+} g(x) = +\\infty.$$\nThe line $x = 4$ is a vertical asymptote.\n\\columnbreak\n\\begin{js}[size=760x360, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = 1.2, XR = 6.8, YB = -7, YT = 7;\nconst L = 56, R = 26, T = 24, B = 52;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.stroke();\nctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\nctx.beginPath(); ctx.moveTo(X(4), T); ctx.lineTo(X(4), T + PH); ctx.stroke();\nctx.setLineDash([]);\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 900; p++) {\n  const x = XL + (XR - XL) * p / 900;\n  if (Math.abs(x - 4) < 0.01) { pen = false; continue; }\n  const y = 1 / (x - 4);\n  if (y < YB || y > YT) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n[2, 3, 5, 6].forEach(function (v) { ctx.fillText(String(v), X(v), Y(0) + 28); });\nctx.font = '600 24px ' + FM; ctx.fillStyle = colors.red;\nctx.fillText('x = 4', X(4), h - 14);\nif (step >= 2) {\n  ctx.font = '600 26px ' + FM; ctx.textAlign = 'right';\n  ctx.fillStyle = colors.burnt;\n  ctx.fillText(MN + '\\u221e', X(4) - 18, Y(-5.4));\n  ctx.textAlign = 'left';\n  ctx.fillStyle = colors.teal;\n  ctx.fillText('+\\u221e', X(4) + 18, Y(5.4));\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{The Limit Laws}\n\nSuppose $\\displaystyle\\lim_{x \\to a} f(x) = L$ and $\\displaystyle\\lim_{x \\to a} g(x) = M$, and let $c$ be a constant.\n\n\\begin{twocol}[1 1]\n\\begin{table}\nLaw & Statement\nConstant & $\\displaystyle\\lim_{x \\to a} c = c$\nIdentity & $\\displaystyle\\lim_{x \\to a} x = a$\nSum & $\\displaystyle\\lim_{x \\to a} \\left(f(x) + g(x)\\right) = L + M$\nMultiple & $\\displaystyle\\lim_{x \\to a} c\\,f(x) = cL$\nProduct & $\\displaystyle\\lim_{x \\to a} f(x)g(x) = LM$\n\\end{table}\n\\columnbreak\n\\begin{table}\nLaw & Statement\nQuotient & $\\displaystyle\\lim_{x \\to a} \\frac{f(x)}{g(x)} = \\frac{L}{M}$ if $M \\neq 0$\nPower & $\\displaystyle\\lim_{x \\to a} f(x)^n = L^n$\nRoot & $\\displaystyle\\lim_{x \\to a} \\sqrt[n]{f(x)} = \\sqrt[n]{L}$\nSubstitution & $\\displaystyle\\lim_{x \\to a} F(g(x)) = \\lim_{u \\to M} F(u)$ where $u = g(x)$\n\\end{table}\n\\end{twocol}\n\n\\pause\n\n\\begin{note}{}\nHere $u = g(x)$, and $u \\to M$ because $M$ is the limit of $g$ at $a$. The law also needs $F$ to be well behaved at $M$, which we postpone. Every $F$ today qualifies.\n\\end{note}\n\n\\slide{Polynomials Need No Work}\n\n\\begin{align}\n\\lim_{x \\to a} x &= a &&\\text{identity law} \\\\\n\\pause\n\\lim_{x \\to a} x^n &= a^n &&\\text{product law, applied } n-1 \\text{ times} \\\\\n\\pause\n\\lim_{x \\to a} \\left(c_n x^n + \\cdots + c_0\\right) &= c_n a^n + \\cdots + c_0 &&\\text{multiple and sum laws}\n\\end{align}\n\n\\pause\n\n\\begin{example}\n$\\displaystyle\\lim_{x \\to 2} \\left(3x^3 - 5x + 1\\right) = 3 \\cdot 8 - 10 + 1 = 15$, and by the quotient law\n$$\\lim_{x \\to 2} \\frac{3x^3 - 5x + 1}{x^2 + 1} = \\frac{15}{5} = 3.$$\n\\end{example}\n\n\\pause\n\n\\alert{For a polynomial or a rational function, when the denominator is not zero at $a$, the limit is the value.}\n\n\\slide{When Substitution Fails: $0/0$}\n\n\\begin{twocol}[3 2]\nSubstituting $x = 3$ into $\\displaystyle\\frac{x^2-9}{x-3}$ gives $0/0$, which is not a number and not an answer.\n\n\\uncover<1->{For every $x \\neq 3$,\n$$\\frac{x^2-9}{x-3} = \\frac{(x-3)(x+3)}{x-3} = x+3.$$}\n\n\\uncover<2->{The two functions agree on a deleted neighborhood of $3$, and a limit reads nothing else. Hence\n$$\\lim_{x \\to 3} \\frac{x^2-9}{x-3} = \\lim_{x \\to 3} (x+3) = 6.$$}\n\\columnbreak\n\\begin{js}[size=900x420, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = 0, XR = 5.4, YB = 2.4, YT = 9;\nconst L = 66, R = 26, T = 26, B = 56;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\nfor (let k = 1; k <= 5; k++) {\n  ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke();\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(X(XL), Y(YB)); ctx.lineTo(X(XR), Y(YB)); ctx.stroke();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nctx.moveTo(X(XL), Y(XL + 3)); ctx.lineTo(X(XR), Y(XR + 3));\nctx.stroke();\nif (step >= 2) {\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  ctx.beginPath();\n  ctx.moveTo(X(3), Y(YB)); ctx.lineTo(X(3), Y(6));\n  ctx.moveTo(X(XL), Y(6)); ctx.lineTo(X(3), Y(6));\n  ctx.stroke(); ctx.setLineDash([]);\n}\nctx.beginPath(); ctx.arc(X(3), Y(6), 11, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.red; ctx.lineWidth = 4; ctx.stroke();\nctx.font = '600 24px ' + FM; ctx.fillStyle = '#111'; ctx.textAlign = 'center';\nctx.fillText('x = 3', X(3), h - 16);\nctx.textAlign = 'right'; ctx.fillStyle = colors.burnt;\nif (step >= 2) ctx.fillText('6', X(XL) - 8, Y(6) + 8);\n\\end{js}\n\\end{twocol}\n\n\\slide{A Harder One: Conjugates}\n\n$$\\lim_{x \\to 0} \\frac{\\sqrt{x+4}-2}{x} \\quad\\text{is again } 0/0.$$\n\n\\begin{twocol}[2 3]\n\\begin{js}[size=640x400]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = -4.4, XR = 5, YB = 0.14, YT = 0.6;\nconst L = 92, R = 26, T = 26, B = 58;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction g(x) { return 1 / (Math.sqrt(x + 4) + 2); }\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\n[0.2, 0.3, 0.4, 0.5].forEach(function (v) {\n  ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke();\n});\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\n[0.2, 0.3, 0.4, 0.5].forEach(function (v) { ctx.fillText(v.toFixed(1), L - 12, Y(v) + 8); });\nctx.textAlign = 'center';\n[[-4, MN + '4'], [-2, MN + '2'], [2, '2'], [4, '4']].forEach(function (q) {\n  ctx.fillText(q[1], X(q[0]), T + PH + 30);\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 600; p++) {\n  const x = -4 + 9 * p / 600;\n  if (Math.abs(x) < 0.012) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(g(x))); else { ctx.moveTo(X(x), Y(g(x))); pen = true; }\n}\nctx.stroke();\nif (step >= 3) {\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  ctx.beginPath(); ctx.moveTo(L, Y(0.25)); ctx.lineTo(X(0), Y(0.25)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.font = '600 24px ' + FM; ctx.fillStyle = colors.burnt; ctx.textAlign = 'left';\n  ctx.fillText('1/4', L + 12, Y(0.25) - 14);\n}\nctx.beginPath(); ctx.arc(X(0), Y(0.25), 10, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.red; ctx.lineWidth = 4; ctx.stroke();\n\\end{js}\n\\columnbreak\n\nMultiply above and below by $\\sqrt{x+4}+2$.\n\n\\begin{align}\n\\frac{\\sqrt{x+4}-2}{x} &= \\frac{\\left(\\sqrt{x+4}-2\\right)\\left(\\sqrt{x+4}+2\\right)}{x\\left(\\sqrt{x+4}+2\\right)} \\\\\n\\pause\n&= \\frac{(x+4)-4}{x\\left(\\sqrt{x+4}+2\\right)} \\\\\n\\pause\n&= \\frac{1}{\\sqrt{x+4}+2} \\quad\\text{for all } x \\neq 0\n\\end{align}\n\n\\pause\n\nThe right side is a quotient with nonzero denominator at $0$, hence the limit is $\\displaystyle\\frac{1}{\\sqrt{4}+2} = \\frac{1}{4}$.\n\\end{twocol}\n\n\\slide{You Try}\n\n$$\\lim_{x \\to 0} \\frac{\\sqrt{9+x}-3}{x}$$\n\n\\pause\n\nSubstituting gives $0/0$. Multiply above and below by $\\sqrt{9+x}+3$:\n$$\\frac{(9+x)-9}{x\\left(\\sqrt{9+x}+3\\right)} = \\frac{1}{\\sqrt{9+x}+3} \\quad\\text{for all } x \\neq 0.$$\n\n\\pause\n\nThe denominator is $6$ at $x = 0$, hence the limit is $\\displaystyle\\frac{1}{6}$.\n\n\\slide{The Squeeze Law}\n\n\\begin{theorem}{Squeeze law}\nSuppose $g(x) \\leq f(x) \\leq h(x)$ for all $x$ in some deleted neighborhood of $a$. If $\\displaystyle\\lim_{x \\to a} g(x) = \\lim_{x \\to a} h(x) = L$, then $\\displaystyle\\lim_{x \\to a} f(x) = L$.\n\\end{theorem}\n\n\\begin{twocol}[3 2]\n\n$$\\text{\\ }$$\n\n$$\\text{\\ }$$\n\n\\begin{js}[size=920x430, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst L = 70, R = 26, T = 30, B = 62;\nconst PW = w - L - R, PH = h - T - B;\nconst WIN = [1.0, 0.3, 0.08];\nfunction axes(X, Y, x0, x1) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0));\n  ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\n  ctx.stroke();\n}\nfunction drawSin() {\n  const R2 = 1, yb = -1.35, yt = 1.35;\n  const X = function (v) { return L + (v + R2) / (2 * R2) * PW; };\n  const Y = function (v) { return T + PH - (v - yb) / (yt - yb) * PH; };\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = colors.blue; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);\n  [1, -1].forEach(function (s) {\n    ctx.beginPath(); ctx.moveTo(X(-R2), Y(s)); ctx.lineTo(X(R2), Y(s)); ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  axes(X, Y, -R2, R2);\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  for (let p = 0; p <= 9000; p++) {\n    const x = -R2 + 2 * R2 * p / 9000;\n    if (Math.abs(x) < 0.0012) continue;\n    const y = Math.sin(1 / x);\n    if (p) ctx.lineTo(X(x), Y(y)); else ctx.moveTo(X(x), Y(y));\n  }\n  ctx.stroke();\n  ctx.font = '600 24px ' + FM; ctx.textAlign = 'center';\n  ctx.fillStyle = colors.blue; ctx.fillText('y = \\u00b11', X(0) + PW * 0.34, T + 30);\n  ctx.fillStyle = colors.red; ctx.fillText('y = sin(1/x)', X(0) - PW * 0.30, T + 30);\n  ctx.fillStyle = '#7a8788'; ctx.fillText('window: |x| < 1', w / 2, h - 18);\n}\nfunction f(x) { return x === 0 ? 0 : x * x * Math.sin(1 / x); }\nfunction draw(R2) {\n  const yt = R2 * R2 * 1.3, yb = -yt;\n  const X = function (v) { return L + (v + R2) / (2 * R2) * PW; };\n  const Y = function (v) { return T + PH - (v - yb) / (yt - yb) * PH; };\n  ctx.clearRect(0, 0, w, h);\n  axes(X, Y, -R2, R2);\n  ctx.strokeStyle = colors.blue; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);\n  [1, -1].forEach(function (s) {\n    ctx.beginPath();\n    for (let p = 0; p <= 200; p++) {\n      const x = -R2 + 2 * R2 * p / 200;\n      if (p) ctx.lineTo(X(x), Y(s * x * x)); else ctx.moveTo(X(x), Y(s * x * x));\n    }\n    ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.lineCap = 'round';\n  ctx.beginPath();\n  for (let p = 0; p <= 4000; p++) {\n    const x = -R2 + 2 * R2 * p / 4000;\n    if (p) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x)));\n  }\n  ctx.stroke();\n  ctx.font = '600 24px ' + FM; ctx.textAlign = 'center';\n  ctx.fillStyle = colors.blue; ctx.fillText('y = \\u00b1x\\u00b2', X(0) + PW * 0.34, T + 30);\n  ctx.fillStyle = colors.red; ctx.fillText('y = x\\u00b2 sin(1/x)', X(0) - PW * 0.30, T + 30);\n  ctx.fillStyle = '#7a8788';\n  ctx.fillText('window: |x| < ' + R2.toFixed(3), w / 2, h - 18);\n}\nif (step <= 1) {\n  drawSin();\n} else {\n  const target = WIN[Math.min(step - 2, 2)];\n  const from = (canvas.__R === undefined) ? target : canvas.__R;\n  onFrame(function (t) {\n    const u = Math.min(t / 0.75, 1);\n    const e = 1 - Math.pow(1 - u, 3);\n    const R2 = from * Math.pow(target / from, e);\n    canvas.__R = R2;\n    draw(R2);\n  });\n}\n\\end{js}\n\\columnbreak\n\n$\\displaystyle\\lim_{x \\to 0} \\sin(1/x)$ does not exist. However close to $0$ we look, the values still sweep the whole band from $-1$ to $1$.\n\n\\uncover<1->{Now consider $x^2 \\sin(1/x)$. The product law needs \\emph{both} factors to have a limit. The first has one and the second does not, hence the law simply does not apply. That is not a claim that the product has no limit.}\n\n\\uncover<2->{Test it directly instead. Since $|\\sin(1/x)| \\leq 1$,\n$$-x^2 \\leq x^2 \\sin(1/x) \\leq x^2 \\quad\\text{for all } x \\neq 0.$$}\n\n\\uncover<3->{Both outer functions have limit $0$ at $0$. Therefore\n$$\\lim_{x \\to 0} x^2 \\sin(1/x) = 0.$$}\n\\end{twocol}\n\n\\section{Make Sense of Powers}\n\n\\slide{What Does $x^y$ Mean?}\n\nFix $x > 0$. We know $x^n$ for a positive integer $n$, and $x^{1/n}$ is the positive number whose $n$th power is $x$. Combining these gives $x^{p/q} = \\left(x^p\\right)^{1/q}$ for every rational $p/q$.\n\n\\begin{js}[size=1680x430, frames=7]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst DEN = [1, 2, 4, 8, 16, 32, 64];\nconst n = DEN[Math.min(step, 6)];\nconst XL = -1.3, XR = 2.4, YB = 0, YT = 5.6;\nconst L = 92, R = 40, T = 26, B = 66;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\nfor (let k = -1; k <= 2; k++) {\n  ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke();\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.font = '24px ' + FM; ctx.fillStyle = '#666'; ctx.textAlign = 'center';\nfor (let k = -1; k <= 2; k++) { if (k) ctx.fillText(String(k), X(k), Y(0) + 34); }\nif (step >= 3) {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 8; ctx.lineCap = 'round';\n  ctx.beginPath();\n  for (let p = 0; p <= 400; p++) {\n    const x = XL + (XR - XL) * p / 400;\n    if (p) ctx.lineTo(X(x), Y(Math.pow(2, x))); else ctx.moveTo(X(x), Y(Math.pow(2, x)));\n  }\n  ctx.stroke();\n}\nctx.fillStyle = colors.teal2;\nfor (let k = Math.ceil(XL * n); k <= Math.floor(XR * n); k++) {\n  const r = k / n;\n  ctx.beginPath(); ctx.arc(X(r), Y(Math.pow(2, r)), n > 4 ? 5 : 8, 0, 6.2832); ctx.fill();\n}\nctx.font = '600 28px ' + FM; ctx.fillStyle = colors.teal; ctx.textAlign = 'left';\nctx.fillText('y = 2^r   for r = k/' + n, L + 10, T + 34);\nctx.font = '24px ' + FM; ctx.fillStyle = '#7a8788';\nctx.fillText('denominator ' + n, L + 10, T + 66);\n\\end{js}\n\n\\uncover<6->{The dots close every gap you can see. But each one has a rational exponent, and $\\sqrt{2}$ is irrational, so no refinement will ever land on it. What, then, is $2^{\\sqrt{2}}$?}\n\n\\slide{Trapping $2^{\\sqrt{2}}$}\n\nRational exponents sit as close to $\\sqrt{2} = 1.41421\\ldots$ as we like on both sides. Trap the exponent between two of them and the power is trapped as well.\n\n\\begin{js}[size=1680x480, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst RT = '\\u221a';\nconst C = Math.SQRT2, V = Math.pow(2, C);\nconst BR = [[1.4, 1.5], [1.41, 1.42], [1.414, 1.415], [1.4142, 1.4143]];\nconst k = Math.min(step, 3);\nconst LM = 430, RM = 44, BH = 20;\nconst AW = w - LM - RM;\nconst EHW = 0.1, VHW = 0.18;\nconst ROWE = [80, 116, 152, 188], ROWV = [292, 328, 364, 400];\nfunction XE(v) { return LM + (v - (C - EHW)) / (2 * EHW) * AW; }\nfunction XV(v) { return LM + (v - (V - VHW)) / (2 * VHW) * AW; }\nfunction bar(a, b, y, fill, edge) {\n  const x0 = Math.min(a, b), wid = Math.max(Math.abs(b - a), 5);\n  ctx.globalAlpha = 0.32; ctx.fillStyle = fill;\n  ctx.fillRect(x0, y, wid, BH); ctx.globalAlpha = 1;\n  ctx.strokeStyle = edge; ctx.lineWidth = 2.5;\n  ctx.strokeRect(x0, y, wid, BH);\n}\nfunction lab(s, y, col) {\n  ctx.font = '24px ' + FM; ctx.fillStyle = col; ctx.textAlign = 'right';\n  ctx.fillText(s, LM - 22, y + BH - 3);\n}\nfunction head(s, y, col) {\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = col; ctx.textAlign = 'left';\n  ctx.fillText(s, 24, y);\n}\nfunction base(y, lo, hi, fmt) {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(LM, y); ctx.lineTo(LM + AW, y); ctx.stroke();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899';\n  ctx.textAlign = 'left'; ctx.fillText(lo.toFixed(fmt), LM, y + 26);\n  ctx.textAlign = 'right'; ctx.fillText(hi.toFixed(fmt), LM + AW, y + 26);\n}\nfunction draw(u) {\n  ctx.clearRect(0, 0, w, h);\n  head('exponent r', 56, colors.blue);\n  head('value 2^r', 268, colors.burnt);\n  base(220, C - EHW, C + EHW, 3);\n  base(432, V - VHW, V + VHW, 3);\n  for (let i = 0; i <= k; i++) {\n    let lo = BR[i][0], hi = BR[i][1];\n    if (i === k) {\n      const p = i ? BR[i - 1] : [C - EHW, C + EHW];\n      lo = p[0] + (lo - p[0]) * u;\n      hi = p[1] + (hi - p[1]) * u;\n    }\n    bar(XE(lo), XE(hi), ROWE[i], colors.blue3, colors.blue);\n    bar(XV(Math.pow(2, lo)), XV(Math.pow(2, hi)), ROWV[i], colors.gold, colors.burnt);\n    if (i < k || u > 0.98) {\n      lab(BR[i][0] + ' < ' + RT + '2 < ' + BR[i][1], ROWE[i], colors.blue);\n      lab(Math.pow(2, BR[i][0]).toFixed(5) + ' < 2^' + RT + '2 < '\n        + Math.pow(2, BR[i][1]).toFixed(5), ROWV[i], colors.burnt);\n    }\n  }\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([7, 7]);\n  ctx.beginPath();\n  ctx.moveTo(XE(C), 66); ctx.lineTo(XE(C), 236);\n  ctx.moveTo(XV(V), 278); ctx.lineTo(XV(V), 448);\n  ctx.stroke(); ctx.setLineDash([]);\n}\nonFrame(function (t) {\n  const q = Math.min(t / 0.6, 1);\n  draw(1 - Math.pow(1 - q, 3));\n});\n\\end{js}\n\n\\uncover<3->{This is the squeeze law with the brackets doing the squeezing. Each row is ten times shorter than the one above, both columns close on the red line, and that line is $\\accent{2^{\\sqrt{2}} = 2.66514\\ldots}$}\n\n\\slide{$y = (1+x)^{1/x}$}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=900x430, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = -0.4, XR = 1.0, YB = 1.9, YT = 3.7;\nconst L = 96, R = 26, T = 28, B = 74;\nconst PW = w - L - R, PH = h - T - B;\nconst E = Math.E;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction f(x) { return Math.pow(1 + x, 1 / x); }\nfunction curve() {\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 900; p++) {\n    const x = XL + (XR - XL) * p / 900;\n    if (Math.abs(x) < 0.005) { pen = false; continue; }\n    const y = f(x);\n    if (y < YB || y > YT) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n}\nfunction frame() {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\n  [2, 3].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke();\n  });\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\n  ctx.stroke();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\n  [2, 3].forEach(function (v) { ctx.fillText(String(v), L - 12, Y(v) + 8); });\n  ctx.textAlign = 'center';\n  [[-0.25, MN + '0.25'], [0.5, '0.5'], [1, '1']].forEach(function (q) {\n    ctx.fillText(q[1], X(q[0]), T + PH + 30);\n  });\n}\nfunction pair(d) {\n  [[-d, colors.red], [d, colors.burnt]].forEach(function (q) {\n    const y = f(q[0]);\n    ctx.strokeStyle = q[1]; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);\n    ctx.beginPath(); ctx.moveTo(L, Y(y)); ctx.lineTo(X(q[0]), Y(y)); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.beginPath(); ctx.arc(X(q[0]), Y(y), 9, 0, 6.2832);\n    ctx.fillStyle = q[1]; ctx.fill();\n  });\n  ctx.font = '600 24px ' + FM; ctx.textAlign = 'left';\n  ctx.fillStyle = colors.red;\n  ctx.fillText('at x = ' + MN + d.toFixed(3) + ':  ' + f(-d).toFixed(5), L + 12, T + 30);\n  ctx.fillStyle = colors.burnt;\n  ctx.fillText('at x = +' + d.toFixed(3) + ':  ' + f(d).toFixed(5), L + 12, T + 60);\n}\nif (step === 0) {\n  ctx.clearRect(0, 0, w, h);\n  frame(); curve();\n} else {\n  onFrame(function (t) {\n    const u = Math.min((t % 6) / 4.6, 1);\n    const d = 0.3 * Math.pow(0.006 / 0.3, u);\n    ctx.clearRect(0, 0, w, h);\n    frame();\n    if (step >= 2) {\n      ctx.strokeStyle = colors.teal; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\n      ctx.beginPath(); ctx.moveTo(L, Y(E)); ctx.lineTo(L + PW, Y(E)); ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.font = '600 24px ' + FM; ctx.fillStyle = colors.teal; ctx.textAlign = 'right';\n      ctx.fillText('2.71828...', L + PW, Y(E) - 12);\n    }\n    curve(); pair(d);\n  });\n}\n\\end{js}\n\\columnbreak\n\n\\begin{table}\n$|x|$ & at $-|x|$ & at $+|x|$\n$0.5$ & $4$ & $2.25$\n$0.1$ & $2.86797\\ldots$ & $2.59374\\ldots$\n$0.01$ & $2.73199\\ldots$ & $2.70481\\ldots$\n$0.001$ & $2.71964\\ldots$ & $2.71692\\ldots$\n\\end{table}\n\n\\uncover<1->{The function is undefined at $x = 0$, which is exactly the case a limit is built for. The left column falls, the right column rises, and neither ever crosses the other.}\n\\end{twocol}\n\n\\uncover<2->{Once again two brackets close on a single number. This one is not a fraction, not a root, and not the power of anything familiar, so it gets a name.\n$$\\accent{\\lim_{x \\to 0^+} (1+x)^{1/x} = e = 2.71828\\ldots}$$}\n\n\\slide{The Exponential Function $y = e^x$}\n\nHere is the graph of $e^x$:\n\n\\begin{js}[size=1680x450, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = -1.7, XR = 1.7, YB = 0, YT = 4.3;\nconst L = 92, R = 44, T = 28, B = 72;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction draw(b, col, wid) {\n  ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 600; p++) {\n    const x = XL + (XR - XL) * p / 600, y = Math.pow(b, x);\n    if (y > YT) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\n[1, 2, 3, 4].forEach(function (v) {\n  ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke();\n});\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0));\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\n[1, 2, 3, 4].forEach(function (v) { ctx.fillText(String(v), L - 12, Y(v) + 8); });\nctx.textAlign = 'center';\n[[-1, MN + '1'], [1, '1']].forEach(function (q) {\n  ctx.fillText(q[1], X(q[0]), Y(0) + 32);\n});\nif (step >= 1) {\n  draw(2, colors.blue, 3.5);\n  draw(3, colors.burnt, 3.5);\n  ctx.font = '600 26px ' + FM; ctx.textAlign = 'left';\n  ctx.fillStyle = colors.blue; ctx.fillText('2^x', X(1.45), Y(2.2));\n  ctx.fillStyle = colors.burnt; ctx.fillText('3^x', X(0.5), Y(3.5));\n}\ndraw(Math.E, colors.teal2, 5);\nctx.font = '600 28px ' + FM; ctx.fillStyle = colors.teal2; ctx.textAlign = 'left';\nctx.fillText('e^x', X(1.28), Y(2.95));\nctx.beginPath(); ctx.arc(X(0), Y(1), 10, 0, 6.2832);\nctx.fillStyle = colors.teal; ctx.fill();\n\\end{js}\n\n\\section{Continuity}\n\n\\slide{Continuity at a Point}\n\n\\begin{definition}{Continuity}\n$f$ is \\accent{continuous at $a$} if $f$ is defined on a neighborhood of $a$, the limit $\\displaystyle\\lim_{x \\to a} f(x)$ exists, and\n$$\\lim_{x \\to a} f(x) = f(a).$$\n\\end{definition}\n\n\\begin{js}[size=1680x400, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -0.6, XR = 2.6, YB = 0, YT = 4.2;\nfunction box(ox, pw) {\n  const L = 40, R = 34, T = 20, B = 70;\n  const PW = pw - L - R, PH = h - T - B;\n  return {\n    X: function (v) { return ox + L + (v - XL) / (XR - XL) * PW; },\n    Y: function (v) { return T + PH - (v - YB) / (YT - YB) * PH; },\n    T: T, PH: PH\n  };\n}\nfunction axes(B) {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(B.X(XL), B.Y(0)); ctx.lineTo(B.X(XR), B.Y(0));\n  ctx.stroke();\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n  ctx.beginPath(); ctx.moveTo(B.X(1), B.T); ctx.lineTo(B.X(1), B.T + B.PH); ctx.stroke();\n  ctx.setLineDash([]);\n}\nfunction seg(B, f, x0, x1) {\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 400; p++) {\n    const x = x0 + (x1 - x0) * p / 400;\n    const y = f(x);\n    if (y < YB || y > YT) { pen = false; continue; }\n    if (pen) ctx.lineTo(B.X(x), B.Y(y)); else { ctx.moveTo(B.X(x), B.Y(y)); pen = true; }\n  }\n  ctx.stroke();\n}\nfunction dot(B, x, y, filled) {\n  ctx.beginPath(); ctx.arc(B.X(x), B.Y(y), 10, 0, 6.2832);\n  if (filled) { ctx.fillStyle = colors.teal; ctx.fill(); }\n  else {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.red; ctx.lineWidth = 4; ctx.stroke();\n  }\n}\nfunction label(ox, pw, s) {\n  ctx.font = '600 24px ' + FM; ctx.fillStyle = '#111'; ctx.textAlign = 'center';\n  ctx.fillText(s, ox + pw / 2, h - 22);\n}\nconst pw = w / 3;\nlet B = box(0, pw);\naxes(B);\nseg(B, function (x) { return 1 + 0.7 * x; }, XL, XR);\ndot(B, 1, 1.7, false); dot(B, 1, 0.6, true);\nlabel(0, pw, 'limit exists, value disagrees');\nif (step >= 1) {\n  B = box(pw, pw);\n  axes(B);\n  seg(B, function (x) { return 1 + 0.7 * x; }, XL, 1);\n  seg(B, function (x) { return 3.4 - 0.6 * x; }, 1, XR);\n  dot(B, 1, 1.7, false); dot(B, 1, 2.8, true);\n  label(pw, pw, 'no limit: the sides disagree');\n}\nif (step >= 2) {\n  B = box(2 * pw, pw);\n  axes(B);\n  seg(B, function (x) { return 0.5 + 0.06 / ((x - 1) * (x - 1)); }, XL, 0.999);\n  seg(B, function (x) { return 0.5 + 0.06 / ((x - 1) * (x - 1)); }, 1.001, XR);\n  label(2 * pw, pw, 'no limit: the values blow up');\n}\n\\end{js}\n\n\\slide{One Stroke of the Pencil}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x400, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst jump = step >= 1;\nconst XL = 0, XR = 6, YB = 0, YT = 4.4;\nconst L = 40, R = 30, T = 30, B = 62;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction f(x) { return 1.9 + 0.75 * Math.sin(1.25 * x) + (jump && x > 3 ? 1.1 : 0); }\nonFrame(function (t) {\n  const u = Math.min((t % 4.2) / 3, 1);\n  const xe = XL + (XR - XL) * u;\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0)); ctx.stroke();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 400; p++) {\n    const x = XL + (xe - XL) * p / 400;\n    if (jump && Math.abs(x - 3) < 0.004) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(f(x))); else { ctx.moveTo(X(x), Y(f(x))); pen = true; }\n  }\n  ctx.stroke();\n  if (jump && xe > 3) {\n    ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);\n    ctx.beginPath();\n    ctx.moveTo(X(3), Y(f(2.999)));\n    ctx.quadraticCurveTo(X(3) + 46, (Y(f(2.999)) + Y(f(3.001))) / 2, X(3), Y(f(3.001)));\n    ctx.stroke(); ctx.setLineDash([]);\n  }\n  ctx.beginPath(); ctx.arc(X(xe), Y(f(Math.min(xe, XR - 0.001))), 10, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.font = '600 26px ' + FM; ctx.textAlign = 'center';\n  ctx.fillStyle = jump ? colors.red : colors.teal;\n  ctx.fillText(jump ? 'the pencil lifts at x = 3' : 'one stroke, no lift', w / 2, h - 18);\n});\n\\end{js}\n\\columnbreak\n\nPolynomials, rational functions, roots, $\\sin$, $\\cos$, $\\tan$, exponentials, and logarithms are continuous at every point of their domains. So is anything built from them by $+$, $-$, $\\times$, $\\div$, and composition.\n\n\\uncover<1->{Therefore, for such a function, taking a limit is evaluating the function. That is the licence we used on every example today.}\n\n\\uncover<1->{A function continuous on an interval has a graph you draw in one stroke. A jump forces the pencil off the paper.}\n\\end{twocol}\n\n\\slide{The Intermediate Value Theorem}\n\n\\begin{theorem}{Intermediate Value Theorem}\nIf $f$ is continuous on $[a,b]$ and $N$ lies between $f(a)$ and $f(b)$, then $f(c) = N$ for at least one $c$ in $[a,b]$\n\\end{theorem}\n\n\\begin{twocol}[3 2]\n$$\\text{\\ }$$\n\\begin{js}[size=940x620, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst XL = -0.06, XR = 1.06, YB = -1.25, YT = 1.25;\nconst L = 62, R = 26, T = 26, B = 60;\nconst PW = w - L - R, PH = h - T - B;\nconst TA = 56, PHA = 290;\nconst TB = 430, PHB = 145;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction g(x) { return x * x * x + x - 1; }\nconst BR = [[0, 1], [0, 1], [0.5, 1], [0.5, 0.75]];\nconst br = BR[Math.min(step, 3)];\nif (step >= 1) {\n  ctx.globalAlpha = 0.32; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(br[0]), T, X(br[1]) - X(br[0]), PH);\n  ctx.globalAlpha = 1;\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.stroke();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nfor (let p = 0; p <= 300; p++) {\n  const x = XL + (XR - XL) * p / 300;\n  if (p) ctx.lineTo(X(x), Y(g(x))); else ctx.moveTo(X(x), Y(g(x)));\n}\nctx.stroke();\nfunction mark(x, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(g(x)), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nmark(0, colors.red); mark(1, colors.teal);\nif (step >= 2) mark(0.5, colors.burnt);\nif (step >= 3) mark(0.75, colors.burnt);\nctx.font = '600 24px ' + FM; ctx.textAlign = 'center'; ctx.fillStyle = '#111';\nctx.fillText('g(0) = ' + MN + '1', X(0) + 62, Y(-1) - 18);\nctx.fillText('g(1) = 1', X(1) - 56, Y(1) + 30);\nctx.fillStyle = colors.burnt;\nif (step === 2) ctx.fillText('g(0.5) = ' + MN + '0.375', w / 2, h - 16);\nif (step >= 3) ctx.fillText('g(0.75) = 0.171875', w / 2, h - 16);\n\\end{js}\n\\columnbreak\n\n\\accent{Does $x^3 + x = 1$ have a solution?}\n\n\\uncover<1->{Set $g(x) = x^3 + x - 1$, continuous everywhere. Then $g(0) = -1$ and $g(1) = 1$, and $0$ lies between them, hence $g(c) = 0$ for some $c$ in $[0,1]$.}\n\n\\uncover<2->{Cutting the interval in half locates it. Since $g(0.5) = -0.375$, the sign change now sits in $[0.5, 1]$.}\n\n\\uncover<3->{Since $g(0.75) = 0.171875$, the solution is in $[0.5, 0.75]$. Repeat as long as you like.}\n\\end{twocol}\n\n\\slide{Why $x^{1/n}$ Exists}\n\n\\begin{twocol}[3 2]\n\n$$\\text{\\ }$$\n\\begin{js}[size=940x580, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst C = Math.pow(5, 1 / 4);\nconst L = 66, R = 26, PW = w - L - R;\nconst TA = 26, PHA = 250;\nconst TB = 396, PHB = 152;\nconst XL = -0.2, XR = 2.3, YB = -1.4, YT = 17.5;\nconst XL2 = -1.4, XR2 = 17.5, YB2 = -0.25, YT2 = 2.35;\nfunction XA(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction YA(v) { return TA + PHA - (v - YB) / (YT - YB) * PHA; }\nfunction XB(v) { return L + (v - XL2) / (XR2 - XL2) * PW; }\nfunction YC(v) { return TB + PHB - (v - YB2) / (YT2 - YB2) * PHB; }\nfunction g(t) { return t * t * t * t; }\nif (step >= 1) {\n  ctx.globalAlpha = 0.30; ctx.fillStyle = colors.gold;\n  ctx.fillRect(L, YA(16), PW, YA(0) - YA(16));\n  ctx.globalAlpha = 1;\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(XA(XL), YA(0)); ctx.lineTo(XA(XR), YA(0));\nctx.moveTo(XA(0), TA); ctx.lineTo(XA(0), TA + PHA);\nctx.stroke();\nif (step >= 1) {\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\n  ctx.beginPath(); ctx.moveTo(L, YA(5)); ctx.lineTo(L + PW, YA(5)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = colors.red; ctx.textAlign = 'left';\n  ctx.fillText('y = 5', L + 12, YA(5) - 14);\n}\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nfor (let p = 0; p <= 300; p++) {\n  const t = 2.3 * p / 300;\n  if (p) ctx.lineTo(XA(t), YA(g(t))); else ctx.moveTo(XA(t), YA(g(t)));\n}\nctx.stroke();\n[0, 2].forEach(function (t) {\n  ctx.beginPath(); ctx.arc(XA(t), YA(g(t)), 9, 0, 6.2832);\n  ctx.fillStyle = colors.teal; ctx.fill();\n});\nctx.font = '600 24px ' + FM; ctx.fillStyle = '#111'; ctx.textAlign = 'left';\nctx.fillText('g(0) = 0', XA(0) + 16, YA(0) - 16);\nctx.textAlign = 'right';\nctx.fillText('g(2) = 16', XA(2) - 16, YA(16) + 10);\nif (step >= 2) {\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  ctx.beginPath(); ctx.moveTo(XA(C), YA(0)); ctx.lineTo(XA(C), YA(5)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.beginPath(); ctx.arc(XA(C), YA(5), 10, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.font = '600 26px ' + FM; ctx.textAlign = 'center';\n  ctx.fillText('c = 1.49535...', XA(C), YA(0) + 34);\n}\nctx.font = '600 26px ' + FM; ctx.fillStyle = colors.teal2; ctx.textAlign = 'right';\nctx.fillText('y = t\\u2074', XA(XR) - 10, YA(13.5));\nif (step >= 3) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(XB(XL2), YC(0)); ctx.lineTo(XB(XR2), YC(0));\n  ctx.moveTo(XB(0), TB); ctx.lineTo(XB(0), TB + PHB);\n  ctx.stroke();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  for (let p = 0; p <= 400; p++) {\n    const x = 17.5 * p / 400;\n    const y = Math.pow(x, 1 / 4);\n    if (p) ctx.lineTo(XB(x), YC(y)); else ctx.moveTo(XB(x), YC(y));\n  }\n  ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  ctx.beginPath();\n  ctx.moveTo(XB(5), YC(0)); ctx.lineTo(XB(5), YC(C));\n  ctx.lineTo(XB(0), YC(C));\n  ctx.stroke(); ctx.setLineDash([]);\n  ctx.beginPath(); ctx.arc(XB(5), YC(C), 10, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n  ctx.fillText('5', XB(5), YC(0) + 30);\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = colors.teal2; ctx.textAlign = 'right';\n  ctx.fillText('y = x^(1/4)', XB(XR2) - 10, YC(0.85));\n}\n\\end{js}\n\\columnbreak\n\nIs there a number whose fourth power is $5$?\n\n\\uncover<1->{The function $g(t) = t^4$ is continuous, $g(0) = 0$, and $g(2) = 16$. Since $5$ lies between $0$ and $16$, there is a $c$ in $[0,2]$ with $c^4 = 5$. It is the only one in $[0,\\infty)$, because $t^4$ is increasing there.}\n\n\\uncover<2->{Nothing here used the exponent $4$ or the value $5$. For any $x > 0$ and any $n$, the function $t^n$ is continuous on $[0,\\infty)$, starts at $0$, and eventually passes $x$, hence $\\accent{x^{1/n}}$ exists.}\n\n\\uncover<3->{Run the argument at every height and the answers assemble into a function.}\n\\end{twocol}\n\n\\section{Limits at Infinity}\n\n\\slide{What Happens in the Long Run?}\n\n\\begin{js}[size=1680x430, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst T = 26, B = 96;\nconst PH = h - T - B;\nfunction panel(ox, pw, c) {\n  const L = 40, R = 34;\n  const PW = pw - L - R;\n  const X = function (v) { return ox + L + (v - c.x0) / (c.x1 - c.x0) * PW; };\n  const Y = function (v) { return T + PH - (v - c.yb) / (c.yt - c.yb) * PH; };\n  if (c.mark !== undefined) {\n    ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\n    ctx.beginPath();\n    ctx.moveTo(X(c.x0), Y(c.mark)); ctx.lineTo(X(c.x1), Y(c.mark));\n    ctx.stroke(); ctx.setLineDash([]);\n  }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(c.x0), Y(0)); ctx.lineTo(X(c.x1), Y(0));\n  ctx.moveTo(X(c.x0), T); ctx.lineTo(X(c.x0), T + PH);\n  ctx.stroke();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 700; p++) {\n    const x = c.x0 + (c.x1 - c.x0) * p / 700, y = c.f(x);\n    if (y < c.yb || y > c.yt) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n  ctx.font = '600 28px ' + FM; ctx.fillStyle = '#111'; ctx.textAlign = 'center';\n  ctx.fillText(c.name, ox + pw / 2, h - 52);\n  ctx.font = '600 25px ' + FM; ctx.fillStyle = c.col;\n  ctx.fillText(c.verdict, ox + pw / 2, h - 18);\n}\nconst P = [\n  { f: function (x) { return x * x; }, x0: 0, x1: 3.2, yb: -0.8, yt: 10,\n    name: 'y = x\\u00b2', verdict: 'climbs past every height', col: colors.burnt },\n  { f: function (x) { return Math.exp(-x); }, x0: 0, x1: 5.2, yb: -0.18, yt: 1.15,\n    mark: 0, name: 'y = e^(\\u2212x)', verdict: 'settles down to 0', col: colors.teal },\n  { f: function (x) { return Math.cos(x); }, x0: 0, x1: 13, yb: -1.45, yt: 1.45,\n    name: 'y = cos x', verdict: 'never settles at all', col: colors.red2 }\n];\nconst pw = w / 3;\nfor (let i = 0; i <= Math.min(step, 2); i++) panel(i * pw, pw, P[i]);\n\\end{js}\n\n\\uncover<2->{Three long-run behaviors, and so far no language for any of them. Everything we have said about limits happens \\emph{at a point}.}\n\n\\slide{Limits at Infinity}\n\nThere is no number called $\\infty$ to approach, so rename the variable instead.\n\n\\begin{definition}{Limit at infinity, horizontal asymptote}\nLet $f$ be defined for all large $x$. Put $u = 1/x$ and define\n$$\\accent{\\lim_{x \\to \\infty} f(x) = \\lim_{u \\to 0^+} f(1/u)},$$\nwhenever the limit on the right exists. For $x \\to -\\infty$ use $u \\to 0^-$. If the limit is $L$, the line $y = L$ is a \\accent{horizontal asymptote} of $f$.\n\\end{definition}\n\n\\begin{js}[size=1680x300]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -1, XR = 42, YB = 0.1, YT = 3.1;\nconst L = 96, R = 150, T = 22, B = 44;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction draw(f, col) {\n  ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  for (let p = 0; p <= 400; p++) {\n    const x = 0 + 41 * p / 400;\n    if (p) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x)));\n  }\n  ctx.stroke();\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\nctx.beginPath(); ctx.moveTo(X(XL), Y(1.5)); ctx.lineTo(X(XR), Y(1.5)); ctx.stroke();\nctx.setLineDash([]);\ndraw(function (x) { return 1.5 + 1.4 / (1 + 0.35 * x); }, colors.teal2);\ndraw(function (x) { return 1.5 - 1.05 / (1 + 0.3 * x); }, colors.blue);\nctx.font = '600 26px ' + FM; ctx.fillStyle = colors.red; ctx.textAlign = 'left';\nctx.fillText('y = L', X(XR) + 14, Y(1.5) + 9);\nctx.font = '24px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nctx.fillText('x \\u2192 \\u221e', (X(0) + X(XR)) / 2, h - 12);\n\\end{js}\n\n\\slide{A Limit at Infinity}\n\n\\begin{twocol}[3 2]\n\\begin{plot}\nf = (3x^2 - x)/(2x^2 + 5)\nf2 = 1.5\ndomain = -16:16\nrange = -0.4:2.6\nsize = 900x400\ncaption = the dashed line is the horizontal asymptote y = 1.5\n\\end{plot}\n\\columnbreak\n\n$$\\lim_{x \\to \\infty} \\frac{3x^2 - x}{2x^2+5}$$\n\n\\uncover<1->{Put $x = 1/u$ and multiply above and below by $u^2$:\n$$\\frac{3/u^2 - 1/u}{2/u^2 + 5} = \\frac{3 - u}{2 + 5u^2}.$$}\n\n\\uncover<2->{Now the quotient law applies at $u = 0$, and the limit is $3/2 = 1.5$. The same value comes out as $x \\to -\\infty$, hence $y = 1.5$ is a horizontal asymptote.}\n\\end{twocol}\n\n% these two advance the overlay for the uncovered text above\n\\pause\n\\pause\n\n\\slide{Which Function Wins?}\n\n\\begin{twocol}[1 1]\n\\begin{js}[size=800x420, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -0.3, XR = 6.4, YB = -3, YT = 42;\nconst L = 74, R = 30, T = 24, B = 54;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction plotf(f, x0, col, wid) {\n  ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 500; p++) {\n    const x = x0 + (XR - x0) * p / 500, y = f(x);\n    if (y < YB || y > YT) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\n[10, 20, 30, 40].forEach(function (v) {\n  ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke();\n});\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\n[10, 20, 30, 40].forEach(function (v) { ctx.fillText(String(v), L - 12, Y(v) + 8); });\nctx.textAlign = 'center';\n[2, 4, 6].forEach(function (v) { ctx.fillText(String(v), X(v), Y(0) + 28); });\nplotf(function (x) { return Math.log(x); }, 0.02, colors.teal3, 4);\nplotf(function (x) { return x * x; }, 0, colors.blue, 4);\nplotf(function (x) { return Math.pow(2, x); }, 0, colors.red, 4.5);\nif (step >= 1) {\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n  ctx.beginPath(); ctx.moveTo(X(4), Y(0)); ctx.lineTo(X(4), Y(16)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.beginPath(); ctx.arc(X(4), Y(16), 10, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.font = '600 24px ' + FM; ctx.fillStyle = colors.burnt; ctx.textAlign = 'right';\n  ctx.fillText('2\\u2074 = 4\\u00b2 = 16', X(4) - 16, Y(16) + 8);\n}\nctx.font = '600 26px ' + FM; ctx.textAlign = 'left';\nctx.fillStyle = colors.red; ctx.fillText('2^x', X(5.35), Y(36));\nctx.fillStyle = colors.blue; ctx.fillText('x\\u00b2', X(6.05), Y(33));\nctx.fillStyle = colors.teal3; ctx.fillText('ln x', X(5.6), Y(4.4));\n\\end{js}\n\nUp to $x = 4$ the parabola is ahead.\n\n\\uncover<1->{They tie at $16$, and after that the exponential is never caught again. The gap is not a fixed amount, it is a widening factor.}\n\\columnbreak\n\n\\uncover<1->{\\accent{Exponential beats polynomial beats logarithmic}, whatever the exponent and whatever the base:\n$$\\lim_{x \\to \\infty} \\frac{x^2}{2^x} = 0, \\qquad \\lim_{x \\to \\infty} \\frac{\\ln x}{x} = 0.$$}\n\n\\uncover<2->{The ranking is about factors, not head starts. Even $x^{100}$ loses to $1.01^x$ in the end, though you would have to look a long way out to watch it happen. Today we read this off the picture and take it on trust.}\n\\end{twocol}\n\n\\slide{Only the Leading Terms Survive}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x420, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XL = -8, XR = 205, YB = -0.04, YT = 0.62;\nconst L = 80, R = 30, T = 26, B = 58;\nconst PW = w - L - R, PH = h - T - B;\nfunction X(v) { return L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return T + PH - (v - YB) / (YT - YB) * PH; }\nfunction f(x) { return (2 * x * x * x + x - 1) / (4 * x * x * x + 100 * x * x); }\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1.5;\n[0.25, 0.5].forEach(function (v) {\n  ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke();\n});\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH);\nctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\n[0.25, 0.5].forEach(function (v) { ctx.fillText(v.toFixed(2), L - 12, Y(v) + 8); });\nctx.textAlign = 'center';\n[50, 100, 150, 200].forEach(function (v) { ctx.fillText(String(v), X(v), Y(0) + 30); });\nif (step >= 1) {\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3; ctx.setLineDash([9, 9]);\n  ctx.beginPath(); ctx.moveTo(L, Y(0.5)); ctx.lineTo(L + PW, Y(0.5)); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = colors.red; ctx.textAlign = 'right';\n  ctx.fillText('y = 0.5', L + PW, Y(0.5) - 14);\n}\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4.5; ctx.lineCap = 'round';\nctx.beginPath();\nfor (let p = 0; p <= 600; p++) {\n  const x = 0.6 + (205 - 0.6) * p / 600;\n  if (p) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x)));\n}\nctx.stroke();\nif (step >= 2) {\n  [[25, colors.blue], [100, colors.burnt]].forEach(function (q) {\n    ctx.strokeStyle = q[1]; ctx.lineWidth = 2.5; ctx.setLineDash([7, 7]);\n    ctx.beginPath(); ctx.moveTo(X(q[0]), Y(0)); ctx.lineTo(X(q[0]), Y(f(q[0]))); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.beginPath(); ctx.arc(X(q[0]), Y(f(q[0])), 9, 0, 6.2832);\n    ctx.fillStyle = q[1]; ctx.fill();\n  });\n  ctx.font = '600 24px ' + FM; ctx.textAlign = 'left';\n  ctx.fillStyle = colors.blue; ctx.fillText('0.250 at x = 25', X(25) + 14, Y(0.22));\n  ctx.fillStyle = colors.burnt; ctx.fillText('0.400 at x = 100', X(100) + 14, Y(0.37));\n}\n\\end{js}\n\\columnbreak\n\n$$\\lim_{x \\to \\infty} \\frac{2x^3+x-1}{4x^3+100x^2}$$\n\n\\uncover<1->{Put $x = 1/u$ and multiply above and below by $u^3$:\n$$\\frac{2 + u^2 - u^3}{4 + 100u} \\longrightarrow \\frac{2}{4} = 0.5 \\quad\\text{as } u \\to 0^+.$$}\n\n\\uncover<2->{Only the cubic terms survive. The $100$ is not small, and up to $x = 25$ the term $100x^2$ is the larger part of the denominator, but $x^3$ passes it there and never looks back. At $x = 100$ the quotient is still only $0.400$, which is what \"eventually\" can look like.}\n\\end{twocol}\n\n\\slide{Where We Got To}\n\n\\begin{twocol}[1 1]\n\\begin{itemize}[tight]\n\\item A limit reads a deleted neighborhood. The value at the point is separate information.\n\\item Two one-sided limits that disagree means no limit.\n\\item $\\pm\\infty$ describes growth without bound, and it names vertical asymptotes.\n\\item The limit laws turn most limits into evaluation. When they give $0/0$, do algebra first.\n\\end{itemize}\n\\columnbreak\n\\begin{itemize}[tight]\n\\item Squeeze handles what the laws cannot reach.\n\\item Trapping a value between rationals is what $x^y$ and $e$ mean.\n\\item Continuity is limit $=$ value, and the Intermediate Value Theorem is what it buys you.\n\\item Limits at infinity are limits at $0$ in disguise, and they name horizontal asymptotes.\n\\end{itemize}\n\\end{twocol}\n\n$$\\text{\\ }$$\n\n$$\\alert{\\text{First Quiz: Discussion Sections on Monday.}}$$\n\n$$\\alert{\\text{Work through Problem Sets 1--3 to prepare.}}$$";window.LECTURE_SCALE=1.2;</script><script src="lecture-engine.js"></script><script>function PLAYER() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('scale'); } catch (e) {}
    if (q && !isNaN(parseFloat(q))) window.Lecture.setScale(parseFloat(q));
    else if (window.LECTURE_SCALE) window.Lecture.setScale(window.LECTURE_SCALE);
    var parsed = window.Lecture.parse(window.LECTURE_SOURCE);
    var slides = parsed.slides, meta = parsed.meta;
    var si = 0, ctrl = null, step = 0;
    var stage = document.getElementById('stage'), slideEl = document.getElementById('slide');
    var tray = document.getElementById('tray'), bar = document.getElementById('bar');
    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    }
    addEventListener('resize', fit); fit();
    var track = document.createElement('div');
    track.title = 'Drag to scrub through the deck';
    track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ew-resize;z-index:6';
    stage.appendChild(track);
    track.addEventListener('pointerdown', function (e) {
      function pick(cx) {
        var r = track.getBoundingClientRect();
        if (!r.width) return;
        var u = Math.max(0, Math.min(0.9999, (cx - r.left) / r.width));
        var k = Math.floor(u * slides.length);
        if (k === si) return;
        si = k; step = 0; render();
      }
      function move(ev) { ev.preventDefault(); pick(ev.clientX); }
      function up() {
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        bar.style.height = '4px'; bar.style.transition = 'width .3s ease';
      }
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      bar.style.height = '10px'; bar.style.transition = 'none';
      pick(e.clientX);
    });
    function chrome() {
      var total = slides.length;
      tray.innerHTML = '<div class="nb" id="prev">&#8592;</div><div class="nb" id="next">&#8594;</div>' +
        '<div style="flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:24px;color:#125A56">' +
        (slides[si].section || meta.title || '') + '</div>' +
        '<div style="color:#999">' + (meta.copyright || '') + '</div>' +
        '<div style="color:#111">' + (si + 1) + ' / ' + total + '</div>';
      document.getElementById('prev').onclick = function () { go(-1); };
      document.getElementById('next').onclick = function () { go(1); };
      bar.style.width = ((si + 1) / total * 1920) + 'px';
    }
    function render() {
      if (ctrl) ctrl.destroy();
      ctrl = window.Lecture.mountSlide(slideEl, slides[si], meta, { readonly: true });
      ctrl.setStep(step);
      chrome();
    }
    function go(d) {
      if (d > 0) {
        if (step < slides[si].steps) { step++; ctrl.setStep(step); return; }
        if (si < slides.length - 1) { si++; step = 0; render(); }
      } else {
        if (step > 0) { step--; ctrl.setStep(step); return; }
        if (si > 0) { si--; step = slides[si].steps; render(); }
      }
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); }
      else if (e.key === 'Home') { si = 0; step = 0; render(); }
      else if (e.key === 'End') { si = slides.length - 1; step = 0; render(); }
    });
    render();
  };PLAYER();</script></body></html>
