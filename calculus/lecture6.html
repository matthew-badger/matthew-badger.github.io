<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 6: Shortcut Rules for Derivatives</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="% MATH 1131Q Calculus I -- Lecture 6\n% Shortcut rules: power/linearity -> exponentials -> products -> quotients -> combining\n\\title{Lecture 6: Shortcut Rules for Derivatives}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 21, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n\\slide{Today: Shortcut Rules}\n\\begin{twocol}[6 6]\nEvery derivative so far has come from\n$$f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}.$$\n\n\\uncover<1->{That always works, but the algebra grows quickly.}\n\n\\uncover<2->{Today we build rules that read the \\alert{structure} of a function instead.}\n\n\\uncover<3->{By the end of the lecture we will differentiate\n$$f(x)=\\frac{x^2e^x}{x+1}$$\nand find every point where its tangent line is horizontal.}\n\\columnbreak\n\\begin{js}[size=780x560, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 62, PW = w - L - R, PH = h - T - B;\nconst XL = -5.0, XR = 2.0, U = PW / (XR - XL), YB = -1.6, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return x * x * Math.exp(x) / (x + 1); }\nfunction grid() {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\n  for (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\n  for (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n  for (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 30); }\n  ctx.textAlign = 'right';\n  for (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0) - 12, Y(k) + 8); }\n}\nfunction curve(fn, col, lw, x0, x1) {\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 900; p++) {\n    const x = x0 + (x1 - x0) * p / 900, y = fn(x);\n    if (!isFinite(y) || y < YB - 1 || y > YT + 1) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke(); ctx.restore();\n}\ngrid();\nctx.save(); ctx.strokeStyle = colors.blue; ctx.lineWidth = 2; ctx.setLineDash([9, 9]);\nctx.beginPath(); ctx.moveTo(X(-1), T); ctx.lineTo(X(-1), T + PH); ctx.stroke(); ctx.restore();\ncurve(f, colors.teal2, 5, XL, -1.02);\ncurve(f, colors.teal2, 5, -0.98, XR);\n\\end{js}\n\\end{twocol}\n\n\\section{Power Functions and Linearity}\n\n\\slide{The Derivative of a Constant}\n\\begin{twocol}[5 7]\nIf $f(x)=c$, then the graph is a horizontal line.\n\n\\uncover<1->{From the definition,\n$$f'(x)=\\lim_{h\\to0}\\frac{c-c}{h}=\\lim_{h\\to0}0=0.$$}\n\n\\uncover<2->{$$\\boxed{\\frac{d}{dx}(c)=0}$$}\n\n\\uncover<3->{Every tangent line to a horizontal line is that same line.}\n\\columnbreak\n\\begin{js}[size=860x420, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 62, PW = w - L - R, PH = h - T - B;\nconst XL = -3.2, XR = 3.2, U = PW / (XR - XL), YB = -0.6, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction grid() {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\n  for (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\n  for (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n  for (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 30); }\n  ctx.textAlign = 'right';\n  for (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0) - 12, Y(k) + 8); }\n}\nfunction label(s, x, y, col, sz) {\n  ctx.save(); ctx.font = '600 ' + (sz || 24) + 'px ' + FM; ctx.textAlign = 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\ngrid();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(X(XL + 0.15), Y(2)); ctx.lineTo(X(XR - 0.15), Y(2)); ctx.stroke();\nlabel('y = 2', X(XR) - 120, Y(2) - 18, colors.teal2, 26);\nif (step >= 1) {\n  [-2, 0, 2].forEach(function (a) {\n    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11; ctx.lineCap = 'round';\n    ctx.beginPath(); ctx.moveTo(X(a - 0.7), Y(2)); ctx.lineTo(X(a + 0.7), Y(2)); ctx.stroke();\n    ctx.strokeStyle = colors.burnt; ctx.lineWidth = 6;\n    ctx.beginPath(); ctx.moveTo(X(a - 0.7), Y(2)); ctx.lineTo(X(a + 0.7), Y(2)); ctx.stroke(); ctx.restore();\n    ctx.beginPath(); ctx.arc(X(a), Y(2), 9, 0, 6.2832); ctx.fillStyle = colors.burnt; ctx.fill();\n    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  });\n}\nif (step >= 2) label('slope 0 everywhere', X(-3.0), Y(0.7), colors.burnt, 26);\n\\end{js}\n\\end{twocol}\n\n\\slide{The Power Rule}\n\\begin{twocol}[5 7]\nFor a positive integer $n$,\n$$\\boxed{\\frac{d}{dx}(x^n)=nx^{n-1}}$$\n\n\\uncover<1->{With $n=2$,\n$$\\frac{d}{dx}(x^2)=2x^{1}=2x.$$}\n\n\\uncover<2->{$$\\frac{d}{dx}(x^5)=5x^4,\\qquad \\frac{d}{dx}(x^{100})=100x^{99}.$$}\n\\columnbreak\n\\begin{js}[size=900x660, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst PAD = 40, GAP = 56, T = 56, B = 44;\nconst PW = (w - 2 * PAD - GAP) / 2, PH = h - T - B;\nconst LX = PAD, RX = PAD + PW + GAP;\nconst YB = -2.2, YT = 2.2, U = PH / (YT - YB), HX = PW / (2 * U);\nfunction X(v, ox) { return ox + PW / 2 + v * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction panel(ox, title, col) {\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\n  for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(X(k, ox), T); ctx.lineTo(X(k, ox), T + PH); ctx.stroke(); }\n  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(ox, Y(k)); ctx.lineTo(ox + PW, Y(k)); ctx.stroke(); }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(ox, Y(0)); ctx.lineTo(ox + PW, Y(0)); ctx.moveTo(X(0, ox), T); ctx.lineTo(X(0, ox), T + PH); ctx.stroke();\n  ctx.font = '600 27px ' + FM; ctx.fillStyle = col; ctx.textAlign = 'center';\n  ctx.fillText(title, ox + PW / 2, 34);\n  ctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899';\n  [-1, 1].forEach(function (k) { ctx.fillText(k < 0 ? MN + '1' : '1', X(k, ox), Y(0) + 28); });\n  ctx.textAlign = 'right';\n  [-2, -1, 1, 2].forEach(function (k) { ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0, ox) - 10, Y(k) + 7); });\n}\nfunction curve(ox, fn, col) {\n  ctx.save(); ctx.beginPath(); ctx.rect(ox, T, PW, PH); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\n  for (let p = 0; p <= 600; p++) {\n    const x = -HX + 2 * HX * p / 600;\n    if (p === 0) ctx.moveTo(X(x, ox), Y(fn(x))); else ctx.lineTo(X(x, ox), Y(fn(x)));\n  }\n  ctx.stroke(); ctx.restore();\n}\npanel(LX, 'f(x) = x\\u00b2', colors.teal2);\npanel(RX, 'f\\u2032(x) = 2x', colors.burnt);\ncurve(LX, function (x) { return x * x; }, colors.teal2);\ncurve(RX, function (x) { return 2 * x; }, colors.burnt);\n\\end{js}\n\\end{twocol}\n\n\\slide{Proof of the Power Rule: A Factoring Identity}\nWhen $n=3$,\n\\begin{align}\n(x-a)(x^2+xa+a^2)\n&=x^3+\\textcolor{#F57634}{x^2a}+\\textcolor{#00767B}{xa^2}-\\textcolor{#F57634}{x^2a}-\\textcolor{#00767B}{xa^2}-a^3 \\\\\n\\pause\n&=x^3-a^3.\n\\end{align}\n\\pause\nThe same cancellation gives, for every positive integer $n$,\n$$\nx^n-a^n=(x-a)\\left(x^{n-1}+x^{n-2}a+\\cdots+xa^{n-2}+a^{n-1}\\right).\n$$\n\n\\slide{Proof of the Power Rule}\nLet $f(x)=x^n$. Divide the identity by $x-a$ for $x\\neq a$:\n\\begin{align}\nf'(a)&=\\lim_{x\\to a}\\frac{x^n-a^n}{x-a}\\\\\n\\pause\n&=\\lim_{x\\to a}\\left(x^{n-1}+x^{n-2}a+\\cdots+xa^{n-2}+a^{n-1}\\right)\\\\\n\\pause\n&=\\underbrace{a^{n-1}+a^{n-1}+\\cdots+a^{n-1}}_{n\\text{ terms}}=na^{n-1}.\n\\end{align}\n$$\\boxed{\\frac{d}{dx}(x^n)=nx^{n-1}}$$\n\\slide{The Power Rule for Other Exponents}\n\\begin{twocol}[5 7]\nThe same formula holds for every real exponent $r$, wherever $x^r$ and $x^{r-1}$ are defined:\n$$\\boxed{\\frac{d}{dx}(x^r)=rx^{r-1}}$$\n\nThe proof waits until we have logarithms. Use the rule today.\n\n\\uncover<1->{Since $1/x^2=x^{-2}$,\n$$ (x^{-2})'=-2x^{-3}=-\\frac{2}{x^3}. $$}\n\n\\uncover<2->{Since $\\sqrt{x}=x^{1/2}$,\n$$ (x^{1/2})'=\\frac12x^{-1/2}=\\frac{1}{2\\sqrt{x}}. $$}\n\\columnbreak\n\\begin{js}[size=900x720, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst U = 150, LM = 96;\nfunction label(s, x, y, col, sz, al) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = al || 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction panel(oy, x0, x1, y0, y1, title, fn, col, tangents) {\n  const L = LM, T = oy + 40, PW = (x1 - x0) * U, PH = (y1 - y0) * U;\n  function X(v) { return L + (v - x0) * U; }\n  function Y(v) { return T + PH - (v - y0) * U; }\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0); k <= x1; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\n  for (let k = Math.ceil(y0); k <= y1; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\n  ctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n  for (let k = Math.ceil(x0); k <= x1; k++) { if (k !== 0) ctx.fillText(String(k), X(k), Y(0) + 26); }\n  ctx.textAlign = 'right';\n  for (let k = Math.ceil(y0); k <= y1; k++) { if (k !== 0) ctx.fillText(String(k), X(0) - 10, Y(k) + 8); }\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 700; p++) {\n    const x = x0 + (x1 - x0) * p / 700, y = fn(x);\n    if (!isFinite(y) || y < y0 - 1 || y > y1 + 1) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke();\n  tangents.forEach(function (t) {\n    const a = t[0], m = t[1], ya = fn(a), dx = t[2];\n    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11;\n    ctx.beginPath(); ctx.moveTo(X(a - dx), Y(ya - m * dx)); ctx.lineTo(X(a + dx), Y(ya + m * dx)); ctx.stroke();\n    ctx.strokeStyle = t[3]; ctx.lineWidth = 6;\n    ctx.beginPath(); ctx.moveTo(X(a - dx), Y(ya - m * dx)); ctx.lineTo(X(a + dx), Y(ya + m * dx)); ctx.stroke();\n  });\n  ctx.restore();\n  tangents.forEach(function (t) {\n    const a = t[0], ya = fn(a);\n    ctx.beginPath(); ctx.arc(X(a), Y(ya), 9, 0, 6.2832); ctx.fillStyle = t[3]; ctx.fill();\n    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n    label(t[4], X(t[5]), Y(t[6]), t[3], 23);\n  });\n  label(title, L + 8, oy + 28, col, 25);\n}\nctx.clearRect(0, 0, w, h);\nif (step < 1) {\n  label('Negative and fractional powers', LM, h / 2 - 6, '#6f7f80', 25);\n  label('use the same power rule.', LM, h / 2 + 36, '#6f7f80', 25);\n}\nif (step >= 1) {\n  panel(16, 0, 4.2, -0.1, 1.25, 'y = 1/x\\u00b2', function (x) { return 1 / (x * x); }, colors.teal2,\n    [[2, -0.25, 1.5, colors.burnt, 'slope ' + MN + '1/4 at x = 2', 2.2, 0.55]]);\n}\nif (step >= 2) {\n  panel(300, -0.2, 4.8, -0.2, 2.2, 'y = \\u221ax', function (x) { return Math.sqrt(x); }, colors.teal2,\n    [[1, 0.5, 1.2, colors.burnt, 'slope 1/2', 1.2, 0.55], [4, 0.25, 1.4, colors.red, 'slope 1/4', 2.75, 2.02]]);\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{Constant Multiples and Sums}\n\\begin{twocol}[5 7]\nIf $c$ is a constant, then\n$$\\boxed{\\frac{d}{dx}\\big(cf(x)\\big)=cf'(x)}$$\n\nFor example,\n$$\\frac{d}{dx}(7x^5)=7\\cdot 5x^4=35x^4.$$ \n\nStretching a graph vertically by $c$ multiplies every slope by $c$.\n\\columnbreak\nAddition and subtraction have separate rules:\n\n$$\\text{Addition}\\qquad\\qquad\\text{Subtraction}$$\n\n$$\\boxed{(f+g)'=f'+g'}\\qquad\\boxed{(f-g)'=f'-g'}$$\n\nTogether with the power rule, these let us differentiate a polynomial one term at a time.\n\\end{twocol}\n\n\\slide{Example 1: Differentiate a Polynomial}\n\\begin{twocol}[7 5]\nProblem:\n\\only<0>{$$\\text{Differentiate } f(x)=x^4-3x^2+2.$$}\\only<1->{$$\\text{Differentiate } f(x)=\\textcolor{#00767B}{x^4}-3\\textcolor{#F57634}{x^2}+\\textcolor{#6A4C93}{2}.$$}\n\n\\uncover<1->{The expression is a sum of three terms. The functions we differentiate are in color, and $-3$ is a constant multiplier:\n$$\n\\textcolor{#00767B}{x^4},\\qquad -3\\textcolor{#F57634}{x^2},\\qquad \\textcolor{#6A4C93}{2}.\n$$}\n\n\\uncover<1->{We differentiate each term separately and then add the results.}\n\\columnbreak\n\\begin{js}[size=620x520, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 72, R = 26, T = 24, B = 50, PW = w - L - R, PH = h - T - B;\nconst XL = -2.3, XR = 2.3, U = PW / (XR - XL), YB = -0.7, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return x * x * x * x - 3 * x * x + 2; }\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\nfor (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '20px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nfor (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 26); }\nctx.textAlign = 'right';\nfor (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(String(k), X(0) - 10, Y(k) + 7); }\nctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 700; p++) {\n  const x = XL + (XR - XL) * p / 700, y = f(x);\n  if (y < YB - 1 || y > YT + 1) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke(); ctx.restore();\nctx.save(); ctx.font = '600 23px ' + FM; ctx.textAlign = 'center';\nctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText('y = x\\u2074 ' + MN + ' 3x\\u00b2 + 2', X(0), Y(2.75));\nctx.fillStyle = colors.teal2; ctx.fillText('y = x\\u2074 ' + MN + ' 3x\\u00b2 + 2', X(0), Y(2.75)); ctx.restore();\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 1: Work Term by Term}\nStart with\n$$\nf(x)=\\textcolor{#00767B}{x^4}-3\\textcolor{#F57634}{x^2}+\\textcolor{#6A4C93}{2}.\n$$\n\nDifferentiate one term at a time, keeping the constant multiplier:\n$$\nf'(x)=\\textcolor{#00767B}{(x^4)'}-3\\textcolor{#F57634}{(x^2)'}+\\textcolor{#6A4C93}{(2)'}\n$$\n\\pause\n$$\nf'(x)=\\textcolor{#00767B}{4x^3}-3\\textcolor{#F57634}{(2x)}+\\textcolor{#6A4C93}{0}\n$$\n\\pause\n$$\n\\boxed{f'(x)=4x^3-6x}\n$$\n\n\\slide{You Try: A Polynomial}\n\\begin{twocol}[7 5]\nDifferentiate\n$$\np(x)=2x^5-4x^3-9.\n$$\n\\columnbreak\n\\begin{note}\nDifferentiate one term at a time.\n\\end{note}\n\\end{twocol}\n\\begin{js}[size=1500x150]\nconst T0 = 60;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst BW = 960, BH = 16, BX = (w - BW) / 2, BY = 122;\nfunction draw(left) {\n  ctx.clearRect(0, 0, w, h);\n  const shown = Math.ceil(Math.max(0, left));\n  const mm = Math.floor(shown / 60), ss = shown - 60 * mm;\n  const col = left <= 10 ? colors.red : (left <= 30 ? colors.orange : colors.teal2);\n  ctx.font = '600 84px ' + FM;\n  ctx.textAlign = 'center'; ctx.fillStyle = col;\n  ctx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, w / 2, 86);\n  ctx.fillStyle = '#E8EFEF'; ctx.fillRect(BX, BY, BW, BH);\n  ctx.fillStyle = col; ctx.fillRect(BX, BY, BW * Math.max(0, left) / T0, BH);\n}\ndraw(T0); onFrame(t => draw(T0 - t));\n\\end{js}\n\n\\slide{You Try: A Polynomial, Solution}\nOne term at a time:\n$$\np'(x)=2(5x^4)-4(3x^2)-0.\n$$\n\\pause\nTherefore,\n$$\n\\boxed{p'(x)=10x^4-12x^2}.\n$$\n\n\\slide{You Try: Rewrite Powers}\n\\begin{twocol}[7 5]\nDifferentiate\n$$\ng(x)=5x^{3/2}-\\frac{4}{x}+7\\sqrt{x}.\n$$\n\\columnbreak\n\\begin{note}\nRewrite every term as a power of $x$ before you differentiate.\n\\end{note}\n\\end{twocol}\n\\begin{js}[size=1500x150]\nconst T0 = 90;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst BW = 960, BH = 16, BX = (w - BW) / 2, BY = 122;\nfunction draw(left) {\n  ctx.clearRect(0, 0, w, h);\n  const shown = Math.ceil(Math.max(0, left));\n  const mm = Math.floor(shown / 60), ss = shown - 60 * mm;\n  const col = left <= 10 ? colors.red : (left <= 30 ? colors.orange : colors.teal2);\n  ctx.font = '600 84px ' + FM;\n  ctx.textAlign = 'center'; ctx.fillStyle = col;\n  ctx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, w / 2, 86);\n  ctx.fillStyle = '#E8EFEF'; ctx.fillRect(BX, BY, BW, BH);\n  ctx.fillStyle = col; ctx.fillRect(BX, BY, BW * Math.max(0, left) / T0, BH);\n}\ndraw(T0); onFrame(t => draw(T0 - t));\n\\end{js}\n\n\\slide{You Try: Rewrite Powers, Solution}\nFirst rewrite\n$$\ng(x)=5x^{3/2}-4x^{-1}+7x^{1/2}.\n$$\n\\pause\nNow use the power rule term by term:\n$$\ng'(x)=5\\cdot\\frac32x^{1/2}-4(-1)x^{-2}+7\\cdot\\frac12x^{-1/2}.\n$$\n\\pause\nTherefore,\n$$\n\\boxed{g'(x)=\\frac{15}{2}x^{1/2}+4x^{-2}+\\frac72x^{-1/2}}.\n$$\n\n\\section{Exponential Functions}\n\n\\slide{The Slope of $b^x$ at $x=0$}\n\\begin{twocol}[5 7]\nThe power rule covers $x^5$, $x^{-2}$, and $x^{1/2}$. In an exponential function\n$$b^x$$\nthe variable sits in the exponent instead, so the power rule does not apply.\n\n\\uncover<1->{Every graph $y=b^x$ passes through $(0,1)$, and the slope there depends on the base.}\n\n\\uncover<2->{The base whose slope at $0$ is $1$ turns out to be exactly the number from Lecture 3:\n$$e=\\lim_{x\\to0^+}(1+x)^{1/x}=2.71828\\ldots$$}\n\\columnbreak\n\\begin{js}[size=900x640, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 150, PW = w - L - R, PH = h - T - B;\nconst XL = -2.2, XR = 2.2, U = PW / (XR - XL), YB = -0.3, YT = YB + PH / U;\nconst BMIN = 1.2, BMAX = 4.0, SX = 130, SW = w - 260, SY = h - 62;\nconst PRESET = [2, 3, Math.E];\nif (canvas.dataset.bstep !== String(step)) {\n  canvas.dataset.bstep = String(step);\n  canvas.dataset.bval = String(PRESET[Math.min(step, PRESET.length - 1)]);\n}\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction trunc3(v) { return (Math.floor(v * 1000) / 1000).toFixed(3); }\nfunction label(s, x, y, col, sz, al) {\n  ctx.save(); ctx.font = '600 ' + (sz || 24) + 'px ' + FM; ctx.textAlign = al || 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction draw() {\n  const b = parseFloat(canvas.dataset.bval);\n  const m = Math.log(b);\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\n  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\n  for (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\n  ctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\n  for (let k = -2; k <= 2; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 30); }\n  ctx.textAlign = 'right';\n  for (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(String(k), X(0) - 12, Y(k) + 8); }\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  if (step >= 2) {\n    ctx.strokeStyle = '#9aa7a8'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);\n    ctx.beginPath(); ctx.moveTo(X(XL), Y(1 + XL)); ctx.lineTo(X(XR), Y(1 + XR)); ctx.stroke(); ctx.setLineDash([]);\n  }\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\n  for (let p = 0; p <= 700; p++) {\n    const x = XL + (XR - XL) * p / 700, y = Math.pow(b, x);\n    if (p === 0) ctx.moveTo(X(x), Y(y)); else ctx.lineTo(X(x), Y(y));\n  }\n  ctx.stroke();\n  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11;\n  ctx.beginPath(); ctx.moveTo(X(-1.3), Y(1 - 1.3 * m)); ctx.lineTo(X(1.3), Y(1 + 1.3 * m)); ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 6;\n  ctx.beginPath(); ctx.moveTo(X(-1.3), Y(1 - 1.3 * m)); ctx.lineTo(X(1.3), Y(1 + 1.3 * m)); ctx.stroke();\n  ctx.restore();\n  ctx.beginPath(); ctx.arc(X(0), Y(1), 10, 0, 6.2832); ctx.fillStyle = colors.teal; ctx.fill();\n  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  if (step >= 2) label('slope 1', X(1.0), Y(2.25), '#7c8a8b', 23);\n  const near = Math.abs(b - Math.E) < 0.02;\n  let btxt;\n  if (near) btxt = 'b = e = 2.718\\u2026';\n  else if (Math.abs(b - 2) < 0.02) btxt = 'b = 2';\n  else if (Math.abs(b - 3) < 0.02) btxt = 'b = 3';\n  else btxt = 'b = ' + trunc3(b) + '\\u2026';\n  label(btxt, L + 14, T + 34, colors.teal2, 26);\n  label('slope at 0 \\u2248 ' + trunc3(m) + '\\u2026', L + 14, T + 70, colors.burnt, 26);\n  ctx.strokeStyle = '#d8e2e3'; ctx.lineWidth = 10; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(SX, SY); ctx.lineTo(SX + SW, SY); ctx.stroke();\n  ctx.strokeStyle = colors.teal3; ctx.beginPath(); ctx.moveTo(SX, SY);\n  ctx.lineTo(SX + SW * (b - BMIN) / (BMAX - BMIN), SY); ctx.stroke(); ctx.lineCap = 'butt';\n  ctx.beginPath(); ctx.arc(SX + SW * (b - BMIN) / (BMAX - BMIN), SY, 17, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  label('drag to change the base b', w / 2, SY - 36, '#7c8a8b', 23, 'center');\n}\nfunction setFromPointer(ev) {\n  const r = canvas.getBoundingClientRect();\n  const x = (ev.clientX - r.left) * (w / r.width);\n  let u = (x - SX) / SW;\n  u = u < 0 ? 0 : (u > 1 ? 1 : u);\n  let b = BMIN + u * (BMAX - BMIN);\n  if (Math.abs(b - Math.E) < 0.06) b = Math.E;\n  canvas.dataset.bval = String(b);\n  draw();\n}\nlet dragging = false;\ncanvas.onpointerdown = function (ev) { dragging = true; canvas.setPointerCapture(ev.pointerId); setFromPointer(ev); };\ncanvas.onpointermove = function (ev) { if (dragging) setFromPointer(ev); };\ncanvas.onpointerup = function () { dragging = false; };\ncanvas.onpointercancel = function () { dragging = false; };\ndraw();\n\\end{js}\n\\end{twocol}\n\n\\slide{Differentiating $b^x$}\nLet $f(x)=b^x$. Then\n\\begin{align}\nf'(x)&=\\lim_{h\\to0}\\frac{b^{x+h}-b^x}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{b^xb^h-b^x}{h}\\\\\n\\pause\n&=b^x\\lim_{h\\to0}\\frac{b^h-1}{h}.\n\\end{align}\nThe limit left over is the slope of $y=b^x$ at $x=0$. Each base carries its own multiplier.\n\n\\slide{The Derivative of $e^x$}\nFor the base $e$, the leftover limit equals $1$:\n$$\\lim_{h\\to0}\\frac{e^h-1}{h}=1.$$\n\\pause\nThis is the form of the Lecture 3 definition of $e$ that we need today. We prove the equivalence after logarithms.\n\\pause\n$$\\frac{d}{dx}(e^x)=e^x\\cdot1=\\boxed{e^x}$$\nAt every point, the slope of $y=e^x$ equals the height of the graph.\n\n\\slide{Example 2: A Polynomial Plus an Exponential}\nDifferentiate\n$$f(x)=4x^3-7x+5e^x.$$\n\\pause\nThe functions we differentiate are $\\textcolor{#00767B}{x^3}$, $\\textcolor{#F57634}{x}$, and $\\textcolor{#6A4C93}{e^x}$. The numbers $4$, $7$, and $5$ are constant multipliers:\n$$f(x)=4\\textcolor{#00767B}{x^3}-7\\textcolor{#F57634}{x}+5\\textcolor{#6A4C93}{e^x}.$$\n\\pause\nDifferentiate one term at a time, keeping each multiplier:\n$$f'(x)=4\\textcolor{#00767B}{(x^3)'}-7\\textcolor{#F57634}{(x)'}+5\\textcolor{#6A4C93}{(e^x)'}$$\n\\pause\n$$f'(x)=4\\textcolor{#00767B}{(3x^2)}-7\\textcolor{#F57634}{(1)}+5\\textcolor{#6A4C93}{(e^x)}$$\n\\pause\n$$\\boxed{f'(x)=12x^2-7+5e^x}$$\n\n\\slide{Example 2: The Tangent Line at $x=0$}\n\\begin{twocol}[5 7]\nWe found\n$$f'(x)=12x^2-7+5e^x.$$\n\n\\uncover<1->{At $x=0$,\n$$f'(0)=0-7+5=-2.$$}\n\n\\uncover<2->{The point on the graph is\n$$f(0)=0-0+5=5.$$}\n\n\\uncover<3->{The tangent line is\n$$\\boxed{y=5-2x}.$$}\n\\columnbreak\n\\begin{js}[size=860x560, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 62, PW = w - L - R, PH = h - T - B;\nconst XL = -2.4, XR = 2.4, U = PW / (XR - XL), YB = 3.4, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return 4 * x * x * x - 7 * x + 5 * Math.exp(x); }\nfunction label(s, x, y, col, sz) {\n  ctx.save(); ctx.font = '600 ' + (sz || 24) + 'px ' + FM; ctx.textAlign = 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\nfor (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, T + PH); ctx.lineTo(L + PW, T + PH); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nfor (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), T + PH + 30); }\nctx.textAlign = 'right';\nfor (let k = Math.ceil(YB); k <= YT; k++) ctx.fillText(String(k), X(0) - 12, Y(k) + 8);\nctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 900; p++) {\n  const x = XL + (XR - XL) * p / 900, y = f(x);\n  if (y < YB - 1 || y > YT + 1) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke();\nif (step >= 3) {\n  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(-1.2), Y(7.4)); ctx.lineTo(X(1.2), Y(2.6)); ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 6;\n  ctx.beginPath(); ctx.moveTo(X(-1.2), Y(7.4)); ctx.lineTo(X(1.2), Y(2.6)); ctx.stroke();\n}\nctx.restore();\nif (step >= 3) {\n  ctx.beginPath(); ctx.arc(X(0), Y(5), 9, 0, 6.2832); ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  label('slope ' + MN + '2 at (0, 5)', X(0.25), Y(5.5), colors.burnt, 24);\n}\n\\end{js}\n\\end{twocol}\n\n\\section{Products}\n\n\\slide{The Product Rule: A Picture}\n\\begin{twocol}[5 7]\nA rectangle has length $L(t)$ and width $W(t)$, so its area is\n$$A(t)=L(t)W(t).$$\n\n\\uncover<1->{Increase $t$ by a small amount. The new area adds two strips and a corner.}\n\n\\uncover<2->{$$\\Delta A=W\\,\\Delta L+L\\,\\Delta W+\\Delta L\\,\\Delta W$$}\n\n\\uncover<4->{As the change shrinks, the corner becomes negligible compared with the strips. What survives is\n$$\\boxed{A'=L'W+LW'}$$}\n\\columnbreak\n\\begin{js}[size=880x640, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst X0 = 104, YB = h - 168;\nconst L0 = 325, W0 = 215;\nconst DMIN = 0, DMAX = 1.00, SX = 130, SW = w - 260, SY = h - 58;\nconst PRESET = [0, 1.00, 0.55, 0.25, 0.08];\nif (canvas.dataset.dstep !== String(step)) {\n  canvas.dataset.dstep = String(step);\n  canvas.dataset.dval = String(PRESET[Math.min(step, PRESET.length - 1)]);\n}\nfunction label(s, x, y, col, sz, al) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = al || 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction draw() {\n  const u = parseFloat(canvas.dataset.dval);\n  const dL = 130 * u, dW = 90 * u, grown = u > 0.001;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = '#dcebec'; ctx.fillRect(X0, YB - W0, L0, W0);\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4; ctx.strokeRect(X0, YB - W0, L0, W0);\n  if (grown) {\n    ctx.fillStyle = 'rgba(245,118,52,.34)'; ctx.fillRect(X0 + L0, YB - W0, dL, W0);\n    ctx.strokeStyle = colors.burnt; ctx.lineWidth = 3; ctx.strokeRect(X0 + L0, YB - W0, dL, W0);\n    ctx.fillStyle = 'rgba(66,167,198,.34)'; ctx.fillRect(X0, YB - W0 - dW, L0, dW);\n    ctx.strokeStyle = colors.blue; ctx.lineWidth = 3; ctx.strokeRect(X0, YB - W0 - dW, L0, dW);\n    ctx.fillStyle = 'rgba(120,120,120,.30)'; ctx.fillRect(X0 + L0, YB - W0 - dW, dL, dW);\n    ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 2; ctx.strokeRect(X0 + L0, YB - W0 - dW, dL, dW);\n  }\n  label('A = LW', X0 + L0 / 2, YB - W0 / 2 + 8, colors.teal, 26, 'center');\n  if (dL > 34) label('W \\u0394L', X0 + L0 + dL / 2, YB - W0 / 2 + 8, colors.burnt, 22, 'center');\n  if (dW > 30) label('L \\u0394W', X0 + L0 / 2, YB - W0 - dW / 2 + 8, colors.blue, 22, 'center');\n  if (dL > 52 && dW > 34) label('corner', X0 + L0 + dL / 2, YB - W0 - dW / 2 + 8, '#666', 19, 'center');\n  ctx.font = '23px ' + FM; ctx.fillStyle = '#6c7a7b'; ctx.textAlign = 'center';\n  ctx.fillText('L', X0 + L0 / 2, YB + 34);\n  if (dL > 20) ctx.fillText('\\u0394L', X0 + L0 + dL / 2, YB + 34);\n  ctx.save(); ctx.translate(X0 - 30, YB - W0 / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('W', 0, 0); ctx.restore();\n  ctx.save(); ctx.translate(X0 - 30, YB - W0 - dW / 2); ctx.rotate(-Math.PI / 2); if (dW > 20) ctx.fillText('\\u0394W', 0, 0); ctx.restore();\n  if (step >= 4) {\n    label('as the change shrinks,', 470, 64, '#4a5a5b', 23, 'left');\n    label('the corner disappears first', 470, 96, '#4a5a5b', 23, 'left');\n  }\n  ctx.strokeStyle = '#d8e2e3'; ctx.lineWidth = 10; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(SX, SY); ctx.lineTo(SX + SW, SY); ctx.stroke();\n  ctx.strokeStyle = colors.teal3; ctx.beginPath(); ctx.moveTo(SX, SY);\n  ctx.lineTo(SX + SW * (u - DMIN) / (DMAX - DMIN), SY); ctx.stroke(); ctx.lineCap = 'butt';\n  ctx.beginPath(); ctx.arc(SX + SW * (u - DMIN) / (DMAX - DMIN), SY, 17, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  label('drag to change the size of the increase', w / 2, SY - 34, '#7c8a8b', 23, 'center');\n}\nfunction setFromPointer(ev) {\n  const r = canvas.getBoundingClientRect();\n  const x = (ev.clientX - r.left) * (w / r.width);\n  let u = (x - SX) / SW;\n  u = u < 0 ? 0 : (u > 1 ? 1 : u);\n  canvas.dataset.dval = String(DMIN + u * (DMAX - DMIN));\n  draw();\n}\nlet dragging = false;\ncanvas.onpointerdown = function (ev) { dragging = true; canvas.setPointerCapture(ev.pointerId); setFromPointer(ev); };\ncanvas.onpointermove = function (ev) { if (dragging) setFromPointer(ev); };\ncanvas.onpointerup = function () { dragging = false; };\ncanvas.onpointercancel = function () { dragging = false; };\ndraw();\n\\end{js}\n\\end{twocol}\n\n\\slide{Proof of the Product Rule: Set Up}\nLet\n$$\nF(x)=f(x)g(x).\n$$\n\nStart from the definition:\n$$\nF'(x)=\\lim_{h\\to0}\\frac{f(x+h)g(x+h)-f(x)g(x)}{h}.\n$$\n\\pause\nWe want to separate the change in $f$ from the change in $g$.\n\\pause\nAdd and subtract the same middle term:\n$$\n\\textcolor{#F57634}{f(x)g(x+h)}.\n$$\n\n\\slide{Proof of the Product Rule: Separate the Changes}\nAfter adding and subtracting $\\textcolor{#F57634}{f(x)g(x+h)}$, the numerator is\n$$\nf(x+h)g(x+h)\\textcolor{#F57634}{{}-f(x)g(x+h)}\\textcolor{#F57634}{{}+f(x)g(x+h)}-f(x)g(x).\n$$\n\\pause\nThe first two terms share $\\textcolor{#00767B}{g(x+h)}$. The last two share $\\textcolor{#6A4C93}{f(x)}$:\n$$\nf(x+h)\\textcolor{#00767B}{g(x+h)}-f(x)\\textcolor{#00767B}{g(x+h)}+\\textcolor{#6A4C93}{f(x)}g(x+h)-\\textcolor{#6A4C93}{f(x)}g(x).\n$$\n\\pause\nFactor each pair:\n$$\n\\big(f(x+h)-f(x)\\big)\\textcolor{#00767B}{g(x+h)}+\\textcolor{#6A4C93}{f(x)}\\big(g(x+h)-g(x)\\big).\n$$\n\n\\slide{Proof of the Product Rule: Take the Limit}\nUsing the previous slide,\n$$\nF'(x)=\\lim_{h\\to0}\\left[\\frac{f(x+h)-f(x)}{h}g(x+h)+f(x)\\frac{g(x+h)-g(x)}{h}\\right].\n$$\n\\pause\nAs $h\\to0$,\n$$\n\\frac{f(x+h)-f(x)}{h}\\to f'(x),\n\\qquad\n\\frac{g(x+h)-g(x)}{h}\\to g'(x),\n$$\n$$\ng(x+h)\\to g(x).\n$$\n\\pause\nTherefore,\n$$\n\\boxed{(fg)'=f'g+fg'}.\n$$\n\n\\slide{Example 3: Differentiate $x^3e^x$}\nFind $f'(x)$ if\n$$\nf(x)=x^3e^x.\n$$\n\\pause\nThis is a product. The two factors are\n$$\n\\textcolor{#00767B}{x^3}\\qquad\\text{and}\\qquad \\textcolor{#F57634}{e^x}.\n$$\n\\pause\nUse the product rule:\n$$\nf'(x)=\\textcolor{#00767B}{(x^3)'}\\textcolor{#F57634}{e^x}+\\textcolor{#00767B}{x^3}\\textcolor{#F57634}{(e^x)'}\n$$\n\\pause\n$$\nf'(x)=\\textcolor{#00767B}{(3x^2)}\\textcolor{#F57634}{e^x}+\\textcolor{#00767B}{x^3}\\textcolor{#F57634}{e^x}\n$$\n\\pause\nFactor the answer:\n$$\n\\boxed{f'(x)=x^2e^x(x+3)}.\n$$\n\n\\slide{Example 3: Horizontal Tangents}\n\\begin{twocol}[5 7]\nFor\n$$\nf(x)=x^3e^x,\n$$\nwe found\n$$\nf'(x)=x^2e^x(x+3).\n$$\n\n\\begin{note}\nWhere does the graph have a horizontal tangent?\n\\end{note}\n\n\\uncover<1->{Since $e^x>0$, the derivative is zero exactly when $x^2(x+3)=0$:\n$$\nx=0\\qquad\\text{or}\\qquad x=-3.\n$$}\n\n\\columnbreak\n\\begin{js}[size=860x560, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 62, PW = w - L - R, PH = h - T - B;\nconst XL = -4.8, XR = 1.0, U = PW / (XR - XL), YB = -1.95, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return x * x * x * Math.exp(x); }\nfunction label(s, x, y, col, sz) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction flat(a) {\n  const y = f(a), dx = 0.85;\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip(); ctx.lineCap = 'round';\n  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11;\n  ctx.beginPath(); ctx.moveTo(X(a - dx), Y(y)); ctx.lineTo(X(a + dx), Y(y)); ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 6;\n  ctx.beginPath(); ctx.moveTo(X(a - dx), Y(y)); ctx.lineTo(X(a + dx), Y(y)); ctx.stroke(); ctx.restore();\n  ctx.beginPath(); ctx.arc(X(a), Y(y), 9, 0, 6.2832); ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\nfor (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '22px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nfor (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 30); }\nctx.textAlign = 'right';\nfor (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0) - 12, Y(k) + 8); }\nctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 900; p++) {\n  const x = XL + (XR - XL) * p / 900, y = f(x);\n  if (y < YB - 1 || y > YT + 1) { pen = false; continue; }\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke(); ctx.restore();\nlabel('y = x\\u00b3e\\u02e3', X(-1.5), Y(1.2), colors.teal2, 25);\nif (step >= 2) {\n  flat(-3); flat(0);\n  label('x = ' + MN + '3', X(-3.6), Y(-1.62), colors.burnt, 23);\n  label('x = 0', X(0.1), Y(0.42), colors.burnt, 23);\n}\n\\end{js}\n\\end{twocol}\n\n\n\n\\slide{Example 4: Electrical Power}\n\\begin{twocol}[7 5]\nElectrical power is\n$$\nP=VI,\n$$\nwhere $V$ is voltage in volts and $I$ is current in amps. Power is measured in watts, and one watt is one volt times one amp.\n\nAt one instant,\n$$\nV=5\\text{ V},\\qquad I=4\\text{ A},\n$$\n$$\nV'=-1\\text{ V/s},\\qquad I'=3\\text{ A/s}.\n$$\n\n\\begin{note}\nHow fast is the electrical power changing at that instant?\n\\end{note}\n\\columnbreak\n\\begin{js}[size=640x380]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst UNIT = 50, X0 = 110, YB = h - 70;\nfunction label(s, x, y, col, sz, al) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = al || 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nconst vw = 5 * UNIT, ih = 4 * UNIT;\nctx.fillStyle = '#dcebec'; ctx.fillRect(X0, YB - ih, vw, ih);\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4; ctx.strokeRect(X0, YB - ih, vw, ih);\nlabel('P = VI', X0 + vw / 2, YB - ih / 2 - 10, colors.teal, 28, 'center');\nlabel('= 20 watts', X0 + vw / 2, YB - ih / 2 + 28, colors.teal, 24, 'center');\nctx.font = '22px ' + FM; ctx.fillStyle = '#6c7a7b'; ctx.textAlign = 'center';\nctx.fillText('V = 5 volts', X0 + vw / 2, YB + 34);\nctx.save(); ctx.translate(X0 - 32, YB - ih / 2); ctx.rotate(-Math.PI / 2);\nctx.fillText('I = 4 amps', 0, 0); ctx.restore();\nlabel('V\\u2032 = \\u22121 V/s', X0 + vw + 36, YB - ih + 48, colors.red, 23);\nlabel('I\\u2032 = 3 A/s', X0 + vw + 36, YB - ih + 88, colors.blue, 23);\n\\end{js}\n\n$\\textcolor{#8b9899}{1\\text{ W}=1\\text{ V}\\cdot1\\text{ A}=1\\text{ kg}\\cdot\\text{m}^2/\\text{s}^3}$\n\n$\\textcolor{#8b9899}{1\\text{ V}=1\\text{ kg}\\cdot\\text{m}^2/(\\text{A}\\cdot\\text{s}^3)}$\n\n$\\textcolor{#8b9899}{\\text{The amp (A) is itself an SI base unit.}}$\n\\end{twocol}\n\n\\slide{Example 4: Compute the Rate of Change}\n\\begin{twocol}[5 7]\nAt the instant in question,\n$$\nV=5,\\quad I=4,\\quad V'=-1,\\quad I'=3.\n$$\n\n\\uncover<1->{By the product rule,\n$$\nP'=V'I+VI'.\n$$}\n\n\\uncover<4->{$$\nP'=(-1)(4)+(5)(3)=\\boxed{11\\text{ W/s}}\n$$}\n\n\\uncover<4->{The power is increasing at 11 watts per second, even though the voltage is falling.}\n\\columnbreak\n\\begin{js}[size=860x560, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 96, R = 30, T = 64, B = 40, PW = w - L - R, PH = h - T - B;\nconst YTOP = 18, YBOT = -7, U = PH / (YTOP - YBOT);\nfunction Y(v) { return T + (YTOP - v) * U; }\nfunction label(s, x, y, col, sz, al) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = al || 'center';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nconst BW = 130, XS = [L + PW * 0.17, L + PW * 0.5, L + PW * 0.83];\nfunction bar(k, v, col) {\n  const y0 = Y(0), y1 = Y(v);\n  ctx.fillStyle = col; ctx.globalAlpha = 0.35; ctx.fillRect(XS[k] - BW / 2, Math.min(y0, y1), BW, Math.abs(y1 - y0));\n  ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 3;\n  ctx.strokeRect(XS[k] - BW / 2, Math.min(y0, y1), BW, Math.abs(y1 - y0));\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let v = -5; v <= 15; v += 5) { ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(L + PW, Y(v)); ctx.stroke(); }\nctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'right';\nfor (let v = -5; v <= 15; v += 5) ctx.fillText(v < 0 ? MN + (-v) : String(v), L - 12, Y(v) + 7);\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.stroke();\nlabel('rate of change of power, in watts per second', L + PW / 2, 34, '#6c7a7b', 22);\nif (step >= 2) {\n  bar(0, -4, colors.red);\n  label('V\\u2032I', XS[0], Y(0) - 16, colors.red, 25);\n  label('(' + MN + '1)(4) = ' + MN + '4', XS[0], Y(-4) + 32, colors.red, 22);\n}\nif (step >= 3) {\n  label('+', (XS[0] + XS[1]) / 2, Y(5) + 16, '#4a5a5b', 46);\n  bar(1, 15, colors.blue);\n  label('VI\\u2032', XS[1], Y(15) - 44, colors.blue, 25);\n  label('(5)(3) = 15', XS[1], Y(15) - 14, colors.blue, 22);\n}\nif (step >= 4) {\n  label('=', (XS[1] + XS[2]) / 2, Y(5) + 16, '#4a5a5b', 46);\n  bar(2, 11, colors.teal2);\n  label('P\\u2032', XS[2], Y(11) - 44, colors.teal2, 25);\n  label('11', XS[2], Y(11) - 14, colors.teal2, 22);\n}\n\\end{js}\n\\end{twocol}\n\n\\section{Quotients}\n\n\n\n\\slide{Derivative of a Reciprocal}\nSuppose $g(x)\\neq0$. From the definition,\n$$\n\\left(\\frac1g\\right)'(x)=\\lim_{h\\to0}\\frac{\\dfrac1{g(x+h)}-\\dfrac1{g(x)}}{h}.\n$$\n\\pause\nCombine the fractions in the numerator:\n$$\n\\left(\\frac1g\\right)'(x)=\\lim_{h\\to0}\\left[-\\frac{g(x+h)-g(x)}{h}\\cdot\\frac{1}{g(x+h)g(x)}\\right].\n$$\n\\pause\nThe first factor tends to $g'(x)$. The second tends to $1/g(x)^2$ because $g$ is continuous.\n\\pause\n$$\n\\boxed{\\left(\\frac1g\\right)'=-\\frac{g'}{g^2}}\n$$\n\n\\slide{The Quotient Rule}\nWrite $T$ for the top of a fraction and $B$ for the bottom. The quotient rule is the product rule applied to\n$$\n\\frac TB=T\\cdot\\frac1B.\n$$\n\\pause\nThe reciprocal rule says\n$$\n\\left(\\frac1B\\right)'=-\\frac{B'}{B^2}.\n$$\n\\pause\nTherefore,\n$$\n\\left(\\frac TB\\right)'=T'\\cdot\\frac1B+T\\cdot\\left(-\\frac{B'}{B^2}\\right)=\\boxed{\\frac{BT'-TB'}{B^2}}.\n$$\n\n\\slide{Example 5: Set Up the Quotient Rule}\nDifferentiate\n$$\nf(x)=\\frac{x^2+1}{x}\n$$\nand find the slope of its graph at $x=2$.\n\\pause\nName the top and the bottom, and differentiate each:\n$$\nT=x^2+1,\\qquad T'=2x,\n$$\n\\pause\n$$\nB=x,\\qquad B'=1.\n$$\n\\pause\nThe quotient rule says\n$$\nf'(x)=\\frac{BT'-TB'}{B^2}.\n$$\n\n\\slide{Example 5: Apply the Quotient Rule}\n\\begin{twocol}[5 7]\nSubstitute $T$, $T'$, $B$, and $B'$:\n$$\nf'(x)=\\frac{x\\cdot2x-(x^2+1)\\cdot1}{x^2}\n$$\n\n\\uncover<1->{Multiply out the top:\n$$\nf'(x)=\\frac{2x^2-x^2-1}{x^2}\n$$}\n\n\\uncover<2->{$$\n\\boxed{f'(x)=\\frac{x^2-1}{x^2}}\n$$}\n\n\\uncover<3->{At $x=2$,\n$$\nf'(2)=\\frac{4-1}{4}=\\frac34.\n$$}\n\\columnbreak\n\\begin{js}[size=860x560, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 86, R = 34, T = 32, B = 62, PW = w - L - R, PH = h - T - B;\nconst XL = -6.2, XR = 6.2, U = PW / (XR - XL), YB = -PH / (2 * U), YT = -YB;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return x + 1 / x; }\nfunction label(s, x, y, col, sz) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction branch(x0, x1) {\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 900; p++) {\n    const x = x0 + (x1 - x0) * p / 900, y = f(x);\n    if (y < YB - 1 || y > YT + 1) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke(); ctx.restore();\n}\nfunction tangent(a, col) {\n  const y = f(a), m = 1 - 1 / (a * a), dx = 2.4;\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip(); ctx.lineCap = 'round';\n  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11;\n  ctx.beginPath(); ctx.moveTo(X(a - dx), Y(y - m * dx)); ctx.lineTo(X(a + dx), Y(y + m * dx)); ctx.stroke();\n  ctx.strokeStyle = col; ctx.lineWidth = 6;\n  ctx.beginPath(); ctx.moveTo(X(a - dx), Y(y - m * dx)); ctx.lineTo(X(a + dx), Y(y + m * dx)); ctx.stroke(); ctx.restore();\n  ctx.beginPath(); ctx.arc(X(a), Y(y), 9, 0, 6.2832); ctx.fillStyle = col; ctx.fill();\n  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\nfor (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nfor (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0 && k % 2 === 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 28); }\nctx.textAlign = 'right';\nfor (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0 && k % 2 === 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0) - 10, Y(k) + 7); }\nbranch(XL, -0.03); branch(0.03, XR);\nlabel('y = (x\\u00b2 + 1)/x', X(2.4), Y(-2.6), colors.teal2, 23);\nif (step >= 3) { tangent(2, colors.burnt); label('slope 3/4', X(2.3), Y(1.6), colors.burnt, 24); }\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 5: Two Ways to Compute}\n\\begin{twocol}[6 6]\n\\textbf{With the quotient rule}\n$$\nf'(x)=\\frac{x\\cdot2x-(x^2+1)\\cdot1}{x^2}\n$$\n\\pause\n$$\n=\\frac{x^2-1}{x^2}\n$$\n\\columnbreak\n\\pause\n\\textbf{Split the fraction first}\n$$\nf(x)=\\frac{x^2+1}{x}=x+x^{-1}\n$$\n\\pause\n$$\nf'(x)=1-x^{-2}=1-\\frac{1}{x^2}\n$$\n\\pause\nThe two answers agree, since\n$$\n1-\\frac1{x^2}=\\frac{x^2-1}{x^2}.\n$$\n\\end{twocol}\n\n\\section{Combining Rules}\n\n\n\\slide{Reading the Structure}\nBefore differentiating, find the last operation in the formula. That operation decides which rule comes first.\n\\begin{twocol}[1 1]\n$$\nf(x)=x^2e^x+3x\n$$\n\\begin{js}[size=780x460, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nfunction node(cx, cy, text, col, fill, sub) {\n  ctx.font = '600 26px ' + FM;\n  const bw = Math.max(120, ctx.measureText(text).width + 44), bh = 58;\n  ctx.fillStyle = fill; ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(text, cx, cy + 9);\n  if (sub) { ctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.fillText(sub, cx, cy - 42); }\n}\nfunction link(x1, y1, x2, y2) {\n  ctx.strokeStyle = '#9aa7a8'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n}\nconst TOPY = 60, MIDY = 206, BOTY = 350;\nif (step >= 1) { link(390, TOPY + 29, 230, MIDY - 29); link(390, TOPY + 29, 560, MIDY - 29); }\nif (step >= 2) { link(230, MIDY + 29, 140, BOTY - 29); link(230, MIDY + 29, 320, BOTY - 29); }\nnode(390, TOPY, 'sum', colors.teal, '#dcebec');\nif (step >= 1) {\n  node(230, MIDY, 'product', colors.burnt, 'rgba(245,118,52,.20)');\n  node(560, MIDY, '3x', colors.blue, 'rgba(66,167,198,.20)');\n}\nif (step >= 2) {\n  node(140, BOTY, 'x\\u00b2', colors.teal2, '#eef5f5');\n  node(320, BOTY, 'e\\u02e3', colors.teal2, '#eef5f5');\n  ctx.font = '600 23px ' + FM; ctx.fillStyle = '#4a5a5b'; ctx.textAlign = 'center';\n  ctx.fillText('sum rule first, then the product rule', 390, 440);\n}\n\\end{js}\n\\columnbreak\n\\uncover<3->{$$\ng(x)=\\frac{x^3}{e^x+1}\n$$}\n\\begin{js}[size=780x460, frames=6]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nfunction node(cx, cy, text, col, fill, sub) {\n  ctx.font = '600 26px ' + FM;\n  const bw = Math.max(120, ctx.measureText(text).width + 44), bh = 58;\n  ctx.fillStyle = fill; ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.fillText(text, cx, cy + 9);\n  if (sub) { ctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.fillText(sub, cx, cy - 42); }\n}\nfunction link(x1, y1, x2, y2) {\n  ctx.strokeStyle = '#9aa7a8'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n}\nconst TOPY = 60, MIDY = 206, BOTY = 350;\nif (step < 3) return;\nif (step >= 4) { link(390, TOPY + 29, 230, MIDY - 29); link(390, TOPY + 29, 560, MIDY - 29); }\nif (step >= 5) { link(560, MIDY + 29, 470, BOTY - 29); link(560, MIDY + 29, 650, BOTY - 29); }\nnode(390, TOPY, 'quotient', colors.teal, '#dcebec');\nif (step >= 4) {\n  node(230, MIDY, 'top: x\\u00b3', colors.burnt, 'rgba(245,118,52,.20)');\n  node(560, MIDY, 'bottom: sum', colors.blue, 'rgba(66,167,198,.20)');\n}\nif (step >= 5) {\n  node(470, BOTY, 'e\\u02e3', colors.teal2, '#eef5f5');\n  node(650, BOTY, '1', colors.teal2, '#eef5f5');\n  ctx.font = '600 23px ' + FM; ctx.fillStyle = '#4a5a5b'; ctx.textAlign = 'center';\n  ctx.fillText('quotient rule first, then the sum rule', 390, 440);\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 6: A Quotient with a Sum on the Bottom}\nDifferentiate\n$$\ng(x)=\\frac{x^3}{e^x+1}.\n$$\n\\pause\nThe last operation is division, so the quotient rule comes first.\n\\pause\n$$\nT=x^3,\\qquad T'=3x^2\n$$\n\\pause\nThe bottom is a sum, so use the sum rule for $B'$:\n$$\nB=e^x+1,\\qquad B'=e^x+0=e^x.\n$$\n\n\\slide{Example 6: Apply the Quotient Rule}\nSubstitute into the quotient rule:\n$$\ng'(x)=\\frac{BT'-TB'}{B^2}=\\frac{(e^x+1)(3x^2)-x^3e^x}{(e^x+1)^2}.\n$$\n\\pause\nEach term on top has a factor of $x^2$:\n$$\n\\boxed{g'(x)=\\frac{x^2\\left(3e^x+3-xe^x\\right)}{(e^x+1)^2}}\n$$\n\n\\slide{You Try: Differentiate}\nDifferentiate\n$$\nK(x)=x^4+\\frac{e^x}{x^2+1}.\n$$\nWhich rule applies first?\n\\begin{js}[size=1500x150]\nconst T0 = 90;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst BW = 960, BH = 16, BX = (w - BW) / 2, BY = 122;\nfunction draw(left) {\n  ctx.clearRect(0, 0, w, h);\n  const shown = Math.ceil(Math.max(0, left));\n  const mm = Math.floor(shown / 60), ss = shown - 60 * mm;\n  const col = left <= 10 ? colors.red : (left <= 30 ? colors.orange : colors.teal2);\n  ctx.font = '600 84px ' + FM;\n  ctx.textAlign = 'center'; ctx.fillStyle = col;\n  ctx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, w / 2, 86);\n  ctx.fillStyle = '#E8EFEF'; ctx.fillRect(BX, BY, BW, BH);\n  ctx.fillStyle = col; ctx.fillRect(BX, BY, BW * Math.max(0, left) / T0, BH);\n}\ndraw(T0); onFrame(t => draw(T0 - t));\n\\end{js}\n\n\\slide{You Try: Solution}\nThis is a sum. The first term needs the power rule, and the second needs the quotient rule:\n$$\nK'(x)=4x^3+\\frac{(x^2+1)e^x-e^x(2x)}{(x^2+1)^2}.\n$$\n\\pause\nFactor the top of the fraction:\n$$\n\\boxed{K'(x)=4x^3+\\frac{e^x(x-1)^2}{(x^2+1)^2}}\n$$\n\\slide{Example 7: Horizontal Tangent Lines}\n\\begin{twocol}[6 6]\n\\textbf{Problem.} Find every point where the tangent line to the graph of\n$$f(x)=\\frac{x^2e^x}{x+1}$$\nis horizontal.\n\n\\uncover<1->{The last operation is division, and the top is a product.}\n\n\\uncover<2->{$$T=x^2e^x,\\qquad B=x+1$$}\n\n\\uncover<2->{$$T'=2xe^x+x^2e^x,\\qquad B'=1$$}\n\\columnbreak\n\\begin{js}[size=780x480, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nfunction node(cx, cy, bw, bh, text, col, fill) {\n  ctx.fillStyle = fill; ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(cx - bw / 2, cy - bh / 2, bw, bh);\n  ctx.font = '600 26px ' + FM; ctx.fillStyle = col; ctx.textAlign = 'center';\n  ctx.fillText(text, cx, cy + 9);\n}\nfunction link(x1, y1, x2, y2) {\n  ctx.strokeStyle = '#9aa7a8'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();\n}\nconst TOPY = 74, MIDY = 226, BOTY = 380;\nif (step >= 1) { link(w / 2, TOPY + 30, 230, MIDY - 30); link(w / 2, TOPY + 30, 570, MIDY - 30); }\nif (step >= 2) { link(230, MIDY + 30, 130, BOTY - 30); link(230, MIDY + 30, 330, BOTY - 30); }\nnode(w / 2, TOPY, 300, 60, 'quotient', colors.teal, '#dcebec');\nif (step >= 1) {\n  node(230, MIDY, 300, 60, 'top: product', colors.burnt, 'rgba(245,118,52,.20)');\n  node(570, MIDY, 250, 60, 'bottom: x + 1', colors.blue, 'rgba(66,167,198,.20)');\n}\nif (step >= 2) {\n  node(130, BOTY, 160, 58, 'x\\u00b2', colors.teal2, '#eef5f5');\n  node(330, BOTY, 160, 58, 'e\\u02e3', colors.teal2, '#eef5f5');\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 7: Finish the Computation}\n\\begin{twocol}[6 6]\nUse the quotient rule:\n$$f'(x)=\\frac{BT'-TB'}{B^2}$$\n$$=\\frac{(x+1)(2xe^x+x^2e^x)-x^2e^x}{(x+1)^2}.$$\n\n\\uncover<1->{Factor $e^x$ out of the top and expand:\n$$\\boxed{f'(x)=\\frac{xe^x(x^2+2x+2)}{(x+1)^2}}$$}\n\n\\uncover<2->{Now $x^2+2x+2=(x+1)^2+1>0$, so the only zero of $f'$ is $x=0$.}\n\n\\uncover<3->{The tangent line is horizontal at the origin, and nowhere else.}\n\\columnbreak\n\\begin{js}[size=780x520, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MN = '\\u2212';\nconst L = 80, R = 30, T = 30, B = 58, PW = w - L - R, PH = h - T - B;\nconst XL = -5.0, XR = 2.0, U = PW / (XR - XL), YB = -1.6, YT = YB + PH / U;\nfunction X(v) { return L + (v - XL) * U; }\nfunction Y(v) { return T + PH - (v - YB) * U; }\nfunction f(x) { return x * x * Math.exp(x) / (x + 1); }\nfunction label(s, x, y, col, sz) {\n  ctx.save(); ctx.font = '600 ' + (sz || 23) + 'px ' + FM; ctx.textAlign = 'left';\n  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();\n}\nfunction branch(x0, x1) {\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();\n  let pen = false;\n  for (let p = 0; p <= 700; p++) {\n    const x = x0 + (x1 - x0) * p / 700, y = f(x);\n    if (!isFinite(y) || y < YB - 1 || y > YT + 1) { pen = false; continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n  }\n  ctx.stroke(); ctx.restore();\n}\nctx.strokeStyle = colors.mist; ctx.lineWidth = 1;\nfor (let k = Math.ceil(XL); k <= XR; k++) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\nfor (let k = Math.ceil(YB); k <= YT; k++) { ctx.beginPath(); ctx.moveTo(L, Y(k)); ctx.lineTo(L + PW, Y(k)); ctx.stroke(); }\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + PW, Y(0)); ctx.moveTo(X(0), T); ctx.lineTo(X(0), T + PH); ctx.stroke();\nctx.font = '21px ' + FM; ctx.fillStyle = '#8b9899'; ctx.textAlign = 'center';\nfor (let k = Math.ceil(XL); k <= XR; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(k), Y(0) + 28); }\nctx.textAlign = 'right';\nfor (let k = Math.ceil(YB); k <= YT; k++) { if (k !== 0) ctx.fillText(k < 0 ? MN + (-k) : String(k), X(0) - 10, Y(k) + 8); }\nctx.save(); ctx.strokeStyle = colors.blue; ctx.lineWidth = 2; ctx.setLineDash([9, 9]);\nctx.beginPath(); ctx.moveTo(X(-1), T); ctx.lineTo(X(-1), T + PH); ctx.stroke(); ctx.restore();\nbranch(XL, -1.02); branch(-0.98, XR);\nif (step >= 3) {\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip(); ctx.lineCap = 'round';\n  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 11;\n  ctx.beginPath(); ctx.moveTo(X(-0.8), Y(0)); ctx.lineTo(X(0.8), Y(0)); ctx.stroke();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 6;\n  ctx.beginPath(); ctx.moveTo(X(-0.8), Y(0)); ctx.lineTo(X(0.8), Y(0)); ctx.stroke(); ctx.restore();\n  ctx.beginPath(); ctx.arc(X(0), Y(0), 9, 0, 6.2832); ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();\n  label('horizontal at (0, 0)', X(0.15), Y(0.65), colors.burnt, 23);\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{Summary}\n\\begin{twocol}[1 1]\n\\textbf{Constant rule}\n$$\\frac{d}{dx}(c)=0$$\n\n\\textbf{Power rule}\n$$\\frac{d}{dx}(x^r)=rx^{r-1}$$\n\n\\textbf{Constant multiple rule}\n$$\\big(cf\\big)'=cf'$$\n\n\\textbf{Sum and difference rules}\n$$\\big(f\\pm g\\big)'=f'\\pm g'$$\n\\columnbreak\n\\textbf{Exponential rule}\n$$\\frac{d}{dx}(e^x)=e^x$$\n\n\\textbf{Product rule}\n$$\\big(fg\\big)'=f'g+fg'$$\n\n\\textbf{Reciprocal rule}\n$$\\left(\\frac1g\\right)'=-\\frac{g'}{g^2}$$\n\n\\textbf{Quotient rule}\n$$\\left(\\frac TB\\right)'=\\frac{BT'-TB'}{B^2}$$\n\\end{twocol}\n\n\\slide{Before You Go}\n\\begin{note}\n\\alert{Problem Set 6 is available.} Use it to practice choosing the right rule and combining several rules in one problem.\n\\end{note}\n\n\\textbf{Upcoming schedule}\n\\begin{table}\nWeek & Lectures & Sections\nWeek 4 (this week) & Mon 9/21, Wed 9/23 & 3.1, 3.2, 3.3\nWeek 5 & Mon 9/28, Wed 9/30 & 3.4\nWeek 6 & Mon 10/5, Wed 10/7 & 3.5, 3.6\nWeek 6 & In discussion sections & \\alert{Exam 1}: Sections 2.1–2.8 and 3.1–3.4\n\\end{table}\n";window.LECTURE_SCALE=1.2;</script><script src="lecture-engine.js"></script><script>function PLAYER() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('scale'); } catch (e) {}
    if (q && !isNaN(parseFloat(q))) window.Lecture.setScale(parseFloat(q));
    else if (window.LECTURE_SCALE) window.Lecture.setScale(window.LECTURE_SCALE);
    var parsed = window.Lecture.parse(window.LECTURE_SOURCE);
    var slides = parsed.slides, meta = parsed.meta;
    var si = 0, ctrl = null, step = 0;
    var stage = document.getElementById('stage'), slideEl = document.getElementById('slide');
    var tray = document.getElementById('tray'), bar = document.getElementById('bar');
    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    }
    addEventListener('resize', fit); fit();
    var track = document.createElement('div');
    track.title = 'Drag to scrub through the deck';
    track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ew-resize;z-index:6';
    stage.appendChild(track);
    track.addEventListener('pointerdown', function (e) {
      function pick(cx) {
        var r = track.getBoundingClientRect();
        if (!r.width) return;

        var k = Math.floor(u * slides.length);

        removeEventListener('pointerup', up);

        (slides[si].section || meta.title || '') + '</div>' +
        '<div style="color:#999">' + (meta.copyright || '') + '</div>' +
        '<div style="color:#111">' + (si + 1) + ' / ' + total + '</div>';

      document.getElementById('next').onclick = function () { go(1); };
      bar.style.width = ((si + 1) / total * 1920) + 'px';

    function render() {
      if (ctrl) ctrl.destroy();
      ctrl = window.Lecture.mountSlide(slideEl, slides[si], meta, { readonly: true });

    function go(d) {
      if (d > 0) {
        if (step < slides[si].steps) { step++; ctrl.setStep(step); return; }
        if (si < slides.length - 1) { si++; step = 0; render(); }
      } else {
        if (step > 0) { step--; ctrl.setStep(step); return; }
        if (si > 0) { si--; step = slides[si].steps; render(); }
      }
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); }
      else if (e.key === 'Home') { si = 0; step = 0; render(); }
      else if (e.key === 'End') { si = slides.length - 1; step = 0; render(); }
    });
