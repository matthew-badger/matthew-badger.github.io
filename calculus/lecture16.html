(v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.log(x) / (x - 1);\naxes(0.5, 1);\nclip();\npath((x) => x, F, 0.04, 0.995, colors.curve, 5); path((x) => x, F, 1.005, x1, colors.curve, 5);\nctx.restore();\nring(1, 1, colors.curve, 11);\n\ntag('y = ln x / (x − 1)', X(1.4), Y(2.35), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\section{Indeterminate Forms}\n\n\\slide{A Limit We Cannot Yet Compute}\n\\begin{columns}[5 7, parallel]\nFind\n$$\\lim_{x\\to1}\\frac{\\textcolor{c1}{\\ln x}}{\\textcolor{c2}{x-1}}.$$\nThe limit law for quotients needs a nonzero limit in the denominator. Here\n$$\\lim_{x\\to1}\\textcolor{c1}{\\ln x}=0\\quad\\text{and}\\quad\\lim_{x\\to1}(\\textcolor{c2}{x-1})=0.$$\nCancelling a common factor does not help either. Move $x$ toward $1$ and watch the quotient.\n\\columnbreak\n\\begin{js}[size=900x780, alt=\"The graph of y = ln x over (x - 1), with an open circle at (1, 1). A point moves along the graph by dragging across the figure or with the arrow keys, with a readout of x and of the quotient; as x approaches 1 from either side, the quotient approaches 1.\"]\nconst L = 56, R = 16, T = 16, B = 130;                 // margins in pixels\nconst x0 = -0.3, x1 = 4.2, yc = 1.1;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Mat );\n  seg(x, 0, x, at1 ? 1 : F(x), colors.muted, 2, [6, 6]);\n  if (!at1) dot(x, F(x), colors.accent, 12);\n  tag('x = ' + dec(x, 3), w - R - 14, T + 40, colors.ink, 'right');\n  tag(at1 ? 'undefined at x = 1' : 'ln x / (x − 1) = ' + dec(F(x), 4), w - R - 14, T + 82, colors.ink, 'right');\n  slider('x = ' + dec(x, 3));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{The Indeterminate Form $0/0$}\n\\begin{definition}{Indeterminate Form of Type $0/0$}\nIf $\\textcolor{c1}{f(x)}\\to0$ and $\\textcolor{c2}{g(x)}\\to0$ as $x\\to a$, then $\\displaystyle\\lim_{x\\to a}\\frac{\\textcolor{c1}{f(x)}}{\\textcolor{c2}{g(x)}}$ is an \\textbf{indeterminate form of type $0/0$}.\n\\end{definition}\nThe limit may be any number, or $\\infty$, or may not exist. Top and bottom compete:\n$$\\lim_{x\\to0}\\frac{\\textcolor{c1}{x^2}}{\\textcolor{c2}{x}}=\\lim_{x\\to0}x=0,\\qquad\n\\lim_{x\\to0}\\frac{\\textcolor{c1}{3x}}{\\textcolor{c2}{x}}=3,\\qquad\n\\lim_{x\\to0^+}\\frac{\\textcolor{c1}{x}}{\\textcolor{c2}{x^2}}=\\lim_{x\\to0^+}\\frac{1}{x}=\\infty.$$\nThe form $0/0$ alone does not decide the answer. We have met it before:\n$$\\lim_{x\\to1}\\frac{x^2-x}{x^2-1}=\\lim_{x\\to1}\\frac{x}{x+1}=0.5,\\qquad\\lim_{x\\to0}\\frac{\\sin x}{x}=1.$$\n\n\\slide{The Indeterminate Form $\\infty/\\infty$}\n\\begin{definition}{Indeterminate Form of Type $\\infty/\\infty$}\nIf $\\textcolor{c1}{f(x)}\\to\\pm\\infty$ and $\\textcolor{c2}{g(x)}\\to\\pm\\infty$ as $x\\to a$, then $\\displaystyle\\lim_{x\\to a}\\frac{\\textcolor{c1}{f(x)}}{\\textcolor{c2}{g(x)}}$ is an \\textbf{indeterminate form of type $\\infty/\\infty$}.\n\\end{definition}\nHere $a$ may also be $\\pm\\infty$. Whichever of top and bottom grows faster wins, or they balance. For rational functions, divide by the highest power of $x$ in the denominator:\n$$\\lim_{x\\to\\infty}\\frac{x^2-1}{2x^2+1}=\\lim_{x\\to\\infty}\\frac{1-1/x^2}{2+1/x^2}=\\frac{1-0}{2+0}=0.5.$$\nThat does not work for $\\displaystyle\\lim_{x\\to\\infty}\\frac{\\ln x}{x-1}$ or $\\displaystyle\\lim_{x\\to\\infty}\\frac{e^x}{x^2}$.\n\n\\section{L'Hospital's Rule}\n\n\\slide{Why Should a Ratio of Derivatives Appear?}\n\\begin{columns}[6 6, parallel]\nLet $\\textcolor{c1}{f(x)=e^x-1}$ and $\\textcolor{c2}{g(x)=2\\tan^{-1}x}$. Both are $0$ at $x=0$.\n\\\\[0.5em]\nZoom in toward $(0,0)$. Each graph looks more and more like its tangent line:\n$$\\textcolor{c1}{f(x)\\approx f'(0)\\,x=x}$$\n$$\\textcolor{c2}{g(x)\\approx g'(0)\\,x=2x}$$\nNear $0$ the ratio of heights is close to the ratio of slopes:\n$$\\frac{\\textcolor{c1}{f(x)}}{\\textcolor{c2}{g(x)}}\\approx\\frac{\\textcolor{c1}{f'(0)}\\,x}{\\textcolor{c2}{g'(0)}\\,x}=\\frac{\\textcolor{c1}{1}}{\\textcolor{c2}{2}}=0.5.$$\n\\columnbreak\n\\begin{js}[size=800x790, alt=\"The graphs of f(x) = e to the x minus 1 (blue) and g(x) = 2 arctan x (orange) near the origin, with their tangent lines y = x and y = 2x dashed. A slider zooms the window toward the origin; as the window shrinks, each graph becomes indistinguishable from its tangent line. A readout at a point x near 0 gives f(x)/g(x) and f prime(x)/g prime(x), both approaching 0.5.\"]\nconst L = 100, R = 16, T = 16, B = 130;                // margins in pixels\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst PW = w - L - R, PH = h - T - B;\nconst f = (x) => Math.exp(x) - 1, g = (x) => 2 * Math.atan(x);\nconst df = (x) => Math.exp(x), dg = (x) => 2 / (1 + x * x);\nfunction nice(span) {                                 // a tick step giving about 6 ticks across span\n  const raw = span / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;\n  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.0;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const W = 1.6 * Math.pow(0.02 / 1.6, state.u);     // the window is x from -W to W, with equal units on both axes\n  const s = PW / (2 * W), H = PH / s / 2;\n  const X = (x) => L + (x + W) * s, Y = (y) => T + PH / 2 - y * s;\n  const line = (ax, ay, bx, by, c, wd, dash) => {\n    ctx.strokeStyle = c; ctx.lineWidth = wd; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n    ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n  };\n  const curve = (fn, c) => {\n    ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();\n    for (let i = 0; i <= 300; i++) { const x = -W + 2 * W * i / 300; if (i) ctx.lineTo(X(x), Y(fn(x))); else ctx.moveTo(X(x), Y(fn(x))); }\n    ctx.stroke();\n  };\n  ctx.clearRect(0, 0, w, h);\n  const d = nice(2 * W), num = (v) => String(+v.toPrecision(3)).replace('-', '−');\n  ctx.font = font(26); ctx.fillStyle = colors.text;\n  for (let k = Math.ceil(-W / d); k * d <= W + 1e-12; k++) {\n    line(k * d, -H, k * d, H, colors.grid, 1);\n    if (k) { ctx.textAlign = 'center'; ctx.fillText(num(k * d), X(k * d), h - B + 32); }\n  }\n  for (let k = Math.ceil(-H / d); k * d <= H + 1e-12; k++) {\n    line(-W, k * d, W, k * d, colors.grid, 1);\n    if (k) { ctx.textAlign = 'right'; ctx.fillText(num(k * d), L - 10, Y(k * d) + 9); }\n  }\n  ctx.textAlign = 'left';\n  line(-W, 0, W, 0, colors.axis, 2); line(0, -H, 0, H, colors.axis, 2);\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, PW, PH); ctx.clip();\n  line(-W, -W, W, W, colors.c1, 3, [12, 9]); line(-W, -2 * W, W, 2 * W, colors.c2, 3, [12, 9]);\n  curve(f, colors.c1); curve(g, colors.c2);\n  const xp = 0.6 * W;\n  line(xp, 0, xp, g(xp), colors.muted, 2, [5, 6]);\n  ctx.fillStyle = colors.c1; ctx.beginPath(); ctx.arc(X(xp), Y(f(xp)), 10, 0, 2 * Math.PI); ctx.fill();\n  ctx.fillStyle = colors.c2; ctx.beginPath(); ctx.arc(X(xp), Y(g(xp)), 10, 0, 2 * Math.PI); ctx.fill();\n  ctx.restore();\n  tag('f(x) = eˣ − 1', L + 14, T + 40, colors.c1);\n  tag('g(x) = 2 tan⁻¹ x', L + 14, T + 82, colors.c2);\n  tag('at x = ' + num(xp) + ':', w - R - 14, T + PH - 110, colors.ink, 'right');\n  tag('f(x) / g(x) = ' + dec(f(xp) / g(xp), 5), w - R - 14, T + PH - 68, colors.ink, 'right');\n  tag('f′(x) / g′(x) = ' + dec(df(xp) / dg(xp), 5), w - R - 14, T + PH - 26, colors.ink, 'right');\n  slider('window: x from −' + num(W) + ' to ' + num(W));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{L'Hospital's Rule}\n\\begin{theorem}{L'Hospital's Rule}\nSuppose $\\textcolor{c1}{f}$ and $\\textcolor{c2}{g}$ are differentiable and $\\textcolor{c2}{g'(x)}\\ne0$ on an open interval containing $a$ (except possibly at $a$). If\n$$\\lim_{x\\to a}\\textcolor{c1}{f(x)}=0\\ \\text{ and }\\ \\lim_{x\\to a}\\textcolor{c2}{g(x)}=0,\\qquad\\text{or}\\qquad\\lim_{x\\to a}\\textcolor{c1}{f(x)}=\\pm\\infty\\ \\text{ and }\\ \\lim_{x\\to a}\\textcolor{c2}{g(x)}=\\pm\\infty,$$\nthen\n$$\\boxed{\\lim_{x\\to a}\\frac{\\textcolor{c1}{f(x)}}{\\textcolor{c2}{g(x)}}=\\lim_{x\\to a}\\frac{\\textcolor{c1}{f'(x)}}{\\textcolor{c2}{g'(x)}}}$$\nif the limit on the right side exists (or is $\\infty$ or $-\\infty$).\n\\end{theorem}\nThe rule also holds for one-sided limits and for $x\\to\\infty$ or $x\\to-\\infty$.\n\\\\[0.3em]\n\\small{Published by the Marquis de l'Hospital in 1696, in the first calculus textbook; discovered by Johann Bernoulli.}\n\n\\slide{Why It Is True (a Special Case)}\nSuppose $\\textcolor{c1}{f(a)=0}$, $\\textcolor{c2}{g(a)=0}$, $f'$ and $g'$ are continuous, and $\\textcolor{c2}{g'(a)}\\ne0$.\n\\pause\n\\begin{align}\n\\lim_{x\\to a}\\frac{\\textcolor{c1}{f(x)}}{\\textcolor{c2}{g(x)}} &= \\lim_{x\\to a}\\frac{\\textcolor{c1}{f(x)-f(a)}}{\\textcolor{c2}{g(x)-g(a)}} &&\\text{subtract }0\\text{ from top and bottom} \\\\\n\\pause\n\\phantom{\\lim_{x\\to a}\\frac{f(x)}{g(x)}} &= \\lim_{x\\to a}\\frac{\\left(\\textcolor{c1}{f(x)-f(a)}\\right)/(x-a)}{\\left(\\textcolor{c2}{g(x)-g(a)}\\right)/(x-a)} &&\\text{divide top and bottom by }x-a \\\\\n\\pause\n\\phantom{\\lim_{x\\to a}\\frac{f(x)}{g(x)}} &= \\frac{\\textcolor{c1}{f'(a)}}{\\textcolor{c2}{g'(a)}} &&\\text{definition of the derivative} \\\\\n\\pause\n\\phantom{\\lim_{x\\to a}\\frac{f(x)}{g(x)}} &= \\lim_{x\\to a}\\frac{\\textcolor{c1}{f'(x)}}{\\textcolor{c2}{g'(x)}} &&f'\\text{ and }g'\\text{ are continuous at }a\n\\end{align}\n\n\\slide{Not the Quotient Rule}\nL'Hospital's Rule differentiates the top and the bottom \\textbf{separately}. With top $T$ and bottom $B$:\n\\begin{columns}[1 1, parallel]\n\\begin{box}\n\\heading{L'Hospital's Rule (a limit)}\n$$\\lim_{x\\to a}\\frac{\\textcolor{c1}{T}}{\\textcolor{c2}{B}}=\\lim_{x\\to a}\\frac{\\textcolor{c1}{T'}}{\\textcolor{c2}{B'}}$$\nonly for the forms $0/0$ and $\\infty/\\infty$.\n\\end{box}\n\\columnbreak\n\\begin{box}\n\\heading{Quotient Rule (a derivative)}\n$$\\left(\\frac{\\textcolor{c1}{T}}{\\textcolor{c2}{B}}\\right)'=\\frac{\\textcolor{c1}{T'}\\textcolor{c2}{B}-\\textcolor{c1}{T}\\textcolor{c2}{B'}}{\\textcolor{c2}{B}^2}$$\nfor every quotient, wherever $B\\ne0$.\n\\end{box}\n\\end{columns}\n\\bigskip\nBefore using l'Hospital's Rule, \\textbf{check the form}: both top and bottom must approach $0$, or both must approach $\\pm\\infty$.\n\n\\slide{Example 1: $\\displaystyle\\lim_{x\\to1}\\frac{\\ln x}{x-1}$}\n\\begin{columns}[7 5, parallel]\nCheck the form: $\\textcolor{c1}{\\ln x}\\to\\ln1=0$ and $\\textcolor{c2}{x-1}\\to0$. Type $0/0$.\n\\pause\n\\begin{align}\n\\lim_{x\\to1}\\frac{\\textcolor{c1}{\\ln x}}{\\textcolor{c2}{x-1}} &= \\lim_{x\\to1}\\frac{\\textcolor{c1}{(\\ln x)'}}{\\textcolor{c2}{(x-1)'}} \\\\\n\\pause\n\\phantom{\\lim_{x\\to1}\\frac{\\ln x}{x-1}} &= \\lim_{x\\to1}\\frac{\\textcolor{c1}{1/x}}{\\textcolor{c2}{1}} \\\\\n\\pause\n\\phantom{\\lim_{x\\to1}\\frac{\\ln x}{x-1}} &= \\frac{1}{1}=1\n\\end{align}\n\\pause\nThe open circle on the graph is at height $1$.\n\\columnbreak\n\\begin{js}<4->[size=640x640, alt=\"The graph of y = ln x over (x - 1) for x from 0 to 4, with an open circle at (1, 1). At the last step the open circle is labeled with the limit 1.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.4, x1 = 4.1, yc = 1.2;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.log(x) / (x - 1);\naxes(0.5, 1);\nclip();\npath((x) => x, F, 0.04, 0.995, colors.curve, 5); path((x) => x, F, 1.005, x1, colors.curve, 5);\nctx.restore();\nring(1, 1, colors.curve, 11);\n\nif (local >= 1) tag('limit 1 at x = 1', X(1) + 20, Y(1) - 18, colors.ink);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: $\\displaystyle\\lim_{x\\to\\infty}\\frac{e^x}{x^2}$}\n\\begin{columns}[7 5, parallel]\nCheck the form: $\\textcolor{c1}{e^x}\\to\\infty$ and $\\textcolor{c2}{x^2}\\to\\infty$. Type $\\infty/\\infty$.\n\\pause\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{e^x}}{\\textcolor{c2}{x^2}} &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{e^x}}{\\textcolor{c2}{2x}}\n\\end{align}\n\\pause\nStill type $\\infty/\\infty$. Apply the rule again:\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{e^x}}{\\textcolor{c2}{2x}} &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{e^x}}{\\textcolor{c2}{2}}=\\infty\n\\end{align}\n\\pause\nThe exponential $e^x$ grows faster than $x^2$.\n\\columnbreak\n\\begin{js}[size=640x640, alt=\"The graph of y = e to the x over x squared for x from 0 to 10, with a compressed vertical scale. It has a low point near x = 2 and then rises steeply.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -0.4, x1 = 10.4, y0 = -1, y1 = 24;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.exp(x) / (x * x);\naxes(1, 2, 2, 5);\nclip(); path((x) => x, F, 0.2, 10.4, colors.curve, 5); ctx.restore();\ntag('y = eˣ / x²', X(4.4), Y(17), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 3: $\\displaystyle\\lim_{x\\to\\infty}\\frac{\\ln x}{\\sqrt x}$}\n\\begin{columns}[7 5, parallel]\nCheck the form: $\\textcolor{c1}{\\ln x}\\to\\infty$ and $\\textcolor{c2}{\\sqrt x}\\to\\infty$. Type $\\infty/\\infty$.\n\\pause\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{\\ln x}}{\\textcolor{c2}{\\sqrt x}} &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{1/x}}{\\textcolor{c2}{\\tfrac12x^{-1/2}}}\n\\end{align}\n\\pause\nSimplify before doing anything else:\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{1/x}}{\\textcolor{c2}{\\tfrac12x^{-1/2}}} &= \\lim_{x\\to\\infty}\\frac{2\\sqrt x}{x}=\\lim_{x\\to\\infty}\\frac{2}{\\sqrt x}=0\n\\end{align}\n\\pause\nThe logarithm grows more slowly than $\\sqrt x$.\n\\columnbreak\n\\begin{js}[size=640x500, alt=\"The graph of y = ln x over the square root of x for x from 0 to 400, with a stretched vertical scale. It rises to a high point near x = 7.4 and then decreases slowly toward 0.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -10, x1 = 410, y0 = -0.3, y1 = 1.0;      // the window; the vertical scale is stretched\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.log(x) / Math.sqrt(x);\naxes(50, 0.25, 100, 0.5);\nclip(); path((x) => x, F, 0.6, 410, colors.curve, 5); ctx.restore();\ntag('y = ln x / √x', X(150), Y(0.85), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Explore: Exponentials Grow Faster Than Powers}\n\\begin{columns}[4 8, parallel]\nFor each $n=1,2,3,\\ldots$, applying l'Hospital's Rule $n$ times gives\n$$\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{x^n}}{\\textcolor{c2}{e^x}}=\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{n!}}{\\textcolor{c2}{e^x}}=0.$$\nThe graph of $x^n/e^x$ rises to a peak at $x=n$, and the peak grows with $n$. Even so, the graph always comes back down to $0$.\n\\columnbreak\n\\begin{js}[size=1060x760, alt=\"The graph of y = x to the n over e to the x for x from 0 to 40, with a slider for n from 1 to 12. The vertical scale changes with n so that the peak fits. The graph rises to its highest point at x = n and then falls back toward 0; a readout gives n, the height of the peak, and the value at x = 40.\"]\nconst L = 40, R = 20, T = 20, B = 130;                // margins in pixels\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst x0 = 0, x1 = 40, PW = w - L - R, PH = h - T - B;\nconst X = (x) => L + (x - x0) / (x1 - x0) * PW;\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction sci(v) {                                     // a number in a short form: 4539.9… or 1.6… × 10⁻⁹\n  if (v >= 0.001 && v < 1e7) { const d = v < 10 ? 4 : 1, p = Math.pow(10, d); return (Math.floor(v * p) / p).toFixed(d) + '…'; }\n  const e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);\n  const sup = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };\n  return (Math.floor(m * 10) / 10).toFixed(1) + '… × 10' + String(e).split('').map((ch) => sup[ch]).join('');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.27;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const n = 1 + Math.round(state.u * 11), peak = Math.pow(n, n) * Math.exp(-n);\n  const F = (x) => Math.pow(x, n) * Math.exp(-x), Y = (y) => T + PH - y / (1.2 * peak) * PH;\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = 5; k <= 40; k += 5) { ctx.beginPath(); ctx.moveTo(X(k), T); ctx.lineTo(X(k), T + PH); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, T + PH); ctx.lineTo(w - R, T + PH); ctx.moveTo(L, T); ctx.lineTo(L, T + PH); ctx.stroke();\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let k = 5; k <= 40; k += 5) ctx.fillText(String(k), X(k), T + PH + 32);\n  ctx.textAlign = 'left';\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const x = 40 * i / 400; if (i) ctx.lineTo(X(x), Y(F(x))); else ctx.moveTo(X(x), Y(F(x))); }\n  ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(n), Y(peak), 10, 0, 2 * Math.PI); ctx.fill();\n  tag('peak at x = ' + n + ':  ' + sci(peak), X(n) + 20, Y(peak) + 8, colors.ink);\n  tag('y = xⁿ / eˣ with n = ' + n, w - R - 10, T + PH * 0.45, colors.curve, 'right');\n  tag('value at x = 40:  ' + sci(F(40)), w - R - 10, T + PH * 0.45 + 42, colors.ink, 'right');\n  tag('vertical scale changes with n', w - R - 10, T + PH * 0.45 + 84, colors.muted, 'right');\n  slider('n = ' + n);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: Always Check the Form First}\n\\begin{columns}[7 5, parallel]\nFind $\\displaystyle\\lim_{x\\to\\pi^-}\\frac{\\sin x}{1-\\cos x}$.\n\\pause\nCheck the form: $\\textcolor{c1}{\\sin x}\\to\\sin\\pi=0$, but $\\textcolor{c2}{1-\\cos x}\\to1-(-1)=2$. This is \\textbf{not} an indeterminate form.\n\\pause\nThe function is continuous at $\\pi$. Substitute:\n$$\\lim_{x\\to\\pi^-}\\frac{\\sin x}{1-\\cos x}=\\frac{0}{2}=0.$$\n\\pause\nDifferentiating top and bottom anyway would give $\\displaystyle\\lim_{x\\to\\pi^-}\\frac{\\cos x}{\\sin x}=-\\infty$, which is \\alert{wrong}.\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The graph of y = sin x over (1 - cos x) for x between 0 and 2 pi, drawn with equal units on both axes. It comes down from very large values near x = 0, crosses the x-axis at x = pi, and goes to very negative values near x = 2 pi. The point (pi, 0) is marked.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.3, x1 = 6.6, yc = 0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.sin(x) / (1 - Math.cos(x));\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nclip(); path((x) => x, F, 0.08, 2 * Math.PI - 0.08, colors.curve, 5); ctx.restore();\ndot(Math.PI, 0, colors.ink, 11);\ntag('(π, 0)', X(Math.PI) + 16, Y(0) - 16, colors.ink);\nctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\nctx.fillText('π', X(Math.PI), Y(0) + 34); ctx.fillText('2π', X(2 * Math.PI), Y(0) + 34); ctx.textAlign = 'left';\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 1}\n\\begin{youtry}[time=none]{A $0/0$ Limit}\nFind $\\displaystyle\\lim_{t\\to0}\\frac{e^{2t}-1}{\\sin t}$.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 1: Solution}\n\\textbf{Problem.} Find $\\displaystyle\\lim_{t\\to0}\\frac{e^{2t}-1}{\\sin t}$.\n\\pause\nCheck the form: $\\textcolor{c1}{e^{2t}-1}\\to e^0-1=0$ and $\\textcolor{c2}{\\sin t}\\to0$. Type $0/0$.\n\\pause\n\\begin{align}\n\\lim_{t\\to0}\\frac{\\textcolor{c1}{e^{2t}-1}}{\\textcolor{c2}{\\sin t}} &= \\lim_{t\\to0}\\frac{\\textcolor{c1}{2e^{2t}}}{\\textcolor{c2}{\\cos t}} \\\\\n\\pause\n\\phantom{\\lim_{t\\to0}\\frac{e^{2t}-1}{\\sin t}} &= \\frac{2e^0}{\\cos0}=\\frac{2}{1}=2\n\\end{align}\n\\pause\nThe derivative of $e^{2t}$ is $2e^{2t}$, by the chain rule.\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 2}\n\\begin{youtry}[time=none]{An $\\infty/\\infty$ Limit}\nFind $\\displaystyle\\lim_{x\\to\\infty}\\frac{(\\ln x)^2}{x}$.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 2: Solution}\n\\textbf{Problem.} Find $\\displaystyle\\lim_{x\\to\\infty}\\frac{(\\ln x)^2}{x}$.\n\\pause\nType $\\infty/\\infty$. By the chain rule, $\\left((\\ln x)^2\\right)'=2\\ln x\\cdot\\dfrac1x$.\n\\pause\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{(\\ln x)^2}}{\\textcolor{c2}{x}} &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{2\\ln x\\cdot(1/x)}}{\\textcolor{c2}{1}}=\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{2\\ln x}}{\\textcolor{c2}{x}}\n\\end{align}\n\\pause\nStill type $\\infty/\\infty$. Apply the rule again:\n\\begin{align}\n\\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{2\\ln x}}{\\textcolor{c2}{x}} &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{2/x}}{\\textcolor{c2}{1}}=0\n\\end{align}\n\n\\section{Other Indeterminate Forms}\n\n\\slide{Products: Type $0\\cdot\\infty$}\n\\begin{columns}[7 5, parallel]\nIf $f(x)\\to0$ and $g(x)\\to\\pm\\infty$, rewrite the product as a quotient:\n$$fg=\\frac{f}{1/g}\\qquad\\text{or}\\qquad fg=\\frac{g}{1/f}.$$\n\\heading{Example 5: $\\displaystyle\\lim_{x\\to0^+}x\\ln x$}\nType $0\\cdot(-\\infty)$. Write $x=1/(1/x)$:\n\\pause\n\\begin{align}\n\\lim_{x\\to0^+}x\\ln x &= \\lim_{x\\to0^+}\\frac{\\textcolor{c1}{\\ln x}}{\\textcolor{c2}{1/x}} \\\\\n\\pause\n\\phantom{\\lim_{x\\to0^+}x\\ln x} &= \\lim_{x\\to0^+}\\frac{\\textcolor{c1}{1/x}}{\\textcolor{c2}{-1/x^2}}=\\lim_{x\\to0^+}(-x)=0\n\\end{align}\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The graph of y = x ln x for x from 0 to 2.2, drawn with equal units on both axes. It starts near the origin, dips to a low point near x = 0.37, crosses the x-axis at x = 1, and rises. An open circle marks the origin, which the graph approaches but never reaches.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.3, x1 = 2.3, yc = 0.4;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => x * Math.log(x);\naxes(0.5, 1);\nclip(); path((x) => x, F, 0.001, 2.3, colors.curve, 5); ctx.restore();\nring(0, 0, colors.curve, 10);\ntag('y = x ln x', X(1.3), Y(1.35), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Differences: Type $\\infty-\\infty$}\n\\begin{columns}[7 5, parallel]\nIf $f\\to\\infty$ and $g\\to\\infty$, rewrite $f-g$ as a quotient.\n\\heading{Example 6: $\\displaystyle\\lim_{x\\to0^+}(\\csc x-\\cot x)$}\nBoth $\\csc x\\to\\infty$ and $\\cot x\\to\\infty$. Common denominator:\n\\pause\n\\begin{align}\n\\lim_{x\\to0^+}\\left(\\frac{1}{\\sin x}-\\frac{\\cos x}{\\sin x}\\right) &= \\lim_{x\\to0^+}\\frac{\\textcolor{c1}{1-\\cos x}}{\\textcolor{c2}{\\sin x}} \\\\\n\\pause\n\\phantom{\\lim_{x\\to0^+}\\left(\\frac{1}{\\sin x}-\\frac{\\cos x}{\\sin x}\\right)} &= \\lim_{x\\to0^+}\\frac{\\textcolor{c1}{\\sin x}}{\\textcolor{c2}{\\cos x}}=\\frac01=0\n\\end{align}\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The graphs of y = csc x and y = cot x for x from 0 to 3, both rising to infinity as x approaches 0, and the graph of their difference, which approaches 0 at the origin, marked with an open circle.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.3, x1 = 3.2, yc = 1.3;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst csc = (x) => 1 / Math.sin(x), cot = (x) => Math.cos(x) / Math.sin(x), D = (x) => csc(x) - cot(x);\naxes(0.5, 1);\nclip();\npath((x) => x, csc, 0.05, 3.1, colors.muted, 3, [10, 8]); path((x) => x, cot, 0.05, 3.1, colors.muted, 3, [3, 7]);\npath((x) => x, D, 0.001, 3.0, colors.curve, 5);\nctx.restore();\nring(0, 0, colors.curve, 10);\ntag('csc x', X(0.55), Y(2.45), colors.muted); tag('cot x', X(1.05), Y(-0.25), colors.muted);\ntag('csc x − cot x', X(1.75), Y(0.4), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Powers: Types $0^0$, $\\infty^0$, $1^\\infty$}\nFor $\\lim\\,[f(x)]^{g(x)}$, let $y=[f(x)]^{g(x)}$. Then $\\ln y=g(x)\\ln f(x)$, a product of type $0\\cdot\\infty$. Find the limit of $\\ln y$, then use $y=e^{\\ln y}$.\n\\begin{columns}[7 5, parallel]\n\\heading{Example 7: $\\lim_{x\\to0^+}x^x$}\nType $0^0$. Let $y=x^x$. Then $\\ln y=x\\ln x$, and by Example 5,\n$$\\lim_{x\\to0^+}\\ln y=\\lim_{x\\to0^+}x\\ln x=0.$$\n\\pause\nTherefore\n$$\\lim_{x\\to0^+}x^x=\\lim_{x\\to0^+}e^{\\ln y}=e^0=1.$$\n\\columnbreak\n\\begin{js}[size=560x430, alt=\"The graph of y = x to the x for x from 0 to 1.8, drawn with equal units on both axes. It starts near height 1 at the left, with an open circle at (0, 1), dips to a low point near x = 0.37, and rises.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.3, x1 = 1.9, yc = 1.0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst F = (x) => Math.pow(x, x);\naxes(0.5, 1);\nclip(); path((x) => x, F, 0.001, 1.9, colors.curve, 5); ctx.restore();\nring(0, 1, colors.curve, 10);\ntag('y = xˣ', X(0.35), Y(1.55), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 8: $\\lim_{x\\to\\infty}(1+1/x)^x$}\nType $1^\\infty$. Let $y=(1+1/x)^x$. Then\n$$\\ln y=x\\ln\\left(1+\\frac1x\\right)=\\frac{\\textcolor{c1}{\\ln(1+1/x)}}{\\textcolor{c2}{1/x}},\\qquad\\text{type }0/0.$$\n\\pause\nBy the chain rule, the top has derivative $\\textcolor{c1}{-1/\\left(x^2(1+1/x)\\right)}$. The bottom has derivative $\\textcolor{c2}{-1/x^2}$.\n\\begin{align}\n\\lim_{x\\to\\infty}\\ln y &= \\lim_{x\\to\\infty}\\frac{\\textcolor{c1}{-1/\\left(x^2(1+1/x)\\right)}}{\\textcolor{c2}{-1/x^2}} \\\\\n\\pause\n\\phantom{\\lim_{x\\to\\infty}\\ln y} &= \\lim_{x\\to\\infty}\\frac{1}{1+1/x}=1\n\\end{align}\n\\pause\nTherefore $\\displaystyle\\lim_{x\\to\\infty}\\left(1+\\frac1x\\right)^x=e^1=e=2.718\\ldots$\n\n\\slide{Compound Interest}\n\\begin{columns}[5 7, parallel]\nA bank pays $100\\%$ interest per year, compounded $n$ times per year. After one year, one dollar grows to\n$$\\left(1+\\frac1n\\right)^n\\text{ dollars.}$$\n\\begin{itemize}[tight]\n\\item $n=1$: $2$\n\\item $n=12$ (monthly): $2.613\\ldots$\n\\item $n=365$ (daily): $2.714\\ldots$\n\\end{itemize}\nBy Example 8, compounding \\textbf{continuously} gives $e=2.718\\ldots$ dollars. Jacob Bernoulli found the number $e$ this way in 1683.\n\\columnbreak\n\\begin{js}[size=900x700, alt=\"The values (1 + 1/n) to the n, the dollars after one year, against the number n of compoundings per year from 1 to 1000 on a logarithmic horizontal scale. The curve rises from 2 toward the dashed line at height e = 2.718..., without reaching it. A slider chooses n, with a readout of the value.\"]\nconst L = 100, R = 30, T = 20, B = 170;                // margins in pixels\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst PW = w - L - R, PH = h - T - B;\nconst X = (n) => L + Math.log10(n) / 3 * PW;          // n from 1 to 1000 on a logarithmic scale\nconst Y = (v) => T + PH - (v - 1.9) / 0.9 * PH;       // dollars from 1.9 to 2.8\nconst A = (n) => Math.pow(1 + 1 / n, n);\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.6;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const n = Math.max(1, Math.round(Math.pow(10, 3 * state.u)));\n  ctx.clearRect(0, 0, w, h);\n  [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].forEach((k) => line(X(k), T, X(k), T + PH, colors.grid, 1));\n  [2.0, 2.2, 2.4, 2.6, 2.8].forEach((v) => line(L, Y(v), w - R, Y(v), colors.grid, 1));\n  line(L, T + PH, w - R, T + PH, colors.axis, 2); line(L, T, L, T + PH, colors.axis, 2);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  [1, 10, 100, 1000].forEach((k) => ctx.fillText(String(k), X(k), T + PH + 32));\n  ctx.textAlign = 'right';\n  [2.0, 2.2, 2.4, 2.6, 2.8].forEach((v) => ctx.fillText(v.toFixed(1), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n  line(L, Y(Math.E), w - R, Y(Math.E), colors.c2, 3, [12, 9]);\n  tag('e = 2.718…', w - R - 8, Y(Math.E) - 12, colors.c2, 'right');\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 5; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const m = Math.pow(10, 3 * i / 300); if (i) ctx.lineTo(X(m), Y(A(m))); else ctx.moveTo(X(m), Y(A(m))); }\n  ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(n), Y(A(n)), 11, 0, 2 * Math.PI); ctx.fill();\n  tag('n = ' + n + ':  ' + dec(A(n), 6) + ' dollars', w - R - 10, Y(2.05), colors.ink, 'right');\n  tag('compoundings per year, n', L + PW / 2, T + PH + 66, colors.muted, 'center');\n  slider('n = ' + n);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Physics: Falling Without Air Resistance}\n\\begin{columns}[6 6, parallel]\nAn object of mass $m$ falls from rest. With air resistance $c>0$, its velocity after $t$ seconds is\n$$v=\\frac{mg}{\\textcolor{c2}{c}}\\left(1-e^{-\\textcolor{c2}{c}t/m}\\right).$$\nAs $c\\to0^+$, this is type $0/0$ in the variable $c$. Differentiate top and bottom with respect to $c$.\n\\columnbreak\n\\begin{js}[size=780x560, alt=\"Velocity in meters per second against time in seconds, from 0 to 15 seconds, for a falling object of mass 80 kilograms. A slider sets the air-resistance constant c from 0 to 30 kilograms per second. The curve rises and levels off at the terminal velocity mg over c; the dashed line v = g t is free fall. As c decreases toward 0, the curve approaches the dashed line.\"]\nconst L = 90, R = 24, T = 100, B = 150;                // margins in pixels; readouts sit above the plot\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst PW = w - L - R, PH = h - T - B, m = 80, g = 9.8;\nconst X = (t) => L + t / 15 * PW, Y = (v) => T + PH - v / 150 * PH;\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), mm = Math.abs(v) * p, t = Math.floor(mm + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(mm - t) < 1e-6 ? '' : '…');\n}\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.5;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const c = 30 * state.u;\n  const v = (t) => (c < 1e-6 ? g * t : m * g / c * (1 - Math.exp(-c * t / m)));\n  ctx.clearRect(0, 0, w, h);\n  for (let k = 3; k <= 15; k += 3) line(X(k), T, X(k), T + PH, colors.grid, 1);\n  for (let k = 25; k <= 150; k += 2
