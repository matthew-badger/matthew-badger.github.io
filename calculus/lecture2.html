<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 2: Neighborhoods and Limits</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="% Lines beginning with % are comments and never appear on a slide.\n\\title{Lecture 2: Neighborhoods and Limits}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 2, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n\\section{Review}\n\n\\slide{Numbers and Distance}\n\n\\begin{js}[size=1680x270]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212';\nconst AY = 96, XA = 520, XB = 1160, XC = 840;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction dot(x, col) {\n  ctx.beginPath(); ctx.arc(x, AY, 10, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nfunction brace(x1, x2, y, lab, col) {\n  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(x1, y - 14); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 14);\n  ctx.stroke();\n  txt(lab, (x1 + x2) / 2, y + 40, '600 28px ' + FM, col);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\ndot(XA, colors.teal2); dot(XB, colors.teal2); dot(XC, colors.red);\ntxt('a', XA, AY - 36, 'italic 600 38px ' + FS, colors.teal);\ntxt('b', XB, AY - 36, 'italic 600 38px ' + FS, colors.teal);\ntxt('c', XC, AY - 36, 'italic 600 38px ' + FS, colors.red);\nbrace(XA, XC, AY + 56, '|a ' + MN + ' c|', colors.burnt);\nbrace(XC, XB, AY + 56, '|c ' + MN + ' b|', colors.burnt);\ntxt('however close a and b are, there is a number c strictly between them',\n  w / 2, AY + 150, 'italic 30px ' + FS, '#5c6a6b');\n\\end{js}\n\n\\begin{itemize}[tight]\n\\item Every real number is a signed infinite decimal, and $\\R$ is the set of all of them. Neither $-\\infty$ nor $+\\infty$ is a number.\n\\pause\n\\item The distance between $a$ and $b$ is $|a-b| = |b-a|$, which is never negative.\n\\pause\n\\item There is no smallest distance: between two different numbers there is always a third, and the subdividing never has to stop.\n\\pause\n\\item If $|a-b| < \\delta$ for every $\\delta > 0$, then $a = b$. Two numbers with no room between them are the same number.\n\\end{itemize}\n\n\\slide{Slopes and Tangent Lines}\n\n\\begin{js}[size=1620x460, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212';\nconst sqr = plot.compile('x^2');\nconst OY = 30, PH = 340, PW = 690;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction frame(ox, xl, xr, yb, yt) {\n  function X(v) { return ox + (v - xl) / (xr - xl) * PW; }\n  function Y(v) { return OY + PH - (v - yb) / (yt - yb) * PH; }\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(xl), Y(0)); ctx.lineTo(X(xr), Y(0));\n  ctx.moveTo(X(0), Y(yb)); ctx.lineTo(X(0), Y(yt));\n  ctx.stroke();\n  return { X: X, Y: Y };\n}\nconst A = frame(50, -0.4, 6.2, -0.5, 4.6);\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4; ctx.lineCap = 'round';\nctx.beginPath();\nctx.moveTo(A.X(-0.2), A.Y(0.9)); ctx.lineTo(A.X(6), A.Y(4));\nctx.stroke();\nctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5;\nctx.setLineDash([7, 7]);\nctx.beginPath();\nctx.moveTo(A.X(1), A.Y(1.5)); ctx.lineTo(A.X(5), A.Y(1.5)); ctx.lineTo(A.X(5), A.Y(3.5));\nctx.stroke();\nctx.setLineDash([]);\n[[1, 1.5], [5, 3.5]].forEach(function (q) {\n  ctx.beginPath(); ctx.arc(A.X(q[0]), A.Y(q[1]), 9, 0, 6.2832);\n  ctx.fillStyle = colors.teal; ctx.fill();\n});\ntxt('run = 4', A.X(3), A.Y(1.5) + 38, '600 26px ' + FM, colors.burnt);\ntxt('rise = 2', A.X(5) + 16, A.Y(2.5), '600 26px ' + FM, colors.burnt, 'left');\ntxt('y = 0.5x + 1', A.X(3), OY - 4, 'italic 30px ' + FS, colors.teal);\ntxt('slope m = 2/4 = 0.5', A.X(2.6), OY + PH + 70, '600 28px ' + FM, colors.teal2);\nif (step >= 1) {\n  const B = frame(880, -0.4, 2.3, -1.4, 4.3);\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3.5;\n  ctx.beginPath();\n  ctx.moveTo(B.X(-0.2), B.Y(-1.4)); ctx.lineTo(B.X(2.2), B.Y(3.4));\n  ctx.stroke();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 4;\n  ctx.beginPath();\n  for (let p = 0; p <= 300; p++) {\n    const x = -0.4 + 2.45 * p / 300;\n    if (p) ctx.lineTo(B.X(x), B.Y(sqr(x))); else ctx.moveTo(B.X(x), B.Y(sqr(x)));\n  }\n  ctx.stroke();\n  ctx.beginPath(); ctx.arc(B.X(1), B.Y(1), 10, 0, 6.2832);\n  ctx.fillStyle = colors.red; ctx.fill();\n  txt('y = x' + '\\u00B2', B.X(0.35), OY - 4, 'italic 30px ' + FS, colors.teal);\n  txt('tangent at (1, 1)', B.X(1.1), B.Y(-0.7), '600 26px ' + FM, colors.red, 'left');\n  txt('up close, the curve looks like this line',\n    B.X(0.95), OY + PH + 70, '600 28px ' + FM, colors.red);\n}\n\\end{js}\n\n\\begin{itemize}[tight]\n\\item Every line is $y = mx + b$. For any two points on it, $m = (y_2 - y_1)/(x_2 - x_1)$, the rise over the run.\n\\pause\n\\item A curve is not a line. Zoom in at one of its points and it looks more and more like one, and the slope of that line is the slope of the curve at the point. Last time we found the slope of $3x^2 - 4$ at $x = 2$ to be $12$.\n\\item Zooming in at a point means looking only at $x$ close to that point. Making that precise is the business of today.\n\\end{itemize}\n\n\\section{Thinking Locally}\n\n\\slide{Bounded Intervals}\n\nAn \\emph{interval} is a set of numbers with no gaps: whenever two numbers belong to it, every number between them belongs to it as well.\n\nA \\accent{bounded} interval has two endpoints $a < b$. The brackets record which endpoints belong to the set: round for excluded, square for included.\n\n\\begin{js}[size=1680x560, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst LE = '\\u2264';\nconst ROWS = [\n  ['(1, 4)', '1 < x < 4', 'open', 0, 0],\n  ['(1, 4]', '1 < x ' + LE + ' 4', 'half-open', 0, 1],\n  ['[1, 4)', '1 ' + LE + ' x < 4', 'half-open', 1, 0],\n  ['[1, 4]', '1 ' + LE + ' x ' + LE + ' 4', 'closed', 1, 1]\n];\nconst LX = 760, UX = 158, Y0 = 96, RH = 128;\nfunction X(v) { return LX + v * UX; }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction axis(ay) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(-0.5), ay); ctx.lineTo(X(5.5), ay); ctx.stroke();\n  ctx.fillStyle = '#2b2b2b';\n  [[X(-0.5), 1], [X(5.5), -1]].forEach(function (q) {\n    ctx.beginPath();\n    ctx.moveTo(q[0], ay);\n    ctx.lineTo(q[0] + 18 * q[1], ay - 9);\n    ctx.lineTo(q[0] + 18 * q[1], ay + 9);\n    ctx.closePath(); ctx.fill();\n  });\n  for (let k = 0; k <= 5; k++) {\n    const x = X(k);\n    ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.6;\n    ctx.beginPath(); ctx.moveTo(x, ay - 10); ctx.lineTo(x, ay + 10); ctx.stroke();\n    txt(String(k), x, ay + 42, '22px ' + FM, '#8b9899', 'center');\n  }\n}\nfunction endpt(x, ay, closed) {\n  ctx.beginPath(); ctx.arc(x, ay, 11, 0, 6.2832);\n  if (closed) { ctx.fillStyle = colors.teal; ctx.fill(); }\n  else {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\n  }\n}\nfor (let i = 0; i < ROWS.length; i++) {\n  if (i > step) break;\n  const r = ROWS[i], ay = Y0 + i * RH;\n  axis(ay);\n  ctx.save();\n  ctx.globalAlpha = 0.38; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(1), ay - 22, X(4) - X(1), 44);\n  ctx.restore();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 6; ctx.lineCap = 'butt';\n  ctx.beginPath(); ctx.moveTo(X(1), ay); ctx.lineTo(X(4), ay); ctx.stroke();\n  endpt(X(1), ay, r[3]); endpt(X(4), ay, r[4]);\n  txt(r[0], 40, ay + 12, '600 38px ' + FM, colors.teal);\n  txt(r[1], 250, ay + 10, '30px ' + FM, '#444');\n  txt(r[2], 500, ay + 10, 'italic 30px ' + FS, colors.burnt);\n}\n\\end{js}\n\n\\slide{Unbounded Intervals}\n\nAn \\accent{unbounded} interval runs off the end of the line in one direction or in both. The symbols $-\\infty$ and $+\\infty$ mark the direction; they are not numbers, so they never get a square bracket.\n\n\\begin{js}[size=1680x620, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst LE = '\\u2264', GE = '\\u2265', IN = '\\u221E', MN = '\\u2212';\nconst ROWS = [\n  ['(2, +' + IN + ')', 'x > 2', 2, 1, 0],\n  ['[2, +' + IN + ')', 'x ' + GE + ' 2', 2, 1, 1],\n  ['(' + MN + IN + ', 3)', 'x < 3', 3, -1, 0],\n  ['(' + MN + IN + ', 3]', 'x ' + LE + ' 3', 3, -1, 1],\n  ['(' + MN + IN + ', +' + IN + ')', 'every x', 0, 0, 0]\n];\nconst LX = 760, UX = 158, Y0 = 84, RH = 118;\nfunction X(v) { return LX + v * UX; }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction head(x, ay, dir, col) {\n  ctx.fillStyle = col;\n  ctx.beginPath();\n  ctx.moveTo(x, ay);\n  ctx.lineTo(x - 18 * dir, ay - 9);\n  ctx.lineTo(x - 18 * dir, ay + 9);\n  ctx.closePath(); ctx.fill();\n}\nfunction axis(ay) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(-0.5), ay); ctx.lineTo(X(5.5), ay); ctx.stroke();\n  head(X(-0.5), ay, -1, '#2b2b2b'); head(X(5.5), ay, 1, '#2b2b2b');\n  for (let k = 0; k <= 5; k++) {\n    const x = X(k);\n    ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.6;\n    ctx.beginPath(); ctx.moveTo(x, ay - 10); ctx.lineTo(x, ay + 10); ctx.stroke();\n    txt(String(k), x, ay + 42, '22px ' + FM, '#8b9899', 'center');\n  }\n}\nfunction endpt(x, ay, closed) {\n  ctx.beginPath(); ctx.arc(x, ay, 11, 0, 6.2832);\n  if (closed) { ctx.fillStyle = colors.teal; ctx.fill(); }\n  else {\n    ctx.fillStyle = '#fff'; ctx.fill();\n    ctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\n  }\n}\nfor (let i = 0; i < ROWS.length; i++) {\n  if (i > step) break;\n  const r = ROWS[i], ay = Y0 + i * RH, dir = r[3];\n  axis(ay);\n  const x1 = dir === 0 ? X(-0.5) : X(r[2]);\n  const x2 = dir < 0 ? X(-0.5) : X(5.5);\n  ctx.save();\n  ctx.globalAlpha = 0.38; ctx.fillStyle = colors.gold;\n  ctx.fillRect(Math.min(x1, x2), ay - 22, Math.abs(x2 - x1), 44);\n  ctx.restore();\n  ctx.strokeStyle = colors.teal2; ctx.lineWidth = 6; ctx.lineCap = 'butt';\n  ctx.beginPath(); ctx.moveTo(x1, ay); ctx.lineTo(x2, ay); ctx.stroke();\n  if (dir >= 0) head(X(5.5), ay, 1, colors.teal2);\n  if (dir <= 0) head(X(-0.5), ay, -1, colors.teal2);\n  if (dir !== 0) endpt(X(r[2]), ay, r[4]);\n  txt(r[0], 40, ay + 12, '600 36px ' + FM, colors.teal);\n  txt(r[1], 300, ay + 10, '30px ' + FM, '#444');\n}\n\\end{js}\n\nThe last one is the whole line: $(-\\infty,+\\infty) = \\R$.\n\n\\slide{Neighborhoods}\n\n\\begin{definition}{Delta-neighborhood}\nLet $a$ be a number and let $\\delta > 0$. The $\\delta$-neighborhood of $a$ is the open interval\n$$(a - \\delta,\\; a + \\delta) \\;=\\; \\{\\, x : |x - a| < \\delta \\,\\}.$$\n\\end{definition}\n\n\\begin{js}[size=1680x290, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst D = '\\u03b4', MN = '\\u2212';\nconst AY = 104;\nconst CFG = [\n  { xl: -3.3, xr: 5.3, ticks: [-3, -2, -1, 0, 1, 2, 3, 4, 5], dp: 0,\n    lo: -1, hi: 3, c: 1, dl: D + ' = 2', clab: 'a = 1',\n    el: ['1 ' + MN + ' 2', '1 + 2'] },\n  { xl: 0.9755, xr: 1.0245, ticks: [0.98, 0.99, 1, 1.01, 1.02], dp: 2,\n    lo: 0.99, hi: 1.01, c: 1, dl: D + ' = 0.01', clab: 'a = 1',\n    el: ['1 ' + MN + ' 0.01', '1 + 0.01'] },\n  { xl: 2.15, xr: 3.85, ticks: [2.5, 3, 3.5], dp: 1,\n    lo: 2.5, hi: 3.5, c: 3, dl: D + ' = 0.5', clab: 'a = 3',\n    el: ['3 ' + MN + ' 0.5', '3 + 0.5'] },\n  { xl: -0.75, xr: 5.75, ticks: [0, 1, 2, 3, 4, 5], dp: 0,\n    lo: 0, hi: 5, c: 2.5, dl: '2.5', clab: 'center 2.5', el: null, extra: 1 }\n];\nconst g = CFG[step < 3 ? step : 3];\nconst UX = (w - 80) / (g.xr - g.xl);\nfunction X(v) { return 40 + (v - g.xl) * UX; }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction brace(x1, x2, y, lab, col) {\n  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(x1, y - 14); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 14);\n  ctx.stroke();\n  txt(lab, (x1 + x2) / 2, y + 40, '600 28px ' + FM, col);\n}\nctx.save();\nctx.globalAlpha = 0.4; ctx.fillStyle = colors.gold;\nctx.fillRect(X(g.lo), AY - 30, X(g.hi) - X(g.lo), 60);\nctx.restore();\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(X(g.xl), AY); ctx.lineTo(X(g.xr), AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[X(g.xl), 1], [X(g.xr), -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 18 * q[1], AY - 9);\n  ctx.lineTo(q[0] + 18 * q[1], AY + 9);\n  ctx.closePath(); ctx.fill();\n});\ng.ticks.forEach(function (k) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.6;\n  ctx.beginPath(); ctx.moveTo(X(k), AY - 10); ctx.lineTo(X(k), AY + 10); ctx.stroke();\n  txt(k.toFixed(g.dp).replace('-', MN), X(k), AY + 46, '22px ' + FM, '#8b9899');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 6; ctx.lineCap = 'butt';\nctx.beginPath(); ctx.moveTo(X(g.lo), AY); ctx.lineTo(X(g.hi), AY); ctx.stroke();\n[g.lo, g.hi].forEach(function (v, i) {\n  ctx.beginPath(); ctx.arc(X(v), AY, 11, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\n  if (g.el) txt(g.el[i], X(v), AY - 34, 'italic 28px ' + FS, colors.teal);\n});\nctx.beginPath(); ctx.arc(X(g.c), AY, 10, 0, 6.2832);\nctx.fillStyle = colors.teal2; ctx.fill();\ntxt(g.clab, X(g.c), AY - 36, '600 30px ' + FM, colors.teal2);\nbrace(X(g.lo), X(g.c), AY + 84, g.dl, colors.burnt);\nbrace(X(g.c), X(g.hi), AY + 84, g.dl, colors.burnt);\nif (g.extra !== undefined) {\n  ctx.beginPath(); ctx.arc(X(g.extra), AY, 10, 0, 6.2832);\n  ctx.fillStyle = colors.red; ctx.fill();\n  txt('1', X(g.extra), AY - 36, '600 30px ' + FM, colors.red);\n}\n\\end{js}\n\n\\begin{itemize}[tight]\n\\item $(-1,3) = (1 - 2,\\, 1 + 2)$ is the $2$-neighborhood of $1$.\n\\pause\n\\item $(0.99,\\,1.01) = (1 - 0.01,\\, 1 + 0.01)$ is the $0.01$-neighborhood of $1$.\n\\pause\n\\item $(2.5,\\,3.5) = (3 - 0.5,\\, 3 + 0.5)$ is the $0.5$-neighborhood of $3$.\n\\pause\n\\item $(0,5)$ is \\alert{not} a $\\delta$-neighborhood of $1$, even though $1$ belongs to it. Its center is $2.5$, so it is the $2.5$-neighborhood of $2.5$.\n\\end{itemize}\n\n\\slide{Separating Two Numbers}\n\nTwo different numbers have neighborhoods with nothing in common.\n\n\\begin{theorem}{Separation}\nIf $a \\neq b$, then there is a $\\delta > 0$ such that no number belongs to the $\\delta$-neighborhood of $a$ and to the $\\delta$-neighborhood of $b$.\n\\end{theorem}\n\n\\begin{js}[size=1680x410, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst D = '\\u03b4', MN = '\\u2212';\nconst AY = 170, XA = 760, XB = 1240, HALF = (XB - XA) / 2;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction dot(x, col) {\n  ctx.beginPath(); ctx.arc(x, AY, 10, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nfunction band(cx, r, fill, edge, lab) {\n  ctx.save();\n  ctx.globalAlpha = 0.4; ctx.fillStyle = fill;\n  ctx.fillRect(cx - r, AY - 36, 2 * r t(X(1) - 4, AY - 30, 8, 60);\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(X(XL), AY); ctx.lineTo(X(XR), AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[X(XL), 1], [X(XR), -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 18 * q[1], AY - 9);\n  ctx.lineTo(q[0] + 18 * q[1], AY + 9);\n  ctx.closePath(); ctx.fill();\n});\n[0, 0.5, 1, 1.5, 2].forEach(function (k) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.6;\n  ctx.beginPath(); ctx.moveTo(X(k), AY - 10); ctx.lineTo(X(k), AY + 10); ctx.stroke();\n  txt(k.toFixed(1), X(k), AY + 46, '22px ' + FM, '#8b9899');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 6; ctx.lineCap = 'butt';\nctx.beginPath();\nctx.moveTo(X(0.5), AY); ctx.lineTo(X(1), AY);\nctx.moveTo(X(1), AY); ctx.lineTo(X(1.5), AY);\nctx.stroke();\nhollow(X(0.5), colors.teal); hollow(X(1.5), colors.teal);\nhollow(X(1), colors.red);\ntxt('a = 1', X(1), AY - 40, '600 30px ' + FM, colors.red);\ntxt('a ' + MN + ' ' + D, X(0.5), AY - 40, 'italic 28px ' + FS, colors.teal);\ntxt('a + ' + D, X(1.5), AY - 40, 'italic 28px ' + FS, colors.teal);\ntxt('the center is not in the set', X(1), AY + 106, 'italic 30px ' + FS, colors.burnt);\n\\end{js}\n\nThe union symbol $\\cup$ collects the numbers lying in either piece, so the deleted neighborhood is everything within $\\delta$ of $a$ apart from $a$ itself.\n\nA property holds \\accent{nearby $a$} if it holds on some deleted neighborhood, whether or not it holds at $a$. Limits are built on exactly this kind of statement.\n\n\\slide{Every Measurement is a Neighborhood}\n\nAn instrument never hands you a point of the number line. It hands you a reading $r$ together with a resolution $\\delta$, and the claim it makes is $|x - r| < \\delta$: the length lies in a $\\delta$-neighborhood of $r$.\n\n\\begin{js}[size=1680x430, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia if (canvas.__eps === undefined) canvas.__eps = E0;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction findDelta(eps) {\n  const N = 1500;\n  let dl = MAXD, dr = MAXD;\n  for (let i = 1; i <= N; i++) {\n    const t = MAXD * i / N;\n    if (Math.abs(f(A + t) - L) >= eps) { dr = t; break; }\n  }\n  for (let i = 1; i <= N; i++) {\n    const t = MAXD * i / N;\n    if (Math.abs(f(A - t) - L) >= eps) { dl = t; break; }\n  }\n  return Math.min(dl, dr) * 0.985;\n}\nfunction draw() {\n  const eps = canvas.__eps, d = findDelta(eps);\n  ctx.clearRect(0, 0, w, h);\n  ctx.save();\n  ctx.globalAlpha = 0.34; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(XL), Y(L + eps), PW, Y(L - eps) - Y(L + eps));\n  ctx.fillStyle = colors.blue3;\n  ctx.fillRect(X(A - d), Y(YT), X(A + d) - X(A - d), PH);\n  ctx.restore();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2;\n  ctx.setLineDash([7, 7]);\n  [L - eps, L + eps].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(X(XL), Y(v)); ctx.lineTo(X(XR), Y(v)); ctx.stroke();\n  });\n  ctx.strokeStyle = colors.blue;\n  [A - d, A + d].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(X(v), Y(YB)); ctx.lineTo(X(v), Y(YT)); ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(XL), Y(YB)); ctx.lineTo(X(XL), Y(YT));\n  ctx.moveTo(X(XL), Y(YB)); ctx.lineTo(X(XR), Y(YB));\n  ctx.stroke();\n  txt('L', X(XL) - 12, Y(L) + 8, '600 26px ' + FM, colors.teal, 'right');\n  txt('a', X(A), Y(YB) + 32, '600 26px ' + FM, colors.teal, 'center');\n  if (Y(L - eps) - Y(L + eps) > 62) {\n    txt('L + ' + EPS, X(XL) - 12, Y(L + eps) + 8, '24px ' + FM, colors.burnt, 'right');\n    txt('L ' + MN + ' ' + EPS, X(XL) - 12, Y(L - eps) + 8, '24px ' + FM, colors.burnt, 'right');\n  }\n  if (X(A) - X(A - d) > 108) {\n    txt('a ' + MN + ' ' + DEL, X  ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(TX0, TY); ctx.lineTo(TX1, TY); ctx.stroke();\n  const u = Math.log(eps / E_MIN) / Math.log(E_MAX / E_MIN);\n  ctx.strokeStyle = colors.burnt;\n  ctx.beginPath(); ctx.moveTo(TX0, TY); ctx.lineTo(TX0 + u * (TX1 - TX0), TY); ctx.stroke();\n  ctx.beginPath(); ctx.arc(TX0 + u * (TX1 - TX0), TY, 16, 0, 6.2832);\n  ctx.fillStyle = colors.burnt; ctx.fill();\n  ctx.fillStyle = '#fff';\n  ctx.beginPath(); ctx.arc(TX0 + u * (TX1 - TX0), TY, 6, 0, 6.2832); ctx.fill();\n  txt(EPS, TX0 - 16, TY + 11, '600 30px ' + FM, colors.burnt, 'right');\n  txt('drag to change ' + EPS, TX1, TY + 38, '22px ' + FM, '#8b9899', 'right');\n  txt(READOUT(eps, d), TX0 + (TX1 - TX0) / 2, TY - 34, '600 26px ' + FM, colors.teal, 'center');\n}\ncanvas.__draw = draw;\nif (!canvas.__wired) {\n  canvas.__wired = true;\n  canvas.style.cursor = 'ew-resize';\n  canvas.style.touchAction = 'none';\n  const setEps = function (ev) {\n    const r = canvas.getBoundingClientRect();\n    const px = (ev.clientX - r.left) / r.width * w;\n    const t = (px - TX0) / (TX1 - TX0);\n    canvas.__eps = E_MIN * Math.pow(E_MAX / E_MIN, Math.max(0, Math.min(1, t)));\n    if (canvas.__draw) canvas.__draw();\n  };\n  canvas.addEventListener('pointerdown', function (ev) {\n    canvas.__drag = true;\n    if (canvas.setPointerCapture) canvas.setPointerCapture(ev.pointerId);\n    setEps(ev); ev.preventDefault();\n  });\n  canvas.addEventListener('pointermove', function (ev) { if (canvas.__drag) setEps(ev); });\n  canvas.addEventListener('pointerup', function () { canvas.__drag = false; });\n  canvas.addEventListener('pointercancel', function () { canvas.__drag = false; });\n}\ndraw();\n\\end{js}\n\\columnbreak\n\n$g(x) = 2x$ when $x$ is not an integer.\n\n$g(x) = 0$ when $x$ is an integer.\n\n\\medskip\n\nThe definition asks about $x$ with $0 < |x-3| < \\delta$, and $x = 3$ is not one of them. As long as $\\delta \\leq 1$, no other integer is in range either, hence\n$$\\accent{\\lim_{x \\to 3} g(x) = 6}$$\neven though $g(3) = 0$.\n\\end{twocol}\n\n\\slide{A Limit by Algebra}\n\n$$h(x) = \\frac{2x^2 - 6x}{x - 3}$$\n\nAt $x = 3$ the denominator is $0$, hence $h(3)$ is not defined. The limit asks about $x$ nearby $3$ and never about $x = 3$ itself.\n\n\\pause\n\n\\begin{align}\nh(x) &= \\frac{2x(x-3)}{x-3}\n\\pause\n\\phantom{h(x)} &= 2x \\quad\\text{for all } x \\neq 3\n\\end{align}\n\n\\pause\n\nCancelling $x - 3$ is legitimate exactly because $x \\neq 3$ on a deleted neighborhood of $3$, where $x - 3$ is not zero. On such a neighborhood $h$ agrees with $2x$, and the previous example gives $\\accent{\\displaystyle\\lim_{x \\to 3} h(x) = 6}$.\n\n\\slide{The Graph of $h$}\n\n\\begin{js}[size=940x480]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst XL = -0.3, XR = 5.2, YB = -0.8, YT = 10.6, PAD = 62;\nfunction X(v) { return PAD + (v - XL) / (XR - XL) * (w - 2 * PAD); }\nfunction Y(v) { return (h - PAD) - (v - YB) / (YT - YB) * (h - 2 * PAD); }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nctx.strokeStyle = '#DEE6E7'; ctx.lineWidth = 1;\n[2, 4, 6, 8, 10].forEach(function (k) {\n  ctx.beginPath(); ctx.moveTo(X(XL), Y(k)); ctx.lineTo(X(XR), Y(k)); ctx.stroke();\n});\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\nctx.stroke();\n[1, 2, 3, 4, 5].forEach(function (k) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(X(k), Y(0) - 8); ctx.lineTo(X(k), Y(0) + 8); ctx.stroke();\n  txt(String(k), X(k), Y(0) + 34, '22px ' + FM, '#8b9899');\n});\n[2, 4, 6, 8, 10].forEach(function (k) {\n  txt(String(k), X(0) - 16, Y(k) + 8, '22px ' + FM, '#8b9899', 'right');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 4; ctx.lineCap = 'round';\nctx.beginPath();\nctx.moveTo(X(XL), Y(2 * XL)); ctx.lineTo(X(5.15), Y(10.3));\nctx.stroke();\nctx.beginPath(); ctx.arc(X(3), Y(6), 11, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.red; ctx.lineWidth = 4; ctx.stroke();\ntxt('no point here', X(3) + 28, Y(6) + 44, '600 26px ' + FM, colors.red, 'left');\ntxt('the line y = 2x with one point missing', w / 2, h - 16, 'italic 30px ' + FS, '#5c6a6b');\n\\end{js}\n\n\\slide{Guessing From a Table}\n\n$$f(x) = \\frac{\\sin x}{x} \\qquad\\qquad \\accent{\\lim_{x \\to 0} \\frac{\\sin x}{x} \\;=\\; ?}$$\n\nNo algebra removes the difficulty at $x = 0$, where $f$ is not defined. When we do not know where to start, evaluate at points nearby $0$ and look for a pattern.\n\n\\begin{js}[size=1240x380, frames=5]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212';\nconst ROWS = [\n  ['1', '0.8414710'],\n  ['0.5', '0.9588511'],\n  ['0.1', '0.9983342'],\n  ['0.01', '0.9999833'],\n  ['0.001', '0.9999998']\n];\nconst CX = [150, 430, 810, 1090], HY = 56, RY = 118, RH = 50;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\ntxt('x', CX[0], HY, 'italic 30px ' + FS, colors.teal2);\ntxt('sin(x) / x', CX[1], HY, '28px ' + FM, colors.teal2);\ntxt('x', CX[2], HY, 'italic 30px ' + FS, colors.teal2);\ntxt('sin(x) / x', CX[3], HY, '28px ' + FM, colors.teal2);\nctx.strokeStyle = colors.teal3; ctx.lineWidth = 2;\nctx.beginPath(); ctx.moveTo(40, HY + 20); ctx.lineTo(560, HY + 20); ctx.stroke();\nctx.beginPath(); ctx.moveTo(700, HY + 20); ctx.lineTo(1220, HY + 20); ctx.stroke();\nctx.strokeStyle = '#DEE6E7'; ctx.lineWidth = 1;\nctx.beginPath(); ctx.moveTo(630, 26); ctx.lineTo(630, RY + 4.6 * RH); ctx.stroke();\nfor (let i = 0; i < ROWS.length; i++) {\n  if (i > step) break;\n  const y = RY + i * RH, hot = (i === step);\n  if (hot) {\n    ctx.save();\n    ctx.globalAlpha = 0.4; ctx.fillStyle = colors.gold;\n    ctx.fillRect(40, y - 32, 520, 44);\n    ctx.fillRect(700, y - 32, 520, 44);\n    ctx.restore();\n  }\n  txt(MN + ROWS[i][0], CX[0], y, '30px ' + FM, '#111');\n  txt(ROWS[i][1], CX[1], y, '30px ' + FM, colors.teal);\n  txt(ROWS[i][0], CX[2], y, '30px ' + FM, '#111');\n  txt(ROWS[i][1], CX[3], y, '30px ' + FM, colors.teal);\n}\n\\end{js}\n\n\\uncover<4->{The values crowd around $1$ from both sides, which is evidence for $\\accent{\\displaystyle\\lim_{x \\to 0} \\frac{\\sin x}{x} = 1}$. That is the right answer, but a table is not a proof.}\n\n\\slide{The Heaviside Function}\n\n\\begin{definition}{Heaviside function}\n$H(x) = 0$ for $x < 0$, and $H(x) = 1$ for $x \\geq 0$. It is the simplest model of a switch turning on at time $0$.\n\\end{definition}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x430, frames=3]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212';\nconst D = '\\u03b4';\nconst XL = -2.1, XR = 2.1, YB = -0.55, YT = 1.65, PAD = 56;\nfunction X(v) { return PAD + (v - XL) / (XR - XL) * (w - 2 * PAD); }\nfunction Y(v) { return (h - PAD) - (v - YB) / (YT - YB) * (h - 2 * PAD); }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nif (step >= 1) {\n  const d = step === 1 ? 1.1 : 0.35;\n  ctx.save();\n  ctx.globalAlpha = 0.4; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(-d), Y(YT), X(d) - X(-d), Y(YB) - Y(YT));\n  ctx.restore();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5;\n  ctx.setLineDash([7, 7]);\n  [-d, d].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(X(v), Y(YT)); ctx.lineTo(X(v), Y(YB)); ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  txt(MN + D, X(-d), Y(YB) + 32, '26px ' + FM, colors.burnt);\n  txt(D, X(d), Y(YB) + 32, '26px ' + FM, colors.burnt);\n}\nif (step >= 2) {\n  ctx.save();\n  ctx.globalAlpha = 0.32; ctx.fillStyle = colors.blue3;\n  ctx.fillRect(X(XL), Y(0.4), X(XR) - X(XL), Y(-0.4) - Y(0.4));\n  ctx.fillRect(X(XL), Y(1.4), X(XR) - X(XL), Y(0.6) - Y(1.4));\n  ctx.restore();\n  ctx.strokeStyle = colors.blue; ctx.lineWidth = 2;\n  [-0.4, 0.4, 0.6, 1.4].forEach(function (v) {\n    ctx.beginPath(); ctx.moveTo(X(XL), Y(v)); ctx.lineTo(X(XR), Y(v)); ctx.stroke();\n  });\n  txt('within 0.4 of 1', X(XR) - 12, Y(1.22), '600 22px ' + FM, colors.blue, 'right');\n  txt('within 0.4 of 0', X(XR) - 12, Y(0.22), '600 22px ' + FM, colors.blue, 'right');\n  txt('no L is in both strips', X(-1.15), Y(0.5) + 8, '600 24px ' + FM, colors.red, 'center');\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\nctx.stroke();\ntxt('1', PAD - 14, Y(1) + 8, '22px ' + FM, '#8b9899', 'right');\n[-2, -1, 1, 2].forEach(function (k) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(X(k), Y(0) - 8); ctx.lineTo(X(k), Y(0) + 8); ctx.stroke();\n  txt(String(k).replace('-', MN), X(k), Y(0) + 32, '22px ' + FM, '#8b9899');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'butt';\nctx.beginPath(); ctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(0), Y(0)); ctx.stroke();\nctx.beginPath(); ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(XR), Y(1)); ctx.stroke();\nctx.beginPath(); ctx.arc(X(0), Y(0), 10, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\nctx.beginPath(); ctx.arc(X(0), Y(1), 10, 0, 6.2832);\nctx.fillStyle = colors.teal; ctx.fill();\nif (step === 0) {\n  txt('H = 0 here', X(-1.1), Y(0) - 26, '600 26px ' + FM, colors.red);\n  txt('H = 1 here', X(1.1), Y(1) + 42, '600 26px ' + FM, colors.red);\n}\nif (step >= 1) {\n  const d = step === 1 ? 1.1 : 0.35;\n  [[-d / 2, 0], [d / 2, 1]].forEach(function (q) {\n    ctx.beginPath(); ctx.arc(X(q[0]), Y(q[1]), 9, 0, 6.2832);\n    ctx.fillStyle = colors.red; ctx.fill();\n  });\n}\n\\end{js}\n\\columnbreak\n\n$$\\accent{\\lim_{x \\to 0} H(x) \\;=\\; ?}$$\n\n\\uncover<1->{However small $\\delta$ is, the deleted neighborhood of $0$ holds numbers where $H = 0$ and numbers where $H = 1$.}\n\n\\uncover<2->{Take $\\varepsilon = 0.4$. A limit $L$ would have to satisfy $|0 - L| < 0.4$ and $|1 - L| < 0.4$ at the same time, and no number is within $0.4$ of both $0$ and $1$.}\n\n\\uncover<2->{Hence $H$ has no limit at $0$. Shrinking $\\delta$ never helps, because the trouble is a gap in the values, not the size of the neighborhood.}\n\\end{twocol}\n\n\\slide{One-Sided Limits}\n\n\\begin{definition}{One-sided limits}\n$\\accent{\\displaystyle\\lim_{x \\to a^+} f(x) = L}$ means: for every $\\varepsilon > 0$ there is a $\\delta > 0$ with $|f(x) - L| < \\varepsilon$ for all $x$ satisfying $0 < x - a < \\delta$.\n\n$\\accent{\\displaystyle\\lim_{x \\to a^-} f(x) = L}$ means the same with $0 < a - x < \\delta$.\n\\end{definition}\n\nOnly half of the deleted neighborhood is used: $(a, a+\\delta)$ on the right, $(a-\\delta, a)$ on the left.\n\n\\begin{js}[size=1680x230]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst D = '\\u03b4', MN = '\\u2212';\nconst AY = 96, XA = 840, R = 320;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\n[[XA - R, XA, colors.gold, colors.burnt, 'left'], [XA, XA + R, colors.blue3, colors.blue, 'right']].forEach(function (q) {\n  ctx.save();\n  ctx.globalAlpha = 0.4; ctx.fillStyle = q[2];\n  ctx.fillRect(q[0], AY - 30, q[1] - q[0], 60);\n  ctx.restore();\n  txt(q[4], (q[0] + q[1]) / 2, AY + 96, 'italic 30px ' + FS, q[3]);\n});\nctx.fillStyle = '#fff'; ctx.fillRect(XA - 4, AY - 30, 8, 60);\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\n[[XA - R, 'a ' + MN + ' ' + D, colors.burnt], [XA + R, 'a + ' + D, colors.blue]].forEach(function (q) {\n  ctx.beginPath(); ctx.arc(q[0], AY, 11, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.strokeStyle = q[2]; ctx.lineWidth = 3.5; ctx.stroke();\n  txt(q[1], q[0], AY - 40, 'italic 28px ' + FS, q[2]);\n});\nctx.beginPath(); ctx.arc(XA, AY, 11, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\ntxt('a', XA, AY - 40, 'italic 600 32px ' + FS, colors.teal);\n\\end{js}\n\nThe two-sided limit exists exactly when both one-sided limits exist and are equal, and then all three are the same number.\n\n\\slide{Heaviside Again}\n\n\\begin{twocol}[3 2]\n\\begin{js}[size=940x400, frames=2]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst D = '\\u03b4', MN = '\\u2212';\nconst XL = -2.1, XR = 2.1, YB = -0.55, YT = 1.65, PAD = 56;\nfunction X(v) { return PAD + (v - XL) / (XR - XL) * (w - 2 * PAD); }\nfunction Y(v) { return (h - PAD) - (v - YB) / (YT - YB) * (h - 2 * PAD); }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nconst d = 0.8;\nctx.save();\nctx.globalAlpha = 0.4; ctx.fillStyle = colors.gold;\nctx.fillRect(X(-d), Y(YT), X(0) - X(-d), Y(YB) - Y(YT));\nif (step >= 1) {\n  ctx.fillStyle = colors.blue3;\n  ctx.fillRect(X(0), Y(YT), X(d) - X(0), Y(YB) - Y(YT));\n}\nctx.restore();\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\nctx.stroke();\ntxt('1', PAD - 14, Y(1) + 8, '22px ' + FM, '#8b9899', 'right');\n[-2, -1, 1, 2].forEach(function (k) {\n  txt(String(k).replace('-', MN), X(k), Y(0) + 32, '22px ' + FM, '#8b9899');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 5; ctx.lineCap = 'butt';\nctx.beginPath(); ctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(0), Y(0)); ctx.stroke();\nctx.beginPath(); ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(XR), Y(1)); ctx.stroke();\nctx.beginPath(); ctx.arc(X(0), Y(0), 10, 0, 6.2832);\nctx.fillStyle = '#fff'; ctx.fill();\nctx.strokeStyle = colors.teal; ctx.lineWidth = 3.5; ctx.stroke();\nctx.beginPath(); ctx.arc(X(0), Y(1), 10, 0, 6.2832);\nctx.fillStyle = colors.teal; ctx.fill();\ntxt('from the left: 0', X(-d) - 10, Y(0) - 26, '600 24px ' + FM, colors.burnt, 'left');\nif (step >= 1) txt('from the right: 1', X(0) + 16, Y(1) + 42, '600 24px ' + FM, colors.blue, 'left');\n\\end{js}\n\\columnbreak\n\n$$\\accent{\\lim_{x \\to 0^-} H(x) = 0}$$\n\n\\uncover<1->{$$\\accent{\\lim_{x \\to 0^+} H(x) = 1}$$}\n\n\\uncover<1->{Each one-sided limit exists, and each is easy: on $(-\\delta, 0)$ the function is exactly $0$, and on $(0, \\delta)$ it is exactly $1$.}\n\n\\uncover<1->{They are different numbers, hence $H$ has no limit at $0$.}\n\\end{twocol}\n\n\\slide{When the Table Lies}\n\n$$p(x) = \\sin(\\pi/x) \\qquad\\qquad \\accent{\\lim_{x \\to 0} \\sin(\\pi/x) \\;=\\; ?}$$\n\n\\begin{twocol}[1 1]\n\\begin{table}\n$x$ & $p(x)$\n$1$ & $0$\n$1/10 = 0.1$ & $0$\n$1/100 = 0.01$ & $0$\n$1/1000 = 0.001$ & $0$\n\\end{table}\n\nEvery value is $0$, and it looks like the limit is $0$.\n\\columnbreak\n\\pause\n\\begin{table}\n$x$ & $p(x)$\n$2/5 = 0.4$ & $1$\n$2/41 = 0.04878\\ldots$ & $1$\n$2/401 = 0.004987\\ldots$ & $1$\n$2/4001 = 0.0004998\\ldots$ & $1$\n\\end{table}\n\nEvery value is $1$, and it looks like the limit is $1$.\n\\end{twocol}\n\n\\pause\n\nBoth tables are correct, and in the second the fractions are exact while their decimals are cut off. In the first, $\\pi/x$ is a whole multiple of $\\pi$; in the second, $x = 2/(4k+1)$ and $\\pi/x$ lands on $\\pi/2$ plus a whole multiple of $2\\pi$. No single $L$ can be the limit, hence $p$ has no limit at $0$.\n\n\\slide{The Graph of $\\sin(\\pi/x)$}\n\n\\begin{js}[size=1560x460]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212';\nconst XL = -0.55, XR = 0.55, YB = -1.35, YT = 1.35, PAD = 56;\nfunction X(v) { return PAD + (v - XL) / (XR - XL) * (w - 2 * PAD); }\nfunction Y(v) { return (h - PAD) - (v - YB) / (YT - YB) * (h - 2 * PAD); }\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\nctx.beginPath();\nctx.moveTo(X(XL), Y(0)); ctx.lineTo(X(XR), Y(0));\nctx.moveTo(X(0), Y(YB)); ctx.lineTo(X(0), Y(YT));\nctx.stroke();\n[-1, 1].forEach(function (k) {\n  txt(String(k).replace('-', MN), PAD - 14, Y(k) + 8, '22px ' + FM, '#8b9899', 'right');\n});\n[-0.5, -0.25, 0.25, 0.5].forEach(function (k) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(X(k), Y(0) - 8); ctx.lineTo(X(k), Y(0) + 8); ctx.stroke();\n  txt(k.toFixed(2).replace('-', MN), X(k), Y(0) + 34, '22px ' + FM, '#8b9899');\n});\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 1.6; ctx.lineCap = 'round';\nctx.beginPath();\nlet pen = false;\nfor (let p = 0; p <= 12000; p++) {\n  const x = XL + (XR - XL) * p / 12000;\n  if (Math.abs(x) < 0.0035) { pen = false; continue; }\n  const y = Math.sin(Math.PI / x);\n  if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n}\nctx.stroke();\n[0.5, 0.25, 0.125, 0.1].forEach(function (v) {\n  ctx.beginPath(); ctx.arc(X(v), Y(0), 9, 0, 6.2832);\n  ctx.fillStyle = colors.blue; ctx.fill();\n});\n[0.4, 2 / 9, 2 / 13, 2 / 17].forEach(function (v) {\n  ctx.beginPath(); ctx.arc(X(v), Y(1), 9, 0, 6.2832);\n  ctx.fillStyle = colors.red; ctx.fill();\n});\ntxt('p(x) = 0 at x = 1/n', X(0.42), Y(0) + 60, '600 24px ' + FM, colors.blue, 'center');\ntxt('p(x) = 1 at x = 2/(4k+1)', X(0.33), Y(1) - 26, '600 24px ' + FM, colors.red, 'center');\ntxt('the oscillation never settles down', w / 2, h - 12, 'italic 30px ' + FS, '#5c6a6b');\n\\end{js}\n\n\\slide{Limits That Run Away: $1/x^2$}\n\n\\begin{definition}{Infinite limit}\n$\\accent{\\displaystyle\\lim_{x \\to a} f(x) = +\\infty}$ means: for every height $M$ there is a $\\delta > 0$ such that $f(x) > M$ for all $x$ with $0 < |x - a| < \\delta$. Replacing $f(x) > M$ by $f(x) < -M$ gives $-\\infty$.\n\\end{definition}\n\n\\begin{js}[size=1020x520]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst DEL = '\\u03b4', MN = '\\u2212';\nfunction f(x) { return 1 / (x * x); }\nfunction SKIP(x) { return Math.abs(x) < 1e-6; }\nfunction BIG(y, M) { return y > M; }\nconst ONESIDED = false, A = 0;\nconst XL = -0.75, XR = 0.75, YB = 0, YT = 150, AXIS_Y = 0;\nconst M_MIN = 6, M_MAX = 130, M0 = 25, MAXD = 0.75;\nconst XTICKS = [-0.5, -0.25, 0.25, 0.5], DEL_DY = -20;\nfunction TSTEP(i, N) { return MAXD * i / N; }\nfunction XSAMPLE(p, n) { return XL + (XR - XL) * p / n; }\nfunction BAR_Y(M) { return M; }\nfunction BAR_TOP(M) { return Y(YT); }\nfunction BAR_H(M) { return Y(M) - Y(YT); }\nfunction BAR_LABEL(M) { return 'y = M'; }\nfunction ARROWS() {\n  const xe = 1 / Math.sqrt(YT);\n  ctx.fillStyle = colors.teal2;\n  [-xe, xe].forEach(function (v) {\n    ctx.beginPath();\n    ctx.moveTo(X(v), Y(YT) - 4);\n    ctx.lineTo(X(v) - 11, Y(YT) + 20);\n    ctx.lineTo(X(v) + 11, Y(YT) + 20);\n    ctx.closePath(); ctx.fill();\n  });\n}\nfunction NUM(v) { return v < 0.1 ? v.toFixed(3) : v.toFixed(2); }\nfunction READOUT(M, d) {\n  return 'M = ' + M.toFixed(0) + '    ' + DEL + ' = ' + NUM(d) + '    f(x) > M whenever 0 < |x| < ' + DEL;\n}\nconst P_L = 118, P_R = 34, P_T = 34, P_B = 150;\nconst PW = w - P_L - P_R, PH = h - P_T - P_B;\nfunction X(v) { return P_L + (v - XL) / (XR - XL) * PW; }\nfunction Y(v) { return P_T + PH - (v - YB) / (YT - YB) * PH; }\nconst TX0 = P_L, TX1 = w - P_R, TY = h - 54;\nif (canvas.__M === undefined) canvas.__M = M0;\nfunction txt(s, x, y, font, col, align) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction findDelta(M) {\n  const N = 2000;\n  let dl = MAXD, dr = MAXD;\n  for (let i = 1; i <= N; i++) {\n    const t = TSTEP(i, N);\n    if (!BIG(f(A + t), M)) { dr = t; break; }\n  }\n  for (let i = 1; i <= N; i++) {\n    const t = TSTEP(i, N);\n    if (!ONESIDED && !BIG(f(A - t), M)) { dl = t; break; }\n  }\n  if (ONESIDED) dl = 0;\n  return (ONESIDED ? dr : Math.min(dl, dr)) * 0.985;\n}\nfunction draw() {\n  const M = canvas.__M, d = findDelta(M);\n  ctx.clearRect(0, 0, w, h);\n  ctx.save();\n  ctx.globalAlpha = 0.3; ctx.fillStyle = colors.gold;\n  ctx.fillRect(X(XL), BAR_TOP(M), PW, BAR_H(M));\n  ctx.fillStyle = colors.blue3;\n  ctx.fillRect(X(ONESIDED ? A : A - d), Y(YT), X(A + d) - X(ONESIDED ? A : A - d), PH);\n  ctx.restore();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5;\n  ctx.setLineDash([7, 7]);\n  ctx.beginPath(); ctx.moveTo(X(XL), Y(BAR_Y(M))); ctx.lineTo(X(XR), Y(BAR_Y(M))); ctx.stroke();\n  ctx.strokeStyle = colors.blue; ctx.lineWidth = 2.5;\n  [A - d, A + d].forEach(function (v) {\n    if (ONESIDED && v < A) return;\n    ctx.beginPath(); ctx.moveTo(X(v), Y(YB)); ctx.lineTo(X(v), Y(YT)); ctx.stroke();\n  });\n  ctx.setLineDash([]);\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(X(XL), Y(AXIS_Y)); ctx.lineTo(X(XR), Y(AXIS_Y));\n  ctx.moveTo(X(A), Y(YB)); ctx.lineTo(X(A), Y(YT));\n  ctx.stroke();\n  txt(BAR_LABEL(M), X(XL) - 14, Y(BAR_Y(M)) + 8, '26px ' + FM, colors.burnt, 'right');\n
