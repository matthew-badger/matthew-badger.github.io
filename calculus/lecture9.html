ut = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 1);\nclip();\npath((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, 2 * Math.PI, colors.curve, 5);\nctx.restore();\nif (local >= 1) { dot(3, 4, colors.c1, 11); tag('(3, 4)', X(3) + 18, Y(4) - 14, colors.c1); }\nif (local >= 2) {\n  ctx.strokeStyle = colors.alert; ctx.lineWidth = 4; ctx.fillStyle = colors.background;\n  ctx.beginPath(); ctx.arc(X(2), Y(3), 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  tag('(2, 3)', X(2) - 18, Y(3) + 46, colors.alert, 'right');\n}\n\\end{js}\n\\end{columns}\n\n\\slide{The Circle Is Not the Graph of One Function}\n\\begin{columns}[6 6, parallel]\nA vertical line can meet the circle at \\textbf{two} points. The circle is not the graph of a single function of $x$.\n\n\\begin{uncover}<1->\nSolve the equation for $y$:\n$$y^2=25-x^2,\\qquad y=\\pm\\sqrt{25-x^2}.$$\n\\end{uncover}\n\\begin{uncover}<2->\nThe circle is covered by \\textbf{two} graphs:\n$$\\textcolor{c1}{f(x)=\\sqrt{25-x^2}}$$\n$$\\textcolor{c2}{g(x)=-\\sqrt{25-x^2}}$$\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=780x700, frames=3, alt=\"The circle of radius 5 with the vertical line x = 3, which meets the circle at (3, 4) and (3, -4). Then the upper semicircle is drawn in one color and labeled y = f(x), and th = hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 1);\nclip();\nif (local >= 2) {\n  path((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, Math.PI, colors.c1, 6);\n  path((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), Math.PI, 2 * Math.PI, colors.c2, 6);\n} else {\n  path((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, 2 * Math.PI, colors.curve, 5);\n}\nseg(3, y0, 3, y1, colors.muted, 3, [10, 8]);\nctx.restore();\ndot(3, 4, colors.ink, 9); dot(3, -4, colors.ink, 9);\nif (local >= 2) {\n  tag('y = f(x)', X(-6.8), Y(5.5), colors.c1);\n  tag('y = g(x)', X(-6.8), Y(-5.3), colors.c2);\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Explicit and Implicit}\n\\begin{columns}[7 5]\n\\begin{definition}{Two Ways to Describe a Function}\nA function is defined \\textbf{explicitly} when we are given a formula \\({y=f(x)}\\).\n\nA function $f$ is defined \\textbf{implicitly} by an equation in $x$ and $y$ when the graph of $f$ is part of the locus of the equation.\n\\end{definition}\nThe equation \\({x^2+y^2=25}\\) defines \\({\\textcolor{c1}{f(x)=\\sqrt{25-x^2}}}\\) implicitly:\n$$x^2+\\big(f(x)\\big)^2=25\\quad\\text{for all }{-5}\\leq x\\leq5.$$\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The circle of radius 5 drawn as a dashed curve, with the upper semicircle, the graph of f, drawn solid on top of it.\"]\nconst font = ing(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 5);\nclip();\npath((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, 2 * Math.PI, colors.muted, 3, [10, 8]);\npath((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, Math.PI, colors.c1, 6);\nctx.restore();\ntag('y = f(x)', X(-6.8), Y(5.6), colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{The Folium of Descartes}\n\\begin{columns}[5 7, parallel]\nThe locus of\n$$x^3+y^3=6xy$$\nis the \\textbf{folium of Descartes}. In 1638, Descartes challenged Fermat to find its tangent lines.\n\n\\uncover<1->{A vertical line can meet the folium at \\textbf{three} points.}\n\n\\uncover<2->{Three graphs cover the folium. Unlike for the circle, it is not easy to write down their formulas.}\n\\columnbreak\n\\begin{js}[size=900x720, frames=3, alt=\"The folium of Descartes: a curve with a loop in the first quadrant and two arms that run off to the upper left and the lower right. Then the vertical line x = 2, which meets the curve at three points. Then the curve in three colors: the left arm with the bottom of the loop, the top of the loop, and the lower right arm.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -5, x1 = 6, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels pe  ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction folium(ca, cb, cc, width) {                  // x^3 + y^3 = 6xy in three pieces, from x = 6t/(1+t^3), y = 6t^2/(1+t^3)\n  const q = (t) => 1 + t * t * t;\n  path((t) => 6 * t / q(t), (t) => 6 * t * t / q(t), -0.9, 0.7937, ca, width);    // left arm and bottom of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), 0, 1.26, cb, width);         // top of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), -0.9, 0, cc, width);         // lower right arm\n}\naxes(1, 1);\nclip();\nif (local >= 2) folium(colors.c1, colors.c2, colors.c3, 6); else folium(colors.curve, colors.curve, colors.curve, 5);\nif (local >= 1) seg(2, y0, 2, y1, colors.muted, 3, [10, 8]);\nctx.restore();\nif (local >= 1) [40, 160, 280].forEach((d) => dot(2, 4 * Math.cos(d * Math.PI / 180), colors.ink, 9));\nif (local >= 2) {\n  tag('graph 1', X(-4.8), Y(0.7), colors.c1);\n  tag('graph 2', X(2.3), Y(3.9), colors.c2);\n  tag('graph 3', X(3.3), Y(-3.2), colors.c3);\n}\n\\end{js}\n\\end{columns}\n\n\\section{The Idea}\n\n\\slide{The Tangent Line Problem}\n\\begin{columns}[6 6]\n\\begin{question}{Problem}\nFind the slope of the tangent line at a point of a curve, \\textbf{without} a formula for $y$.\n\\end{question}\n\\begin{note}{Implicit Differentiation}\nNear the point, think of $y$ as a function $y(x)$, like any other function of $x$.\n\nDifferentiate both sides of the equation with respect to $x$, using the chain rule.\n\\end{note}\n\\columnbreak\n\\begin{js}[size=780x640, alt=\"The folium of Descartes with the point (3, 3) marked and the tangent line there. A small box around the point contains a piece of the curve that is the graph of a function.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -4, x1 = 6, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction folium(ca, cb, cc, width) {                  // x^3 + y^3 = 6xy in three pieces, from x = 6t/(1+t^3), y = 6t^2/(1+t^3)\n  const q = (t) => 1 + t * t * t;\n  path((t) => 6 * t / q(t), (t) => 6 * t * t / q(t), -0.9, 0.7937, ca, width);    // left arm and bottom of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), 0, 1.26, cb, width);         // top of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), -0.9, 0, cc, width);         // lower right arm\n}\naxes(1, 1);\nclip();\nctx.globalAlpha = 0.12; ctx.fillStyle = colors.c4; ctx.fillRect(X(2.2), Y(3.8), 1.6 * s, 1.6 * s); ctx.globalAlpha = 1;\nctx.strokeStyle = colors.c4; ctx.lineWidth = 3; ctx.strokeRect(X(2.2), Y(3.8), 1.6 * s, 1.6 * s);\nfolium(colors.curve, colors.curve, colors.curve, 5);\nseg(x0, 6 - x0, x1, 6 - x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(3, 3, colors.c1, 11);\ntag('(3, 3)', X(3) + 18, Y(3) - 14, colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{Equal Functions Have Equal Derivatives}\nSuppose a function \\({y=y(x)}\\) satisfies \\({x^2+y^2=25}\\) for every $x$ in an interval. Then\n$$x^2+\\big(y(x)\\big)^2\\qquad\\text{and}\\qquad25$$\nare the same function of $x$ on that interval. Therefore, they have the same derivative:\n$$\\frac{d}{dx}\\Big[x^2+\\big(y(x)\\big)^2\\Big]=\\frac{d}{dx}\\big[25\\big].$$\n\n\\\\\n\n\\\\\n\n\\begin{note}{Warning}\nThe equation \\({x^2=25}\\) holds only at \\({x=\\pm5}\\), not on an interval. Differentiating both sides gives \\({2x=0}\\), which is false at \\({x=\\pm5}\\).\n\\end{note}\n\n\\slide{Derivatives of Expressions That Contain $y$}\nHere $y$ stands for a function of $x$. By the chain rule,\n$$\\frac{d}{dx}\\big(y^2\\big)=\\textcolor{c1}{2y}\\cdot\\textcolor{c2}{y'}\\qquad\\text{just as}\\qquad\\frac{d}{dx}\\big(g(x)\\big)^2=\\textcolor{c1}{2g(x)}\\cdot\\textcolor{c2}{g'(x)}.$$\n\\begin{table}\nExpression & Derivative & Rule\n$x^3$ & $3x^2$ & power rule\n$y^3$ & \\uncover<1->{\\({\\textcolor{c1}{3y^2}\\cdot\\textcolor{c2}{y'}}\\)} & \\uncover<1->{chain rule}\n$\\sin y$ & \\uncover<2->{\\({\\textcolor{c1}{\\cos y}\\cdot\\textcolor{c2}{y'}}\\)} & \\uncover<2->{chain rule}\n$e^y$ & \\uncover<3->{\\({\\textcolor{c1}{e^y}\\cdot\\textcolor{c2}{y'}}\\)} & \\uncover<3->{chain rule}\n$xy$ & \\uncover<4->{\\({y+x\\,\\textcolor{c2}{y'}}\\)} & \\uncover<4->{product rule}\n\\end{table}\n\n\\slide{You Try}\n\\begin{youtry}[time=none]\nHere $y$ is a function of $x$. Find\n$$\\frac{d}{dx}\\big(y^5\\big).$$\n\\pause\n\\timer{40}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n%Outside: $\\textcolor{c1}{u^5}$. Inside: \\({\\textcolor{c2}{u=y}}\\).\n$$\\frac{d}{dx}\\big(y^5\\big)=\\textcolor{c1}{5y^4}\\cdot\\textcolor{c2}{y'}$$\n\n\\section{The Circle and the Folium}\n\n\\slide{Example 1: The Circle}\n\\begin{columns}[6 6, parallel]\nFind the slope of the tangent line to the circle \\({x^2+y^2=25}\\) at the point $(3,4)$.\n\\pause\nDifferentiate both sides with respect to $x$:\n$$2x+\\textcolor{c1}{2y}\\cdot\\textcolor{c2}{y'}=0$$\n\\pause\nSolve for $y'$:\n$$y'=-\\frac{x}{y}$$\n\\pause\nAt $(3,4)$:\n$$y'=-\\frac{3}{4}=-0.75$$\n\\columnbreak\n\\begin{js}[size=760x680, frames=4, alt=\"The circle of radius 5 with the point (3, 4) marked. At the last step, the tangent line at (3, 4), which has slope -0.75.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -7, x1 = 7, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 1);\nclip();\npath((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, 2 * Math.PI, colors.curve, 5);\nif (local >= 3) seg(x0, 6.25 - 0.75 * x0, x1, 6.25 - 0.75 * x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(3, 4, colors.c1, 11);\ntag('(3, 4)', X(3) + 18, Y(4) - 14, colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{Check: Tangent Lines Are Perpendicular to Radii}\n\\begin{columns}[5 7]\nThe \\textcolor{c1}{radius} from $(0,0)$ to $(x,y)$ has slope $y/x$.\n\nThe \\textcolor{c2}{tangent line} at $(x,y)$ has slope $-x/y$.\n$$\\frac{y}{x}\\cdot\\left(-\\frac{x}{y}\\right)=-1$$\nLines whose slopes multiply to $-1$ are perpendicular.\n\\columnbreak\n\\begin{js}[size=800x740, alt=\"A point moves around the circle of radius 5. The radius to the point and the tangent line at the point are drawn, with a right angle between them. A readout shows the slope of the radius and the slope of the tangent line, whose product is always -1.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 96, B = 46;                 // margins in pixels\nconst x0 = -7.5, x1 = 7.5, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nonFrame((t) => {\n  const th = 0.9273 + 0.3 * t, c = Math.cos(th), sn = Math.sin(th), px = 5 * c, py = 5 * sn;\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  clip();\n  path((u) => 5 * Math.cos(u), (u) => 5 * Math.sin(u), 0, 2 * Math.PI, colors.curve, 5);\n  seg(px + 20 * sn, py - 20 * c, px - 20 * sn, py + 20 * c, colors.c2, 4);\n  seg(0, 0, px, py, colors.c1, 5);\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 2; ctx.beginPath();\n  ctx.moveTo(X(px - 0.5 * c), Y(py - 0.5 * sn)); ctx.lineTo(X(px - 0.5 * c - 0.5 * sn), Y(py - 0.5 * sn + 0.5 * c));\n  ctx.lineTo(X(px - 0.5 * sn), Y(py + 0.5 * c)); ctx.stroke();\n  ctx.restore();\n  dot(px, py, colors.ink, 10);\n  const show = (v) => Math.abs(v) > 99 ? 'vertical' : v.toFixed(2).replace('-', '−');\n  ctx.font = font(30); ctx.textAlign = 'left';\n  ctx.fillStyle = colors.c1; ctx.fillText('radius slope   ' + show(py / px), L + 10, 36);\n  ctx.fillStyle = colors.c2; ctx.fillText('tangent slope  ' + show(-px / py), L + 10, 78);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Check: The Explicit Formulas Agree}\n\\begin{columns}[6 6]\n\\heading{Upper Semicircle}\n$$\\textcolor{c1}{y=\\sqrt{25-x^2}}=(25-x^2)^{1/2}$$\nBy the chain rule,\n\\begin{align}\ny'&=\\tfrac12(25-x^2)^{-1/2}\\cdot(-2x) \\\\\n&=-\\frac{x}{\\sqrt{25-x^2}}=-\\frac{x}{y}.\n\\end{align}\n\\columnbreak\n\\pause\n\\heading{Lower Semicircle}\n$$\\textcolor{c2}{y=-\\sqrt{25-x^2}}=-(25-x^2)^{1/2}$$\nBy the chain rule,\n\\begin{align}\ny'&=-\\tfrac12(25-x^2)^{-1/2}\\cdot(-2x) \\\\\n&=\\frac{x}{\\sqrt{25-x^2}}=-\\frac{x}{y}.\n\\end{align}\n\\end{columns}\n\\pause\n\\begin{center}\nThe single formula \\({y'=-x/y}\\) gives the slope on both graphs.\n\\end{center}\n\n\\slide{Example 2: The Folium of Descartes}\nFind $y'$ if \\({x^3+y^3=6xy}\\).\n\\pause\nDifferentiate both sides. The right side needs the product rule:\n$$3x^2+3y^2\\,\\textcolor{c2}{y'}=6y+6x\\,\\textcolor{c2}{y'}$$\n\\pause\nMove the terms with $y'$ to the left and the other terms to the right:\n$$3y^2\\,\\textcolor{c2}{y'}-6x\\,\\textcolor{c2}{y'}=6y-3x^2$$\n\\pause\nFactor out $y'$, then divide:\n$$\\textcolor{c2}{y'}\\,(3y^2-6x)=6y-3x^2\\qquad\\Longrightarrow\\qquad\\boxed{y'=\\frac{2y-x^2}{y^2-2x}}$$\n\n\\slide{Example 2, Continued: The Tangent Line at $(3,3)$}\n\\begin{columns}[6 6, parallel]\nThe point $(3,3)$ is on the folium:\n$$3^3+3^3=54=6\\cdot3\\cdot3.$$\n\\pause\nThe slope at $(3,3)$ is\n$$y'=\\frac{2y-x^2}{y^2-2x}=\\frac{6-9}{9-6}=-1.$$\n\\pause\nThe tangent line is \\({y-3=-1\\,(x-3)}\\), or\n$$\\boxed{y=-x+6}$$\n\\columnbreak\n\\begin{js}[size=780x700, frames=3, alt=\"The folium of Descartes with the point (3, 3) marked. At the last step, the tangent line y = -x + 6.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -4, x1 = 6, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction folium(ca, cb, cc, width) {                  // x^3 + y^3 = 6xy in three pieces, from x = 6t/(1+t^3), y = 6t^2/(1+t^3)\n  const q = (t) => 1 + t * t * t;\n  path((t) => 6 * t / q(t), (t) => 6 * t * t / q(t), -0.9, 0.7937, ca, width);    // left arm and bottom of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), 0, 1.26, cb, width);         // top of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), -0.9, 0, cc, width);         // lower right arm\n}\naxes(1, 1);\nclip();\nfolium(colors.curve, colors.curve, colors.curve, 5);\nif (local >= 2) seg(x0, 6 - x0, x1, 6 - x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(3, 3, colors.c1, 11);\ntag('(3, 3)', X(3) + 18, Y(3) - 14, colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2, Continued: A Horizontal Tangent Line}\n\\begin{columns}[6 6, parallel]\nWhere in the first quadrant is the tangent line to the folium horizontal?\n\\pause\nThe slope $y'$ is $0$ where the numerator \\({2y-x^2}\\) is $0$:\n$$y=\\tfrac12x^2$$\n\\pause\nSubstitute into \\({x^3+y^3=6xy}\\):\n$$x^3+\\tfrac18x^6=3x^3,\\qquad x^6=16x^3$$\n\\pause\nSince \\({x\\neq0}\\), we get \\({x^3=16}\\). The point is\n$$x=16^{1/3}\\approx2.52,$$\n$$y=\\tfrac12x^2\\approx3.17.$$\n\\columnbreak\n\\begin{js}[size=780x700, frames=4, alt=\"The folium of Descartes. At the last step, the horizontal tangent line at the highest point of the loop, near (2.52, 3.17).\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -4, x1 = 6, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction folium(ca, cb, cc, width) {                  // x^3 + y^3 = 6xy in three pieces, from x = 6t/(1+t^3), y = 6t^2/(1+t^3)\n  const q = (t) => 1 + t * t * t;\n  path((t) => 6 * t / q(t), (t) => 6 * t * t / q(t), -0.9, 0.7937, ca, width);    // left arm and bottom of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), 0, 1.26, cb, width);         // top of the loop\n  path((t) => 6 * t * t / q(t), (t) => 6 * t / q(t), -0.9, 0, cc, width);         // lower right arm\n}\nconst hx = Math.pow(16, 1 / 3), hy = hx * hx / 2;\naxes(1, 1);\nclip();\nfolium(colors.curve, colors.curve, colors.curve, 5);\nif (local >= 3) seg(x0, hy, x1, hy, colors.tangent, 4, [12, 8]);\nctx.restore();\nif (local >= 3) { dot(hx, hy, colors.c1, 11); tag('(2.52, 3.17)', X(hx), Y(hy) - 22, colors.c1, 'center'); }\n\\end{js}\n\\end{columns}\n\n\\section{The Method}\n\n\\slide{Implicit Differentiation}\n\\begin{note}{Method}\n\\begin{enumerate}\n\\item Differentiate both sides of the equation with respect to $x$. By the chain rule, every term that contains $y$ produces a factor $\\textcolor{c2}{y'}$.\n\\item Move the terms with $\\textcolor{c2}{y'}$ to one side and all other terms to the other side.\n\\item Factor out $\\textcolor{c2}{y'}$.\n\\item Divide to solve for $\\textcolor{c2}{y'}$.\n\\end{enumerate}\n\\end{note}\nThe answer usually contains both $x$ and $y$. To find the slope at a point, substitute both coordinates of the point.\n\n\\slide{You Try}\n\\begin{youtry}[time=none]\nFind $y'$ if \\({x^4+y^4=16}\\).\n\\pause\n\\timer{60}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[6 6]\nDifferentiate both sides:\n$$4x^3+4y^3\\,\\textcolor{c2}{y'}=0$$\nSolve for $y'$:\n$$\\boxed{y'=-\\frac{x^3}{y^3}}$$\nAt the point of the curve where \\({y=x>0}\\), the slope is $-1$.\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The curve x to the fourth plus y to the fourth equals 16, which looks like a square with rounded corners. The tangent line at the point of the curve on the line y = x has slope -1.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -3.2, x1 = 3.2, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst rt = (v) => Math.sign(v) * Math.sqrt(Math.abs(v)), m = Math.pow(8, 0.25);\naxes(1, 1);\nclip();\npath((t) => 2 * rt(Math.cos(t)), (t) => 2 * rt(Math.sin(t)), 0, 2 * Math.PI, colors.curve, 5);\nseg(x0, 2 * m - x0, x1, 2 * m - x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(m, m, colors.c1, 11);\n\\end{js}\n\\end{columns}\n\n\\slide{Why We Can Always Solve for $y'$}\nAfter differentiating, each term contains either no $y'$ or exactly one factor $y'$. The new equation has the form\n$$M+N\\cdot\\textcolor{c2}{y'}=0,$$\nwhere $M$ and $N$ contain $x$ and $y$ but not $y'$.\n$$\\def\\arraystretch{1.4}\\begin{array}{l|l}\n\\text{Circle} & 2x+2y\\cdot\\textcolor{c2}{y'}=0 \\\\\n\\text{Folium} & (3x^2-6y)+(3y^2-6x)\\cdot\\textcolor{c2}{y'}=0\n\\end{array}$$\n\\pause\n\\begin{note}{Key Point}\nSolving the original equation for $y$ can be hard or impossible. Solving the new equation for $y'$ is solving a \\textbf{linear} equation: \\({y'=-M/N}\\) wherever \\({N\\neq0}\\).\n\\end{note}\n\n\\slide{Two Common Mistakes}\nDifferentiate both sides of \\({x^3+y^3=6xy}\\).\n\n\\\\\n\n\\begin{itemize}\n\\item \\alert{Wrong:} \\({3x^2+3y^2=6y+6x\\,y'}\\). The derivative of $y^3$ is missing its factor $\\textcolor{c2}{y'}$.\n\\end{itemize}\n\n\\\\\n\n\\begin{itemize}\n\\item \\alert{Wrong:} \\({3x^2+3y^2\\,y'=6\\,y'}\\). The product $6xy$ needs the product rule.\n\\end{itemize}\n\n\\\\\n\n\\begin{itemize}\n\\item \\accent{Right:} \\({3x^2+3y^2\\,\\textcolor{c2}{y'}=6y+6x\\,\\textcolor{c2}{y'}}\\).\n\\end{itemize}\n\n\\section{Equations We Cannot Solve}\n\n\\slide{History: Formulas for Solving Equations}\n\\begin{columns}[7 5]\n\\begin{itemize}\n\\item \\textbf{Degree 2.} The quadratic formula.\n\\item \\textbf{Degrees 3 and 4.} Formulas with radicals exist, but they are complicated. They can require imaginary numbers even when the solutions are real.\n\\item \\textbf{Degree 5.} Niels Abel (Norway, 1824): \\alert{no} general formula with radicals exists.\n\\item \\textbf{Higher degrees.} Évariste Galois (France, about 1830): no general formula for any degree \\({n\\geq5}\\).\n\\end{itemize}\nBoth Abel and Galois made their discoveries by the age of 21.\n\\columnbreak\n\\begin{plot}\nf = x^5 - x - 1\ndomain = -1.6:1.6\nrange = -2:1\naspect = equal\nsize = 540\nxticks = 1\nyticks = 1\npoints = 1.1673\na = 1.1673\nalt = Graph of y = x to the fifth minus x minus 1. It crosses the x-axis once, near x = 1.17.\n\\end{plot}\n\\begin{center}\n\\({x^5-x-1=0}\\) has one real solution, \\({x\\approx1.167}\\). No formula with radicals gives it.\n\\end{center}\n\\end{columns}\n\n\\slide{Example 3: An Equation of Degree 5 in $y$}\nFind $y'$ if \\({y^5+3x^2y^2+5x^4=9}\\).\n\nFor each $x$, finding $y$ means solving an equation of degree $5$. We can still find $y'$.\n\\pause\nDifferentiate both sides. The middle term needs the product rule:\n$$5y^4\\,\\textcolor{c2}{y'}+\\big(6x\\,y^2+3x^2\\cdot2y\\,\\textcolor{c2}{y'}\\big)+20x^3=0$$\n\\pause\nCollect the terms with $y'$:\n$$\\textcolor{c2}{y'}\\,\\big(5y^4+6x^2y\\big)=-6xy^2-20x^3$$\n\\pause\n$$\\boxed{y'=-\\frac{6xy^2+20x^3}{5y^4+6x^2y}}$$\n\n\\slide{Example 3, Continued: The Slope at $(1,1)$}\n\\begin{columns}[6 6, parallel]\nThe point $(1,1)$ is on the curve \\({y^5+3x^2y^2+5x^4=9}\\):\n$$1+3+5=9.$$\n\\pause\nThe slope at $(1,1)$ is\n$$y'=-\\frac{6+20}{5+6}=-\\frac{26}{11}\\approx-2.36.$$\n\\pause\nThe tangent line is\n$$y-1=-\\frac{26}{11}\\,(x-1).$$\n\\columnbreak\n\\begin{js}[size=700x700, frames=3, alt=\"The curve y to the fifth plus 3 x squared y squared plus 5 x to the fourth equals 9, which is shaped like an arch through (0, 1.55) and falls steeply on both sides. The point (1, 1) is marked. At the last step, the tangent line at (1, 1), with slope about -2.36.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -2.6, x1 = 2.6, yc = -0.2;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction implicit(F, color, width, n) {               // the curve F(x, y) = 0, by marching squares on an n-column grid\n  const nx = n || 240, ny = Math.round(nx * (y1 - y0) / (x1 - x0)), dx = (x1 - x0) / nx, dy = (y1 - y0) / ny, v = [];\n  for (let j = 0; j <= ny; j++) { const row = new Float64Array(nx + 1); for (let i = 0; i <= nx; i++) row[i] = F(x0 + i * dx, y0 + j * dy); v.push(row); }\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath();\n  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {\n    const a = v[j][i], b = v[j][i + 1], c = v[j + 1][i + 1], d = v[j + 1][i], p = [];\n    if ((a < 0) !== (b < 0)) p.push(i + a / (a - b), j);\n    if ((b < 0) !== (c < 0)) p.push(i + 1, j + b / (b - c));\n    if ((d < 0) !== (c < 0)) p.push(i + d / (d - c), j + 1);\n    if ((a < 0) !== (d < 0)) p.push(i, j + a / (a - d));\n    for (let k = 0; k + 3 < p.length; k += 4) { ctx.moveTo(X(x0 + p[k] * dx), Y(y0 + p[k + 1] * dy)); ctx.lineTo(X(x0 + p[k + 2] * dx), Y(y0 + p[k + 3] * dy)); }\n  }\n  ctx.stroke(); ctx.lineCap = 'butt';\n}\naxes(1, 1);\nclip();\nimplicit((x, y) => Math.pow(y, 5) + 3 * x * x * y * y + 5 * Math.pow(x, 4) - 9, colors.curve, 5, 260);\nif (local >= 2) seg(x0, 1 - 26 / 11 * (x0 - 1), x1, 1 - 26 / 11 * (x1 - 1), colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(1, 1, colors.c1, 11);\ntag('(1, 1)', X(1) + 18, Y(1) - 14, colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{You Try}\n\\begin{youtry}[time=none]\nFind $y'$ if \\({x^2+xy+y^2=3}\\).\n\\pause\n\\timer{90}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[6 6]\nDifferentiate both sides. The middle term needs the product rule:\n$$2x+\\big(y+x\\,\\textcolor{c2}{y'}\\big)+2y\\,\\textcolor{c2}{y'}=0$$\nCollect the terms with $y'$:\n$$\\textcolor{c2}{y'}\\,(x+2y)=-2x-y$$\n$$\\boxed{y'=-\\frac{2x+y}{x+2y}}$$\nAt the point $(1,1)$, the slope is $-1$.\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The curve x squared plus x y plus y squared equals 3, a tilted ellipse, with the point (1, 1) marked and the tangent line there, which has slope -1.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -3.2, x1 = 3.2, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst r3 = Math.sqrt(3);\naxes(1, 1);\nclip();\npath((t) => Math.cos(t) - r3 * Math.sin(t), (t) => Math.cos(t) + r3 * Math.sin(t), 0, 2 * Math.PI, colors.curve, 5);\nseg(x0, 2 - x0, x1, 2 - x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(1, 1, colors.c1, 11);\ntag('(1, 1)', X(1) + 18, Y(1) - 14, colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: Trigonometric Functions}\nFind $y'$ if \\({\\sin(x+y)=y^2\\cos x}\\).\n\\pause\nDifferentiate both sides. The left side needs the chain rule, and the right side needs the product rule:\n$$\\cos(x+y)\\cdot\\big(1+\\textcolor{c2}{y'}\\big)=2y\\,\\textcolor{c2}{y'}\\cos x-y^2\\sin x$$\n\\pause\nMultiply out the left side:\n$$\\cos(x+y)+\\cos(x+y)\\,\\textcolor{c2}{y'}=2y\\,\\textcolor{c2}{y'}\\cos x-y^2\\sin x$$\n\\pause\nCollect the terms with $y'$ on the right:\n$$\\cos(x+y)+y^2\\sin x=\\textcolor{c2}{y'}\\,\\big(2y\\cos x-\\cos(x+y)\\big)$$\n\n\\slide{Example 4, Continued: The Curve}\n\\begin{columns}[5 7, parallel]\n$$\\boxed{y'=\\frac{y^2\\sin x+\\cos(x+y)}{2y\\cos x-\\cos(x+y)}}$$\nThe curve \\({\\sin(x+y)=y^2\\cos x}\\) passes through $(0,0)$.\n\\pause\nAt $(0,0)$:\n$$y'=\\frac{0+\\cos0}{0-\\cos0}=-1$$\nThe tangent line is \\({y=-x}\\).\n\\columnbreak\n\\begin{js}[size=900x700, frames=2, alt=\"The curve sin(x + y) = y squared cos x, which has many separate pieces: wavy curves near the x-axis and tall narrow branches that repeat along the x-axis. At the last step, the tangent line y = -x at the origin.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -7, x1 = 7, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction implicit(F, color, width, n) {               // the curve F(x, y) = 0, by marching squares on an n-column grid\n  const nx = n || 240, ny = Math.round(nx * (y1 - y0) / (x1 - x0)), dx = (x1 - x0) / nx, dy = (y1 - y0) / ny, v = [];\n  for (let j = 0; j <= ny; j++) { const row = new Float64Array(nx + 1); for (let i = 0; i <= nx; i++) row[i] = F(x0 + i * dx, y0 + j * dy); v.push(row); }\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath();\n  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {\n    const a = v[j][i], b = v[j][i + 1], c = v[j + 1][i + 1], d = v[j + 1][i], p = [];\n    if ((a < 0) !== (b < 0)) p.push(i + a / (a - b), j);\n    if ((b < 0) !== (c < 0)) p.push(i + 1, j + b / (b - c));\n    if ((d < 0) !== (c < 0)) p.push(i + d / (d - c), j + 1);\n    if ((a < 0) !== (d < 0)) p.push(i, j + a / (a - d));\n    for (let k = 0; k + 3 < p.length; k += 4) { ctx.moveTo(X(x0 + p[k] * dx), Y(y0 + p[k + 1] * dy)); ctx.lineTo(X(x0 + p[k + 2] * dx), Y(y0 + p[k + 3] * dy)); }\n  }\n  ctx.stroke(); ctx.lineCap = 'butt';\n}\naxes(1, 1);\nclip();\nimplicit((x, y) => Math.sin(x + y) - y * y * Math.cos(x), colors.curve, 4, 340);\nif (local >= 1) seg(x0, -x0, x1, -x1, colors.tangent, 4, [12, 8]);\nctx.restore();\ndot(0, 0, colors.c1, 11);\n\\end{js}\n\\end{columns}\n\n\\section{Tangent Lines to Famous Curves}\n\n\\slide{Example 5: The Astroid}\n\\begin{columns}[6 6, parallel]\nFind the tangent line to the astroid \\({x^{2/3}+y^{2/3}=4}\\) at the point \\({(-3\\sqrt3,\\,1)}\\).\n\\pause\nDifferentiate both sides by the power rule:\n$$\\tfrac23x^{-1/3}+\\tfrac23y^{-1/3}\\,\\textcolor{c2}{y'}=0$$\n\\pause\nSolve for $y'$:\n$$y'=-\\frac{x^{-1/3}}{y^{-1/3}}=-\\frac{y^{1/3}}{x^{1/3}}$$\n\\columnbreak\n\\begin{js}[size=760x700, alt=\"The astroid, a curve with four cusps at (8, 0), (0, 8), (-8, 0), and (0, -8), with sides that bend inward. The point (-3 root 3, 1), near (-5.2, 1), is marked.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -10, x1 = 10, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / um(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(2, 2);\nclip();\npath((t) => 8 * Math.pow(Math.cos(t), 3), (t) => 8 * Math.pow(Math.sin(t), 3), 0, 2 * Math.PI, colors.curve, 5);\nctx.restore();\ndot(-3 * Math.sqrt(3), 1, colors.c1, 11);\ntag('(−3√3, 1)', X(-9.7), Y(2.3), colors.c1);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 5, Continued: The Tangent Line}\n\\begin{columns}[6 6, parallel]\nAt \\({(-3\\sqrt3,\\,1)}\\) we have \\({x^{1/3}=-\\sqrt3}\\), because \\({(-\\sqrt3)^3=-3\\sqrt3}\\). The slope is\n$$y'=-\\frac{y^{1/3}}{x^{1/3}}=-\\frac{1}{-\\sqrt3}=\\frac{1}{\\sqrt3}.$$\n\\pause\nThe tangent line is\n$$y-1=\\frac{1}{\\sqrt3}\\big(x+3\\sqrt3\\big),$$\n$$\\boxed{y=\\frac{x}{\\sqrt3}+4}$$\n\\columnbreak\n\\begin{js}[size=760x700, frames=2, alt=\"The astroid with the point (-3 root 3, 1) marked. At the last step, the tangent line there, which crosses the y-axis at 4.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -10, x1 = 10, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // restore();\ndot(-3 * Math.sqrt(3), 1, colors.c1, 11);\n\\end{js}\n\\end{columns}\n\n\\slide{The Astroid and a Sliding Ladder}\n\\begin{columns}[5 7]\nThe tangent line \\({y=x/\\sqrt3+4}\\) meets the axes at $(0,4)$ and \\({(-4\\sqrt3,0)}\\). The distance between these points is\n$$\\sqrt{4^2+(4\\sqrt3)^2}=8.$$\nThe same holds at every point of the astroid: the axes cut a segment of length $8$ from each tangent line.\n\nA \\textcolor{c1}{ladder} of length $8$ sliding down a wall is always tangent to the astroid.\n\\columnbreak\n\\begin{js}[size=800x720, alt=\"A segment of length 8, like a ladder, slides with one end on the x-axis and the other end on the y-axis. Its earlier positions stay on screen as faint lines. Together they outline the astroid, and the ladder touches the astroid at one moving point.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -10, x1 = 10, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nonFrame((t) => {\n  const start = 5 * Math.PI / 6, th = start + 0.3 * t;\n  ctx.clearRect(0, 0, w, h);\n  axes(2, 2);\n  clip();\n  ctx.globalAlpha = 0.3;\n  for (let a = start; a < Math.min(th, start + 2 * Math.PI); a += 0.1) seg(8 * Math.cos(a), 0, 0, 8 * Math.sin(a), colors.c1, 2);\n  ctx.globalAlpha = 1;\n  path((u) => 8 * Math.pow(Math.cos(u), 3), (u) => 8 * Math.pow(Math.sin(u), 3), 0, 2 * Math.PI, colors.curve, 5);\n  seg(8 * Math.cos(th), 0, 0, 8 * Math.sin(th), colors.c1, 8);\n  ctx.restore();\n  dot(8 * Math.cos(th), 0, colors.c1, 9); dot(0, 8 * Math.sin(th), colors.c1, 9);\n  dot(8 * Math.pow(Math.cos(th), 3), 8 * Math.pow(Math.sin(th), 3), colors.c2, 10);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 6: A Cardioid}\n\\begin{columns}[8 4, parallel]\nFind the tangent line to the cardioid \\({x^2+y^2=(2x^2+2y^2-x)^2}\\) at the point $(0,\\,0.5)$.\n\\pause\nDifferentiate both sides. The right side needs the chain rule:\n$$2x+2y\\,\\textcolor{c2}{y'}=2\\big(2x^2+2y^2-x\\big)\\cdot\\big(4x+4y\\,\\textcolor{c2}{y'}-1\\big)$$\n\\pause\nSubstitute \\({x=0}\\) and \\({y=0.5}\\) \\textbf{before} solving for $y'$:\n$$\\textcolor{c2}{y'}=2(0.5)\\big(2\\,\\textcolor{c2}{y'}-1\\big)=2\\,\\textcolor{c2}{y'}-1$$\n\\pause\nTherefore, \\({y'=1}\\). The tangent line is\n$$\\boxed{y=x+0.5}$$\n\\columnbreak\n\\begin{js}[size=540x500, frames=4, alt=\"The cardioid, a heart-shaped curve with its cusp at the origin, reaching from x = -0.125 to x = 1. The point (0, 0.5) is marked. At the last step, the tangent line y = x + 0.5.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 84, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.7, x1 = 1.3, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth gin{youtry}[time=none]\nFind the tangent line to the hyperbola \\({x^2-xy-y^2=1}\\) at the point $(2,1)$.\n\\pause\n\\timer{90}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[6 6]\nDifferentiate both sides:\n$$2x-\\big(y+x\\,\\textcolor{c2}{y'}\\big)-2y\\,\\textcolor{c2}{y'}=0$$\nSubstitute \\({x=2}\\) and \\({y=1}\\):\n$$4-\\big(1+2\\,\\textcolor{c2}{y'}\\big)-2\\,\\textcolor{c2}{y'}=0$$\nTherefore, \\({y'=0.75}\\). The tangent line is\n$$y-1=0.75\\,(x-2),$$\n$$\\boxed{y=0.75x-0.5}$$\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"The hyperbola x squared minus x y minus y squared equals 1, with two branches opening left and right. The point (2, 1) is marked on the right branch with the tangent line y = 0.75 x - 0.5.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -4, x1 = 4, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfu  - c), j + 1);\n    if ((a < 0) !== (d < 0)) p.push(i, j + a / (a - d));\n    for (let k = 0; k + 3 < p.length; k += 4) { ctx.moveTo(X(x0 + p[k] * dx), Y(y0 + p[k + 1] * dy)); ctx.lineTo(X(x0 + p[k + 2] * dx), Y(y0 + p[k + 3] * dy)); }\n  }\n  ctx.stroke(); ctx.lineCap = 'butt';\n}\naxes(1, 1);\nclip();\nimplicit((x, y) => y * (y * y - 1) * (y - 2) - x * (x - 1) * (x - 2), colors.curve, 5, 260);\nif (local >= 2) {\n  seg(x0, 1 - x0, x1, 1 - x1, colors.tangent, 4, [12, 8]);\n  seg(x0, 2 + x0 / 3, x1, 2 + x1 / 3, colors.tangent, 4, [12, 8]);\n}\nctx.restore();\ndot(0, 1, colors.c1, 11); dot(0, 2, colors.c1, 11);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 7, Continued: Horizontal Tangent Lines}\n\\begin{columns}[6 6, parallel]\nThe slope $y'$ is $0$ where the numerator is $0$:\n$$3x^2-6x+2=0$$\n\\pause\nBy the quadratic formula,\n$$x=\\frac{6\\pm\\sqrt{36-24}}{6}=1\\pm\\frac{\\sqrt3}{3}.$$\nThese are \\({x\\approx0.42}\\) and \\({x\\approx1.58}\\).\n\\pause\nThe curve has four points on each of these two vertical lines. That makes eight horizontal tangent lines.\n\\columnbreak\n\\begin{js}[size=760x700, frames=3, alt=\"The same curve. Then the vertical lines x = 0.42 and x = 1.58. Then the four points of the curve on each line, each with a short horizontal tangent segment.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -1.5, x1 = 3.5, yc = 0.5;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([ ns}\n\n\\slide{Example 7, Continued: Change the Equation}\n\\begin{columns}[6 6]\nAdd a constant $c$ to the right side:\n$$y(y^2-1)(y-2)=x(x-1)(x-2)+c$$\nThe curve changes with $c$.\n\nThe derivative of a constant is $0$. Therefore, $y'$ is given by the same formula for every $c$, and the horizontal tangent lines stay on the same two vertical lines.\n\n\\small{Click the picture to pause or resume.}\n\\columnbreak\n\\begin{js}[size=760x700, alt=\"An animation of the curve y(y squared - 1)(y - 2) = x(x - 1)(x - 2) + c as the constant c moves back and forth between about -1.5 and 1.1. Loops appear, merge, and split. The points with horizontal tangent lines stay on the vertical lines x = 0.42 and x = 1.58.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 70, B = 46;                 // margins in pixels\nconst x0 = -1.5, x1 = 3.5, yc = 0.5;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, = [];\n    if ((a < 0) !== (b < 0)) p.push(i + a / (a - b), j);\n    if ((b < 0) !== (c < 0)) p.push(i + 1, j + b / (b - c));\n    if ((d < 0) !== (c < 0)) p.push(i + d / (d - c), j + 1);\n    if ((a < 0) !== (d < 0)) p.push(i, j + a / (a - d));\n    for (let k = 0; k + 3 < p.length; k += 4) { ctx.moveTo(X(x0 + p[k] * dx), Y(y0 + p[k + 1] * dy)); ctx.lineTo(X(x0 + p[k + 2] * dx), Y(y0 + p[k + 3] * dy)); }\n  }\n  ctx.stroke(); ctx.lineCap = 'butt';\n}\nconst g = (y) => y * (y * y - 1) * (y - 2), p = (x) => x * (x - 1) * (x - 2);\nfunction roots(v) {                                   // the solutions y of g(y) = v, by bisection\n  const out = [];\n  for (let a = -2.5; a < 3.5; a += 0.02) {\n    let lo = a, hi = a + 0.02;\n    if ((g(lo) - v) * (g(hi) - v) > 0) continue;\n    for (let k = 0; k < 40; k++) { const mid = (lo + hi) / 2; if ((g(lo) - v) * (g(mid) - v) <= 0) hi = mid; else lo = mid; }\n    out.push((lo + hi) / 2);\n  }\n  return out;\n}\nconst xs = [1 - 1 / Math.sqrt(3), 1 + 1 / Math.sqrt(3)];\nif (state.u === undefined) { state.u = 0; state.paused = false; }\ncanvas.onclick = () => { state.paused = !state.paused; };\nlet last = 0;\nonFrame((t) => {\n  if (!state.paused) state.u += Math.min(Math.max(t - last, 0), 0.1);\n  last = t;\n  const c = -0.2 + 1.3 * Math.sin(0.35 * state.u);\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  clip();\n  xs.forEach((x) => seg(x, y0, x, y1, colors.muted, 3, [10, 8]));\n  implicit((x, y) => g(y) - p(x) - c, colors.curve, 5, 220);\n  xs.forEach((x) => roots(p(x) + c).forEach((y) => seg(x - 0.3, y, x + 0.3, y, colors.tangent, 5)));\n  ctx.restore();\n  xs.forEach((x) => roots(p(x) + c).forEach((y) => dot(x, y, colors.tangent, 8)));\n  ctx.fillStyle = colors.text; ctx.font = font(32); ctx.textAlign = 'left';\n  ctx.fillText('c = ' + c.toFixed(2).replace('-', '−') + (state.paused ? '   (paused)' : ''), L + 10, 44);\n});\n\\end{js}\n\\end{columns}\n\n\\section{Applications}\n\n\\slide{Chemistry: A Real Gas}\nOne mole of an ideal gas at a fixed temperature satisfies \\({PV=RT}\\). The \\textbf{van der Waals equation} is a better model of a real gas:\n$$\\left(P+\\frac{a}{V^2}\\right)(V-b)=RT$$\nHere $a$, $b$, $R$, and $T$ are constants. Solving for the volume $V$ in terms of the pressure $P$ means solving a cubic equation.\n\\pause\nInstead, think of $V$ as a function of $P$. Differentiate both sides with respect to $P$, using the product rule:\n$$\\left(1-\\frac{2a}{V^3}\\,\\textcolor{c2}{V'}\\right)(V-b)+\\left(P+\\frac{a}{V^2}\\right)\\textcolor{c2}{V'}=0$$\n\n\\slide{A Real Gas: How Volume Responds to Pressure}\n\\begin{columns}[7 5, parallel]\nSolve for \\({V'=dV/dP}\\):\n$$\\frac{dV}{dP}=-\\frac{V-b}{P-\\dfrac{a}{V^2}+\\dfrac{2ab}{V^3}}$$\n\\pause\nFor carbon dioxide, \\({a=3.592}\\) and \\({b=0.04267}\\) in units of liters, atmospheres, and moles. At \\({V=10}\\) L and \\({P=2.5}\\) atm,\n$$\\frac{dV}{dP}\\approx-4.04\\ \\text{L/atm}.$$\nFor an ideal gas, \\({dV/dP=-V/P=-4}\\) L/atm.\n\\columnbreak\n\\begin{js}[size=660x620, frames=2, alt=\"The volume V of one mole of carbon dioxide, in liters, plotted against the pressure P, in atmospheres, at a fixed temperature. The curve falls as the pressure rises. The point P = 2.5, V = 10 is marked. At the last step, the tangent line there, with slope about -4.04 liters per atmosphere.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 86, R = 20, T = 20, B = 86;                 // margins in pixels\nconst X = (q) => L + q / 6 * (w - L - R), Y = (v) => h - B - v / 30 * (h - T - B);   // P from 0 to 6 atm, V from 0 to 30 L\nconst a = 3.592, b = 0.04267, RT = (2.5 + a / 100) * (10 - b);                        // the curve through P = 2.5, V = 10\nconst P = (v) => RT / (v - b) - a / (v * v);\nctx.strokeStyle = colors.grid; ctx.lineWidth = 1; ctx.beginPath();\nfor (let k = 0; k <= 6; k++) { ctx.moveTo(X(k), Y(0)); ctx.lineTo(X(k), Y(30)); }\nfor (let k = 0; k <= 30; k += 5) { ctx.moveTo(X(0), Y(k)); ctx.lineTo(X(6), Y(k)); mily at a right angle. At the point (2, 1) the two tangent lines are drawn with a right angle marked between them.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 96, B = 46;                 // margins in pixels\nconst x0 = -3.4, x1 = 3.4, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { c nd{js}\n\\end{columns}\n\n\\section{A Closer Look}\n\n\\slide{Where the Method Works}\n\\begin{columns}[6 6, parallel]\nFor the folium, differentiating gave \\({M+N\\,y'=0}\\) with\n$$M=3x^2-6y,\\qquad N=3y^2-6x.$$\n\\begin{itemize}\n\\item \\textcolor{c4}{At $(3,3)$:} \\({N=9}\\). Near this point the curve is a graph, with slope \\({-M/N=-1}\\).\n\\item<1-> \\textcolor{c2}{At $(3.17,\\,2.52)$:} \\({N=0}\\) and \\({M\\neq0}\\). The tangent line is vertical. No piece of the curve around this point is a graph.\n\\item<2-> \\textcolor{c3}{At $(0,0)$:} \\({M=0}\\) and \\({N=0}\\). The curve crosses itself.\n\\end{itemize}\n\\columnbreak\n\\begin{js}[size=760x680, frames=3, alt=\"The folium of Descartes with a small box around one point and a zoomed picture of the box. First the point (3, 3), where the curve inside the box is the graph of a function. Then the rightmost point of the loop, near (3.17, 2.52), where the curve inside the box turns back like the letter C. Then the origin, where the curve inside the box crosses itself.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -4, x1 = 6, yc = 0;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle at every point of the circle except $(5,0)$ and $(-5,0)$, where the tangent lines are vertical.\n\\end{example}\n\n\\section{Second Derivatives}\n\n\\slide{Second Derivatives From a Differential Equation}\n\\begin{columns}[7 5, parallel]\nSuppose $y$ is a function of $x$ that satisfies the \\textbf{differential equation}\n$$y'=x^2+y^2.$$\nFind $y''$.\n\\pause\nDifferentiate both sides, using the chain rule:\n$$y''=2x+2y\\,\\textcolor{c2}{y'}$$\n\\pause\nSubstitute \\({\\textcolor{c2}{y'=x^2+y^2}}\\):\n$$\\boxed{y''=2x+2y\\,(x^2+y^2)}$$\n\\pause\nAt the point $(0,1)$: \\({y'=1}\\) and \\({y''=2}\\).\n\\columnbreak\n\\begin{js}[size=640x620, frames=4, alt=\"Short line segments at a grid of points show the slope x squared plus y squared that the equation gives at each point. The point (0, 1) is marked. At the last step, the solution curve through (0, 1), which rises from left to right and bends upward at that point.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -2, x1 = 2, yc = 0.5;                // x-window, and the y-value at mid-height\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  ks(x0, x1, dg).forEach((v) => seg(v, y0, v, y1, colors.grid, 1));\n  ks(y0, y1, dg).forEach((v) => seg(x0, v, x1, v, colors.grid, 1));\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => ctx.fillText(num(v), X(v), h - B + 32));\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => ctx.fillText(num(v), L - 10, Y(v) + 9));\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst F = (x, y) => x * x + y * y;\naxes(1, 1);\nclip();\nfor (let x = -1.8; x < 2; x += 0.4) for (let y = -1.3; y < 2.5; y += 0.4) {   // a short segment with the slope the equation gives at (x, y)\n  const m = F(x, y), d = 0.15 / Math.hypot(1, m);\n  seg(x - d, y - d * m, x + d, y + d * m, colors.muted, 3);\n}\nif (local >= 3) [0.01, -0.01].forEach((dx) => {         // the solution through (0, 1), by Runge-Kutta s \npath((t) => 5 * Math.cos(t), (t) => 5 * Math.sin(t), 0, 2 * Math.PI, colors.curve, 5);\n[150, 120, 90, 60, 30].forEach((d) => {\n  const c = Math.cos(d * Math.PI / 180), sn = Math.sin(d * Math.PI / 180);\n  seg(5 * c + 2.4 * sn, 5 * sn - 2.4 * c, 5 * c - 2.4 * sn, 5 * sn + 2.4 * c, colors.tangent, 4);\n});\nctx.restore();\n[150, 120, 90, 60, 30].forEach((d) => dot(5 * Math.cos(d * Math.PI / 180), 5 * Math.sin(d * Math.PI / 180), colors.c1, 8));\n\\end{js}\n\\end{columns}\n\n\\section*{Wrap-Up}\n\n\\slide{Summary}\n\\begin{columns}[1 1]\n\\heading{Implicit Differentiation}\n\\begin{enumerate}\n\\item Differentiate both sides.\n\\item Every term with $y$ gets a factor $y'$.\n\\item Collect the $y'$ terms and solve for $y'$.\n\\end{enumerate}\n\\columnbreak\n\\heading{Key Derivatives}\n$$\\frac{d}{dx}\\big(y^n\\big)=ny^{n-1}\\,y'$$\n$$\\frac{d}{dx}\\big(xy\\big)=y+x\\,y'$$\n\\end{columns}\n\n\\slide{Coming Up}\n\\begin{itemize}\n\\item Problem Set 9 (implicit differentiation) is posted on HuskyCT.\n\\item \\textbf{Wednesday, October 7:} Lecture 10. Derivatives of inverse functions, logarithms, and inverse trigonometric functions.\n\\end{itemize}\n";window.LECTURE_SCALE=1.2;window.LECTURE_THEMES={};</script><script>(function LECTURE_ENGINE() {
