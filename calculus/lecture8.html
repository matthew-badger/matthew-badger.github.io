<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="generator" content="lecture-engine 2.0.0-dev"><title>Lecture 8: The Chain Rule</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}</style></head><body><main id="wrap"><div id="stage"></div></main><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="\\engine{2}\n\\title{Lecture 8: The Chain Rule}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 28, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\\footer{section}\n\n\\titleslide\n\n\\slide[valign=center, align=center]{Today}\n\\heading{The Chain Rule}\nHow to differentiate a function inside another function, such as $\\sin(x^2)$.\n\n\\bigskip\nExam 1 is Monday, October 5.\n\n\\slide{Functions We Cannot Differentiate Yet}\n\\begin{columns}[4 4 4]\n\\begin{plot}\nf = e^(-x^2)\ndomain = -2.5:2.5\nrange = -0.5:1.5\naspect = equal\nsize = 500\nxticks = 1\n\\end{plot}\n\\begin{center}\n$y=e^{-x^2}$\n\\end{center}\n\\columnbreak\n\\begin{plot}\nf = sin(x^2)\ndomain = -3:3\nrange = -1.5:1.5\naspect = equal\nsize = 500\nxticks = 1\nyticks = 1\n\\end{plot}\n\\begin{center}\n$y=\\sin(x^2)$\n\\end{center}\n\\columnbreak\n\\begin{plot}\nf = sqrt(1+x^2)\ndomain = -3:3\nrange = -0.5:3.5\naspect = equal\nsize = 500\nxticks = 1\nyticks = 1\n\\end{plot}\n\\begin{center}\n$y=\\sqrt{1+x^2}$\n\\end{center}\n\\end{columns}\n\\pause\n\\begin{center}\nEach function has an \\textcolor{c1}{outside function} applied to an \\textcolor{c2}{inside function}.\n\\end{center}\n\n\\section{Motivation: Doubling the Input}\n\n\\slide{Start With a Special Case}\n\\begin{columns}[5 7, parallel]\nSuppose we know $f'$. How can we find the derivative of\n$$g(x)=f(\\textcolor{c2}{2x})?$$\n\n\\uncover<1->{\\textbf{Question.} When $x$ changes by $h$, how much does the input $\\textcolor{c2}{2x}$ change?}\n\n\\uncover<2->{By $\\textcolor{c2}{2h}$. The input to $\\textcolor{c1}{f}$ changes twice as fast as $x$.}\n\\columnbreak\n\\begin{js}[size=940x560, frames=3, alt=\"A schematic of g(x) = f(2x): x goes into a box that doubles it, and 2x goes into a box labeled f, which outputs f(2x). Below, two number lines with the same scale. A step of length h from 1 on the x line is carried to a step of length 2h from 2 on the 2x line.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction arrow(xa, xb, y) {\n  ctx.strokeStyle = colors.ink; ctx.fillStyle = colors.ink; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(xa, y); ctx.lineTo(xb - 14, y); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(xb, y); ctx.lineTo(xb - 16, y - 9); ctx.lineTo(xb - 16, y + 9); ctx.closePath(); ctx.fill();\n}\nfunction box(xa, xb, y, label, color) {\n  ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.roundRect(xa, y - 38, xb - xa, 76, 12); ctx.stroke();\n  ctx.fillStyle = color; ctx.font = font(34); ctx.textAlign = 'center';\n  ctx.fillText(label, (xa + xb) / 2, y + 12);\n}\n// the composition, as a pipeline\nconst py = 80;\nctx.textAlign = 'center'; ctx.font = font(34); ctx.fillStyle = colors.text;\nctx.fillText('x', 30, py + 12);\narrow(55, 125, py);\nbox(130, 290, py, 'double', colors.c2);\narrow(295, 365, py);\nctx.fillStyle = colors.c2; ctx.font = font(34); ctx.textAlign = 'center'; ctx.fillText('2x', 405, py + 12);\narrow(445, 515, py);\nbox(520, 610, py, 'f', colors.c1);\narrow(615, 685, py);\nctx.fillStyle = colors.text; ctx.textAlign = 'left'; ctx.fillText('f(2x)', 695, py + 12);\n// two number lines with the same scale\nconst x0 = 150, sc = 130, a = 1, hh = 0.6;\nconst P = (v) => x0 + v * sc;\nconst rows = [{ y: 290, name: 'x', lo: a, hi: a + hh, col: colors.ink, tag: 'h' },\n              { y: 470, name: '2x', lo: 2 * a, hi: 2 * a + 2 * hh, col: colors.c2, tag: '2h' }];\nif (local >= 1) {\n  if (local >= 2) {\n    ctx.globalAlpha = 0.15; ctx.fillStyle = colors.c2;\n    ctx.beginPath(); ctx.moveTo(P(rows[0].lo), rows[0].y); ctx.lineTo(P(rows[0].hi), rows[0].y);\n    ctx.lineTo(P(rows[1].hi), rows[1].y); ctx.lineTo(P(rows[1].lo), rows[1].y); ctx.closePath(); ctx.fill();\n    ctx.globalAlpha = 1;\n  }\n  rows.forEach((r, i) => {\n    ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(P(0), r.y); ctx.lineTo(w - 20, r.y); ctx.stroke();\n    ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n    for (let k = 0; k <= 5; k++) {\n      ctx.beginPath(); ctx.moveTo(P(k), r.y - 8); ctx.lineTo(P(k), r.y + 8); ctx.stroke();\n      ctx.fillText(String(k), P(k), r.y + 40);\n    }\n    ctx.textAlign = 'right'; ctx.font = font(32); ctx.fillStyle = i ? colors.c2 : colors.text;\n    ctx.fillText(r.name, P(0) - 24, r.y + 11);\n    if (i === 0 || local >= 2) {\n      ctx.strokeStyle = r.col; ctx.lineWidth = 10;\n      ctx.beginPath(); ctx.moveTo(P(r.lo), r.y); ctx.lineTo(P(r.hi), r.y); ctx.stroke();\n      ctx.fillStyle = r.col; ctx.font = font(32); ctx.textAlign = 'center';\n      ctx.fillText(r.tag, (P(r.lo) + P(r.hi)) / 2, r.y - 22);\n    }\n  });\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Check 1: Powers}\n\\begin{columns}[6 6, parallel]\nLet $f(x)=x^3$ and $g(x)=f(2x)$.\n$$g(x)=(2x)^3=8x^3$$\n\\pause\n$$g'(x)=24x^2$$\nRewrite using $f'(x)=3x^2$:\n$$g'(x)=\\textcolor{c1}{2}\\cdot3(\\textcolor{c2}{2x})^2=\\textcolor{c1}{2}f'(\\textcolor{c2}{2x})$$\n\\columnbreak\n\\begin{plot}\nf = x^3\nlabel = x^3 @ 1.2\nf2 = 8x^3\nlabel2 = (2x)^3 @ 0.55\ndomain = -2:2\nrange = -2:2\naspect = equal\nsize = 640\nxticks = 1\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{Check 2: Exponentials}\n\\begin{columns}[6 6, parallel]\nLet $f(x)=e^x$ and $g(x)=f(2x)$.\n$$g(x)=e^{2x}=e^x\\cdot e^x$$\n\\pause\nBy the product rule,\n$$g'(x)=e^xe^x+e^xe^x=2e^{2x}$$\nRewrite using $f'(x)=e^x$:\n$$g'(x)=\\textcolor{c1}{2}f'(\\textcolor{c2}{2x})$$\n\\columnbreak\n\\begin{plot}\nf = e^x\nlabel = e^x @ 1.1\nf2 = e^(2x)\nlabel2 = e^{2x} @ 0.4\ndomain = -2.5:1.5\nrange = -0.5:3.5\naspect = equal\nsize = 640\nxticks = 1\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{Check 3: Sine}\nBy the double-angle formula,\n$$\\sin(2x)=2\\sin x\\cos x.$$\n\\pause\nDifferentiate using the product rule:\n\\begin{align}\n\\frac{d}{dx}\\sin(2x)\n&=2\\left[(\\sin x)'\\cos x+\\sin x\\,(\\cos x)'\\right] \\\\\n&=2\\left[\\cos^2x-\\sin^2x\\right] \\\\\n&=2\\cos(2x).\n\\end{align}\nSince $f(x)=\\sin x$ has $f'(x)=\\cos x$,\n$$\\frac{d}{dx}\\sin(2x)=\\textcolor{c1}{2}f'(\\textcolor{c2}{2x}).$$\n\n\\slide{The Pattern}\n$$\\def\\arraystretch{1.5}\\begin{array}{c|c|c}\nf(x) & g(x)=f(2x) & g'(x) \\\\ \\hline\nx^n & (2x)^n & 2\\cdot n(2x)^{n-1} \\\\\ne^x & e^{2x} & 2e^{2x} \\\\\n\\sin x & \\sin(2x) & 2\\cos(2x)\n\\end{array}$$\n\\pause\n\\begin{note}{Conjecture}\n$$\\frac{d}{dx}f(2x)=\\textcolor{c1}{2}\\,f'(\\textcolor{c2}{2x}).$$\n\\end{note}\n\n\\slide{Picture: Squeezing the Graph}\n\\begin{columns}[4 8, parallel]\nThe graph of $y=f(2x)$ is the graph of $y=f(x)$ squeezed horizontally by a factor of $2$.\n\n\\uncover<2->{Same \\textcolor{c4}{rise}. Half the \\textcolor{c2}{run}.}\n\n\\uncover<3->{Therefore, the slope doubles.}\n\\columnbreak\n\\begin{js}[size=1060x640, frames=4, alt=\"The graph of y = sin(cx), with c increasing from 1 to 2. The graph squeezes horizontally toward the y-axis, the rise of the slope triangle stays the same, its run shrinks, and the tangent line gets steeper.\"]\nconst CS = [1, 1.3, 1.65, 2];\nconst c = CS[Math.min(local, CS.length - 1)];\nconst L = 60, R = 25, T = 30, B = 55;\nconst x0 = -3.4, x1 = 3.4;\nconst s = (w - L - R) / (x1 - x0);\nconst y1 = (h - T - B) / s / 2, y0 = -y1;\nconst X = x => L + (x - x0) * s;\nconst Y = y => h - B - (y - y0) * s;\nfunction line(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke();\n  ctx.setLineDash([]);\n}\nfunction curve(fn, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath();\n  for (let i = 0; i <= 500; i++) {\n    const x = x0 + (x1 - x0) * i / 500;\n    const y = fn(x);\n    if (i === 0) ctx.moveTo(X(x), Y(y)); else ctx.lineTo(X(x), Y(y));\n  }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfor (let gx = -3; gx <= 3; gx++) line(gx, y0, gx, y1, colors.grid, 1);\nfor (let gy = -1; gy <= 1; gy++) line(x0, gy, x1, gy, colors.grid, 1);\nline(x0, 0, x1, 0, colors.axis, 2);\nline(0, y0, 0, y1, colors.axis, 2);\nctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip();\ncurve(Math.sin, colors.muted, 3, [12, 10]);\ncurve(x => Math.sin(c * x), colors.curve, 5);\nconst u = 0.8, px = u / c, py = Math.sin(u), m = c * Math.cos(u);\nline(x0, py + m * (x0 - px), x1, py + m * (x1 - px), colors.tangent, 4, [12, 8]);\nctx.restore();\nctx.fillStyle = colors.c1; ctx.beginPath(); ctx.arc(X(px), Y(py), 11, 0, 2 * Math.PI); ctx.fill();\nctx.strokeStyle = colors.c2; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(X(px), Y(py)); ctx.lineTo(X(px + 1 / c), Y(py)); ctx.stroke();\nctx.strokeStyle = colors.c4; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(X(px + 1 / c), Y(py)); ctx.lineTo(X(px + 1 / c), Y(py + Math.cos(u))); ctx.stroke();\nctx.font = \"32px 'JetBrains Mono', monospace\";\nctx.fillStyle = colors.muted; ctx.fillText('dashed: sin x', 70, 64);\nctx.fillStyle = colors.curve; ctx.fillText('solid: sin(cx)', 70, 106);\nctx.fillStyle = colors.text; ctx.fillText('c = ' + c.toFixed(2), w - 250, h - 80);\n\\end{js}\n\\end{columns}\n\n\\slide{Proof of the Special Case}\nLet $g(x)=f(2x)$. Then\n\\begin{align}\ng'(x) &= \\lim_{h\\to0}\\frac{f(2x+2h)-f(2x)}{h} \\\\\n&= \\lim_{h\\to0}2\\cdot\\frac{f(2x+\\textcolor{c2}{2h})-f(2x)}{\\textcolor{c2}{2h}}.\n\\end{align}\n\\pause\nWrite $\\textcolor{c2}{k}=\\textcolor{c2}{2h}$. Then $k\\to0$ as $h\\to0$, and\n$$g'(x)=2\\lim_{k\\to0}\\frac{f(2x+k)-f(2x)}{k}=2f'(2x).$$\n\n\\slide{Linear Inside}\n\\begin{theorem}{Linear Inside}\nFor constants $a$ and $b$,\n$$\\frac{d}{dx}f(ax+b)=\\textcolor{c1}{a}\\,f'(\\textcolor{c2}{ax+b}).$$\n\\end{theorem}\nThe factor $\\textcolor{c1}{a}$ is the slope of the inside function $ax+b$.\n\\pause\n\\begin{example}{}\n$$\\frac{d}{dx}\\cos(3x)=-3\\sin(3x),\\qquad \\frac{d}{dx}e^{5x-1}=5e^{5x-1}.$$\n\\end{example}\n\n\\section{Curved Inside Functions}\n\n\\slide{Now Let the Inside Be $x^2$}\n\\begin{columns}[6 6, parallel]\nIf $f(u)=u^n$ and $g(x)=f(x^2)$, then\n$$g(x)=(x^2)^n=x^{2n}.$$\n\\pause\n\\begin{align}\ng'(x)&=2n x^{2n-1} \\\\\n&=n(x^2)^{n-1}\\cdot \\textcolor{c2}{2x} \\\\\n&=f'(x^2)\\cdot \\textcolor{c2}{2x}.\n\\end{align}\n\\columnbreak\n\\begin{plot}\nf = x^2\nlabel = x^2 @ 1.7\na = 1\ntangent = true\npoints = 1\ndomain = -2:2\nrange = -0.5:3.5\naspect = equal\nsize = 620\nxticks = 1\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{The New Factor Changes From Point to Point}\nFor $g(x)=f(x^2)$, the inside function has derivative\n$$\\frac{d}{dx}x^2=\\textcolor{c2}{2x}.$$\nSo the natural guess is\n$$\\frac{d}{dx}f(x^2)=\\textcolor{c1}{f'(x^2)}\\cdot\\textcolor{c2}{2x}.$$\n\\pause\nThis is already enough to predict:\n$$\\frac{d}{dx}e^{x^2}=e^{x^2}\\cdot2x,\n\\qquad\n\\frac{d}{dx}\\sin(x^2)=\\cos(x^2)\\cdot2x.$$\n\n\\slide{The Change in the Inside}\n\\begin{columns}[7 5, parallel]\nWhen $x$ changes by $h$, the inside $x^2$ changes by an amount we call $\\textcolor{c2}{k}$:\n$$(x+h)^2=x^2+\\underbrace{2xh+h^2}_{\\textcolor{c2}{k}}$$\n\\pause\nTwo facts about $k$:\n$$\\lim_{h\\to0}k=0,$$\n$$\\lim_{h\\to0}\\frac{k}{h}=\\lim_{h\\to0}(2x+h)=2x.$$\nAlso $k=h(2x+h)\\neq0$ for small $h\\neq0$.\n\\columnbreak\n\\begin{js}[size=660x340, alt=\"Two number lines with the same scale. A step of length h from 1 on the x line is carried by squaring to a step of length k from 1 to 2.25 on the x squared line.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst x0 = 110, sc = 130, a = 1, hh = 0.5;\nconst P = (v) => x0 + v * sc;\nconst rows = [{ y: 90, name: 'x', lo: a, hi: a + hh, col: colors.ink, tag: 'h' },\n              { y: 260, name: 'x²', lo: a * a, hi: (a + hh) * (a + hh), col: colors.c2, tag: 'k' }];\nctx.globalAlpha = 0.15; ctx.fillStyle = colors.c2;\nctx.beginPath(); ctx.moveTo(P(rows[0].lo), rows[0].y); ctx.lineTo(P(rows[0].hi), rows[0].y);\nctx.lineTo(P(rows[1].hi), rows[1].y); ctx.lineTo(P(rows[1].lo), rows[1].y); ctx.closePath(); ctx.fill();\nctx.globalAlpha = 1;\nrows.forEach((r, i) => {\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(P(0), r.y); ctx.lineTo(w - 10, r.y); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  for (let k = 0; k <= 4; k++) {\n    ctx.beginPath(); ctx.moveTo(P(k), r.y - 8); ctx.lineTo(P(k), r.y + 8); ctx.stroke();\n    ctx.fillText(String(k), P(k), r.y + 40);\n  }\n  ctx.textAlign = 'right'; ctx.font = font(32); ctx.fillStyle = i ? colors.c2 : colors.text;\n  ctx.fillText(r.name, P(0) - 22, r.y + 11);\n  ctx.strokeStyle = r.col; ctx.lineWidth = 10;\n  ctx.beginPath(); ctx.moveTo(P(r.lo), r.y); ctx.lineTo(P(r.hi), r.y); ctx.stroke();\n  ctx.fillStyle = r.col; ctx.font = font(32); ctx.textAlign = 'center';\n  ctx.fillText(r.tag, (P(r.lo) + P(r.hi)) / 2, r.y - 22);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Confirm the Guess: $e^{x^2}$}\nWith $k=(x+h)^2-x^2$ from the previous slide,\n\\begin{align}\n\\frac{d}{dx}e^{x^2}\n&=\\lim_{h\\to0}\\frac{e^{(x+h)^2}-e^{x^2}}{h} \\\\\n&=\\lim_{h\\to0}\\textcolor{c1}{\\frac{e^{x^2+k}-e^{x^2}}{k}}\\cdot\\textcolor{c2}{\\frac{k}{h}} \\\\\n&=\\lim_{h\\to0}\\textcolor{c1}{\\frac{e^{x^2+k}-e^{x^2}}{k}}\\cdot\\lim_{h\\to0}\\textcolor{c2}{\\frac{k}{h}} \\\\\n&=\\textcolor{c1}{e^{x^2}}\\cdot\\textcolor{c2}{2x}.\n\\end{align}\n\\pause\nThe \\textcolor{c1}{first limit} is the derivative of $e^u$ at $u=x^2$, because $k\\to0$ with $k\\neq0$. The \\textcolor{c2}{second limit} is $2x$ from the previous slide.\n\n\\slide{Confirm the Guess: $\\sin(x^2)$}\nWith the same $k=(x+h)^2-x^2$,\n\\begin{align}\n\\frac{d}{dx}\\sin(x^2)\n&=\\lim_{h\\to0}\\frac{\\sin((x+h)^2)-\\sin(x^2)}{h} \\\\\n&=\\lim_{h\\to0}\\textcolor{c1}{\\frac{\\sin(x^2+k)-\\sin(x^2)}{k}}\\cdot\\textcolor{c2}{\\frac{k}{h}} \\\\\n&=\\lim_{h\\to0}\\textcolor{c1}{\\frac{\\sin(x^2+k)-\\sin(x^2)}{k}}\\cdot\\lim_{h\\to0}\\textcolor{c2}{\\frac{k}{h}} \\\\\n&=\\textcolor{c1}{\\cos(x^2)}\\cdot\\textcolor{c2}{2x}.\n\\end{align}\n\\pause\nThe \\textcolor{c1}{first limit} is the derivative of $\\sin u$ at $u=x^2$, because $k\\to0$ with $k\\neq0$. The \\textcolor{c2}{second limit} is $2x$.\n\n\\slide{The Chain Rule}\n\\begin{theorem}{The Chain Rule}\nIf $g$ is differentiable at $x$ and $f$ is differentiable at $g(x)$, then $F(x)=f(g(x))$ is differentiable at $x$ and\n$$F'(x)=\\textcolor{c1}{f'(g(x))}\\cdot\\textcolor{c2}{g'(x)}.$$\n\\end{theorem}\n\\pause\n\\begin{center}\n\\textcolor{c1}{derivative of the outside, evaluated at the inside}\\\\\n\\textbf{times}\\\\\n\\textcolor{c2}{derivative of the inside}\n\\end{center}\nIn Leibniz notation,\n$$\\frac{dy}{dx}=\\textcolor{c1}{\\frac{dy}{du}}\\cdot\\textcolor{c2}{\\frac{du}{dx}}.$$\n\n\\slide{Why the Chain Rule Is True}\n\\begin{columns}[6 6, parallel]\nNear $g(x)$, the graph of $f$ is close to its tangent line, which has slope $f'(g(x))$.\n\nA step of size $r$ changes $f$ by the \\textcolor{c1}{rise along the tangent line} plus a \\textcolor{c4}{small gap}:\n\\begin{align}\n&f(g(x)+r)-f(g(x)) \\\\\n&\\qquad=\\textcolor{c1}{f'(g(x))\\,r}+\\textcolor{c4}{E(r)\\,r}\n\\end{align}\n\\uncover<2->{Here $E(r)$ is the secant slope minus the tangent slope. It tends to $0$ as $r\\to0$, and we set $E(0)=0$.}\n\\columnbreak\n\\begin{js}[size=800x560, frames=4, alt=\"A sample graph y = f(u) with its tangent line at u = g(x). A step of size r to the right is shown. At u = g(x) + r, the vertical change of f splits into the rise along the tangent line and a small gap between the tangent line and the curve. As r shrinks, the gap shrinks faster than r.\"]\nconst RS = [1.2, 0.8, 0.5, 0.25];\nconst target = RS[Math.min(local, 3)];\nconst f = (u) => u * u / 3, a = 1, m = 2 / 3;\nconst L = 40, R = 20, T = 20, B = 60;\nconst x0 = -0.4, x1 = 3.2;\nconst s = (w - L - R) / (x1 - x0);\nconst y0 = -0.35, y1 = y0 + (h - T - B) / s;\nconst X = (u) => L + (u - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction scene(r) {\n  for (let k = 0; k <= 3; k++) seg(k, y0, k, y1, colors.grid, 1);\n  for (let k = 0; k <= 1; k++) seg(x0, k, x1, k, colors.grid, 1);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip();\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const u = x0 + (x1 - x0) * i / 300; if (i) ctx.lineTo(X(u), Y(f(u))); else ctx.moveTo(X(u), Y(f(u))); }\n  ctx.stroke();\n  seg(x0, f(a) + m * (x0 - a), x1, f(a) + m * (x1 - a), colors.tangent, 3, [12, 8]);\n  ctx.restore();\n  const q = a + r, tq = f(a) + m * r;\n  seg(a, f(a), q, f(a), colors.muted, 3, [8, 6]);\n  seg(q, f(a), q, tq, colors.c1, 9);\n  seg(q, tq, q, f(q), colors.c4, 9);\n  seg(a, 0, a, f(a), colors.muted, 2, [4, 6]); seg(q, 0, q, f(a), colors.muted, 2, [4, 6]);\n  ctx.fillStyle = colors.c1; ctx.beginPath(); ctx.arc(X(a), Y(f(a)), 10, 0, 2 * Math.PI); ctx.fill();\n  ctx.fillStyle = colors.curve; ctx.beginPath(); ctx.arc(X(q), Y(f(q)), 8, 0, 2 * Math.PI); ctx.fill();\n  ctx.font = font(26); ctx.fillStyle = colors.text;\n  ctx.textAlign = 'right'; ctx.fillText('g(x)', X(a) + 4, Y(0) + 34);\n  ctx.textAlign = 'left'; ctx.fillText('g(x)+r', X(q) - 4, Y(0) + 34);\n  ctx.textAlign = 'center'; ctx.fillText('r', (X(a) + X(q)) / 2, Y(f(a)) + 32);\n  ctx.textAlign = 'left'; ctx.fillStyle = colors.curve; ctx.font = font(28);\n  ctx.fillText('y = f(u)', X(2.5), Y(1.8));\n  ctx.fillStyle = colors.background; ctx.fillRect(L + 8, T - 4, 260, 100);\n  ctx.fillStyle = colors.text; ctx.font = font(30);\n  ctx.fillText('r    = ' + r.toFixed(2), L + 18, T + 40);\n  ctx.fillStyle = colors.c4; ctx.fillText('E(r) = ' + (r / 3).toFixed(2), L + 18, T + 82);\n}\nif (state.r === undefined) state.r = target;\nconst start = state.r;\nonFrame((t) => {\n  const p = Math.min(t / 0.8, 1), e = 1 - Math.pow(1 - p, 3);\n  const r = start * Math.pow(target / start, e);\n  state.r = r;\n  ctx.clearRect(0, 0, w, h);\n  scene(r);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Why the Chain Rule Is True, Continued}\nLet $k=g(x+h)-g(x)$ be the change in the inside, and take $r=k$. Since $g(x)+k=g(x+h)$,\n$$f(g(x+h))-f(g(x))=\\textcolor{c1}{f'(g(x))\\,k}+\\textcolor{c4}{E(k)\\,k}.$$\nThis holds even when $k=0$, since then both sides are $0$. We never divide by $k$.\n\\pause\nDivide by $h$:\n$$\\frac{f(g(x+h))-f(g(x))}{h}=\\big(\\textcolor{c1}{f'(g(x))}+\\textcolor{c4}{E(k)}\\big)\\cdot\\textcolor{c2}{\\frac{k}{h}}.$$\n\\pause\nAs $h\\to0$, $k\\to0$ and hence $E(k)\\to0$. Also $k/h\\to g'(x)$. Therefore,\n$$F'(x)=\\lim_{h\\to0}\\big(\\textcolor{c1}{f'(g(x))}+\\textcolor{c4}{E(k)}\\big)\\cdot\\lim_{h\\to0}\\textcolor{c2}{\\frac{k}{h}}=\\textcolor{c1}{f'(g(x))}\\cdot\\textcolor{c2}{g'(x)}.$$\n\n\\section{Using the Chain Rule}\n\\Large{$\\displaystyle\\frac{d}{dx}f(g(x))=\\textcolor{c1}{f'(g(x))}\\cdot\\textcolor{c2}{g'(x)}$}\n\n\\slide{A Four-Step Routine}\n\\begin{enumerate}\n\\item Name the inside: $\\textcolor{c2}{u=g(x)}$.\n\\item Differentiate the outside: $\\textcolor{c1}{f'(u)}$.\n\\item Substitute back: $\\textcolor{c1}{f'(g(x))}$.\n\\item Multiply by the inside derivative: $\\textcolor{c2}{g'(x)}$.\n\\end{enumerate}\n\\begin{note}{Tip}\nKeep the inside unchanged until the last step. For $\\sin(x^2)$, the outside derivative is $\\cos(x^2)$, not $\\cos(2x)$.\n\\end{note}\n\n\\slide{Inside and Outside}\n\\begin{table}\nFunction & Outside & Inside\n$e^{-x^2}$ & \\uncover<1->{$\\textcolor{c1}{e^u}$} & \\uncover<1->{$\\textcolor{c2}{u=-x^2}$}\n$\\sin(x^2)$ & \\uncover<2->{$\\textcolor{c1}{\\sin u}$} & \\uncover<2->{$\\textcolor{c2}{u=x^2}$}\n$\\sqrt{1+x^2}$ & \\uncover<3->{$\\textcolor{c1}{\\sqrt{u}}$} & \\uncover<3->{$\\textcolor{c2}{u=1+x^2}$}\n$\\sin^2x=(\\sin x)^2$ & \\uncover<4->{$\\textcolor{c1}{u^2}$} & \\uncover<4->{$\\textcolor{c2}{u=\\sin x}$}\n$\\cos(5x)$ & \\uncover<5->{$\\textcolor{c1}{\\cos u}$} & \\uncover<5->{$\\textcolor{c2}{u=5x}$}\n\\end{table}\n\n\\slide{You Try}\n\\begin{youtry}[60]\nName the outside function and the inside function of $y=(3x^2-1)^5$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\n$$y=(3x^2-1)^5$$\nOutside: $\\textcolor{c1}{u^5}$. Inside: $\\textcolor{c2}{u=3x^2-1}$.\n\n\\slide{You Try}\n\\begin{youtry}[60]\nName the outside function and the inside function of $y=\\cos(\\sqrt{x})$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\n$$y=\\cos(\\sqrt{x})$$\nOutside: $\\textcolor{c1}{\\cos u}$. Inside: $\\textcolor{c2}{u=\\sqrt{x}}$.\n\n\\slide{Example 1: $y=(1+x^2)^{10}$}\nOutside: $\\textcolor{c1}{u^{10}}$. Inside: $\\textcolor{c2}{u=1+x^2}$.\n\\pause\n$$y'=\\textcolor{c1}{10(1+x^2)^9}\\cdot\\textcolor{c2}{2x}$$\n$$\\boxed{y'=20x(1+x^2)^9}$$\n\n\\slide{You Try}\n\\begin{youtry}[60]\nDifferentiate $y=\\sqrt{x^2+9}$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[6 6, parallel]\nWrite $y=(x^2+9)^{1/2}$.\n$$y'=\\textcolor{c1}{\\frac12(x^2+9)^{-1/2}}\\cdot\\textcolor{c2}{2x}$$\n$$\\boxed{y'=\\frac{x}{\\sqrt{x^2+9}}}$$\nAt $x=4$: $y=5$ and $y'=0.8$.\n\\columnbreak\n\\begin{plot}\nf = sqrt(x^2+9)\na = 4\ntangent = true\npoints = 4\ndomain = -6:6\nrange = -0.5:8\naspect = equal\nsize = 760\nxticks = 2\nyticks = 2\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 2: $y=e^{-x^2}$}\nOutside: $\\textcolor{c1}{e^u}$. Inside: $\\textcolor{c2}{u=-x^2}$.\n\\pause\n$$y'=\\textcolor{c1}{e^{-x^2}}\\cdot\\textcolor{c2}{(-2x)}=\\boxed{-2xe^{-x^2}}$$\n\\begin{plot}\nf = e^(-x^2)\nf2 = -2x e^(-x^2)\nlabel = e^{-x^2} @ 1.3\nlabel2 = -2xe^{-x^2} @ 0.8\ndomain = -3:3\nrange = -1.2:1.2\naspect = equal\nsize = 1300\nxticks = 1\nyticks = 0.5\n\\end{plot}\n\n\\slide{Example 3: $\\sin(x^2)$ Versus $\\sin^2x$}\n\\begin{columns}[6 6, parallel]\n\\heading{$y=\\sin(x^2)$}\nOutside: $\\textcolor{c1}{\\sin u}$. Inside: $\\textcolor{c2}{u=x^2}$.\n\\pause\n$$y'=\\textcolor{c1}{\\cos(x^2)}\\cdot\\textcolor{c2}{2x}$$\n\\columnbreak\n\\heading{$y=\\sin^2x=(\\sin x)^2$}\nOutside: $\\textcolor{c1}{u^2}$. Inside: $\\textcolor{c2}{u=\\sin x}$.\n\\pause\n$$y'=\\textcolor{c1}{2\\sin x}\\cdot\\textcolor{c2}{\\cos x}$$\n\\end{columns}\n\\begin{center}\nSame symbols, different inside functions.\n\\end{center}\n\n\\slide{You Try}\n\\begin{youtry}[60]\nDifferentiate $y=\\cos(x^3)$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[6 6, parallel]\nOutside: $\\textcolor{c1}{\\cos u}$. Inside: $\\textcolor{c2}{u=x^3}$.\n$$y'=\\textcolor{c1}{-\\sin(x^3)}\\cdot\\textcolor{c2}{3x^2}$$\n$$\\boxed{y'=-3x^2\\sin(x^3)}$$\n\\columnbreak\n\\begin{plot}\nf = cos(x^3)\ndomain = -2:2\nrange = -1.5:1.5\naspect = equal\nsize = 760\nxticks = 1\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 4: $y=e^{\\sin x}$}\n\\begin{columns}[6 6, parallel]\nOutside: $\\textcolor{c1}{e^u}$. Inside: $\\textcolor{c2}{u=\\sin x}$.\n\\pause\n$$y'=\\textcolor{c1}{e^{\\sin x}}\\cdot\\textcolor{c2}{\\cos x}$$\nAt $x=0$, the slope is $e^0\\cos0=1$.\n\\columnbreak\n\\begin{plot}\nf = e^(sin x)\na = 0\ntangent = true\npoints = 0\ndomain = -pi:pi\nrange = -0.5:3.5\nxticks = pi/2\naspect = equal\nsize = 780\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{Two Common Mistakes}\nDifferentiate $y=\\sin(x^2)$.\n\\pause\n\\begin{itemize}\n\\item \\alert{Wrong:} $\\cos(x^2)$. The factor $\\textcolor{c2}{2x}$ is missing.\n\\item \\alert{Wrong:} $2x\\cos(2x)$. The outside derivative is evaluated at the wrong place.\n\\item \\accent{Right:} $\\textcolor{c1}{\\cos(x^2)}\\cdot\\textcolor{c2}{2x}$.\n\\end{itemize}\n\n\\section{Combining Rules}\n\n\\slide{Example 5: Product Plus Chain Rule}\nDifferentiate $y=xe^{-x^2}$.\n\\pause\nBy the product rule,\n$$y'=(x)'e^{-x^2}+x\\,(e^{-x^2})'.$$\nBy the chain rule,\n$$(e^{-x^2})'=e^{-x^2}(-2x).$$\n\\pause\nTherefore,\n$$y'=e^{-x^2}+x e^{-x^2}(-2x)=\\boxed{(1-2x^2)e^{-x^2}}.$$\n\n\\slide{You Try}\n\\begin{youtry}[90]\nDifferentiate $y=e^{2x}\\sin(3x)$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\nBy the product rule,\n$$y'=(e^{2x})'\\sin(3x)+e^{2x}(\\sin(3x))'.$$\nBy the chain rule,\n$$(e^{2x})'=2e^{2x},\\qquad (\\sin(3x))'=3\\cos(3x).$$\nThus,\n$$\\boxed{y'=e^{2x}\\big(2\\sin(3x)+3\\cos(3x)\\big)}.$$\n\n\\slide{Example 6: Quotient Plus Chain Rule}\nDifferentiate\n$$y=\\frac{\\sin(2x)}{x^2+1}.$$\nTop: $T=\\sin(2x)$, so $T'=2\\cos(2x)$.\n\nBottom: $B=x^2+1$, so $B'=2x$.\n\\pause\n$$y'=\\frac{T'B-TB'}{B^2}=\\boxed{\\frac{2\\cos(2x)(x^2+1)-2x\\sin(2x)}{(x^2+1)^2}}$$\n\n\\slide{You Try}\n\\begin{youtry}[60]\nName the three layers of $y=\\sqrt{\\sin(4x)}$, from the outside in.\n\\end{youtry}\n\n\\slide{You Try: Solution}\n$$y=\\sqrt{\\sin(4x)}$$\nLayers: $\\textcolor{c1}{\\sqrt{u}}$, $\\textcolor{c2}{u=\\sin v}$, $\\textcolor{c3}{v=4x}$.\n\n\\slide{Example 7: Three Layers}\n\\begin{columns}[6 6, parallel]\nDifferentiate $y=e^{\\cos(3x)}$.\n\n\\medskip\nLayers:\n$$\\textcolor{c1}{e^u},\\qquad \\textcolor{c2}{u=\\cos v},\\qquad \\textcolor{c3}{v=3x}.$$\n\\pause\n$$y'=\\textcolor{c1}{e^{\\cos(3x)}}\\cdot\\textcolor{c2}{\\big(-\\sin(3x)\\big)}\\cdot\\textcolor{c3}{3}$$\n$$\\boxed{y'=-3\\sin(3x)e^{\\cos(3x)}}$$\n\\columnbreak\n\\begin{plot}\nf = e^(cos(3x))\ndomain = -pi:pi\nrange = -0.5:3\nxticks = pi/3\naspect = equal\nsize = 780\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{You Try}\n\\begin{youtry}[90]\nDifferentiate $y=\\cos^3(2x)$.\n\\end{youtry}\n\n\\slide{You Try: Solution}\nWrite $y=(\\cos(2x))^3$. Layers:\n$$\\textcolor{c1}{u^3},\\qquad \\textcolor{c2}{u=\\cos v},\\qquad \\textcolor{c3}{v=2x}.$$\n$$y'=\\textcolor{c1}{3\\cos^2(2x)}\\cdot\\textcolor{c2}{\\big(-\\sin(2x)\\big)}\\cdot\\textcolor{c3}{2}$$\n$$\\boxed{y'=-6\\cos^2(2x)\\sin(2x)}.$$\n\n\\section{More Places the Chain Rule Appears}\n\n\\slide{Exponentials With Any Base}\n\\begin{columns}[6 6, parallel]\nFor $b>0$, $b=e^{\\ln b}$. Thus,\n$$b^x=e^{(\\ln b)x}.$$\nThis has a linear inside, with slope $\\ln b$.\n\\pause\n\\begin{theorem}{Exponential Functions}\n$$\\frac{d}{dx}b^x=(\\ln b)b^x.$$\n\\end{theorem}\n\\columnbreak\n\\begin{plot}\nf = 2^x\nlabel = 2^x @ 1.4\nf2 = (ln 2)(2^x)\nlabel2 = (\\ln 2)2^x @ 0.1\ndomain = -3:2\nrange = -0.5:4\naspect = equal\nsize = 700\nxticks = 1\nyticks = 1\n\\end{plot}\n\\end{columns}\n\n\\slide{Degrees and Radians}\nMeasured in degrees,\n$$\\sin(x^\\circ)=\\sin\\left(\\frac{\\pi x}{180}\\right).$$\nThe inside is linear with slope $\\pi/180$.\n\\pause\n$$\\frac{d}{dx}\\sin(x^\\circ)=\\frac{\\pi}{180}\\cos\\left(\\frac{\\pi x}{180}\\right)=\\frac{\\pi}{180}\\cos(x^\\circ).$$\nThis is why our derivative formulas for trig functions assume radians.\n\n\\slide{Units: A Weather Balloon}\n\\begin{columns}[7 5, parallel]\nA weather balloon rises at $5$ m/s. The air temperature $T$ drops by $6.5^\\circ$C for each km of altitude $a$. How fast is the temperature at the balloon changing?\n\\pause\n\\begin{align}\n\\frac{dT}{dt}\n&=\\textcolor{c1}{\\frac{dT}{da}}\\cdot\\textcolor{c2}{\\frac{da}{dt}} \\\\\n&=\\left(\\textcolor{c1}{-0.0065\\,\\frac{^\\circ\\mathrm C}{\\mathrm m}}\\right)\\left(\\textcolor{c2}{5\\,\\frac{\\mathrm m}{\\mathrm s}}\\right) \\\\\n&=-0.0325\\,\\frac{^\\circ\\mathrm C}{\\mathrm s}.\n\\end{align}\nThat is about $2^\\circ$C colder every minute.\n\\columnbreak\n\\begin{js}[size=560x640, alt=\"A weather balloon rising through the air from 0 to 2.7 km, with readouts of time, altitude, and temperature. The temperature starts at 15 degrees Celsius and falls as the balloon rises.\"]\nconst L = 110, R = 20, TOP = 20, BOT = 30;\nconst aMax = 3000;\nconst Yalt = (a) => h - BOT - a / aMax * (h - TOP - BOT);\nonFrame((t) => {\n  ctx.clearRect(0, 0, w, h);\n  const grad = ctx.createLinearGradient(0, Yalt(0), 0, Yalt(aMax));\n  grad.addColorStop(0, '#F9DDBF'); grad.addColorStop(1, '#CFE2F3');\n  ctx.fillStyle = grad; ctx.fillRect(L, TOP, w - L - R, h - TOP - BOT);\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(L, Yalt(0)); ctx.lineTo(L, Yalt(aMax)); ctx.stroke();\n  ctx.font = \"28px 'JetBrains Mono', monospace\"; ctx.fillStyle = colors.text; ctx.textAlign = 'right';\n  for (let km = 0; km <= 3; km++) {\n    ctx.beginPath(); ctx.moveTo(L - 10, Yalt(1000 * km)); ctx.lineTo(L, Yalt(1000 * km)); ctx.stroke();\n    ctx.fillText(km + ' km', L - 16, Yalt(1000 * km) + 9);\n  }\n  ctx.textAlign = 'left';\n  const ts = (t * 50) % 540;\n  const a = 5 * ts, temp = 15 - 0.0065 * a;\n  const bx = L + 0.28 * (w - L - R), by = Yalt(a);\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(bx, by + 30); ctx.lineTo(bx, by + 60); ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.fillRect(bx - 10, by + 60, 20, 16);\n  ctx.fillStyle = colors.c1; ctx.beginPath(); ctx.arc(bx, by, 30, 0, 2 * Math.PI); ctx.fill();\n  ctx.fillStyle = colors.background; ctx.fillRect(w - R - 262, TOP + 12, 250, 140);\n  ctx.fillStyle = colors.text; ctx.font = \"30px 'JetBrains Mono', monospace\";\n  ctx.fillText('t = ' + Math.round(ts) + ' s', w - R - 250, TOP + 52);\n  ctx.fillText('a = ' + Math.round(a) + ' m', w - R - 250, TOP + 95);\n  ctx.fillText('T = ' + temp.toFixed(1) + ' °C', w - R - 250, TOP + 138);\n});\n\\end{js}\n\\end{columns}\n\n\\section{Graphs and Tables}\n\n\\slide{Reading Graphs}\nLet $h(x)=f(g(x))$. Find $h'(1)$.\n\\begin{columns}[8 4, parallel]\n\\begin{js}[size=1060x520, frames=3, alt=\"Two piecewise linear graphs. The graph of f joins (0,1), (2,5), (4,4), (6,6). The graph of g joins (0,4), (2,2), (5,5), (6,5). The point (1, 3) on g is marked, then the point (3, 4.5) on f.\"]\nconst FP = [[0,1],[2,5],[4,4],[6,6]];\nconst GP = [[0,4],[2,2],[5,5],[6,5]];\nconst HL = [\n  { fr: 1, p: 'g', x: 1, col: colors.c2 },\n  { fr: 2, p: 'f', x: 3, col: colors.c1 }\n];\nconst PW = 510, L = 52, R = 10, T = 52, B = 42, v0 = -0.4, v1 = 6.5;\nconst s = Math.min((PW-L-R)/(v1-v0),(h-T-B)/(v1-v0));\nconst panels = {f:{ox:0, pts:FP, col:colors.c1, name:'y = f(x)'}, g:{ox:550, pts:GP, col:colors.c2, name:'y = g(x)'}};\nfunction val(pts,x){for(let i=0;i<pts.length-1;i++){const [a,b]=pts[i], [c,d]=pts[i+1]; if(x>=a&&x<=c) return b+(d-b)*(x-a)/(c-a);} return NaN;}\nfunction seg(pts,x){for(let i=0;i<pts.length-1;i++){if(x>pts[i][0]&&x<pts[i+1][0]) return i;} return -1;}\nfunction draw(name){\n  const P = panels[name];\n  const X = x => P.ox+L+(x-v0)*s, Y = y => h-B-(y-v0)*s;\n  ctx.strokeStyle=colors.grid; ctx.lineWidth=1; ctx.beginPath();\n  for(let k=0;k<=6;k++){ctx.moveTo(X(k),Y(v0)); ctx.lineTo(X(k),Y(v1)); ctx.moveTo(X(v0),Y(k)); ctx.lineTo(X(v1),Y(k));}\n  ctx.stroke();\n  ctx.strokeStyle=colors.axis; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(v0),Y(0)); ctx.lineTo(X(v1),Y(0)); ctx.moveTo(X(0),Y(v0)); ctx.lineTo(X(0),Y(v1)); ctx.stroke();\n  ctx.fillStyle=colors.text; ctx.font=\"28px 'JetBrains Mono', monospace\"; ctx.textAlign='center'; for(let k=1;k<=6;k++)
