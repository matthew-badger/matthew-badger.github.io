') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x ** 4;\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nclip();\npath((x) => x, f, x0, x1, colors.c1, 6);\nseg(x0, y0 + 0.06, x1, y0 + 0.06, colors.c1, 10);\nctx.restore();\ntag('sign of f″', L + 10, Y(y0 + 0.06) - 16, colors.ink);\ndot(0, 0, colors.ink, 11);\ntag('no inflection point', X(0), Y(0.7), colors.ink, 'center');\n\\end{js}\n\\end{center}\n\\end{columns}\n\n\\slide{Example 6: Concavity From the Graph of $f'$}\n\\begin{columns}[6 6, parallel]\nThe graph of the derivative $f'$ is shown for $0<x<6$. Where is $f$ concave upward or concave downward? Where are its inflection points?\n\\pause\nThe sign of $f''$ is the sign of the slopes on the graph of $f'$.\n\\begin{itemize}\n\\item $f'$ is \\textcolor{c1}{increasing} on $(0,1)$ and $(4,6)$: $f$ is \\textcolor{c1}{concave upward} there.\n\\item $f'$ is \\textcolor{c3}{decreasing} on $(1,4)$: $f$ is \\textcolor{c3}{concave downward} there.\n\\item Inflection points at $x=1$ and $x=4$.\n\\end{itemize}\n\\columnbreak\n\\begin{js}[size=800x560, alt=\"Top: the graph of y = f prime of x for x from 0 to 6; it rises to a high point at x = 1, falls to a low point at x = 4, then rises. At the next step it is colored blue where it increases and purple where it decreases, dashed lines mark x = 1 and x = 4, and a bottom panel shows the graph of f itself, blue where concave upward and purple where concave downward, with its inflection points at x = 1 and x = 4.\"]\nconst L = 70, R = 16, T = 16, B = 56, GAP = 40;    // margins in pixels\nconst x0 = -0.3, x1 = 6.3;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes of both panels\nconst X = (x) => L + (x - x0) * s;\nconst Yt = (y) => T + (1.5 - y) * s;                  // top panel: y from -1 to 1.5\nconst BT = T + 2.5 * s + GAP;\nconst Yb = (y) => BT + (0.9 - y) * s;                 // bottom panel: y from -0.6 to 0.9\nconst df = (x) => x * x * x / 12 - 0.625 * x * x + x - 0.15;\nconst f = (x) => x ** 4 / 48 - 5 * x ** 3 / 24 + x * x / 2 - 0.15 * x + 0.5;\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction curve(g, Yf, t0, t1, color, width) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const x = t0 + (t1 - t0) * i / 200; if (i) ctx.lineTo(X(x), Yf(g(x))); else ctx.moveTo(X(x), Yf(g(x))); }\n  ctx.stroke();\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction panel(Yf, lo, hi) {                          // grid and axes of one panel, y from lo to hi\n  for (let k = Math.ceil(x0 * 2); k / 2 <= x1; k++) line(X(k / 2), Yf(hi), X(k / 2), Yf(lo), colors.grid, 1);\n  for (let k = Math.ceil(lo * 2); k / 2 <= hi + 1e-9; k++) line(L, Yf(k / 2), w - R, Yf(k / 2), colors.grid, 1);\n  line(L, Yf(0), w - R, Yf(0), colors.axis, 2); line(X(0), Yf(hi), X(0), Yf(lo), colors.axis, 2);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'right';\n  for (let v = Math.ceil(lo); v <= hi; v++) if (v) ctx.fillText(String(v).replace('-', '−'), X(0) - 10, Yf(v) + 9);\n  ctx.textAlign = 'left';\n}\npanel(Yt, -1, 1.5);\nctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\nfor (let k = 1; k <= 6; k++) ctx.fillText(String(k), X(k), (local >= 1 ? Yb(-0.6) : Yt(-1)) + 32);\nctx.textAlign = 'left';\nif (local >= 1) {\n  curve(df, Yt, 0, 1, colors.c1, 6); curve(df, Yt, 1, 4, colors.c3, 6); curve(df, Yt, 4, 6, colors.c1, 6);\n  panel(Yb, -0.6, 0.9);\n  curve(f, Yb, 0, 1, colors.c1, 6); curve(f, Yb, 1, 4, colors.c3, 6); curve(f, Yb, 4, 6, colors.c1, 6);\n  [1, 4].forEach((q) => { line(X(q), Yt(1.5), X(q), Yb(-0.6), colors.muted, 2, [6, 6]); disc(X(q), Yb(f(q)), colors.ink, 10); });\n  tag('y = f(x)', w - R - 8, Yb(0.75), colors.ink, 'right');\n} else curve(df, Yt, 0, 6, colors.curve, 5);\ntag('y = f′(x)', w - R - 8, Yt(0.3), colors.ink, 'right');\n\\end{js}\n\\end{columns}\n\n\\slide{Example 7: A Honeybee Population}\n\\begin{columns}[6 6, parallel]\nA model for honeybees raised in an apiary, in thousands after $t$ weeks:\n$$P(t)=\\frac{75}{1+e^{\\,6-t/2}}$$\nThe growth rate $P'(t)$ increases until $t=12$, then decreases toward $0$.\n\\\\[0.4em]\n$P$ is \\textcolor{c1}{concave upward} on $(0,12)$ and \\textcolor{c3}{concave downward} on $(12,\\infty)$. At the inflection point $(12,37.5)$, the population grows fastest: $P'(12)=9.375$ thousand bees per week.\n\\columnbreak\n\\begin{js}[size=800x720, alt=\"Top: the population P(t) = 75 over (1 + e to the 6 minus t over 2), an S-shaped curve rising from near 0 to near 75 thousand over 24 weeks, blue (concave upward) before week 12 and purple (concave downward) after. Bottom: the growth rate P prime of t, a hump with its peak at t = 12. The inflection point (12, 37.5) is marked directly above the peak of the growth rate. A movable point shows the week, the population, and the growth rate.\"]\nconst L = 80, R = 20, T = 20, B = 150, GAP = 50;   // margins in pixels\nconst t0 = -0.5, t1 = 24.5;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (t1 - t0), X = (t) => L + (t - t0) * sx;\nconst TH = 340, BT = T + TH + GAP, BH = h - B - BT;   // top panel height; bottom panel from BT to BT + BH\nconst Yt = (y) => T + TH - (y + 4) / 94 * TH;          // top: P from -4 to 90 thousand\nconst Yb = (y) => BT + BH - (y + 0.5) / 11 * BH;       // bottom: P' from -0.5 to 10.5 thousand per week\nconst P = (t) => 75 / (1 + Math.exp(6 - t / 2)), dP = (t) => 37.5 * Math.exp(6 - t / 2) / Math.pow(1 + Math.exp(6 - t / 2), 2);\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction curve(g, Yf, color, width, a, b) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const t = a + (b - a) * i / 300; if (i) ctx.lineTo(X(t), Yf(g(t))); else ctx.moveTo(X(t), Yf(g(t))); }\n  ctx.stroke();\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction frame(panelTop, panelH, Yf, ticks) {         // grid, axes, and tick numbers of one panel\n  for (let t = 0; t <= 24; t += 4) line(X(t), panelTop, X(t), panelTop + panelH, colors.grid, 1);\n  ticks.forEach((v) => { line(L, Yf(v), w - R, Yf(v), colors.grid, 1); });\n  line(X(0), panelTop, X(0), panelTop + panelH, colors.axis, 2); line(L, Yf(0), w - R, Yf(0), colors.axis, 2);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'right';\n  ticks.forEach((v) => { if (v) ctx.fillText(String(v), L - 12, Yf(v) + 9); });\n  ctx.textAlign = 'left';\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.25;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const t = t0 + state.u * (t1 - t0), tt = Math.max(0, Math.min(24, t));\n  ctx.clearRect(0, 0, w, h);\n  frame(T, TH, Yt, [20, 40, 60, 80]);\n  curve(P, Yt, colors.c1, 5, 0, 12); curve(P, Yt, colors.c3, 5, 12, 24);\n  tag('population (thousands)', L + 14, T + 34, colors.muted);\n  {\n    frame(BT, BH, Yb, [5, 10]);\n    curve(dP, Yb, colors.curve, 5, 0, 24);\n    tag('growth rate (thousands per week)', L + 14, BT + 30, colors.muted);\n    disc(X(tt), Yb(dP(tt)), colors.ink, 11);\n    tag('P′(t) = ' + dec(dP(tt), 2), X(tt) + (tt > 16 ? -16 : 16), Yb(dP(tt)) - 18, colors.ink, tt > 16 ? 'right' : 'left');\n  }\n  {\n    line(X(12), Yt(37.5), X(12), Yb(0), colors.muted, 2, [6, 6]);\n    disc(X(12), Yt(37.5), colors.ink, 12);\n    tag('(12, 37.5)', X(12) + 18, Yt(37.5) + 36, colors.ink);\n  }\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let k = 4; k <= 24; k += 4) ctx.fillText(String(k), X(k), h - B + 32);\n  ctx.textAlign = 'left';\n  disc(X(tt), Yt(P(tt)), colors.ink, 11);\n  tag('week ' + dec(tt, 1) + ': P = ' + dec(P(tt), 1), w - R - 8, Yt(10), tt < 12 ? colors.c1 : colors.c3, 'right');\n  slider('t = ' + dec(tt, 1) + ' weeks');\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 8: Filling a Mug}\n\\begin{columns}[5 7, parallel]\nCoffee is poured into the mug at a constant rate. Let $h(t)$ be the depth of the coffee at time $t$.\n\\begin{itemize}\n\\item Lower half: the mug narrows, $h'$ increases, and $h$ is \\textcolor{c1}{concave upward}.\n\\item Upper half: the mug widens, $h'$ decreases, and $h$ is \\textcolor{c3}{concave downward}.\n\\item Inflection point: the narrowest part of the mug, where the depth rises fastest.\n\\end{itemize}\n\\columnbreak\n\\begin{js}[size=940x720, alt=\"Left: the cross-section of a mug that is wide at the bottom, narrow in the middle, and wide at the top, partly filled with coffee. Right: the graph of the depth h(t) of the coffee against time t, blue (concave upward) while the coffee rises through the lower half and purple (concave downward) through the upper half, with the inflection point at the narrowest part of the mug. A slider for time fills the mug; a dashed line joins the surface of the coffee to the point on the graph, and a readout gives the rate h prime of t.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst H = 4, TMAX = 10;                               // height of the mug; time to fill it\nconst L = 420, R = 20, T = 30, B = 150;               // the graph's margins; the mug sits left of L\nconst sy = (h - T - B) / 4.4;                          // pixels per unit of depth, shared by the mug and the graph\nconst Yd = (y) => h - B - (y + 0.2) * sy;              // depth from -0.2 to 4.2\nconst Xg = (t) => L + t / TMAX * (w - L - R);\nconst r = (y) => 1.6 - 0.6 * Math.sin(Math.PI * y / H);   // the mug's radius at height y\nconst MX = 200, MS = 100;                              // the mug's centre line and pixels per unit of radius\nconst N = 400, V = [0];                                // V[i]: volume below height H * i / N\nfor (let i = 1; i <= N; i++) { const ym = H * (i - 0.5) / N; V.push(V[i - 1] + Math.PI * r(ym) * r(ym) * H / N); }\nconst VT = V[N];\nfunction depth(t) {                                   // the depth after time t: invert the volume\n  const v = VT * Math.max(0, Math.min(TMAX, t)) / TMAX;\n  let lo = 0, hi = N;\n  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (V[m] < v) lo = m; else hi = m; }\n  return H * (lo + (v - V[lo]) / (V[hi] - V[lo])) / N;\n}\nconst rate = (t) => VT / TMAX / (Math.PI * r(depth(t)) * r(depth(t)));\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, rr) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, rr, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(t0, t1, color) {\n  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const t = t0 + (t1 - t0) * i / 200; if (i) ctx.lineTo(Xg(t), Yd(depth(t))); else ctx.moveTo(Xg(t), Yd(depth(t))); }\n  ctx.stroke();\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.3;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const rc = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - rc.left) * w / rc.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const t = state.u * TMAX, d = depth(t);\n  ctx.clearRect(0, 0, w, h);\n  const pts = [];                                      // the coffee: from the bottom up the left wall, back down the right\n  for (let i = 0; i <= 60; i++) { const y = d * i / 60; pts.push([MX - MS * r(y), Yd(y)]); }\n  for (let i = 60; i >= 0; i--) { const y = d * i / 60; pts.push([MX + MS * r(y), Yd(y)]); }\n  ctx.globalAlpha = 0.6; ctx.fillStyle = colors.burnt; ctx.beginPath();\n  pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 5; ctx.lineJoin = 'round';\n  [-1, 1].forEach((sgn) => {\n    ctx.beginPath();\n    for (let i = 0; i <= 80; i++) { const y = H * i / 80; const px = MX + sgn * MS * r(y); if (i) ctx.lineTo(px, Yd(y)); else ctx.moveTo(px, Yd(y)); }\n    ctx.stroke();\n  });\n  line(MX - MS * r(0), Yd(0), MX + MS * r(0), Yd(0), colors.ink, 5);\n  line(MX - MS * r(2) - 20, Yd(2), MX - MS * r(2) + 6, Yd(2), colors.muted, 2, [6, 6]);\n  for (let k = 1; k <= TMAX; k++) line(Xg(k), Yd(-0.2), Xg(k), Yd(4.2), colors.grid, 1);\n  for (let k = 1; k <= 8; k++) line(L, Yd(k / 2), w - R, Yd(k / 2), colors.grid, 1);\n  line(L, Yd(0), w - R, Yd(0), colors.axis, 2); line(L, Yd(-0.2), L, Yd(4.2), colors.axis, 2);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let k = 2; k <= TMAX; k += 2) ctx.fillText(String(k), Xg(k), Yd(0) + 34);\n  ctx.textAlign = 'left';\n  graph(0, 5, colors.c1); graph(5, TMAX, colors.c3);\n  disc(Xg(5), Yd(2), colors.ink, 11); tag('inflection point', Xg(5) - 18, Yd(2) - 16, colors.ink, 'right');\n  tag('concave upward', Xg(9.6), Yd(0.9), colors.c1, 'right');\n  tag('concave downward', Xg(4.4), Yd(3.5), colors.c3, 'right');\n  line(MX + MS * r(d), Yd(d), Xg(t), Yd(d), colors.muted, 2, [6, 6]);\n  disc(Xg(t), Yd(d), colors.accent, 12);\n  tag('depth h', L + 12, T + 6, colors.muted);\n  tag('h′(t) = ' + dec(rate(t), 2), w - R - 8, T + 6, colors.ink, 'right');\n  slider('t = ' + dec(t, 1));\n});\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 2}\n\\begin{youtry}[time=none]{Concavity}\nFind the intervals on which $f(x)=x^3-3x^2-9x+4$ is concave upward or concave downward, and find its inflection point.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 2: Solution}\n\\begin{columns}[7 5, parallel]\n\\textbf{Problem.} Find the intervals of concavity and the inflection point of $f(x)=x^3-3x^2-9x+4$.\n\\pause\n\\begin{align}\nf'(x) &= 3x^2-6x-9 \\\\\nf''(x) &= 6x-6=6(x-1)\n\\end{align}\n\\pause\n$\\textcolor{c3}{f''(x)<0}$ for $x<1$: \\textcolor{c3}{concave downward} on $(-\\infty,1)$.\n\\\\ $\\textcolor{c1}{f''(x)>0}$ for $x>1$: \\textcolor{c1}{concave upward} on $(1,\\infty)$.\n\\pause\nInflection point: $(1,-7)$, since $f(1)=1-3-9+4=-7$.\n\\columnbreak\n\\begin{js}[size=640x660, alt=\"The graph of f(x) = x cubed minus 3x squared minus 9x plus 4, with a compressed vertical scale, purple where concave downward (x less than 1) and blue where concave upward (x greater than 1). The inflection point (1, -7) is marked at the last step.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -2.6, x1 = 4.6, y0 = -26, y1 = 12;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x ** 3 - 3 * x * x - 9 * x + 4;\naxes(0.5, 2, 1, 5);\nclip(); path((x) => x, f, x0, 1, colors.c3, 6); path((x) => x, f, 1, x1, colors.c1, 6); ctx.restore();\nif (local >= 2) { dot(1, -7, colors.ink, 12); tag('(1, −7)', X(1) + 18, Y(-7) - 16, colors.ink); }\n\\end{js}\n\\end{columns}\n\n\\section{The Second Derivative Test}\n\n\\slide[scale=0.9]{The Second Derivative Test}\n\\begin{columns}[6 6, parallel]\n\\begin{theorem}{The Second Derivative Test}\nSuppose $f''$ is continuous near $c$.\n\\begin{enumerate}[tight]\n\\item[(a)] If $f'(c)=0$ and $\\textcolor{c1}{f''(c)>0}$, then $f$ has a \\textbf{local minimum} at $c$.\n\\item[(b)] If $f'(c)=0$ and $\\textcolor{c3}{f''(c)<0}$, then $f$ has a \\textbf{local maximum} at $c$.\n\\end{enumerate}\n\\end{theorem}\n\nWhy (a): $f$ is \\textcolor{c1}{concave upward} near $c$. Its graph lies above the horizontal tangent line at $c$.\n\nIf $f''(c)=0$, or $f''(c)$ does not exist, this test gives \\textbf{no information}. Use the First Derivative Test.\n\\columnbreak\n\\begin{js}[size=640x720, frames=1, alt=\"Top: a graph that is concave upward near c, lying above its horizontal tangent line there: a local minimum. Bottom: a graph that is concave downward near c, lying below its horizontal tangent line: a local maximum.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst S = 120;                                        // pixels per unit in both panels\nfunction panel(top0, oy, f, color, top, bottom) {     // the graph over [0, 4] with a horizontal tangent at c = 2\n  const X = (x) => 40 + x * S, Y = (y) => oy - y * S;\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(-0.2), oy); ctx.lineTo(X(4.3), oy); ctx.stroke();\n  ctx.strokeStyle = colors.muted; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(X(2), oy); ctx.lineTo(X(2), Y(f(2))); ctx.stroke(); ctx.setLineDash([]);\n  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const x = 0.3 + 3.4 * i / 200; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(0.8), Y(f(2))); ctx.lineTo(X(3.2), Y(f(2))); ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(2), Y(f(2)), 10, 0, 2 * Math.PI); ctx.fill();\n  ctx.font = font(28); ctx.textAlign = 'center';\n  ctx.fillText('c', X(2), oy + 36);\n  ctx.fillStyle = color; ctx.fillText(top, X(2), top0 + 34); ctx.fillStyle = colors.ink; ctx.fillText(bottom, X(2), top0 + 72);\n  ctx.textAlign = 'left';\n}\npanel(0, 310, (x) => 0.6 + 0.3 * (x - 2) * (x - 2), colors.c1, 'f′(c) = 0, f″(c) > 0', 'local minimum');\npanel(370, 670, (x) => 1.5 - 0.3 * (x - 2) * (x - 2), colors.c3, 'f′(c) = 0, f″(c) < 0', 'local maximum');\n\\end{js}\n\\end{columns}\n\n\\slide[scale=0.9]{Example 3, Continued: Local Extreme Values}\n\\begin{columns}[7 5, parallel]\nFind the local extreme values of $f(x)=x^4-4x^3$.\n$$f'(x)=4x^2(x-3),\\qquad f''(x)=12x(x-2)$$\nCritical numbers: $0$ and $3$.\n\\pause\n$\\textcolor{c1}{f''(3)=36>0}$. Local minimum: $f(3)=81-108=-27$.\n\\pause\n$f''(0)=0$. The Second Derivative Test gives no information at $0$.\n\\\\[0.3em]\nFirst Derivative Test: $f'(x)=4x^2(x-3)<0$ for $x<0$ and for $0<x<3$. The sign of $f'$ does not change at $0$: no local maximum or minimum there.\n\\columnbreak\n\\begin{js}[size=640x720, alt=\"The graph of f(x) = x to the fourth minus 4x cubed, with a compressed vertical scale. At the next step the local minimum (3, -27) is marked. At the last step the horizontal tangent line at (0, 0) is drawn: the graph decreases on both sides of 0, so there is no extreme value there.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -1.6, x1 = 4.4, y0 = -32, y1 = 22;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePat ginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction $D(t)$: the federal debt. The deficit is, approximately, the rate $D'(t)$ at which the debt grows.\n\\\\ $G(t)$: real GDP, the inflation-adjusted value of everything the economy produces.\n\\begin{table}\nHeadline & In calculus\nThe debt is rising. & $D'(t)>0$\nThe deficit is shrinking. & $D'(t)>0$ and $D''(t)<0$\nThe economy is contracting. & $G'(t)<0$\nThe economy hit bottom. & $G'$ changes from $-$ to $+$: a local minimum of $G$\nThe economy is shrinking more slowly. & $G'(t)<0$ and $G''(t)>0$\n\\end{table}\n\n\\slide{Real GDP, 2007–2010}\n\\begin{columns}[5 7, parallel]\nReal GDP each quarter, in billions of 2017 dollars per year. The slope of each segment estimates $G'(t)$.\n\nThe change switches from $+$ to $-$ at a local maximum, and from $-$ to $+$ at a local minimum.\n\nThe recession is dated from December 2007 to June 2009 (National Bureau of Economic Research).\n\\columnbreak\n\\begin{js}[size=940x740, caption=\"Data: U.S. Bureau of Economic Analysis, via FRED (series GDPC1)\", alt=\"US real GDP for each quarter from 2007 to 2010, between about 16.3 and 17.0 trillion 2017 dollars per year. A movable point gives the value for a quarter and its change from the previous quarter. Segments where GDP rose are green and segments where it fell are orange, and the local maxima (2007 Q4 and 2008 Q2) and local minima (2008 Q1 and 2009 Q2) are labeled.\"]\nconst L = 100, R = 20, T = 20, B = 150;              // margins in pixels\nconst G = [16611.690, 16713.314, 16809.587, 16915.191, 16843.003, 16943.291, 16854.295, 16485.350, 16298.262, 16269.145, 16326.281, 16502.754, 16582.710, 16743.162, 16872.266, 16960.864];   // real GDP, billions of 2017 dollars, 2007 Q1 to 2010 Q4\nconst G0 = 16561.866;                                // 2006 Q4\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst Q = (i) => (2007 + Math.floor(i / 4)) + ' Q' + (i % 4 + 1);\nconst X = (i) => L + 20 + i * (w - L - R - 40) / 15;\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction years(yLabel) {                              // year labels under the first quarter of each year\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  [0, 4, 8, 12].forEach((i) => ctx.fillText(String(2007 + i / 4), X(i), yLabel));\n  ctx.textAlign = 'left';\n}\n\nconst Y = (v) => T + (17050 - v) / 900 * (h - T - B);  // GDP from 16150 to 17050 billion\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.5;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const i = Math.round(state.u * 15), d = G[i] - (i ? G[i - 1] : G0);\n  ctx.clearRect(0, 0, w, h);\n  for (let v = 16200; v <= 17000; v += 100) line(L, Y(v), w - R, Y(v), colors.grid, 1);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'right';\n  for (let v = 16200; v <= 17000; v += 200) ctx.fillText(String(v), L - 10, Y(v) + 9);\n  ctx.textAlign = 'left';\n  years(h - B + 34);\n  for (let k = 1; k < 16; k++) {\n    const c = true ? (G[k] > G[k - 1] ? colors.c4 : colors.c2) : colors.curve;\n    line(X(k - 1), Y(G[k - 1]), X(k), Y(G[k]), c, 5);\n  }\n  G.forEach((v, k) => disc(X(k), Y(v), colors.ink, 7));\n  if (true) {\n    [3, 5].forEach((k) => tag('max', X(k), Y(G[k]) - 20, colors.ink, 'center'));\n    [4, 9].forEach((k) => tag('min', X(k), Y(G[k]) + 46, colors.ink, 'center'));\n  }\n  disc(X(i), Y(G[i]), colors.accent, 13);\n  tag(Q(i) + ': ' + dec(G[i], 1), L + 14, Y(16330), colors.ink);\n  tag('change: ' + (d > 0 ? '+' : '') + dec(d, 1), L + 14, Y(16240), d > 0 ? colors.c4 : colors.c2);\n  slider(Q(i));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{The Steepest Part of the Downturn}\n\\begin{columns}[5 7, parallel]\nEach bar is the change in real GDP from the previous quarter, an estimate of $G'(t)$.\n\nThe largest drop came in 2008 Q4. Near there the graph of $G$ is steepest, close to an inflection point.\n\nIn 2009 Q1 and Q2, GDP still fell, but by less each quarter: $G'<0$ and $G''>0$.\n\\columnbreak\n\\begin{js}[size=940x740, caption=\"Data: U.S. Bureau of Economic Analysis, via FRED (series GDPC1)\", alt=\"Top: US real GDP for each quarter from 2007 to 2010. Bottom: a bar for each quarter showing the change in real GDP from the previous quarter, green for increases and orange for decreases. A movable point picks a quarter. The largest drop, -368.9 billion in 2008 Q4, and the smaller drops in 2009 Q1 and Q2 are highlighted.\"]\nconst L = 100, R = 20, T = 20, B = 150, GAP = 46;    // margins in pixels\nconst G = [16611.690, 16713.314, 16809.587, 16915.191, 16843.003, 16943.291, 16854.295, 16485.350, 16298.262, 16269.145, 16326.281, 16502.754, 16582.710, 16743.162, 16872.266, 16960.864];   // real GDP, billions of 2017 dollars, 2007 Q1 to 2010 Q4\ncons  roughly the deficit.\n\nThe debt rose in every one of these years: $D'>0$.\n\nIt grew by $4.54\\ldots$ trillion in 2020, $1.86\\ldots$ in 2021, and $1.80\\ldots$ in 2022. The deficit was shrinking: $D'>0$, $D''<0$.\n\\columnbreak\n\\begin{js}[size=940x740, caption=\"Data: U.S. Department of the Treasury, Fiscal Service, via FRED (series GFDEBTN)\", alt=\"Top: the US federal debt at the end of each year from 2000 to 2025, rising from 5.66 to 38.51 trillion dollars. Bottom: a bar for each year showing the increase in the debt over that year. A movable point picks a year. The years 2020 to 2022 are highlighted: the yearly increase fell from 4.54 to 1.86 to 1.80 trillion, and the debt curve bends downward there.\"]\nconst L = 90, R = 20, T = 20, B = 150, GAP = 46;     // margins in pixels\nconst D = [5.662216, 5.943439, 6.405707, 6.997964, 7.596143, 8.170413, 8.680224, 9.229172, 10.699805, 12.311349, 14.025215, 15.222940, 16.432730, 17.156119, 18.141444, 18.922179, 19.976827, 20.492747, 21.974096, 23.201380, 27.747798, 29.617215, 31.419689, 34.001494, 36.218605, 38.514009];   // trillions of dollars, end of 2000 to end of 2025\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst X = (k) => L + 20 + k * (w - L - R - 40) / 25;  // k = 0 for 2000, ..., 25 for 2025\nconst TH = 300, BT = T + TH + GAP, BH = h - B - BT;    // top panel height; bottom panel from BT to BT + BH\nconst Yt = (v) => T + (40 - v) / 40 * TH;              // debt from 0 to 40 trillion\nconst Yb = (v) => BT + (5 - v) / 5 * BH;               // yearly increase from 0 to 5 trillion\nconst I = D.map((v, k) => (k ? v - D[k - 1] : 0));\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.8;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const k = Math.max(1, Math.round(state.u * 25));\n  ctx.clearRect(0, 0, w, h);\n  [10, 20, 30, 40].forEach((v) => line(L, Yt(v), w - R, Yt(v), colors.grid, 1));\n  [1, 2, 3, 4, 5].forEach((v) => line(L, Yb(v), w - R, Yb(v), colors.grid, 1));\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'right';\n  [10, 20, 30, 40].forEach((v) => ctx.fillText(String(v), L - 10, Yt(v) + 9));\n  [1, 2, 3, 4, 5].forEach((v) => ctx.fillText(String(v), L - 10, Yb(v) + 9));\n  ctx.textAlign = 'center';\n  [0, 5, 10, 15, 20, 25].forEach((j) => ctx.fillText(String(2000 + j), X(j), h - B + 34));\n  ctx.textAlign = 'left';\n  line(L, Yt(0), w - R, Yt(0), colors.axis, 2); line(L, Yb(0), w - R, Yb(0), colors.axis, 2);\n  for (let j = 1; j <= 25; j++) {\n    const hot = j >= 20 && j <= 22;\n    line(X(j - 1), Yt(D[j - 1]), X(j), Yt(D[j]), hot ? colors.c3 : colors.curve, hot ? 7 : 4);\n    ctx.globalAlpha = hot || j === k ? 1 : 0.45; ctx.fillStyle = hot ? colors.c3 : colors.c4;\n    ctx.fillRect(X(j) - 13, Yb(I[j]), 26, Yb(0) - Yb(I[j])); ctx.globalAlpha = 1;\n  }\n  D.forEach((v, j) => disc(X(j), Yt(v), colors.ink, 5));\n  tag('deficit shrinking', X(19.4), Yb(3.6), colors.c3, 'right');\n  disc(X(k), Yt(D[k]), colors.accent, 11);\n  line(X(k), Yt(D[k]), X(k), Yb(0), colors.accent, 2, [6, 6]);\n  tag('debt (trillions)', L + 14, T + 34, colors.muted);\n  tag('end of ' + (2000 + k) + ': ' + dec(D[k], 2) + ' trillion', L + 14, T + 76, colors.ink);\n  tag('increase over ' + (2000 + k) + ': ' + dec(I[k], 2), L + 14, BT + 30, colors.c4);\n  slider(String(2000 + k));\n});\n\\end{js}\n\\end{columns}\n\n\\slide[scale=0.92]{Percent Growth Is a Different Rate}\n\\begin{columns}[6 6, parallel]\nGrowth is usually reported as a percent: the rate $G'(t)/G(t)$, not $G'(t)$.\n\nSteady growth at $2\\%$ per year:\n$$G(t)=100e^{0.02t}$$\n$$\\frac{G'(t)}{G(t)}=0.02\\quad\\text{for all }t.$$\nHere $G''(t)=0.04e^{0.02t}>0$. The graph is concave upward.\n\n“Growth slowed from $3\\%$ to $2\\%$” says that $G'/G$ decreased. It does not say that $G''<0$.\n\\columnbreak\n\\begin{js}[size=780x640, alt=\"The graph of G(t) = 100 e to the 0.02 t for t from 0 to 40 years, concave upward, with a movable point and its tangent line. A readout shows that the slope G prime of t increases along the graph while the percent rate G prime over G stays at 2 percent.\"]\nconst L = 90, R = 20, T = 20, B = 150;                 // margins in pixels\nconst x0 = -1, x1 = 41, y0 = 90, y1 = 235;      // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.3;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst G = (t) => 100 * Math.exp(0.02 * t), dG = (t) => 2 * Math.exp(0.02 * t);\nonFrame(() => {\n  const t = Math.max(0, Math.min(40, x0 + state.u * (x1 - x0))), m = dG(t);\n  ctx.clearRect(0, 0, w, h);\n  grid(5, 10);\n  ctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let k = 10; k <= 40; k += 10) ctx.fillText(String(k), X(k), h - B + 34);\n  ctx.textAlign = 'right';\n  for (let v = 100; v <= 220; v += 40) ctx.fillText(String(v), L - 10, Y(v) + 9);\n  ctx.textAlign = 'left';\n  seg(0, y0, 0, y1, colors.axis, 2);\n  clip();\n  path((x) => x, G, 0, 40, colors.c1, 5);\n  seg(t - 8, G(t) - 8 * m, t + 8, G(t) + 8 * m, colors.c2, 3);\n  ctx.restore();\n  dot(t, G(t), colors.c1, 12);\n  tag('slope G′(t) = ' + dec(m, 2), w - R - 14, Y(118), colors.c2, 'right');\n  tag('G′(t)/G(t) = 0.02', w - R - 14, Y(102), colors.ink, 'right');\n  slider('t = ' + dec(t, 1) + ' years');\n});\n\\end{js}\n\\end{columns}\n\n\\section*{Wrap-Up}\n\n\\slide{Summary}\n\\begin{itemize}\n\\item \\textbf{I/D Test:} $\\textcolor{c4}{f'>0}$ on an interval: $f$ is \\textcolor{c4}{increasing}. $\\textcolor{c2}{f'<0}$: $f$ is \\textcolor{c2}{decreasing}.\n\\item \\textbf{First Derivative Test:} at a critical number $c$, $f'$ changes from $\\textcolor{c4}{+}$ to $\\textcolor{c2}{-}$: local maximum. From $\\textcolor{c2}{-}$ to $\\textcolor{c4}{+}$: local minimum. No sign change: neither.\n\\item \\textbf{Concavity Test:} $\\textcolor{c1}{f''>0}$ on an interval: \\textcolor{c1}{concave upward}. $\\textcolor{c3}{f''<0}$: \\textcolor{c3}{concave downward}.\n\\item \\textbf{Inflection point:} a point where $f$ is continuous and the concavity changes, that is, where $f''$ changes sign.\n\\item \\textbf{Second Derivative Test:} $f'(c)=0$ and $\\textcolor{c1}{f''(c)>0}$: local minimum. $f'(c)=0$ and $\\textcolor{c3}{f''(c)<0}$: local maximum. $f''(c)=0$: no information.\n\\end{itemize}\n\n\\slide{Coming Up}\nProblem Set 15 (the shape of a graph) is posted on HuskyCT.\n\\begin{table}\nWeek & Lectures & Topics\nWeek 9 (this week) & 10/26, 10/28 & Shape of a graph; l'Hospital's Rule\nWeek 10 (next week) & 11/2, 11/4 & Optimization problems; Newton's Method\nWeek 11 & 11/9, 11/11 & Antiderivatives; review\nWeek 12 & Mon 11/16 & \\textbf{Midterm II}\n\\end{table}\n";window.LECTURE_SCALE=1.2;window.LECTURE_THEMES={};</script><script>(function LECTURE_ENGINE() {
