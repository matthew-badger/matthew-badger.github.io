ime (green, orange, green) and the sign of f double prime (purple, then blue).\"]\nconst L = 16, R = 16, T = 16, B = 120;                 // margins in pixels\nconst x0 = -2.3, x1 = 2.3, yc = 0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from  - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x * x * x / 3 - x;\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nclip();\npath((x) => x, f, x0, -1, colors.c4, 6); path((x) => x, f, -1, 1, colors.c2, 6); path((x) => x, f, 1, x1, colors.c4, 6);\nctx.restore();\ndot(-1, 2 / 3, colors.ink, 11); tag('local max', X(-1), Y(2 / 3) - 22, colors.ink, 'center');\ndot(1, -2 / 3, colors.ink, 11); tag('local min', X(1), Y(-2 / 3) + 46, colors.ink, 'center');\ndot(0, 0, colors.ink, 11); tag('inflection', X(0) + 18, Y(0) - 18, colors.ink);\nconst R1 = h - B + 34, R2 = h - B + 104;               // the two sign strips below the plot\nfunction strip(py, pieces) { pieces.forEach((q) => { ctx.fillStyle = q[2]; ctx.fillRect(X(q[0]), py, X(q[1]) - X(q[0]), 24); }); }\nstrip(R1, [[x0, -1, colors.c4], [-1, 1, colors.c2], [1, x1, colors.c4]]);\nstrip(R2, [[x0, 0, colors.c3], [0, x1, colors.c1]]);\ntag('sign of f′', w - R - 8, R1 - 12, colors.ink, 'right'); tag('sign of f″', w - R - 8, R2 - 12, colors.ink, 'right');\n\\end{js}\n\\end{columns}\n\n\\section{Increasing and Decreasing}\n\n\\slide{Increasing and Decreasing}\n\\begin{columns}[5 7, parallel]\nA function $f$ is \\textbf{increasing} on an interval $I$ if $$f(x_1)<f(x_2)$$ whenever $x_1<x_2$ in $I$.\n\\\\[0.4em]\nIt is \\textbf{decreasing} on $I$ if $$f(x_1)>f(x_2)$$ whenever $x_1<x_2$ in $I$.\n\nWhere the tangent lines have positive slope, the graph \\textcolor{c4}{rises}. Where the slope is negative,\\\\ the graph \\textcolor{c2}{falls}.\n\\columnbreak\n\\begin{js}[size=900x720, alt=\"The graph of a function that rises, falls, and rises again, with a point and its tangent line. Dragging across the figure, or the arrow keys, mo n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.25;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst f = (x) => (x * x * x - 6 * x * x + 9 * x) / 4 + 1, df = (x) => 0.75 * (x - 1) * (x - 3);\nonFrame(() => {\n  const x = x0 + state.u * (x1 - x0), m = df(x);\n  const col = m > 1e-9 ? colors.c4 : m < -1e-9 ? colors.c2 : colors.ink;\n  ctx.clearRect(0, 0, w, h);\n  axes(0.5, 1);\n  clip();\n  if (local >= 1) {\n    path((t) => t, f, x0, 1, colors.c4, 6); path((t) => t, f, 1, 3, colors.c2, 6); path((t) => t, f, 3, x1, colors.c4, 6);\n  } else path((t) => t, f, x0, x1, colors.curve, 5);\n  seg(x - 0.7, f(x) - 0.7 * m, x + 0.7, f(x) + 0.7 * m, col, 4);\n  ctx.restore();\n  dot(x, f(x), col, 12);\n  tag('slope of tangent = ' + dec(m, 2), w - R - 14, h - B - 16, col, 'right');\n  if (local >= 1) {\n    tag('increasing', X(0.35), Y(2.45), colors.c4, 'center');\n    tag('decreasing', X(2), Y(2.45), colors.c2, 'center');\n    tag('increasing', X(3.55), Y(2.45), colors.c4, 'center');\n  }\n  slider('x = ' + dec(x, 2));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{The Increasing/Decreasing Test}\n\\begin{columns}[7 5, parallel]\n\\begin{theorem}{Increasing/Decreasing Test}\n\\begin{enumerate}[tight]\n\\item[(a)] If $\\textcolor{c4}{f'(x)>0}$ on an interval, then $f$ is \\textcolor{c4}{increasing} on that interval.\n\\item[(b)] If $\\textcolor{c2}{f'(x)<0}$ on an interval, then $f$ is \\textcolor{c2}{decreasing} on that interval.\n\\end{enumerate}\n\\end{theorem}\nWe call this the \\textbf{I/D Test}.\n\\\\[0.4em]\nA question about $f$ (where does its graph rise?) becomes a question about the sign of $f'$.\n\\columnbreak\n\\begin{js}[size=640x500, alt=\"A graph through points A, B, C, D. From A to B and from C to D it rises, its tangent lines have positive slope, and it is green, labeled f prime greater than 0. From B to C it falls, its tangent lines have negative slope, and it is orange, labeled f prime less than 0.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.4, x1 = 4.6, yc = 1.45;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => (x * x * x - 6 * x * x + 9 * x) / 4 + 1, df = (x) => 0.75 * (x - 1) * (x - 3);\naxes(0.5, 1);\npath((x) => x, f, 0, 1, colors.c4, 6); path((x) => x, f, 1, 3, colors.c2, 6); path((x) => x, f, 3, 4.2, colors.c4, 6);\n[0.45, 2, 3.65].forEach((p) => seg(p - 0.45, f(p) - 0.45 * df(p), p + 0.45, f(p) + 0.45 * df(p), df(p) > 0 ? colors.c4 : colors.c2, 3));\n[[0, 'A', -1], [1, 'B', 0], [3, 'C', 0], [4.2, 'D', 1]].forEach((q) => {\n  dot(q[0], f(q[0]), colors.ink, 10);\n  tag(q[1], X(q[0]) + 22 * q[2], Y(f(q[0])) + (q[1] === 'C' ? 44 : -18), colors.ink, 'center');\n});\ntag('f′ > 0', X(0.3), Y(2.55), colors.c4, 'center');\ntag('f′ < 0', X(2.1), Y(2.15), colors.c2, 'center');\ntag('f′ > 0', X(3.15), Y(2.55), colors.c4, 'center');\n\\end{js}\n\\end{columns}\n\n\\slide{Proof of the I/D Test}\n\\begin{columns}[7 5, parallel]\n\\textbf{(a)} Suppose $f'(x)>0$ on an interval $I$. Let $x_1<x_2$ be two numbers in $I$.\n\nSince $f$ is differentiable on $I$, the Mean Value Theorem applies on $[x_1,x_2]$. For some $c$ between $x_1$ and $x_2$,\n$$\\textcolor{c4}{f(x_2)-f(x_1)}=\\textcolor{c2}{f'(c)}(x_2-x_1).$$\n\nBoth $\\textcolor{c2}{f'(c)>0}$ and $x_2-x_1>0$. The right side is positive, and $\\textcolor{c4}{f(x_1)<f(x_2)}$. This shows that $f$ is increasing on $I$.\n\\\\[0.4em]\nPart (b) is proved the same way, with $f'(c)<0$.\n\\columnbreak\n\\begin{js}[size=640x480, alt=\"An increasing function with two numbers x1 less than x2 marked. At the next step, the secant line from x1 to x2 and a parallel tangent line at a number c between them are drawn. At the last step, the rise f(x2) minus f(x1) is marked; it is positive.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.3, x1 = 4.3, yc = 1.15;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 0.45 * x + 0.2 * Math.sin(1.6 * x) + 0.5, df = (x) => 0.45 + 0.32 * Math.cos(1.6 * x);\nconst a = 0.8, b = 3.6, m = (f(b) - f(a)) / (b - a);\nlet c = (a + b) / 2;                                  // a number c in (a, b) with f'(c) = m\nfor (let i = 1000; i < 2000; i++) { const x = a + (b - a) * i / 2000; if (Math.abs(df(x) - m) < Math.abs(df(c) - m)) c = x; }\naxes(0.5, 1);\nseg(a, 0, a, f(a), colors.muted, 2, [6, 6]); seg(b, 0, b, f(b), colors.muted, 2, [6, 6]);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); ctx.restore();\ndot(a, f(a), colors.ink, 10); dot(b, f(b), colors.ink, 10);\ntag('x₁', X(a), Y(0) + 40, colors.ink, 'center'); tag('x₂', X(b), Y(0) + 40, colors.ink, 'center');\nif (local >= 1) {\n  seg(a, f(a), b, f(b), colors.c1, 4);\n  seg(c - 0.9, f(c) - 0.9 * m, c + 0.9, f(c) + 0.9 * m, colors.c2, 4, [12, 8]);\n  dot(c, f(c), colors.c2, 11); tag('c', X(c), Y(0) + 40, colors.c2, 'center');\n}\nif (local >= 2) {\n  seg(a, f(a), b, f(a), colors.muted, 2, [6, 6]);\n  seg(b, f(a), b, f(b), colors.c4, 6);\n  tag('f(x₂) − f(x₁) > 0', X(b) - 14, Y(f(a)) + 42, colors.c4, 'right');\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Example 1: Where Is $f$ Increasing?}\n\\begin{columns}[7 5, parallel]\nFind where $f(x)=3x^4-4x^3-12x^2+5$ is increasing and where it is decreasing.\n\\pause\n\\begin{align}\nf'(x) &= 12x^3-12x^2-24x \\\\\n\\pause\n\\phantom{f'(x)} &= 12x(x^2-x-2) \\\\\n\\pause\n\\phantom{f'(x)} &= 12x(x-2)(x+1)\n\\end{align}\n$f'(x)=0$ at $x=-1$, $0$, and $2$. These critical numbers divide the line into four intervals. On each interval, $f'(x)$ has one sign.\n\\columnbreak\n\\begin{js}<1->[size=640x600, alt=\"The graph of y = f prime of x = 12x cubed minus 12x squared minus 24x, with a compressed vertical scale. At the last step its zeros at x = -1, 0, and 2 are marked.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -1.7, x1 = 2.7, y0 = -45, y1 = 70;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = 4}{+} & \\phantom{\\textcolor{c4}{\\text{increasing on }(2,\\infty)}}\n\\end{array}$$\n\\end{only}\n\\begin{only}<20->\n$$\\def\\arraystretch{1.3}\\begin{array}{c|ccc|c|l}\n\\text{Interval} & 12x & x-2 & x+1 & f'(x) & f \\\\ \\hline\nx<-1 & - & - & - & \\textcolor{c2}{-} & \\textcolor{c2}{\\text{decreasing on }(-\\infty,-1)} \\\\\n-1<x<0 & - & - & + & \\textcolor{c4}{+} & \\textcolor{c4}{\\text{increasing on }(-1,0)} \\\\\n0<x<2 & + & - & + & \\textcolor{c2}{-} & \\textcolor{c2}{\\text{decreasing on }(0,2)} \\\\\nx>2 & + & + & + & \\textcolor{c4}{+} & \\textcolor{c4}{\\text{increasing on }(2,\\infty)}\n\\end{array}$$\n\\end{only}\n\\begin{js}<21->[size=1640x300, alt=\"The graph of f(x) = 3x to the fourth minus 4x cubed minus 12x squared plus 5, with a compressed vertical scale, colored orange where f decreases and green where it increases.\"]\nconst L = 80, R = 30, T = 16, B = 40;                 // margins in pixels\nconst x0 = -1.9, x1 = 2.9, y0 = -32, y1 = 24;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 3 * x ** 4 - 4 * x ** 3 - 12 * x * x + 5;\naxes(0.5, 10, 1, 20);\nclip();\npath((x) => x, f, x0, -1, colors.c2, 6); path((x) => x, f, -1, 0, colors.c4, 6);\npath((x) => x, f, 0, 2, colors.c2, 6); path((x) => x, f, 2, x1, colors.c4, 6);\nctx.restore();\ntag('y = f(x)', X(2.45), Y(14), colors.curve, 'center');\n\\end{js}\n\n\\section{The First Derivative Test}\n\n\\slide{The First Derivative Test}\n\\begin{theorem}{The First Derivative Test}\nSuppose that $c$ is a critical number of a continuous function $f$.\n\\begin{enumerate}[tight]\n\\item[(a)] If $f'$ changes from \\textcolor{c4}{positive} to \\textcolor{c2}{negative} at $c$, then $f$ has a \\textbf{local maximum} at $c$.\n\\item[(b)] If $f'$ changes from \\textcolor{c2}{negative} to \\textcolor{c4}{positive} at $c$, then $f$ has a \\textbf{local minimum} at $c$.\n\\item[(c)] If $f'$ has the same sign on both sides of $c$, then $f$ has \\textbf{no local maximum or minimum} at $c$.\n\\end{enumerate}\n\\end{theorem}\nWhy (a): $f$ is \\textcolor{c4}{increasing} to the left of $c$ and \\textcolor{c2}{decreasing} to the right, by the I/D Test.\n\\begin{js}[size=1640x330, frames=1, alt=\"Four graphs, each with a horizontal tangent at a number c. First: f prime positive to the left of c and negative to the right, a local maximum. Second: negative then positive, a local minimum. Third: positive on both sides, neither. Fourth: negative on both sides, neither.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst S = 72;                                         // pixels per unit in every panel\nfunction hermite(P) {                                 // the cubic Hermite curve through [x, y, slope] points\n  return (x) => {\n    let i = 0;\n    while (i < P.length - 2 && x > P[i + 1][0]) i++;\n    const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n  };\n}\nfunction panel(ox, f, left, right, title) {           // the graph over [0, 4] with c = 2; left, right: signs of f'\n  const oy = 236, X = (x) => ox + (x + 0.3) * S, Y = (y) => oy - y * S;\n  const color = (sgn) => (sgn > 0 ? colors.c4 : colors.c2);\n  const curve = (t0, t1, c) => {\n    ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.beginPath();\n    for (let i = 0; i <= 200; i++) { const x = t0 + (t1 - t0) * i / 200; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n    ctx.stroke();\n  };\n  const text = (t, x, y, c) => { ctx.font = font(28); ctx.textAlign = 'center'; ctx.fillStyle = c; ctx.fillText(t, x, y); };\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(-0.3), oy); ctx.lineTo(X(4.3), oy); ctx.stroke();\n  ctx.strokeStyle = colors.muted; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(X(2), oy); ctx.lineTo(X(2), Y(f(2))); ctx.stroke(); ctx.setLineDash([]);\n  curve(0, 2, color(left)); curve(2, 4, color(right));\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(1.3), Y(f(2))); ctx.lineTo(X(2.7), Y(f(2))); ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(2), Y(f(2)), 9, 0, 2 * Math.PI); ctx.fill();\n  text(left > 0 ? 'f′ > 0' : 'f′ < 0', X(0.9), Y(2.6), color(left));\n  text(right > 0 ? 'f′ > 0' : 'f′ < 0', X(3.1), Y(2.6), color(right));\n  text('c', X(2), oy + 36, colors.ink);\n  text(title, X(2), oy + 78, colors.ink);\n  ctx.textAlign = 'left';\n}\npanel(10, hermite([[0, 0.5, 1.5], [2, 2.1, 0], [4, 0.5, -1.5]]), 1, -1, 'local maximum');\npanel(420, hermite([[0, 2.1, -1.5], [2, 0.5, 0], [4, 2.1, 1.5]]), -1, 1, 'local minimum');\npanel(830, (x) => 1.3 + 0.1 * Math.pow(x - 2, 3), 1, 1, 'neither');\npanel(1240, (x) => 1.3 - 0.1 * Math.pow(x - 2, 3), -1, -1, 'neither');\n\\end{js}\n\n\\slide{Example 1, Continued: Local Extreme Values}\n\\begin{columns}[7 5, parallel]\nFor $f(x)=3x^4-4x^3-12x^2+5$, read the local extreme values from the sign chart for $f'$.\n\\begin{itemize}\n\\item $f'$ changes from $\\textcolor{c2}{-}$ to $\\textcolor{c4}{+}$ at $-1$. Local minimum: $$f(-1)=3+4-12+5=0$$\n\\item $f'$ changes from $\\textcolor{c4}{+}$ to $\\textcolor{c2}{-}$ at $0$. Local maximum: $$f(0)=5$$\n\\item $f'$ changes from $\\textcolor{c2}{-}$ to $\\textcolor{c4}{+}$ at $2$. Local minimum: $$f(2)=48-32-48+5=-27$$\n\\end{itemize}\n\\columnbreak\n\\begin{js}[size=640x720, alt=\"The graph of f(x) = 3x to the fourth minus 4x cubed minus 12x squared plus 5, with a compressed vertical scale, colored where it decreases and increases. The local minima (-1, 0) and (2, -27) and the local maximum (0, 5) are marked.\"]\nconst L = 80, R = 20, T = 20, B = 56;                 // margins in pixels\nconst x0 = -1.8, x1 = 2.8, y0 = -32, y1 = 24;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 3 * x ** 4 - 4 * x ** 3 - 12 * x * x + 5;\naxes(0.5, 5, 1, 10);\nclip();\npath((x) => x, f, x0, -1, colors.c2, 6); path((x) => x, f, -1, 0, colors.c4, 6);\npath((x) => x, f, 0, 2, colors.c2, 6); path((x) => x, f, 2, x1, colors.c4, 6);\nctx.restore();\ndot(-1, 0, colors.ink, 12); tag('min', X(-1), Y(0) + 46, colors.ink, 'center');\n{ dot(0, 5, colors.ink, 12); tag('max', X(0) + 16, Y(5) - 18, colors.ink); }\n{ dot(2, -27, colors.ink, 12); tag('min', X(2) + 20, Y(-27) + 10, colors.ink); }\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: $g(x)=x+2\\sin x$}\n\\begin{columns}[7 5, parallel]\nFind the local maximum and minimum values of $g(x)=x+2\\sin x$ for $0\\le x\\le2\\pi$.\n\n$$g'(x)=1+2\\cos x$$\n$g'$ exists everywhere, and $g'(x)=0$ when $\\cos x=-1/2$:\n$$x=\\frac{2\\pi}{3}\\quad\\text{or}\\quad x=\\frac{4\\pi}{3}.$$\n\n$g'(x)>0$ exactly when $\\cos x>-1/2$. The graph of $\\cos x$ shows where that happens.\n\\columnbreak\n\\begin{js}[size=640x380, alt=\"The graph of y = cos x for x from 0 to 2 pi. At the next step the line y = -1/2 is drawn, crossing the graph at 2 pi over 3 and 4 pi over 3. At the last step, bars show where g prime is positive (cos x above -1/2) and negative (below).\"]\nconst L = 16, R = 16, T = 16, B = 86;                 // margins in pixels\nconst x0 = -0.3, x1 = 6.6, yc = 0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx  maximum (0, 4) and the local minimum (2, 0) are marked.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -1.4, x1 = 3.4, yc = 2.0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x * x * x - 3 * x * x + 4;\naxes(0.5, 1);\nclip();\npath((x) => x, f, x0, 0, colors.c4, 6); path((x) => x, f, 0, 2, colors.c2, 6); path((x) => x, f, 2, x1, colors.c4, 6);\nctx.restore();\nif (local >= 2) {\n  dot(0, 4, colors.ink, 12); tag('max (0, 4)', X(0) + 18, Y(4) - 16, colors.ink);\n  dot(2, 0, colors.ink, 12); tag('min (2, 0)', X(2), Y(0) + 46, colors.ink, 'center');\n}\n\\end{js}\n\\end{columns}\n\n\\section{Concavity}\n\n\\slide{Same Direction, Different Shape}\nBoth functions increase on $(a,b)$, and both graphs join $A$ to $B$. The graphs bend in opposite directions. Tangent lines show the difference.\n\\begin{js}[size=1640x650, alt=\"Two increasing graphs joining A to B. At the next step, short tangent lines are drawn at five points of each. The left graph bends upward and lies above its tangent lines (blue). The right graph bends downward and lies below its tangent lines (purple).\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst S = 180;                                        // pixels per unit in both panels, the same on both axes\nfunction panel(ox, f, df, color, name, nx, ny) {\n  const oy = 590, X = (x) => ox + 60 + x * S, Y = (y) => oy - y * S;\n  const line = (ax, ay, bx, by, c, wd, dash) => {\n    ctx.strokeStyle = c; ctx.lineWidth = wd; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n    ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n  };\n  const text = (t, x, y, c) => { ctx.font = font(28); ctx.textAlign = 'center'; ctx.fillStyle = c; ctx.fillText(t, x, y); };\n  line(-0.25, 0, 3.45, 0, colors.axis, 2);\n  line(0, 0, 0, f(0), colors.muted, 2, [6, 6]); line(3.2, 0, 3.2, f(3.2), colors.muted, 2, [6, 6]);\n  const P = [0.4, 1.1, 1.75, 2.35, 2.9];               // the points of tangency\n  if (local >= 1) P.forEach((p) => {                   // tangent segments of the same length, drawn under the curve\n    const m = df(p), d = 0.68 / Math.sqrt(1 + m * m);\n    ctx.globalAlpha = 0.45; line(p - d, f(p) - d * m, p + d, f(p) + d * m, color, 12); ctx.globalAlpha = 1;\n  });\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const x = 3.2 * i / 200; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  if (local >= 1) P.forEach((p) => { ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(p), Y(f(p)), 6, 0, 2 * Math.PI); ctx.fill(); });\n  [[0, 'A'], [3.2, 'B']].forEach((q) => {\n    ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(q[0]), Y(f(q[0])), 9, 0, 2 * Math.PI); ctx.fill();\n    text(q[1], X(q[0]) + (q[0] ? 30 : -30), Y(f(q[0])) + 10, colors.ink);\n  });\n  text('a', X(0), oy + 40, colors.ink); text('b', X(3.2), oy + 40, colors.ink);\n  text(name, X(nx), Y(ny), colors.curve);\n  ctx.textAlign = 'left';\n}\npanel(40, (x) => 0.4 + 0.26 * x * x, (x) => 0.52 * x, colors.c1, 'y = f(x)', 0.75, 2.6);\npanel(860, (x) => 0.4 + 1.664 * x - 0.26 * x * x, (x) => 1.664 - 0.52 * x, colors.c3, 'y = g(x)', 2.3, 1.2);\n\\end{js}\n\n\\slide{Concavity}\n\\begin{columns}[5 7, parallel]\n\\begin{definition}{Concavity}\nIf the graph of $f$ lies above all of its tangent lines on an interval $I$, then $f$ is \\textcolor{c1}{\\textbf{concave upward}} on $I$.\n\\\\[0.5em]\nIf the graph of $f$ lies below all of its tangent lines on $I$, then $f$ is \\textcolor{c3}{\\textbf{concave downward}} on $I$.\n\\end{definition}\n\\columnbreak\n\\begin{js}[size=900x520, alt=\"A graph that bends down, then up, then down, with a point and its tangent line. Dragging across the figure, or the arrow keys, move the point. The tangent line is blue where the graph lies above it (concave upward) and purple where the graph lies below it (concave downward). A strip along the bottom marks the concave down and concave up intervals.\"]\nconst L = 16, R = 16, T = 16, B = 130;                 // margins in pixels\nconst x0 = 0, x1 = 6.2, yc = 1.6;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.2;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst f = (x) => 0.5 * Math.sin(1.5 * x) + 0.2 * x + 1;\nconst df = (x) => 0.75 * Math.cos(1.5 * x) + 0.2, d2f = (x) => -1.125 * Math.sin(1.5 * x);\nconst q1 = 2 * Math.PI / 3, q2 = 4 * Math.PI / 3;     // where f'' changes sign\nfunction strip() {                                    // concave down / up along the bottom of the plot\n  seg(0, 0.45, q1, 0.45, colors.c3, 10); seg(q1, 0.45, q2, 0.45, colors.c1, 10); seg(q2, 0.45, x1, 0.45, colors.c3, 10);\n  tag('concave down', X(q1 / 2), Y(0.62), colors.c3, 'center');\n  tag('concave up', X((q1 + q2) / 2), Y(0.62), colors.c1, 'center');\n  tag('concave down', X((q2 + x1) / 2), Y(0.62), colors.c3, 'center');\n}\n\nonFrame(() => {\n  const x = x0 + state.u * (x1 - x0), m = df(x), k = d2f(x);\n  const col = k > 0.02 ? colors.c1 : k < -0.02 ? colors.c3 : colors.ink;\n  ctx.clearRect(0, 0, w, h);\n  grid(0.5);\n  strip();\n  clip();\n  path((t) => t, f, x0, x1, colors.curve, 5);\n  seg(x - 1.1, f(x) - 1.1 * m, x + 1.1, f(x) + 1.1 * m, col, 4);\n  ctx.restore();\n  dot(x, f(x), col, 12);\n  tag(k > 0.02 ? 'graph above the tangent line' : k < -0.02 ? 'graph below the tangent line' : 'graph crosses the tangent line',\n    L + 14, T + 40, col);\n  slider('x = ' + dec(x, 2));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{The Concavity Test}\n\\begin{columns}[6 6, parallel]\n\\begin{theorem}{Concavity Test}\n\\begin{enumerate}[tight]\n\\item[(a)] If $\\textcolor{c1}{f''(x)>0}$ on an interval $I$, then $f$ is \\textcolor{c1}{concave upward} on $I$.\n\\item[(b)] If $\\textcolor{c3}{f''(x)<0}$ on an interval $I$, then $f$ is \\textcolor{c3}{concave downward} on $I$.\n\\end{enumerate}\n\\end{theorem}\n\nWhy (a): $f''$ is the derivative of $f'$. If $\\textcolor{c1}{f''>0}$ on $I$, then $f'$ is increasing on $I$, by the I/D Test. The slopes of the tangent lines increase from left to right, and the graph bends upward.\n\\columnbreak\n\\begin{js}[size=780x760, alt=\"Top: the graph of f(x) = x cubed over 3 minus x, purple where it is concave downward (x less than 0) and blue where it is concave upward (x greater than 0), with a movable point and its tangent line. Bottom: the graph of f prime of x = x squared minus 1, with the matching point. Where f prime is decreasing, f is concave downward; where f prime is increasing, f is concave upward. Dragging across the figure, or the arrow keys, move the point.\"]\nconst L = 16, R = 16, T = 16, B = 130, GAP = 44;   // margins in pixels\nconst x0 = -2.1, x1 = 2.1;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit on x, and on y in the top panel\nconst X = (x) => L + (x - x0) * s;\nconst Yt = (y) => T + (1.05 - y) * s;                 // top panel: y from -1.05 to 1.05, same units as x\nconst BT = T + 2.1 * s + GAP, BH = h - B - BT;        // bottom panel, from BT to BT + BH\nconst Yb = (y) => BT + (3.6 - y) / 5 * BH;            // bottom panel: y from -1.4 to 3.6, compressed\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction curve(g, Yf, t0, t1, color, width) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = t0 + (t1 - t0) * i / 300; if (i) ctx.lineTo(X(x), Yf(g(x))); else ctx.moveTo(X(x), Yf(g(x))); }\n  ctx.stroke();\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.3;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst f = (x) => x * x * x / 3 - x, df = (x) => x * x - 1;\nonFrame(() => {\n  const x = x0 + state.u * (x1 - x0), m = df(x);\n  const col = x > 0.01 ? colors.c1 : x < -0.01 ? colors.c3 : colors.ink;\n  ctx.clearRect(0, 0, w, h);\n  line(L, Yt(0), w - R, Yt(0), colors.axis, 2); line(X(0), T, X(0), Yt(-1.05), colors.axis, 2);\n  line(L, Yb(0), w - R, Yb(0), colors.axis, 2); line(X(0), BT, X(0), BT + BH, colors.axis, 2);\n  ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, 2.1 * s); ctx.clip();\n  curve(f, Yt, x0, 0, colors.c3, 5); curve(f, Yt, 0, x1, colors.c1, 5);\n  line(X(x - 0.7), Yt(f(x) - 0.7 * m), X(x + 0.7), Yt(f(x) + 0.7 * m), col, 4);\n  ctx.restore();\n  curve(df, Yb, x0, 0, colors.c3, 5); curve(df, Yb, 0, x1, colors.c1, 5);\n  line(X(x), Yt(f(x)), X(x), Yb(df(x)), colors.muted, 2, [6, 6]);\n  disc(X(x), Yt(f(x)), col, 11); disc(X(x), Yb(df(x)), col, 11);\n  tag('y = f(x)', w - R - 8, T + 36, colors.ink, 'right');\n  tag('y = f′(x)', w - R - 8, BT + 30, colors.ink, 'right');\n  tag('slope f′(x) = ' + dec(m, 2), L + 8, BT + 30, col);\n  slider('x = ' + dec(x, 2));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Inflection Points}\n\\begin{columns}[5 7, parallel]\n\\begin{definition}{Inflection Point}\nA point $P$ on a curve $y=f(x)$ is an \\textbf{inflection point} if $f$ is continuous there and the curve changes from \\textcolor{c1}{concave upward} to \\textcolor{c3}{concave downward}, or from \\textcolor{c3}{concave downward} to \\textcolor{c1}{concave upward}, at $P$.\n\\end{definition}\n\nBy the Concavity Test, a graph has an inflection point where $f$ is continuous and $f''$ \\textbf{changes sign}.\n\\columnbreak\n\\begin{js}[size=900x420, alt=\"A graph that is concave downward, then concave upward, then concave downward, with a strip along the bottom marking the intervals. At the next step the two inflection points, where the concavity changes, are marked.\"]\nconst L = 16, R = 16, T = 16, B = 40;                 // margins in pixels\nconst x0 = 0, x1 = 6.2, yc = 1.6;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 0.5 * Math.sin(1.5 * x) + 0.2 * x + 1;\nconst df = (x) => 0.75 * Math.cos(1.5 * x) + 0.2, d2f = (x) => -1.125 * Math.sin(1.5 * x);\nconst q1 = 2 * Math.PI / 3, q2 = 4 * Math.PI / 3;     // where f'' changes sign\nfunction strip() {                                    // concave down / up along the bottom of the plot\n  seg(0, 0.45, q1, 0.45, colors.c3, 10); seg(q1, 0.45, q2, 0.45, colors.c1, 10); seg(q2, 0.45, x1, 0.45, colors.c3, 10);\n  tag('concave down', X(q1 / 2), Y(0.62), colors.c3, 'center');\n  tag('concave up', X((q1 + q2) / 2), Y(0.62), colors.c1, 'center');\n  tag('concave down', X((q2 + x1) / 2), Y(0.62), colors.c3, 'center');\n}\n\ngrid(0.5);\nstrip();\npath((t) => t, f, x0, x1, colors.curve, 5);\nif (local >= 1) {\n  [q1, q2].forEach((q, i) => {\n    seg(q, 0.45, q, f(q), colors.muted, 2, [6, 6]);\n    dot(q, f(q), colors.ink, 12);\n    tag(i ? 'P₂' : 'P₁', X(q) + 16, Y(f(q)) - 14, colors.ink);\n  });\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Explore: The Signs of $f'$ and $f''$}\n\\begin{columns}[4 8, parallel]\nChoose a function, then move along its graph.\n\\begin{itemize}[tight]\n\\item[A] $f(x)=x^3/3-x$\n\\item[B] $f(x)=x^4/4-x^2$\n\\item[C] $f(x)=2/(1+e^{-2x})$\n\\item[D] $f(x)=2e^{-x^2}$\n\\end{itemize}\n\\textcolor{c4}{increasing}: $f'>0$\n\\\\ \\textcolor{c2}{decreasing}: $f'<0$\n\\\\ \\textcolor{c1}{concave upward}: $f''>0$\n\\\\ \\textcolor{c3}{concave downward}: $f''<0$\n\\columnbreak\n\\begin{js}[size=1060x790, alt=\"An explorer with four functions, chosen by the buttons A to D (or the up and down arrow keys). A point moves along the chosen graph by dragging across the figure or with the left and right arrow keys. A readout says whether f is increasing or decreasing and concave upward or downward at the point. Two strips under the graph show the sign of f prime and the sign of f double prime.\"]\nconst L = 16, R = 16, T = 84, B = 196;               // margins in pixels; the buttons sit above the plot\nconst x0 = -2.4, x1 = 2.4;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0), PH = h - T - B;    // pixels per unit, the same on both axes\nconst E = Math.exp, sig = (z) => 1 / (1 + E(-z));\nconst F = [                                           // each function with its first and second derivatives\n  { yc: 0, f: (x) => x * x * x / 3 - x, d1: (x) => x * x - 1, d2: (x) => 2 * x },\n  { yc: -0.1, f: (x) => x ** 4 / 4 - x * x, d1: (x) => x ** 3
