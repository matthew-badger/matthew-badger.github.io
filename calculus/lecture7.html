 col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction grid(g) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / g) * g; v <= X1 + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / g) * g; v <= YB + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n  }\n}\nfunction axes() {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  if (YA < 0 && YB > 0) { ctx.beginPath(); ctx.moveTo(P, Y(0)); ctx.lineTo(w - P, Y(0)); ctx.stroke(); }\n  if (X0 < 0 && X1 > 0) { ctx.beginPath(); ctx.moveTo(X(0), P); ctx.lineTo(X(0), h - P); ctx.stroke(); }\n}\nfunction seg(x1, y1, x2, y2, col, lw, dash) {\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nctx.clearRect(0, 0, w, h);\nfunction circle(col, lw) {\n  ctx.strokeStyle = col; ctx.lineWidth = lw;\n  ctx.beginPath(); ctx.arc(X(0), Y(0), X(1) - X(0), 0, 6.2832); ctx.stroke();\n}\nfunction arcTo(t0, t1, r, col, lw) {\n  const R = (X(1) - X(0)) * r;\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.arc(X(0), Y(0), R, -t0, -t1, t1 > t0); ctx.stroke();\n  ctx.restore();\n}\nconst t = 1.2, cx = Math.cos(t), sy = Math.sin(t);\ngrid(0.5);\naxes();\ncircle('#7d8b8c', 3);\narcTo(0, t, 1, colors.teal2, 8);\nseg(0, 0, cx, sy, '#2b2b2b', 3);\nseg(0, 0, cx, 0, colors.c1, 7);\nseg(cx, 0, cx, sy, colors.c2, 7);\nhtxt('1', X(cx / 2) - 18, Y(sy / 2) - 4, '600 28px ' + FM, '#2b2b2b');\ndot(1, 0, '#2b2b2b');\ndot(cx, sy, colors.red2);\nhtxt('x', X(1.13 * Math.cos(t / 2)), Y(1.13 * Math.sin(t / 2)) + 10, 'italic 600 34px ' + FS, colors.teal2);\nhtxt('(cos x, sin x)', X(cx) + 16, Y(sy) - 16, '600 24px ' + FM, colors.red2, 'left');\nhtxt('cos x', X(cx / 2), Y(0) + 34, '600 24px ' + FM, colors.c1);\nhtxt('sin x', X(cx) + 12, Y(sy / 2) + 8, '600 24px ' + FM, colors.c2, 'left');\nhtxt('(1, 0)', X(1) + 8, Y(0) + 34, '600 24px ' + FM, '#2b2b2b', 'left');\n\\end{js}\n$$\\tan x=\\frac{\\textcolor{c2}{\\sin x}}{\\textcolor{c1}{\\cos x}}$$\n\\columnbreak\nStart at $(1,0)$ and travel a distance $x$ around the unit circle: counterclockwise if $x>0$, clockwise if $x<0$.\n\\medskip\nThe point where you stop is\n$$(\\textcolor{c1}{\\cos x},\\textcolor{c2}{\\sin x})$$\n\\medskip\nThe number $x$ is the length of the arc. Measuring angles by arc length is \\alert{radian measure}. One full turn is $2\\pi$.\n\\end{columns}\n\n\\slide{Three Facts from the Picture}\n\\begin{columns}[5 7, parallel]\n\\begin{js}[size=640x640, alt=\"Unit circle showing: the right triangle with legs cos x and sin x and hypotenuse 1; the reflection of the point at x to the point at -x; and the rotation of the point at x to the point at x + b.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -1.45, X1 = 1.45, CY = 0;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction grid(g) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / g) * g; v <= X1 + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / g) * g; v <= YB + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n  }\n}\nfunction axes() {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  if (YA < 0 && YB > 0) { ctx.beginPath(); ctx.moveTo(P, Y(0)); ctx.lineTo(w - P, Y(0)); ctx.stroke(); }\n  if (X0 < 0 && X1 > 0) { ctx.beginPath(); ctx.moveTo(X(0), P); ctx.lineTo(X(0), h - P); ctx.stroke(); }\n}\nfunction curve(f, col, lw, a, b, dash) {\n  const lo = Math.max(X0, a === undefined ? X0 : a), hi = Math.min(X1, b === undefined ? X1 : b);\n  ctx.save();\n  ctx.beginPath(); ctx.rect(P, P, w - 2 * P, h - 2 * P); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath();\n  let pen = false, prev = 0;\n  for (let k = 0; k <= 1200; k++) {\n    const x = lo + (hi - lo) * k / 1200, y = f(x);\n    const bad = !isFinite(y) || y > YB + 3 * HH || y < YA - 3 * HH;\n    if (bad || (pen && Math.abs(y - prev) > 2 * HH)) { pen = false; if (bad) continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n    prev = y;\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction seg(x1, y1, x2, y2, col, lw, dash) {\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nfunction hole(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();\n}\nfunction xlab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 7); ctx.lineTo(X(v), Y(0) + 7); ctx.stroke();\n  htxt(s, X(v), Y(0) + 34, '500 24px ' + FM, '#444');\n}\nfunction ylab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(0) - 7, Y(v)); ctx.lineTo(X(0) + 7, Y(v)); ctx.stroke();\n  htxt(s, X(0) - 14, Y(v) + 8, '500 24px ' + FM, '#444', 'right');\n}\nfunction frame() {\n  ctx.strokeStyle = '#c7d0d0'; ctx.lineWidth = 2;\n  ctx.strokeRect(P, P, w - 2 * P, h - 2 * P);\n}\nctx.clearRect(0, 0, w, h);\nfunction circle(col, lw) {\n  ctx.strokeStyle = col; ctx.lineWidth = lw;\n  ctx.beginPath(); ctx.arc(X(0), Y(0), X(1) - X(0), 0, 6.2832); ctx.stroke();\n}\nfunction arcTo(t0, t1, r, col, lw) {\n  const R = (X(1) - X(0)) * r;\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.arc(X(0), Y(0), R, -t0, -t1, t1 > t0); ctx.stroke();\n  ctx.restore();\n}\nfunction arrowHead(x, y, ang, col) {\n  ctx.save();\n  ctx.translate(X(x), Y(y)); ctx.rotate(-ang);\n  ctx.fillStyle = col;\n  ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-10, -9); ctx.lineTo(-10, 9); ctx.closePath(); ctx.fill();\n  ctx.restore();\n}\nconst t = 0.9, b = 1.1, cx = Math.cos(t), sy = Math.sin(t);\ngrid(0.5);\naxes();\ncircle('#7d8b8c', 3);\nseg(0, 0, cx, sy, '#2b2b2b', 3);\nseg(0, 0, cx, 0, colors.c1, 7);\nseg(cx, 0, cx, sy, colors.c2, 7);\nhtxt('1', X(cx / 2) - 16, Y(sy / 2) - 6, '600 28px ' + FM, '#2b2b2b');\nif (local >= 1) {\n  seg(cx, 0, cx, -sy, colors.teal2, 3, [8, 7]);\n  seg(0, 0, cx, -sy, '#7d8b8c', 2, [6, 6]);\n  dot(cx, -sy, colors.teal2);\n  htxt('-x', X(1.16 * Math.cos(t)), Y(-1.16 * Math.sin(t)) + 20, 'italic 600 30px ' + FS, colors.teal2);\n}\nif (local >= 2) {\n  arcTo(t + 0.22, t + b - 0.12, 1.24, colors.c4, 4);\n  arrowHead(1.24 * Math.cos(t + b - 0.12), 1.24 * Math.sin(t + b - 0.12), t + b - 0.12 + Math.PI / 2, colors.c4);\n  seg(0, 0, Math.cos(t + b), Math.sin(t + b), '#7d8b8c', 2, [6, 6]);\n  dot(Math.cos(t + b), Math.sin(t + b), colors.c4);\n  htxt('b', X(1.37 * Math.cos(t + b / 2 + 0.05)), Y(1.37 * Math.sin(t + b / 2 + 0.05)) + 10, 'italic 600 30px ' + FS, colors.c4);\n  htxt('x + b', X(Math.cos(t + b)) - 18, Y(Math.sin(t + b)) + 10, 'italic 600 30px ' + FS, colors.c4, 'right');\n}\ndot(cx, sy, colors.red2);\nhtxt('x', X(1.14 * Math.cos(t)) + 6, Y(1.14 * Math.sin(t)), 'italic 600 30px ' + FS, colors.red2);\n\\end{js}\n\\columnbreak\n\\textbf{Distance.} The point is at distance $1$ from the origin:\n$$\\textcolor{c1}{\\cos^2 x}+\\textcolor{c2}{\\sin^2 x}=1$$\n\\pause\n\\textbf{Reflection.} Reflecting across the horizontal axis takes the point at $x$ to the point at $-x$:\n$$\\cos(-x)=\\cos x\\qquad\\sin(-x)=-\\sin x$$\n\\pause\n\\textbf{Rotation.} Rotating about the origin by $b$ takes the point at $x$ to the point at $x+b$. Rotations do not change distances.\n\\end{columns}\n\n\\section{The Angle Sum Formulas}\n\n\\slide{What We Need}\nTo differentiate $\\sin x$ and $\\cos x$, we need $\\sin(x+h)$ and $\\cos(x+h)$ in terms of $\\sin x$, $\\cos x$, $\\sin h$, and $\\cos h$.\n\\begin{theorem}{Angle Sum Formulas}\nFor all real numbers $a$ and $b$,\n$$\\cos(a+b)=\\cos a\\cos b-\\sin a\\sin b$$\n$$\\sin(a+b)=\\sin a\\cos b+\\cos a\\sin b$$\n\\end{theorem}\n\\pause\nWe prove the formula for $\\cos(a+b)$. The formula for $\\sin(a+b)$ has a similar proof, which you will work through on a worksheet.\n\n\\slide{Two Chords, One Arc}\n\\begin{js}[size=1500x450, alt=\"Two unit circles. Left: points P at angle a and Q at angle -b, joined by a chord, with the arc between them of length a + b. Right: the rotated picture, with E = (1, 0) and R at angle a + b joined by a chord. Tick marks show the chords have equal length.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst R = 170;\nctx.clearRect(0, 0, w, h);\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction panel(cx, cy) {\n  const px = function (u) { return cx + R * u; }, py = function (v) { return cy - R * v; };\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(px(-1.25), py(0)); ctx.lineTo(px(1.25), py(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(px(0), py(-1.25)); ctx.lineTo(px(0), py(1.25)); ctx.stroke();\n  ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();\n  return {\n    x: px, y: py,\n    arc: function (t0, t1, col, lw) {\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.arc(cx, cy, R, -t0, -t1, true); ctx.stroke(); ctx.restore();\n    },\n    ray: function (t) {\n      ctx.save(); ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px(Math.cos(t)), py(Math.sin(t))); ctx.stroke(); ctx.restore();\n    },\n    chord: function (t0, t1, col, ticks) {\n      const x0 = px(Math.cos(t0)), y0 = py(Math.sin(t0)), x1 = px(Math.cos(t1)), y1 = py(Math.sin(t1));\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();\n      if (ticks) {\n        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, L = Math.hypot(x1 - x0, y1 - y0);\n        const ux = (x1 - x0) / L, uy = (y1 - y0) / L;\n        ctx.lineWidth = 4;\n        [-7, 7].forEach(function (d) {\n          ctx.beginPath();\n          ctx.moveTo(mx + d * ux - 14 * uy, my + d * uy + 14 * ux);\n          ctx.lineTo(mx + d * ux + 14 * uy, my + d * uy - 14 * ux);\n          ctx.stroke();\n        });\n      }\n      ctx.restore();\n    },\n    dot: function (t, col) {\n      ctx.beginPath(); ctx.arc(px(Math.cos(t)), py(Math.sin(t)), 10, 0, 6.2832);\n      ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n    },\n    name: function (t, s, col, r) {\n      const rr = r || 1.2;\n      htxt(s, px(rr * Math.cos(t)), py(rr * Math.sin(t)) + 10, 'italic 600 32px ' + FS, col);\n    }\n  };\n}\nconst a = 1.25, b = 0.65;\nconst L = panel(370, 225);\nL.arc(-b, a, colors.teal2, 8);\nL.ray(a); L.ray(-b);\nL.chord(-b, a, colors.c2, local >= 2);\nL.dot(a, '#2b2b2b'); L.dot(-b, '#2b2b2b');\nL.name(a, 'P', '#2b2b2b'); L.name(-b, 'Q', '#2b2b2b');\nL.name((a - b) / 2, 'a + b', colors.teal2, 1.33);\nif (local >= 1) {\n  const Rt = panel(1130, 225);\n  Rt.arc(0, a + b, colors.teal2, 8);\n  Rt.ray(0); Rt.ray(a + b);\n  Rt.chord(0, a + b, colors.c2, local >= 2);\n  Rt.dot(0, '#2b2b2b'); Rt.dot(a + b, '#2b2b2b');\n  Rt.name(-0.24, 'E', '#2b2b2b', 1.14); Rt.name(a + b, 'R', '#2b2b2b');\n  Rt.name((a + b) / 2, 'a + b', colors.teal2, 1.3);\n  ctx.save(); ctx.strokeStyle = colors.c4; ctx.fillStyle = colors.c4; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.moveTo(680, 225); ctx.lineTo(805, 225); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(822, 225); ctx.lineTo(802, 215); ctx.lineTo(802, 235); ctx.closePath(); ctx.fill();\n  ctx.restore();\n  htxt('rotate by b', 750, 203, 'italic 600 30px ' + FS, colors.c4);\n}\n\\end{js}\n$P=(\\cos a,\\sin a)$ is the point at $a$. By reflection, $Q=(\\cos b,-\\sin b)$ is the point at $-b$.\n\\uncover<1->{Rotating by $b$ takes $Q$ to $E=(1,0)$ and $P$ to $R=(\\cos(a+b),\\sin(a+b))$.}\n\\uncover<2->{Rotations do not change distances. Thus, $|QP|=|ER|$.}\n\n\\slide{The First Chord}\n\\begin{columns}[5 7, parallel]\n\\begin{js}[size=640x560, alt=\"Unit circle with P = (cos a, sin a) and Q = (cos b, -sin b) joined by a chord.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst R = 170;\nctx.clearRect(0, 0, w, h);\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction panel(cx, cy) {\n  const px = function (u) { return cx + R * u; }, py = function (v) { return cy - R * v; };\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(px(-1.25), py(0)); ctx.lineTo(px(1.25), py(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(px(0), py(-1.25)); ctx.lineTo(px(0), py(1.25)); ctx.stroke();\n  ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();\n  return {\n    x: px, y: py,\n    arc: function (t0, t1, col, lw) {\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.arc(cx, cy, R, -t0, -t1, true); ctx.stroke(); ctx.restore();\n    },\n    ray: function (t) {\n      ctx.save(); ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px(Math.cos(t)), py(Math.sin(t))); ctx.stroke(); ctx.restore();\n    },\n    chord: function (t0, t1, col, ticks) {\n      const x0 = px(Math.cos(t0)), y0 = py(Math.sin(t0)), x1 = px(Math.cos(t1)), y1 = py(Math.sin(t1));\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();\n      if (ticks) {\n        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, L = Math.hypot(x1 - x0, y1 - y0);\n        const ux = (x1 - x0) / L, uy = (y1 - y0) / L;\n        ctx.lineWidth = 4;\n        [-7, 7].forEach(function (d) {\n          ctx.beginPath();\n          ctx.moveTo(mx + d * ux - 14 * uy, my + d * uy + 14 * ux);\n          ctx.lineTo(mx + d * ux + 14 * uy, my + d * uy - 14 * ux);\n          ctx.stroke();\n        });\n      }\n      ctx.restore();\n    },\n    dot: function (t, col) {\n      ctx.beginPath(); ctx.arc(px(Math.cos(t)), py(Math.sin(t)), 10, 0, 6.2832);\n      ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n    },\n    name: function (t, s, col, r) {\n      const rr = r || 1.2;\n      htxt(s, px(rr * Math.cos(t)), py(rr * Math.sin(t)) + 10, 'italic 600 32px ' + FS, col);\n    }\n  };\n}\nconst a = 1.25, b = 0.65;\nconst L = panel(205, 280);\nL.arc(-b, a, colors.teal2, 8);\nL.ray(a); L.ray(-b);\nL.chord(-b, a, colors.c2, false);\nL.dot(a, '#2b2b2b'); L.dot(-b, '#2b2b2b');\nhtxt('P = (cos a, sin a)', L.x(Math.cos(a)) + 18, L.y(Math.sin(a)) - 14, '600 23px ' + FM, '#2b2b2b', 'left');\nhtxt('Q = (cos b, -sin b)', L.x(Math.cos(b)) + 18, L.y(-Math.sin(b)) + 40, '600 23px ' + FM, '#2b2b2b', 'left');\n\\end{js}\n\\columnbreak\nDistance formula:\n$$|QP|^2=(\\cos a-\\cos b)^2+(\\sin a+\\sin b)^2$$\n\\pause\nExpand each square:\n\\begin{align}\n(\\cos a-\\cos b)^2 &= \\textcolor{c1}{\\cos^2 a}-2\\cos a\\cos b+\\textcolor{c3}{\\cos^2 b}\\\\\n(\\sin a+\\sin b)^2 &= \\textcolor{c1}{\\sin^2 a}+2\\sin a\\sin b+\\textcolor{c3}{\\sin^2 b}\n\\end{align}\n\\pause\nAdd. Each pair of matching colors sums to $1$:\n\\begin{align}\n|QP|^2 &= \\textcolor{c1}{1}+\\textcolor{c3}{1}-2\\cos a\\cos b+2\\sin a\\sin b\\\\\n&= 2-2(\\cos a\\cos b-\\sin a\\sin b)\n\\end{align}\n\\end{columns}\n\n\\slide{The Second Chord}\n\\begin{columns}[4 8, parallel]\n\\begin{js}[size=500x440, alt=\"Unit circle with E = (1, 0) and R = (cos(a + b), sin(a + b)) joined by a chord.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst R = 140;\nctx.clearRect(0, 0, w, h);\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction panel(cx, cy) {\n  const px = function (u) { return cx + R * u; }, py = function (v) { return cy - R * v; };\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.5;\n  ctx.beginPath(); ctx.moveTo(px(-1.25), py(0)); ctx.lineTo(px(1.25), py(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(px(0), py(-1.25)); ctx.lineTo(px(0), py(1.25)); ctx.stroke();\n  ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();\n  return {\n    x: px, y: py,\n    arc: function (t0, t1, col, lw) {\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.arc(cx, cy, R, -t0, -t1, true); ctx.stroke(); ctx.restore();\n    },\n    ray: function (t) {\n      ctx.save(); ctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px(Math.cos(t)), py(Math.sin(t))); ctx.stroke(); ctx.restore();\n    },\n    chord: function (t0, t1, col, ticks) {\n      const x0 = px(Math.cos(t0)), y0 = py(Math.sin(t0)), x1 = px(Math.cos(t1)), y1 = py(Math.sin(t1));\n      ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';\n      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();\n      if (ticks) {\n        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, L = Math.hypot(x1 - x0, y1 - y0);\n        const ux = (x1 - x0) / L, uy = (y1 - y0) / L;\n        ctx.lineWidth = 4;\n        [-7, 7].forEach(function (d) {\n          ctx.beginPath();\n          ctx.moveTo(mx + d * ux - 14 * uy, my + d * uy + 14 * ux);\n          ctx.lineTo(mx + d * ux + 14 * uy, my + d * uy - 14 * ux);\n          ctx.stroke();\n        });\n      }\n      ctx.restore();\n    },\n    dot: function (t, col) {\n      ctx.beginPath(); ctx.arc(px(Math.cos(t)), py(Math.sin(t)), 10, 0, 6.2832);\n      ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n    },\n    name: function (t, s, col, r) {\n      const rr = r || 1.2;\n      htxt(s, px(rr * Math.cos(t)), py(rr * Math.sin(t)) + 10, 'italic 600 32px ' + FS, col);\n    }\n  };\n}\nconst a = 1.25, b = 0.65;\nconst L = panel(175, 220);\nL.arc(0, a + b, colors.teal2, 8);\nL.ray(0); L.ray(a + b);\nL.chord(0, a + b, colors.c2, false);\nL.dot(0, '#2b2b2b'); L.dot(a + b, '#2b2b2b');\nhtxt('E = (1, 0)', L.x(1) + 18, L.y(0) + 40, '600 23px ' + FM, '#2b2b2b', 'left');\nhtxt('R = (cos(a+b), sin(a+b))', L.x(Math.cos(a + b)) - 40, L.y(Math.sin(a + b)) - 18, '600 23px ' + FM, '#2b2b2b', 'left');\n\\end{js}\n\\columnbreak\nDistance formula:\n\\begin{align}\n|ER|^2 &= (\\cos(a+b)-1)^2+\\sin^2(a+b)\\\\\n&= \\textcolor{c1}{\\cos^2(a+b)}-2\\cos(a+b)+1+\\textcolor{c1}{\\sin^2(a+b)}\\\\\n&= 2-2\\cos(a+b)\n\\end{align}\n\\pause\nSince $|ER|^2=|QP|^2$,\n$$2-2\\cos(a+b)=2-2(\\cos a\\cos b-\\sin a\\sin b)$$\n\\pause\nSubtract $2$ from both sides and divide by $-2$:\n$$\\boxed{\\cos(a+b)=\\cos a\\cos b-\\sin a\\sin b}$$\n\\end{columns}\n\n\\section{Two Special Limits}\n\n\\slide{Two Limits We Need}\n\\begin{columns}[1 1, parallel]\nThe slope of $y=\\sin x$ at $x=0$ is\n$$\\lim_{h\\to0}\\frac{\\sin(0+h)-\\sin 0}{h}=\\lim_{h\\to0}\\textcolor{c1}{\\frac{\\sin h}{h}}$$\n\\begin{js}[size=760x300, alt=\"Graph of y = sin(h)/h near h = 0, with an open circle at the point (0, 1).\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -4.2, X1 = 4.2, CY = 0.5;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction grid(g) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / g) * g; v <= X1 + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / g) * g; v <= YB + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n  }\n}\nfunction axes() {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  if (YA < 0 && YB > 0) { ctx.beginPath(); ctx.moveTo(P, Y(0)); ctx.lineTo(w - P, Y(0)); ctx.stroke(); }\n  if (X0 < 0 && X1 > 0) { ctx.beginPath(); ctx.moveTo(X(0), P); ctx.lineTo(X(0), h - P); ctx.stroke(); }\n}\nfunction curve(f, col, lw, a, b, dash) {\n  const lo = Math.max(X0, a === undefined ? X0 : a), hi = Math.min(X1, b === undefined ? X1 : b);\n  ctx.save();\n  ctx.beginPath(); ctx.rect(P, P, w - 2 * P, h - 2 * P); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath();\n  let pen = false, prev = 0;\n  for (let k = 0; k <= 1200; k++) {\n    const x = lo + (hi - lo) * k / 1200, y = f(x);\n    const bad = !isFinite(y) || y > YB + 3 * HH || y < YA - 3 * HH;\n    if (bad || (pen && Math.abs(y - prev) > 2 * HH)) { pen = false; if (bad) continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n    prev = y;\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction seg(x1, y1, x2, y2, col, lw, dash) {\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nfunction hole(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();\n}\nfunction xlab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 7); ctx.lineTo(X(v), Y(0) + 7); ctx.stroke();\n  htxt(s, X(v), Y(0) + 34, '500 24px ' + FM, '#444');\n}\nfunction ylab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(0) - 7, Y(v)); ctx.lineTo(X(0) + 7, Y(v)); ctx.stroke();\n  htxt(s, X(0) - 14, Y(v) + 8, '500 24px ' + FM, '#444', 'right');\n}\nfunction frame() {\n  ctx.strokeStyle = '#c7d0d0'; ctx.lineWidth = 2;\n  ctx.strokeRect(P, P, w - 2 * P, h - 2 * P);\n}\nctx.clearRect(0, 0, w, h);\ngrid(0.5);\naxes();\ncurve(function (x) { return Math.sin(x) / x; }, colors.c1, 4);\nhole(0, 1, colors.c1);\nhtxt('1', X(0) - 16, Y(1) - 10, '500 24px ' + FM, '#444', 'right');\nhtxt('h', w - P - 6, Y(0) - 12, 'italic 600 30px ' + FS, '#444', 'right');\n\\end{js}\n\\uncover<1->{The graph suggests that this limit is $1$.}\n\\columnbreak\nThe slope of $y=\\cos x$ at $x=0$ is\n$$\\lim_{h\\to0}\\frac{\\cos(0+h)-\\cos 0}{h}=\\lim_{h\\to0}\\textcolor{c2}{\\frac{\\cos h-1}{h}}$$\n\\begin{js}[size=760x300, alt=\"Graph of y = (cos(h) - 1)/h near h = 0, with an open circle at the origin.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -4.2, X1 = 4.2, CY = 0.2;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction ht oke();\n  ctx.restore();\n}\nfunction dot(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nfunction hole(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();\n}\nfunction xlab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 7); ctx.lineTo(X(v), Y(0) + 7); ctx.stroke();\n  htxt(s, X(v), Y(0) + 34, '500 24px ' + FM, '#444');\n}\nfunction ylab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(0) - 7, Y(v)); ctx.lineTo(X(0) + 7, Y(v)); ctx.stroke();\n  htxt(s, X(0) - 14, Y(v) + 8, '500 24px ' + FM, '#444', 'right');\n}\nfunction frame() {\n  ctx.strokeStyle = '#c7d0d0'; ctx.lineWidth = 2;\n  ctx.strokeRect(P, P, w - 2 * P, h - 2 * P);\n}\nctx.clearRect(0, 0, w, h);\ngrid(0.5);\naxes();\ncurve(function (x) { return (Math.cos(x) - 1) / x; }, colors.c2, 4);\nhole(0, 0, colors.c2);\nhtxt('h', w - P - 6, Y(0) - 12, 'italic 600 30px ' + FS, '#444', 'right');\n\\end{js}\n\\uncover<1->{The graph suggests that this limit is $0$.}\n\\end{columns}\n\n\\slide{Three Nested Regions}\n\\begin{columns}[5 7, parallel]\n\\begin{js}[size=640x640, alt=\"First quadrant of the unit circle with angle h at the origin O. Nested regions: the triangle OAP with height sin h, the sector OAP, and the triangle OAT with height tan h.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -0.2, X1 = 1.3, CY = 0.55;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nfunction hole(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();\n}\nfunction xlab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 7); ctx.lineTo(X(v), Y(0) + 7); ctx.stroke();\n  htxt(s, X(v), Y(0) + 34, '500 24px ' + FM, '#444');\n}\nfunction ylab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(0) - 7, Y(v)); ctx.lineTo(X(0) + 7, Y(v)); ctx.stroke();\n  htxt(s, X(0) - 14, Y(v) + 8, '500 24px ' + FM, '#444', 'right');\n}\nfunction frame() {\n  ctx.strokeStyle = '#c7d0d0'; ctx.lineWidth = 2;\n  ctx.strokeRect(P, P, w - 2 * P, h - 2 * P);\n}\nctx.clearRect(0, 0, w, h);\nconst t = 0.8, c = Math.cos(t), s = Math.sin(t), T = Math.tan(t);\nfunction poly(pts, col, alpha) {\n  ctx.save();\n  ctx.beginPath();\n  pts.forEach(function (p, i) { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath();\n  ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fill();\n  ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();\n  ctx.restore();\n}\ngrid(0.25);\naxes();\nseg(1, -0.15, 1, 1.25, '#9aa6a7', 2);\nctx.strokeStyle = '#7d8b8c'; ctx.lineWidth = 3;\nctx.beginPath(); ctx.arc(X(0), Y(0), X(1) - X(0), 0.12, -1.7, true); ctx.stroke();\nif (local >= 3) {\n  poly([[0, 0], [1, 0], [1, T]], colors.c2, local === 3 ? 0.18 : 0);\n  seg(1, 0, 1, T, colors.c2, 6);\n}\nif (local >= 2) {\n  ctx.save();\n  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.arc(X(0), Y(0), X(1) - X(0), 0, -t, true); ctx.closePath();\n  ctx.globalAlpha = local === 2 ? 0.2 : 0; ctx.fillStyle = colors.c4; ctx.fill();\n  ctx.globalAlpha = 1; ctx.strokeStyle = colors.c4; ctx.lineWidth = 4; ctx.stroke();\n  ctx.restore();\n}\nif (local >= 1) {\n  poly([[0, 0], [1, 0], [c, s]], colors.c1, local === 1 ? 0.2 : 0);\n  seg(c, 0, c, s, colors.c1, 4, [7, 6]);\n}\nseg(0, 0, 1.2 * c, 1.2 * s, '#2b2b2b', 2.5);\nseg(0, 0, 1.2, 0, '#2b2b2b', 2.5);\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5;\nctx.beginPath(); ctx.arc(X(0), Y(0), 0.2 * (X(1) - X(0)), 0, -t, true); ctx.stroke();\nhtxt('h', X(0.27 * Math.cos(t / 2)), Y(0.27 * Math.sin(t / 2)) + 10, 'italic 600 30px ' + FS, '#2b2b2b');\ndot(0, 0, '#2b2b2b'); dot(1, 0, '#2b2b2b'); dot(c, s, '#2b2b2b');\nhtxt('O', X(0) - 14, Y(0) + 34, 'italic 600 30px ' + FS, '#2b2b2b');\nhtxt('A', X(1) + 22, Y(0) + 34, 'italic 600 30px ' + FS, '#2b2b2b');\nhtxt('P', X(c) - 20, Y(s) - 14, 'italic 600 30px ' + FS, '#2b2b2b');\nif (local >= 1) htxt('sin h', X(c) - 12, Y(s / 2) + 8, '600 24px ' + FM, colors.c1, 'right');\nif (local >= 3) {\n  dot(1, T, colors.c2);\n  htxt('T', X(1) + 20, Y(T) - 10, 'italic 600 30px ' + FS, colors.c2, 'left');\n  htxt('tan h', X(1) + 14, Y(T / 2) + 8, '600 24px ' + FM, colors.c2, 'left');\n}\n\\end{js}\n\\columnbreak\nLet $0<h<\\pi/2$, with $A=(1,0)$ and $P=(\\cos h,\\sin h)$.\n\\pause\n\\textcolor{c1}{Triangle} $OAP$ has base $1$ and height $\\sin h$:\n$$\\text{area}=\\textcolor{c1}{\\tfrac12\\sin h}$$\n\\pause\n\\textcolor{c4}{Sector} $OAP$ is the fraction $h/(2\\pi)$ of a disk with area $\\pi$. This is where radian measure matters:\n$$\\text{area}=\\textcolor{c4}{\\tfrac12 h}$$\n\\pause\n\\textcolor{c2}{Triangle} $OAT$ has base $1$ and height $\\tan h$, the slope of $OP$:\n$$\\text{area}=\\textcolor{c2}{\\tfrac12\\tan h}$$\n\\end{columns}\n\n\\slide{Squeezing the Quotient}\nThe three regions are nested. For $0<h<\\pi/2$,\n$$\\textcolor{c1}{\\tfrac12\\sin h}<\\textcolor{c4}{\\tfrac12 h}<\\textcolor{c2}{\\tfrac12\\tan h}$$\n\\pause\nMultiply by $2/\\sin h$, which is positive, and write $\\tan h=\\sin h/\\cos h$:\n$$1<\\frac{h}{\\sin h}<\\frac{1}{\\cos h}$$\n\\pause\nTake reciprocals, which reverses the inequalities:\n$$\\cos h<\\frac{\\sin h}{h}<1$$\n\\pause\nReplacing $h$ by $-h$ changes neither $\\cos h$ nor $\\dfrac{\\sin h}{h}$. Thus, the same inequalities hold for $-\\pi/2<h<0$.\n\n\\slide{The First Special Limit}\n\\begin{columns}[5 7, parallel]\nAs $h\\to0$, $\\cos h\\to1$ because cosine is continuous.\n\\medskip\n\\uncover<1->{The graph of $\\dfrac{\\sin h}{h}$ is trapped between $\\cos h$ and $1$, and the trap closes at height $1$.}\n\\begin{uncover}<2->\nBy the Squeeze Theorem:\n\\begin{theorem}{First Special Limit}\n$$\\lim_{h\\to0}\\textcolor{c1}{\\frac{\\sin h}{h}}=1$$\n\\end{theorem}\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=900x640, alt=\"The graphs of y = cos h, y = sin(h)/h, and y = 1 near h = 0, shown at zoom 1, 4, and 16. The middle graph is trapped between the other two, which meet at height 1.\"]\nconst HW = local >= 2 ? 0.1 : (local >= 1 ? 0.4 : 1.6);\nconst ZOOM = local >= 2 ? 16 : (local >= 1 ? 4 : 1);\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -HW, X1 = HW, CY = 1 - 0.35 * HW;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction grid(g) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / g) * g; v <= X1 + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / g) * g; v <= YB + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n  }\n}\nfunction axes() {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  if (YA < 0 && YB > 0) { ctx.beginPath(); ctx.moveTo(P, Y(0)); ctx.lineTo(w - P, Y(0)); ctx.stroke(); }\n  if (X0 < 0 && X1 > 0) { ctx.beginPath(); ctx.moveTo(X(0), P); ctx.lineTo(X(0), h - P); ctx.stroke(); }\n}\nfunction curve(f, col, lw, a, b, dash) {\n  const lo = Math.max(X0, a === undefined ? X0 : a), hi = Math.min(X1, b === undefined ? X1 : b);\n  ctx.save();\n  ctx.beginPath(); ctx.rect(P, P, w - 2 * P, h - 2 * P); ctx.clip();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath();\n  let pen = false, prev = 0;\n  for (let k = 0; k <= 1200; k++) {\n    const x = lo + (hi - lo) * k / 1200, y = f(x);\n    const bad = !isFinite(y) || y > YB + 3 * HH || y < YA - 3 * HH;\n    if (bad || (pen && Math.abs(y - prev) > 2 * HH)) { pen = false; if (bad) continue; }\n    if (pen) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); pen = true; }\n    prev = y;\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction seg(x1, y1, x2, y2, col, lw, dash) {\n  ctx.save();\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  if (dash) ctx.setLineDash(dash);\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\n}\nfunction hole(x, y, col) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), 9, 0, 6.2832);\n  ctx.fillStyle = '#fff'; ctx.fill();\n  ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();\n}\nfunction xlab(v, s) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 7); ctx.lineTo(X(v), Y(0) + 7); ctx.stroke();\n  htxt(s, X(v), Y(0) + 34, '500 24px ' + FM, '#444');\n}\nfunction ylab(v lign}\n\\frac{\\sin(x+h)-\\sin x}{h} &= \\frac{\\sin x\\cos h+\\cos x\\sin h-\\sin x}{h}\\\\\n&= \\frac{\\sin x(\\cos h-1)+\\cos x\\sin h}{h}\\\\\n&= \\sin x\\cdot\\textcolor{c2}{\\frac{\\cos h-1}{h}}+\\cos x\\cdot\\textcolor{c1}{\\frac{\\sin h}{h}}\n\\end{align}\n\\pause\nAs $h\\to0$, this approaches $\\sin x\\cdot\\textcolor{c2}{0}+\\cos x\\cdot\\textcolor{c1}{1}=\\cos x$.\n\n\\slide{Sine and Its Derivative}\n\\begin{theorem}{Derivative of Sine}\n$$\\frac{d}{dx}\\sin x=\\cos x$$\n\\end{theorem}\n\\begin{js}[size=1600x380, alt=\"Graphs of y = sin x and y = cos x from -7 to 7. At each peak and valley of sin x, where the tangent is horizontal, the graph of cos x crosses zero.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 40;\nconst X0 = -7, X1 = 7, CY = 0;\nconst HH = (X1 - X0) / 2 * (h - 2 * P) / (w - 2 * P);\nconst YA = CY - HH, YB = CY + HH;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction grid(g) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / g) * g; v <= X1 + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / g) * g; v <= YB + 1e-9; v += g) {\n    ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n  }\n}\nfunction axes() {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n  if (YA < 0 && YB > 0) { ctx.beginPath(); ctx.moveTo(P, Y(0)); ctx.lineTo(w - P, Y(0)); ctx.stroke(); }\n  if (X0 < 0 && X1 > 0) { ctx.beginPath(); ctx.moveTo(X(0), P); ctx.lineTo( is $\\boxed{0}$.}\n\\uncover<3->{Compare $\\displaystyle\\lim_{x\\to0}\\frac{\\sin x}{x}=1$: the same quotient has a different limit at $0$.}\n\n\\slide{A Block on a Spring}\nA block on a spring is pulled $4$ cm to the right of its rest position and released. After $t$ seconds, its position in cm to the right of the rest position is\n$$s(t)=4\\cos t$$\n\\begin{js}[size=1600x440, alt=\"Animation: a block on a spring slides back and forth between s = 4 and s = -4 centimeters. On the right, the graph of s(t) = 4 cos t for t from 0 to 2 pi, with a moving dot at the current time.\"]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction arrow(x0, y0, x1, y1, col) {\n  if (Math.abs(x1 - x0) < 4) return;\n  const d = x1 > x0 ? 1 : -1;\n  ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 6; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - d * 14, y1); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - d * 22, y1 - 12); ctx.lineTo(x1 - d * 22, y1 + 12); ctx.closePath(); ctx.fill();\n  ctx.restore();\n}\n// left panel: the block; right panel: graphs against time, 1:1\nconst CM = 50, REST = 520, BY = 190, BW = 110;\nconst G = 50, GX = 1060, GY = h / 2;\nfunction TX(t) { return GX + G * t; }\nfunction SY(v) { return GY - G * v; }\nfunction plotFn(f, col, lw, dash) {\n  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);\n  ctx.beginPath();\n  for (let k = 0; k <= 400; k++) {\n    const t = 2 * Math.PI * k / 400;\n    if (k) ctx.lineTo(TX(t), SY(f(t))); else ctx.moveTo(TX(t), SY(f(t)));\n  }\n  ctx.stroke(); ctx.res
