6 6, parallel]\n\\begin{definition}{Absolute Extremes}\nLet $c$ be a number in the domain $D$ of $f$. Then $f(c)$ is the\n\\begin{itemize}\n\\item \\textbf{absolute maximum} value of $f$ on $D$ if $f(c)\\ge f(x)$ for all $x$ in $D$;\n\\item \\textbf{absolute minimum} value of $f$ on $D$ if $f(c)\\le f(x)$ for all $x$ in $D$.\n\\end{itemize}\n\\end{definition}\nThe absolute maximum and minimum values are the \\textbf{extreme values} of $f$.\n\\pause\nMaximum value $\\textcolor{c1}{5}$, attained at \\({x=\\textcolor{c1}{3}}\\).\n\\pause\nMinimum value $\\textcolor{c2}{2}$, attained at \\({x=\\textcolor{c2}{6}}\\).\n\\columnbreak\n\\begin{js}[size=660x560, alt=\"The graph of a function on the interval from 1.6 to 7. Step by step, dashed guide lines mark the absolute maximum: the value 5 on the y-axis, attained at x = 3 on the x-axis; then the absolute minimum: the value 2 on the y-axis, attained at x = 6 on the x-axis.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.5, x1 = 7.5, yc = 2.8;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst f = (x) => 2 * x * x * x / 9 - 3 * x * x + 12 * x - 10;\nconst HX = {}, HY = {};                               // tick numbers to emphasize, with their colors\nif (local >= 1) { HX[3] = colors.c1; HY[5] = colors.c1; }\nif (local >= 2) { HX[6] = colors.c2; HY[2] = colors.c2; }\ngrid(1);\nseg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nctx.textAlign = 'center';\nfor (let k = 1; k <= 7; k++) {\n  ctx.font = (HX[k] ? 'bold ' : '') + font(HX[k] ? 32 : 26); ctx.fillStyle = HX[k] || colors.text;\n  ctx.fillText(String(k), X(k), h - B + 32);\n}\nctx.textAlign = 'right';\nfor (let k = 1; k <= 6; k++) {\n  ctx.font = (HY[k] ? 'bold ' : '') + font(HY[k] ? 32 : 26); ctx.fillStyle = HY[k] || colors.text;\n  ctx.fillText(String(k), L - 10, Y(k) + 10);\n}\nctx.textAlign = 'left';\nif (local >= 1) { seg(3, 0, 3, 5, colors.c1, 3, [10, 7]); seg(0, 5, 3, 5, colors.c1, 3, [10, 7]); }\nif (local >= 2) { seg(6, 0, 6, 2, colors.c2, 3, [10, 7]); seg(0, 2, 6, 2, colors.c2, 3, [10, 7]); }\npath((x) => x, f, 1.6, 7, colors.curve, 5);\ndot(1.6, f(1.6), colors.ink, 9); dot(7, f(7), colors.ink, 9);\nif (local >= 1) {\n  dot(3, 5, colors.c1, 12);\n  tag('max value 5', X(0) + 12, Y(5) - 14, colors.c1);\n  tag('at x = 3', X(3) - 12, Y(0) - 14, colors.c1, 'right');\n}\nif (local >= 2) {\n  dot(6, 2, colors.c2, 12);\n  tag('min value 2', X(0) + 12, Y(2) + 40, colors.c2);\n  tag('at x = 6', X(6) - 12, Y(0) - 14, colors.c2, 'right');\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Local Maximum and Minimum}\n\\begin{columns}[6 6, parallel]\n\\begin{definition}{Local Extremes}\nThe number $f(c)$ is a\n\\begin{itemize}\n\\item \\textbf{local maximum} value of $f$ if $f(c)\\ge f(x)$ when $x$ is near $c$;\n\\item \\textbf{local minimum} value of $f$ if $f(c)\\le f(x)$ when $x$ is near $c$.\n\\end{itemize}\n\\end{definition}\n\\begin{uncover}<4->\n“Near $c$” means on some open interval containing $c$. A local maximum or minimum never occurs at an endpoint.\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=780x534, alt=\"The graph of a function on the interval from 1 to 13.5. Step by step, an open interval is shaded around x = 4, where f(4) = 5 is a local minimum; around x = 8, where f(8) = 7 is a local maximum; and around x = 12, where f(12) = 3 is both a local and an absolute minimum. Finally the left endpoint, where f(1) = 8, is marked as the absolute maximum.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.5, x1 = 14.5, yc = 4.4;                 // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst P = [[1, 8, -1.5], [4, 5, 0], [8, 7, 0], [12, 3, 0], [13.5, 5, 2]];   // [x, y, slope]\nfunction f(x) {                                       // the cubic Hermite curve through P\n  let i = 0;\n  while (i < P.length - 2 && x > P[i + 1][0]) i++;\n  const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n  return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n}\nfunction band(a, b, c, color) {                       // an open interval around c, and the level f(c)\n  poly([[a, y0], [b, y0], [b, y1], [a, y1]], colors.pale, 0.45);\n  seg(a, f(c), b, f(c), color, 3, [10, 7]);\n}\naxes(1, 2);\nif (local >= 1) band(2.6, 5.4, 4, colors.c2);\nif (local >= 2) band(6.6, 9.4, 8, colors.c1);\nif (local >= 3) band(10.6, 13.4, 12, colors.c2);\npath((x) => x, f, 1, 13.5, colors.curve, 5);\ndot(1, 8, colors.ink, 9); dot(13.5, 5, colors.ink, 9);\nif (local >= 1) { dot(4, 5, colors.c2, 12); tag('local min', X(4), Y(5) + 46, colors.c2, 'center'); }\nif (local >= 2) { dot(8, 7, colors.c1, 12); tag('local max', X(8), Y(7) - 24, colors.c1, 'center'); }\nif (local >= 3) { dot(12, 3, colors.c2, 12); tag('local and absolute min', X(12) + 100, Y(3) + 46, colors.c2, 'right'); }\nif (local >= 4) { dot(1, 8, colors.c1, 12); tag('absolute max', X(1) + 24, Y(8) - 18, colors.c1); }\n\\end{js}\n\\end{columns}\n\n\\slide{Example 1: Extremes on $[-1,4]$}\n\\begin{columns}[5 7, parallel]\n$f(x)=3x^4-16x^3+18x^2$ for $-1\\le x\\le4$.\n\\pause\n\\begin{itemize}[tight]\n\\item $f(-1)=37$ is the absolute maximum. It is not a local maximum, since $-1$ is an endpoint.\n\\pause\n\\item $f(1)=5$ is a local maximum.\n\\pause\n\\item $f(0)=0$ is a local minimum.\n\\pause\n\\item $f(3)=-27$ is a local and absolute minimum.\n\\pause\n\\item $f(4)=32$ is neither: $4$ is an endpoint, and $f(-1)$ is larger.\n\\end{itemize}\n\\columnbreak\n\\begin{js}[size=900x700, frames=6, alt=\"The graph of y = 3x^4 - 16x^3 + 18x^2 for x from -1 to 4, with the vertical scale compressed. Step by step: the point (-1, 37) is marked as the absolute maximum, with a dashed line at height 37 above the whole graph; the point (1, 5) as a local maximum, with an open interval around x = 1 shaded; the point (0, 0) as a local minimum; the point (3, -27) as the local and absolute minimum, with a dashed line at height -27 below the whole graph; and the endpoint (4, 32) as neither.\"]\nconst L = 70, R = 20, T = 20, B = 50;                 // margins in pixels\nconst xa = -1.3, xb = 4.3, ya = -35, yb = 45;         // the window; the vertical scale is compressed\nconst sx = (w - L - R) / (xb - xa), sy = (h - T - B) / (yb - ya);\nconst X = (x) => L + (x - xa) * sx, Y = (y) => h - B - (y - ya) * sy;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst f = (x) => 3 * Math.pow(x, 4) - 16 * Math.pow(x, 3) + 18 * x * x;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction band(a, b, c, color) {                       // an open interval around c, and the level f(c)\n  ctx.globalAlpha = 0.45; ctx.fillStyle = colors.pale; ctx.fillRect(X(a), T, X(b) - X(a), h - T - B); ctx.globalAlpha = 1;\n  seg(a, f(c), b, f(c), color, 3, [10, 7]);\n}\nconst ITEMS = [[-1, 37, colors.c1], [1, 5, colors.c1], [0, 0, colors.c2], [3, -27, colors.c2], [4, 32, colors.ink]];\nconst cur = Math.min(local, 5);                       // the bullet being discussed (0: none yet)\nfor (let k = -1; k <= 4; k++) seg(k, ya, k, yb, colors.grid, 1);\nfor (let k = -30; k <= 40; k += 10) seg(xa, k, xb, k, colors.grid, 1);\nif (cur === 2) band(0.5, 1.5, 1, colors.c1);\nif (cur === 3) band(-0.4, 0.4, 0, colors.c2);\nif (cur === 4) band(2.5, 3.5, 3, colors.c2);\nif (cur === 1 || cur === 5) seg(xa, 37, xb, 37, colors.c1, 3, [10, 7]);\nif (cur === 4) seg(xa, -27, xb, -27, colors.c2, 3, [10, 7]);\nseg(xa, 0, xb, 0, colors.axis, 2); seg(0, ya, 0, yb, colors.axis, 2);\nctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\nfor (let k = -1; k <= 4; k++) if (k) ctx.fillText(String(k).replace('-', '−'), X(k), h - B + 34);\nctx.textAlign = 'right';\nfor (let k = -30; k <= 40; k += 10) if (k) ctx.fillText(String(k).replace('-', '−'), L - 10, Y(k) + 9);\nctx.textAlign = 'left';\nctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();\nfor (let i = 0; i <= 400; i++) { const x = -1 + 5 * i / 400; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\nctx.stroke();\nfor (let k = 0; k < cur; k++) dot(ITEMS[k][0], ITEMS[k][1], ITEMS[k][2], k === cur - 1 ? 14 : 9);\nif (cur === 1) tag('absolute max  f(−1) = 37', X(-0.75), Y(37) - 14, colors.c1);\nif (cur === 2) tag('local max  f(1) = 5', X(1), Y(5) - 26, colors.c1, 'center');\nif (cur === 3) tag('local min  f(0) = 0', X(0), Y(0) + 48, colors.c2, 'center');\nif (cur === 4) tag('local and absolute min  f(3) = −27', X(3) + 120, Y(-27) + 52, colors.c2, 'right');\nif (cur === 5) tag('neither  f(4) = 32', X(4) - 26, Y(32) + 10, colors.ink, 'right');\n\\end{js}\n\\end{columns}\n\n\\slide{Examples: Which Extremes Exist?}\n\\begin{columns}[6 3 3, parallel]\n\\begin{plot}\nf = cos x\ndomain = -2pi:2pi\nrange = -1.5:1.5\nxticks = pi\nyticks = 1\npoints = -2pi, -pi, 0, pi, 2pi\na = 0\naspect = equal\nsize = 780\nalt = Graph of y = cos x for x from -2 pi to 2 pi, with its maximum points at -2 pi, 0, and 2 pi and its minimum points at -pi and pi marked.\n\\end{plot}\n$\\cos x$: maximum $1$ and minimum $-1$, each taken on infinitely many times.\n\\columnbreak\n\\begin{plot}\nf = x^2\ndomain = -2:2\nrange = -0.5:3.5\nxticks = 1\nyticks = 1\npoints = 0\na = 0\naspect = equal\nsize = 380\nalt = Graph of y = x squared for x from -2 to 2, with its lowest point (0, 0) marked.\n\\end{plot}\n$x^2$: minimum $0$ at $x=0$, and no maximum.\n\\columnbreak\n\\begin{plot}\nf = x^3\ndomain = -1.5:1.5\nrange = -1.5:1.5\nxticks = 1\nyticks = 1\naspect = equal\nsize = 380\nalt = Graph of y = x cubed for x from -1.5 to 1.5. It rises everywhere and has no highest or lowest point.\n\\end{plot}\n$x^3$: no maximum or minimum, not even local ones.\n\\end{columns}\n\n\\slide{The Extreme Value Theorem}\n\\begin{theorem}{Extreme Value Theorem}\nIf $f$ is continuous on a closed interval $[a,b]$, then $f$ attains an absolute maximum value $f(c)$ and an absolute minimum value $f(d)$ at some numbers $c$ and $d$ in $[a,b]$.\n\\end{theorem}\n\\begin{js}[size=1600x400, alt=\"Three continuous functions on closed intervals from a to b. In the first, the maximum is at an interior point c and the minimum at an interior point d. In the second, the maximum is attained twice, at c1 and c2, and the minimum at d. In the third, the minimum is at an interior point c and the maximum at the right endpoint, d = b.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst S = 92;                                         // pixels per unit in every panel\nfunction hermite(P) {                                 // the cubic Hermite curve through [x, y, slope] points\n  return (x) => {\n    let i = 0;\n    while (i < P.length - 2 && x > P[i + 1][0]) i++;\n    const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n  };\n}\nfunction panel(ox, P, marks) {                        // the graph over [0, 4], with marked extremes\n  const oy = 336, f = hermite(P), X = (x) => ox + (x + 0.3) * S, Y = (y) => oy - y * S;\n  const line = (ax, ay, bx, by, color, width, dash) => {\n    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n    ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n  };\n  const dot = (x, y, color, r) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, 2 * Math.PI); ctx.fill(); };\n  const label = (text, x, color) => { ctx.font = font(28); ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(text, X(x), oy + 40); };\n  line(-0.3, 0, 4.3, 0, colors.axis, 2);\n  marks.forEach((m) => line(m[0], 0, m[0], f(m[0]), m[1], 2, [6, 6]));\n  line(0, 0, 0, f(0), colors.muted, 2, [6, 6]); line(4, 0, 4, f(4), colors.muted, 2, [6, 6]);\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = 4 * i / 300; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  dot(0, f(0), colors.ink, 8); dot(4, f(4), colors.ink, 8);\n  marks.forEach((m) => dot(m[0], f(m[0]), m[1], 11));\n  const named = marks.map((m) => m[0]);\n  if (named.indexOf(0) < 0) label('a', 0, colors.ink);\n  if (named.indexOf(4) < 0) label('b', 4, colors.ink);\n  marks.forEach((m) => label(m[2], m[0], m[1]));\n  ctx.textAlign = 'left';\n}\npanel(40, [[0, 1.5, 1.5], [1, 3, 0], [3, 0.6, 0], [4, 1.5, 1]], [[1, colors.c1, 'c'], [3, colors.c2, 'd']]);\npanel(590, [[0, 1.4, 1.5], [1, 3, 0], [2, 0.6, 0], [3, 3, 0], [4, 1.6, -1]], [[1, colors.c1, 'c₁'], [2, colors.c2, 'd'], [3, colors.c1, 'c₂']]);\npanel(1140, [[0, 2, -1.5], [1.5, 0.6, 0], [4, 3.2, 1.6]], [[1.5, colors.c2, 'c'], [4, colors.c1, 'd = b']]);\n\\end{js}\n\n\\slide{Both Hypotheses Are Needed}\n\\begin{columns}[1 1, parallel]\n\\begin{js}[size=520x560, alt=\"A function f on the closed interval from 0 to 2. It rises along a line from (0, 1) toward (1, 3), with an open circle at (1, 3); then f(1) = 1, and it falls along a line to (2, 0). The values approach 3 but never reach it.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.4, x1 = 2.6, yc = 1.6;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 1);\nseg(x0, 3, x1, 3, colors.muted, 2, [10, 7]);\nseg(0, 1, 1, 3, colors.curve, 5); seg(1, 1, 2, 0, colors.curve, 5);\ndot(0, 1, colors.curve, 10); dot(1, 1, colors.curve, 10); dot(2, 0, colors.c2, 12);\nring(1, 3, colors.curve, 11);\ntag('y = 3', X(2.1), Y(3) - 16, colors.muted, 'center');\n\\end{js}\n$f$ on $[0,2]$ is not continuous. Its minimum is $f(2)=0$. Its values approach $3$ but never reach it: no maximum.\n\\columnbreak\n\\begin{js}[size=520x560, alt=\"The function g(x) = 2/x on the open interval from 0 to 2. It grows without bound as x approaches 0 and approaches 1 as x approaches 2, with an open circle at (2, 1).\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.4, x1 = 2.6, yc = 1.6;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\naxes(1, 1);\nseg(x0, 1, x1, 1, colors.muted, 2, [10, 7]);\nclip(); path((x) => x, (x) => 2 / x, 0.55, 2, colors.curve, 5); ctx.restore();\nring(2, 1, colors.curve, 11);\ntag('y = 1', X(0.4), Y(1) - 16, colors.muted, 'center');\n\\end{js}\n$g(x)=2/x$ on $(0,2)$ is continuous, but the interval is not closed. No maximum and no minimum.\n\\end{columns}\n\n\\slide{Proof of the Extreme Value Theorem}\n\\begin{columns}[7 5, parallel]\n\\textbf{Step 1: $f$ is bounded above.} Suppose instead that $f$ takes arbitrarily large values on $[a,b]$. Then it does so on at least one half of $[a,b]$. Keep that half, and repeat.\n\\begin{uncover}<3->\nThe nested intervals shrink to a single point $p$ in $[a,b]$. This is the “no gaps” property of the real numbers, the same property behind the Intermediate Value Theorem.\n\\end{uncover}\n\\begin{uncover}<5->\nSince $f$ is continuous at $p$, \\({f(x)<f(p)+1}\\) for all $x$ near $p$. But every small interval around $p$ contains arbitrarily large values of $f$. This is impossible.\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=640x600, frames=6, alt=\"The graph of a function on the interval from a = 0 to b = 4 that is not continuous at p = 2.6, where it grows without bound. Below the axis, the interval is halved step by step, always keeping the half where the function takes arbitrarily large values: from 0 to 4, then 2 to 4, 2 to 3, 2.5 to 3, 2.5 to 2.75, and 2.5 to 2.625. The intervals close in on p, the point where the pictured function fails to be continuous.\"]\nconst L = 16, R = 16, T = 16, B = 16;                 // margins in pixels\nconst x0 = -0.4, x1 = 4.4, yc = 0.7;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst p = 2.6, f = (x) => 1 / Math.abs(x - p);\nconst IV = [[0, 4], [2, 4], [2, 3], [2.5, 3], [2.5, 2.75], [2.5, 2.625]];\nconst n = Math.min(local, 5);                         // the number of halvings so far\ngrid(1);\npoly([[IV[n][0], 0], [IV[n][1], 0], [IV[n][1], y1], [IV[n][0], y1]], colors.pale, 0.55);\nseg(x0, 0, x1, 0, er unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();
