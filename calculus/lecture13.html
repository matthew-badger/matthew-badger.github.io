lAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst P = [[0, 1.2, 1.5], [1.5, 3, 0], [3.5, 1, 0], [5, 2.2, 1.2]];   // [x, y, slope]\nfunction f(x) {                                       // the cubic Hermite curve through P\n  let i = 0;\n  while (i < P.length - 2 && x > P[i + 1][0]) i++;\n  const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n  return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n}\ngrid(1);\nseg(x0, 0, x1, 0, colors.axis, 2);\nseg(1.5, 0, 1.5, 3, colors.muted, 2, [6, 6]); seg(3.5, 0, 3.5, 1, colors.muted, 2, [6, 6]);\npath((x) => x, f, 0, 5, colors.curve, 5);\nseg(0.6, 3, 2.4, 3, colors.tangent, 4, [12, 8]); seg(2.6, 1, 4.4, 1, colors.tangent, 4, [12, 8]);\ndot(1.5, 3, colors.c1, 11); dot(3.5, 1, colors.c2, 11);\ntag('c', X(1.5), Y(0) + 38, colors.c1, 'center'); tag('d', X(3.5), Y(0) + 38, colors.c2, 'center');\n\\end{js}\n\\end{columns}\n\n\\slide{Proof of Fermat's Theorem}\n\\begin{columns}[7 5, parallel]\nSuppose $f$ has a local maximum at $c$ and $f'(c)$ exists. For all $h$ near $0$, we have \\({f(c+h)\\le f(c)}\\), so\n$$f(c+h)-f(c)\\le0.$$\n\\pause\nFor $h>0$, divide by $h$:\n$$\\frac{f(c+h)-f(c)}{h}\\le0$$\n\\begin{uncover}<3->\nSince $f'(c)$ exists, it equals the limit from the right:\n$$f'(c)=\\lim_{h\\to0^+}\\frac{f(c+h)-f(c)}{h}\\le0$$\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=640x560, frames=4, alt=\"The graph of a function with a local maximum at x = c. A secant line joins (c, f(c)) to (c + h, f(c + h)) with h > 0. At each step h shrinks, from 1.5 to 0.1, and the secant's slope stays negative, approaching 0.\"]\nconst L = 16, R = 16, T = 16, B = 16;                 // margins in pixels\nconst x0 = -0.3, x1 = 4.4, yc = 1.7;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst c = 2, f = (x) => 3 - 0.6 * (x - c) * (x - c) + 0.1 * Math.pow(x - c, 3);\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst HS = [1.5, 0.8, 0.35, 0.1], target = HS[Math.min(local, 3)];\nif (state.d === undefined) state.d = target;\nconst start = state.d;\nfunction scene(d) {\n  const m = (f(c + d) - f(c)) / d;\n  ctx.clearRect(0, 0, w, h);\n  grid(1);\n  seg(x0, 0, x1, 0, colors.axis, 2);\n  clip();\n  path((x) => x, f, x0, x1, colors.curve, 5);\n  seg(x0, f(c), x1, f(c), colors.muted, 2, [8, 6]);\n  seg(x0, f(c) + m * (x0 - c), x1, f(c) + m * (x1 - c), colors.c2, 4);\n  ctx.restore();\n  seg(c, 0, c, f(c), colors.muted, 2, [6, 6]); seg(c + d, 0, c + d, f(c + d), colors.c2, 2, [6, 6]);\n  dot(c, f(c), colors.ink, 11); dot(c + d, f(c + d), colors.c2, 11);\n  tag('c', X(c), Y(0) + 36, colors.ink, 'center');\n  if (Math.abs(d) * s > 80) tag('c + h', X(c + d), Y(0) + 36, colors.c2, 'center');\n  tag('h = ' + dec(d, 2), X(2.6), Y(0.75), colors.c4);\n  tag('slope = ' + dec(m, 2), X(2.6), Y(0.35), colors.c2);\n}\nonFrame((t) => {\n  const u = Math.min(t / 0.8, 1), e = 1 - Math.pow(1 - u, 3), d = start * Math.pow(target / start, e);\n  state.d = d;\n  scene(d);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Proof of Fermat's Theorem, Continued}\n\\begin{columns}[7 5, parallel]\nFor $h<0$, dividing $f(c+h)-f(c)\\le0$ by $h$ reverses the inequality:\n$$\\frac{f(c+h)-f(c)}{h}\\ge0$$\n\\pause\nTaking the limit from the left,\n$$f'(c)=\\lim_{h\\to0^-}\\frac{f(c+h)-f(c)}{h}\\ge0.$$\n\\begin{uncover}<3->\nBoth $f'(c)\\le0$ and $f'(c)\\ge0$ hold. Therefore, $f'(c)=0$.\n\\medskip\nA local minimum at $c$ is handled the same way, with the inequalities reversed.\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=640x560, frames=4, alt=\"The graph of a function with a local maximum at x = c. A secant line joins (c, f(c)) to (c + h, f(c + h)) with h < 0. At each step h moves from -1.5 to -0.1, and the secant's slope stays positive, approaching 0.\"]\nconst L = 16, R = 16, T = 16, B = 16;                 // margins in pixels\nconst x0 = -0.3, x1 = 4.4, yc = 1.7;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst c = 2, f = (x) => 3 - 0.6 * (x - c) * (x - c) + 0.1 * Math.pow(x - c, 3);\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst HS = [-1.5, -0.8, -0.35, -0.1], target = HS[Math.min(local, 3)];\nif (state.d === undefined) state.d = target;\nconst start = state.d;\nfunction scene(d) {\n  const m = (f(c + d) - f(c)) / d;\n  ctx.clearRect(0, 0, w, h);\n  grid(1);\n  seg(x0, 0, x1, 0, colors.axis, 2);\n  clip();\n  path((x) => x, f, x0, x1, colors.curve, 5);\n  seg(x0, f(c), x1, f(c), colors.muted, 2, [8, 6]);\n  seg(x0, f(c) + m * (x0 - c), x1, f(c) + m * (x1 - c), colors.c2, 4);\n  ctx.restore();\n  seg(c, 0, c, f(c), colors.muted, 2, [6, 6]); seg(c + d, 0, c + d, f(c + d), colors.c2, 2, [6, 6]);\n  dot(c, f(c), colors.ink, 11); dot(c + d, f(c + d), colors.c2, 11);\n  tag('c', X(c), Y(0) + 36, colors.ink, 'center');\n  if (Math.abs(d) * s > 80) tag('c + h', X(c + d), Y(0) + 36, colors.c2, 'center');\n  tag('h = ' + dec(d, 2), X(2.6), Y(0.75), colors.c4);\n  tag('slope = ' + dec(m, 2), X(2.6), Y(0.35), colors.c2);\n}\nonFrame((t) => {\n  const u = Math.min(t / 0.8, 1), e = 1 - Math.pow(1 - u, 3), d = start * Math.pow(target / start, e);\n  state.d = d;\n  scene(d);\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Two Warnings}\n\\begin{columns}[1 1, parallel]\n$f(x)=x^3$ has $f'(0)=0$, but no maximum or minimum at $0$. The converse of Fermat's Theorem is false.\n\\begin{plot}\nf = x^3\ndomain = -1.5:1.5\nrange = -1.5:1.5\nxticks = 1\nyticks = 1\na = 0\ntangent = true\naspect = equal\nsize = 600\nalt = Graph of y = x cubed for x from -1.5 to 1.5, with its horizontal tangent line at the origin. The graph crosses the tangent line there.\n\\end{plot}\n\\columnbreak\n$f(x)=|x|$ has a minimum at $0$, but $f'(0)$ does not exist. An extreme value can occur where there is no tangent line.\n\\begin{plot}\nf = |x|\ndomain = -1.5:1.5\nrange = -1:2\nxticks = 1\nyticks = 1\npoints = 0\na = 0\naspect = equal\nsize = 600\nalt = Graph of y = absolute value of x for x from -1.5 to 1.5, with its corner at the origin marked.\n\\end{plot}\n\\end{columns}\n\n\\slide{Critical Numbers}\n\\begin{definition}{Critical Number}\nA \\textbf{critical number} of a function $f$ is a number $c$ in the domain of $f$ such that either \\({f'(c)=0}\\) or $f'(c)$ does not exist.\n\\end{definition}\n\\pause\nFermat's Theorem, in this language:\n\\begin{theorem}{Fermat's Theorem}\nIf $f$ has a local maximum or minimum at $c,$ then $c$ is a critical number of $f$.\n\\end{theorem}\n\\pause\nSo we look for extreme values among the critical numbers. Not every critical number gives one, as $x^3$ shows.\n\n\\slide{Example 2: A Polynomial}\n\\begin{columns}[7 5, parallel]\nFind the critical numbers of $f(x)=x^3-3x^2+1$.\n\\pause\nDifferentiate:\n\\begin{align}\nf'(x)&=3x^2-6x \\\\\n\\pause\n\\phantom{f'(x)}&=3x(x-2)\n\\end{align}\n\\pause\n$f'(x)$ is a polynomial, so it exists for every $x$.\n\\pause\n$f'(x)=0$ when $3x(x-2)=0$, that is, when $x=0$ or $x=2$.\n\\pause\nThe critical numbers are $0$ and $2$.\n\\columnbreak\n\\begin{js}[size=560x694, alt=\"The graph of y = x^3 - 3x^2 + 1 for x from -1.2 to 3.2. At the last step, the points (0, 1) and (2, -3) are marked, with the horizontal tangent line at each.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -1.2, x1 = 3.2, yc = -0.65;                // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst f = (x) => x * x * x - 3 * x * x + 1;\naxes(1, 1);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); ctx.restore();\nif (local >= 5) {\n  seg(-0.8, 1, 0.8, 1, colors.tangent, 4, [12, 8]); seg(1.2, -3, 2.8, -3, colors.tangent, 4, [12, 8]);\n  dot(0, 1, colors.c1, 12); dot(2, -3, colors.c1, 12);\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Example 3: A Fractional Power}\n\\begin{columns}[7 5, parallel]\nFind the critical numbers of $f(x)=x^{3/5}(4-x)$.\n\\pause\nBy the Product Rule,\n$$f'(x)=x^{3/5}(-1)+(4-x)\\cdot\\frac35x^{-2/5}.$$\n\\pause\nWrite both terms over $5x^{2/5}$, using \\({x^{3/5}=x\\cdot x^{-2/5}}\\):\n\\begin{align}\nf'(x)&=-\\frac{5x}{5x^{2/5}}+\\frac{3(4-x)}{5x^{2/5}} \\\\\n\\pause\n\\phantom{f'(x)}&=\\frac{-5x+12-3x}{5x^{2/5}}=\\frac{12-8x}{5x^{2/5}}\n\\end{align}\n\\columnbreak\n\\begin{plot}\nf = x^(3/5)(4-x)\ndomain = -0.6:4.6\nrange = -2.2:4\nxticks = 1\nyticks = 1\naspect = equal\nsize = 560\nalt = Graph of y = x^(3/5)(4 - x) for x from -0.6 to 4.6.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 3, Continued}\n\\begin{columns}[7 5, parallel]\n$$f'(x)=\\frac{12-8x}{5x^{2/5}}$$\n\\pause\nThe numerator is $0$ when \\({12-8x=0}\\), that is, when \\({x=1.5}\\). There \\({f'(1.5)=0}\\).\n\\pause\nThe denominator is $0$ when \\({x=0}\\). There $f'(0)$ does not exist, and $0$ is in the domain of $f$.\n\\pause\nThe critical numbers are $1.5$ and $0$.\n\\columnbreak\n\\begin{js}[size=560x644, alt=\"The graph of y = x^(3/5)(4 - x) for x from -0.6 to 4.6. Step by step, the point at x = 1.5 is marked with its horizontal tangent line, then the origin with its vertical tangent line.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.6, x1 = 4.6, yc = 0.9;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nconst f = (x) => Math.sign(x) * Math.pow(Math.abs(x), 0.6) * (4 - x);\naxes(1, 1);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); ctx.restore();\nif (local >= 1) { seg(0.5, f(1.5), 2.5, f(1.5), colors.tangent, 4, [12, 8]); dot(1.5, f(1.5), colors.c1, 12); }\nif (local >= 2) { seg(0, -1.9, 0, 1.9, colors.tangent, 5, [12, 8]); dot(0, 0, colors.c2, 12); }\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: A Trigonometric Function}\n\\begin{columns}[6 6, parallel]\nFind the critical numbers of $f(\\theta)=2\\cos\\theta+\\sin^2\\theta$.\n\\pause\n\\begin{align}\nf'(\\theta)&=-2\\sin\\theta+2\\sin\\theta\\cos\\theta \\\\\n\\pause\n\\phantom{f'(\\theta)}&=2\\sin\\theta\\,(\\cos\\theta-1)\n\\end{align}\n\\pause\n$f'(\\theta)$ exists for every $\\theta$, and \\({f'(\\theta)=0}\\) when \\({\\sin\\theta=0}\\) or \\({\\cos\\theta=1}\\).\n\\pause\n\\({\\sin\\theta=0}\\) when \\({\\theta=n\\pi}\\). \\({\\cos\\theta=1}\\) when \\({\\theta=2n\\pi}\\), which is already on that list.\n\\pause\nThe critical numbers are \\({\\theta=n\\pi}\\) for every integer $n$.\n\\columnbreak\n\\begin{only}<-4>\n\\begin{plot}\nf = 2cos x + sin(x)^2\ndomain = -2pi:2pi\nrange = -2.5:2.5\nxticks = pi\nyticks = 1\nxlabel = θ\naspect = equal\nsize = 780\nalt = Graph of y = 2 cos theta + sin squared theta for theta from -2 pi to 2 pi.\n\\end{plot}\n\\end{only}\n\\begin{only}<5->\n\\begin{plot}\nf = 2cos x + sin(x)^2\ndomain = -2pi:2pi\nrange = -2.5:2.5\nxticks = pi\nyticks = 1\nxlabel = θ\npoints = -2pi, -pi, 0, pi, 2pi\na = 0\naspect = equal\nsize = 780\nalt = Graph of y = 2 cos theta + sin squared theta for theta from -2 pi to 2 pi, with the points at the multiples of pi marked: the maximum value 2 at even multiples and the minimum value -2 at odd multiples.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\section{The Closed Interval Method}\n\n\\slide{The Closed Interval Method}\nLet $f$ be continuous on $[a,b]$. By the Extreme Value Theorem, $f$ has an absolute maximum and an absolute minimum. Each one occurs either at an endpoint, or inside $(a,b)$, where it is also a local extreme and hence at a critical number.\n\\pause\n\\begin{box}\n\\textbf{The Closed Interval Method.} To find the absolute maximum and minimum values of a continuous function $f$ on a closed interval $[a,b]$:\n\\begin{enumerate}\n\\item \\only<-1>{Find the values of $f$ at the critical numbers of $f$ in $(a,b)$.}\\only<2>{\\textcolor{c1}{\\textbf{Find the values of $f$ at the critical numbers of $f$ in $(a,b)$.}}}\\only<3->{Find the values of $f$ at the critical numbers of $f$ in $(a,b)$.}\n\\item \\only<-2>{Find the values of $f$ at the endpoints $a$ and $b$.}\\only<3>{\\textcolor{c1}{\\textbf{Find the values of $f$ at the endpoints $a$ and $b$.}}}\\only<4->{Find the values of $f$ at the endpoints $a$ and $b$.}\n\\item \\only<-3>{The largest of these values is the absolute maximum; the smallest is the absolute minimum.}\\only<4>{\\textcolor{c1}{\\textbf{The largest of these values is the absolute maximum; the smallest is the absolute minimum.}}}\n\\end{enumerate}\n\\end{box}\n\n\\slide{Example 5: A Cubic on $[-0.5,4]$}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of $f(x)=x^3-3x^2+1$ on $[-0.5,4]$.\n\\pause\nThe critical numbers are $0$ and $2$ (Example 2). Both lie in $(-0.5,4)$.\n\\pause\nAt the critical numbers:\n$$f(0)=1,\\qquad f(2)=8-12+1=-3$$\n\\pause\nAt the endpoints:\n\\begin{align}\nf(-0.5)&=-0.125-0.75+1=0.125 \\\\\nf(4)&=64-48+1=17\n\\end{align}\n\\pause\nThe absolute maximum is \\({f(4)=17}\\), at an endpoint. The absolute minimum is \\({f(2)=-3}\\), at a critical number.\n\\columnbreak\n\\begin{only}<-3>\n\\begin{plot}\nf = x^3-3x^2+1\ndomain = -0.5:4\nrange = -5:20\nxticks = 1\nyticks = 5\nsize = 520x640\nalt = Graph of y = x^3 - 3x^2 + 1 for x from -0.5 to 4. The vertical scale is compressed.\n\\end{plot}\n\\end{only}\n\\begin{only}<4->\n\\begin{plot}\nf = x^3-3x^2+1\ndomain = -0.5:4\nrange = -5:20\nxticks = 1\nyticks = 5\npoints = -0.5, 0, 2, 4\na = 4\nsize = 520x640\nalt = Graph of y = x^3 - 3x^2 + 1 for x from -0.5 to 4, with the points (-0.5, 0.125), (0, 1), (2, -3), and (4, 17) marked. The vertical scale is compressed.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 6: A Cubic on $[-2,3]$}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of $f(x)=2x^3-3x^2-12x+1$ on $[-2,3]$.\n\\pause\n\\begin{align}\nf'(x)&=6x^2-6x-12 \\\\\n&=6(x^2-x-2)=6(x-2)(x+1)\n\\end{align}\n\\pause\nThe critical numbers are $-1$ and $2$, both in $(-2,3)$.\n\\columnbreak\n\\begin{plot}\nf = 2x^3-3x^2-12x+1\ndomain = -2:3\nrange = -22:12\nxticks = 1\nyticks = 5\nsize = 520x640\nalt = Graph of y = 2x^3 - 3x^2 - 12x + 1 for x from -2 to 3. The vertical scale is compressed.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 6, Continued}\n\\begin{columns}[8 4, parallel]\nAt the critical numbers:\n\\begin{align}\nf(-1)&=-2-3+12+1=8 \\\\\nf(2)&=16-12-24+1=-19\n\\end{align}\n\\pause\nAt the endpoints:\n\\begin{align}\nf(-2)&=-16-12+24+1=-3 \\\\\nf(3)&=54-27-36+1=-8\n\\end{align}\n\\pause\nThe absolute maximum is \\({f(-1)=8}\\). The absolute minimum is \\({f(2)=-19}\\).\n\\columnbreak\n\\begin{only}<-1>\n\\begin{plot}\nf = 2x^3-3x^2-12x+1\ndomain = -2:3\nrange = -22:12\nxticks = 1\nyticks = 5\nsize = 520x640\nalt = Graph of y = 2x^3 - 3x^2 - 12x + 1 for x from -2 to 3. The vertical scale is compressed.\n\\end{plot}\n\\end{only}\n\\begin{only}<2->\n\\begin{plot}\nf = 2x^3-3x^2-12x+1\ndomain = -2:3\nrange = -22:12\nxticks = 1\nyticks = 5\npoints = -2, -1, 2, 3\na = -1\nsize = 520x640\nalt = Graph of y = 2x^3 - 3x^2 - 12x + 1 for x from -2 to 3, with the points (-2, -3), (-1, 8), (2, -19), and (3, -8) marked. The vertical scale is compressed.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 7: A Cube Root}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of $f(t)=t-\\sqrt[3]{t}$ on $[-1,4]$.\n\\pause\n\\begin{align}\nf'(t)&=1-\\frac13t^{-2/3} \\\\\n\\pause\n\\phantom{f'(t)}&=1-\\frac{1}{3t^{2/3}}\n\\end{align}\n\\pause\n$f'(0)$ does not exist.\n\\pause\n$f'(t)=0$ when \\({3t^{2/3}=1}\\). Cube both sides: \\({27t^2=1}\\), so\n$$t=\\pm\\frac{1}{\\sqrt{27}}=\\pm\\frac{\\sqrt3}{9}=\\pm0.192\\ldots$$\n\\pause\nThe critical numbers are $0$ and $\\pm\\sqrt3/9$, all in $(-1,4)$.\n\\columnbreak\n\\begin{only}<-4>\n\\begin{plot}\nf = x - x^(1/3)\ndomain = -1:4\nrange = -1:3\nxticks = 1\nyticks = 1\nxlabel = t\naspect = equal\nsize = 520\nalt = Graph of y = t minus the cube root of t for t from -1 to 4.\n\\end{plot}\n\\end{only}\n\\begin{only}<5->\n\\begin{plot}\nf = x - x^(1/3)\ndomain = -1:4\nrange = -1:3\nxticks = 1\nyticks = 1\nxlabel = t\npoints = -sqrt(3)/9, 0, sqrt(3)/9\na = 0\naspect = equal\nsize = 520\nalt = Graph of y = t minus the cube root of t for t from -1 to 4, with the critical numbers 0 and plus or minus the square root of 3 over 9 marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 7, Continued}\n\\begin{columns}[8 4, parallel]\nAt \\({t=\\sqrt3/9=3^{-3/2}}\\), \\({\\sqrt[3]{t}=3^{-1/2}=\\sqrt3/3}\\), so\n$$f\\!\\left(\\frac{\\sqrt3}{9}\\right)=\\frac{\\sqrt3}{9}-\\frac{3\\sqrt3}{9}=-\\frac{2\\sqrt3}{9}.$$\n\\pause\nSince \\({f(-t)=-f(t)}\\), \\({f(-\\sqrt3/9)=2\\sqrt3/9}\\). At the endpoints, \\({f(-1)=-1-(-1)=0}\\) and \\({f(4)=4-\\sqrt[3]{4}}\\).\n\\pause\n$$\\def\\arraystretch{1.25}\\begin{array}{c|ccccc}\nt & -1 & -\\frac{\\sqrt3}{9} & 0 & \\frac{\\sqrt3}{9} & 4 \\\\ \\hline\nf(t) & 0 & \\frac{2\\sqrt3}{9} & 0 & -\\frac{2\\sqrt3}{9} & 4-\\sqrt[3]{4}\n\\end{array}$$\n\\pause\nThe absolute maximum and minimum values are\n$$f(4)=4-\\sqrt[3]{4}=2.412\\ldots\\qquad\\text{and}\\qquad f\\!\\left(\\frac{\\sqrt3}{9}\\right)=-\\frac{2\\sqrt3}{9}=-0.384\\ldots$$\n\\columnbreak\n\\begin{plot}\nf = x - x^(1/3)\ndomain = -0.6:0.6\nrange = -0.6:0.6\nxticks = 0.3\nyticks = 0.3\nxlabel = t\npoints = -sqrt(3)/9, 0, sqrt(3)/9\na = 0\naspect = equal\nsize = 520\nalt = Close-up of y = t minus the cube root of t for t from -0.6 to 0.6. It has a local maximum at t = -sqrt(3)/9, a vertical tangent at t = 0, and a local minimum at t = sqrt(3)/9.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 8: Estimate, Then Compute}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of $f(x)=x-2\\sin x$ on $[0,2\\pi]$.\n\\pause\nFrom the graph: a maximum of about $7$ near \\({x=5.2}\\), and a minimum of about $-0.7$ near \\({x=1}\\). Calculus gives the exact values.\n\\pause\n$$f'(x)=1-2\\cos x$$\n\\pause\n$f'(x)=0$ when\n$$\\cos x=\\frac12.$$\n\\pause\nIn $(0,2\\pi)$, the critical numbers are $\\pi/3$ and $5\\pi/3$.\n\\columnbreak\n\\begin{plot}\nf = x - 2sin x\ndomain = 0:2pi\nrange = -1:7.5\nxticks = pi/2\nyticks = 1\naspect = equal\nsize = 520\nalt = Graph of y = x - 2 sin x for x from 0 to 2 pi. It dips to a minimum near x = 1 and rises to a maximum near x = 5.2.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 8, Continued}\n\\begin{columns}[8 4, parallel]\n\\begin{align}\nf\\!\\left(\\frac\\pi3\\right)&=\\frac\\pi3-2\\sin\\frac\\pi3 \\\\\n&=\\frac\\pi3-\\sqrt3=-0.684\\ldots\n\\end{align}\n\\pause\n\\begin{align}\nf\\!\\left(\\frac{5\\pi}3\\right)&=\\frac{5\\pi}3-2\\sin\\frac{5\\pi}3 \\\\\n&=\\frac{5\\pi}3+\\sqrt3=6.968\\ldots\n\\end{align}\n\\pause\nAt the endpoints, \\({f(0)=0}\\) and \\({f(2\\pi)=2\\pi=6.283\\ldots}\\)\n\\pause\nThe absolute minimum is \\({f(\\pi/3)=\\pi/3-\\sqrt3}\\). The absolute maximum is \\({f(5\\pi/3)=5\\pi/3+\\sqrt3}\\). The estimates from the graph check our work.\n\\columnbreak\n\\begin{only}<-2>\n\\begin{plot}\nf = x - 2sin x\ndomain = 0:2pi\nrange = -1:7.5\nxticks = pi/2\nyticks = 1\naspect = equal\nsize = 520\nalt = Graph of y = x - 2 sin x for x from 0 to 2 pi.\n\\end{plot}\n\\end{only}\n\\begin{only}<3->\n\\begin{plot}\nf = x - 2sin x\ndomain = 0:2pi\nrange = -1:7.5\nxticks = pi/2\nyticks = 1\npoints = 0, pi/3, 5pi/3, 2pi\na = 5pi/3\naspect = equal\nsize = 520\nalt = Graph of y = x - 2 sin x for x from 0 to 2 pi, with the endpoints and the points at pi/3 and 5 pi/3 marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\section{Applications}\n\n\\slide{Example 9: The Space Shuttle}\nThe space shuttle \\emph{Discovery} deployed the Hubble Space Telescope on April 24, 1990. From liftoff until its boosters were jettisoned at $t=126$ s, its velocity in ft/s is modeled by\n$$v(t)=0.001302t^3-0.09029t^2+23.61t-3.083.$$\nFind the absolute maximum and minimum values of the acceleration on $[0,126]$.\n\\pause\nThe acceleration is\n$$a(t)=v'(t)=0.003906t^2-0.18058t+23.61.$$\n\\begin{plot}\nf = 0.001302x^3-0.09029x^2+23.61x-3.083\ndomain = 0:126\nrange = 0:4500\nxticks = 20\nyticks = 1000\nxlabel = t\nylabel = v\nsize = 1500x300\nalt = Graph of the shuttle's velocity v(t), in feet per second, for t from 0 to 126 seconds. It rises from 0 to about 4140.\n\\end{plot}\n\n\\slide{Example 9, Continued}\n\\begin{columns}[7 5, parallel]\n$$a'(t)=0.007812t-0.18058$$\n\\pause\n$a'(t)=0$ when\n$$t=\\frac{0.18058}{0.007812}=23.115\\ldots$$\n\\pause\n$$\\def\\arraystretch{1.3}\\begin{array}{c|ccc}\nt & 0 & 23.115\\ldots & 126 \\\\ \\hline\na(t) & 23.61 & 21.522\\ldots & 62.868576\n\\end{array}$$\n\\pause\nThe maximum acceleration is $62.868576$ ft/s$^2$, when the boosters are jettisoned. The minimum is $21.522\\ldots$ ft/s$^2$, at \\({t=23.115\\ldots}\\) s.\n\\columnbreak\n\\begin{only}<-2>\n\\begin{plot}\nf = 0.003906x^2-0.18058x+23.61\ndomain = 0:126\nrange = 0:70\nxticks = 20\nyticks = 10\nxlabel = t\nylabel = a\nsize = 640x560\nalt = Graph of the shuttle's acceleration a(t), in feet per second squared, for t from 0 to 126 seconds.\n\\end{plot}\n\\end{only}\n\\begin{only}<3->\n\\begin{plot}\nf = 0.003906x^2-0.18058x+23.61\ndomain = 0:126\nrange = 0:70\nxticks = 20\nyticks = 10\nxlabel = t\nylabel = a\npoints = 0, 0.18058/0.007812, 126\na = 126\nsize = 640x560\nalt = Graph of the shuttle's acceleration a(t), in feet per second squared, for t from 0 to 126 seconds, with the minimum near t = 23.1 and the maximum at t = 126 marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 10: An Antibiotic}\n\\begin{columns}[8 4, parallel]\nAfter an antibiotic tablet is taken, its concentration in the bloodstream after $t$ hours is\n$$C(t)=8\\left(e^{-0.4t}-e^{-0.6t}\\right)\\ \\mu\\text{g/mL}.$$\nFind the maximum concentration during the first $12$ hours.\n\\pause\n$$C'(t)=8\\left(-0.4e^{-0.4t}+0.6e^{-0.6t}\\right)$$\n\\pause\n$C'(t)=0$ when \\({0.6e^{-0.6t}=0.4e^{-0.4t}}\\). Divide both sides by $0.6e^{-0.4t}$:\n$$e^{-0.2t}=\\frac{0.4}{0.6}=\\frac23$$\n\\pause\n$$t=-5\\ln\\frac23=5\\ln1.5=2.027\\ldots\\ \\text{h}$$\n\\columnbreak\n\\begin{plot}\nf = 8(e^(-0.4x)-e^(-0.6x))\ndomain = 0:12\nrange = 0:1.5\nxticks = 2\nyticks = 0.5\nxlabel = t\nylabel = C\nsize = 520x520\nalt = Graph of the concentration C(t), in micrograms per milliliter, for t from 0 to 12 hours. It rises quickly to a peak near t = 2 and then decays.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 10, Continued}\n\\begin{columns}[8 4, parallel]\nAt \\({t=5\\ln1.5}\\), \\({e^{-0.2t}=2/3}\\), so\n$$e^{-0.4t}=\\left(e^{-0.2t}\\right)^2=\\frac49,\\qquad e^{-0.6t}=\\left(e^{-0.2t}\\right)^3=\\frac{8}{27}.$$\n\\pause\n\\begin{align}\nC(5\\ln1.5)&=8\\left(\\frac49-\\frac{8}{27}\\right)=8\\cdot\\frac{4}{27} \\\\\n&=\\frac{32}{27}=1.185\\ldots\n\\end{align}\n\\pause\nAt the endpoints, \\({C(0)=0}\\) and \\({C(12)=8(e^{-4.8}-e^{-7.2})=0.059\\ldots}\\)\n\\pause\nThe maximum concentration is \\({32/27=1.185\\ldots}\\) $\\mu$g/mL, about $2$ hours after the tablet is taken.\n\\columnbreak\n\\begin{only}<-2>\n\\begin{plot}\nf = 8(e^(-0.4x)-e^(-0.6x))\ndomain = 0:12\nrange = 0:1.5\nxticks = 2\nyticks = 0.5\nxlabel = t\nylabel = C\nsize = 520x520\nalt = Graph of the concentration C(t) for t from 0 to 12 hours.\n\\end{plot}\n\\end{only}\n\\begin{only}<3->\n\\begin{plot}\nf = 8(e^(-0.4x)-e^(-0.6x))\ndomain = 0:12\nrange = 0:1.5\nxticks = 2\nyticks = 0.5\nxlabel = t\nylabel = C\npoints = 0, 5ln(1.5), 12\na = 5ln(1.5)\nsize = 520x520\nalt = Graph of the concentration C(t) for t from 0 to 12 hours, with its maximum 32/27 at t = 5 ln 1.5 and the endpoints marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 11: The Rainbow Angle}\nSunlight entering a raindrop at angle $\\alpha$ bends, reflects once inside, and bends again as it leaves. It turns through $D(\\alpha)=180^\\circ+2\\alpha-4\\beta$, where \\({\\sin\\alpha=(4/3)\\sin\\beta}\\).\n\\begin{js}[size=1600x440, frames=4, alt=\"Left: a ray of sunlight enters a round raindrop, reflects once off the back, and leaves. Right: the graph of the deviation D(alpha) for alpha from 0 to 90 degrees, with a dot at the current angle. The angle moves through 20, 40, and 80 degrees, then settles at 59.39 degrees, where D has its minimum value, 137.97 degrees.\"]\nconst k = 4 / 3, DEG = Math.PI / 180;\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst beta = (a) => Math.asin(Math.sin(a * DEG) / k) / DEG;\nconst D = (a) => 180 + 2 * a - 4 * beta(a);\nconst AMIN = Math.acos(Math.sqrt(7 / 27)) / DEG;      // where D is smallest\nconst AL = [20, 40, 80, AMIN], target = AL[Math.min(local, 3)];\nif (state.a === undefined) state.a = target;\nconst start = state.a;\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction line(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction text(t, px, py, color, align) {\n  ctx.font = font(28); ctx.textAlign = align || 'left'; ctx.fillStyle = color; ctx.fillText(t, px, py); ctx.textAlign = 'left';\n}\nfunction drop(a) {                                    // the ray through the drop, in pixels\n  const cx = 300, cy = 190, r = 140, b = beta(a), d = D(a);\n  const P = (th) => [cx + r * Math.cos(th * DEG), cy - r * Math.sin(th * DEG)];\n  const A = P(180 - a), B = P(2 * b - a), C = P(4 * b - a - 180);\n  ctx.globalAlpha = 0.5; ctx.fillStyle = colors.pale; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1;\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();\n  line(10, A[1], A[0], A[1], colors.c2, 5);\n  line(A[0], A[1], B[0], B[1], colors.c2, 4); line(B[0], B[1], C[0], C[1], colors.c2, 4);\n  line(C[0], C[1], C[0] + 110 * Math.cos(d * DEG), C[1] + 110 * Math.sin(d * DEG), colors.c2, 5);\n  text('sunlight', 10, A[1] - 14, colors.c2);\n}\nfunction graph(a) {                                   // D against alpha, 7 pixels per degree on both axes\n  const ox = 770, oy = 392, X = (t) => ox + 7 * t, Y = (v) => oy - 7 * (v - 132);\n  ctx.font = font(26); ctx.fillStyle = colors.text;\n  for (let t = 0; t <= 90; t += 15) { line(X(t), Y(132), X(t), Y(184), colors.grid, 1); ctx.textAlign = 'center'; ctx.fillText(t + '°', X(t), oy + 34); }\n  for (let v = 140; v <= 180; v += 10) { line(X(0), Y(v), X(90), Y(v), colors.grid, 1); ctx.textAlign = 'right'; ctx.fillText(v + '°', X(0) - 10, Y(v) + 9); }\n  ctx.textAlign = 'left';\n  line(X(0), Y(132), X(90), Y(132), colors.axis, 2); line(X(0), Y(132), X(0), Y(184), colors.axis, 2);\n  text('α', X(90) + 12, oy + 8, colors.text); text('D(α)', X(0) + 12, Y(184) + 26, colors.text);\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const t = 90 * i / 300; if (i) ctx.lineTo(X(t), Y(D(t))); else ctx.moveTo(X(t), Y(D(t))); }\n  ctx.stroke();\n  line(X(a), Y(132), X(a), Y(D(a)), colors.c2, 2, [6, 6]);\n  ctx.fillStyle = colors.c2; ctx.beginPath(); ctx.arc(X(a), Y(D(a)), 11, 0, 2 * Math.PI); ctx.fill();\n}\nfunction scene(a) {\n  ctx.clearRect(0, 0, w, h);\n  drop(a); graph(a);\n  text('α = ' + dec(a, 2) + '°', 460, 70, colors.c2);\n  text('D = ' + dec(D(a), 2) + '°', 460, 112, colors.c2);\n}\nonFrame((t) => {\n  const u = Math.min(t / 0.9, 1), e = 1 - Math.pow(1 - u, 3), a = start + (target - start) * e;\n  state.a = a;\n  scene(a);\n});\n\\end{js}\n\\begin{uncover}<3->\n$D$ has its minimum, $137.970\\ldots^\\circ$, at \\({\\alpha=59.391\\ldots^\\circ}\\). Many rays leave near this angle, so the bright bow appears \\({180^\\circ-137.970\\ldots^\\circ=42.029\\ldots^\\circ}\\) from the point opposite the sun.\n\\end{uncover}\n\n\\slide{Example 11, Continued}\n\\begin{columns}[9 3, parallel]\nIn radians, \\({D(\\alpha)=\\pi+2\\alpha-4\\beta}\\), where \\({\\sin\\alpha=k\\sin\\beta}\\) and \\({k=4/3}\\). Differentiate implicitly:\n$$\\cos\\alpha=k\\cos\\beta\\,\\frac{d\\beta}{d\\alpha}$$\n\\pause\n\\({D'(\\alpha)=2-4\\,d\\beta/d\\alpha=0}\\) when \\({d\\beta/d\\alpha=1/2}\\), that is, when \\({2\\cos\\alpha=k\\cos\\beta}\\).\n\\pause\nSquare both sides, and use \\({k^2\\cos^2\\beta=k^2-k^2\\sin^2\\beta=k^2-\\sin^2\\alpha}\\):\n$$4\\cos^2\\alpha=k^2-1+\\cos^2\\alpha$$\n\\pause\n$$\\cos^2\\alpha=\\frac{k^2-1}{3}=\\frac{7}{27},\\qquad\\alpha=59.391\\ldots^\\circ$$\n\\pause\nThere \\({D=137.970\\ldots^\\circ}\\), smaller than \\({D(0^\\circ)=180^\\circ}\\) and \\({D(90^\\circ)=165.638\\ldots^\\circ}\\)\n\\columnbreak\n\\begin{only}<-3>\n\\begin{plot}\nf = 180+2x-4(180/pi)arcsin(0.75sin(pi x/180))\ndomain = 0:90\nrange = 130:185\nxticks = 30\nyticks = 20\nxlabel = α\nylabel = D\naspect = equal\nsize = 400\nalt = Graph of the deviation D in degrees against the angle alpha from 0 to 90 degrees.\n\\end{plot}\n\\end{only}\n\\begin{only}<4->\n\\begin{plot}\nf = 180+2x-4(180/pi)arcsin(0.75sin(pi x/180))\ndomain = 0:90\nrange = 130:185\nxticks = 30\nyticks = 20\nxlabel = α\nylabel = D\npoints = 0, (180/pi)arccos(sqrt(7/27)), 90\na = (180/pi)arccos(sqrt(7/27))\naspect = equal\nsize = 400\nalt = Graph of the deviation D in degrees against the angle alpha from 0 to 90 degrees, with the endpoints and the minimum at alpha = 59.39 degrees marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\section{More Examples}\n\n\\slide{Example 12: $x+1/x$ on $[0.2,4]$}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of \\({f(x)=x+1/x}\\) on $[0.2,4]$.\n\\pause\n$$f'(x)=1-\\frac{1}{x^2}$$\n\\pause\n$f'(x)=0$ when \\({x^2=1}\\), that is, \\({x=\\pm1}\\). Only $1$ lies in $(0.2,4)$. Also $f'(0)$ does not exist, but $0$ is not in $[0.2,4]$.\n\\pause\n\\begin{align}\nf(1)&=1+1=2 \\\\\nf(0.2)&=0.2+5=5.2 \\\\\nf(4)&=4+0.25=4.25\n\\end{align}\n\\pause\nThe absolute maximum is \\({f(0.2)=5.2}\\). The absolute minimum is \\({f(1)=2}\\).\n\\columnbreak\n\\begin{only}<-3>\n\\begin{plot}\nf = x + 1/x + 0sqrt(x-0.2) + 0sqrt(4-x)\ndomain = 0:4.2\nrange = 0:5.6\nxticks = 1\nyticks = 1\naspect = equal\nsize = 520\nalt = Graph of y = x + 1/x for x from 0.2 to 4.\n\\end{plot}\n\\end{only}\n\\begin{only}<4->\n\\begin{plot}\nf = x + 1/x + 0sqrt(x-0.2) + 0sqrt(4-x)\ndomain = 0:4.2\nrange = 0:5.6\nxticks = 1\nyticks = 1\npoints = 0.2, 1, 4\na = 1\naspect = equal\nsize = 520\nalt = Graph of y = x + 1/x for x from 0.2 to 4, with the points (0.2, 5.2), (1, 2), and (4, 4.25) marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 13: A Trigonometric Function on $[0,\\pi/2]$}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of \\({f(t)=2\\cos t+\\sin2t}\\) on $[0,\\pi/2]$.\n\\pause\n\\begin{align}\nf'(t)&=-2\\sin t+2\\cos2t \\\\\n\\pause\n\\phantom{f'(t)}&=-2\\sin t+2(1-2\\sin^2t) \\\\\n\\pause\n\\phantom{f'(t)}&=-2(2\\sin^2t+\\sin t-1)=-2(2\\sin t-1)(\\sin t+1)\n\\end{align}\n\\pause\n$f'(t)=0$ when \\({\\sin t=1/2}\\) or \\({\\sin t=-1}\\). In $(0,\\pi/2)$, only \\({t=\\pi/6}\\).\n\\columnbreak\n\\begin{plot}\nf = 2cos x + sin 2x\ndomain = 0:pi/2\nrange = -0.4:2.9\nxticks = pi/6\nyticks = 1\nxlabel = t\naspect = equal\nsize = 520\nalt = Graph of y = 2 cos t + sin 2t for t from 0 to pi/2.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 13, Continued}\n\\begin{columns}[8 4, parallel]\nAt the critical number:\n\\begin{align}\nf\\!\\left(\\frac\\pi6\\right)&=2\\cos\\frac\\pi6+\\sin\\frac\\pi3=2\\cdot\\frac{\\sqrt3}{2}+\\frac{\\sqrt3}{2} \\\\\n&=\\frac{3\\sqrt3}{2}=2.598\\ldots\n\\end{align}\n\\pause\nAt the endpoints:\n\\begin{align}\nf(0)&=2\\cos0+\\sin0=2 \\\\\nf\\!\\left(\\frac\\pi2\\right)&=2\\cos\\frac\\pi2+\\sin\\pi=0\n\\end{align}\n\\pause\nThe absolute maximum is \\({f(\\pi/6)=3\\sqrt3/2}\\). The absolute minimum is \\({f(\\pi/2)=0}\\).\n\\columnbreak\n\\begin{only}<-1>\n\\begin{plot}\nf = 2cos x + sin 2x\ndomain = 0:pi/2\nrange = -0.4:2.9\nxticks = pi/6\nyticks = 1\nxlabel = t\naspect = equal\nsize = 520\nalt = Graph of y = 2 cos t + sin 2t for t from 0 to pi/2.\n\\end{plot}\n\\end{only}\n\\begin{only}<2->\n\\begin{plot}\nf = 2cos x + sin 2x\ndomain = 0:pi/2\nrange = -0.4:2.9\nxticks = pi/6\nyticks = 1\nxlabel = t\npoints = 0, pi/6, pi/2\na = pi/6\naspect = equal\nsize = 520\nalt = Graph of y = 2 cos t + sin 2t for t from 0 to pi/2, with the maximum at t = pi/6 and the endpoints marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 14: A Logarithm on $[0.5,4]$}\n\\begin{columns}[8 4, parallel]\nFind the absolute maximum and minimum values of \\({f(x)=x^{-2}\\ln x}\\) on $[0.5,4]$.\n\\pause\nBy the Product Rule,\n\\begin{align}\nf'(x)&=-2x^{-3}\\ln x+x^{-2}\\cdot\\frac1x \\\\\n\\pause\n\\phantom{f'(x)}&=x^{-3}(1-2\\ln x)\n\\end{align}\n\\pause\n$f'(x)$ exists on $(0.5,4)$, and \\({x^{-3}\\ne0}\\). So \\({f'(x)=0}\\) when \\({\\ln x=1/2}\\), that is, when\n$$x=\\sqrt e=1.648\\ldots,$$\nwhich lies in $(0.5,4)$.\n\\columnbreak\n\\begin{plot}\nf = ln(x)/x^2 + 0sqrt(x-0.5) + 0sqrt(4-x)\ndomain = 0.3:4.2\nrange = -3:0.6\nxticks = 1\nyticks = 1\naspect = equal\nsize = 520\nalt = Graph of y = ln(x)/x^2 for x from 0.5 to 4.\n\\end{plot}\n\\end{columns}\n\n\\slide{Example 14, Continued}\n\\begin{columns}[8 4, parallel]\nAt the critical number:\n$$f(\\sqrt e)=\\frac1e\\cdot\\frac12=\\frac{1}{2e}=0.183\\ldots$$\n\\pause\nAt the endpoints:\n\\begin{align}\nf(0.5)&=4\\ln0.5=-4\\ln2=-2.772\\ldots \\\\\nf(4)&=\\frac{\\ln4}{16}=\\frac{\\ln2}{8}=0.086\\ldots\n\\end{align}\n\\pause\nThe absolute maximum is \\({f(\\sqrt e)=1/(2e)}\\). The absolute minimum is \\({f(0.5)=-4\\ln2}\\).\n\\columnbreak\n\\begin{only}<-1>\n\\begin{plot}\nf = ln(x)/x^2 + 0sqrt(x-0.5) + 0sqrt(4-x)\ndomain = 0.3:4.2\nrange = -3:0.6\nxticks = 1\nyticks = 1\naspect = equal\nsize = 520\nalt = Graph of y = ln(x)/x^2 for x from 0.5 to 4.\n\\end{plot}\n\\end{only}\n\\begin{only}<2->\n\\begin{plot}\nf = ln(x)/x^2 + 0sqrt(x-0.5) + 0sqrt(4-x)\ndomain = 0.3:4.2\nrange = -3:0.6\nxticks = 1\nyticks = 1\npoints = 0.5, sqrt(e), 4\na = sqrt(e)\naspect = equal\nsize = 520\nalt = Graph of y = ln(x)/x^2 for x from 0.5 to 4, with the endpoints and the maximum at x = square root of e marked.\n\\end{plot}\n\\end{only}\n\\end{columns}\n\n\\slide{Example 15: Coughing}\n\\begin{columns}[8 4, parallel]\nDuring a cough, the windpipe contracts. A model for the speed of the air is\n$$v(r)=k(r_0-r)r^2,\\qquad\\frac{r_0}{2}\\le r\\le r_0,$$\nwhere $r$ is the radius of the windpipe, $r_0$ is its normal radius, and \\({k>0}\\) is a constant. Which radius gives the fastest air?\n\\pause\n$$v'(r)=k\\left(2r_0r-3r^2\\right)=kr(2r_0-3r)$$\n\\pause\n$v'(r)=0$ when \\({r=0}\\) or \\({r=2r_0/3}\\). Only $2r_0/3$ lies in $(r_0/2,r_0)$.\n\\columnbreak\n\\begin{plot}\nf = (1-x)x^2 + 0sqrt(x-0.5) + 0sqrt(1-x)\ndomain = 0:1.1\nrange = 0:0.2\nxticks = 0.2\nyticks = 0.05\nxlabel = r\nylabel = v\nsize = 520x460\nalt = Graph of v(r) = (1 - r) r^2 for r from 0.5 to 1, the case r0 = 1 and k = 1.\n\\end{plot}\nThe graph shows the case \\({r_0=1}\\), \\({k=1}\\).\n\\end{columns}\n\n\\slide{Example 15, Continued}\n\\begin{columns}[8 4, parallel]\nAt the critical number and the endpoints:\n\\begin{align}\nv\\!\\left(\\frac{2r_0}{3}\\right)&=k\\cdot\\frac{r_0}{3}\\cdot\\frac{4r_0^2}{9}=\\frac{4kr_0^3}{27} \\\\\nv\\!\\left(\\frac{r_0}{2}\\right)&=k\\cdot\\frac{r_0}{2}\\cdot\\frac{r_0^2}{4}=\\frac{kr_0^3}{8} \\\\\nv(r_0)&=0\n\\end{align}\n\\pause\nSince \\({4/27=0.148\\ldots}\\) is larger than \\({1/8=0.125}\\), the air is fastest when \\({r=2r_0/3}\\).\n\\pause\nX-ray images show that the windpipe does contract to about two-thirds of its normal radius during a cough.\n\\columnbreak\n\\begin{only}<-1>\n\\begin{plot}\nf = (1-x)x^2 + 0sqrt(x-0.5) + 0sqrt(1-x)\ndomain = 0:1.1\nrange = 0:0.2\nxticks = 0.2\nyticks = 0.05\nxlabel = r\nylabel = v\nsize = 520x460\nalt = Graph of v(r) = (1 - r) r^2 for r from 0.5 to 1, the case r0 = 1 and k = 1.\n\\end{plot}\n\\end{only}\n\\begin{only}<2->\n\\begin{plot}\nf = (1-x)x^2 + 0sqrt(x-0.5) + 0sqrt(1-x)\ndomain = 0:1.1\nrange = 0:0.2\nxticks = 0.2\nyticks = 0.05\nxlabel = r\nylabel = v\npoints = 0.5, 2/3, 1\na = 2/3\nsize = 520x460\nalt = Graph of v(r) = (1 - r) r^2 for r from 0.5 to 1, the case r0 = 1 and k = 1, with the maximum at r = 2/3 and the endpoints marked.\n\\end{plot}\n\\end{only}\nThe graph shows the case \\({r_0=1}\\), \\({k=1}\\).\n\\end{columns}\n\n\\section*{Wrap-Up}\n\n\\slide{Summary}\n\\begin{columns}[1 1]\n\\heading{Extreme Values}\n\\begin{itemize}[tight]\n\\item \\textbf{Extreme Value Theorem:} if $f$ is continuous on $[a,b]$, then $f$ attains an absolute maximum and minimum.\n\\item \\textbf{Fermat's Theorem:} if $f$ has a local extreme at $c$ and $f'(c)$ exists, then $f'(c)=0$.\n\\item \\textbf{Critical number:} $f'(c)=0$ or $f'(c)$ does not exist.\n\\end{itemize}\n\\columnbreak\n\\heading{Closed Interval Method}\n\\begin{enumerate}[tight]\n\\item Evaluate $f$ at the critical numbers in $(a,b)$.\n\\item Evaluate $f$ at $a$ and $b$.\n\\item The largest value is the absolute maximum; the smallest is the absolute minimum.\n\\end{enumerate}\n\\end{columns}\n\n\\slide{Coming Up}\n\\begin{itemize}\n\\item Problem Set 13 (maximum and minimum values) is posted on HuskyCT.\n\\item \\textbf{Wednesday, October 21:} Lecture 14, the Mean Value Theorem.\n\\end{itemize}";window.LECTURE_SCALE=1.2;window.LECTURE_THEMES={};</script><script>(function LECTURE_ENGINE() {
