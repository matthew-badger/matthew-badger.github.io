<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 1: Numbers and Slopes</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="\\title{Lecture 1: Numbers and Slopes}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{August 31, 2026}\n\\titleslide\n\n\\section{Course Syllabus Overview (Rapid)}\n\n\\slide{Course Components}\n\n\\begin{itemize}\n  \\item \\alert{Lectures:} Every Monday and Wednesday (No Instruction on Labor Day 9/7)\n \\pause\n  \\item \\alert{Discussion Sections:} Every Monday, Active Learning in group based activities centered around Worksheets (12% of Grade, Based on Participation)\n \\pause\n  \\item \\alert{Quizzes:} Starting Week 3 and on Non-Exam Weeks, 10-15 Minute Quiz at the end of the Discussion Section (20% of Grade, Best 8 of 11 Scores, No Make-ups)\n \\pause\n  \\item \\alert{Exam 1:} October 5th (20% of Grade) \\alert{Exam 2:} November 16th (20% of Grade)\n \\pause\n  \\item \\alert{Final Exam:} December 16th (25% of Grade) \n\\pause\n  \\item Exam Make-Ups only with \\alert{Prior Approval} or for \\alert{Unforseen Emergencies} (Within Reason, as Judged by the Instructor) \n\\pause\n  \\item \\alert{Syllabus Quiz:} Will be Posted on \\alert{HuskyCT.uconn.edu} (3% of Grade), due Before Week 3\n\\end{itemize}\n\n\\slide{Resources}\n\n\\begin{itemize}\n  \\item \\alert{HuskyCT:} Announcements, Syllabus, Course Schedule, Grades\n\\pause\n  \\item \\alert{Optional Textbook:} Suggested that you procure a (used) copy of the textbook James \\alert{Stewart} Single-Variable Calculus with Early Transcendentals (7E/8E/9E) OR \\alert{OpenStax Calculus Volume 1} (free)\n\\pause\n  \\item \\alert{Problem Sets:} I will post suggested problems and solutions after each lecture (or the next day). These are not collected. You should work on problems and then read the solutions in order to prepare for quizzes and exams. \\alert{Mathematics is learned by doing, not just by watching}\n\\pause\n  \\item \\alert{Instructor Office Hours} (Monteith 326): Wednesdays 9:30-10:30, Fridays 10:00-11:00\n  \\item \\alert{Calculus Corner} (Monteith 105): MWF 8:30 - 12:30, TuTh 1:00 - 5:00. These are drop-in office hours staffed by math department TAs\n  \\item \\alert{Q Center} (Library Level 3): Sundays (3pm - 11pm), M/Tu/W/Th: 1pm - 11pm, F 11am-3pm\n\\end{itemize}\n\n\\slide{Additional Policies}\n\\alert{Disability Support Services}\n\nIf you have a physical, psychological, medical, or learning disability that may impact your course work, please contact the Center for Students with Disability: \\alert{http://csd.uconn.edu/}\n\n\\medskip\n\n\\alert{Academic Integrity}\n\nEach student must pursue his or her academic goals honestly and be personally accountable for all submitted work. Faculty are required to report any suspected instance of academic dishonesty to Community Standards. \\alert{https://community.uconn.edu/the-student-code-appendix-a/}\n\n\\medskip\n\n\\alert{In Class Conduct}\n\nYou are expected to act in a courteous manner to the instructors and also to your fellow students. You must abide by any university regulations about health and safety. If you fail to do so, then you may be asked to leave the classroom (lecture or discussion section).\n\n\\section{The Real Number Line}\n\n\\slide{What is a number?}\n\n\\begin{js}[size=1680x480, frames=12]\nconst S = 1, IP = 0, DIG = [3, 1, 4, 1, 5, 9], TM = 0.31415926;\nconst AY = 250, DUR = 0.9;\nconst CX = w / 2, L = w / 2, U = L / 10;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212', EL = '\\u2026';\n\nfunction ms(k) { return k === 0 ? String(IP) : IP + '.' + DIG.slice(0, k).join(''); }\nfunction msUp(k) {\n  if (k === 0) return String(IP + 1);\n  const a = DIG.slice(0, k);\n  let i = k - 1, ip = IP;\n  while (i >= 0) { if (a[i] < 9) { a[i]++; break; } a[i] = 0; i--; }\n  if (i < 0) ip++;\n  return ip + '.' + a.join('');\n}\nfunction vs(k) { return (S < 0 ? MN : '') + ms(k); }\nfunction vsUp(k) { return (S < 0 ? MN : '') + msUp(k); }\nfunction mv(k) { return parseFloat(ms(k)); }\nfunction mvUp(k) { return parseFloat(msUp(k)); }\nfunction ppu(n, e) { return U * Math.pow(10, n + (e === undefined ? 0 : e)); }\nfunction mk(p) { return function (v) { return CX + (v - S * TM) * p; }; }\nfunction txt(s, x, y, font, col, a) {\n  ctx.save();\n  ctx.globalAlpha = a === undefined ? 1 : a;\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction axis() {\n  ctx.save();\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(34, AY); ctx.lineTo(w - 34, AY); ctx.stroke();\n  ctx.fillStyle = '#2b2b2b';\n  [[34, 1], [w - 34, -1]].forEach(function (q) {\n    ctx.beginPath();\n    ctx.moveTo(q[0], AY);\n    ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n    ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n    ctx.closePath(); ctx.fill();\n  });\n  ctx.restore();\n}\nfunction ints(p, from, to, a) {\n  if (a <= 0.02) return;\n  const X = mk(p);\n  for (let v = from; v <= to; v++) {\n    const x = X(v);\n    if (x < 40 || x > w - 40) continue;\n    ctx.save();\n    ctx.globalAlpha = a;\n    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x, AY - 13); ctx.lineTo(x, AY + 13); ctx.stroke();\n    ctx.beginPath(); ctx.arc(x, AY, 7, 0, 6.2832);\n    ctx.fillStyle = colors.teal2; ctx.fill();\n    ctx.restore();\n    txt(v < 0 ? MN + (-v) : String(v), x, AY + 56, '30px ' + FM, colors.teal, a);\n  }\n}\nfunction grad(p, n, ga, ha) {\n  if (ga <= 0.02) return;\n  const M0 = mv(n - 1), M1 = mvUp(n - 1), sg = (M1 - M0) / 10, d = DIG[n - 1];\n  const X = mk(p);\n  const x1 = X(S * (M0 + d * sg)), x2 = X(S * (M0 + (d + 1) * sg));\n  const xl = Math.min(x1, x2), xr = Math.max(x1, x2);\n  if (ha > 0.02) {\n    ctx.save();\n    ctx.globalAlpha = ha * 0.5; ctx.fillStyle = colors.gold;\n    ctx.fillRect(xl, AY - 20, xr - xl, 88);\n    ctx.globalAlpha = ha * 0.7; ctx.strokeStyle = colors.red; ctx.lineWidth = 1.5;\n    ctx.beginPath();\n    ctx.moveTo(xl, AY - 20); ctx.lineTo(xl, AY + 68);\n    ctx.moveTo(xr, AY - 20); ctx.lineTo(xr, AY + 68);\n    ctx.stroke();\n    ctx.restore();\n  }\n  for (let j = 0; j <= 10; j++) {\n    const x = X(S * (M0 + j * sg));\n    if (x < 40 || x > w - 40) continue;\n    const big = (j === 0 || j === 10);\n    ctx.save();\n    ctx.globalAlpha = ga;\n    ctx.strokeStyle = big ? '#2b2b2b' : '#8b9899';\n    ctx.lineWidth = big ? 2.4 : 1.6;\n    ctx.beginPath();\n    ctx.moveTo(x, AY - (big ? 17 : 10));\n    ctx.lineTo(x, AY + (big ? 17 : 10));\n    ctx.stroke();\n    ctx.restore();\n    txt(String(j), x, AY - 30, '22px ' + FM, '#8b9899', ga * 0.85);\n  }\n  for (let j = 0; j <= 9; j++) {\n    const x = X(S * (M0 + (j + 0.5) * sg));\n    if (x < 30 || x > w - 30) continue;\n    const on = (j === d && ha > 0.4);\n    txt(String(j), x, AY + 50, (on ? '600 34px ' : '28px ') + FM, on ? colors.red : colors.teal, ga);\n  }\n  const xa = X(S * M0), xb = X(S * M1);\n  if (xa > 58 && xa < w - 58) txt(vs(n - 1), xa, AY - 66, '600 30px ' + FM, colors.teal2, ga);\n  if (xb > 58 && xb < w - 58) txt(vsUp(n - 1), xb, AY - 66, '600 30px ' + FM, colors.teal2, ga);\n  if (ha > 0.02) {\n    const lo = S > 0 ? vs(n) : vsUp(n), hi = S > 0 ? vsUp(n) : vs(n);\n    txt(lo + '  <  x  <  ' + hi, (xl + xr) / 2, AY + 118, '600 30px ' + FM, colors.red, ha);\n    ctx.save();\n    ctx.globalAlpha = ha;\n    ctx.beginPath(); ctx.arc(CX, AY, 6, 0, 6.2832);\n    ctx.fillStyle = colors.red; ctx.fill();\n    ctx.restore();\n  }\n}\nfunction header(k, na) {\n  const pre = 'x = ' + (S < 0 ? MN : '') + IP + '.' + DIG.slice(0, k - 1).join('');\n  const nd = String(DIG[k - 1]);\n  const tail = (k === DIG.length ? EL : '');\n  ctx.save();\n  ctx.font = '600 54px ' + FM;\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n  const wp = ctx.measureText(pre).width;\n  const wn = ctx.measureText(nd).width;\n  const wt = ctx.measureText(tail).width;\n  const x = (w - (wp + wn + wt)) / 2;\n  ctx.fillStyle = '#111'; ctx.fillText(pre, x, 78);\n  ctx.globalAlpha = na; ctx.fillStyle = colors.red;\n  ctx.fillText(nd, x + wp, 78);\n  if (tail) ctx.fillText(tail, x + wp + wn, 78);\n  ctx.restore();\n}\nfunction zeta() {\n  txt('\\u2124 = { ' + EL + ', ' + MN + '2, ' + MN + '1, 0, 1, 2, ' + EL + ' }',\n    CX, 78, '600 44px ' + FM, colors.teal2);\n  txt('the integers', CX, 124, 'italic 28px ' + FS, '#7d8a8b');\n}\nfunction cutline(note) {\n  ctx.save();\n  ctx.setLineDash([9, 8]);\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(CX, AY - 110); ctx.lineTo(CX, AY + 110); ctx.stroke();\n  ctx.restore();\n  txt('cut here', CX, 78, '600 36px ' + FM, colors.red);\n  if (note) txt(note, CX, AY + 190, 'italic 30px ' + FS, '#7d8a8b');\n}\nfunction cut() {\n  ctx.save();\n  ctx.fillStyle = 'rgba(236,234,218,0.9)'; ctx.fillRect(0, AY - 78, CX, 156);\n  ctx.fillStyle = 'rgba(198,219,237,0.75)'; ctx.fillRect(CX, AY - 78, w - CX, 156);\n  ctx.restore();\n  axis();\n  ints(ppu(0), -8, 9, 1);\n  cutline('every integer lands on one side \\u2014 not precise enough');\n  txt('L', CX / 2, AY - 96, '600 48px ' + FM, colors.teal2);\n  txt('R', (CX + w) / 2, AY - 96, '600 48px ' + FM, colors.teal2);\n  txt('L = { ' + EL + ', ' + MN + '2, ' + MN + '1, 0 }', CX / 2, AY + 132, '28px ' + FM, '#444');\n  txt('R = { 1, 2, 3, 4, ' + EL + ' }', (CX + w) / 2, AY + 132, '28px ' + FM, '#444');\n}\nfunction scene(n, e, lo, hi) {\n  const p = ppu(n - 1, e);\n  axis();\n  if (n === 1) ints(p, lo, hi, 1 - e);\n  else grad(p, n - 1, 1 - e, 1 - e);\n  const ha = Math.max(0, (e - 0.65) / 0.35);\n  grad(p, n, e, ha);\n  header(n, ha);\n}\nfunction zoom(lvl, lo, hi) {\n  let done = false;\n  onFrame(function (t) {\n    if (done) return;\n    const u = Math.min(t / DUR, 1), e = 1 - Math.pow(1 - u, 3);\n    ctx.clearRect(0, 0, w, h);\n    scene(lvl, e, lo, hi);\n    if (u >= 1) done = true;\n  });\n}\nfunction finale(l1, l2) {\n  txt('x = ' + (S < 0 ? MN : '') + IP + '.' + DIG.join('') + EL, CX, 200, '600 78px ' + FM, '#111');\n  txt(l1, CX, 284, 'italic 32px ' + FS, '#555');\n  txt(l2, CX, 340, 'italic 32px ' + FS, colors.teal2);\n}\n\nif (step <= 0) { axis(); }\nelse if (step === 1) { axis(); ints(ppu(0), 0, 1, 1); }\nelse if (step === 2) { axis(); ints(ppu(0), 0, 9, 1); }\nelse if (step === 3) { axis(); ints(ppu(0), -8, 9, 1); zeta(); }\nelse if (step === 4) { cut(); }\nelse if (step <= 10) { zoom(step - 4, -8, 9); }\nelse {\n  finale('record the left endpoint at every level, forever',\n    'a number is that infinite string of digits');\n}\n\\end{js}\n\n\\slide{The same for a negative number}\n\n\\begin{js}[size=1680x480, frames=9]\nconst S = -1, IP = 1, DIG = [4, 2, 7, 8, 3, 3], TM = 1.4278334;\nconst AY = 250, DUR = 0.9;\nconst CX = w / 2, L = w / 2, U = L / 10;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212', EL = '\\u2026';\n\nfunction ms(k) { return k === 0 ? String(IP) : IP + '.' + DIG.slice(0, k).join(''); }\nfunction msUp(k) {\n  if (k === 0) return String(IP + 1);\n  const a = DIG.slice(0, k);\n  let i = k - 1, ip = IP;\n  while (i >= 0) { if (a[i] < 9) { a[i]++; break; } a[i] = 0; i--; }\n  if (i < 0) ip++;\n  return ip + '.' + a.join('');\n}\nfunction vs(k) { return (S < 0 ? MN : '') + ms(k); }\nfunction vsUp(k) { return (S < 0 ? MN : '') + msUp(k); }\nfunction mv(k) { return parseFloat(ms(k)); }\nfunction mvUp(k) { return parseFloat(msUp(k)); }\nfunction ppu(n, e) { return U * Math.pow(10, n + (e === undefined ? 0 : e)); }\nfunction mk(p) { return function (v) { return CX + (v - S * TM) * p; }; }\nfunction txt(s, x, y, font, col, a) {\n  ctx.save();\n  ctx.globalAlpha = a === undefined ? 1 : a;\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction axis() {\n  ctx.save();\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(34, AY); ctx.lineTo(w - 34, AY); ctx.stroke();\n  ctx.fillStyle = '#2b2b2b';\n  [[34, 1], [w - 34, -1]].forEach(function (q) {\n    ctx.beginPath();\n    ctx.moveTo(q[0], AY);\n    ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n    ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n    ctx.closePath(); ctx.fill();\n  });\n  ctx.restore();\n}\nfunction ints(p, from, to, a) {\n  if (a <= 0.02) return;\n  const X = mk(p);\n  for (let v = from; v <= to; v++) {\n    const x = X(v);\n    if (x < 40 || x > w - 40) continue;\n    ctx.save();\n    ctx.globalAlpha = a;\n    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x, AY - 13); ctx.lineTo(x, AY + 13); ctx.stroke();\n    ctx.beginPath(); ctx.arc(x, AY, 7, 0, 6.2832);\n    ctx.fillStyle = colors.teal2; ctx.fill();\n    ctx.restore();\n    txt(v < 0 ? MN + (-v) : String(v), x, AY + 56, '30px ' + FM, colors.teal, a);\n  }\n}\nfunction grad(p, n, ga, ha) {\n  if (ga <= 0.02) return;\n  const M0 = mv(n - 1), M1 = mvUp(n - 1), sg = (M1 - M0) / 10, d = DIG[n - 1];\n  const X = mk(p);\n  const x1 = X(S * (M0 + d * sg)), x2 = X(S * (M0 + (d + 1) * sg));\n  const xl = Math.min(x1, x2), xr = Math.max(x1, x2);\n  if (ha > 0.02) {\n    ctx.save();\n    ctx.globalAlpha = ha * 0.5; ctx.fillStyle = colors.gold;\n    ctx.fillRect(xl, AY - 20, xr - xl, 88);\n    ctx.globalAlpha = ha * 0.7; ctx.strokeStyle = colors.red; ctx.lineWidth = 1.5;\n    ctx.beginPath();\n    ctx.moveTo(xl, AY - 20); ctx.lineTo(xl, AY + 68);\n    ctx.moveTo(xr, AY - 20); ctx.lineTo(xr, AY + 68);\n    ctx.stroke();\n    ctx.restore();\n  }\n  for (let j = 0; j <= 10; j++) {\n    const x = X(S * (M0 + j * sg));\n    if (x < 40 || x > w - 40) continue;\n    const big = (j === 0 || j === 10);\n    ctx.save();\n    ctx.globalAlpha = ga;\n    ctx.strokeStyle = big ? '#2b2b2b' : '#8b9899';\n    ctx.lineWidth = big ? 2.4 : 1.6;\n    ctx.beginPath();\n    ctx.moveTo(x, AY - (big ? 17 : 10));\n    ctx.lineTo(x, AY + (big ? 17 : 10));\n    ctx.stroke();\n    ctx.restore();\n    txt(String(j), x, AY - 30, '22px ' + FM, '#8b9899', ga * 0.85);\n  }\n  for (let j = 0; j <= 9; j++) {\n    const x = X(S * (M0 + (j + 0.5) * sg));\n    if (x < 30 || x > w - 30) continue;\n    const on = (j === d && ha > 0.4);\n    txt(String(j), x, AY + 50, (on ? '600 34px ' : '28px ') + FM, on ? colors.red : colors.teal, ga);\n  }\n  const xa = X(S * M0), xb = X(S * M1);\n  if (xa > 58 && xa < w - 58) txt(vs(n - 1), xa, AY - 66, '600 30px ' + FM, colors.teal2, ga);\n  if (xb > 58 && xb < w - 58) txt(vsUp(n - 1), xb, AY - 66, '600 30px ' + FM, colors.teal2, ga);\n  if (ha > 0.02) {\n    const lo = S > 0 ? vs(n) : vsUp(n), hi = S > 0 ? vsUp(n) : vs(n);\n    txt(lo + '  <  x  <  ' + hi, (xl + xr) / 2, AY + 118, '600 30px ' + FM, colors.red, ha);\n    ctx.save();\n    ctx.globalAlpha = ha;\n    ctx.beginPath(); ctx.arc(CX, AY, 6, 0, 6.2832);\n    ctx.fillStyle = colors.red; ctx.fill();\n    ctx.restore();\n  }\n}\nfunction header(k, na) {\n  const pre = 'x = ' + (S < 0 ? MN : '') + IP + '.' + DIG.slice(0, k - 1).join('');\n  const nd = String(DIG[k - 1]);\n  const tail = (k === DIG.length ? EL : '');\n  ctx.save();\n  ctx.font = '600 54px ' + FM;\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n  const wp = ctx.measureText(pre).width;\n  const wn = ctx.measureText(nd).width;\n  const wt = ctx.measureText(tail).width;\n  const x = (w - (wp + wn + wt)) / 2;\n  ctx.fillStyle = '#111'; ctx.fillText(pre, x, 78);\n  ctx.globalAlpha = na; ctx.fillStyle = colors.red;\n  ctx.fillText(nd, x + wp, 78);\n  if (tail) ctx.fillText(tail, x + wp + wn, 78);\n  ctx.restore();\n}\nfunction cutline(note) {\n  ctx.save();\n  ctx.setLineDash([9, 8]);\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(CX, AY - 110); ctx.lineTo(CX, AY + 110); ctx.stroke();\n  ctx.restore();\n  txt('cut here', CX, 78, '600 36px ' + FM, colors.red);\n  if (note) txt(note, CX, AY + 190, 'italic 30px ' + FS, '#7d8a8b');\n}\nfunction scene(n, e, lo, hi) {\n  const p = ppu(n - 1, e);\n  axis();\n  if (n === 1) ints(p, lo, hi, 1 - e);\n  else grad(p, n - 1, 1 - e, 1 - e);\n  const ha = Math.max(0, (e - 0.65) / 0.35);\n  grad(p, n, e, ha);\n  header(n, ha);\n}\nfunction zoom(lvl, lo, hi) {\n  let done = false;\n  onFrame(function (t) {\n    if (done) return;\n    const u = Math.min(t / DUR, 1), e = 1 - Math.pow(1 - u, 3);\n    ctx.clearRect(0, 0, w, h);\n    scene(lvl, e, lo, hi);\n    if (u >= 1) done = true;\n  });\n}\nfunction finale(l1, l2) {\n  txt('x = ' + (S < 0 ? MN : '') + IP + '.' + DIG.join('') + EL, CX, 200, '600 78px ' + FM, '#111');\n  txt(l1, CX, 284, 'italic 32px ' + FS, '#555');\n  txt(l2, CX, 340, 'italic 32px ' + FS, colors.teal2);\n}\n\nif (step <= 0) { axis(); ints(ppu(0), -11, 8, 1); }\nelse if (step === 1) {\n  axis(); ints(ppu(0), -11, 8, 1);\n  cutline('the cut falls between ' + MN + '2 and ' + MN + '1');\n}\nelse if (step <= 7) { zoom(step - 1, -11, 8); }\nelse {\n  finale('same construction, ten segments counted from the right',\n    'so the digits of a negative number read outward from ' + MN + '1');\n}\n\\end{js}\n\n\\slide{The real numbers}\n\nEvery signed infinite decimal names one point on the line. $\\R$ is the set of all of them.\n\n$$\\R \\;=\\; \\{\\; \\pm\\, d_0.d_1 d_2 d_3 d_4 \\ldots \\;\\}$$\n\n\\pause\n\n\\begin{twocol}[1 1]\n\\begin{align}\n\\pi &= 3.14159\\,26535\\ldots \\\\\ne &= 2.71828\\,18284\\ldots \\\\\n\\varphi &= 1.61803\\,39887\\ldots\n\\end{align}\n\\columnbreak\n\\begin{align}\n\\tfrac{1}{3} &= 0.33333\\,33333\\ldots \\\\\n-4 &= -4.00000\\,00000\\ldots \\\\\n-5 &= -5.00000\\,00000\\ldots\n\\end{align}\n\\end{twocol}\n\nThe ones that look finite are infinite too — they just end in zeros.\n\n\\slide{The ends of the line}\n\nWe can hang two more labels on the ends of the line.\n\n\\begin{js}[size=1680x260]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst AY = 120, CX = w / 2;\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(240, AY); ctx.lineTo(w - 240, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[240, 1], [w - 240, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\nctx.beginPath(); ctx.arc(CX, AY, 7, 0, 6.2832);\nctx.fillStyle = colors.teal2; ctx.fill();\nctx.font = '30px ' + FM; ctx.fillStyle = colors.teal;\nctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\nctx.fillText('0', CX, AY + 52);\nctx.font = '64px Spectral, Georgia, serif'; ctx.fillStyle = colors.burnt;\nctx.textAlign = 'right'; ctx.fillText('\\u2212\\u221E', 196, AY + 22);\nctx.textAlign = 'left'; ctx.fillText('+\\u221E', w - 196, AY + 22);\n\\end{js}\n\n\\pause\n\nNeither $-\\infty$ nor $+\\infty$ is a number: no decimal expansion names either of them.\n\n\\slide{Fix a unit and the digits become distances}\n\nFix a unit: every further digit subdivides the gap between integers by ten.\n\n\\begin{js}[size=1680x600, frames=20]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst MN = '\\u2212', EL = '\\u2026';\nconst ROWS = [\n  ['0', 'meter', 'one long stride'],\n  [MN + '1', 'decimeter', 'the width of your hand'],\n  [MN + '2', 'centimeter', 'your height: 175 of them'],\n  [MN + '3', 'millimeter', 'a grain of coarse sand'],\n  [MN + '4', '', 'a sheet of paper, edge on'],\n  [MN + '5', '', 'a red blood cell'],\n  [MN + '6', 'micrometer', 'a bacterium'],\n  [MN + '7', '', 'an influenza virus'],\n  [MN + '8', '', 'a cell membrane'],\n  [MN + '9', 'nanometer', 'the DNA helix is two of these'],\n  [MN + '10', 'angstrom', 'a hydrogen atom'],\n  [MN + '11', '', 'the inner shell of a heavy atom'],\n  [MN + '12', 'picometer', 'a gamma-ray wavelength'],\n  [MN + '13', '', 'past atoms, above nuclei: nothing'],\n  [MN + '14', '', 'a uranium nucleus'],\n  [MN + '15', 'femtometer', 'a proton'],\n  [MN + '16, ' + MN + '17', '', 'nothing known at this scale'],\n  [MN + '18', 'attometer', 'the range of the weak force'],\n  [MN + '19' + EL + MN + '34', '', 'no experiment reaches this far'],\n  [MN + '35', 'Planck length', 'below this, distance loses meaning']\n];\nconst GX = [40, 860], ROWH = 56, Y0 = 56;\n\nfunction ltxt(s, x, y, font, col, a) {\n  if (!s) return 0;\n  ctx.save();\n  ctx.globalAlpha = a === undefined ? 1 : a;\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n  const m = ctx.measureText(s).width;\n  ctx.restore();\n  return m;\n}\nfunction pow10(x, y, ex, col, a) {\n  const wm = ltxt('10', x, y, '28px ' + FM, col, a);\n  ltxt(ex, x + wm + 3, y - 13, '19px ' + FM, col, a);\n}\nfunction row(i, a, hot) {\n  const r = ROWS[i], gx = GX[i < 10 ? 0 : 1], y = Y0 + (i % 10) * ROWH;\n  if (hot) {\n    ctx.save();\n    ctx.globalAlpha = 0.45; ctx.fillStyle = colors.gold;\n    ctx.fillRect(gx - 16, y - 32, 790, 44);\n    ctx.restore();\n  }\n  pow10(gx, y, r[0], '#111', a);\n  ltxt(r[1], gx + 152, y, 'italic 26px ' + FS, colors.teal2, a);\n  ltxt(r[2], gx + 330, y, '26px ' + FS, '#333', a);\n}\n\nctx.save();\nctx.strokeStyle = '#DEE6E7'; ctx.lineWidth = 1;\nctx.beginPath(); ctx.moveTo(838, 26); ctx.lineTo(838, Y0 + 9 * ROWH + 14); ctx.stroke();\nctx.restore();\nltxt('meters', GX[0], 22, 'italic 24px ' + FS, '#9aa6a7', 1);\nfor (let i = 0; i <= Math.min(step, ROWS.length - 1); i++) row(i, 1, i === step);\n\\end{js}\n\n\\slide{How close can two numbers be?}\n\n\\begin{js}[size=1680x300]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MG = 140, AY = 130, SPAN = w - 2 * MG, V0 = 1.9, V1 = 2.2;\nfunction X(v) { return MG + (v - V0) / (V1 - V0) * SPAN; }\nfunction txt(s, x, y, font, col) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\nctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.4;\nfor (let k = 0; k <= 30; k++) {\n  const x = X(V0 + k * 0.01);\n  ctx.beginPath(); ctx.moveTo(x, AY - 9); ctx.lineTo(x, AY + 9); ctx.stroke();\n}\n[1.9, 2.0, 2.1, 2.2].forEach(function (v) {\n  const x = X(v);\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.4;\n  ctx.beginPath(); ctx.moveTo(x, AY - 17); ctx.lineTo(x, AY + 17); ctx.stroke();\n  txt(v.toFixed(1), x, AY + 50, '24px ' + FM, '#666');\n});\n[[2, 'a = 2'], [2.1, 'b = 2.1']].forEach(function (p) {\n  const x = X(p[0]);\n  ctx.beginPath(); ctx.arc(x, AY, 9, 0, 6.2832);\n  ctx.fillStyle = colors.teal2; ctx.fill();\n  txt(p[1], x, AY - 34, '600 32px ' + FM, colors.teal);\n});\nconst xa = X(2), xb = X(2.1), by = AY + 86;\nctx.strokeStyle = colors.red; ctx.lineWidth = 2.5;\nctx.beginPath();\nctx.moveTo(xa, by - 14); ctx.lineTo(xa, by); ctx.lineTo(xb, by); ctx.lineTo(xb, by - 14);\nctx.stroke();\ntxt('0.1', (xa + xb) / 2, by + 44, '600 32px ' + FM, colors.red);\n\\end{js}\n\n$$b - a = 0.1 \\qquad a - b = -0.1$$\n\n\\pause\n\nThe distance is the absolute value of the difference (always zero or positive).\n\n$$|b-a| \\;=\\; |a-b| \\;=\\; \\max\\{\\, b-a,\\; a-b \\,\\} \\;=\\; 0.1$$\n\n\\slide{Five digits further in}\n\n\\begin{js}[size=1680x300]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst MG = 140, AY = 130, SPAN = w - 2 * MG, V0 = 3.1453, SG = 0.00001;\nfunction X(v) { return MG + (v - V0) / (10 * SG) * SPAN; }\nfunction txt(s, x, y, font, col) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\nfor (let k = 0; k <= 10; k++) {\n  const x = X(V0 + k * SG), big = (k === 0 || k === 10);\n  ctx.strokeStyle = big ? '#2b2b2b' : '#8b9899'; ctx.lineWidth = big ? 2.4 : 1.6;\n  ctx.beginPath(); ctx.moveTo(x, AY - (big ? 17 : 11)); ctx.lineTo(x, AY + (big ? 17 : 11)); ctx.stroke();\n  txt((V0 + k * SG).toFixed(5), x, AY + 50, '20px ' + FM, '#666');\n}\n[[3.14536, 'a = 3.14536'], [3.14538, 'b = 3.14538']].forEach(function (p) {\n  const x = X(p[0]);\n  ctx.beginPath(); ctx.arc(x, AY, 9, 0, 6.2832);\n  ctx.fillStyle = colors.teal2; ctx.fill();\n  txt(p[1], x, AY - 34, '600 30px ' + FM, colors.teal);\n});\nconst xa = X(3.14536), xb = X(3.14538), by = AY + 90;\nctx.strokeStyle = colors.red; ctx.lineWidth = 2.5;\nctx.beginPath();\nctx.moveTo(xa, by - 14); ctx.lineTo(xa, by); ctx.lineTo(xb, by); ctx.lineTo(xb, by - 14);\nctx.stroke();\ntxt('0.00002', (xa + xb) / 2, by + 44, '600 30px ' + FM, colors.red);\n\\end{js}\n\n$$|b-a| \\;=\\; |a-b| \\;=\\; 0.00002 \\;=\\; 2 \\times 10^{-5}$$\n\n\\slide{Is there a smallest distance?}\n\n\\textbf{Q.} Is there a smallest distance between two numbers?\n\n\\begin{js}[size=1680x320, frames=4]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst XA = 240, XB = 1440, AY = 120, SG = (XB - XA) / 10, XC = XA + 4 * SG;\nfunction txt(s, x, y, font, col) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction brace(x1, x2, y, lab, col) {\n  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(x1, y - 14); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 14);\n  ctx.stroke();\n  txt(lab, (x1 + x2) / 2, y + 40, '600 30px ' + FM, col);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\nif (step >= 1) {\n  ctx.strokeStyle = '#8b9899'; ctx.lineWidth = 1.6;\n  for (let k = 1; k < 10; k++) {\n    const x = XA + k * SG;\n    ctx.beginPath(); ctx.moveTo(x, AY - 11); ctx.lineTo(x, AY + 11); ctx.stroke();\n  }\n}\n[[XA, 'a'], [XB, 'b']].forEach(function (p) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.4;\n  ctx.beginPath(); ctx.moveTo(p[0], AY - 18); ctx.lineTo(p[0], AY + 18); ctx.stroke();\n  ctx.beginPath(); ctx.arc(p[0], AY, 9, 0, 6.2832);\n  ctx.fillStyle = colors.teal2; ctx.fill();\n  txt(p[1], p[0], AY - 36, 'italic 600 36px ' + FM, colors.teal);\n});\nif (step < 2) brace(XA, XB, AY + 80, '|a - b|', colors.teal2);\nif (step >= 2) {\n  ctx.beginPath(); ctx.arc(XC, AY, 9, 0, 6.2832);\n  ctx.fillStyle = colors.red; ctx.fill();\n  txt('c', XC, AY - 36, 'italic 600 36px ' + FM, colors.red);\n  brace(XA, XC, AY + 80, '|a - c|', colors.red);\n  brace(XC, XB, AY + 80, '|c - b|', colors.red);\n}\n\\end{js}\n\n\\uncover<1->{\\textbf{A.} No. However close two different numbers are, divide the segment between them\ninto ten parts and pick a number $c$ strictly in between.} \n\n\\uncover<3->{Then $|a-c| < |a-b|$ and $|c-b| < |a-b|$, so\nno distance is the smallest one.}\n\n\\slide{Physics stops. Mathematics does not.}\n\n\\begin{twocol}[1 1]\n\\textbf{Physics}\n\n\\begin{itemize}\n\\item A DNA helix is about $2 \\times 10^{-9}$ m across.\n\\item A proton is about $10^{-15}$ m across.\n\\item Below the Planck length, $1.6 \\times 10^{-35}$ m, no current theory makes predictions.\n\\end{itemize}\n\\columnbreak\n\\textbf{Mathematics}\n\n\\begin{itemize}\n\\item $10^{-35}$ is a finite string of digits.\n\\item Subdivide again: $10^{-100}$, then $10^{-1000000}$, then further.\n\\item Each one is still only a piece of the line.\n\\end{itemize}\n\\end{twocol}\n\n\\pause\n\n\\medskip\n\nA point on the line is pinned down more finely than an atom, a nucleus, a quark, or any measurement.\n\n\\slide{Telling two numbers apart}\nTo tell two numbers apart, look for a third number between them. If there is one, they were different.\n\\begin{js}[size=1680x230, frames=7]\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst AY = 100, CX = w / 2, D = '\\u03b4', MN = '\\u2212';\nfunction txt(s, x, y, font, col, a) {\n  ctx.save();\n  ctx.globalAlpha = a === undefined ? 1 : a;\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction dot(x, col) {\n  ctx.beginPath(); ctx.arc(x, AY, 9, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nfunction brace(x1, x2, y, lab, col) {\n  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\n  ctx.beginPath();\n  ctx.moveTo(x1, y - 14); ctx.lineTo(x1, y); ctx.lineTo(x2, y); ctx.lineTo(x2, y - 14);\n  ctx.stroke();\n  txt(lab, (x1 + x2) / 2, y + 40, '600 30px ' + FM, col);\n}\nctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';\nctx.beginPath(); ctx.moveTo(40, AY); ctx.lineTo(w - 40, AY); ctx.stroke();\nctx.fillStyle = '#2b2b2b';\n[[40, 1], [w - 40, -1]].forEach(function (q) {\n  ctx.beginPath();\n  ctx.moveTo(q[0], AY);\n  ctx.lineTo(q[0] + 20 * q[1], AY - 10);\n  ctx.lineTo(q[0] + 20 * q[1], AY + 10);\n  ctx.closePath(); ctx.fill();\n});\nif (step <= 0) {\n  [[480, 'a', colors.teal2], [1200, 'b', colors.teal2], [840, 'c', colors.red]].forEach(function (p) {\n    dot(p[0], p[2]);\n    txt(p[1], p[0], AY - 38, 'italic 600 38px ' + FS, p[2] === colors.red ? colors.red : colors.teal);\n  });\n  brace(480, 840, AY + 66, '', colors.teal3);\n  brace(840, 1200, AY + 66, '', colors.teal3);\n  txt('a  <  c  <  b', CX, AY + 118, '600 32px ' + FM, colors.teal2);\n}\nelse if (step === 1) {\n  [[440, 0.16], [180, 0.22], [70, 0.3]].forEach(function (b) {\n    ctx.save();\n    ctx.globalAlpha = b[1]; ctx.fillStyle = colors.gold;\n    ctx.fillRect(CX - b[0] / 2, AY - 40, b[0], 80);\n    ctx.restore();\n  });\n  dot(CX, colors.teal2);\n  txt('a', CX, AY - 56, 'italic 600 38px ' + FS, colors.teal);\n  txt('b', CX, AY + 80, 'italic 600 38px ' + FS, colors.teal);\n  txt('nothing in between, at any zoom', CX, AY + 120, 'italic 30px ' + FS, '#7d8a8b');\n}\nelse {\n  const DELTAS = ['1/10', '1/100', '10^-10', '10^-20', '10^-40'];\n  const RS     = [280, 210, 150, 100, 60];\n  const OFFS   = [70, 55, 40, 28, 18];\n  const i = step - 2;\n  const DL = DELTAS[i], R = RS[i], XB = CX + OFFS[i];\n  ctx.save();\n  ctx.globalAlpha = 0.4; ctx.fillStyle = colors.gold;\n  ctx.fillRect(CX - R, AY - 34, 2 * R, 68);\n  ctx.restore();\n  ctx.strokeStyle = colors.burnt; ctx.lineWidth = 2.5;\n  ctx.beginPath();\n  ctx.moveTo(CX - R, AY - 34); ctx.lineTo(CX - R, AY + 34);\n  ctx.moveTo(CX + R, AY - 34); ctx.lineTo(CX + R, AY + 34);\n  ctx.stroke();\n  txt('a ' + MN + ' ' + DL, CX - R, AY + 58, 'italic 26px ' + FS, colors.burnt);\n  txt('a + ' + DL, CX + R, AY + 58, 'italic 26px ' + FS, colors.burnt);\n  dot(CX, colors.teal2);\n  dot(XB, colors.red);\n  txt('a', CX, AY - 48, 'italic 600 38px ' + FS, colors.teal);\n  txt('b', XB, AY - 48, 'italic 600 38px ' + FS, colors.red);\n  ctx.save();\n  ctx.font = '600 24px ' + FM; ctx.fillStyle = colors.burnt;\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(D + ' = ' + DL, 40, 34);\n  ctx.restore();\n}\n\\end{js}\n\\uncover<1->{If no matter how far you zoom in there is nothing between them, they are the same number.}\n\n\\uncover<2->{In other words, take smaller and smaller positive $\\delta$. Look at numbers within $\\delta$ of $a$ and see if to see if $b$ lies there. Let $\\delta=1/10$, $\\delta=1/100$, $\\delta=10^{-10}$, $\\delta=10^{-20}$, and so on...}\n\n\\uncover<6->{When this holds for every $\\delta>0$: $|a-b|<\\delta$ always, which forces $a=b$.}\n\n\\section{Slopes}\n\n\\slide{The plane $\\R^2$ and the graph of a function}\n\nTwo axes, an origin, and every point named by an ordered pair $(x,y)$. The \\alert{graph} of $f$ is the set of\nall pairs $(x, f(x))$.\n\n\\begin{js}[size=1240x560, frames=3]\nconst X0 = -6, X1 = 6, YA = -5, YB = 13, P = 46;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction txt(s, x, y, font, col, al) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction tri(x, y, dx, dy) {\n  ctx.beginPath();\n  ctx.moveTo(x + dx * 16, y + dy * 16);\n  ctx.lineTo(x - dy * 7 - dx * 4, y + dx * 7 - dy * 4);\n  ctx.lineTo(x + dy * 7 - dx * 4, y - dx * 7 - dy * 4);\n  ctx.closePath(); ctx.fill();\n}\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction ticklabels(sx, sy) {\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    if (Math.abs(v) < 1e-9) continue;\n    htxt(String(Math.round(v * 100) / 100), X(v), Y(0) + 32, '21px ' + FM, '#8b9899');\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    if (Math.abs(v) < 1e-9) continue;\n    htxt(String(Math.round(v * 100) / 100), X(0) - 14, Y(v) + 8, '21px ' + FM, '#8b9899', 'right');\n  }\n  htxt('x', X(X1) - 8, Y(0) - 18, 'italic 30px ' + FS, '#444');\n  htxt('y', X(0) + 28, Y(YB) + 30, 'italic 30px ' + FS, '#444');\n}\nfunction grid(sx, sy) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    ctx.beginPath(); ctx.moveTo(X(v), Y(YA)); ctx.lineTo(X(v), Y(YB)); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    ctx.beginPath(); ctx.moveTo(X(X0), Y(v)); ctx.lineTo(X(X1), Y(v)); ctx.stroke();\n  }\n}\nfunction axes(sx, sy) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(X0), Y(0)); ctx.lineTo(X(X1), Y(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(X(0), Y(YA)); ctx.lineTo(X(0), Y(YB)); ctx.stroke();\n  ctx.fillStyle = '#2b2b2b';\n  tri(X(X1), Y(0), 1, 0); tri(X(0), Y(YB), 0, -1);\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    if (Math.abs(v) < 1e-9) continue;\n    ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 6); ctx.lineTo(X(v), Y(0) + 6); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    if (Math.abs(v) < 1e-9) continue;\n    ctx.beginPath(); ctx.moveTo(X(0) - 6, Y(v)); ctx.lineTo(X(0) + 6, Y(v)); ctx.stroke();\n  }\n  ticklabels(sx, sy);\n}\nfunction curve(f, col, lw, dash) {\n  ctx.save();\n  ctx.beginPath();\n  ctx.rect(P - 6, P - 6, w - 2 * P + 12, h - 2 * P + 12); ctx.clip();\n  if (dash) ctx.setLineDash(dash);\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let started = false;\n  for (let k = 0; k <= 700; k++) {\n    const x = X0 + (X1 - X0) * k / 700, y = f(x);\n    if (!isFinite(y)) { started = false; continue; }\n    if (started) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); started = true; }\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col, r) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 8, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nfunction dash2(x1, y1, x2, y2, col) {\n  ctx.save();\n  ctx.setLineDash([8, 7]); ctx.strokeStyle = col; ctx.lineWidth = 1.8;\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction f(x) { return 3 * x * x - 4; }\ngrid(1, 2);\naxes(1, 2);\ntxt('O', X(0) - 20, Y(0) + 30, 'italic 26px ' + FS, '#8b9899');\nif (step >= 1) {\n  [-2, 0, 2].forEach(function (x) { dot(x, f(x), colors.teal2, 8); });\n  dash2(2, 0, 2, f(2), colors.teal3); dash2(0, f(2), 2, f(2), colors.teal3);\n  txt('(2, 8)', X(2) + 68, Y(f(2)) + 10, '600 26px ' + FM, colors.teal);\n  txt('(' + '\\u2212' + '2, 8)', X(-2) - 76, Y(f(-2)) + 10, '600 26px ' + FM, colors.teal);\n}\nif (step >= 2) {\n  curve(f, colors.teal2, 3.5);\n  txt('f(x) = 3x\\u00b2 \\u2212 4', X(4.2), Y(11), '600 30px ' + FM, colors.teal2);\n}\nticklabels(1, 2);\n\\end{js}\n\n\\slide{Linear functions}\n\nLinear functions like $L(x) = 0.5x$ have graphs that are lines through the origin. The coefficient of\n$x$ is called the \\emph{slope}.\n\n\\begin{js}[size=1200x440, frames=2]\nconst X0 = -6, X1 = 6, YA = -2.6, YB = 2.6, P = 46;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nfunction txt(s, x, y, font, col, al) {\n  ctx.font = font; ctx.fillStyle = col;\n  ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.fillText(s, x, y);\n}\nfunction tri(x, y, dx, dy) {\n  ctx.beginPath();\n  ctx.moveTo(x + dx * 16, y + dy * 16);\n  ctx.lineTo(x - dy * 7 - dx * 4, y + dx * 7 - dy * 4);\n  ctx.lineTo(x + dy * 7 - dx * 4, y - dx * 7 - dy * 4);\n  ctx.closePath(); ctx.fill();\n}\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s Width = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let started = false;\n  for (let k = 0; k <= 700; k++) {\n    const x = X0 + (X1 - X0) * k / 700, y = f(x);\n    if (!isFinite(y)) { started = false; continue; }\n    if (started) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); started = true; }\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col, r) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 8, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nfunction dash2(x1, y1, x2, y2, col) {\n  ctx.save();\n  ctx.setLineDash([8, 7]); ctx.strokeStyle = col; ctx.lineWidth = 1.8;\n  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();\n  ctx.restore();\n}\nfunction L(x) { return 0.5 * x; }\ngrid(1, 1);\naxes(1, 1);\ncurve(L, colors.teal2, 3.5);\ndot(0, 0, colors.teal2, 8);\ntxt('L(x) = 0.5x', X(3.0), Y(2.25), '600 30px ' + FM, colors.teal2);\nif (step >= 1) {\n  ctx.strokeStyle = colors.red; ctx.lineWidth = 2.5;\n  ctx.beginPath();\n  ctx.moveTo(X(-2), Y(-1)); ctx.lineTo(X(4), Y(-1)); ctx.lineTo(X(4), Y(2));\n  ctx.stroke();\n  dot(-2, -1, colors.red, 9);\n  dot(4, 2, colors.red, 9);\n  txt('\\u0394x = 6', X(1), Y(-1) + 42, 'italic 600 30px ' + FS, colors.red);\n  txt('\\u0394y = 3', X(4) + 74, Y(0.5) + 10, 'italic 600 30px ' + FS, colors.red);\n  txt('\\u0394y / \\u0394x  =  3/6  =  0.5', X(-3.3), Y(2.3), 'italic 600 30px ' + FS, colors.red);\n}\nticklabels(1, 1);\n\\end{js}\n\n\\uncover<1->{$$\\frac{\\Delta y}{\\Delta x} \\;=\\; \\frac{2 - (-1)}{4 - (-2)} \\;=\\; \\frac{3}{6} \\;=\\; 0.5$$}\n\n\\slide{Affine functions}\n\nAffine functions like $A(x) = -\\tfrac{1}{3}x + 2$ are lines too, but they miss the origin: the\nintercept is $A(0) = 2$.\n\n\\begin{js}[size=1200x430, frames=3]\nconst X0 = -6, X1 = 6, YA = -1.2, YB = 4.16, P = 46;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 ion htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nfunction tri(x, y, dx, dy) {\n  ctx.beginPath();\n  ctx.moveTo(x + dx * 16, y + dy * 16);\n  ctx.lineTo(x - dy * 7 - dx * 4, y + dx * 7 - dy * 4);\n  ctx.lineTo(x + dy * 7 - dx * 4, y - dx * 7 - dy * 4);\n  ctx.closePath(); ctx.fill();\n}\nfunction ticklabels(sx, sy) {\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    if (Math.abs(v) < 1e-9) continue;\n    htxt(fmt(v), X(v), Y(0) + 30, '20px ' + FM, '#8b9899');\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    if (Math.abs(v) < 1e-9) continue;\n    htxt(fmt(v), X(0) - 13, Y(v) + 7, '20px ' + FM, '#8b9899', 'right');\n  }\n  htxt('x', X(X1) - 8, Y(0) - 18, 'italic 28px ' + FS, '#444');\n  htxt('y', X(0) + 26, Y(YB) + 28, 'italic 28px ' + FS, '#444');\n}\nfunction grid(sx, sy) {\n  ctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    ctx.beginPath(); ctx.moveTo(X(v), Y(YA)); ctx.lineTo(X(v), Y(YB)); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    ctx.beginPath(); ctx.moveTo(X(X0), Y(v)); ctx.lineTo(X(X1), Y(v)); ctx.stroke();\n  }\n}\nfunction axes(sx, sy) {\n  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 2; ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(X0), Y(0)); ctx.lineTo(X(X1), Y(0)); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(X(0), Y(YA)); ctx.lineTo(X(0), Y(YB)); ctx.stroke();\n  ctx.fillStyle = '#2b2b2b';\n  tri(X(X1), Y(0), 1, 0); tri(X(0), Y(YB), 0, -1);\n  for (let v = Math.ceil(X0 / sx) * sx; v <= X1 + 1e-9; v += sx) {\n    if (Math.abs(v) < 1e-9) continue;\n    ctx.beginPath(); ctx.moveTo(X(v), Y(0) - 6); ctx.lineTo(X(v), Y(0) + 6); ctx.stroke();\n  }\n  for (let v = Math.ceil(YA / sy) * sy; v <= YB + 1e-9; v += sy) {\n    if (Math.abs(v) < 1e-9) continue;\n    ctx.beginPath(); ctx.moveTo(X(0) - 6, Y(v)); ctx.lineTo(X(0) + 6, Y(v)); ctx.stroke();\n  }\n  ticklabels(sx, sy);\n}\nfunction curve(f, col, lw, dash) {\n  ctx.save();\n  ctx.beginPath();\n  ctx.rect(P - 6, P - 6, w - 2 * P + 12, h - 2 * P + 12); ctx.clip();\n  if (dash) ctx.setLineDash(dash);\n  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\n  ctx.beginPath();\n  let started = false;\n  for (let k = 0; k <= 700; k++) {\n    const x = X0 + (X1 - X0) * k / 700, y = f(x);\n    if (!isFinite(y)) { started = false; continue; }\n    if (started) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); started = true; }\n  }\n  ctx.stroke();\n  ctx.restore();\n}\nfunction dot(x, y, col, r) {\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 8, 0, 6.2832);\n  ctx.fillStyle = col; ctx.fill();\n}\nif (step <= 0) {\n  X0 = -3; X1 = 3.5; YA = -14; YB = 26;\n  grid(1, 5); axes(1, 5);\n  curve(function (x) { return 3 * x * x - 4; }, colors.teal2, 3.5);\n  dot(2, 8, colors.red, 10);\n  htxt('(2, 8)', X(2) + 16, Y(8) - 18, '600 24px ' + FM, colors.red, 'left');\n  htxt('f(x) = 3x\\u00b2 \\u2212 4', P + 12, P + 34, '600 26px ' + FM, colors.teal2, 'left');\n} else {\n  const K = Math.pow(2, step - 1), C = 3 / K;\n  grid(0.25, 5); axes(0.5, 5);\n  if (step >= 2) {\n    curve(function (x) { return 12 * x; }, colors.red, 2, [9, 8]);\n    htxt('L(x) = 12x', X(-0.34), Y(6.4), '600 24px ' + FM, colors.red);\n  }\n  curve(function (x) { return C * x * x + 12 * x; }, colors.teal2, 3.5);\n  htxt('k = ' + K, P + 12, P + 34, '600 30px ' + FM, colors.teal, 'left');\n  if (K === 1) htxt('g(x) = 3x\\u00b2 + 12x', P + 12, P + 70, '600 24px ' + FM, colors.teal2, 'left');\n  else {\n    htxt(K + ' g(x/' + K + ') =', P + 12, P + 70, '600 24px ' + FM, colors.teal2, 'left');\n    htxt(fmt(C) + 'x\\u00b2 + 12x', P + 12, P + 102, '600 24px ' + FM, colors.teal2, 'left');\n  }\n}\n\\end{js}\n\\end{twocol}\n\n\\slide{The Tangent Line to a Curve}\n\n\\begin{twocol}[5 7]\n\\begin{js}[size=660x660, frames=7]\nconst A = 0.1, FA = Math.sin(A), M = Math.cos(A);\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst FS = \"Spectral, Georgia, serif\";\nconst P = 46;\nfunction htxt(s, x, y, font, col, al) {\n  ctx.save();\n  ctx.font = font; ctx.textAlign = al || 'center'; ctx.textBaseline = 'alphabetic';\n  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';\n  ctx.strokeText(s, x, y);\n  ctx.fillStyle = col; ctx.fillText(s, x, y);\n  ctx.restore();\n}\nconst K = Math.pow(4, step), HW = 3.2 / K;\nconst X0 = A - HW, X1 = A + HW, YA = FA - HW, YB = FA + HW;\nfunction X(v) { return P + (v - X0) / (X1 - X0) * (w - 2 * P); }\nfunction Y(v) { return h - P - (v - YA) / (YB - YA) * (h - 2 * P); }\nconst gs = HW / 2;\nctx.strokeStyle = '#E8EFEF'; ctx.lineWidth = 1;\nfor (let v = Math.ceil(X0 / gs) * gs; v <= X1 + 1e-9; v += gs) {\n  ctx.beginPath(); ctx.moveTo(X(v), P); ctx.lineTo(X(v), h - P); ctx.stroke();\n}\nfor (let v = Math.ceil(YA / gs) * gs; v <= YB + 1e-9; v += gs) {\n  ctx.beginPath(); ctx.moveTo(P, Y(v)); ctx.lineTo(w - P, Y(v)); ctx.stroke();\n}\nctx.strokeStyle = '#c7d0d0'; ctx.lineWidth = 2;\nctx.strokeRect(P, P, w - 2 * P, h - 2 * P);\nctx.save();\nctx.beginPath(); ctx.rect(P - 4, P - 4, w - 2 * P + 8, h - 2 * P + 8); ctx.clip();\nctx.strokeStyle = colors.teal2; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';\nctx.beginPath();\nlet started = false;\nfor (let k = 0; k <= 700; k++) {\n  const x = X0 + (X1 - X0) * k / 700, y = Math.sin(x);\n  if (started) ctx.lineTo(X(x), Y(y)); else { ctx.moveTo(X(x), Y(y)); started = true; }\n}\nctx.stroke();\nctx.strokeStyle = colors.red; ctx.lineWidth = 2.5;\nif (step === 0) ctx.setLineDash([9, 7]);\nctx.beginPath();\nctx.moveTo(X(X0), Y(FA + M * (X0 - A)));\nctx.lineTo(X(X1), Y(FA + M * (X1 - A)));\nctx.stroke();\nctx.setLineDash([]);\nctx.restore();\nctx.beginPath(); ctx.arc(X(A), Y(FA), 8, 0, 6.2832);\nctx.fillStyle = colors.red; ctx.fill();\nctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();\nhtxt('zoom \\u00d7' + K, P + 12, P + 34, '600 26px ' + FM, colors.teal, 'left');\nif (step === 0) {\n  htxt('f(x) = sin x', P + 12, P + 70, '600 24px ' + FM, colors.teal2, 'left');\n  htxt('(0.1, sin 0.1)', X(A) + 18, Y(FA) - 16, '600 19px ' + FM, '#555', 'left');\n}\n\\end{js}\n\\columnbreak\nA tangent line to a curve at a point is a straight line that just touches the curve, like the red line drawn on the left at the point $(0.1,\\ \\sin 0.1)$.\n\n\\uncover<1->{Zoom in around that point...}\n\n\\uncover<2->{...closer...} \\uncover<3->{...closer...} \\uncover<4->{...the curve approaches a line}\n\n\\uncover<5->{No matter how far you zoom, the curve keeps hugging this line that is what makes it the \\alert{tangent line} to $f$ at $x = 0.1$.}\n\n\\uncover<6->{The slope of the line is $$\\lim_{\\delta\\to 0}\\tfrac{\\sin(0.1+\\delta)-\\sin(0.1)}{\\delta}$$}\n\n\\uncover<6->{Next time we'll start to explore limits in more detail}\n\\end{twocol}";window.LECTURE_SCALE=1.2;</script><script src="lecture-engine.js"></script><script>function PLAYER() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('scale'); } catch (e) {}
    if (q && !isNaN(parseFloat(q))) window.Lecture.setScale(parseFloat(q));
    else if (window.LECTURE_SCALE) window.Lecture.setScale(window.LECTURE_SCALE);
    var parsed = window.Lecture.parse(window.LECTURE_SOURCE);
    var slides = parsed.slides, meta = parsed.meta;
    var si = 0, ctrl = null, step = 0;
    var stage = document.getElementById('stage'), slideEl = document.getElementById('slide');
    var tray = document.getElementById('tray'), bar = document.getElementById('bar');
    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    }
    addEventListener('resize', fit); fit();
    var track = document.createElement('div');
    track.title = 'Drag to scrub through the deck';
    track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ew-resize;z-index:6';
    stage.appendChild(track);
    track.addEventListener('pointerdown', function (e) {
      function pick(cx) {
        var r = track.getBoundingClientRect();
        if (!r.width) return;
        var u = Math.max(0, Math.min(0.9999, (cx - r.left) / r.width));
        var k = Math.floor(u * slides.length);
        if (k === si) return;
        si = k; step = 0; render();
      }
      function move(ev) { ev.preventDefault(); pick(ev.clientX); }
      function up() {
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        bar.style.height = '4px'; bar.style.transition = 'width .3s ease';
      }
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      bar.style.height = '10px'; bar.style.transition = 'none';
      pick(e.clientX);
    });
    function chrome() {
      var total = slides.length;
      tray.innerHTML = '<div class="nb" id="prev">&#8592;</div><div class="nb" id="next">&#8594;</div>' +
        '<div style="flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:24px;color:#125A56">' +
        (slides[si].section || meta.title || '') + '</div>' +
        '<div style="color:#999">' + (meta.copyright || '') + '</div>' +
        '<div style="color:#111">' + (si + 1) + ' / ' + total + '</div>';
      document.getElementById('prev').onclick = function () { go(-1); };
      document.getElementById('next').onclick = function () { go(1); };
      bar.style.width = ((si + 1) / total * 1920) + 'px';
    }
    function render() {
      if (ctrl) ctrl.destroy();
      ctrl = window.Lecture.mountSlide(slideEl, slides[si], meta, { readonly: true });
      ctrl.setStep(step);
      chrome();
    }
    function go(d) {
      if (d > 0) {
        if (step < slides[si].steps) { step++; ctrl.setStep(step); return; }
        if (si < slides.length - 1) { si++; step = 0; render(); }
      } else {
        if (step > 0) { step--; ctrl.setStep(step); return; }
        if (si > 0) { si--; step = slides[si].steps; render(); }
      }
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); }
      else if (e.key === 'Home') { si = 0; step = 0; render(); }
      else if (e.key === 'End') { si = slides.length - 1; step = 0; render(); }
    });
    render();
  };PLAYER();</script></body></html>
