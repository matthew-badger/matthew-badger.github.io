f(a) + m * (x - a), hh = (x) => f(x) - sec(x);\nlet c = a;                                            // where h is largest\nfor (let i = 0; i <= 2000; i++) { const x = a + (b - a) * i / 2000; if (hh(x) > hh(c)) c = x; }\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction curve(g, Yf, t0, t1, color, width) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = t0 + (t1 - t0) * i / 300; if (i) ctx.lineTo(X(x), Yf(g(x))); else ctx.moveTo(X(x), Yf(g(x))); }\n  ctx.stroke();\n}\nfunction dot(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nline(X(-0.2), Yt(0.95), X(4.4), Yt(0.95), colors.axis, 2);\nline(X(0.1), Yt(sec(0.1)), X(4.3), Yt(sec(4.3)), colors.c1, 4);\ncurve(f, Yt, a, b, colors.curve, 5);\ndot(X(a), Yt(f(a)), colors.ink, 10); dot(X(b), Yt(f(b)), colors.ink, 10);\ntag('A', X(a) - 14, Yt(f(a)) + 36, colors.ink, 'right'); tag('B', X(b) + 14, Yt(f(b)) - 14, colors.ink);\ntag('a', X(a), Yt(0.95) + 36, colors.ink, 'center'); tag('b', X(b), Yt(0.95) + 36, colors.ink, 'center');\nline(X(-0.2), Yb(0), X(4.4), Yb(0), colors.axis, 2);\ncurve(hh, Yb, a, b, colors.c2, 5);\ndot(X(a), Yb(0), colors.ink, 10); dot(X(b), Yb(0), colors.ink, 10);\ntag('a', X(a), Yb(0) + 36, colors.ink, 'center'); tag('b', X(b), Yb(0) + 36, colors.ink, 'center');\ntag('y = h(x)', X(4.35), Yb(1.45), colors.c2, 'right');\nline(X(c - 0.8), Yb(hh(c)), X(c + 0.8), Yb(hh(c)), colors.c2, 4, [12, 8]);\nline(X(c), Yb(0), X(c), Yt(f(c)), colors.muted, 2, [6, 6]);\ndot(X(c), Yb(hh(c)), colors.c2, 12);\ntag('c', X(c), Yb(0) + 36, colors.c2, 'center');\nif (local >= 3) {\n  line(X(c - 1.4), Yt(f(c) - 1.4 * m), X(c + 1.4), Yt(f(c) + 1.4 * m), colors.c1, 4, [12, 8]);\n  dot(X(c), Yt(f(c)), colors.c1, 12);\n  tag('slope f′(c)', X(c), Yt(f(c)) - 24, colors.c1, 'center');\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Example 3: $x^3-x$ on $[0,2]$}\n\\begin{columns}[8 4, parallel]\nLet $f(x)=x^3-x$. Find all numbers $c$ that satisfy the conclusion of the Mean Value Theorem on $[0,2]$.\n\\pause\n$f$ is a polynomial, so it is continuous on $[0,2]$ and differentiable on $(0,2)$.\n\\pause\n$f(2)=6$, $f(0)=0$, and $f'(x)=3x^2-1$. We need\n$$3c^2-1=\\frac{f(2)-f(0)}{2-0}=\\frac{6-0}{2}=3$$\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} $c^2=4/3$, so $c=\\pm2/\\sqrt3$. Only $c=2/\\sqrt3=1.154\\ldots$ lies in $(0,2)$.\n\\columnbreak\n\\begin{js}[size=400x780, alt=\"The graph of y = x^3 - x for x from -0.6 to 2.3. At the second step the secant line from O(0, 0) to B(2, 6) is drawn. At the last step the tangent line at x = c = 1.154... is drawn; it is parallel to the secant line.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -0.7, x1 = 2.4, yc = 2.84;                 // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x * x * x - x, c = 2 / Math.sqrt(3);\naxes(1, 1);\nclip();\npath((x) => x, f, x0, x1, colors.curve, 5);\nif (local >= 2) seg(-0.5, -1.5, 2.3, 6.9, colors.c1, 4);\nif (local >= 3) seg(c - 1.2, f(c) - 3.6, c + 1.2, f(c) + 3.6, colors.c2, 4, [12, 8]);\nctx.restore();\ndot(0, 0, colors.ink, 10); dot(2, 6, colors.ink, 10);\ntag('B', X(2) - 16, Y(6) + 6, colors.ink, 'right');\nif (local >= 3) { dot(c, f(c), colors.c2, 12); tag('c', X(c), Y(0) + 40, colors.c2, 'center'); }\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: Average and Instantaneous Velocity}\n\\begin{columns}[7 5, parallel]\nAn object moves along a line with position $s=f(t)$. From $t=a$ to $t=b$ its average velocity is $(f(b)-f(a))/(b-a)$. At $t=c$ its velocity is $f'(c)$.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} By the Mean Value Theorem, at some time $c$ between $a$ and $b$, the velocity equals the average velocity.\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} A car that travels 180 km in 2 hours has a speedometer reading of exactly 90 km/h at least once. The theorem gives the reading, not the time.\n\\pause\nAverage speed cameras time a car between two checkpoints. An average speed above the limit means the car exceeded the limit at some instant.\n\\columnbreak\n\\begin{js}[size=660x560, alt=\"The position s in kilometers of a car against the time t in hours, from (0, 0) to (2, 180), with the dashed secant line between the endpoints. At the second step, the two tangent lines parallel to the secant are drawn, at t = 0.5 and t = 1.5: at those times the velocity is exactly 90 km/h.\"]\nconst L = 90, R = 30, T = 20, B = 60;                 // margins in pixels\nconst x0 = -0.12, x1 = 2.25, y0 = -14, y1 = 200;      // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (t) => 90 * t + 25 * Math.sin(Math.PI * t);\naxes(0.5, 30, 0.5, 30);\nseg(0, 0, 2, 180, colors.c2, 4, [14, 9]);\npath((t) => t, f, 0, 2, colors.curve, 5);\ndot(0, 0, colors.ink, 10); dot(2, 180, colors.ink, 10);\nif (local >= 2) {\n  [0.5, 1.5].forEach((c) => {\n    seg(c - 0.4, f(c) - 36, c + 0.4, f(c) + 36, colors.c1, 4);\n    seg(c, 0, c, f(c), colors.c1, 2, [6, 6]); dot(c, f(c), colors.c1, 12);\n  });\n  tag('90 km/h', X(0.5) + 20, Y(f(0.5)) + 40, colors.c1);\n  tag('90 km/h', X(1.5) + 20, Y(f(1.5)) + 40, colors.c1);\n}\ntag('t (hours)', X(2.22), Y(0) - 14, colors.muted, 'right');\ntag('s (km)', X(0) + 14, Y(194), colors.muted);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 5: The Speedometer}\n\\begin{columns}[7 5, parallel]\nAt 2:00 pm a car's speedometer reads 30 mi/h. At 2:10 pm it reads 50 mi/h. Show that at some moment between, the acceleration is exactly 120 mi/h².\n\\pause\nLet $v(t)$ be the velocity in mi/h, $t$ hours after 2:00, and assume $v$ is differentiable. Ten minutes is $1/6$ hour, so $v(0)=30$ and $v(1/6)=50$.\n\\pause\nBy the Mean Value Theorem for $v$ on $[0,1/6]$, for some $c$ in $(0,1/6)$,\n$$v'(c)=\\frac{50-30}{1/6-0}=20\\cdot6=120.$$\n\\pause\nThe acceleration is exactly 120 mi/h² at time $c$: a \\textcolor{c4}{\\textbf{quantitative}} value, at a time we cannot locate.\n\\columnbreak\n\\begin{js}[size=640x560, alt=\"The velocity v in miles per hour against the time in minutes after 2:00, from (0, 30) to (10, 50), with the dashed secant line between the endpoints. At the last step the tangent line parallel to the secant is drawn, at 5 minutes after 2:00, where the acceleration is 120 miles per hour per hour.\"]\nconst L = 80, R = 30, T = 20, B = 60;                 // margins in pixels\nconst x0 = -0.8, x1 = 11.5, y0 = -4, y1 = 60;         // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst v = (t) => 30 + 2 * t + 4 * Math.sin(Math.PI * t / 10);\naxes(1, 5, 2, 10);\nseg(0, 30, 10, 50, colors.c2, 4, [14, 9]);\npath((t) => t, v, 0, 10, colors.curve, 5);\ndot(0, 30, colors.ink, 10); dot(10, 50, colors.ink, 10);\nif (local >= 3) {\n  seg(2.5, v(5) - 5, 7.5, v(5) + 5, colors.c1, 4);\n  seg(5, 0, 5, v(5), colors.c1, 2, [6, 6]); dot(5, v(5), colors.c1, 12);\n  tag('c', X(5), Y(0) + 34, colors.c1, 'center');\n}\ntag('minutes after 2:00', X(11.4), Y(0) - 14, colors.muted, 'right');\ntag('v (mi/h)', X(0) + 14, Y(57), colors.muted);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 6: How Large Can $f(2)$ Be?}\n\\begin{columns}[7 5, parallel]\nSuppose $f(0)=-3$ and $f'(x)\\le5$ for all $x$. How large can $f(2)$ possibly be?\n\\pause\n$f$ is differentiable everywhere, so it is also continuous. By the Mean Value Theorem on $[0,2]$, for some $c$ in $(0,2)$,\n$$f(2)-f(0)=f'(c)(2-0)$$\n\\pause\n$$f(2)=-3+2f'(c)\\le-3+2\\cdot5=7$$\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} The largest possible value is $7$, attained by $f(x)=5x-3$. We never find $c$: a bound on $f'$ at every point turns the existence of $c$ into a bound on $f(2)$.\n\\columnbreak\n\\begin{js}[size=560x700, alt=\"Several graphs start at the point (0, -3), each with slope at most 5. At the third step the line y = 5x - 3, of slope 5, is drawn through (0, -3); every one of the graphs stays on or below it, and at x = 2 the line reaches the point (2, 7). The vertical scale is compressed.\"]\nconst L = 56, R = 20, T = 20, B = 30;                 // margins in pixels\nconst x0 = -0.5, x1 = 2.6, y0 = -5, y1 = 9;           // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst G = [(x) => -3 + 3 * x + 0.5 * Math.sin(3 * x), (x) => -3 + 4 * x - 0.5 * x * x, (x) => -3 + x * x, (x) => -3 + 1.2 * x];\naxes(0.5, 1, 1, 2);\nif (local >= 3) { poly([[0, -3], [2, 7], [2, y0], [0, y0]], colors.pale, 0.45); }\nG.forEach((g) => path((x) => x, g, 0, 2, colors.curve, 4));\nif (local >= 3) {\n  seg(0, -3, 2.3, 8.5, colors.c1, 5);\n  seg(2, 0, 2, 7, colors.c1, 2, [6, 6]); dot(2, 7, colors.c1, 12);\n  tag('(2, 7)', X(2) - 16, Y(7) - 8, colors.c1, 'right');\n  tag('slope 5', X(1.15), Y(3.6) - 12, colors.c1, 'right');\n}\ndot(0, -3, colors.ink, 11);\ntag('(0, −3)', X(0) + 16, Y(-3) + 36, colors.ink);\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 3}\n\\begin{youtry}[time=none]{The Mean Value Theorem}\nIs there a function $f$, differentiable for all $x$, with $f(0)=-1$, $f(2)=4$, and\\\\ $f'(x)\\le2$ for all $x$? Discuss your answer with a neighboring student.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 3: Solution}\n\\begin{columns}[7 5, parallel]\n\\textbf{Problem.} Is there a differentiable $f$ with $f(0)=-1$, $f(2)=4$, and $f'(x)\\le2$ for all $x$?\n\\pause\nIf there were such a function, the Mean Value Theorem on $[0,2]$ would give a number $c$ in $(0,2)$ with\n$$f'(c)=\\frac{f(2)-f(0)}{2-0}=\\frac{4-(-1)}{2}=2.5.$$\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} But $f'(x)\\le2$ for all $x$, and $2.5>2$. So there is no such function.\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} With slope at most $2$, the graph rises at most $2\\cdot2=4$ units from $x=0$ to $x=2$, so $f(2)\\le-1+4=3$.\n\\columnbreak\n\\begin{js}[size=560x620, alt=\"The starting point (0, -1), and the required point (2, 4) drawn as an open red circle. At the last step the line of slope 2 through (0, -1) is drawn, with the region below it shaded: a graph with slope at most 2 stays in this region and reaches at most (2, 3), below (2, 4). The vertical scale is compressed.\"]\nconst L = 56, R = 20, T = 20, B = 46;                 // margins in pixels\nconst x0 = -0.5, x1 = 2.6, y0 = -2.5, y1 = 5.2;       // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\naxes(0.5, 1, 1, 1);\nif (local >= 3) {\n  poly([[0, -1], [2.6, 4.2], [2.6, y0], [0, y0]], colors.pale, 0.45);\n  seg(0, -1, 2.6, 4.2, colors.c1, 5);\n  seg(2, 0, 2, 3, colors.c1, 2, [6, 6]); dot(2, 3, colors.c1, 12);\n  tag('(2, 3)', X(2) + 16, Y(3) + 34, colors.c1);\n  tag('slope 2', X(1.0) + 14, Y(1) + 36, colors.c1);\n}\ndot(0, -1, colors.ink, 11); tag('(0, −1)', X(0) + 16, Y(-1) + 36, colors.ink);\nring(2, 4, colors.c2, 12); tag('(2, 4)', X(2) - 18, Y(4) + 10, colors.c2, 'right');\n\\end{js}\n\\end{columns}\n\n\\section{Functions with Equal Derivatives}\n\n\\slide{Zero Derivative Means Constant}\n\\begin{theorem}{Theorem}\nIf $f'(x)=0$ for all $x$ in an interval $(a,b)$, then $f$ is constant on $(a,b)$.\n\\end{theorem}\n\\pause\n\\textbf{Proof.} Let $x_1$ and $x_2$ be any two numbers in $(a,b)$ with $x_1<x_2$. Since $f$ is differentiable on $(a,b)$, it is continuous on $[x_1,x_2]$ and differentiable on $(x_1,x_2)$.\n\\pause\nBy the Mean Value Theorem, there is a number $c$ between $x_1$ and $x_2$ such that\n$$f(x_2)-f(x_1)=f'(c)(x_2-x_1).$$\n\\pause\nSince $f'(c)=0$, we get $f(x_2)=f(x_1)$. Any two values of $f$ on $(a,b)$ are equal, so $f$ is constant.\n\\pause\nIn physics: an object whose velocity is $0$ at every instant does not move.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} The theorem says $f$ is constant, but not which constant. \\\\ One value of $f$ determines it.\n\n\\slide{Equal Derivatives}\n\\begin{columns}[6 6, parallel]\n\\begin{theorem}{Corollary}\nIf $f'(x)=g'(x)$ for all $x$ in an interval $(a,b)$, then $f-g$ is constant on $(a,b)$. That is, $f(x)=g(x)+C$ for some constant $C$.\n\\end{theorem}\n\\pause\n\\textbf{Proof.} Let $F(x)=f(x)-g(x)$. Then $F'(x)=f'(x)-g'(x)=0$ for all $x$ in the interval. By the theorem, $F$ is constant.\n\\pause\nGraphs of functions with equal derivatives on an interval are vertical shifts of each other. The size of the shift, $C$, is a quantitative question: one value of $f-g$ determines it.\n\\columnbreak\n\\begin{js}[size=760x700, alt=\"Several graphs of y = x^3/3 - x + C for different constants C, which are vertical shifts of each other. One highlighted graph slides up and down. Short tangent segments at x = -1.5 and x = 0.5 on every graph are parallel, because all the functions have the same derivative x^2 - 1.\"]\nconst L = 16, R = 16, T = 16, B = 16; {c4}{\\textbf{Quantitative.}} $f'(x)=4x-4=0$ when $x=1$, which lies in $(-1,3)$. So $c=1$.\n\\columnbreak\n\\begin{js}[size=520x700, alt=\"The parabola y = 2x^2 - 4x + 5 for x from -1 to 3, with the endpoints (-1, 11) and (3, 11) at equal heights. At the last step the lowest point (1, 3) is marked with its horizontal tangent line. The vertical scale is compressed.\"]\nconst L = 56, R = 20, T = 20, B = 46;                 // margins in pixels\nconst x0 = -1.6, x1 = 3.6, y0 = -1, y1 = 12.5;        // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 2 * x * x - 4 * x + 5;\naxes(1, 1, 1, 100);                                   // tick numbers on the y-axis are drawn at the right\nctx.font = font(26); ctx.fillStyle = colors.text; ctx.textAlign = 'right';\nfor (let k = 2; k <= 12; k += 2) ctx.fillText(String(k), X(3.55), Y(k) + 9);\nctx.textAlign = 'left';\nseg(-1, 11, 3, 11, colors.muted, 2, [10, 7]);\npath((x) => x, f, -1, 3, colors.curve, 5);\ndot(-1, 11, colors.ink, 10); dot(3, 11, colors.ink, 10);\nif (local >= 3) { seg(0.1, 3, 1.9, 3, colors.c2, 4); dot(1, 3, colors.c2, 12); }\n\\end{js}\n\\end{columns}\n\n\\slide{Example 9: $\\sqrt x$ on $[0,4]$}\n\\begin{columns}[7 5, parallel]\nFind all numbers $c$ that satisfy the conclusion of the Mean Value Theorem for $f(x)=\\sqrt x$ on $[0,4]$.\n\\pause\n$\\sqrt x$ is continuous on $[0,4]$ and differentiable on $(0,4).$ It is not differentiable at $0,$ but the theorem asks only about the open interval.\n\\pause\n$$\\frac{f(4)-f(0)}{4-0}=\\frac{2-0}{4}=0.5$$\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} $f'(c)=1/(2\\sqrt c)=0.5$ when $\\sqrt c=1$, that is, when $c=1$.\n\\columnbreak\n\\begin{js}[size=620x420, alt=\"The graph of y = square root of x for x from 0 to 4. At the second step the secant line from (0, 0) to (4, 2) is drawn. At the last step the tangent line at (1, 1) is drawn, parallel to the secant line.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in .pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\naxes(0.5, 1);\nclip();\npath((x) => x, Math.sqrt, 0, 4.6, colors.curve, 5);\nif (local >= 2) seg(-0.4, -0.2, 4.6, 2.3, colors.c1, 4);\nif (local >= 3) seg(-0.4, 0.3, 3.6, 2.3, colors.c2, 4, [12, 8]);\nctx.restore();\ndot(0, 0, colors.ink, 10); dot(4, 2, colors.ink, 10);\nif (local >= 3) dot(1, 1, colors.c2, 12);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 10: Bounds from the Derivative}\n\\begin{columns}[7 5, parallel]\nSuppose $3\\le f'(x)\\le5$ for all $x$. What values can $f(8)-f(2)$ have?\n\\pause\nBy the Mean Value Theorem on $[2,8]$, for some $c$ in $(2,8)$,\n$$f(8)-f(2)=f'(c)(8-2)=6f'(c).$$\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} Since $3\\le f'(c)\\le5$,\n$$18\\le f(8)-f(2)\\le30.$$\n\\columnbreak\n\\begin{js}[size=560x640, alt=\"Starting from a point above x = 2, two lines are drawn, of slopes 3 and 5, enclosing a shaded wedge. A graph with slopes between 3 and 5 stays inside the wedge. Above x = 8, the wedge runs from 18 to 30 units above the starting height. The vertical scale is compressed.\"]\nconst L = 56, R = 20, T = 20, B = 46;                 // margins in pixels\nconst x0 = -0.3, x1 = 9, y0 = -3, y1 = 34;            // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy xample 11: A Tied Race}\n\\begin{columns}[7 5, parallel]\nTwo runners start a race at the same time and finish in a tie. Explain why at some time during the race they have the same velocity.\n\\pause\nLet $f(t)$ and $g(t)$ be their positions at time $t$, assumed differentiable, with the start at $t=0$ and the finish at $t=T$. Let $h(t)=f(t)-g(t)$.\n\\pause\nThey start together and finish together, so $h(0)=0$ and $h(T)=0$.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} By Rolle's Theorem, $h'(c)=0$ for some $c$ in $(0,T).$ Then $f'(c)=g'(c)$: at time $c$ their velocities are equal.\n\\columnbreak\n\\begin{js}[size=600x600, alt=\"The positions in meters of two runners against time in seconds, over a 10-second, 100-meter race. Both start at (0, 0) and finish at (10, 100); one is ahead throughout the middle of the race. At the last step, the gap between them at t = 5, where it is largest, is marked, and the tangent lines there are drawn on both graphs; they are parallel.\"]\nconst L = 80, R = 20, T = 20, B = 60;                 // margins in pixels\nconst x0 = -0.6, x1 = 11, y0 = -8, y1 = 112;          // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(
