<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="generator" content="lecture-engine 2.0.0-dev"><title>Lecture 14: The Mean Value Theorem</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}</style></head><body><main id="wrap"><div id="stage"></div></main><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="\\engine{2}\n\\title{Lecture 14: The Mean Value Theorem}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{October 21, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\\footer{section}\n\n\\titleslide\n\n\\slide[valign=center, align=center]{Today}\n\\heading{Rolle's Theorem}\nBetween two equal values, a horizontal tangent line.\n\\medskip\n\\heading{The Mean Value Theorem}\nA tangent line parallel to the secant line.\n\\medskip\n\\heading{Consequences}\nFunctions whose derivatives are equal.\n\\medskip\n\\heading{Two Kinds of Conclusions}\nQualitative: what must happen. Quantitative: how much, or where.\n\n\\section{Rolle's Theorem}\n\n\\slide{A Question About Driving}\n\\begin{columns}[5 7, parallel]\nA car travels 180 km in 2 hours. Its average velocity is\n$$\\frac{180\\text{ km}}{2\\text{ h}}=90\\text{ km/h}.$$\n\\pause\nMust the speedometer read exactly 90 km/h at some moment?\n\\pause\nToday's main theorem says yes.\n\\columnbreak\n\\begin{js}[size=900x600, alt=\"The position s in kilometers of a car against the time t in hours, from t = 0 to t = 2. The graph rises from (0, 0) to (2, 180), steeply in the first hour and more slowly in the second. A dashed secant line joins the two endpoints; its slope is the average velocity, 90 km/h.\"]\nconst L = 90, R = 30, T = 20, B = 60;                 // margins in pixels\nconst x0 = -0.12, x1 = 2.25, y0 = -14, y1 = 200;      // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (t) => 90 * t + 25 * Math.sin(Math.PI * t);\naxes(0.5, 30, 0.5, 30);\nseg(0, 0, 2, 180, colors.c2, 4, [14, 9]);\npath((t) => t, f, 0, 2, colors.curve, 5);\ndot(0, 0, colors.ink, 10); dot(2, 180, colors.ink, 10);\ntag('average velocity', X(1.25), Y(78), colors.c2);\ntag('90 km/h', X(1.25), Y(60), colors.c2);\ntag('t (hours)', X(2.22), Y(0) - 14, colors.muted, 'right');\ntag('s (km)', X(0) + 14, Y(194), colors.muted);\n\\end{js}\n\\end{columns}\n\n\\slide{Two Kinds of Conclusions}\n\\begin{columns}[1 1]\n\\heading{\\textcolor{c3}{Qualitative}}\nWhat must happen, or what kind of behavior occurs.\n\\begin{itemize}[tight]\n\\item $12+4x-x^2$ has a maximum value on $[0,5]$. (Extreme Value Theorem)\n\\item $x^3+x-1=0$ has exactly one real solution.\n\\item At some moment, the car's velocity equals its average velocity.\n\\end{itemize}\n\\columnbreak\n\\heading{\\textcolor{c4}{Quantitative}}\nHow much, or where: a number, or a bound on a number.\n\\begin{itemize}[tight]\n\\item The maximum value is $16$, at $x=2$. (Closed Interval Method)\n\\item The solution is $x=0.682\\ldots$\n\\item The average velocity is $90$ km/h.\n\\end{itemize}\n\\end{columns}\n\\pause\nRolle's Theorem and the Mean Value Theorem guarantee that a number $c$ exists: a qualitative conclusion. Combined with formulas or estimates, they also give quantitative ones.\n\n\\slide{Qualitative or Quantitative?}\n\\begin{enumerate}\n\\item $\\lim_{x\\to2}(x^2+1)=5$. \\\\ \\uncover<1->{\\textcolor{c4}{\\textbf{Quantitative.}} It gives a number: the value of the limit.}\n\\item $f(x)=x^3+x$ is continuous at every number. \\\\ \\uncover<2->{\\textcolor{c3}{\\textbf{Qualitative.}} It describes a property of $f$. There is no number to find.}\n\\item The graph of $y=|x|$ has no tangent line at $(0,0)$. \\\\ \\uncover<3->{\\textcolor{c3}{\\textbf{Qualitative.}} It describes a feature of the graph.}\n\\item The tangent line to $y=x^2$ at $(1,1)$ has slope $2$. \\\\ \\uncover<4->{\\textcolor{c4}{\\textbf{Quantitative.}} It gives a number: the slope.}\n\\end{enumerate}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 1}\n\\begin{youtry}[time=none]{Qualitative or Quantitative?}\n\\textbf{Label each conclusion qualitative or quantitative.}\n\\begin{enumerate}[tight]\n\\item The equation $x^5+x-3=0$ has exactly one real solution.\n\\item The maximum value of $f(x)=12+4x-x^2$ on $[0,5]$ is $16$.\n\\item A ball thrown straight up is at rest at some instant.\n\\item If $f(0)=-3$ and $f'(x)\\le5$ for all $x$, then $f(2)\\le7$.\n\\item The linearization of $\\sqrt x$ at $x=4$ estimates $\\sqrt{4.1}$ by $2.025$.\n\\item The equation $x^3-2x-1=0$ has a solution between $1$ and $2$.\n\\end{enumerate}\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 1: Solution}\nLabel each conclusion qualitative or quantitative.\n\\begin{enumerate}\n\\item[1.] The equation $x^5+x-3=0$ has exactly one real solution. \\\\ \\uncover<1->{\\textcolor{c3}{\\textbf{Qualitative.}} It says how many solutions there are, not what the solution is.}\n\\item[2.] The maximum value of $f(x)=12+4x-x^2$ on $[0,5]$ is $16$. \\\\ \\uncover<2->{\\textcolor{c4}{\\textbf{Quantitative.}} It gives the maximum value, $16$.}\n\\item[3.] A ball thrown straight up is at rest at some instant. \\\\ \\uncover<3->{\\textcolor{c3}{\\textbf{Qualitative.}} We are not told when, or how high the ball is.}\n\\end{enumerate}\n\n\\slide{You Try 1: Solution, Continued}\n\\begin{enumerate}\n\\item[4.] If $f(0)=-3$ and $f'(x)\\le5$ for all $x$, then $f(2)\\le7$. \\\\ \\uncover<1->{\\textcolor{c4}{\\textbf{Quantitative.}} It gives a numerical bound on $f(2)$.}\n\\item[5.] The linearization of $\\sqrt x$ at $x=4$ estimates $\\sqrt{4.1}$ by $2.025$. \\\\ \\uncover<2->{\\textcolor{c4}{\\textbf{Quantitative.}} It gives a number, an estimate of $\\sqrt{4.1}$.}\n\\item[6.] The equation $x^3-2x-1=0$ has a solution between $1$ and $2$. \\\\ \\uncover<3->{\\textcolor{c3}{\\textbf{Mostly qualitative.}} It says a solution exists, and also roughly where.}\n\\end{enumerate}\n\\\\[0.2em]\n\\begin{uncover}<4->\n\\heading{The Line Is Not Always Sharp}\nMany conclusions mix the two. “Some $c$ in $(a,b)$” says that $c$ exists, and roughly where. Narrowing the interval turns it into a quantitative statement: \\\\ the solution in 6 is $(1+\\sqrt5)/2=1.618\\ldots$\n\\end{uncover}\n\n\\slide{Rolle's Theorem}\n\\begin{theorem}{Rolle's Theorem}\nLet $f$ be a function that satisfies the following three hypotheses:\n\\begin{enumerate}[tight]\n\\item $f$ is continuous on the closed interval $[a,b]$.\n\\item $f$ is differentiable on the open interval $(a,b)$.\n\\item $f(a)=f(b)$.\n\\end{enumerate}\nThen there is a number $c$ in $(a,b)$ such that $f'(c)=0$.\n\\end{theorem}\n\\begin{js}[size=1640x320, alt=\"Four functions on intervals from a to b with equal values at a and b. First, a constant function, where every c works. Second, a hump with a horizontal tangent at its top, at c. Third, a hump and then a dip, with horizontal tangents at c1 and c2. Fourth, a dip with a horizontal tangent at its bottom, at c. At the second step the horizontal tangent lines and the numbers c are drawn.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst S = 80;                                         // pixels per unit in every panel\nfunction hermite(P) {                                 // the cubic Hermite curve through [x, y, slope] points\n  return (x) => {\n    let i = 0;\n    while (i < P.length - 2 && x > P[i + 1][0]) i++;\n    const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n  };\n}\nfunction panel(ox, f, marks) {                        // the graph over [0, 4], with the numbers c marked\n  const oy = 262, X = (x) => ox + (x + 0.3) * S, Y = (y) => oy - y * S;\n  const line = (ax, ay, bx, by, color, width, dash) => {\n    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);\n    ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n  };\n  const dot = (x, y, color, r) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r, 0, 2 * Math.PI); ctx.fill(); };\n  const label = (text, x, color) => { ctx.font = font(28); ctx.textAlign = 'center'; ctx.fillStyle = color; ctx.fillText(text, X(x), oy + 40); };\n  line(-0.3, 0, 4.3, 0, colors.axis, 2);\n  line(0, 0, 0, f(0), colors.muted, 2, [6, 6]); line(4, 0, 4, f(4), colors.muted, 2, [6, 6]);\n  if (local >= 1) marks.forEach((c) => { line(c[0], 0, c[0], f(c[0]), colors.c1, 2, [6, 6]); line(c[0] - 0.8, f(c[0]), c[0] + 0.8, f(c[0]), colors.c2, 4); });\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = 4 * i / 300; if (i) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  dot(0, f(0), colors.ink, 8); dot(4, f(4), colors.ink, 8);\n  label('a', 0, colors.ink); label('b', 4, colors.ink);\n  if (local >= 1) marks.forEach((c) => { dot(c[0], f(c[0]), colors.c1, 11); label(c[1], c[0], colors.c1); });\n  ctx.textAlign = 'left';\n}\npanel(10, () => 1.6, [[1.3, 'c₁'], [2.7, 'c₂']]);\npanel(420, hermite([[0, 1.1, 1.5], [2.2, 2.6, 0], [4, 1.1, -2]]), [[2.2, 'c']]);\npanel(830, hermite([[0, 1.4, 2], [1.2, 2.6, 0], [2.8, 0.7, 0], [4, 1.4, 1.5]]), [[1.2, 'c₁'], [2.8, 'c₂']]);\npanel(1240, hermite([[0, 2.2, -1.5], [2, 0.7, 0], [4, 2.2, 1.5]]), [[2, 'c']]);\n\\end{js}\n\n\\slide{Proof of Rolle's Theorem}\n\\begin{columns}[7 5, parallel]\nBy the Extreme Value Theorem (hypothesis 1), $f$ attains an absolute maximum value and an absolute minimum value on $[a,b]$.\n\\pause\n\\textbf{Case 1: both occur at endpoints.} Since $f(a)=f(b)$, the maximum and minimum values are equal, so $f$ is constant. Then $f'(c)=0$ for every $c$ in $(a,b)$.\n\\pause\n\\textbf{Case 2: one occurs at a number $c$ in $(a,b)$.} Then $f$ has a local maximum or minimum at $c$, and $f'(c)$ exists by hypothesis 2. By Fermat's Theorem, $f'(c)=0$.\n\\columnbreak\n\\begin{js}[size=640x600, alt=\"Step 0: a function on the interval from a to b with equal values at a and b, marked by a dashed level line. Step 1, Case 1: a constant function, whose maximum and minimum values are equal. Step 2, Case 2: a function whose maximum occurs at a number c strictly between a and b, where the tangent line is horizontal.\"]\nconst L = 16, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.4, x1 = 4.4, yc = 1.6;                  // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction hermite(P) {                                 // the cubic Hermite curve through [x, y, slope] points\n  return (x) => {\n    let i = 0;\n    while (i < P.length - 2 && x > P[i + 1][0]) i++;\n    const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n  };\n}\nconst curves = [hermite([[0, 1.5, 2], [1.4, 2.8, 0], [2.9, 0.6, 0], [4, 1.5, 1.2]]),\n  () => 1.5, hermite([[0, 1.5, 1.2], [2.6, 3, 0], [4, 1.5, -2.5]])];\nconst f = curves[Math.min(local, 2)];\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2);\nseg(0, 0, 0, f(0), colors.muted, 2, [6, 6]); seg(4, 0, 4, f(4), colors.muted, 2, [6, 6]);\nseg(0, 1.5, 4, 1.5, colors.muted, 2, [10, 7]);\npath((x) => x, f, 0, 4, colors.curve, 5);\ndot(0, 1.5, colors.ink, 10); dot(4, 1.5, colors.ink, 10);\ntag('a', X(0), Y(0) + 40, colors.ink, 'center'); tag('b', X(4), Y(0) + 40, colors.ink, 'center');\nif (local === 1) tag('max value = min value', X(2), Y(2.3), colors.c1, 'center');\nif (local === 2) {\n  seg(2.6, 0, 2.6, 3, colors.c1, 2, [6, 6]); seg(1.7, 3, 3.5, 3, colors.c2, 4);\n  dot(2.6, 3, colors.c1, 12); tag('c', X(2.6), Y(0) + 40, colors.c1, 'center');\n  tag('local max at c', X(2.6), Y(3) - 22, colors.c1, 'center');\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Example 1: A Ball Thrown Upward}\n\\begin{columns}[6 6, parallel]\nA ball is thrown straight up at 19.6 m/s. Its height after $t$ seconds is\\\\ $s(t)=19.6t-4.9t^2$ meters.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} $s(0)=0$ and $s(4)=78.4-78.4=0$: the ball returns to where it started. By Rolle's Theorem, $s'(c)=0$ for some $c$ in $(0,4)$. At that instant the velocity is $0$.\n\\pause\n\\textcolor{c4}{\\textbf{Quantitative.}} Here $s'(t)=19.6-9.8t=0$ exactly when $t=2$, at the top of the flight, where $s(2)=19.6$ m.\n\\columnbreak\n\\begin{js}[size=800x600, alt=\"The height s in meters of a ball against the time t in seconds, a downward parabola from (0, 0) up to (2, 19.6) and back down to (4, 0). At the first step the two endpoints, where the height is 0, are marked. At the second step the top point (2, 19.6) is marked with a horizontal tangent line: the velocity there is 0.\"]\nconst L = 80, R = 30, T = 30, B = 60;                 // margins in pixels\nconst x0 = -0.3, x1 = 5.0, y0 = -2.5, y1 = 23;        // the window; the axes carry different units\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x * x * x + x - 1;\naxes(0.5, 1);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); ctx.restore();\nif (local >= 1) {\n  dot(0, -1, colors.c2, 12); dot(1, 1, colors.c1, 12);\n  tag('f(0) = −1', X(0) + 18, Y(-1) + 10, colors.c2);\n  tag('f(1) = 1', X(1) - 18, Y(1) - 18, colors.c1, 'right');\n  dot(0.6823278, 0, colors.ink, 10);\n}\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2, Continued}\n\\begin{columns}[7 5, parallel]\nBut\n$$f'(x)=3x^2+1\\ge1\\quad\\text{for all }x,$$\nso $f'(x)$ is never $0$.\n\\pause\nThis contradiction shows that $f$ cannot have two zeros. The equation has exactly one real solution.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative.}} This tells us how many solutions there are, not what the solution is. Its value, $0.682\\ldots,$ is a quantitative question.\n\\columnbreak\n\\begin{js}[size=600x640, alt=\"The graph of y = x^3 + x - 1, with a tangent line that slides back and forth along the curve. A readout shows the slope of the tangent line, 3x^2 + 1, which never drops below 1.\"]\nconst L = 56, R = 16, T = 16, B = 46;                 // margins in pixels\nconst x0 = -1.5, x1 = 1.6, yc = 0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 0.15 * x * (x - 2) * (x - 5);\nconst c1 = (14 - Math.sqrt(76)) / 6, c2 = (14 + Math.sqrt(76)) / 6;\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); ctx.restore();\n[0, 2, 5].forEach((z) => { dot(z, 0, colors.ink, 10); tag(String(z), X(z), Y(0) + 40, colors.ink, 'center'); });\nif (local >= 1) { seg(c1 - 0.8, f(c1), c1 + 0.8, f(c1), colors.c2, 4); dot(c1, f(c1), colors.c2, 12); tag('c₁', X(c1), Y(f(c1)) - 22, colors.c2, 'center'); }\nif (local >= 2) { seg(c2 - 0.8, f(c2), c2 + 0.8, f(c2), colors.c2, 4); dot(c2, f(c2), colors.c2, 12); tag('c₂', X(c2), Y(f(c2)) + 46, colors.c2, 'center'); }\n\\end{js}\n\\end{columns}\n\n\\section{The Mean Value Theorem}\n\n\\slide{The Mean Value Theorem}\n\\begin{theorem}{The Mean Value Theorem}\nLet $f$ be continuous on the closed interval $[a,b]$ and differentiable on the open interval $(a,b)$. Then there is a number $c$ in $(a,b)$ such that\n$$f'(c)=\\frac{f(b)-f(a)}{b-a}$$\nor, equivalently,\n$$f(b)-f(a)=f'(c)(b-a).$$\n\\end{theorem}\n\\pause\nWhen $f(a)=f(b)$, this is Rolle's Theorem.\n\\pause\n\\textcolor{c3}{\\textbf{Qualitative:}} $c$ exists, but the theorem does not say where. \\textcolor{c4}{\\textbf{Quantitative:}} the slope $f'(c)$ is known exactly.\n\n\\slide{What the Mean Value Theorem Says}\n\\begin{columns}[5 7, parallel]\nThe secant line through $A(a,f(a))$ and $B(b,f(b))$ has slope\n$$\\frac{f(b)-f(a)}{b-a}.$$\n\\pause\n$f'(c)$ is the slope of the tangent line at $P(c,f(c))$. The theorem says that at some point $P$, the tangent line is parallel to the secant line $AB$.\n\\pause\nSlide a line parallel to $AB$ toward the graph until it first touches. There may be more than one such point.\n\\columnbreak\n\\begin{js}[size=900x640, alt=\"A graph from A to B that rises, falls, and rises again, with the secant line AB. At the first step, a line parallel to AB slides down from above until it touches the graph at a point P1, where it is the tangent line. At the second step, a second parallel line slides up from below until it touches the graph at P2.\"]\nconst L = 16, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.2, x1 = 5.4, yc = 1.75;                 // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction hermite(P) {                                 // the cubic Hermite curve through [x, y, slope] points\n  return (x) => {\n    let i = 0;\n    while (i < P.length - 2 && x > P[i + 1][0]) i++;\n    const a = P[i], b = P[i + 1], d = b[0] - a[0], t = (x - a[0]) / d, t2 = t * t, t3 = t2 * t;\n    return (2 * t3 - 3 * t2 + 1) * a[1] + (t3 - 2 * t2 + t) * d * a[2] + (3 * t2 - 2 * t3) * b[1] + (t3 - t2) * d * b[2];\n  };\n}\nconst a = 0.5, b = 4.8, f = hermite([[0.5, 0.6, 3], [1.8, 2.8, 0], [3.4, 1.3, 0], [4.8, 3.1, 2.5]]);\nconst m = (f(b) - f(a)) / (b - a), gap = (x) => f(x) - f(a) - m * (x - a);\nlet p1 = a, p2 = a;                                   // where the gap is largest and smallest\nfor (let i = 0; i <= 2000; i++) { const x = a + (b - a) * i / 2000; if (gap(x) > gap(p1)) p1 = x; if (gap(x) < gap(p2)) p2 = x; }\nconst line = (x, k, color, width) => seg(x0, f(a) + m * (x0 - a) + k, x1, f(a) + m * (x1 - a) + k, color, width);\nfunction scene(k1, k2) {                              // k1, k2: heights of the moving lines above the secant\n  ctx.clearRect(0, 0, w, h);\n  grid(0.5);\n  seg(x0, 0, x1, 0, colors.axis, 2);\n  clip();\n  line(0, 0, colors.c1, 4);\n  if (k1 !== null) line(0, k1, colors.c2, 4);\n  if (k2 !== null) line(0, k2, colors.c2, 4);\n  path((x) => x, f, a, b, colors.curve, 5);\n  ctx.restore();\n  dot(a, f(a), colors.ink, 10); dot(b, f(b), colors.ink, 10);\n  tag('A', X(a) - 14, Y(f(a)) + 8, colors.ink, 'right'); tag('B', X(b) + 16, Y(f(b)) + 8, colors.ink);\n  tag('a', X(a), Y(0) + 40, colors.ink, 'center'); tag('b', X(b), Y(0) + 40, colors.ink, 'center');\n  if (k1 !== null && Math.abs(k1 - gap(p1)) < 1e-3) {\n    seg(p1, 0, p1, f(p1), colors.c2, 2, [6, 6]); dot(p1, f(p1), colors.c2, 12);\n    tag('P₁', X(p1), Y(f(p1)) - 22, colors.c2, 'center'); tag('c₁', X(p1), Y(0) + 40, colors.c2, 'center');\n  }\n  if (k2 !== null && Math.abs(k2 - gap(p2)) < 1e-3) {\n    seg(p2, 0, p2, f(p2), colors.c2, 2, [6, 6]); dot(p2, f(p2), colors.c2, 12);\n    tag('P₂', X(p2) + 18, Y(f(p2)) + 36, colors.c2); tag('c₂', X(p2), Y(0) + 40, colors.c2, 'center');\n  }\n}\nonFrame((t) => {\n  const u = Math.min(t / 1.6, 1), e = 1 - Math.pow(1 - u, 3);\n  if (local === 0) scene(null, null);\n  if (local === 1) scene(gap(p1) + 1.6 * (1 - e), null);\n  if (local >= 2) scene(gap(p1), gap(p2) - 1.6 * (1 - e));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Proof of the Mean Value Theorem}\n\\begin{columns}[7 5, parallel]\nLet $h$ be the difference between $f$ and the function whose graph is the secant line $AB$:\n$$h(x)=f(x)-f(a)-\\frac{f(b)-f(a)}{b-a}(x-a)$$\n\\pause\n$h$ is continuous on $[a,b]$ and differentiable on $(a,b)$, because $f$ is, and so is the secant line.\n\\pause\n\\begin{align}\nh(a)&=f(a)-f(a)-0=0 \\\\\nh(b)&=f(b)-f(a)-(f(b)-f(a))=0\n\\end{align}\n\\columnbreak\n\\begin{js}[size=660x760, alt=\"Top: a function f from A to B and the secant line AB, with a vertical segment at x showing the gap h(x) between the graph and the secant line. Bottom: the graph of h on the same interval. At the first step, x sweeps from a to b, and the graph of h is traced out below as the height of the gap. At the second step, the points where h is 0, at a and b, are marked.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = 120, a = 0.4, b = 4.0;                      // pixels per unit, the same on both axes and both panels\nconst X = (x) => 30 + (x + 0.2) * s;\nconst Yt = (y) => 60 + (3.45 - y) * s, Yb = (y) => 690 - y * s;\nconst P = [[0.4, 2.0, 1.8], [2.0, 3.25, 0], [4.0, 1.3, -1.6]];\nfunction f(x) {                                       // the cubic Hermite curve through P\n  let i = 0;\n  while (i < P.length - 2 && x > P[i + 1][0]) i++;\n  const p = P[i], q = P[i + 1], d = q[0] - p[0], t = (x - p[0]) / d, t2 = t * t, t3 = t2 * t;\n  return (2 * t3 - 3 * t2 + 1) * p[1] + (t3 - 2 * t2 + t) * d * p[2] + (3 * t2 - 2 * t3) * q[1] + (t3 - t2) * d * q[2];\n}\nconst m = (f(b) - f(a)) / (b - a), sec = (x) => f(a) + m * (x - a), hh = (x) => f(x) - sec(x);\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction curve(g, Yf, t0, t1, color, width) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = t0 + (t1 - t0) * i / 300; if (i) ctx.lineTo(X(x), Yf(g(x))); else ctx.moveTo(X(x), Yf(g(x))); }\n  ctx.stroke();\n}\nfunction dot(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction scene(xs) {                                  // xs: the current x, or null; h is traced from a to xs\n  ctx.clearRect(0, 0, w, h);\n  line(X(-0.2), Yt(0.95), X(4.4), Yt(0.95), colors.axis, 2);\n  line(X(0.1), Yt(sec(0.1)), X(4.3), Yt(sec(4.3)), colors.c1, 4);\n  curve(f, Yt, a, b, colors.curve, 5);\n  dot(X(a), Yt(f(a)), colors.ink, 10); dot(X(b), Yt(f(b)), colors.ink, 10);\n  tag('A', X(a) - 14, Yt(f(a)) + 36, colors.ink, 'right'); tag('B', X(b) + 14, Yt(f(b)) - 14, colors.ink);\n  tag('y = f(x)', X(2.3), Yt(3.25) - 18, colors.curve, 'center');\n  const xm = xs === null ? 1.4 : xs;\n  if (xm < b - 1e-6) {\n    line(X(xm), Yt(sec(xm)), X(xm), Yt(f(xm)), colors.c2, 6);\n    tag('h(x)', X(xm) + 12, Yt((f(xm) + sec(xm)) / 2) + 10, colors.c2);\n    tag('x', X(xm), Yt(0.95) + 36, colors.c2, 'center');\n  }\n  tag('a', X(a), Yt(0.95) + 36, colors.ink, 'center'); tag('b', X(b), Yt(0.95) + 36, colors.ink, 'center');\n  if (xs !== null) {\n    line(X(-0.2), Yb(0), X(4.4), Yb(0), colors.axis, 2);\n    tag('y = h(x)', X(4.35), Yb(1.45), colors.c2, 'right');\n    curve(hh, Yb, a, xs, colors.c2, 5);\n    line(X(xs), Yb(0), X(xs), Yb(hh
