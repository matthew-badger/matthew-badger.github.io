<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 4: Derivatives and Rates of Change</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="% MATH 1131Q Calculus I -- Lecture 4\n% Revised narrative: zoom -> secants -> nonzero point -> derivative -> velocity -> computation -> rates\n\\title{Lecture 4: Derivatives and Rates of Change}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 14, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n\\slide{Reminder: Syllabus Quiz Due Tonight}\n\\begin{note}\n\\alert{The Syllabus Quiz on HuskyCT is due tonight, September 14, by 11:59 p.m.}\n\\end{note}\n\\pause\n\\begin{itemize}\n\\item It is worth \\alert{3% of your overall course grade}.\n\\item \\alert{No extensions will be given.}\n\\end{itemize}\n\\pause\nIf you have not completed the quiz yet, please plan to submit it before the deadline tonight.\n\n\\section{From Zooming to Derivatives}\n\n\\slide{Back to a Question from Lecture 1}\n\\begin{twocol}[5 7]\nIn Lecture 1, we zoomed in on a graph and saw something striking:\n\n\\uncover<1->{\\alert{A smooth curve begins to look like a straight line.}}\n\n\\uncover<2->{At the time, this was an informal picture.}\n\n\\uncover<3->{Since then, we have learned about \\alert{limits}. Today we can explain why the picture works.}\n\\columnbreak\n\\begin{plot}\nf = (x+1)^3 - 1\ndomain = -4:4\nrange = -5:5\na = 0\nsize = 900x620\nframes = 4\nanimate = zoom: 4 -> 0.18\ncaption = Zooming in at the origin\n\\end{plot}\n\\end{twocol}\n\n% NARRATION: In Lecture 1 the conclusion was visual: it looks like a line.\n% Today the question is numerical: what is the slope of that line?\n\n\\slide{How Can We Measure the Slope We See?}\n\\begin{twocol}[5 7]\nFix the point $P=(0,f(0))$ and choose a nearby point $Q=(h,f(h))$.\n\n\\uncover<1->{The line through $P$ and $Q$ is a \\alert{secant line}.}\n\n\\uncover<2->{Its slope is exactly}\n\n\\uncover<2->{$$\n\\frac{\\text{change in }y}{\\text{change in }x}\n=\n\\frac{f(h)-f(0)}{h}.\n$$}\n\n\\uncover<3->{As $Q$ moves toward $P$, the secant begins to line up with the straight line we see in the zoomed-in graph.}\n\\columnbreak\n\\begin{plot}\nf = (x+1)^3 - 1\ndomain = -1.4:1.4\nrange = -2.5:3.5\na = 0\nsecant = true\ntangent = true\nsize = 900x680\nframes = 5\nanimate = h: 0.6 -> 0.05\ncaption = The secant approaches the tangent\n\\end{plot}\n\\end{twocol}\n\n\\slide{The Secant Slopes Stabilize}\n\\begin{twocol}[5 7]\nFor $f(x)=(x+1)^3-1$, the secant slope through $(0,0)$ is\n$$\\frac{f(h)-f(0)}{h}.$$\n\\begin{table}\n$h$ & secant slope\n0.4 & 4.36\n0.2 & 3.64\n0.1 & 3.31\n0.05 & 3.1525\n-0.05 & 2.8525\n\\end{table}\n\\columnbreak\n\\begin{plot}\nf = (x+1)^3 - 1\ndomain = -0.8:0.8\nrange = -1.6:2.0\na = 0\nsecant = true\ntangent = true\nsize = 820x450\nframes = 4\nanimate = h: 0.4 -> 0.05\ncaption = The secant slopes settle toward 3\n\\end{plot}\n\\uncover<2->{From both sides, the secant slopes settle toward $3$.}\n\\uncover<3->{$$\\boxed{\\displaystyle \\lim_{h\\to0}\\frac{f(h)-f(0)}{h}=3}.$$}\n\\end{twocol}\n\n\\slide{The Same Idea Away from the Origin}\n\\begin{twocol}[6 6]\nFor $f(x)=x^2$ at $(2,4)$, a secant through a second point $(x,x^2)$ has slope\n\\pause\n$$\n\\frac{x^2-4}{x-2}=x+2,\\qquad x\\neq2.\n$$\n\\pause\nTherefore,\n$$\n\\boxed{\\displaystyle \\lim_{x\\to2}\\frac{x^2-4}{x-2}=4}.\n$$\n\\pause\nThere is nothing special about $0$ or $2$: use the same construction at any point $(a,f(a))$.\n\\columnbreak\n\\begin{plot}\nf = x^2\ndomain = -0.5:4.5\nrange = -1:18\na = 2\nsecant = true\ntangent = true\nsize = 700x420\nframes = 5\nanimate = h: 2 -> 0.05\ncaption = The same construction at x equals 2\n\\end{plot}\n\\end{twocol}\n\n\\slide{Definition of the Derivative}\nAt a general point $(a,f(a))$, the secant through $(a,f(a))$ and $(x,f(x))$ has slope\n$$\\frac{f(x)-f(a)}{x-a}.$$\n\\pause\n\\begin{definition}{Derivative at a point}\nThe \\alert{derivative of $f$ at $a$} is\n$$\n\\boxed{f'(a)=\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}},\n$$\nwhenever this limit exists.\n\\end{definition}\n\\pause\nThe derivative is the limiting secant slope: the slope of the tangent line.\n\n\\slide{The Same Limit, Written with $h$}\nWrite\n$$h=x-a,$$\nso $x=a+h$.\n\\pause\nThen $x\\to a$ says exactly that $h\\to0$.\n\\pause\nSubstituting $x=a+h$ into the definition gives\n$$\n\\boxed{f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}}.\n$$\n\\pause\nBoth forms mean the same thing. The $h$-form is usually more convenient for computation.\n\n\\slide{Compute $f'(0)$ from the Definition}\n\\begin{twocol}[7 5]\nLet $f(x)=(x+1)^3-1$.\n\\begin{align}\nf'(0)\n&=\\lim_{h\\to0}\\frac{(1+h)^3-1}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{3h+3h^2+h^3}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}(3+3h+h^2)\\\\\n\\pause\n&=\\boxed{3}.\n\\end{align}\n\\columnbreak\n\\begin{plot}\nf = (x+1)^3 - 1\ndomain = -1.5:1.5\nrange = -3:3\na = 0\ntangent = true\nsize = 650x460\ncaption = The derivative is the tangent slope\n\\end{plot}\n\\end{twocol}\n\n\\slide{The Tangent Line}\n\\begin{twocol}[6 6]\nThe tangent line passes through $(a,f(a))$ and has slope $f'(a)$.\n\\pause\n$$y=f(a)+f'(a)(x-a).$$\n\\pause\nFor our example,\n$$a=0,\\qquad f(0)=0,\\qquad f'(0)=3.$$\n\\pause\nThus,\n$$\\boxed{y=3x}.$$\n\\columnbreak\n\\begin{plot}\nf = (x+1)^3 - 1\ndomain = -2:2\nrange = -5:5\na = 0\ntangent = true\nsize = 760x580\ncaption = Function and tangent line\n\\end{plot}\n\\end{twocol}\n\n\\section{Velocity}\n\n\\slide{A Question About Motion}\nA drone is launched straight upward from the ground.\n\\pause\nIt rises rapidly at first, eventually stops rising, and then falls back toward the ground.\n\\pause\n\\begin{note}\nHow fast is the drone moving at \\alert{one exact instant of time}?\n\\end{note}\n\\pause\nAverage velocity over a time interval is familiar.\n\nBut an instant has no length. How can averages over short intervals tell us what happens at one instant?\n\n\\slide{A Mathematical Model of the Flight}\nSuppose physics gives the height model\n$$s(t)=29.4t-4.9t^2,$$\nwhere $t$ is measured in seconds and $s(t)$ in meters.\n\\begin{twocol}[5 7]\n$s(0)=0$: the drone starts on the ground.\n\\pause\n\n$s(3)=44.1$: after three seconds it is $44.1$ meters high.\n\\pause\n\n$s(6)=0$: after six seconds it returns to the ground.\n\\columnbreak\n\\begin{plot}\nf = 29.4x - 4.9x^2\ndomain = 0:6\nrange = 0:48\nsize = 860x440\ncaption = Height of the drone as a function of time\n\\end{plot}\n\\end{twocol}\n\n\\slide{Average Velocity Is a Secant Slope}\n\\begin{twocol}[5 7]\nFrom time $1$ to time $1+h$,\n$$\n\\text{average velocity}=\\frac{s(1+h)-s(1)}{h}.\n$$\n\\uncover<1->{This is exactly the same difference quotient we used for tangent slopes.}\n\n\\uncover<2->{As the time interval shrinks, $h\\to0$.}\n\n\\uncover<3->{The secant line approaches the tangent line.}\n\\columnbreak\n\\begin{plot}\nf = 29.4x - 4.9x^2\ndomain = 0:6\nrange = 0:48\na = 1\nsecant = true\ntangent = true\nsize = 900x540\nframes = 5\nanimate = h: 2 -> 0.05\ncaption = Average velocity approaches instantaneous velocity\n\\end{plot}\n\\end{twocol}\n\n\\slide{Instantaneous Velocity at $t=1$: Set Up}\n\\begin{twocol}[6 6]\nFirst,\n$$s(1)=29.4-4.9=24.5.$$\n\\pause\nInstantaneous velocity is the derivative of position:\n$$s'(1)=\\lim_{h\\to0}\\frac{s(1+h)-s(1)}{h}.$$\n\\pause\nSubstitute the height model:\n$$\ns'(1)=\\lim_{h\\to0}\n\\frac{29.4(1+h)-4.9(1+h)^2-24.5}{h}.\n$$\n\\columnbreak\n\\begin{plot}\nf = 29.4x - 4.9x^2\ndomain = 0:6\nrange = 0:48\na = 1\ntangent = true\nsize = 760x520\ncaption = Instantaneous velocity is a tangent slope\n\\end{plot}\n\\end{twocol}\n\n\\slide{Instantaneous Velocity at $t=1$: Compute}\n\\begin{twocol}[7 5]\n\\begin{align}\ns'(1)\n&=\\lim_{h\\to0}\n\\frac{29.4+29.4h-4.9(1+2h+h^2)-24.5}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{19.6h-4.9h^2}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}(19.6-4.9h)\\\\\n\\pause\n&=\\boxed{19.6}.\n\\end{align}\nThus, the drone's instantaneous velocity at $t=1$ is $19.6$ m/s.\n\\columnbreak\n\\begin{plot}\nf = 29.4x - 4.9x^2\ndomain = 0:6\nrange = 0:48\na = 1\ntangent = true\nsize = 650x480\ncaption = The tangent slope is 19.6 meters per second\n\\end{plot}\n\\end{twocol}\n\n\\slide{Velocity at Every Time}\n\\begin{twocol}[6 6]\nThe same calculation can be done at an arbitrary time $t$.\n\\pause\nAfter expanding and canceling $h$,\n$$\n\\frac{s(t+h)-s(t)}{h}=29.4-9.8t-4.9h.\n$$\n\\pause\nNow let $h\\to0$:\n$$\n\\boxed{v(t)=s'(t)=29.4-9.8t}.\n$$\n\\pause\nSo one derivative calculation gives the velocity at \\alert{every} time.\n\\columnbreak\n\\begin{plot}\nf = 29.4 - 9.8x\ndomain = 0:6\nrange = -32:32\nsize = 760x460\ncaption = The velocity function\n\\end{plot}\n\\end{twocol}\n\n\\slide{Reading the Velocity}\n\\begin{twocol}[6 6]\n$$v(t)=29.4-9.8t$$\n\\begin{itemize}\n\\item For $0<t<3$, $v(t)>0$: the drone is rising.\n\\pause\n\\item At $t=3$, $v(3)=0$: the drone is at its highest point.\n\\pause\n\\item For $3<t<6$, $v(t)<0$: the drone is falling.\n\\end{itemize}\n\\pause\nThe \\alert{speed} is $|v(t)|$, so speed is never negative.\n\\columnbreak\n\\begin{plot}\nf = 29.4 - 9.8x\ndomain = 0:6\nrange = -32:32\nsize = 800x500\ncaption = Velocity of the drone\n\\end{plot}\n\\end{twocol}\n\n\\section{Computing Derivatives}\n\n\\slide{For Now, the Definition Is the Method}\nWe do not yet have shortcut derivative rules.\n\\pause\nToday every derivative comes from\n$$f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}.$$\n\\pause\nThe calculus is always the same:\n\\begin{enumerate}\n\\item Write the difference quotient.\n\\pause\n\\item Simplify it for $h\\neq0$.\n\\pause\n\\item Cancel the factor causing the $0/0$ form.\n\\pause\n\\item Take the limit.\n\\end{enumerate}\n\\pause\nWhat changes from example to example is the \\alert{algebra}.\n\n\\slide{Example: $f(x)=6/x$ at $a=2$}\n\\begin{twocol}[6 6]\nLet $f(x)=\\dfrac{6}{x}$. Since $f(2)=3$,\n\\pause\n$$\nf'(2)=\\lim_{h\\to0}\\frac{\\dfrac{6}{2+h}-3}{h}.\n$$\n\\pause\nDirect substitution still gives $0/0$.\n\n\\pause\nSo we simplify \\alert{before} taking the limit.\n\\columnbreak\n\\begin{plot}\nf = 6/x\ndomain = 0.6:6.5\nrange = 0:7\na = 2\ntangent = true\nsize = 760x540\ncaption = The graph of 6 divided by x near x equals 2\n\\end{plot}\n\\end{twocol}\n\n\\slide{$f(x)=6/x$: Simplify the Difference Quotient}\n\\begin{twocol}[7 5]\n\\begin{align}\n\\frac{f(2+h)-f(2)}{h}\n&=\\frac{1}{h}\\left(\\frac{6}{2+h}-3\\right)\\\\\n\\pause\n&=\\frac{1}{h}\\left(\\frac{6-3(2+h)}{2+h}\\right)\\\\\n\\pause\n&=\\frac{-3}{2+h},\\qquad h\\neq0.\n\\end{align}\n\\pause\n$$f'(2)=\\lim_{h\\to0}\\frac{-3}{2+h}=\\boxed{-\\frac32}.$$\n\\columnbreak\n\\begin{plot}\nf = 6/x\ndomain = 0.6:6.5\nrange = 0:7\na = 2\ntangent = true\nsize = 570x380\ncaption = Negative derivative means the graph is falling\n\\end{plot}\n\\end{twocol}\n\n\\slide{The Tangent Line to $y=6/x$ at $x=2$}\nWe know $f(2)=3$ and $f'(2)=-\\dfrac32$.\n\\pause\nUse point-slope form:\n$$y-f(2)=f'(2)(x-2).$$\n\\pause\n$$y-3=-\\frac32(x-2).$$\n\\pause\nTherefore,\n$$\\boxed{y=-\\frac32x+6}.$$\n\n\\slide{You Try}\n\\begin{twocol}[7 5]\nLet $f(x)=\\dfrac{4}{x}$.\n\nCompute:\n\\begin{itemize}\n\\item[(a)] $f'(4)$ using the definition.\n\\item[(b)] The tangent line at $x=4$.\n\\end{itemize}\n\\columnbreak\n\\begin{plot}\nf = 4/x\ndomain = 0.6:7\nrange = 0:5\na = 4\nsize = 650x460\ncaption = Work from the definition of the derivative\n\\end{plot}\n\\end{twocol}\n\\begin{js}[size=1500x150]\nconst T0 = 75;\nconst FM = \"'JetBrains Mono', ui-monospace, monospace\";\nconst BW = 960, BH = 16, BX = (w-BW)/2, BY = 122;\nfunction draw(left) {\n  ctx.clearRect(0,0,w,h);\n  const shown = Math.ceil(Math.max(0,left));\n  const col = left <= 10 ? colors.red : (left <= 25 ? colors.orange : colors.teal2);\n  ctx.font = '600 84px ' + FM;\n  ctx.textAlign = 'center'; ctx.fillStyle = col;\n  ctx.fillText('0:' + (shown < 10 ? '0' : '') + shown, w/2, 86);\n  ctx.fillStyle = '#E8EFEF'; ctx.fillRect(BX,BY,BW,BH);\n  ctx.fillStyle = col; ctx.fillRect(BX,BY,BW*Math.max(0,left)/T0,BH);\n}\ndraw(T0); onFrame(t => draw(T0-t));\n\\end{js}\n\n\\slide{You Try: Solution}\n\\begin{twocol}[7 5]\nSince $f(4)=1$,\n\\begin{align}\nf'(4)\n&=\\lim_{h\\to0}\\frac{1}{h}\\left(\\frac{4}{4+h}-1\\right)\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{1}{h}\\left(\\frac{4-(4+h)}{4+h}\\right)\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{-1}{4+h}\\\\\n\\pause\n&=\\boxed{-\\frac14}.\n\\end{align}\n\\columnbreak\n\\begin{plot}\nf = 4/x\ndomain = 0.6:7\nrange = 0:5\na = 4\ntangent = true\nsize = 630x470\ncaption = Function and tangent line\n\\end{plot}\n\\end{twocol}\n\n\\slide{You Try: Finish the Tangent Line}\nThe point is $(4,f(4))=(4,1)$ and the slope is $f'(4)=-\\dfrac14$.\n\\pause\nTherefore,\n$$y-1=-\\frac14(x-4).$$\n\\pause\nSo\n$$\\boxed{y=-\\frac14x+2}.$$\n\n\\slide{What If We Do Not Choose the Point?}\nLet $f(x)=x^2-6x+4$.\n\\begin{twocol}[5 7]\nSo far, we have chosen a particular number $a$ and found one number $f'(a)$.\n\\pause\nBut what if we leave the point as a variable?\n\\pause\nThen the answer may depend on $a$.\n\\pause\nThe derivative itself will become a \\alert{new function}.\n\\columnbreak\n\\begin{plot}\nf = x^2 - 6x + 4\ndomain = -1:7\nrange = -7:12\nsize = 900x500\ncaption = We want the tangent slope at an arbitrary point\n\\end{plot}\n\\end{twocol}\n\n\\slide{Derivative at an Arbitrary Point: Set Up}\nFor\n$$f(x)=x^2-6x+4,$$\nstart from the definition:\n\\pause\n$$\nf'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}.\n$$\n\\pause\nSubstitute the function:\n$$\nf'(a)=\\lim_{h\\to0}\n\\frac{(a+h)^2-6(a+h)+4-(a^2-6a+4)}{h}.\n$$\n\\pause\nExpand the numerator before taking the limit.\n\n\\slide{Derivative at an Arbitrary Point: Simplify}\n\\begin{align}\nf'(a)\n&=\\lim_{h\\to0}\\frac{a^2+2ah+h^2-6a-6h+4-a^2+6a-4}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{2ah+h^2-6h}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}(2a+h-6)\\\\\n\\pause\n&=\\boxed{2a-6}.\n\\end{align}\n\n\\slide{The Derivative Is a Function}\n\\begin{twocol}[6 6]\nWe found\n$$f'(a)=2a-6.$$\nRename the input variable:\n$$\\boxed{f'(x)=2x-6}.$$\n\\pause\nIf $x<3$, then $f'(x)<0$: the original graph is decreasing.\n\\pause\nAt $x=3$, $f'(3)=0$: the original graph has a horizontal tangent.\n\\pause\nIf $x>3$, then $f'(x)>0$: the original graph is increasing.\n\\columnbreak\n\\begin{plot}\nf = 2x - 6\ndomain = -1:7\nrange = -10:10\nsize = 700x430\ncaption = The derivative function\n\\end{plot}\n\\end{twocol}\n\n\\slide{Example: $f(x)=\\sqrt{x}$ at $a=9$}\n\\begin{twocol}[6 6]\nSince $f(9)=3$,\n$$\nf'(9)=\\lim_{h\\to0}\\frac{\\sqrt{9+h}-3}{h}.\n$$\n\\pause\nDirect substitution gives $0/0$.\n\\pause\nTo simplify a difference of square roots, multiply by the conjugate:\n$$\\sqrt{9+h}+3.$$\n\\columnbreak\n\\begin{plot}\nf = x^0.5\ndomain = 0:16\nrange = 0:5\na = 9\ntangent = true\nsize = 700x500\ncaption = Tangent to the square root function at x equals 9\n\\end{plot}\n\\end{twocol}\n\n\\slide{$f(x)=\\sqrt{x}$ at $a=9$: Compute}\n\\begin{align}\nf'(9)\n&=\\lim_{h\\to0}\\frac{\\sqrt{9+h}-3}{h}\n\\cdot\\frac{\\sqrt{9+h}+3}{\\sqrt{9+h}+3}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{(9+h)-9}{h(\\sqrt{9+h}+3)}\\\\\n\\pause\n&=\\lim_{h\\to0}\\frac{1}{\\sqrt{9+h}+3}\\\\\n\\pause\n&=\\boxed{\\frac16}.\n\\end{align}\n\\pause\nThis is the limit you computed in Lecture 3. It was a derivative.\n\n\\section{Rates of Change}\n\n\\slide{Derivatives Measure Rates of Change}\nSuppose $y=f(x)$.\n\\pause\nOver an interval,\n$$\\text{average rate of change}=\\frac{\\Delta y}{\\Delta x}.$$\n\\pause\nAt one input value,\n$$\n\\text{instantaneous rate of change}\n=\\lim_{\\Delta x\\to0}\\frac{\\Delta y}{\\Delta x}\n=\\boxed{f'(x)}.\n$$\n\\pause\nThe units are\n$$\\frac{\\text{units of output}}{\\text{units of input}}.$$\n\\pause\nVelocity is one example: meters per second.\n\n\\slide{A Different Question: Making Ice Cream}\nThe Dairy Bar makes ice cream every day.\n\\pause\nSome costs are present before the first gallon is produced: staffing, cleaning, and preparing equipment.\n\\pause\nOther costs grow as more ice cream is produced.\n\\pause\nSuppose the Dairy Bar is already planning to make $1000$ gallons today.\n\\begin{note}\nApproximately how much extra will it cost to make \\alert{one more gallon}?\n\\end{note}\n\n\\slide{A Cost Model}\nSuppose a simplified daily cost model is\n$$C(x)=4000+5x+0.002x^2,$$\nwhere $x$ is gallons of ice cream and $C(x)$ is total cost in dollars.\n\\begin{twocol}[5 7]\n$C(1000)$ is the total cost of producing $1000$ gallons.\n\\pause\n\n$C'(1000)$ measures how rapidly cost is changing near $1000$ gallons.\n\\pause\n\nIts units are \\alert{dollars per gallon}.\n\\columnbreak\n\\begin{plot}\nf = 4000 + 5x + 0.002x^2\ndomain = 0:2000\nrange = 0:23000\na = 1000\nsize = 820x430\ncaption = A model of total production cost\n\\end{plot}\n\\end{twocol}\n\n\\slide{Marginal Cost at $1000$ Gallons: Set Up}\nFirst,\n$$C(1000)=4000+5000+2000=11000.$$\n\\pause\nUse the derivative definition:\n$$\nC'(1000)=\\lim_{h\\to0}\\frac{C(1000+h)-C(1000)}{h}.\n$$\n\\pause\nSubstitute the cost model:\n$$\nC'(1000)=\\lim_{h\\to0}\n\\frac{4000+5(1000+h)+0.002(1000+h)^2-11000}{h}.\n$$\n\n\\slide{Marginal Cost at $1000$ Gallons: Compute}\n\\begin{align}\nC'(1000)\n&=\\lim_{h\\to0}\\frac{5h+4h+0.002h^2}{h}\\\\\n\\pause\n&=\\lim_{h\\to0}(9+0.002h)\\\\\n\\pause\n&=\\boxed{9}.\n\\end{align}\n\\pause\nThe units are dollars per gallon. Now interpret what the number means.\n\n\\slide{Interpret the Answer}\n\\begin{twocol}[6 6]\nWe found $C'(1000)=9$.\n\nIts units are dollars per gallon.\n\\pause\nSo near $1000$ gallons, total cost is increasing at about\n$$\\boxed{\\$9\\text{ per additional gallon}}.$$\n\\pause\nEconomists call $C'(x)$ the \\alert{marginal cost}.\n\\pause\nFor comparison,\n$$C(1001)-C(1000)=\\$9.002.$$\n\\columnbreak\n\\begin{plot}\nf = 4000 + 5x + 0.002x^2\ndomain = 0:2000\nrange = 0:23000\na = 1000\ntangent = true\nsize = 760x520\ncaption = The tangent slope is the marginal cost\n\\end{plot}\n\\end{twocol}\n\n\\slide{Where We Got To}\n\\begin{twocol}[1 1]\n\\begin{itemize}[tight]\n\\item A secant line measures average change between two points.\n\\item When we zoom in, secants approach the line that locally matches the graph.\n\\item The limiting secant slope is the derivative.\n\\item The tangent line at $x=a$ has slope $f'(a)$.\n\\end{itemize}\n\\columnbreak\n\\begin{itemize}[tight]\n\\item We can compute derivatives directly from the limit definition.\n\\item If the point varies, the derivative becomes a new function $f'$.\n\\item For position, the derivative is velocity.\n\\item In general, derivatives measure instantaneous rates of change.\n\\end{itemize}\n\\end{twocol}\n\\pause\n$$\\boxed{f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}}$$\n\n\\slide{Before You Go}\n\\begin{twocol}[5 7]\n\\begin{note}\n\\alert{Problem Set 4 is available.}\n\\end{note}\n\nYou can use it to practice the ideas from today's lecture.\n\n\\columnbreak\n\n\\begin{note}\n\\alert{Syllabus Quiz — HuskyCT}\n\\end{note}\n\nDue tonight, September 14, by \\alert{11:59 p.m.}\n\nIt is worth \\alert{3% of your overall course grade}.\n\n\\alert{No extensions will be given.}\n\\end{twocol}\n";window.LECTURE_SCALE=1.2;</script><script src="lecture-engine.js"></script><script>function PLAYER() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('scale'); } catch (e) {}
    if (q && !isNaN(parseFloat(q))) window.Lecture.setScale(parseFloat(q));
    else if (window.LECTURE_SCALE) window.Lecture.setScale(window.LECTURE_SCALE);
    var parsed = window.Lecture.parse(window.LECTURE_SOURCE);
    var slides = parsed.slides, meta = parsed.meta;
    var si = 0, ctrl = null, step = 0;
    var stage = document.getElementById('stage'), slideEl = document.getElementById('slide');
    var tray = document.getElementById('tray'), bar = document.getElementById('bar');
    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    }
    addEventListener('resize', fit); fit();
    var track = document.createElement('div');
    track.title = 'Drag to scrub through the deck';
    track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ew-resize;z-index:6';
    stage.appendChild(track);
    track.addEventListener('pointerdown', function (e) {
      function pick(cx) {
        var r = track.getBoundingClientRect();
        if (!r.width) return;
        var u = Math.max(0, Math.min(0.9999, (cx - r.left) / r.width));
        var k = Math.floor(u * slides.length);
        if (k === si) return;
        si = k; step = 0; render();
      }
      function move(ev) { ev.preventDefault(); pick(ev.clientX); }
      function up() {
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        bar.style.height = '4px'; bar.style.transition = 'width .3s ease';
      }
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      bar.style.height = '10px'; bar.style.transition = 'none';
      pick(e.clientX);
    });
    function chrome() {
      var total = slides.length;
      tray.innerHTML = '<div class="nb" id="prev">&#8592;</div><div class="nb" id="next">&#8594;</div>' +
        '<div style="flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:24px;color:#125A56">' +
        (slides[si].section || meta.title || '') + '</div>' +
        '<div style="color:#999">' + (meta.copyright || '') + '</div>' +
        '<div style="color:#111">' + (si + 1) + ' / ' + total + '</div>';
      document.getElementById('prev').onclick = function () { go(-1); };
      document.getElementById('next').onclick = function () { go(1); };
      bar.style.width = ((si + 1) / total * 1920) + 'px';
    }
    function render() {
      if (ctrl) ctrl.destroy();
      ctrl = window.Lecture.mountSlide(slideEl, slides[si], meta, { readonly: true });
      ctrl.setStep(step);
      chrome();
    }
    function go(d) {
      if (d > 0) {
        if (step < slides[si].steps) { step++; ctrl.setStep(step); return; }
        if (si < slides.length - 1) { si++; step = 0; render(); }
      } else {
        if (step > 0) { step--; ctrl.setStep(step); return; }
        if (si > 0) { si--; step = slides[si].steps; render(); }
      }
    }
    addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); go(-1); }
      else if (e.key === 'Home') { si = 0; step = 0; render(); }
      else if (e.key === 'End') { si = slides.length - 1; step = 0; render(); }
    });
    render();
  };PLAYER();</script></body></html>
