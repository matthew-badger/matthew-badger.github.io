     // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SUB = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];\nfunction iterates(f, fp, xa, n) {                     // x1 = xa and the next n Newton approximations\n  const xs = [xa];\n  for (let k = 0; k < n; k++) { const x = xs[k], m = fp(x); xs.push(Math.abs(m) < 1e-12 ? NaN : x - f(x) / m); }\n  return xs;\n}\nfunction drawStep(f, fp, x, color) {                  // from (x, 0) up to the graph, then along the tangent line to the x-axis\n  const y = f(x), m = fp(x);\n  seg(x, 0, x, y, colors.muted, 2, [7, 7]);\n  seg(x0, y + m * (x0 - x), x1, y + m * (x1 - x), color, 2, [4, 10]);   // the whole tangent line, dotted\n  if (Math.abs(m) > 1e-12) seg(x, y, x - y / m, 0, color, 5);\n  dot(x, y, color, 9);\n}\nfunction axisMark(x, label, color) { dot(x, 0, color, 9); tag(label, X(x), Y(0) + 46, color, 'center'); }\nconst f = (x) => Math.exp(x / 2) - 2, fp = (x) => Math.exp(x / 2) / 2, r = 2 * Math.log(2);\n\nconst xs = iterates(f, fp, 3.4, 3);\ngrid(0.5); seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5);\nfor (let k = 0; k < 3; k++) drawStep(f, fp, xs[k], colors.c2);\nctx.restore();\nfor (let k = 0; k <= 3; k++) dot(xs[k], 0, k === 3 ? colors.c4 : colors.c1, 9);\n\\end{js}\n\\end{columns}\n\n\\section{The Idea}\n\n\\slide{Equations Without Formulas}\n\\begin{columns}[7 5, parallel]\nA quadratic equation $ax^2+bx+c=0$ can be solved with the quadratic formula.\n\\\\[0.4em]\nThere are formulas for equations of degree $3$ and $4$, but they are long. For degree $5$ and higher there is \\textbf{no} formula (Abel, 1824).\n\\\\[0.4em]\nMany equations have no formula at all, such as\n$$\\cos x=x.$$\nYet a calculator gives $\\sqrt2=1.414\\ldots$ and solves $\\cos x=x$ in an instant. How?\n\\\\[0.4em]\n\\textbf{Today:} a method that uses derivatives to approximate a root of $f(x)=0$ to as many decimal places as we w  - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\naxes(0.5, 1);\nclip();\npath((x) => x, (x) => Math.cos(x), x0, x1, colors.curve, 5);\npath((x) => x, (x) => x, x0, x1, colors.c1, 4);\nctx.restore();\nconst r = 0.7390851332151607;\nseg(r, 0, r, r, colors.muted, 2, [7, 7]);\ndot(r, r, colors.c2, 11);\ntag('y = cos x', X(-1.9), Y(0.55), colors.curve);\ntag('y = x', X(1.3), Y(1.95), colors.c1);\ntag('?', X(r) - 8, Y(0) + 44, colors.c2);\n\\end{js}\n\\end{columns}\n\n\\slide{Following the Tangent Line}\n\\begin{columns}[5 7, parallel]\nWe want a root $r$ of $f(x)=0$: a point where the graph crosses the $x$-axis.\n\\\\[0.4em]\nStart with a guess $\\textcolor{c1}{x_1}$ near $r$.\n\\\\[0.4em]\nNear $x_1$, the graph is close to its \\textcolor{c2}{tangent line}. Follow the tangent line down to the $x$-axis. It crosses at a point $\\textcolor{c2}{x_2}$.\n\\\\[0.4em]\nUsually $x_2$ is closer to $r$ than $x_1$ is.\n\\\\[0.4em]\nMove $x_1$ and watch $x_2$.\n\\columnbreak\n\\begin{js}[size=640x880, alt=\"An increasing, upward-bending graph crossing the x-axis at the root r = 1.386..., drawn with equal units on both axes. A slider moves the guess x1 along the x-axis; the tangent line at the point of the graph above x1 is drawn, and it crosses the x-axis at x2. The readout gives x1, x2, and r. Wherever x1 starts, x2 lies closer to r.\"]\nconst L = 56, R = 16, T = 16, B = 130;                 // margins in pixels\nconst x0 = -0.4, x1 = 4.0, yc = 0.9;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0); function iterates(f, fp, xa, n) {                     // x1 = xa and the next n Newton approximations\n  const xs = [xa];\n  for (let k = 0; k < n; k++) { const x = xs[k], m = fp(x); xs.push(Math.abs(m) < 1e-12 ? NaN : x - f(x) / m); }\n  return xs;\n}\nfunction drawStep(f, fp, x, color) {                  // from (x, 0) up to the graph, then along the tangent line to the x-axis\n  const y = f(x), m = fp(x);\n  seg(x, 0, x, y, colors.muted, 2, [7, 7]);\n  seg(x0, y + m * (x0 - x), x1, y + m * (x1 - x), color, 2, [4, 10]);   // the whole tangent line, dotted\n  if (Math.abs(m) > 1e-12) seg(x, y, x - y / m, 0, color, 5);\n  dot(x, y, color, 9);\n}\nfunction axisMark(x, label, color) { dot(x, 0, color, 9); tag(label, X(x), Y(0) + 46, color, 'center'); }\nconst f = (x) => Math.exp(x / 2) - 2, fp = (x) => Math.exp(x / 2) / 2, r = 2 * Math.log(2);\n\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.8;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => { .moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fil e to the x-axis\n  const y = f(x), m = fp(x);\n  seg(x, 0, x, y, colors.muted, 2, [7, 7]);\n  seg(x0, y + m * (x0 - x), x1, y + m * (x1 - x), color, 2, [4, 10]);   // the whole tangent line, dotted\n  if (Math.abs(m) > 1e-12) seg(x, y, x - y / m, 0, color, 5);\n  dot(x, y, color, 9);\n}\nfunction axisMark(x, label, color) { dot(x, 0, color, 9); tag(label, X(x), Y(0) + 46, color, 'center'); }\nconst f = (x) => Math.exp(x / 2) - 2, fp = (x) => Math.exp(x / 2) / 2, r = 2 * Math.log(2);\n\nconst xs = iterates(f, fp, 3.4, 3), n = Math.min(local, 3);\naxes(0.5, 1);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5);\nfor (let k = 0; k < n; k++) drawStep(f, fp, xs[k], colors.c2);\nctx.restore();\nring(r, 0, colors.c4, 10);\nfor (let k = 0; k <= n; k++) dot(xs[k], 0, k === n ? colors.c1 : colors.muted, 9);\ntag('x' + SUB[n] + ' = ' + dec(xs[n], 3), X(2.0), Y(-0.75), colors.c1);\ntag('r  = ' + dec(r, 3), X(2.0), Y(-1.12), colors.c4);\n\\end{js}\n\\end{columns}\n\n\\section{Computing}\n\n\\slide{Example 1}\n\\begin{columns}[6 6, parallel]\nStart with $x_1=2$ and use Newton's Method to find $x_3$, the third approximation to the root of\n$$x^3-2x-5=0.$$\n\\\\[0.4em]\nHere $f(x)=x^3-2x-5$ and $f'(x)=3x^2-2$, so\n$$x_{n+1}=x_n-\\frac{\\textcolor{c2}{x_n^3-2x_n-5}}{\\textcolor{c3}{3x_n^2-2}}.$$\nThe graph crosses the $x$-axis once, a little to the right of $2$.\n\\columnbreak\n\\begin{js}[size=760x700, frames=1, alt=\"The graph of f(x) = x cubed - 2x - 5 for x from 1 to 3, with a compressed vertical scale. It crosses the x-axis once, just to the right of x = 2. The tangent line at (2, -1) is drawn; it meets the x-axis at x2 = 2.1.\"]\nconst L = 70, R = 20, T = 20, B = 60;                 // margins in pixels\nconst x0 = 1.0, x1 = 3.0, y0 = -8, y1 = 16;      // the window; the vertical scale is compressed\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => x * x * x - 2 * x - 5;\ngrid(0.25, 2); seg(x0, 0, x1, 0, colors.axis, 2);\nctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n[1, 1.5, 2, 2.5, 3].forEach((v) => ctx.fillText(String(v), X(v), h - B + 34));\nctx.textAlign = 'right'; [-8, -4, 0, 4, 8, 12, 16].forEach((v) => ctx.fillText(String(v).replace('-', '−'), L - 10, Y(v) + 9)); ctx.textAlign = 'left';\nclip();\npath((x) => x, f, x0, x1, colors.curve, 5);\nseg(1.2, -1 + 10 * (1.2 - 2), 2.8, -1 + 10 * (2.8 - 2), colors.c2, 3, [10, 8]);\nctx.restore();\ndot(2, -1, colors.c2, 10); dot(2, 0, colors.c1, 9); dot(2.1, 0, colors.c2, 9);\ntag('x₁ = 2', X(2) - 12, Y(0) - 18, colors.c1, 'right');\ntag('x₂ = 2.1', X(2.1) + 10, Y(0) + 42, colors.c2);\ntag('y = x³ − 2x − 5', X(1.05), Y(13), colors.curve);\ntag('vertical scale compressed', X(1.55), Y(-6.2), colors.muted);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 1: Solving}\n\\textbf{Problem.} Find $x_3$ for $x^3-2x-5=0$, starting from $x_1=2$.\n\\pause\n\\begin{align}\nx_2 &= 2-\\frac{2^3-2\\cdot2-5}{3\\cdot2^2-2}=2-\\frac{-1}{10}=2.1 \\\\\n\\pause\nx_3 &= 2.1-\\frac{(2.1)^3-2(2.1)-5}{3(2.1)^2-2}=2.1-\\frac{9.261-4.2-5}{13.23-2} \\\\\n\\pause\n\\phantom{x_3} &= 2.1-\\frac{0.061}{11.23}=2.094568\\ldots\n\\end{align}\n\\pause\nThe root is $r=2.094551\\ldots$, so after only two steps $x_3$ has four correct decimal places:\n$$x_3=\\textcolor{c4}{2.0945}68\\ldots,\\qquad r=\\textcolor{c4}{2.0945}51\\ldots$$\n\n\\slide{When to Stop}\n\\begin{box}{A Practical Rule}\nTo find a root to $k$ decimal places, compute $x_2,x_3,\\ldots$ until two successive approximations $x_n$ and $x_{n+1}$ agree to $k$ decimal places.\n\\end{box}\n\\heading{Example 2}\nUse Newton's Method to find $\\sqrt[6]{2}$ to ten decimal places.\n\\pause\nThe number $\\sqrt[6]{2}$ is the positive root of $f(x)=x^6-2=0$, and $f'(x)=6x^5$, so\n$$x_{n+1}=x_n-\\frac{\\textcolor{c2}{x_n^6-2}}{\\textcolor{c3}{6x_n^5}}.$$\nSince $1^6=1$ is close to $2$, start with $x_1=1$.\n\n\\slide{Example 2: Solving}\n\\begin{columns}[6 6, parallel]\n\\begin{align}\nx_2 &= 1-(1-2)/6=\\textcolor{c4}{1.1}666666666\\ldots \\\\\n\\pause\nx_3 &= \\textcolor{c4}{1.12}64436775\\ldots \\\\\n\\pause\nx_4 &= \\textcolor{c4}{1.1224}970674\\ldots \\\\\n\\pause\nx_5 &= \\textcolor{c4}{1.1224620}510\\ldots \\\\\n\\pause\nx_6 &= \\textcolor{c4}{1.1224620483}\\ldots \\\\\n\\pause\nx_7 &= \\textcolor{c4}{1.1224620483}\\ldots\n\\end{align}\n\\columnbreak\n\\textbf{Problem.} Find $\\sqrt[6]{2}$ to ten decimal places, with $x_1=1$, using\n$$x_{n+1}=x_n-\\frac{x_n^6-2}{6x_n^5}.$$\n\\uncover<6->{$x_6$ and $x_7$ agree to ten decimal places, so\n$$\\sqrt[6]{2}=1.1224620483\\ldots$$}\n\\\\[0.6em]\n\\uncover<6->{The \\textcolor{c4}{correct digits} roughly \\textbf{double} at each step: $1,2,4,7$, then all ten.}\n\\end{columns}\n\n\\slide{Square Roots by Hand}\nTo find $\\sqrt a$ for a number $a>0$, solve $f(x)=x^2-a=0$. With $f'(x)=2x$,\n\\pause\n$$x_{n+1}=x_n-\\frac{x_n^2-a}{2x_n}=\\frac{2x_n^2-x_n^2+a}{2x_n}=\\frac{x_n^2+a}{2x_n}=\\frac{1}{2}\\left(\\textcolor{c1}{x_n}+\\textcolor{c2}{\\frac{a}{x_n}}\\right).$$\n\\pause\n\\textbf{A picture.} A rectangle of area $a$ with one side $\\textcolor{c1}{x_n}$ has other side $\\textcolor{c2}{a/x_n}$. The square root $\\sqrt a$ lies between the two sides. Their average, $x_{n+1}$, is the side of a new rectangle of area $a$ that is closer to a square, whose side is $\\sqrt a$.\n\\\\[0.4em]\nHeron of Alexandria described this method about $2000$ years ago.\n\n\\slide{Square Roots: Example}\n\\begin{columns}[6 6, parallel]\nFind $\\sqrt2$, starting from $x_1=1$. Each step averages the sides of a rectangle of area $2$.\n\\pause\n$$x_2=\\tfrac12(1+2)=1.5$$\n\\pause\n$$x_3=\\tfrac12\\left(1.5+\\tfrac{2}{1.5}\\right)=1.41666\\ldots$$\n\\pause\n$$x_4=\\tfrac12\\left(x_3+\\tfrac{2}{x_3}\\right)=1.4142156\\ldots$$\nCompare $\\sqrt2=1.4142135\\ldots$\n\\columnbreak\n\\begin{js}[size=560x620, frames=4, alt=\"Rectangles of area 2, drawn with equal units on both axes. The first is 1 by 2. Each step replaces it by the rectangle whose width is the average of the two sides: 1.5 by 1.333..., then 1.41666... by 1.41176..., which is almost a square of side the square root of 2.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.2, x1 = 2.4, yc = 1.05;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst xs = [1, 1.5, 17 / 12, 577 / 408], n = Math.min(local, 3), x = xs[n], yv = 2 / x;\naxes(0.5, 1);\nfor (let k = 0; k < n; k++) { const a = xs[k]; seg(0, 2 / a, a, 2 / a, colors.muted, 2, [6, 8]); seg(a, 0, a, 2 / a, colors.muted, 2, [6, 8]); }\npoly([[0, 0], [x, 0], [x, yv], [0, yv]], colors.c4, 0.18);\nseg(0, 0, x, 0, colors.c1, 7); seg(x, 0, x, yv, colors.c2, 7); seg(x, yv, 0, yv, colors.c1, 3); seg(0, yv, 0, 0, colors.c2, 3);\ntag('x' + ['₁', '₂', '₃', '₄'][n] + ' = ' + dec(x, 5), w - R - 12, T + 40, colors.c1, 'right');\ntag('2/x = ' + dec(yv, 5), w - R - 12, T + 82, colors.c2, 'right');\ntag('area 2', X(x / 2), Y(yv / 2) + 10, colors.c4, 'center');\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 1}\n\\begin{youtry}[time=none]{A Square Root}\nUse Newton's Method with $f(x)=x^2-5$ and $x_1=2$ to find $x_2$, an approximation to $\\sqrt5$.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 1: Solution}\n\\textbf{Problem.} Find $x_2$ for $f(x)=x^2-5$, starting from $x_1=2$.\n\\pause\n\\\\[0.4em]\nHere $f'(x)=2x$, so\n$$x_2=x_1-\\frac{\\textcolor{c2}{x_1^2-5}}{\\textcolor{c3}{2x_1}}=2-\\frac{4-5}{4}=2+0.25=2.25.$$\n\\pause\nAveraging the sides gives the same answer: $x_2=\\tfrac12\\left(2+\\tfrac52\\right)=2.25$.\n\\pause\n\\\\[0.4em]\nOne more step:\n$$x_3=2.25-\\frac{(2.25)^2-5}{2(2.25)}=2.25-\\frac{0.0625}{4.5}=2.236111\\ldots$$\nCompare $\\sqrt5=2.236067\\ldots$\n\n\\section{Starting Points}\n\n\\slide{Example 3}\n\\begin{columns}[7 5, parallel]\nSolve $\\cos x=x$ to nine decimal places.\n\\\\[0.3em]\nFirst rewrite it as $f(x)=0$:\n$$f(x)=\\cos x-x,\\qquad f'(x)=-\\sin x-1.$$\n\\textbf{Choose $x_1$ from a graph.} The graph of $f$ crosses the $x$-axis a little to the left of $x=1$, so take $x_1=1$. (Use radians.)\n\\columnbreak\n\\begin{js}[size=540x600, frames=1, alt=\"The graph of f(x) = cos x - x, drawn with equal units on both axes, decreasing and crossing the x-axis once near x = 0.74. The first approximation x1 = 1 is marked, with the tangent line there, which meets the x-axis at x2 = 0.750....\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -1.0, x1 = 2.0, yc = 0.2;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SUB = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];\nfunction iterates(f, fp, xa, n) {                     // x1 = xa and the next n Newton approximations\n  const xs = [xa];\n  for (let k = 0; k < n; k++) { const x = xs[k], m = fp(x); xs.push(Math.abs(m) < 1e-12 ? NaN : x - f(x) / m); }\n  return xs;\n}\nfunction drawStep(f, fp, x, color) {                  // from (x, 0) up to the graph, then along the tangent line to the x-axis\n  const y = f(x), m = fp(x);\n  seg(x, 0, x, y, colors.muted, 2, [7, 7]);\n  seg(x0, y + m * (x0 - x), x1, y + m * (x1 - x), color, 2, [4, 10]);   // the whole tangent line, dotted\n  if (Math.abs(m) > 1e-12) seg(x, y, x - y / m, 0, color, 5);\n  dot(x, y, color, 9);\n}\nfunction axisMark(x, label, color) { dot(x, 0, color, 9); tag(label, X(x), Y(0) + 46, color, 'center'); }\n\nconst f = (x) => Math.cos(x) - x, fp = (x) => -Math.sin(x) - 1;\naxes(0.5, 1);\nclip(); path((x) => x, f, x0, x1, colors.curve, 5); drawStep(f, fp, 1, colors.c2); ctx.restore();\naxisMark(1, 'x₁', colors.c1);\ndot(1 - f(1) / fp(1), 0, colors.c2, 9);\ntag('y = cos x − x', X(0.15), Y(1.45), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 3: Solving}\n\\textbf{Problem.} Solve $\\cos x=x$ to nine decimal places, with $f(x)=\\cos x-x$ and $x_1=1$.\n\\pause\n$$x_{n+1}=x_n-\\frac{\\cos x_n-x_n}{-\\sin x_n-1}=x_n+\\frac{\\cos x_n-x_n}{\\sin x_n+1}.$$\n\\pause\n\\begin{align}\nx_2 &= 1+(\\cos1-1)/(\\sin1+1)=0.7503638678\\ldots \\\\\n\\pause\nx_3 &= 0.7391128909\\ldots \\\\\n\\pause\nx_4 &= \\textcolor{c4}{0.739085133}3\\ldots \\\\\n\\pause\nx_5 &= \\textcolor{c4}{0.739085133}2\\ldots\n\\end{align}\n\\pause\n$x_4$ and $x_5$ agree to nine decimal places. The root is $0.739085133\\ldots$\n\n\\slide{When Newton's Method Fails: Flat Tangent Lines}\n\\begin{columns}[6 6, parallel]\nTake $f(x)=x^3-3x+1$, with three roots.\n\\\\[0.4em]\nIf $\\textcolor{c2}{f'(x_1)=0}$, the tangent line is horizontal and never meets the $x$-axis: there is no $x_2$. For example, $f'(1)=0$.\n\\pause\n\\\\[0.4em]\nIf $f'(x_1)$ is \\textbf{close} to $0$, the tangent line is nearly flat and sends $x_2$ far away. From $x_1=1.1$, we get $x_2=2.638\\ldots$, well past the root $1.532\\ldots$ nearest to $x_1$.\n\\columnbreak\n\\begin{js}[size=600x760, frames=2, alt=\"The graph of f(x) = x cubed - 3x + 1, drawn with equal units on both axes, crossing the x-axis three times. First: at x1 = 1, a local minimum, the tangent line is horizontal and never meets the x-axis. Next: at x1 = 1.1 the tangent line is nearly flat and meets the x-axis far to the right, at x2 = 2.638....\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -2.2, x1 = 3.0, yc = 0.6;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // p fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SUB = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];\nfunction ite ath.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SUB = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];\nfunction iterates(f, fp, xa, n) {                     // x1 = xa and the next n Newton approximations\n  const xs = [xa];\n  for (let k = 0; k < n; k++) { const x = xs[k], m = fp(x); xs.push(Math.abs(m) < 1e-12 ? NaN : x - f(x) / m); }\n  return xs;\n}\nfunction drawStep(f, fp, x, color) {                  // from (x, 0) up to the graph, then along the tangent line to the x-axis\n  const y = f(x), m = fp(x);\n  seg(x, 0, x, y, colors.muted, 2, [7, 7]);\n  seg(x0, y + m * (x0 - x), x1, y + m * (x1 - x), color, 2, [4, 10]);   // the whole tangent line, dotted\n  if (Math.abs(m) > 1e-12) seg(x, y, x - y / m, 0, color, 5);\n  dot(x, y, color, 9);\n}\nfunction axisMark(x, label, color) { dot(x, 0, color, 9); tag(label, X(x), Y(0) + 46, color, 'center'); }\n\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.7;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    stat [1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) gn) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SUB = ['₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];\nfunction iterates(f, fp, xa, n) {                     // x1 = ider sets the time t as a fraction of the period; the planet is drawn at the position found by solving Kepler's equation with Newton's Method, and the readout gives M, the Newton approximations of E, and the time.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.15;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst e = 0.5, b = Math.sqrt(1 - e * e), sc = 260, cx = w / 2 + 130, cy = 400;    // a = 1; the Sun at (cx, cy)\nconst P = (E) => [cx + sc * (Math.cos(E) - e), cy - sc * b * Math.sin(E)];\nfunction kepler(M) { const Es = [M]; for (let k = 0; k < 4; k++) { const E = Es[k]; Es.push(E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E))); } return Es; }\nonFrame(() => {\n  const t = state.u, M = 2 * Math.PI * t, Es = kepler(M), E = Es[4];\n  ctx.clearRect(0, 0, w, h);\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 3; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const q = P(2 * Math.PI * i / 200); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); }\n  ctx.stroke();\n  for (let j = 0; j < 12; j++) { const q = P(kepler(2 * Math.PI * j / 12)[4]); disc(q[0], q[1], colors.muted, 5); }\n  disc(cx, cy, colors.c2, 16); tag('Sun', cx + 12, cy + 46, colors.c2);\n  const q = P(E);\n  line(cx, cy, q[0], q[1], colors.c1, 2, [6, 6]);\n  disc(q[0], q[1], colors.c1, 13);\n  tag('M = ' + dec(M, 3), 20, 40, colors.ink);\n  for (let k = 1; k <= 3; k++) tag('E' + ['₁', '₂', '₃', '₄'][k] + ' = ' + dec(Es[k], 3), 20, 40 + 40 * k, colors.c1);\n  tag('e = 0.5', w - 20, 40, colors.muted, 'right');\n  slider('time t = ' + dec(t, 2) + ' T');\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: Kepler's Equation}\n\\begin{columns}[6 6, parallel]\n\\textbf{Problem.} Take an orbit with $e=0.5$ and the time with $M=1$. Find the angle $E$ to nine decimal places.\n\\\\[0.4em]\nSolve $f(E)=E-0.5\\sin E-1=0$, with $f'(E)=1-0.5\\cos E$:\n$$E_{n+1}=E_n-\\frac{E_n-0.5\\sin E_n-1}{1-0.5\\cos E_n}.$$\nStart with $E_1=M=1$.\n\\\\[0.4em]\n\\uncover<5->{So $E=1.498701133\\ldots$ With $a=1$, the planet is at\n$$\\big(\\cos E-0.5,\\ \\tfrac{\\sqrt3}{2}\\sin E\\big)=(-0.427\\ldots,\\ 0.863\\ldots).$$}\n\\columnbreak\n\\begin{align}\nE_2 &= 1.5764693526\\ldots \\\\\n\\pause\nE_3 &= 1.5002082686\\ldots \\\\\n\\pause\nE_4 &= 1.4987017206\\ldots \\\\\n\\pause\nE_5 &= \\textcolor{c4}{1.498701133}5\\ldots \\\\\n\\pause\nE_6 &= \\textcolor{c4}{1.498701133}5\\ldots\n\\end{align}\n\\end{columns}\n\n\\slide{History: Hidden Figures}\n\\begin{columns}[8 4, parallel]\n\\textbf{Katherine Johnson} (1918–2020) was one of NASA's \\textbf{human computers}: mathematicians who did by hand the calculations that electronic computers do today.\n\\begin{itemize}\n\\item \\textbf{1961:} she computed the trajectory of Alan Shepard's \\textit{Freedom 7}, the first American spaceflight.\n\\item \\textbf{1962:} before his flight around the Earth, John Glenn asked her to recheck the electronic computer's numbers.\n\\item \\textbf{2015:} the Presidential Medal of Freedom.\n\\end{itemize}\nIn the film \\textit{Hidden Figures} (2016), she finds the reentry path with \\textbf{Euler's method}, which, like Newton's Method, steps along tangent lines.\n\\columnbreak\n\\begin{js}[size=420x480, alt=\"A schematic picture, not to scale: a capsule circles the Earth on a dashed elliptical orbit, then leaves the orbit and curves down through the atmosphere to a splashdown point on the Earth. The animation repeats.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\n\nconst cx = 280, cy = 330, RE = 150;                   // the Earth\nconst orb = (th) => [cx + 15 + 235 * Math.cos(th), cy - 205 * Math.sin(th)];\nconst th0 = 0.6, span = 1.5;                          // reentry starts at angle th0 and lands span radians later\nfunction down(u) {                                    // the reentry path, u from 0 to 1\n  const th = th0 + span * u, p = orb(th), e = u * u * (3 - 2 * u);\n  return [p[0] + (cx + RE * Math.cos(th) - p[0]) * e, p[1] + (cy - RE * Math.sin(th) - p[1]) * e];\n}\nonFrame((t) => {\n  const T = t % 9;\n  ctx.clearRect(0, 0, w, h);\n  ctx.save(); ctx.scale(w / 560, w / 560);            // drawn on a 560 by 640 grid\n  ctx.fillStyle = colors.c1; ctx.globalAlpha = 0.18; ctx.beginPath(); ctx.arc(cx, cy, RE + 18, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1;\n  disc(cx, cy, colors.c1, RE);\n  ctx.strokeStyle = colors.muted; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const p = orb(2 * Math.PI * i / 200); if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }\n  ctx.stroke(); ctx.setLineDash([]);\n  ctx.strokeStyle = colors.c2; ctx.lineWidth = 3; ctx.beginPath();\n  for (let i = 0; i <= 60; i++) { const p = down(i / 60); if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }\n  ctx.stroke();\n  let q;\n  if (T < 6) q = orb(th0 + 2 * Math.PI * (T / 3 - Math.floor(T / 3)));        // two laps of the orbit\n  else q = down(Math.min((T - 6) / 2.2, 1));                                  // then down to the Earth\n  disc(q[0], q[1], colors.ink, 10);\n  const L = down(1); disc(L[0], L[1], colors.c2, 8);\n  tag('orbit', 400, 590, colors.muted);\n  tag('reentry', 310, 100, colors.c2);\n  ctx.font = font(30); ctx.fillStyle = colors.background; ctx.textAlign = 'center'; ctx.fillText('Earth', cx, cy + 10); ctx.textAlign = 'left';\n  ctx.restore();\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Economics: What Interest Rate?}\n\\begin{columns}[8 4, parallel]\nA car costs \\$18,000, or $60$ monthly payments of \\$375. What monthly interest rate $i$ is the dealer charging?\n\\\\[0.4em]\nThe present value of the payments equals the price:\n$$375\\cdot\\frac{1-(1+i)^{-60}}{i}=18{,}000,$$\nwhich simplifies to $48i=1-(1+i)^{-60}$.\n\\pause\nSo solve $f(i)=48i-1+(1+i)^{-60}=0$, with $f'(i)=48-60(1+i)^{-61}$.\n\\pause\n\\\\[0.3em]\nCareful: $i=0$ is also a root, and it is meaningless here. Start away from it, at $i_1=0.01$ (one percent per month).\n\\columnbreak\n\\begin{js}[size=440x560, frames=1, alt=\"The graph of f(i) = 48i - 1 + (1 + i) to the -60 for i from 0 to 0.012, with a stretched horizontal scale. It starts at 0 when i = 0, dips below the axis, and crosses back up near i = 0.0076. Both roots, 0 and 0.0076..., are marked.\"]\nconst L = 80, R = 20, T = 20, B = 70;                 // margins in pixels\nconst x0 = 0, x1 = 0.0115, y0 = -0.06, y1 = 0.12;      // the window; the scales differ\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst sx = (w - L - R) / (x1 - x0), sy = (h - T - B) / (y1 - y0);   // pixels per unit on each axis\nconst X = (x) => L + (x - x0) * sx, Y = (y) => h - B - (y - y0) * sy;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(dx, dy) {                               // grid lines every dx and dy units, no numbers\n  for (let k = Math.ceil(x0 / dx - 1e-9); k * dx <= x1 + 1e-9; k++) seg(k * dx, y0, k * dx, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / dy - 1e-9); k * dy <= y1 + 1e-9; k++) seg(x0, k * dy, x1, k * dy, colors.grid, 1);\n}\nfunction axes(dgx, dgy, dlx, dly) {                   // grid lines every dgx, dgy units; tick numbers every dlx, dly units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dgx, dgy);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dlx).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), Y(0) + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dly).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(0) - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 48 * x - 1 + Math.pow(1 + x, -60);\ngrid(0.002, 0.02); seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nctx.fillStyle = colors.text; ctx.font = font(24); ctx.textAlign = 'center';\n[0.004, 0.008].forEach((v) => ctx.fillText(String(v), X(v), h - B + 32));\nctx.textAlign = 'right'; [-0.04, 0.04, 0.08].forEach((v) => ctx.fillText(String(v).replace('-', '−'), L - 10, Y(v) + 8)); ctx.textAlign = 'left';\nclip(); path((x) => x, f, 0, x1, colors.curve, 5); ctx.restore();\nring(0, 0, colors.muted, 10); ring(0.00762860281, 0, colors.c4, 10); dot(0.01, 0, colors.c1, 9);\ntag('i₁', X(0.01), Y(0) + 46, colors.c1, 'center');\ntag('f(i)', X(0.0095), Y(0.1), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\slide{Economics: Solving}\n\\begin{columns}[6 6, parallel]\n\\textbf{Problem.} Solve $48i=1-(1+i)^{-60}$ for $i>0$, starting from $i_1=0.01$.\n$$i_{n+1}=i_n-\\frac{48i_n-1+(1+i_n)^{-60}}{48-60(1+i_n)^{-61}}$$\n\\uncover<5->{The dealer charges $0.76286\\ldots$ percent per month, about $12\\cdot0.76286\\ldots=9.154\\ldots$ percent per year.}\n\\columnbreak\n\\begin{align}\ni_2 &= 0.0080098319\\ldots \\\\\n\\pause\ni_3 &= 0.0076433034\\ldots \\\\\n\\pause\ni_4 &= \\textcolor{c4}{0.00762}86267\\ldots \\\\\n\\pause\ni_5 &= \\textcolor{c4}{0.0076286028}\\ldots \\\\\n\\pause\ni_6 &= \\textcolor{c4}{0.0076286028}\\ldots\n\\end{align}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 3}\n\\begin{youtry}[time=none]{A Cube Root}\nUse Newton's Method with $f(x)=x^3-10$ and $x_1=2$ to find $x_2$, an approximation to $\\sqrt[3]{10}$.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 3: Solution}\n\\textbf{Problem.} Find $x_2$ for $f(x)=x^3-10$, starting from $x_1=2$.\n\\pause\n\\\\[0.4em]\nHere $f'(x)=3x^2$, so\n$$x_2=x_1-\\frac{\\textcolor{c2}{x_1^3-10}}{\\textcolor{c3}{3x_1^2}}=2-\\frac{8-10}{12}=2+\\frac16=2.1666\\ldots$$\n\\pause\nIn general, for $\\sqrt[3]{a}$,\n$$x_{n+1}=x_n-\\frac{x_n^3-a}{3x_n^2}=\\frac13\\left(2x_n+\\frac{a}{x_n^2}\\right).$$\n\\pause\nOne more step gives $x_3=2.154503\\ldots$, and $\\sqrt[3]{10}=2.154434\\ldots$\n\n\\section{More Examples}\n\n\\slide{Example 5: Dividing Without Division}\nComputers find $1/a$ with Newton's Method, using only multiplication and subtraction.\n\\pause\nSolve $f(x)=\\dfrac1x-a=0$, with $f'(x)=-\\dfrac{1}{x^2}$:\n$$x_{n+1}=x_n-\\frac{1/x_n-a}{-1/x_n^2}=x_n+x_n-ax_n^2=x_n(2-ax_n).$$\n\\pause\nFor $1/7$ from $x_1=0.1$:\n\\begin{align}\nx_2 &= 0.1(2-0.7)=0.13 \\\\\n\\pause\nx_3 &= 0.13(2-0.91)=0.1417 \\\\\n\\pause\nx_4 &= 0.14284777,\\qquad x_5=0.1428571422\\ldots,\\qquad x_6=0.1428571428\\ldots\n\\end{align}\nIndeed $1/7=0.142857142857\\ldots$\n\n\\slide{Example 6: A Curve Meets a Line}\n\\begin{columns}[8 4, parallel]\nFind the point where $y=e^{-x}$ meets $y=x$, to nine decimal places.\n\\pause\n\\\\[0.3em]\nSolve $f(x)=e^{-x}-x=0$, with $f'(x)=-e^{-x}-1$. The graphs cross a little to the right of $0.5$, so start with $x_1=0.5$:\n\\begin{align}\nx_2 &= 0.5663110031\\ldots,\\qquad x_3=0.5671431650\\ldots \\\\\n\\pause\nx_4 &= \\textcolor{c4}{0.567143290}4\\ldots \\\\\n\\pause\nx_5 &= \\textcolor{c4}{0.567143290}4\\ldots\n\\end{align}\nThe curves meet at $(0.567143290\\ldots,\\ 0.567143290\\ldots)$.\n\\columnbreak\n\\begin{js}[size=420x520, frames=1, alt=\"The graphs of y = e to the -x and y = x, drawn with equal units on both axes, crossing once at the point (0.567..., 0.567...).\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.6, x1 = 2.2, yc = 0.8;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\naxes(0.5, 1);\nclip(); path((x) => x, (x) => Math.exp(-x), x0, x1, colors.curve, 5); path((x) => x, (x) => x, x0, x1, colors.c1, 4); ctx.restore();\nconst r = 0.5671432904;\nseg(r, 0, r, r, colors.muted, 2, [7, 7]); dot(r, r, colors.c2, 11);\ntag('y = e⁻ˣ', X(1.2), Y(0.62), colors.curve); tag('y = x', X(1.45), Y(1.95), colors.c1);\n\\end{js}\n\\end{columns}\n\n\\section*{Wrap-Up}\n\n\\slide{Summary}\n\\begin{enumerate}\n\\item \\textbf{Newton's Method} approximates a root of $f(x)=0$ by following tangent lines to the $x$-axis:\n$$x_{n+1}=x_n-\\frac{\\textcolor{c2}{f(x_n)}}{\\textcolor{c3}{f'(x_n)}}.$$\n\\item Stop when two successive approximations agree to the number of decimal places you want. Near a root, the number of correct digits roughly doubles at each step.\n\\item Choose $x_1$ from a graph, close to the root you want. The method can fail when $f'(x_n)$ is $0$ or close to $0$, and from a poor starting point it can run away or go in circles.\n\\item Applications: square roots by averaging, Kepler's equation for the orbits of planets, and interest rates.\n\\end{enumerate}\n\n\\slide{Coming Up}\nProblem Set 18 (Newton's Method) is posted on HuskyCT.\n\\begin{table}\nWeek & Lectures & Topics\nWeek 11 & Mon 11/9 & Lecture 19: Antiderivatives\n & Wed 11/11 & Lecture 20: Review\nWeek 12 & Mon 11/16 & \\textbf{Midterm II}\n\\end{table}\n";window.LECTURE_SCALE=1.2;window.LECTURE_THEMES={};</script><script>(function LECTURE_ENGINE() {
