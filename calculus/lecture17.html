 tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.2;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);  as a function of \\textcolor{c1}{one variable}. Write down the \\textcolor{c2}{interval} where that variable lives.\n\\item \\textbf{Find the absolute maximum or minimum} of that function on that interval, with the methods of Sections 4.1 and 4.3.\n\\end{enumerate}\n\n\\slide{Example 1: Setting Up}\n\\begin{columns}[7 5, parallel]\nLet $x$ be the depth and $y$ the width of the field, in feet. Maximize the area\n$$\\textcolor{c4}{A=xy}.$$\n\\pause\nThe constraint: $2400$ ft of fencing on three sides,\n$$\\textcolor{c2}{2x+y=2400}\\quad\\Longrightarrow\\quad y=2400-2x.$$\n\\pause\nSubstitute into $A$:\n$$A(x)=x(2400-2x)=\\textcolor{c4}{2400x-2x^2}.$$\n\\pause\nThe depth satisfies $x\\ge0$ and $y\\ge0$, so the interval is $\\textcolor{c1}{0\\le x\\le1200}$.\n\\columnbreak\n\\begin{js}[size=600x420, frames=1, alt=\"A diagram of the field: a river along the bottom; a rectangle above it with its two sides of depth x and its top side of width y fenced; the area A is inside.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nctx.fillStyle = colors.c1; ctx.globalAlpha = 0.18; ctx.fillRect(20, 300, 560, 50); ctx.globalAlpha = 1;\ntag('river', 300, 336, colors.c1, 'center');\nctx.fillStyle = colors.c4; ctx.globalAlpha = 0.15; ctx.fillRect(130, 120, 340, 180); ctx.globalAlpha = 1;\nctx.strokeStyle = colors.c2; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(130, 300); ctx.lineTo(130, 120); ctx.lineTo(470, 120); ctx.lineTo(470, 300); ctx.stroke();\ntag('x', 104, 220, colors.c2, 'center'); tag('x', 496, 220, colors.c2, 'center'); tag('y', 300, 104, colors.c2, 'center');\ntag('A', 300, 222, colors.c4, 'center');\n\\end{js}\n\\end{columns}\n\n\\slide{Example 1: Solving}\n\\begin{columns}[7 5, parallel]\nMaximize $A(x)=2400x-2x^2$ on $[0,1200]$.\n\\begin{theorem}{Closed Interval Method}\nThe absolute extreme values of a continuous function on $[a,b]$ occur at critical numbers in $(a,b)$ or at the endpoints $a$, $b$.\n\\end{theorem}\n\\pause\n$A'(x)=2400-4x=0$ when $x=600$.\n\\pause\n$$A(0)=0,\\qquad A(\\textcolor{c4}{600})=\\textcolor{c4}{720{,}000},\\qquad A(1200)=0.$$\n\\pause\nThe field should be $600$ ft deep and $y=2400-1200=1200$ ft wide, with area $720{,}000$ ft$^2$.\n\\columnbreak\n\\begin{js}[size=600x560, frames=1, alt=\"The graph of A(x) = 2400x - 2x squared for x from 0 to 1200, with the endpoints (0, 0) and (1200, 0) and the highest point (600, 720000) marked.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nconst G = panel(110, 30, 470, 460, 0, 1250, 0, 800000, 200, 100000, 3, 2);\ngraph(G, (x) => 2400 * x - 2 * x * x, 0, 1200, colors.curve, 5);\ndisc(G.X(0), G.Y(0), colors.ink, 10); disc(G.X(1200), G.Y(0), colors.ink, 10);\ndisc(G.X(600), G.Y(720000), colors.c4, 12);\ntag('(600, 720000)', G.X(600), G.Y(720000) - 20, colors.c4, 'center');\ntag('y = A(x)', G.X(980), G.Y(380000), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\section{Absolute Extreme Values}\n\n\\slide{The First Derivative Test for Absolute Extreme Values}\n\\begin{theorem}{First Derivative Test for Absolute Extreme Values}\nLet $c$ be a critical number of a continuous function $f$ on an interval.\n\\begin{enumerate}[tight]\n\\item[(a)] If $\\textcolor{c4}{f'(x)>0}$ for \\textbf{all} $x<c$ and $\\textcolor{c2}{f'(x)<0}$ for \\textbf{all} $x>c$, then $f(c)$ is the \\textbf{absolute maximum}.\n\\item[(b)] If $\\textcolor{c2}{f'(x)<0}$ for \\textbf{all} $x<c$ and $\\textcolor{c4}{f'(x)>0}$ for \\textbf{all} $x>c$, then $f(c)$ is the \\textbf{absolute minimum}.\n\\end{enumerate}\n\\end{theorem}\n\\begin{columns}[7 5, parallel]\nUse it on intervals that are not closed, like $(0,\\infty)$. Why (b): $f$ falls all the way to $c$ and rises after, so no value is below $f(c)$.\n\\columnbreak\n\\begin{js}[size=560x290, frames=1, alt=\"The graph of a function on the interval x greater than 0 that decreases (orange) all the way to a critical number c and increases (green) after it, so f(c) is the smallest value of f on the whole interval.\"]\nconst L = 40, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -0.2, x1 = 4.4, yc = 1.1;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst f = (x) => 0.35 * x * x + 2.4 / x - 1.4, c = Math.cbrt(2.4 / 0.7);\ngrid(0.5);\nseg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\nclip(); path((x) => x, f, 0.5, c, colors.c2, 6); path((x) => x, f, c, x1, colors.c4, 6); ctx.restore();\nseg(c, 0, c, f(c), colors.muted, 2, [6, 6]); dot(c, f(c), colors.ink, 11);\ntag('c', X(c), Y(0) + 34, colors.ink, 'center');\ntag('absolute minimum', X(c) + 20, Y(f(c)) - 16, colors.ink);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: The Cheapest Can}\n\\begin{columns}[5 7, parallel]\nA cylindrical can is to hold $1$ L $=1000$ cm$^3$ of oil. Find the dimensions that use the \\textbf{least metal}, that is, the smallest surface area.\n\\\\[0.5em]\nMove the radius. A thin can is very tall; a wide can is very flat.\n\\columnbreak\n\\begin{js}[size=940x760, alt=\"Left: the side view of a cylindrical can holding 1000 cubic centimeters, drawn to scale, which becomes tall and thin or short and wide as a slider changes its radius r from 3 to 12 centimeters. Right: the graph of the surface area A(r) = 2 pi r squared + 2000/r, with the current radius marked; the readout gives r, the height h, and the area. The smallest area, 553.58... square centimeters, occurs at r = 5.419... centimeters, where h = 2r.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.6;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst A = (r) => 2 * Math.PI * r * r + 2000 / r;\nonFrame(() => {\n  const r = 3 + 9 * state.u, hh = 1000 / (Math.PI * r * r);\n  ctx.clearRect(0, 0, w, h);\n  const s = 13, cx = 200, by = 590;                   // pixels per cm in the drawing of the can\n  ctx.fillStyle = colors.c1; ctx.globalAlpha = 0.15; ctx.fillRect(cx - s * r, by - s * hh, 2 * s * r, s * hh); ctx.globalAlpha = 1;\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 4;\n  ctx.strokeRect(cx - s * r, by - s * hh, 2 * s * r, s * hh);\n  ctx.beginPath(); ctx.ellipse(cx, by - s * hh, s * r, 10, 0, 0, 2 * Math.PI); ctx.stroke();\n  ctx.beginPath(); ctx.ellipse(cx, by, s * r, 10, 0, 0, Math.PI); ctx.stroke();\n  tag('r = ' + dec(r, 2) + ' cm', 20, 40, colors.ink);\n  tag('h = ' + dec(hh, 2) + ' cm', 20, 82, colors.ink);\n  tag('A = ' + dec(A(r), 1) + ' cm²', 20, 124, colors.c4);\n  const G = panel(500, 30, 420, 470, 0, 13, 0, 1000, 1, 100, 2, 2);\n  graph(G, A, 2.1, 13, colors.curve, 4);\n  disc(G.X(r), G.Y(A(r)), colors.c4, 10);\n  tag('A(r)', G.X(11), G.Y(900), colors.curve);\n  slider('radius r = ' + dec(r, 2) + ' cm');\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: Setting Up}\n\\begin{columns}[7 5, parallel]\nLet $r$ be the radius and $h$ the height, in cm. The top and bottom are disks of area $\\pi r^2$; the side unrolls to a rectangle $2\\pi r$ by $h$.\n$$\\textcolor{c4}{A=2\\pi r^2+2\\pi rh}.$$\n\\pause\nThe constraint is the volume:\n$$\\textcolor{c2}{\\pi r^2h=1000}\\quad\\Longrightarrow\\quad h=\\frac{1000}{\\pi r^2}.$$\n\\pause\nSubstitute:\n$$A(r)=2\\pi r^2+2\\pi r\\cdot\\frac{1000}{\\pi r^2}=\\textcolor{c4}{2\\pi r^2+\\frac{2000}{r}},\\qquad\\textcolor{c1}{r>0}.$$\n\\columnbreak\n\\begin{js}[size=560x430, frames=1, alt=\"The surface of a can taken apart: two disks of radius r for the top and bottom, each of area pi r squared, and the side unrolled into a rectangle of width 2 pi r and height h.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nctx.strokeStyle = colors.c1; ctx.lineWidth = 4; ctx.fillStyle = colors.c1;\n[[90, 90], [90, 300]].forEach((p) => { ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(p[0], p[1], 62, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1; ctx.stroke(); line(p[0], p[1], p[0] + 62, p[1], colors.ink, 2); tag('r', p[0] + 22, p[1] - 8, colors.ink); });\nctx.globalAlpha = 0.15; ctx.fillRect(210, 60, 320, 270); ctx.globalAlpha = 1; ctx.strokeRect(210, 60, 320, 270);\ntag('2πr', 370, 46, colors.ink, 'center'); tag('h', 552, 205, colors.ink, 'center');\ntag('πr² each', 92, 408, colors.muted, 'center'); tag('area 2πrh', 370, 372, colors.muted, 'center');\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: Solving}\n\\begin{columns}[7 5, parallel]\nDifferentiate and put over a common denominator:\n\\begin{align}\nA'(r) &= 4\\pi r-\\frac{2000}{r^2}=\\frac{4(\\pi r^3-500)}{r^2}\n\\end{align}\n\\pause\n$A'(r)=0$ when $\\pi r^3=500$, at $r=\\sqrt[3]{500/\\pi}=5.419\\ldots$ cm.\n\\pause\nFor smaller $r$, $\\pi r^3<500$ and $\\textcolor{c2}{A'(r)<0}$; for larger $r$, $\\textcolor{c4}{A'(r)>0}$. By the First Derivative Test for Absolute Extreme Values, this is the \\textbf{absolute minimum}.\n\\columnbreak\n\\begin{js}[size=560x560, frames=1, alt=\"The graph of A(r) = 2 pi r squared + 2000/r for r from 2 to 13 centimeters, orange where it decreases and green where it increases, with its lowest point at r = 5.419... marked.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nconst A = (r) => 2 * Math.PI * r * r + 2000 / r, c = Math.cbrt(500 / Math.PI);\nconst G = panel(80, 20, 460, 470, 0, 13, 0, 1000, 1, 100, 2, 2);\ngraph(G, A, 2.1, c, colors.c2, 5); graph(G, A, c, 13, colors.c4, 5);\ndisc(G.X(c), G.Y(A(c)), colors.ink, 11);\ntag('(5.419…, 553.5…)', G.X(c) + 14, G.Y(A(c)) + 44, colors.ink);\n\\end{js}\n\\end{columns}\n\n\\slide{Example 2: The Answer}\n\\begin{columns}[7 5, parallel]\nAt $r=\\sqrt[3]{500/\\pi}$ we have $\\pi r^3=500$. Use this to simplify the height:\n$$h=\\frac{1000}{\\pi r^2}=\\frac{2\\cdot500}{\\pi r^2}=\\frac{2\\pi r^3}{\\pi r^2}=2r.$$\n\\pause\nThe cheapest can is as tall as it is wide: $r=5.419\\ldots$ cm and $h=10.838\\ldots$ cm, with surface area $553.58\\ldots$ cm$^2$.\n\\pause\nReal cans are usually taller. Lids cut from square sheets waste metal, and seams cost money, which changes the function being minimized.\n\\columnbreak\n\\begin{js}[size=440x520, frames=1, alt=\"The side view of the cheapest can, drawn to scale: radius 5.419 centimeters and height 10.838 centimeters, so it is as tall as it is wide.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nconst r = Math.cbrt(500 / Math.PI), hh = 2 * r, s = 30, cx = 220, by = 430;\nctx.fillStyle = colors.c1; ctx.globalAlpha = 0.15; ctx.fillRect(cx - s * r, by - s * hh, 2 * s * r, s * hh); ctx.globalAlpha = 1;\nctx.strokeStyle = colors.c1; ctx.lineWidth = 4; ctx.strokeRect(cx - s * r, by - s * hh, 2 * s * r, s * hh);\nctx.beginPath(); ctx.ellipse(cx, by - s * hh, s * r, 14, 0, 0, 2 * Math.PI); ctx.stroke();\nctx.beginPath(); ctx.ellipse(cx, by, s * r, 14, 0, 0, Math.PI); ctx.stroke();\nline(cx, by - s * hh / 2, cx + s * r, by - s * hh / 2, colors.ink, 2); tag('r', cx + s * r / 2, by - s * hh / 2 - 10, colors.ink, 'center');\ntag('h = 2r', cx, by + 64, colors.ink, 'center');\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 1, Part I}\n\\begin{youtry}[time=none]{A Rectangle: Setting Up}\nFind the dimensions of a rectangle with perimeter $100$ m whose area is as large as possible.\n\\\\[0.5em]\n\\textbf{Part I.} Write the area as a function of \\textcolor{c1}{one variable}, and give the \\textcolor{c1}{interval} where that variable lives.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 1, Part I: Solution}\n\\textbf{Problem.} A rectangle with perimeter $100$ m has the largest possible area. Write the area as a function of one variable on an interval.\n\\pause\nCall the sides $x$ and $y$, in meters. Maximize $\\textcolor{c4}{A=xy}$. The constraint is the perimeter:\n$$\\textcolor{c2}{2x+2y=100}\\quad\\Longrightarrow\\quad y=50-x.$$\n\\pause\nSubstitute into $A$:\n$$\\textcolor{c4}{A(x)=x(50-x)=50x-x^2}.$$\n\\pause\nBoth sides are lengths: $x\\ge0$ and $y=50-x\\ge0$. The interval is $\\textcolor{c1}{0\\le x\\le50}$.\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 1, Part II}\n\\begin{youtry}[time=none]{A Rectangle: Solving}\nFind the dimensions of a rectangle with perimeter $100$ m whose area is as large as possible.\n\\\\[0.5em]\n\\textbf{From Part I.} With sides $x$ and $y=50-x$, maximize\n$$\\textcolor{c4}{A(x)=50x-x^2},\\qquad\\textcolor{c1}{0\\le x\\le50}.$$\n\\textbf{Part II.} Find the absolute maximum, and answer the question.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 1, Part II: Solution}\n\\begin{columns}[7 5, parallel]\n\\textbf{Problem.} Maximize $\\textcolor{c4}{A(x)=50x-x^2}$ on $\\textcolor{c1}{[0,50]}$, the area of a rectangle with sides $x$ and $50-x$.\n\\pause\n$A'(x)=50-2x=0$ at $x=25$.\n\\pause\nThe interval is closed, so compare values:\n$$A(0)=0,\\qquad A(25)=625,\\qquad A(50)=0.$$\n\\pause\nThe best rectangle is a $25$ m by $25$ m square, with area $625$ m$^2$.\n\\columnbreak\n\\begin{js}[size=560x480, frames=1, alt=\"The graph of A(x) = 50x - x squared for x from 0 to 50, a hill with its highest point (25, 625) marked.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\n\nconst G = panel(80, 20, 460, 400, 0, 52, 0, 700, 5, 100, 2, 2);\ngraph(G, (x) => 50 * x - x * x, 0, 50, colors.curve, 5);\ndisc(G.X(25), G.Y(625), colors.c4, 11); tag('(25, 625)', G.X(25), G.Y(625) - 20, colors.c4, 'center');\n\\end{js}\n\\end{columns}\n\n\\section{Geometry}\n\n\\slide{Example 3: The Closest Point}\n\\begin{columns}[5 7, parallel]\nFind the point on the parabola $y^2=2x$ closest to the point $(1,4)$.\n\\\\[0.5em]\nMove the point $(x,y)$ along the parabola. The circle centered at $(1,4)$ passes through it; at the closest point the circle just touches the parabola.\n\\columnbreak\n\\begin{js}[size=900x780, alt=\"The parabola y squared = 2x, drawn with equal units on both axes, and the point (1, 4). A slider moves a point (x, y) along the parabola; a segment joins it to (1, 4), and a circle centered at (1, 4) passes through it, with a readout of the distance. The distance is smallest, the square root of 5 = 2.236..., at the point (2, 2), where the circle touches the parabola.\"]\nconst L = 56, R = 16, T = 16, B = 130;                 // margins in pixels\nconst x0 = -1.2, x1 = 6.2, yc = 2.4;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.25;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nonFrame(() => {\n  const yy = -1 + 5.5 * state.u, xx = yy * yy / 2, d = Math.hypot(xx - 1, yy - 4);\n  ctx.clearRect(0, 0, w, h);\n  axes(0.5, 1);\n  clip();\n  path((t) => t * t / 2, (t) => t, -3, 3.6, colors.curve, 5);\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 2; ctx.setLineDash([8, 7]);\n  ctx.beginPath(); ctx.arc(X(1), Y(4), d * s, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);\n  ctx.restore();\n  seg(1, 4, xx, yy, colors.c2, 4);\n  dot(1, 4, colors.ink, 11); tag('(1, 4)', X(1) - 16, Y(4) - 14, colors.ink, 'right');\n  dot(xx, yy, colors.c2, 12);\n  tag('(x, y) = (' + dec(xx, 2) + ', ' + dec(yy, 2) + ')', w - R - 10, h - B - 60, colors.ink, 'right');\n  tag('distance d = ' + dec(d, 3), w - R - 10, h - B - 18, colors.c2, 'right');\n  slider('y = ' + dec(yy, 2));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 3: Solving}\nThe distance is $d=\\sqrt{(x-1)^2+(y-4)^2}$, with $x=y^2/2$ on the parabola. \\textbf{Minimize $d^2$ instead}: $d$ and $d^2$ are smallest at the same point, and $d^2$ has no square root.\n\\pause\n\\begin{align}\nf(y)=d^2 &= \\left(\\tfrac12y^2-1\\right)^2+(y-4)^2 \\\\\n\\pause\nf'(y) &= 2\\left(\\tfrac12y^2-1\\right)\\cdot y+2(y-4)=y^3-2y+2y-8=y^3-8\n\\end{align}\n\\pause\n$f'(y)=0$ at $y=2$. Since $\\textcolor{c2}{f'(y)<0}$ for $y<2$ and $\\textcolor{c4}{f'(y)>0}$ for $y>2$, this is the absolute minimum. The closest point is $(x,y)=(2^2/2,\\,2)=(2,2)$, at distance $d=\\sqrt{1+4}=\\sqrt5=2.236\\ldots$\n\n\\slide{Example 4: A Rectangle in a Semicircle}\n\\begin{columns}[5 7, parallel]\nFind the area of the largest rectangle that can be inscribed in a semicircle of radius $r$.\n\\\\[0.5em]\nTwo corners lie on the diameter, and two on the arc. Here $r=2$.\n\\columnbreak\n\\begin{js}[size=900x620, alt=\"A semicircle of radius 2 on the x-axis, drawn with equal units on both axes, and a rectangle inscribed in it with corners at (plus or minus x, 0) and (plus or minus x, y) on the arc. A slider moves x from 0 to 2; the readout gives x, y, and the area 2xy. The area is largest, 4 = r squared, at x = 1.414... = 2 over root 2.\"]\nconst L = 40, R = 40, T = 16, B = 130;                 // margins in pixels\nconst x0 = -2.4, x1 = 2.4, yc = 1.0;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.4;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst r = 2;\nonFrame(() => {\n  const x = r * state.u, y = Math.sqrt(Math.max(0, r * r - x * x)), A = 2 * x * y;\n  ctx.clearRect(0, 0, w, h);\n  grid(0.5);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, -0.2, 0, y1, colors.axis, 2);\n  path((t) => r * Math.cos(t), (t) => r * Math.sin(t), 0, Math.PI, colors.curve, 5);\n  poly([[-x, 0], [x, 0], [x, y], [-x, y]], colors.c4, 0.18);\n  ctx.strokeStyle = colors.c2; ctx.lineWidth = 4; ctx.strokeRect(X(-x), Y(y), 2 * x * s, y * s);\n  dot(x, y, colors.c2, 11);\n  tag('(x, y)', X(x) + 14, Y(y) - 12, colors.c2);\n  tag('area 2xy = ' + dec(A, 3), X(0), Y(0) - 20 - (y * s > 80 ? 0 : 0), colors.c4, 'center');\n  tag('x = ' + dec(x, 3) + ',  y = ' + dec(y, 3), L, 40, colors.ink);\n  slider('x = ' + dec(x, 3));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 4: Solving}\nOn the upper half of $x^2+y^2=r^2$, the corner $(x,y)$ has $y=\\sqrt{r^2-x^2}$, so\n$$\\textcolor{c4}{A(x)=2x\\sqrt{r^2-x^2}},\\qquad\\textcolor{c1}{0\\le x\\le r}.$$\n\\pause\nBy the product and chain rules,\n$$A'(x)=2\\sqrt{r^2-x^2}-\\frac{2x^2}{\\sqrt{r^2-x^2}}=\\frac{2(r^2-2x^2)}{\\sqrt{r^2-x^2}}.$$\n\\pause\n$A'(x)=0$ at $x=r/\\sqrt2$. With $A(0)=A(r)=0$, the maximum is\n$$A\\!\\left(\\frac{r}{\\sqrt2}\\right)=2\\cdot\\frac{r}{\\sqrt2}\\cdot\\frac{r}{\\sqrt2}=r^2.$$\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 2, Part I}\n\\begin{youtry}[time=none]{A Closest Point: Setting Up}\nFind the point on the line $y=2x+3$ that is closest to the origin.\n\\\\[0.5em]\n\\textbf{Part I.} Write the quantity to minimize as a function of \\textcolor{c1}{one variable}, and give the \\textcolor{c1}{interval} where that variable lives.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:00, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:00', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{60}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 2, Part I: Solution}\n\\textbf{Problem.} Find the point on $y=2x+3$ closest to the origin. Write the quantity to minimize as a function of one variable on an interval.\n\\pause\nA point on the line is $(x,\\,2x+3)$. Its distance to the origin is\n$$d=\\sqrt{x^2+(2x+3)^2}.$$\n\\pause\nAs in Example 3, minimize $d^2$ instead of $d$:\n$$\\textcolor{c4}{f(x)=x^2+(2x+3)^2=5x^2+12x+9}.$$\n\\pause\nEvery point of the line is allowed, so the interval is $\\textcolor{c1}{(-\\infty,\\infty)}$.\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 2, Part II}\n\\begin{youtry}[time=none]{A Closest Point: Solving}\nFind the point on the line $y=2x+3$ that is closest to the origin.\n\\\\[0.5em]\n\\textbf{From Part I.} The square of the distance from $(x,\\,2x+3)$ to the origin is\n$$\\textcolor{c4}{f(x)=5x^2+12x+9},\\qquad\\textcolor{c1}{-\\infty<x<\\infty}.$$\n\\textbf{Part II.} Find the absolute minimum, and the closest point.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 2, Part II: Solution}\n\\begin{columns}[7 5, parallel]\n\\textbf{Problem.} Minimize $\\textcolor{c4}{f(x)=5x^2+12x+9}$ on $\\textcolor{c1}{(-\\infty,\\infty)}$, the square of the distance from $(x,\\,2x+3)$ to the origin.\n\\pause\n$f'(x)=10x+12=0$ at $x=-1.2$. The interval is not closed, so use the First Derivative Test for Absolute Extreme Values. Since $\\textcolor{c2}{f'<0}$ to the left and $\\textcolor{c4}{f'>0}$ to the right, this is the absolute minimum.\n\\pause\nThe closest point is $(-1.2,\\;2(-1.2)+3)=(-1.2,\\;0.6)$, at distance $\\sqrt{1.44+0.36}=\\sqrt{1.8}=1.341\\ldots$\n\\columnbreak\n\\begin{js}[size=560x560, frames=1, alt=\"The line y = 2x + 3 and the origin, drawn with equal units on both axes, with the closest point (-1.2, 0.6) marked and the segment from the origin to it, which is perpendicular to the line.\"]\nconst L = 56, R = 16, T = 16, B = 56;                 // margins in pixels\nconst x0 = -3, x1 = 1.5, yc = 0.8;                    // x-window, and the y-value at mid-height\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nconst s = (w - L - R) / (x1 - x0);                    // pixels per unit, the same on both axes\nconst y0 = yc - (h - T - B) / s / 2, y1 = yc + (h - T - B) / s / 2;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nfunction seg(ax, ay, bx, by, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(X(ax), Y(ay)); ctx.lineTo(X(bx), Y(by)); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction dot(x, y, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); }\nfunction ring(x, y, color, r) {\n  ctx.fillStyle = colors.background; ctx.strokeStyle = color; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(X(x), Y(y), r || 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n}\nfunction path(fx, fy, t0, t1, color, width, dash) {   // the curve (fx(t), fy(t)) for t from t0 to t1\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 400; i++) { const t = t0 + (t1 - t0) * i / 400; if (i) ctx.lineTo(X(fx(t)), Y(fy(t))); else ctx.moveTo(X(fx(t)), Y(fy(t))); }\n  ctx.stroke(); ctx.setLineDash([]);\n}\nfunction poly(pts, color, alpha) {                    // a filled polygon through the points [x, y]\n  ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = color; ctx.beginPath();\n  pts.forEach((p, i) => { if (i) ctx.lineTo(X(p[0]), Y(p[1])); else ctx.moveTo(X(p[0]), Y(p[1])); });\n  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction arrow(ax, ay, bx, by, color, width) {        // an arrow from (ax, ay) to (bx, by)\n  seg(ax, ay, bx, by, color, width);\n  const a = Math.atan2(Y(by) - Y(ay), X(bx) - X(ax)), px = X(bx), py = Y(by), r = 18;\n  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px - r * Math.cos(a - 0.45), py - r * Math.sin(a - 0.45));\n  ctx.lineTo(px - r * Math.cos(a + 0.45), py - r * Math.sin(a + 0.45)); ctx.closePath(); ctx.fill();\n}\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction grid(d) {                                    // grid lines every d units, no numbers\n  for (let k = Math.ceil(x0 / d - 1e-9); k * d <= x1 + 1e-9; k++) seg(k * d, y0, k * d, y1, colors.grid, 1);\n  for (let k = Math.ceil(y0 / d - 1e-9); k * d <= y1 + 1e-9; k++) seg(x0, k * d, x1, k * d, colors.grid, 1);\n}\nfunction axes(dg, dl) {                               // grid lines every dg units, tick numbers every dl units\n  const ks = (lo, hi, d) => { const out = []; for (let k = Math.ceil(lo / d - 1e-9); k * d <= hi + 1e-9; k++) out.push(k * d); return out; };\n  const num = (v) => String(+v.toFixed(2)).replace('-', '−');\n  grid(dg);\n  seg(x0, 0, x1, 0, colors.axis, 2); seg(0, y0, 0, y1, colors.axis, 2);\n  ctx.fillStyle = colors.text; ctx.font = font(26); ctx.textAlign = 'center';\n  ks(x0, x1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), X(v), h - B + 32); });\n  ctx.textAlign = 'right';\n  ks(y0, y1, dl).forEach((v) => { if (Math.abs(v) > 1e-9) ctx.fillText(num(v), L - 10, Y(v) + 9); });\n  ctx.textAlign = 'left';\n}\nfunction clip() { ctx.save(); ctx.beginPath(); ctx.rect(L, T, w - L - R, h - T - B); ctx.clip(); }\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\naxes(0.5, 1);\nclip(); path((x) => x, (x) => 2 * x + 3, -4, 2, colors.curve, 5); ctx.restore();\nseg(0, 0, -1.2, 0.6, colors.c2, 4);\ndot(0, 0, colors.ink, 10); dot(-1.2, 0.6, colors.c2, 12);\ntag('(−1.2, 0.6)', X(-1.2) - 16, Y(0.6) + 12, colors.c2, 'right');\ntag('y = 2x + 3', X(0.15), Y(2.3), colors.curve);\n\\end{js}\n\\end{columns}\n\n\\section{Applications}\n\n\\slide{Example 5: Rowing and Running}\n\\begin{columns}[5 7, parallel]\nA woman at point $A$ on the bank of a river $3$ km wide wants to reach point $B$, $8$ km downstream on the opposite bank, as quickly as possible.\n\\\\[0.4em]\nShe rows at $6$ km/h to a point $D$ on the opposite bank, $x$ km downstream from $C$, then runs at $8$ km/h to $B$.\n\\\\[0.4em]\nWhere should she land?\n\\columnbreak\n\\begin{js}[size=940x780, alt=\"Left: a map, drawn to scale, of a river 3 kilometers wide running vertically, with A on the left bank, C directly across, B 8 kilometers downstream from C, and a landing point D between C and B. The rowing path from A to D and the running path from D to B are drawn. Right: the graph of the total time T(x) for x from 0 to 8. A slider moves D; the readout gives x and the time. The time is smallest, 1.330... hours, at x = 3.401... kilometers.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.15;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst T = (x) => Math.sqrt(x * x + 9) / 6 + (8 - x) / 8;\nonFrame(() => {\n  const x = 8 * state.u;\n  ctx.clearRect(0, 0, w, h);\n  const s = 68, ax = 60, ay = 60;                     // the map: pixels per km; A at (ax, ay); the river runs down the page\n  const MX = (u) => ax + u * s, MY = (v) => ay + v * s;\n  ctx.fillStyle = colors.c1; ctx.globalAlpha = 0.15; ctx.fillRect(MX(0), MY(-0.5), 3 * s, 9 * s); ctx.globalAlpha = 1;\n  line(MX(0), MY(-0.5), MX(0), MY(8.5), colors.c1, 2); line(MX(3), MY(-0.5), MX(3), MY(8.5), colors.c1, 2);\n  line(MX(0), MY(0), MX(3), MY(x), colors.c1, 5);\n  line(MX(3), MY(x), MX(3), MY(8), colors.c2, 7);\n  disc(MX(0), MY(0), colors.ink, 10); disc(MX(3), MY(0), colors.ink, 8); disc(MX(3), MY(8), colors.ink, 10); disc(MX(3), MY(x), colors.c2, 11);\n  tag('A', MX(0) - 14, MY(0) + 10, colors.ink, 'right'); tag('C', MX(3) + 14, MY(0) + 10, colors.ink);\n  tag('B', MX(3) + 14, MY(8) + 10, colors.ink); tag('D', MX(3) + 14, MY(x) + 10, colors.c2);\n  tag('row', MX(1.1), MY(x / 2) + 40, colors.c1); tag('run', MX(3) + 16, MY((x + 8) / 2) + 10, colors.c2);\n  const G = panel(400, 40, 520, 450, 0, 8.5, 0, 1.7, 1, 0.1, 2, 5);\n  graph(G, T, 0, 8, colors.curve, 4);\n  disc(G.X(x), G.Y(T(x)), colors.c2, 10);\n  tag('T(x) in hours', G.X(0.3), G.Y(0.85), colors.curve);\n  tag('x = ' + dec(x, 2) + ' km', G.X(4), G.Y(0.6), colors.ink);\n  tag('T = ' + dec(T(x), 3) + ' h', G.X(4), G.Y(0.45), colors.ink);\n  slider('landing point: x = ' + dec(x, 2) + ' km');\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 5: Solving}\nRowing $\\sqrt{x^2+9}$ km at $6$ km/h, then running $8-x$ km at $8$ km/h:\n$$\\textcolor{c4}{T(x)=\\frac{\\sqrt{x^2+9}}{6}+\\frac{8-x}{8}},\\qquad\\textcolor{c1}{0\\le x\\le8}.$$\n\\pause\n$$T'(x)=\\frac{x}{6\\sqrt{x^2+9}}-\\frac18.$$\n\\pause\n\\begin{align}\nT'(x)=0 &\\quad\\Longleftrightarrow\\quad 4x=3\\sqrt{x^2+9}\\quad\\Longleftrightarrow\\quad 16x^2=9x^2+81 \\\\\n\\pause\n\\phantom{T'(x)=0} &\\quad\\Longleftrightarrow\\quad x=\\frac{9}{\\sqrt7}=3.401\\ldots\n\\end{align}\n\\pause\nBoth $x=0$ and $x=8$ are allowed, so we compare values.\n\n\\slide{Example 5: The Answer}\nThe interval $[0,8]$ is closed, so use the Closed Interval Method:\n$$T(0)=1.5,\\qquad T\\!\\left(\\frac{9}{\\sqrt7}\\right)=1+\\frac{\\sqrt7}{8}=1.330\\ldots,\\qquad T(8)=\\frac{\\sqrt{73}}{6}=1.424\\ldots$$\n\\pause\nThe smallest value is at the critical number. She should land $3.401\\ldots$ km downstream from $C$. The trip takes $1.330\\ldots$ hours, about $80$ minutes.\n\\\\[0.4em]\nRowing straight across ($x=0$) takes $90$ minutes; rowing all the way to $B$ ($x=8$) takes about $85$ minutes.\n\n\\slide{Business: Revenue}\n\\begin{columns}[6 6, parallel]\nIf $x$ units sell at price $p(x)$ each (the \\textbf{demand function}), the \\textbf{revenue} is\n$$R(x)=x\\,p(x).$$\nWith cost $C(x)$, the \\textbf{profit} is $P(x)=R(x)-C(x)$. The derivatives $R'$, $C'$, $P'$ are the marginal revenue, cost, and profit.\n\\heading{Example 6}\nA store sells $200$ monitors a week at \\$350 each. For each \\$10 rebate, it sells $20$ more per week. What rebate maximizes revenue?\n\\columnbreak\n\\begin{js}[size=780x700, alt=\"The revenue R(x) = 450x - x squared over 2 against the number x of monitors sold per week, from 200 to 700. A slider chooses x; the readout gives the price, the rebate, and the weekly revenue. Revenue is largest, 101250 dollars, at x = 450 monitors, a price of 225 dollars and a rebate of 125 dollars.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.2;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.
