measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst p = (x) => 450 - x / 2, Rv = (x) => x * p(x);\nonFrame(() => {\n  const x = 200 + 500 * state.u;\n  ctx.clearRect(0, 0, w, h);\n  const G = { X: (v) => 110 + (v - 200) / 500 * 640, Y: (v) => 500 - (v - 50000) / 60000 * 450 };\n  for (let v = 300; v <= 700; v += 100) line(G.X(v), 50, G.X(v), 500, colors.grid, 1);\n  for (let v = 60000; v <= 110000; v += 10000) line(110, G.Y(v), 750, G.Y(v), colors.grid, 1);\n  line(110, 500, 750, 500, colors.axis, 2); line(110, 50, 110, 500, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = 200; v <= 700; v += 100) ctx.fillText(String(v), G.X(v), 530);\n  ctx.textAlign = 'right';\n  for (let v = 60000; v <= 110000; v += 20000) ctx.fillText((v / 1000) + 'k', 100, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let i = 0; i <= 200; i++) { const v = 200 + 500 * i / 200; if (i) ctx.lineTo(G.X(v), G.Y(Rv(v))); else ctx.moveTo(G.X(v), G.Y(Rv(v))); }\n  ctx.stroke();\n  disc(G.X(x), G.Y(Rv(x)), colors.c4, 11);\n  tag('x = ' + Math.round(x) + ' sold per week', 130, 420, colors.ink);\n  tag('price $' + dec(p(Math.round(x)), 0) + ', rebate $' + dec(350 - p(Math.round(x)), 0), 130, 462, colors.ink);\n  tag('revenue $' + Math.round(Rv(Math.round(x))).toLocaleString('en-US'), 430, 90, colors.c4);\n  slider('x = ' + Math.round(x));\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 6: Solving}\nLet $x$ be the number sold per week. Each extra unit sold beyond $200$ lowers the price by $10/20=0.5$ dollars:\n$$p(x)=350-0.5(x-200)=450-0.5x.$$\n\\pause\nThe revenue is\n$$\\textcolor{c4}{R(x)=x\\,p(x)=450x-0.5x^2},\\qquad R'(x)=450-x.$$\n\\pause\n$R'(x)=0$ at $x=450$, with $\\textcolor{c4}{R'>0}$ before and $\\textcolor{c2}{R'<0}$ after: the absolute maximum.\n\\pause\nThe price is $p(450)=450-225=225$ dollars, a rebate of $350-225=125$ dollars. Weekly revenue is $450\\cdot225=101{,}250$ dollars.\n\n\\slide[scale=0.95]{Physics: Light Takes the Fastest Path}\n\\begin{columns}[7 5, parallel]\n\\textbf{Fermat's Principle:} light takes the path of \\textbf{least time}. From $A$ in air (speed $v_1$) to $B$ in water (speed $v_2$), crossing at $x$:\n$$T(x)=\\frac{\\sqrt{a^2+x^2}}{v_1}+\\frac{\\sqrt{b^2+(d-x)^2}}{v_2}.$$\n\\pause\nWith $\\sin\\theta_1=\\frac{x}{\\sqrt{a^2+x^2}}$ and $\\sin\\theta_2=\\frac{d-x}{\\sqrt{b^2+(d-x)^2}}$,\n$$T'(x)=\\frac{\\sin\\theta_1}{v_1}-\\frac{\\sin\\theta_2}{v_2}.$$\n\\pause\n$T'=0$ gives \\textbf{Snell's Law}: $\\dfrac{\\sin\\theta_1}{\\sin\\theta_2}=\\dfrac{v_1}{v_2}$. Light bends as it slows.\n\\columnbreak\n\\begin{js}[size=640x680, alt=\"A ray of light from a point A in the air down to the water surface at a crossing point x, then to a point B under water, drawn to scale. A slider moves the crossing point; the readout gives the travel time and the ratio sin theta1 over sin theta2. The time is least when the ratio equals v1/v2 = 1.33, the bent path of refraction.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill(); }\nfunction tag(text, px, py, color, align) {            // text at pixel (px, py) on a light backing\n  ctx.font = font(28); ctx.textAlign = align || 'left';\n  const tw = ctx.measureText(text).width, bx = align === 'right' ? px - tw : align === 'center' ? px - tw / 2 : px;\n  ctx.globalAlpha = 0.85; ctx.fillStyle = colors.background; ctx.fillRect(bx - 6, py - 28, tw + 12, 38); ctx.globalAlpha = 1;\n  ctx.fillStyle = color; ctx.fillText(text, px, py); ctx.textAlign = 'left';\n}\nfunction dec(v, d) {                                  // v cut off (not rounded) after d decimals\n  const p = Math.pow(10, d), m = Math.abs(v) * p, t = Math.floor(m + 1e-9);\n  return (v < 0 ? '−' : '') + (t / p).toFixed(d) + (Math.abs(m - t) < 1e-6 ? '' : '…');\n}\nfunction graph(G, fn, a, b, color, width) {           // the graph of fn on [a, b] in the panel G\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round'; ctx.beginPath();\n  for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300; if (i) ctx.lineTo(G.X(x), G.Y(fn(x))); else ctx.moveTo(G.X(x), G.Y(fn(x))); }\n  ctx.stroke();\n}\nfunction panel(px, py, pw, ph, x0, x1, y0, y1, xs, ys, xl, yl) {   // axes, grid, and tick labels; returns the coordinate maps\n  const G = { X: (x) => px + (x - x0) / (x1 - x0) * pw, Y: (y) => py + ph - (y - y0) / (y1 - y0) * ph };\n  for (let v = xs; v <= x1 + 1e-9; v += xs) line(G.X(v), py, G.X(v), py + ph, colors.grid, 1);\n  for (let v = ys; v <= y1 + 1e-9; v += ys) line(px, G.Y(v), px + pw, G.Y(v), colors.grid, 1);\n  line(px, G.Y(0), px + pw, G.Y(0), colors.axis, 2); line(G.X(0), py, G.X(0), py + ph, colors.axis, 2);\n  ctx.font = font(24); ctx.fillStyle = colors.text; ctx.textAlign = 'center';\n  for (let v = xs * xl; v <= x1 + 1e-9; v += xs * xl) ctx.fillText(String(+v.toFixed(4)), G.X(v), G.Y(0) + 30);\n  ctx.textAlign = 'right';\n  for (let v = ys * yl; v <= y1 + 1e-9; v += ys * yl) ctx.fillText(String(+v.toFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.5;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst a = 3, b = 3, d = 6, v1 = 1.33, v2 = 1;       // speeds in units where light in water has speed 1\nconst T = (x) => Math.hypot(a, x) / v1 + Math.hypot(b, d - x) / v2;\nonFrame(() => {\n  const x = d * state.u;\n  ctx.clearRect(0, 0, w, h);\n  const s = 70, ox = 80, oy = 300;                    // pixels per unit; the surface is the line y = oy\n  const P = (u, v) => [ox + u * s, oy - v * s];\n  ctx.fillStyle = colors.c1; ctx.globalAlpha = 0.15; ctx.fillRect(0, oy, w, 3.3 * s); ctx.globalAlpha = 1;\n  line(0, oy, w, oy, colors.c1, 3);\n  tag('air', 20, 50, colors.muted); tag('water', 20, oy + 50, colors.c1);\n  const A = P(0, a), Bp = P(d, -b), C = P(x, 0);\n  line(A[0], A[1], C[0], C[1], colors.c2, 5); line(C[0], C[1], Bp[0], Bp[1], colors.c2, 5);\n  line(C[0], oy - 2.6 * s, C[0], oy + 2.6 * s, colors.muted, 2, [6, 6]);\n  disc(A[0], A[1], colors.ink, 10); disc(Bp[0], Bp[1], colors.ink, 10); disc(C[0], C[1], colors.c2, 11);\n  tag('A', A[0] - 14, A[1] + 8, colors.ink, 'right'); tag('B', Bp[0] + 14, Bp[1] + 8, colors.ink);\n  const s1 = x / Math.hypot(a, x), s2 = (d - x) / Math.hypot(b, d - x);\n  tag('time T = ' + dec(T(x), 4), w - R - 10, 40, colors.ink, 'right');\n  tag('sin θ₁ / sin θ₂ = ' + (s2 > 1e-6 ? dec(s1 / s2, 3) : '—'), w - R - 10, 80, colors.ink, 'right');\n  tag('v₁ / v₂ = 1.33', w - R - 10, 120, colors.muted, 'right');\n  tag('θ₁', C[0] - 40, C[1] - 46, colors.ink); tag('θ₂', C[0] + 14, C[1] + 70, colors.ink);\n  slider('crossing point x = ' + dec(x, 2));\n});\n\\end{js}\n\\end{columns}\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 3, Part I}\n\\begin{youtry}[time=none]{An Open Box: Setting Up}\nA box with a square base and an open top must have volume $32{,}000$ cm$^3$. Find the dimensions that use the least material.\n\\\\[0.5em]\n\\textbf{Part I.} Write the amount of material as a function of \\textcolor{c1}{one variable}, and give the \\textcolor{c1}{interval} where that variable lives.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 3, Part I: Solution}\n\\textbf{Problem.} An open box with a square base has volume $32{,}000$ cm$^3$. Write the amount of material as a function of one variable on an interval.\n\\pause\nCall the base $x$ by $x$ and the height $h$, in cm. The material is the base and the four sides, $\\textcolor{c4}{S=x^2+4xh}$.\n\\pause\nThe constraint is the volume:\n$$\\textcolor{c2}{x^2h=32{,}000}\\quad\\Longrightarrow\\quad h=\\frac{32{,}000}{x^2}.$$\n\\pause\n$$\\textcolor{c4}{S(x)=x^2+4x\\cdot\\frac{32{,}000}{x^2}=x^2+\\frac{128{,}000}{x}},\\qquad\\textcolor{c1}{x>0}.$$\n\\vfill\n\\begin{flushright}\n\\textcolor{c2}{\\textbf{Next slide: You Try}}\n\\end{flushright}\n\n\\slide{You Try 3, Part II}\n\\begin{youtry}[time=none]{An Open Box: Solving}\nA box with a square base and an open top must have volume $32{,}000$ cm$^3$. Find the dimensions that use the least material.\n\\\\[0.5em]\n\\textbf{From Part I.} With base $x$ by $x$ and height $h=32{,}000/x^2$, minimize\n$$\\textcolor{c4}{S(x)=x^2+\\frac{128{,}000}{x}},\\qquad\\textcolor{c1}{x>0}.$$\n\\textbf{Part II.} Find the absolute minimum, and the dimensions of the box.\n\\begin{only}<0>\n\\begin{js}[size=1618x130, alt=\"Timer, 1:30, paused. It starts at the next step.\"]\nctx.globalAlpha = 0.55; ctx.fillStyle = '#00767B';      // the engine's timer, drawn paused\nctx.font = \"600 84px 'JetBrains Mono', ui-monospace, monospace\"; ctx.textAlign = 'center';\nctx.fillText('1:30', w / 2, 72);\nctx.globalAlpha = 1; ctx.fillRect((w - 960) / 2, 104, 960, 16);\n\\end{js}\n\\end{only}\n\\begin{only}<1->\n\\timer{90}\n\\end{only}\n\\end{youtry}\n\n\\slide{You Try 3, Part II: Solution}\n\\textbf{Problem.} Minimize $\\textcolor{c4}{S(x)=x^2+128{,}000/x}$ on $\\textcolor{c1}{(0,\\infty)}$, the material in an open box with base $x$ by $x$ and height $h=32{,}000/x^2$.\n\\pause\n$$S'(x)=2x-\\frac{128{,}000}{x^2}=\\frac{2(x^3-64{,}000)}{x^2}.$$\n\\pause\n$S'(x)=0$ at $x^3=64{,}000$, that is, $x=40$. The interval is not closed. Since $\\textcolor{c2}{S'<0}$ before $40$ and $\\textcolor{c4}{S'>0}$ after, the First Derivative Test for Absolute Extreme Values gives the absolute minimum.\n\\pause\nThe box is $40$ cm by $40$ cm by $h=32{,}000/1600=20$ cm, using $1600+3200=4800$ cm$^2$ of material.\n\n\\section{More Examples}\n\n\\slide{Example 7: A Box From a Square Sheet}\n\\begin{columns}[5 7, parallel]\nA box with an open top is made from a $3$ ft square of cardboard by cutting out an $x$ by $x$ square at each corner and folding up the sides.\n\\\\[0.4em]\nHow big should the corner squares be to make the volume as large as possible?\n\\\\[0.4em]\nThe base is $3-2x$ by $3-2x$ and the height is $x$:\n$$V(x)=x(3-2x)^2$$\non the interval $[0,1.5]$.\n\\columnbreak\n\\begin{js}[size=900x780, alt=\"Left: a 3 foot square sheet, drawn to scale, with an x by x square cut from each corner and fold lines dashed. Right: the graph of the volume V(x) = x(3 - 2x) squared for x from 0 to 1.5. A slider sets x; the readout gives the volume, which is largest, 2 cubic feet, at x = 0.5.\"]\nconst font = (n) => n + \"px 'JetBrains Mono', monospace\";\nfunction line(px, py, qx, qy, color, width, dash) {\n  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []); ctx.lineCap = 'round';\n  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke(); ctx.setLineDash([]);\n}\nfunction disc(px, py, color, r) { ctx.fillStyle = color; ctx.b oFixed(4)), G.X(0) - 8, G.Y(v) + 8);\n  ctx.textAlign = 'left';\n  return G;\n}\nconst L = 16, R = 16, B = 130;\nconst SY = h - 40;                                    // the slider track, from L to w - R at height SY\nif (state.u === undefined) state.u = 0.2;\ncanvas.style.touchAction = 'none'; canvas.style.cursor = 'ew-resize';\nif (!state.bound) {                                   // listeners are added once per showing of the slide\n  state.bound = true;\n  canvas.tabIndex = 0; canvas.setAttribute('role', 'slider');\n  canvas.setAttribute('aria-valuemin', '0'); canvas.setAttribute('aria-valuemax', '100');\n  const set = (e) => {\n    const r = canvas.getBoundingClientRect();\n    state.u = Math.max(0, Math.min(1, ((e.clientX - r.left) * w / r.width - L) / (w - L - R)));\n  };\n  canvas.addEventListener('pointerdown', (e) => { state.drag = true; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} set(e); });\n  canvas.addEventListener('pointermove', (e) => { if (state.drag) set(e); });\n  const up = () => { state.drag = false; canvas.blur(); };     // give the arrow keys back to the slides\n  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);\n  canvas.addEventListener('keydown', (e) => {\n    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;\n    e.preventDefault(); e.stopPropagation();\n    state.u = Math.max(0, Math.min(1, state.u + (e.key === 'ArrowRight' ? 0.02 : -0.02)));\n  });\n}\nfunction slider(text) {                               // the track, the knob at u, and its label\n  const kx = L + state.u * (w - L - R);\n  ctx.lineCap = 'round'; ctx.setLineDash([]);\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(w - R, SY); ctx.stroke();\n  ctx.strokeStyle = colors.accent; ctx.beginPath(); ctx.moveTo(L, SY); ctx.lineTo(kx, SY); ctx.stroke();\n  ctx.fillStyle = colors.background; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.arc(kx, SY, 15, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();\n  ctx.font = font(28); ctx.fillStyle = colors.ink; ctx.textAlign = 'left';\n  const tw = ctx.measureText(text).width;\n  ctx.fillText(text, Math.max(L, Math.min(w - R - tw, kx - tw / 2)), SY - 26);\n  const v = Math.round(state.u * 100);\n  if (v !== state.av) { state.av = v; canvas.setAttribute('aria-valuenow', String(v)); canvas.setAttribute('aria-valuetext', text); }\n}\n\nconst V = (x) => x * (3 - 2 * x) * (3 - 2 * x);\nonFrame(() => {\n  const x = 1.5 * state.u;\n  ctx.clearRect(0, 0, w, h);\n  const s = 120, ox = 30, oy = 120;                   // the sheet: pixels per foot\n  ctx.fillStyle = colors.c1; ctx.globalAlpha = 0.15; ctx.fillRect(ox, oy, 3 * s, 3 * s); ctx.globalAlpha = 1;\n  ctx.fillStyle = colors.background;\n  [[0, 0], [3 - x, 0], [0, 3 - x], [3 - x, 3 - x]].forEach((q) => ctx.fillRect(ox + q[0] * s, oy + q[1] * s, x * s, x * s));\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 3; ctx.beginPath();\n  ctx.moveTo(ox + x * s, oy); ctx.lineTo(ox + (3 - x) * s, oy); ctx.lineTo(ox + (3 - x) * s, oy + x * s); ctx.lineTo(ox + 3 * s, oy + x * s);\n  ctx.lineTo(ox + 3 * s, oy + (3 - x) * s); ctx.lineTo(ox + (3 - x) * s, oy + (3 - x) * s); ctx.lineTo(ox + (3 - x) * s, oy + 3 * s);\n  ctx.lineTo(ox + x * s, oy + 3 * s); ctx.lineTo(ox + x * s, oy + (3 - x) * s); ctx.lineTo(ox, oy + (3 - x) * s); ctx.lineTo(ox, oy + x * s);\n  ctx.lineTo(ox + x * s, oy + x * s); ctx.closePath(); ctx.stroke();\n  line(ox + x * s, oy + x * s, ox + (3 - x) * s, oy + x * s, colors.muted, 2, [6, 6]);\n  line(ox + x * s, oy + (3 - x) * s, ox + (3 - x) * s, oy + (3 - x) * s, colors.muted, 2, [6, 6]);\n  line(ox + x * s, oy + x * s, ox + x * s, oy + (3 - x) * s, colors.muted, 2, [6, 6]);\n  line(ox + (3 - x) * s, oy + x * s, ox + (3 - x) * s, oy + (3 - x) * s, colors.muted, 2, [6, 6]);\n  tag('x = ' + dec(x, 2) + ' ft', ox, 50, colors.ink);\n  tag('V = ' + dec(V(x), 3) + ' ft³', ox, 92, colors.c4);\n  const G = panel(450, 40, 420, 450, 0, 1.6, 0, 2.5, 0.25, 0.25, 2, 2);\n  graph(G, V, 0, 1.5, colors.curve, 4);\n  disc(G.X(x), G.Y(V(x)), colors.c4, 10);\n  tag('V(x)', G.X(1.0), G.Y(1.6), colors.curve);\n  slider('x = ' + dec(x, 2) + ' ft');\n});\n\\end{js}\n\\end{columns}\n\n\\slide{Example 7: Solving}\n\\textbf{Problem.} Maximize $V(x)=x(3-2x)^2$ on $[0,1.5]$.\n\\pause\nBy the product rule and the chain rule,\n\\begin{align}\nV'(x) &= (3-2x)^2+x\\cdot2(3-2x)(-2) \\\\\n\\pause\n&= (3-2x)\\big[(3-2x)-4x\\big]=(3-2x)(3-6x).\n\\end{align}\n\\pause\n$V'(x)=0$ at $x=0.5$ and at the endpoint $x=1.5$. Closed Interval Method:\n$$V(0)=0,\\qquad V(0.5)=0.5\\cdot2^2=2,\\qquad V(1.5)=0.$$\n\\pause\nCut $0.5$ ft squares from the corners. The box is $2$ ft by $2$ ft by $0.5$ ft, with volume $2$ ft$^3$.\n\n\\section*{Wrap-Up}\n\n\\slide{Summary}\n\\begin{enumerate}\n\\item Name the quantity to optimize and the unknowns; draw and label a diagram.\n\\item Use the \\textcolor{c2}{constraint} to write the quantity as a function of \\textcolor{c1}{one variable}, on an \\textcolor{c1}{interval}.\n\\item Find the absolute maximum or minimum. On a \\textbf{closed interval} $[a,b]$, compare $f$ at the critical numbers and the endpoints. On any other interval, use the \\textbf{First Derivative Test for Absolute Extreme Values}: $f'$ has one sign on each side of the critical number.\n\\item Answer the question that was asked, with units.\n\\end{enumerate}\nTo minimize a distance, it is easier to minimize its square.\n\n\\slide{Coming Up}\nProblem Set 17 (optimization problems) is posted on HuskyCT.\n\\begin{table}\nWeek & Lectures & Topics\nWeek 10 (this week) & Wed 11/4 & Lecture 18: Newton's Method\nWeek 11 & 11/9, 11/11 & Antiderivatives; review\nWeek 12 & Mon 11/16 & \\textbf{Midterm II}\n\\end{table}\n";window.LECTURE_SCALE=1.2;window.LECTURE_THEMES={};</script><script>(function LECTURE_ENGINE() {
