<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture 5: The Derivative as a Function</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;color:#111;font-family:'Spectral', 'Iowan Old Style', Georgia, serif}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left;background:#fff}#slide{position:absolute;inset:0}a{color:#00767B}a:hover{color:#F57634}#tray{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;align-items:center;gap:28px;padding:0 56px;box-sizing:border-box;font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;font-size:22px;color:#555;background:linear-gradient(to top,rgba(255,255,255,.96),rgba(255,255,255,0));user-select:none}.nb{width:60px;height:60px;border-radius:50%;border:1px solid #C6DBED;background:rgba(255,255,255,.55);color:#125A56;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:background .18s,opacity .18s;opacity:.62}.nb:hover{background:#DEE6E7;opacity:1}#bar{position:absolute;left:0;bottom:0;height:4px;background:#238F9D;transition:width .3s ease}</style></head><body><div id="wrap"><div id="stage"><div id="slide"></div><div id="tray"></div><div id="bar"></div></div></div><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="% MATH 1131Q Calculus I -- Lecture 5\n% Initial draft: examples -> derivative as a function -> differentiability -> second derivative\n\\title{Lecture 5: The Derivative as a Function}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{September 16, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n\\slide{Today: More Examples}\nWe have built the definition of the derivative.\n\n\\pause\nToday we use it.\n\n\\pause\n\\begin{note}\nFor now, the definition is still our main method.\n\\end{note}\n\n\\pause\n$$\nf'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}\n$$\n\n\\pause\nOur goal is to understand derivatives as slopes, velocities, rates of change, and finally as a new function.\n\n\\section{More Examples from the Definition}\n\n\\slide{Example 1: Tangent Line from the Definition}\nFind the tangent line to\n$$\ny=f(x)=x^2-2x^3\n$$\nat the point $(1,-1)$.\n\n\\pause\nWe need two things:\n\\begin{itemize}\n\\item the point $(1,-1)$,\n\\pause\n\\item the slope of the tangent line, which is $f'(1)$.\n\\end{itemize}\n\n\\pause\nSo we compute\n$$\nf'(1)=\\lim_{h\\to0}\\frac{f(1+h)-f(1)}{h}.\n$$\n\n\\slide{Example 1: First Compute $f(1+h)$}\nStart with\n$$\nf(x)=x^2-2x^3.\n$$\n\n\\pause\nSubstitute $x=1+h$:\n$$\nf(1+h)=(1+h)^2-2(1+h)^3.\n$$\n\n\\pause\nWe will expand this carefully before subtracting $f(1)$.\n\n\\slide{Example 1: Expand the Powers}\nFirst,\n$$\n(1+h)^2=1+2h+h^2.\n$$\n\n\\pause\nFor the cube, multiply one more time:\n$$\n(1+h)^3=(1+h)(1+h)^2.\n$$\n\n\\pause\n$$\n(1+h)^3=(1+h)(1+2h+h^2).\n$$\n\n\\pause\n$$\n(1+h)^3=1+3h+3h^2+h^3.\n$$\n\n\\pause\nNow put these into $f(1+h)$.\n\n\\slide{Example 1: Simplify $f(1+h)$}\nStart with\n$$\nf(1+h)=(1+h)^2-2(1+h)^3.\n$$\n\n\\pause\nSubstitute the expansions:\n$$\nf(1+h)=(1+2h+h^2)-2(1+3h+3h^2+h^3).\n$$\n\n\\pause\nDistribute the $-2$:\n$$\nf(1+h)=1+2h+h^2-2-6h-6h^2-2h^3.\n$$\n\n\\pause\nCombine like terms:\n$$\nf(1+h)=-1-4h-5h^2-2h^3.\n$$\n\n\\slide{Example 1: Build the Difference Quotient}\nWe also have\n$$\nf(1)=1^2-2(1)^3=-1.\n$$\n\n\\pause\nTherefore,\n$$\nf(1+h)-f(1)=(-1-4h-5h^2-2h^3)-(-1).\n$$\n\n\\pause\n$$\nf(1+h)-f(1)=-4h-5h^2-2h^3.\n$$\n\n\\pause\nNow divide by $h$:\n$$\n\\frac{f(1+h)-f(1)}{h}\n=\n\\frac{-4h-5h^2-2h^3}{h}.\n$$\n\n\\slide{Example 1: Take the Limit}\nNow take the limit:\n$$\nf'(1)=\\lim_{h\\to0}\\frac{-4h-5h^2-2h^3}{h}.\n$$\n\n\\pause\nFor $h\\ne0$, cancel a factor of $h$:\n$$\nf'(1)=\\lim_{h\\to0}(-4-5h-2h^2).\n$$\n\n\\pause\nNow substitute $h=0$:\n$$\nf'(1)=-4.\n$$\n\n\\pause\nThe tangent slope is $-4$.\n\n\\slide{Example 1: The Tangent Line}\nWe know the point and the slope:\n$$\n(1,-1),\\qquad m=f'(1)=-4.\n$$\n\n\\pause\nUse point-slope form:\n$$\ny-y_0=m(x-x_0).\n$$\n\n\\pause\n$$\ny-(-1)=-4(x-1).\n$$\n\n\\pause\n$$\ny+1=-4x+4.\n$$\n\n\\pause\nTherefore,\n$$\ny=-4x+3.\n$$\n\n\\slide{Example 1: Picture}\n\\begin{twocol}[5 7]\nWe found\n$$\nf'(1)=-4\n$$\nand the tangent line is\n$$\ny=-4x+3.\n$$\n\n\\pause\nThe derivative is the slope of the line that best matches the graph near $x=1$.\n\\columnbreak\n\\begin{plot}\nf = x^2 - 2x^3\ndomain = -1.2:2.1\nrange = -6:4\na = 1\ntangent = true\nsize = 820x560\ncaption = Tangent line at x equals 1\n\\end{plot}\n\\end{twocol}\n\n\\slide{Example 1: Keep the Input Variable}\nWe will use this same function again later in the lecture.\n\n\\uncover<1->{If we carry out the same difference-quotient computation at an arbitrary input $x$, then}\n\n\\uncover<2->{$$\nf(x+h)-f(x)=h(2x+h-6x^2-6xh-2h^2).\n$$}\n\n\\uncover<3->{Therefore, for $h\\ne0$,}\n\n\\uncover<3->{$$\n\\frac{f(x+h)-f(x)}{h}=2x+h-6x^2-6xh-2h^2.\n$$}\n\n\\uncover<4->{Taking $h\\to0$ gives}\n\n\\uncover<4->{$$\nf'(x)=2x-6x^2.\n$$}\n\n\\slide{Example 2: Runners}\n\\begin{twocol}[5 7]\nThe graph shows the position of two runners, $A$ and $B$, during a 100-meter race. They finish in a tie.\n\n\\uncover<1->{Position is the \\alert{height} of the graph.}\n\n\\uncover<2->{Velocity is the \\alert{slope} of the graph.}\n\n\\uncover<3->{Distance apart is the \\alert{vertical gap} between the graphs.}\n\\columnbreak\n\\begin{js}[size=900x560, frames=4]\nconst L=94,R=28,T=28,B=64, XL=0, XR=12, YB=0, YT=105;\nconst PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;}\nfunction Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nfunction axes(){\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  [0,4,8,12].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+30,20,'#555');});\n  [0,20,40,60,80,100].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\n  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(105));ctx.stroke();\n  txt('time t (seconds)',X(9.6),T+PH+54,22,'#333');txt('position s (m)',L+22,T+24,22,'#333','left');\n}\nfunction runnerB(t){return 100*Math.pow(Math.max(0,t)/12,3.09773210802851);}\nfunction pathB(){\n  ctx.strokeStyle='#E76F51';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();\n  for(let i=0;i<=500;i++){\n    const t=12*i/500, y=runnerB(t);\n    if(i===0)ctx.moveTo(X(t),Y(y)); else ctx.lineTo(X(t),Y(y));\n  }\n  ctx.stroke();\n}\naxes();\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(100));ctx.stroke();\npathB();\ntxt('A',X(10.5),Y(87.5)-13,30,'#006D77');txt('B',X(10.2),Y(runnerB(10))+32,30,'#E76F51');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 2: Compare the Motion}\n\\begin{twocol}[5 7]\n\\uncover<1->{Runner $A$ has a straight position graph.}\n\n\\uncover<2->{So runner $A$ runs at approximately \\alert{constant speed}.}\n\n\\uncover<3->{Runner $B$ starts with a much flatter graph and the graph becomes steeper.}\n\n\\uncover<4->{So runner $B$ starts slowly and \\alert{speeds up} during the race.}\n\\columnbreak\n\\begin{js}[size=900x560, frames=5]\nconst L=94,R=28,T=28,B=64, XL=0, XR=12, YB=0, YT=105;\nconst PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;}\nfunction Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nfunction axes(){\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  [0,4,8,12].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+30,20,'#555');});\n  [0,20,40,60,80,100].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\n  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(105));ctx.stroke();\n  txt('time t (seconds)',X(9.6),T+PH+54,22,'#333');txt('position s (m)',L+22,T+24,22,'#333','left');\n}\nfunction runnerB(t){return 100*Math.pow(Math.max(0,t)/12,3.09773210802851);}\nfunction pathB(){\n  ctx.strokeStyle='#E76F51';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();\n  for(let i=0;i<=500;i++){\n    const t=12*i/500, y=runnerB(t);\n    if(i===0)ctx.moveTo(X(t),Y(y)); else ctx.lineTo(X(t),Y(y));\n  }\n  ctx.stroke();\n}\naxes();\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(100));ctx.stroke();\npathB();\ntxt('A',X(10.5),Y(87.5)-13,30,'#006D77');txt('B',X(10.2),Y(runnerB(10))+32,30,'#E76F51');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 2: Greatest Distance Apart}\n\\begin{twocol}[5 7]\n\\uncover<1->{The runners are farthest apart when the \\alert{vertical gap} between the graphs is largest.}\n\n\\uncover<2->{Reading the graph, the largest gap occurs at about}\n\n\\uncover<2->{$$\nt\\approx 7\\text{ seconds}.\n$$}\n\n\\uncover<3->{Runner $A$ is still ahead at that time, but runner $B$ is catching up.}\n\\columnbreak\n\\begin{js}[size=900x560, frames=4]\nconst L=94,R=28,T=28,B=64, XL=0, XR=12, YB=0, YT=105;\nconst PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;}\nfunction Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nfunction axes(){\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  [0,4,8,12].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+30,20,'#555');});\n  [0,20,40,60,80,100].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\n  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(105));ctx.stroke();\n  txt('time t (seconds)',X(9.6),T+PH+54,22,'#333');txt('position s (m)',L+22,T+24,22,'#333','left');\n}\nfunction runnerB(t){return 100*Math.pow(Math.max(0,t)/12,3.09773210802851);}\nfunction pathB(){\n  ctx.strokeStyle='#E76F51';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();\n  for(let i=0;i<=500;i++){\n    const t=12*i/500, y=runnerB(t);\n    if(i===0)ctx.moveTo(X(t),Y(y)); else ctx.lineTo(X(t),Y(y));\n  }\n  ctx.stroke();\n}\naxes();\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(100));ctx.stroke();\npathB();\ntxt('A',X(10.5),Y(87.5)-13,30,'#006D77');txt('B',X(10.2),Y(runnerB(10))+32,30,'#E76F51');\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nconst gapColor='#5A189A', tg=7, yA=100*tg/12, yB=runnerB(tg), yM=(yA+yB)/2;\nctx.strokeStyle=gapColor;ctx.lineWidth=4.5;ctx.setLineDash([9,7]);ctx.beginPath();ctx.moveTo(X(tg),Y(yA));ctx.lineTo(X(tg),Y(yB));ctx.stroke();ctx.setLineDash([]);\nctx.fillStyle=gapColor;ctx.beginPath();ctx.arc(X(tg),Y(yA),7,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(X(tg),Y(yB),7,0,6.283);ctx.fill();\nhtxt('largest vertical gap',X(tg)+42,Y(yM)+8,24,gapColor,'left');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 2: Same Velocity}\n\\begin{twocol}[5 7]\n\\uncover<1->{The runners have the same velocity when the two position graphs have the \\alert{same slope}.}\n\n\\uncover<2->{So we look for tangent lines that appear parallel.}\n\n\\uncover<3->{From the graph, this occurs at roughly}\n\n\\uncover<3->{$$\nt\\approx 7\\text{ seconds}.\n$$}\n\n\\uncover<4->{The exact time is not the point here; we are estimating from a graph.}\n\\columnbreak\n\\begin{js}[size=900x560, frames=5]\nconst L=94,R=28,T=28,B=64, XL=0, XR=12, YB=0, YT=105;\nconst PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;}\nfunction Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nfunction axes(){\n  ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  [0,4,8,12].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+30,20,'#555');});\n  [0,20,40,60,80,100].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\n  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(0));ctx.moveTo(X(0),Y(0));ctx.lineTo(X(0),Y(105));ctx.stroke();\n  txt('time t (seconds)',X(9.6),T+PH+54,22,'#333');txt('position s (m)',L+22,T+24,22,'#333','left');\n}\nfunction runnerB(t){return 100*Math.pow(Math.max(0,t)/12,3.09773210802851);}\nfunction pathB(){\n  ctx.strokeStyle='#E76F51';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();\n  for(let i=0;i<=500;i++){\n    const t=12*i/500, y=runnerB(t);\n    if(i===0)ctx.moveTo(X(t),Y(y)); else ctx.lineTo(X(t),Y(y));\n  }\n  ctx.stroke();\n}\naxes();\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(12),Y(100));ctx.stroke();\npathB();\ntxt('A',X(10.5),Y(87.5)-13,30,'#006D77');txt('B',X(10.2),Y(runnerB(10))+32,30,'#E76F51');\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nfunction tangent(x,y,m,col){const dx=1.05;ctx.save();ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(X(x-dx),Y(y-m*dx));ctx.lineTo(X(x+dx),Y(y+m*dx));ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(X(x-dx),Y(y-m*dx));ctx.lineTo(X(x+dx),Y(y+m*dx));ctx.stroke();ctx.restore();}\nif(step>=2){const t0=7, m=100/12, yA=100*t0/12, yB=runnerB(t0), tanColor='#5A189A';tangent(t0,yA,m,tanColor);tangent(t0,yB,m,tanColor);ctx.fillStyle=tanColor;ctx.beginPath();ctx.arc(X(t0),Y(yA),9,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(X(t0),Y(yB),9,0,6.283);ctx.fill();htxt('same slope',X(8.1),Y(79),25,tanColor,'left');}\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 3: Ordering Derivative Values}\n\\begin{twocol}[5 7]\nWe want to put these numbers in increasing order:\n$$\n0,\\qquad g'(-2),\\qquad g'(0),\\qquad g'(2),\\qquad g'(4).\n$$\n\n\\uncover<1->{First, look at the graph and make a guess.}\n\n\\uncover<2->{Now start with the signs.}\n\n\\uncover<3->{The graph is falling at $x=0$, so $g'(0)<0$.}\n\n\\uncover<4->{The graph is rising at $x=-2,2,4$, so those three derivatives are positive.}\n\\columnbreak\n\\begin{js}[size=900x560, frames=5]\nconst L=68,R=28,T=28,B=54, XL=-4, XR=6, YB=-6, YT=5, PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=6;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=-6;y<=5;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(XL),Y(0));ctx.lineTo(X(XR),Y(0));ctx.moveTo(X(0),Y(YB));ctx.lineTo(X(0),Y(YT));ctx.stroke();\nfunction g(x){return -0.0177083333333333*x*x*x*x+0.0895833333333333*x*x*x+0.0979166666666667*x*x-0.35*x+2;}\nctx.strokeStyle='#006D77';ctx.lineWidth=3.2;ctx.beginPath();for(let i=0;i<=600;i++){let x=XL+(XR-XL)*i/600,y=g(x); if(i===0)ctx.moveTo(X(x),Y(y)); else ctx.lineTo(X(x),Y(y));}ctx.stroke();\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nfunction marker(x,col,label){let y=g(x);ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),12,0,6.283);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();htxt(label,X(x),Y(y)-18,21,col);}\nmarker(-2,'#E76F51','x=-2'); marker(0,'#9B2226','x=0'); marker(2,'#2A9D8F','x=2'); marker(4,'#6A4C93','x=4');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 3: Compare the Slopes}\n\\begin{twocol}[5 7]\n\\uncover<1->{Draw small tangent segments to compare the slopes more carefully.}\n\n\\uncover<2->{$g'(4)$ is positive, but its tangent is the least steep of the three positive tangents.}\n\n\\uncover<3->{$g'(2)$ is steeper.}\n\n\\uncover<4->{$g'(-2)$ is the steepest positive slope.}\n\n\\uncover<5->{Therefore,}\n\n\\uncover<5->{$$\ng'(0)<0<g'(4)<g'(2)<g'(-2).\n$$}\n\\columnbreak\n\\begin{js}[size=900x560, frames=6]\nconst L=68,R=28,T=28,B=54, XL=-4, XR=6, YB=-6, YT=5, PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=6;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=-6;y<=5;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(XL),Y(0));ctx.lineTo(X(XR),Y(0));ctx.moveTo(X(0),Y(YB));ctx.lineTo(X(0),Y(YT));ctx.stroke();\nfunction g(x){return -0.0177083333333333*x*x*x*x+0.0895833333333333*x*x*x+0.0979166666666667*x*x-0.35*x+2;}\nfunction gp(x){return -0.0708333333333333*x*x*x+0.26875*x*x+0.195833333333333*x-0.35;}\nctx.strokeStyle='#006D77';ctx.lineWidth=3.2;ctx.beginPath();for(let i=0;i<=600;i++){let x=XL+(XR-XL)*i/600,y=g(x); if(i===0)ctx.moveTo(X(x),Y(y)); else ctx.lineTo(X(x),Y(y));}ctx.stroke();\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nfunction marker(x,col,label){let y=g(x);ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),11,0,6.283);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();htxt(label,X(x),Y(y)-18,21,col);}\nfunction tangent(x,col){let y=g(x), m=gp(x), dx=0.9;ctx.save();ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(X(x-dx),Y(y-m*dx));ctx.lineTo(X(x+dx),Y(y+m*dx));ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(x-dx),Y(y-m*dx));ctx.lineTo(X(x+dx),Y(y+m*dx));ctx.stroke();ctx.restore();ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),7,0,6.283);ctx.fill();}\nmarker(-2,'#E76F51','x=-2'); marker(0,'#9B2226','x=0'); marker(2,'#2A9D8F','x=2'); marker(4,'#6A4C93','x=4');\nif(step>=1){tangent(0,'#D00000');}\nif(step>=2){tangent(4,'#5A189A');}\nif(step>=3){tangent(2,'#F77F00');}\nif(step>=4){tangent(-2,'#111111');}\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 4: Salmon Swimming Speed}\n\\begin{twocol}[5 7]\nThe maximum sustainable swimming speed $S$ of Coho salmon depends on water temperature $T$.\n\n\\uncover<1->{$T$ is measured in degrees Celsius and $S(T)$ in centimeters per second.}\n\n\\uncover<2->{$S'(T)$ measures how rapidly sustainable swimming speed changes as temperature changes.}\n\n\\uncover<3->{Its units are}\n\n\\uncover<3->{$$\n\\frac{\\text{cm/s}}{\\,{}^\\circ\\text{C}}.\n$$}\n\\columnbreak\n\\begin{js}[size=880x540, frames=4]\nconst L=90,R=32,T=30,B=64, XL=5, XR=26, YB=12, YT=33, PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n[5,10,15,20,25].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+28,20,'#555');});\n[15,20,25,30].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\nctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(5),Y(12));ctx.lineTo(X(26),Y(12));ctx.moveTo(X(5),Y(12));ctx.lineTo(X(5),Y(33));ctx.stroke();\nconst pts=[[5,15],[10,20],[15,25],[20,30],[25,22]];\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(5),Y(15));ctx.bezierCurveTo(X(9),Y(18),X(14),Y(25),X(20),Y(30));ctx.bezierCurveTo(X(22),Y(30),X(24),Y(25),X(25),Y(22));ctx.stroke();\npts.forEach(p=>{ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),13,0,6.283);ctx.fillStyle='#006D77';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#104B4C';ctx.stroke();});\ntxt('temperature T (°C)',X(20.7),T+PH+54,21,'#333');txt('S (cm/s)',L+8,T+22,21,'#333','left');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 4: Estimate $S'(15)$}\n\\begin{twocol}[5 7]\n\\uncover<1->{Use slopes of nearby secant lines to estimate the tangent slope at $T=15$.}\n\n\\uncover<2->{From $10^\\circ$C to $15^\\circ$C,}\n\n\\uncover<2->{$$\n\\frac{25-20}{15-10}=1.\n$$}\n\n\\uncover<3->{From $15^\\circ$C to $20^\\circ$C,}\n\n\\uncover<3->{$$\n\\frac{30-25}{20-15}=1.\n$$}\n\n\\uncover<4->{Both estimates agree, so}\n\n\\uncover<4->{$$\nS'(15)\\approx 1\\ \\frac{\\text{cm/s}}{\\,{}^\\circ\\text{C}}.\n$$}\n\n\\uncover<5->{Near $15^\\circ$C, each $1^\\circ$C increase in temperature raises sustainable speed by about $1$ cm/s.}\n\\columnbreak\n\\begin{js}[size=880x540, frames=6]\nconst L=90,R=32,T=30,B=64, XL=5, XR=26, YB=12, YT=33, PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n[5,10,15,20,25].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+28,20,'#555');});\n[15,20,25,30].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\nctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(5),Y(12));ctx.lineTo(X(26),Y(12));ctx.moveTo(X(5),Y(12));ctx.lineTo(X(5),Y(33));ctx.stroke();\nconst pts=[[5,15],[10,20],[15,25],[20,30],[25,22]];\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(5),Y(15));ctx.bezierCurveTo(X(9),Y(18),X(14),Y(25),X(20),Y(30));ctx.bezierCurveTo(X(22),Y(30),X(24),Y(25),X(25),Y(22));ctx.stroke();\npts.forEach(p=>{ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),13,0,6.283);ctx.fillStyle='#006D77';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#104B4C';ctx.stroke();});\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nfunction adot(x,y,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),9,0,6.283);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}\nif(step>=2){ctx.strokeStyle='#F57634';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(10),Y(20));ctx.lineTo(X(15),Y(25));ctx.stroke();adot(10,20,'#F57634');adot(15,25,'#F57634');htxt('slope = 1',X(12.35),Y(22.5)+44,28,'#F57634');}\nif(step>=3){ctx.strokeStyle='#5A189A';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(15),Y(25));ctx.lineTo(X(20),Y(30));ctx.stroke();adot(20,30,'#5A189A');htxt('slope = 1',X(17.7),Y(27.5)-30,28,'#5A189A');}\nif(step>=4){ctx.strokeStyle='#111111';ctx.lineWidth=4;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(X(10),Y(20));ctx.lineTo(X(20),Y(30));ctx.stroke();ctx.setLineDash([]);}\ntxt('temperature T (°C)',X(20.7),T+PH+54,21,'#333');txt('S (cm/s)',L+8,T+22,21,'#333','left');\n\\end{js}\n\\end{twocol}\n\n\\slide{Example 4: Estimate $S'(25)$}\n\\begin{twocol}[5 7]\n\\uncover<1->{Near $25^\\circ$C, use the nearby secant from $20^\\circ$C to $25^\\circ$C.}\n\n\\uncover<2->{$$\nS'(25)\\approx \\frac{22-30}{25-20}.\n$$}\n\n\\uncover<3->{$$\nS'(25)\\approx \\frac{-8}{5}=-1.6.\n$$}\n\n\\uncover<4->{Thus,}\n\n\\uncover<4->{$$\nS'(25)\\approx -1.6\\ \\frac{\\text{cm/s}}{\\,{}^\\circ\\text{C}}.\n$$}\n\n\\uncover<5->{Near $25^\\circ$C, each $1^\\circ$C increase in temperature lowers sustainable speed by about $1.6$ cm/s.}\n\\columnbreak\n\\begin{js}[size=880x540, frames=6]\nconst L=90,R=32,T=30,B=64, XL=5, XR=26, YB=12, YT=33, PW=w-L-R, PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction txt(s,x,y,sz,col,align){ctx.fillStyle=col;ctx.font=sz+'px Arial';ctx.textAlign=align||'center';ctx.fillText(s,x,y);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n[5,10,15,20,25].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();txt(String(x),X(x),T+PH+28,20,'#555');});\n[15,20,25,30].forEach(y=>{ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();txt(String(y),L-12,Y(y)+7,20,'#555','right');});\nctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(5),Y(12));ctx.lineTo(X(26),Y(12));ctx.moveTo(X(5),Y(12));ctx.lineTo(X(5),Y(33));ctx.stroke();\nconst pts=[[5,15],[10,20],[15,25],[20,30],[25,22]];\nctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(5),Y(15));ctx.bezierCurveTo(X(9),Y(18),X(14),Y(25),X(20),Y(30));ctx.bezierCurveTo(X(22),Y(30),X(24),Y(25),X(25),Y(22));ctx.stroke();\npts.forEach(p=>{ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),13,0,6.283);ctx.fillStyle='#006D77';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#104B4C';ctx.stroke();});\nfunction htxt(s,x,y,sz,col,align){ctx.save();ctx.font='600 '+sz+'px Arial';ctx.textAlign=align||'center';ctx.lineWidth=5;ctx.strokeStyle='rgba(255,255,255,.96)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}\nfunction adot(x,y,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),9,0,6.283);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}\nif(step>=1){adot(20,30,'#F57634');adot(25,22,'#F57634');}\nif(step>=2){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(20),Y(30));ctx.lineTo(X(25),Y(22));ctx.stroke();}\nif(step>=3){ctx.strokeStyle='#6A4C93';ctx.lineWidth=3;ctx.setLineDash([7,6]);ctx.beginPath();ctx.moveTo(X(20),Y(30));ctx.lineTo(X(25),Y(30));ctx.lineTo(X(25),Y(22));ctx.stroke();ctx.setLineDash([]);htxt('run 5',X(22.5),Y(30)-12,20,'#6A4C93');htxt('fall 8',X(25)+18,Y(26),20,'#6A4C93','left');}\nif(step>=4){htxt('secant slope ≈ −1.6',X(22.4),Y(24.5)+35,22,'#F57634');}\ntxt('temperature T (°C)',X(20.7),T+PH+54,21,'#333');txt('S (cm/s)',L+8,T+22,21,'#333','left');\n\\end{js}\n\\end{twocol}\n\n\\section{The Derivative as a Function}\n\n\\slide{Example 5: From $f$ to $f'$}\nThe derivative is a new function. Its height records the slope of the original graph at the same input.\n\n\\begin{js}[size=1600x560, frames=6]\nconst PAD=68,GAP=92,T=46,B=64, PW=(w-2*PAD-GAP)/2, PH=h-T-B;\nconst XL=0,XR=6, FYB=-0.4,FYT=4.4, DYB=-2.6,DYT=2.6;\nconst LX=PAD, RX=PAD+PW+GAP;\nfunction X0(x,ox){return ox+(x-XL)/(XR-XL)*PW;}\nfunction Y0(y,yb,yt){return T+PH-(y-yb)/(yt-yb)*PH;}\nfunction f(x){return -0.15*x*x*x+1.53*x*x-4.32*x+4;}\nfunction fp(x){return -0.45*(x-2)*(x-4.8);}\nfunction axes(ox,yb,yt,title){\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  for(let x=0;x<=6;x++){ctx.beginPath();ctx.moveTo(X0(x,ox),T);ctx.lineTo(X0(x,ox),T+PH);ctx.stroke();}\n  for(let y=Math.ceil(yb);y<=Math.floor(yt);y++){ctx.beginPath();ctx.moveTo(ox,Y0(y,yb,yt));ctx.lineTo(ox+PW,Y0(y,yb,yt));ctx.stroke();}\n  ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ox,Y0(0,yb,yt));ctx.lineTo(ox+PW,Y0(0,yb,yt));ctx.moveTo(X0(0,ox),T);ctx.lineTo(X0(0,ox),T+PH);ctx.stroke();\n  ctx.fillStyle='#333';ctx.font='600 30px Arial';ctx.textAlign='center';ctx.fillText(title,ox+PW/2,30);\n  ctx.font='23px Arial';ctx.fillStyle='#666';for(let x=0;x<=6;x+=2)ctx.fillText(String(x),X0(x,ox),T+PH+32);\n}\nfunction curve(ox,fun,yb,yt,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();let pen=false;for(let i=0;i<=600;i++){const x=XL+(XR-XL)*i/600,y=fun(x);if(y<yb||y>yt){pen=false;continue;}if(pen)ctx.lineTo(X0(x,ox),Y0(y,yb,yt));else{ctx.moveTo(X0(x,ox),Y0(y,yb,yt));pen=true;}}ctx.stroke();}\nfunction tangent(x,col){const y=f(x),m=fp(x),dx=.55;ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X0(x-dx,LX),Y0(y-m*dx,FYB,FYT));ctx.lineTo(X0(x+dx,LX),Y0(y+m*dx,FYB,FYT));ctx.stroke();}\nfunction dot(ox,x,y,yb,yt,col,r){ctx.beginPath();ctx.arc(X0(x,ox),Y0(y,yb,yt),r||9,0,6.283);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);axes(LX,FYB,FYT,'original function  f');axes(RX,DYB,DYT,\"derivative  f'\");curve(LX,f,FYB,FYT,'#006D77',5);\nconst PTS=[[1,'A'],[2,'B'],[3.3,'C'],[4.8,'D']];\nctx.font='600 28px Arial';ctx.textAlign='left';\nPTS.forEach((p,j)=>{const x=p[0],y=f(x), lab=p[1];dot(LX,x,y,FYB,FYT,'#006D77',8);ctx.fillStyle='#006D77';ctx.fillText(lab,X0(x,LX)+(lab==='C'?-24:12),Y0(y,FYB,FYT)+(lab==='C'?-34:-10));if(step>=j+1){tangent(x,'#F57634');dot(RX,x,fp(x),DYB,DYT,'#F57634',9);ctx.fillStyle='#F57634';ctx.fillText(lab,X0(x,RX)+12,Y0(fp(x),DYB,DYT)-12);}});\nif(step>=5)curve(RX,fp,DYB,DYT,'#E76F51',5);\nctx.fillStyle='#555';ctx.font='26px Arial';ctx.textAlign='center';\nif(step===0)ctx.fillText('Start by reading tangent slopes on the left.',w/2,h-8);\nelse if(step<5)ctx.fillText('Each tangent slope becomes a height at the same x-value on the right.',w/2,h-8);\nelse ctx.fillText(\"Connecting the derivative values gives the graph of f'.\",w/2,h-8);\n\\end{js}\n\n\\uncover<1->{At $A$, the tangent slope is negative, so the corresponding point on $f'$ lies below the axis.}\n\\uncover<2->{At $B$, the tangent is horizontal, so $f'(B)=0$.}\n\\uncover<3->{At $C$, the tangent slope is positive, so the corresponding point lies above the axis.}\n\\uncover<4->{At $D$, the tangent is horizontal again, so $f'(D)=0$.}\n\\uncover<5->{The sign of $f'$ now matches exactly where $f$ decreases and increases.}\n\n\\slide{Example 5: Read Both Graphs Together}\n\\begin{twocol}[5 7]\n\\uncover<0->{\\textbf{On the graph of $f$:}}\n\\begin{itemize}\n\\item $f$ decreases before $B$,\n\\item increases from $B$ to $D$,\n\\item decreases after $D$.\n\\end{itemize}\n\n\\uncover<1->{\\textbf{On the graph of $f'$:}}\n\\begin{itemize}\n\\item \\uncover<1->{$f'(x)<0$ before $B$,}\n\\item \\uncover<1->{$f'(x)>0$ between $B$ and $D$,}\n\\item \\uncover<1->{$f'(x)<0$ after $D$.}\n\\end{itemize}}\n\n\\uncover<3->{The zeros of $f'$ occur where $f$ has horizontal tangents.}\n\\columnbreak\n\\begin{js}[size=900x570, frames=4]\nconst L=68,R=28,T=34,B=46,G=46,PH=(h-T-B-G)/2,XL=0,XR=6,Y1B=-.4,Y1T=4.4,Y2B=-2.6,Y2T=2.6,PW=w-L-R;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y,yb,yt,oy){return oy+PH-(y-yb)/(yt-yb)*PH;}\nfunction f(x){return -0.15*x*x*x+1.53*x*x-4.32*x+4;} function fp(x){return -0.45*(x-2)*(x-4.8);}\nfunction panel(oy,yb,yt,title,fun,col){ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;for(let x=0;x<=6;x++){ctx.beginPath();ctx.moveTo(X(x),oy);ctx.lineTo(X(x),oy+PH);ctx.stroke();}ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,Y(0,yb,yt,oy));ctx.lineTo(L+PW,Y(0,yb,yt,oy));ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();let pen=false;for(let i=0;i<=500;i++){let x=6*i/500,y=fun(x);if(y<yb||y>yt){pen=false;continue;}if(pen)ctx.lineTo(X(x),Y(y,yb,yt,oy));else{ctx.moveTo(X(x),Y(y,yb,yt,oy));pen=true;}}ctx.stroke();ctx.fillStyle='#333';ctx.font='600 23px Arial';ctx.textAlign='left';ctx.fillText(title,L+12,oy+26);}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);panel(T,Y1B,Y1T,'f',f,'#006D77');panel(T+PH+G,Y2B,Y2T,\"f'\",fp,'#E76F51');\n[2,4.8].forEach(x=>{ctx.strokeStyle='#F57634';ctx.setLineDash([6,6]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+2*PH+G);ctx.stroke();ctx.setLineDash([]);});\nif(step>=2){ctx.fillStyle='rgba(245,118,52,.10)';ctx.fillRect(X(2),T,X(4.8)-X(2),2*PH+G);}\n\\end{js}\n\\end{twocol}\n\n\n\\slide{Example 6: Match Functions to Derivatives}\nThe top row shows four functions. The bottom row shows four possible derivative graphs.\nMatch each function with its derivative.\n\n\\begin{js}[size=1640x690, frames=5]\nconst FM=\"'JetBrains Mono', ui-monospace, monospace\";\nconst W=330,H=235,LEFT=58,GAP=58,TOP1=48,TOP2=400;\nconst XL=-3,XR=3;\nfunction X(x,ox){return ox+(x-XL)/(XR-XL)*W;}\nfunction Y(y,oy,yb,yt){return oy+H-(y-yb)/(yt-yb)*H;}\nfunction panel(i,row,label){\n  const ox=LEFT+i*(W+GAP), oy=row===0?TOP1:TOP2;\n  ctx.strokeStyle='#DDEBEC';ctx.lineWidth=1.4;ctx.strokeRect(ox,oy,W,H);\n  ctx.strokeStyle='#EEF3F3';ctx.lineWidth=1;\n  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(X(k,ox),oy);ctx.lineTo(X(k,ox),oy+H);ctx.stroke();}\n  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(ox,Y(k,oy,-3,3));ctx.lineTo(ox+W,Y(k,oy,-3,3));ctx.stroke();}\n  ctx.strokeStyle='#333';ctx.lineWidth=1.6;\n  ctx.beginPath();ctx.moveTo(ox,Y(0,oy,-3,3));ctx.lineTo(ox+W,Y(0,oy,-3,3));\n  ctx.moveTo(X(0,ox),oy);ctx.lineTo(X(0,ox),oy+H);ctx.stroke();\n  const lx = label==='II' ? ox+W-58 : ox+12;\n  const ly = label==='II' ? oy+H-18 : oy+34;\n  ctx.save();ctx.font='600 28px '+FM;ctx.textAlign='left';ctx.lineWidth=6;ctx.strokeStyle='#fff';\n  ctx.strokeText(label,lx,ly);ctx.fillStyle='#333';ctx.fillText(label,lx,ly);ctx.restore();\n  return {ox,oy};\n}\nfunction curve(P,fun,col,lw,dash){\n  ctx.save();ctx.beginPath();ctx.rect(P.ox,P.oy,W,H);ctx.clip();\n  if(dash)ctx.setLineDash(dash);\n  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();\n  let pen=false;\n  for(let j=0;j<=500;j++){\n    const x=XL+(XR-XL)*j/500, y=fun(x);\n    if(y<-3.4||y>3.4){pen=false;continue;}\n    if(pen)ctx.lineTo(X(x,P.ox),Y(y,P.oy,-3,3)); else {ctx.moveTo(X(x,P.ox),Y(y,P.oy,-3,3));pen=true;}\n  }\n  ctx.stroke();ctx.restore();\n}\nfunction piece(P,pts,col,lw){\n  ctx.save();ctx.beginPath();ctx.rect(P.ox,P.oy,W,H);ctx.clip();\n  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();\n  pts.forEach((q,j)=>{if(j)ctx.lineTo(X(q[0],P.ox),Y(q[1],P.oy,-3,3));else ctx.moveTo(X(q[0],P.ox),Y(q[1],P.oy,-3,3));});\n  ctx.stroke();ctx.restore();\n}\nfunction stepgraph(P,pts,col){\n  ctx.save();ctx.beginPath();ctx.rect(P.ox,P.oy,W,H);ctx.clip();\n  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();\n  pts.forEach(s=>{ctx.moveTo(X(s[0],P.ox),Y(s[2],P.oy,-3,3));ctx.lineTo(X(s[1],P.ox),Y(s[2],P.oy,-3,3));});\n  ctx.stroke();\n  ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=3;\n  [-1,1].forEach(x=>{[-1.1,1.25,0.25].forEach(y=>{ctx.beginPath();ctx.arc(X(x,P.ox),Y(y,P.oy,-3,3),6,0,6.283);ctx.fill();ctx.stroke();});});\n  ctx.restore();\n}\nfunction outline(P,col){ctx.strokeStyle=col;ctx.lineWidth=7;ctx.strokeRect(P.ox-5,P.oy-5,W+10,H+10);}\nfunction txt(s,x,y,col,fs){ctx.save();ctx.fillStyle=col;ctx.font='600 '+(fs||26)+'px '+FM;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(s,x,y);ctx.fillText(s,x,y);ctx.restore();}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\nconst Pa=panel(0,0,'a'), Pb=panel(1,0,'b'), Pc=panel(2,0,'c'), Pd=panel(3,0,'d');\nconst PI=panel(0,1,'I'), PII=panel(1,1,'II'), PIII=panel(2,1,'III'), PIV=panel(3,1,'IV');\ncurve(Pa,x=>0.16*x*x*x-0.64*x+0.4,'#006D77',4.2);\npiece(Pb,[[-3,-1.2],[-1,1.0],[1,-0.9],[3,1.2]],'#006D77',4.2);\ncurve(Pc,x=>0.33*(x-.4)*(x-.4)-1.2,'#006D77',4.2);\ncurve(Pd,x=>0.08*x*x*x*x-0.55*x*x+0.25*x+.4,'#006D77',4.2);\ncurve(PI,x=>0.66*(x-.4),'#A23E2F',4.2);\ncurve(PII,x=>0.48*x*x-0.7,'#A23E2F',4.2);\ncurve(PIII,x=>0.32*x*x*x-1.1*x+0.25,'#A23E2F',4.2);\nstepgraph(PIV,[[-3,-1,-1.1],[-1,1,1.25],[1,3,0.25]],'#A23E2F');\ntxt('functions',w/2,28,'#5c6a6b',24);\ntxt('possible derivatives',w/2,382,'#5c6a6b',24);\nif(step===0){txt('First: look for matches before the answers appear.',w/2,h-14,'#5c6a6b',25);}\nif(step===1){outline(Pa,'#F57634');outline(PII,'#F57634');txt('a → II',w/2,h-14,'#F57634',29);}\nif(step===2){outline(Pb,'#F57634');outline(PIV,'#F57634');txt('b → IV',w/2,h-14,'#F57634',29);}\nif(step===3){outline(Pc,'#F57634');outline(PI,'#F57634');txt('c → I',w/2,h-14,'#F57634',29);}\nif(step===4){outline(Pd,'#F57634');outline(PIII,'#F57634');txt('d → III',w/2,h-14,'#F57634',29);}\n\\end{js}\n\n\\slide{Example 7: Which Curve Is Which?}\nThe figure shows two graphs. One is $f$ and one is $f'$.\n\n\\begin{js}[size=1480x540, frames=4]\nconst FM=\"'JetBrains Mono', ui-monospace, monospace\";\nconst L=76,R=40,T=28,B=64,XL=-3.2,XR=4.2,YB=-2.4,YT=4.6;\nconst PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nfunction fp(x){return 1.2-0.2*(x-1)*(x-1);}\nfunction f(x){return 1.2*x-(0.2/3)*(x-1)*(x-1)*(x-1)+1.4;}\nfunction axes(){\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\n  for(let x=-3;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\n  for(let y=-2;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\n  ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(L+PW,Y(0));ctx.moveTo(X(0),T);ctx.lineTo(X(0),T+PH);ctx.stroke();\n  ctx.fillStyle='#555';ctx.font='24px '+FM;ctx.textAlign='center';\n  [-2,-1,0,1,2,3,4].forEach(x=>ctx.fillText(String(x),X(x),T+PH+35));\n}\nfunction curve(fun,col,lw){\n  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();let pen=false;\n  for(let j=0;j<=700;j++){const x=XL+(XR-XL)*j/700,y=fun(x);if(y<YB||y>YT){pen=false;continue;}if(pen)ctx.lineTo(X(x),Y(y));else{ctx.moveTo(X(x),Y(y));pen=true;}}\n  ctx.stroke();\n}\nfunction dot(x,y,col,r){ctx.beginPath();ctx.arc(X(x),Y(y),r||10,0,6.283);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();}\nfunction label(s,x,y,col){ctx.save();ctx.font='600 30px '+FM;ctx.textAlign='left';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(s,X(x),Y(y));ctx.fillStyle=col;ctx.fillText(s,X(x),Y(y));ctx.restore();}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);axes();\ncurve(f,'#B23A48',5);curve(fp,'#006D77',5);\nlabel('red curve',-2.8,3.6,'#B23A48');label('blue curve',2.15,1.5,'#006D77');\nif(step>=1){\n  ctx.fillStyle='rgba(245,118,52,.13)';ctx.fillRect(X(-1.45),T, X(3.45)-X(-1.45), PH);\n  label(\"where blue is positive, red increases\",-2.6,4.25,'#F57634');\n}\nif(step>=2){\n  ctx.strokeStyle='#F57634';ctx.lineWidth=4;ctx.setLineDash([9,7]);ctx.beginPath();ctx.moveTo(X(-1),T);ctx.lineTo(X(-1),T+PH);ctx.stroke();ctx.setLineDash([]);\n  dot(-1,fp(-1),'#F57634',12);label(\"f'(-1)>0\",-0.85,fp(-1)+0.55,'#F57634');\n}\nif(step>=3){\n  const x=1,y=fp(1),dx=.65;\n  ctx.strokeStyle='#4B59C6';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(X(x-dx),Y(y));ctx.lineTo(X(x+dx),Y(y));ctx.stroke();\n  dot(1,y,'#4B59C6',12);label(\"slope of f' at 1 is 0\",1.15,y+.8,'#4B59C6');\n}\n\\end{js}\n\n\\uncover<1->{The red curve is increasing exactly where the blue curve is positive, and decreasing where the blue curve is negative. So the blue curve is $f'$ and the red curve is $f$.}\n\\uncover<2->{The value $f'(-1)$ is the height of the blue graph at $x=-1$, which is positive.}\n\\uncover<3->{The value $f''(1)$ is the slope of the blue graph at $x=1$. There the tangent is horizontal, so $f''(1)=0$.}\n\n\\slide{Example 7: Conclusion}\nFrom the graph,\n\n$$\nf'(-1)>0\n$$\n\nand\n\n$$\nf''(1)=0.\n$$\n\n\\pause\nTherefore,\n\n$$\nf'(-1)>f''(1).\n$$\n\n\\pause\nThis example is a reminder that $f''$ is not a new mysterious idea:\n$$\nf'' \\text{ measures slopes on the graph of } f'.\n$$\n\n\\slide{Notation for the Derivative}\nIf $y=f(x)$, where $x$ is the independent variable and $y$ is the dependent variable, then common notations for the derivative are\n\n\\pause\n$$\nf'(x)=y'=\\frac{dy}{dx}=\\frac{d}{dx}f(x)=Df(x)=D_xf(x).\n$$\n\n\\pause\nThe symbols $D$ and $\\dfrac{d}{dx}$ are called \\alert{differential operators} because they indicate the operation of \\alert{differentiation}.\n\n\\slide{Leibniz Notation}\nIn Leibniz notation,\n$$\n\\frac{dy}{dx}=\\lim_{\\Delta x\\to0}\\frac{\\Delta y}{\\Delta x}.\n$$\n\n\\pause\nTo indicate the value of the derivative at a particular number $a$, we write\n$$\n\\left.\\frac{dy}{dx}\\right|_{x=a}.\n$$\n\n\\pause\nThe vertical bar means \\alert{evaluate at}.\n\n\\slide{Differentiability}\nA function $f$ is \\alert{differentiable at $a$} if $f'(a)$ exists.\n\n\\pause\nA function $f$ is \\alert{differentiable on an open interval} if it is differentiable at every number in that interval.\n\n\\pause\nThe open interval may have any of the forms\n$$\n(a,b),\\qquad (-\\infty,b),\\qquad (a,\\infty),\\qquad (-\\infty,\\infty).\n$$\n\n\\pause\nFor example, $f(x)=x^2-2x^3$ is differentiable on\n$$\n\\mathbb{R}=(-\\infty,\\infty).\n$$\n\n\\section{When Derivatives Do Not Exist}\n\n\\slide{Example 8: Is $f(x)=|x|$ Differentiable?}\n\\begin{twocol}[5 7]\n\\begin{js}[size=620x520, frames=3]\nconst base='base',L=64,R=26,T=30,B=58,XL=-4,XR=4,YB=-.5,YT=4.5,PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(-4),Y(0));ctx.lineTo(X(4),Y(0));ctx.moveTo(X(0),Y(-.5));ctx.lineTo(X(0),Y(4.5));ctx.stroke();\nctx.strokeStyle='#006D77';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(X(0),Y(0),8,0,6.283);ctx.fill();\nif(base==='right'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();if(step>=4){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope +1',X(2.45),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope +1',X(2.45),Y(1.25));ctx.restore();}}\nif(base==='left'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.stroke();if(step>=5){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope −1',X(-2.55),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope −1',X(-2.55),Y(1.25));ctx.restore();}}\nif(base==='zero' && step>=1){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(2.2),Y(2.2));ctx.stroke();}\nif(base==='zero' && step>=2){ctx.strokeStyle='#7A5AA6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(-2.2),Y(2.2));ctx.lineTo(X(0),Y(0));ctx.stroke();}\nctx.fillStyle='#333';ctx.font='600 25px Arial';ctx.textAlign='left';ctx.fillText('y = |x|',L+12,T+30);\n\\end{js}\n\\columnbreak\nThe absolute value function is\n$$\n|x|=\\begin{cases}\nx,&x\\ge0,\\\\\n-x,&x<0.\n\\end{cases}\n$$\n\n\\uncover<1->{The graph is continuous, but it has a sharp corner at $x=0$.}\n\n\\uncover<2->{We will check differentiability using the definition.}\n\\end{twocol}\n\n\\slide{Example 8: The Case $x>0$}\n\\begin{twocol}[5 7]\n\\begin{js}[size=620x520, frames=6]\nconst right='right',L=64,R=26,T=30,B=58,XL=-4,XR=4,YB=-.5,YT=4.5,PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(-4),Y(0));ctx.lineTo(X(4),Y(0));ctx.moveTo(X(0),Y(-.5));ctx.lineTo(X(0),Y(4.5));ctx.stroke();\nctx.strokeStyle='#006D77';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(X(0),Y(0),8,0,6.283);ctx.fill();\nif(right==='right'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();if(step>=4){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope +1',X(2.45),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope +1',X(2.45),Y(1.25));ctx.restore();}}\nif(right==='left'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.stroke();if(step>=5){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope −1',X(-2.55),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope −1',X(-2.55),Y(1.25));ctx.restore();}}\nif(right==='zero' && step>=1){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(2.2),Y(2.2));ctx.stroke();}\nif(right==='zero' && step>=2){ctx.strokeStyle='#7A5AA6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(-2.2),Y(2.2));ctx.lineTo(X(0),Y(0));ctx.stroke();}\nctx.fillStyle='#333';ctx.font='600 25px Arial';ctx.textAlign='left';ctx.fillText('y = |x|',L+12,T+30);\n\\end{js}\n\\columnbreak\n\\uncover<1->{Assume $x>0$.}\n\n\\uncover<2->{If $h$ is close enough to $0$, then $x+h>0$ too, so $|x+h|=x+h$ and $|x|=x$.}\n\n\\uncover<3->{$$\n\\frac{|x+h|-|x|}{h}=\\frac{(x+h)-x}{h}.\n$$}\n\n\\uncover<4->{$$\n\\frac{|x+h|-|x|}{h}=1.\n$$}\n\n\\uncover<5->{Thus, $f'(x)=1$ for $x>0$.}\n\\end{twocol}\n\n\\slide{Example 8: The Case $x<0$}\n\\begin{twocol}[5 7]\n\\begin{js}[size=620x520, frames=7]\nconst left='left',L=64,R=26,T=30,B=58,XL=-4,XR=4,YB=-.5,YT=4.5,PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(-4),Y(0));ctx.lineTo(X(4),Y(0));ctx.moveTo(X(0),Y(-.5));ctx.lineTo(X(0),Y(4.5));ctx.stroke();\nctx.strokeStyle='#006D77';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(X(0),Y(0),8,0,6.283);ctx.fill();\nif(left==='right'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();if(step>=4){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope +1',X(2.45),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope +1',X(2.45),Y(1.25));ctx.restore();}}\nif(left==='left'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.stroke();if(step>=5){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope −1',X(-2.55),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope −1',X(-2.55),Y(1.25));ctx.restore();}}\nif(left==='zero' && step>=1){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(2.2),Y(2.2));ctx.stroke();}\nif(left==='zero' && step>=2){ctx.strokeStyle='#7A5AA6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(-2.2),Y(2.2));ctx.lineTo(X(0),Y(0));ctx.stroke();}\nctx.fillStyle='#333';ctx.font='600 25px Arial';ctx.textAlign='left';ctx.fillText('y = |x|',L+12,T+30);\n\\end{js}\n\\columnbreak\n\\uncover<1->{Assume $x<0$.}\n\n\\uncover<2->{If $h$ is close enough to $0$, then $x+h<0$ too, so $|x+h|=-(x+h)$ and $|x|=-x$.}\n\n\\uncover<3->{$$\n\\frac{|x+h|-|x|}{h}=\\frac{-(x+h)-(-x)}{h}.\n$$}\n\n\\uncover<4->{$$\n\\frac{|x+h|-|x|}{h}=\\frac{-h}{h}=-1.\n$$}\n\n\\uncover<5->{Thus, $f'(x)=-1$ for $x<0$.}\n\\end{twocol}\n\n\\slide{Example 8: What Happens at $0$?}\n\\begin{twocol}[5 7]\n\\begin{js}[size=620x520, frames=4]\nconst zero='zero',L=64,R=26,T=30,B=58,XL=-4,XR=4,YB=-.5,YT=4.5,PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(-4),Y(0));ctx.lineTo(X(4),Y(0));ctx.moveTo(X(0),Y(-.5));ctx.lineTo(X(0),Y(4.5));ctx.stroke();\nctx.strokeStyle='#006D77';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(X(0),Y(0),8,0,6.283);ctx.fill();\nif(zero==='right'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();if(step>=4){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope +1',X(2.45),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope +1',X(2.45),Y(1.25));ctx.restore();}}\nif(zero==='left'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.stroke();if(step>=5){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope −1',X(-2.55),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope −1',X(-2.55),Y(1.25));ctx.restore();}}\nif(zero==='zero' && step>=1){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(2.2),Y(2.2));ctx.stroke();}\nif(zero==='zero' && step>=2){ctx.strokeStyle='#7A5AA6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(-2.2),Y(2.2));ctx.lineTo(X(0),Y(0));ctx.stroke();}\nctx.fillStyle='#333';ctx.font='600 25px Arial';ctx.textAlign='left';ctx.fillText('y = |x|',L+12,T+30);\n\\end{js}\n\\columnbreak\nAt $x=0$,\n$$\nf'(0)=\\lim_{h\\to0}\\frac{|h|}{h}.\n$$\n\n\\uncover<1->{Approach from the right:\n$$\n\\lim_{h\\to0^+}\\frac{|h|}{h}=1.\n$$}\n\n\\uncover<2->{Approach from the left:\n$$\n\\lim_{h\\to0^-}\\frac{|h|}{h}=-1.\n$$}\n\n\\uncover<3->{The one-sided limits disagree, so $f'(0)$ does not exist.}\n\\end{twocol}\n\n\\slide{Example 8: Conclusion}\n\\begin{twocol}[5 7]\n\\begin{js}[size=620x520, frames=3]\nconst base='base',L=64,R=26,T=30,B=58,XL=-4,XR=4,YB=-.5,YT=4.5,PW=w-L-R,PH=h-T-B;\nfunction X(x){return L+(x-XL)/(XR-XL)*PW;} function Y(y){return T+PH-(y-YB)/(YT-YB)*PH;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;\nfor(let x=-4;x<=4;x++){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),T+PH);ctx.stroke();}\nfor(let y=0;y<=4;y++){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(L+PW,Y(y));ctx.stroke();}\nctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(-4),Y(0));ctx.lineTo(X(4),Y(0));ctx.moveTo(X(0),Y(-.5));ctx.lineTo(X(0),Y(4.5));ctx.stroke();\nctx.strokeStyle='#006D77';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(X(0),Y(0),8,0,6.283);ctx.fill();\nif(base==='right'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(4),Y(4));ctx.stroke();if(step>=4){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope +1',X(2.45),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope +1',X(2.45),Y(1.25));ctx.restore();}}\nif(base==='left'){ctx.strokeStyle='#F57634';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(X(-4),Y(4));ctx.lineTo(X(0),Y(0));ctx.stroke();if(step>=5){ctx.save();ctx.font='700 28px Arial';ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='rgba(255,255,255,.97)';ctx.strokeText('slope −1',X(-2.55),Y(1.25));ctx.fillStyle='#5A189A';ctx.fillText('slope −1',X(-2.55),Y(1.25));ctx.restore();}}\nif(base==='zero' && step>=1){ctx.strokeStyle='#F57634';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(2.2),Y(2.2));ctx.stroke();}\nif(base==='zero' && step>=2){ctx.strokeStyle='#7A5AA6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(X(-2.2),Y(2.2));ctx.lineTo(X(0),Y(0));ctx.stroke();}\nctx.fillStyle='#333';ctx.font='600 25px Arial';ctx.textAlign='left';ctx.fillText('y = |x|',L+12,T+30);\n\\end{js}\n\\columnbreak\n\\uncover<1->{The absolute value function is differentiable everywhere except at the corner $x=0$.}\n\n\\uncover<2->{$$\nf'(x)=\\begin{cases}\n-1,&x<0,\\\\\n1,&x>0,\n\\end{cases}\n\\qquad f'(0)\\text{ does not exist.}\n$$}\n\\end{twocol}\n\n\\section{Differentiability and Continuity}\n\n\\slide{Theorem}\n\\begin{note}\nIf $f$ is differentiable at $a$, then $f$ is continuous at $a$.\n\\end{note}\n\n\\pause\nWhat we know:\n$$\nf'(a)=\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}\n$$\nexists.\n\n\\pause\nWhat we need to prove:\n$$\n\\lim_{x\\to a}f(x)=f(a).\n$$\n\n\\slide{Proof: Connect the Two Limits}\nFor $x\\ne a$, write\n$$\nf(x)-f(a)=\\frac{f(x)-f(a)}{x-a}(x-a).\n$$\n\n\\pause\nTake the limit as $x\\to a$:\n$$\n\\lim_{x\\to a}[f(x)-f(a)]\n=\n\\lim_{x\\to a}\\left[\\frac{f(x)-f(a)}{x-a}(x-a)\\right].\n$$\n\n\\pause\nUse the product law:\n$$\n\\lim_{x\\to a}[f(x)-f(a)]\n=\n\\left(\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}\\right)\n\\left(\\lim_{x\\to a}(x-a)\\right).\n$$\n\n\\pause\nThe first limit is $f'(a)$ and the second is $0$, so\n$$\n\\lim_{x\\to a}[f(x)-f(a)]=f'(a)\\cdot0=0.\n$$\n\n\\slide{Proof: Finish Continuity}\nNow write\n$$\nf(x)=f(a)+[f(x)-f(a)].\n$$\n\n\\pause\nTake the limit:\n$$\n\\lim_{x\\to a}f(x)\n=\n\\lim_{x\\to a}f(a)+\\lim_{x\\to a}[f(x)-f(a)].\n$$\n\n\\pause\nThe first limit is $f(a)$ and the second limit is $0$:\n$$\n\\lim_{x\\to a}f(x)=f(a)+0=f(a).\n$$\n\n\\pause\nTherefore, $f$ is continuous at $a$.\n\n\\pause\n\\begin{note}\nDifferentiability implies continuity. Continuity does not imply differentiability.\n\\end{note}\n\n\\slide{Three Ways Differentiability Can Fail}\n\\begin{js}[size=1580x520, frames=3]\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\nconst active=step;\nfunction panel(i,title,draw,label1,label2){\n  const gap=24, W=(w-2*gap)/3, H=h-52, X0=gap+i*W, Y0=18, innerW=W-gap;\n  ctx.fillStyle=(active===i?'#FFF4E6':'#F8FAFA');ctx.fillRect(X0,Y0,innerW,H);\n  ctx.strokeStyle=(active===i?'#F57634':'#D8E2E2');ctx.lineWidth=4;ctx.strokeRect(X0,Y0,innerW,H);\n  ctx.fillStyle='#222';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText(title,X0+innerW/2,Y0+40);\n  draw(X0+48,Y0+64,innerW-96,H-145);\n  ctx.font='21px Arial';ctx.fillStyle='#333';ctx.fillText(label1,X0+innerW/2,Y0+H-50);\n  if(label2)ctx.fillText(label2,X0+innerW/2,Y0+H-24);\n  if(active===i){ctx.fillStyle='#F57634';ctx.font='600 18px Arial';ctx.fillText('active example',X0+innerW/2,Y0+H-4);}\n}\nfunction axes(x0,y0,pw,ph){ctx.strokeStyle='#AAA';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x0,y0+ph/2);ctx.lineTo(x0+pw,y0+ph/2);ctx.moveTo(x0+pw/2,y0);ctx.lineTo(x0+pw/2,y0+ph);ctx.stroke();}\npanel(0,'Corner',function(x0,y0,pw,ph){axes(x0,y0,pw,ph);ctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y0+ph*.76);ctx.lineTo(x0+pw/2,y0+ph/2);ctx.lineTo(x0+pw,y0+ph*.76);ctx.stroke();},'left and right slopes','do not agree');\npanel(1,'Discontinuity',function(x0,y0,pw,ph){axes(x0,y0,pw,ph);ctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y0+ph*.70);ctx.lineTo(x0+pw/2-10,y0+ph*.70);ctx.stroke();ctx.beginPath();ctx.moveTo(x0+pw/2+10,y0+ph*.34);ctx.lineTo(x0+pw,y0+ph*.34);ctx.stroke();ctx.fillStyle='#fff';ctx.strokeStyle='#006D77';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x0+pw/2-10,y0+ph*.70,8,0,6.283);ctx.stroke();ctx.fillStyle='#006D77';ctx.beginPath();ctx.arc(x0+pw/2+10,y0+ph*.34,8,0,6.283);ctx.fill();},'not continuous,','so not differentiable');\npanel(2,'Vertical Tangent',function(x0,y0,pw,ph){axes(x0,y0,pw,ph);function X(t){return x0+(t+1)/2*pw;}function Y(v){return y0+ph-(v+1)/2*ph;}ctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();for(let k=0;k<=300;k++){let t=-1+2*k/300,v=Math.cbrt(t);if(k===0)ctx.moveTo(X(t),Y(v));else ctx.lineTo(X(t),Y(v));}ctx.stroke();ctx.strokeStyle='#F57634';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x0+pw/2,y0+18);ctx.lineTo(x0+pw/2,y0+ph-18);ctx.stroke();},'tangent becomes vertical;','finite slope does not exist');\n\\end{js}\n\n\\slide{Zooming In: Smooth Graph Versus Corner}\n\\begin{js}[size=1500x540, frames=7]\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\nconst leftActive=step<=3;\nconst leftStep=Math.min(step,3);\nconst rightStep=Math.max(0,step-3);\nfunction makePanel(x0,y0,pw,ph,title,f,tangent,zstep,active){\n  const zoom=3/Math.pow(2.5,zstep);\n  ctx.fillStyle=(active?'#FFF4E6':'#F8FAFA');ctx.fillRect(x0,y0,pw,ph);\n  ctx.strokeStyle=(active?'#F57634':'#D8E2E2');ctx.lineWidth=4;ctx.strokeRect(x0,y0,pw,ph);\n  ctx.fillStyle='#222';ctx.font='30px Arial';ctx.textAlign='center';ctx.fillText(title,x0+pw/2,y0+38);\n  const L=x0+56,R=x0+pw-30,T=y0+65,B=y0+ph-52, XL=-zoom,XR=zoom,YB=-zoom,YT=zoom;\n  function X(x){return L+(x-XL)/(XR-XL)*(R-L);}function Y(y){return B-(y-YB)/(YT-YB)*(B-T);}\n  ctx.strokeStyle='#E8EFEF';ctx.lineWidth=1;for(let g=-3;g<=3;g++){let v=g*zoom/3;ctx.beginPath();ctx.moveTo(X(v),T);ctx.lineTo(X(v),B);ctx.moveTo(L,Y(v));ctx.lineTo(R,Y(v));ctx.stroke();}\n  ctx.strokeStyle='#AAA';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(R,Y(0));ctx.moveTo(X(0),T);ctx.lineTo(X(0),B);ctx.stroke();\n  ctx.save();ctx.beginPath();ctx.rect(L,T,R-L,B-T);ctx.clip();\n  ctx.strokeStyle='#006D77';ctx.lineWidth=5;ctx.beginPath();let pen=false;for(let i=0;i<=600;i++){let x=XL+(XR-XL)*i/600,y=f(x);if(y<YB||y>YT){pen=false;continue;}if(pen)ctx.lineTo(X(x),Y(y));else{ctx.moveTo(X(x),Y(y));pen=true;}}ctx.stroke();\n  ctx.strokeStyle='#E76F51';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(XL),Y(tangent(XL)));ctx.lineTo(X(XR),Y(tangent(XR)));ctx.stroke();ctx.restore();\n  ctx.fillStyle=active?'#F57634':'#666';ctx.font='600 22px Arial';ctx.fillText('zoom ×'+Math.pow(2.5,zstep).toFixed(1),x0+pw/2,y0+ph-17);\n}\nconst pw=(w-72)/2, ph=h-54;\nmakePanel(24,18,pw,ph,'Differentiable at 0',x=>0.45*x+0.25*x*x,x=>0.45*x,leftStep,leftActive);\nmakePanel(48+pw,18,pw,ph,'Corner at 0',x=>Math.abs(x),x=>0,rightStep,!leftActive);\nctx.fillStyle='#333';ctx.font='23px Arial';ctx.textAlign='center';\nctx.fillText(leftActive?'First: zoom in on the smooth graph.':'Now: zoom in on the corner.',w/2,h-8);\n\\end{js}\n\n\\section{Second Derivatives}\n\n\\slide{The Second Derivative}\nThe derivative $f'$ is itself a function.\n\n\\pause\nSo we can differentiate it again.\n\n\\pause\nThe derivative of $f'$ is called the \\alert{second derivative}:\n$$\nf''=(f')'.\n$$\n\n\\pause\nIn Leibniz notation:\n$$\nf''(x)=\\frac{d^2y}{dx^2}.\n$$\n\n\n\\slide{Example 9: Find $f''(x)$}\nReturn to the first function from today:\n$$\nf(x)=x^2-2x^3.\n$$\n\n\\uncover<1->{Earlier we found its derivative function:}\n\n\\uncover<1->{$$\nf'(x)=2x-6x^2.\n$$}\n\n\\uncover<2->{So there is no need to compute $f'$ again. We now differentiate the function $f'$.}\n\n\\slide{Example 9: Set Up the Second Derivative}\nSince\n$$\nf'(x)=2x-6x^2,\n$$\nwe apply the definition to $f'$:\n\n\\uncover<1->{$$\nf''(x)=\\lim_{h\\to0}\\frac{f'(x+h)-f'(x)}{h}.\n$$}\n\n\\uncover<2->{Substitute the known formula for $f'$:}\n\n\\uncover<2->{$$\nf''(x)=\\lim_{h\\to0}\n\\frac{2(x+h)-6(x+h)^2-(2x-6x^2)}{h}.\n$$}\n\n\\slide{Example 9: Simplify}\nExpand the square:\n$$\nf''(x)=\\lim_{h\\to0}\n\\frac{2x+2h-6(x^2+2xh+h^2)-2x+6x^2}{h}.\n$$\n\n\\uncover<1->{Distribute and cancel:}\n\n\\uncover<1->{$$\nf''(x)=\\lim_{h\\to0}\\frac{2h-12xh-6h^2}{h}.\n$$}\n\n\\uncover<2->{For $h\\ne0$, cancel the common factor $h$:}\n\n\\uncover<2->{$$\nf''(x)=\\lim_{h\\to0}(2-12x-6h).\n$$}\n\n\\slide{Example 9: Take the Limit}\nNow let $h\\to0$:\n$$\nf''(x)=2-12x.\n$$\n\n\\uncover<1->{So for the original function}\n\n\\uncover<1->{$$\nf(x)=x^2-2x^3,\n$$}\n\n\\uncover<2->{we now know both}\n\n\\uncover<2->{$$\nf'(x)=2x-6x^2,\n\\qquad\nf''(x)=2-12x.\n$$}\n\n\\slide{Example 10: A Chain of Derivatives}\nIdentify which curve is $f$, which is $f'$, and which is $f''$.\n\n\\begin{js}[size=1580x600, frames=4]\nconst FM=\"'JetBrains Mono', ui-monospace, monospace\";\nconst W=455,H=390,L0=70,G=65,T=55,XL=-2.4,XR=2.4;\nfunction X(x,ox){return ox+(x-XL)/(XR-XL)*W;}\nfunction Y(y,oy,yb,yt){return oy+H-(y-yb)/(yt-yb)*H;}\nfunction panel(i,label,yb,yt){\n  const ox=L0+i*(W+G), oy=T;\n  ctx.strokeStyle='#DDEBEC';ctx.lineWidth=1.5;ctx.strokeRect(ox,oy,W,H);\n  ctx.strokeStyle='#EEF3F3';ctx.lineWidth=1;\n  for(let x=-2;x<=2;x++){ctx.beginPath();ctx.moveTo(X(x,ox),oy);ctx.lineTo(X(x,ox),oy+H);ctx.stroke();}\n  for(let y=Math.ceil(yb);y<=Math.floor(yt);y++){ctx.beginPath();ctx.moveTo(ox,Y(y,oy,yb,yt));ctx.lineTo(ox+W,Y(y,oy,yb,yt));ctx.stroke();}\n  ctx.strokeStyle='#333';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(ox,Y(0,oy,yb,yt));ctx.lineTo(ox+W,Y(0,oy,yb,yt));ctx.moveTo(X(0,ox),oy);ctx.lineTo(X(0,ox),oy+H);ctx.stroke();\n  ctx.save();ctx.fillStyle='#333';ctx.font='600 32px '+FM;ctx.textAlign='left';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(label,ox+16,oy+40);ctx.fillText(label,ox+16,oy+40);ctx.restore();\n  return {ox,oy,yb,yt};\n}\nfunction curve(P,fun,col){\n  ctx.save();ctx.beginPath();ctx.rect(P.ox,P.oy,W,H);ctx.clip();\n  ctx.strokeStyle=col;ctx.lineWidth=4.5;ctx.lineCap='round';ctx.beginPath();let pen=false;\n  for(let j=0;j<=650;j++){const x=XL+(XR-XL)*j/650,y=fun(x);if(y<P.yb||y>P.yt){pen=false;continue;}if(pen)ctx.lineTo(X(x,P.ox),Y(y,P.oy,P.yb,P.yt));else{ctx.moveTo(X(x,P.ox),Y(y,P.oy,P.yb,P.yt));pen=true;}}\n  ctx.stroke();ctx.restore();\n}\nfunction outline(P,col){ctx.strokeStyle=col;ctx.lineWidth=7;ctx.strokeRect(P.ox-5,P.oy-5,W+10,H+10);}\nfunction lab(s,P,x,y,col){ctx.save();ctx.font='600 34px '+FM;ctx.textAlign='center';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(s,X(x,P.ox),Y(y,P.oy,P.yb,P.yt));ctx.fillStyle=col;ctx.fillText(s,X(x,P.ox),Y(y,P.oy,P.yb,P.yt));ctx.restore();}\nfunction d(x){return .25*x*x*x*x-1.1*x*x+.3*x;}\nfunction c(x){return x*x*x-2.2*x+.3;}\nfunction b(x){return 3*x*x-2.2;}\nctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);\nconst Pb=panel(0,'b',-3,12), Pc=panel(1,'c',-4,4), Pd=panel(2,'d',-2.5,2.5);\ncurve(Pb,b,'#006D77');curve(Pc,c,'#006D77');curve(Pd,d,'#006D77');\nif(step>=1){outline(Pd,'#F57634');lab('f',Pd,1.8,1.75,'#F57634');}\nif(step>=2){outline(Pc,'#F57634');lab(\"f'\",Pc,1.8,2.75,'#F57634');}\nif(step>=3){outline(Pb,'#F57634');lab(\"f''\",Pb,1.6,8.8,'#F57634');}\n\\end{js}\n\n\\slide{Where We Got To}\n\\begin{itemize}\n\\item We computed tangent slopes using the limit definition.\n\\pause\n\\item We interpreted derivatives as velocity and as instantaneous rate of change.\n\\pause\n\\item We saw that the derivative can be viewed as a new function $f'$.\n\\pause\n\\item We learned several notations for derivatives.\n\\pause\n\\item We saw examples where derivatives fail to exist.\n\\pause\n\\item We proved that differentiability implies continuity.\n\\pause\n\\item We computed a second derivative using the same definition again.\n\\end{itemize}\n\n\\pause\n$$\nf''(x)=\\lim_{h\\to0}\\frac{f'(x+h)-f'(x)}{h}\n$$\n\n\\pause\n\\begin{note}\n\\alert{Please complete Problem Set 5 before the next quiz.}\n\\end{note}\n";window.LECTURE_SCALE=1.2;</script><script src="lecture-engine.js"></script><script>function PLAYER() {
    var q = null;
    try { q = new URLSearchParams(location.search).get('scale'); } catch (e) {}
    if (q && !isNaN(parseFloat(q))) window.Lecture.setScale(parseFloat(q));
    else if (window.LECTURE_SCALE) window.Lecture.setScale(window.LECTURE_SCALE);
    var parsed = window.Lecture.parse(window.LECTURE_SOURCE);
    var slides = parsed.slides, meta = parsed.meta;
    var si = 0, ctrl = null, step = 0;
    var stage = document.getElementById('stage'), slideEl = document.getElementById('slide');
    var tray = document.getElementById('tray'), bar = document.getElementById('bar');
    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'scale(' + s + ')';
      stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
      stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    }
    addEventListener('resize', fit); fit();
    var track = document.createElement('div');
    track.title = 'Drag to scrub through the deck';
    track.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:18px;cursor:ew-resize;z-index:6';
    stage.appendChild(track);
    track.addEventListener('pointerdown', function (e) {
      function pick(cx) {
        var r = track.getBoundingClientRect();
        if (!r.width) return;
        var u = Math.max(0, Math.min(0.9999, (cx - r.left) / r.width));
        var k = Math.floor(u * slides.length);
        if (k === si) return;
        si = k; step = 0; render();
      }
      function move(ev) { ev.preventDefault(); pick(ev.clientX); }
      function up() {
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        bar.style.height = '4px'; bar.style.transition = 'width .3s ease';
      }
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
      bar.style.height = '10px'; bar.style.transition = 'none';
      pick(e.clientX);
    });
    function chrome() {
      var total = slides.length;
      tray.innerHTML = '<div class="nb" id="prev">&#8592;</div><div class="nb" id="next">&#8594;</div>' +
        '<div style="flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:24px;color:#125A56">' +
        (slides[si].section || meta.title || '') + '</div>' +
        '<div style="color:#999">' + (meta.copyright || '') + '</div>' +
        '<div style="color:#111">' + (si + 1) + ' / ' + total + '</div>';
      document.getElementById('prev').onclick = function () { go(-1); };
      document.getElementById('next').onclick = function () { go(1); };
      bar.style.width = ((si + 1) / total * 1920) + 'px';
    }
    function render() {
