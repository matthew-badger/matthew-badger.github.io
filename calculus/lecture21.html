<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="generator" content="lecture-engine 2.0.0-dev"><title>Lecture 21: Areas, Distances, and the Definite Integral</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><style>html,body{margin:0;height:100%;background:#fff;overflow:hidden}#wrap{position:fixed;inset:0;overflow:hidden}#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}</style></head><body><main id="wrap"><div id="stage"></div></main><script>window.LECTURE_IMAGES={};window.LECTURE_SOURCE="\\engine{2}\n\\title{Lecture 21: Areas, Distances, and the Definite Integral}\n\\course{MATH 1131Q — Calculus I}\n\\author{Matthew Badger}\n\\date{November 16, 2026}\n\\copyright{(C) Matthew Badger 2026}\n\n\\titleslide\n\n% ------------------------------------------------------------------\n\\slide{Two Halves of Calculus}\n\\begin{columns}[1 1]\n\\heading{Differential Calculus}\nDerivative: the slope of the tangent line\n\\begin{plot}\nf = 1 + x^2/4\ndomain = -0.3:3.3\nrange = -0.3:3.5\na = 1.5\ntangent = true\naspect = equal\nsize = 600\nxticks = 1\nyticks = 1\nalt = Graph of y = 1 + x squared over 4 with its tangent line at x = 1.5\n\\end{plot}\n\\columnbreak\n\\pause\n\\heading{Integral Calculus}\nIntegral: the area under the curve\n\\begin{plot}\nf = 1 + x^2/4\ndomain = -0.3:3.3\nrange = -0.3:3.5\narea = 0.5:2.5\naspect = equal\nsize = 600\nxticks = 1\nyticks = 1\nalt = Graph of y = 1 + x squared over 4 with the region under it from x = 0.5 to x = 2.5 shaded\n\\end{plot}\n\\end{columns}\n\n% ==================================================================\n\\section{The Area Problem}\n\n\\slide{Area of a Disk}\n\\begin{columns}[5 7, parallel]\nInscribe a regular polygon with $n$ sides in a disk of radius $r$, and cut it into $n$ triangles with base $b_n$ and height $h_n$\n\\pause\n\\begin{align}\nA_n &= n\\cdot\\tfrac12\\,\\textcolor{c1}{b_n}\\,\\textcolor{c2}{h_n}\n\\pause\n\\phantom{A_n} &= \\tfrac12\\,\\textcolor{c2}{h_n}\\,(n\\,\\textcolor{c1}{b_n})\n\\pause\n\\phantom{A_n} &= \\tfrac12\\,\\textcolor{c2}{h_n}\\,P_n\n\\end{align}\nwhere $P_n=n\\,b_n$ is the perimeter of the polygon\n\\columnbreak\n\\begin{js}[size=760x700, frames=5, alt=\"A disk with an inscribed regular polygon of 6, then 8, 12, 24, and 48 sides, cut into triangles from the center; one triangle is highlighted with its base b_n and height h_n\"]\nconst N = [6, 8, 12, 24, 48];\nconst n = N[Math.min(local, 4)];\nconst cx = 380, cy = 325, r = 290;\nfunction sub(x, y, a, b, color) {\n  ctx.font = \"italic 42px 'Spectral', serif\";\n  const wa = ctx.measureText(a).width;\n  ctx.font = \"italic 30px 'Spectral', serif\";\n  const wb = ctx.measureText(b).width;\n  ctx.fillStyle = 'rgba(255,255,255,0.85)';\n  ctx.fillRect(x - 6, y - 36, wa + wb + 14, 56);\n  ctx.fillStyle = color;\n  ctx.font = \"italic 42px 'Spectral', serif\";\n  ctx.fillText(a, x, y);\n  ctx.font = \"italic 30px 'Spectral', serif\";\n  ctx.fillText(b, x + wa + 1, y + 10);\n}\nconst ang = (j) => Math.PI / 2 - Math.PI / n + 2 * Math.PI * j / n;\nconst P = (j) => [cx + r * Math.cos(ang(j)), cy + r * Math.sin(ang(j))];\nconst hn = r * Math.cos(Math.PI / n);\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = '#EEF2F2';\n  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill();\n  ctx.fillStyle = colors.area;\n  ctx.beginPath();\n  for (let j = 0; j < n; j++) { const p = P(j); if (j) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }\n  ctx.closePath(); ctx.fill();\n  const p0 = P(0), p1 = P(1);\n  ctx.globalAlpha = 0.3; ctx.fillStyle = colors.c1;\n  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.closePath(); ctx.fill();\n  ctx.globalAlpha = 1;\n  ctx.strokeStyle = colors.curve2; ctx.lineWidth = n > 20 ? 1 : 2;\n  for (let j = 0; j < n; j++) { const p = P(j); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(p[0], p[1]); ctx.stroke(); }\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 3;\n  ctx.beginPath();\n  for (let j = 0; j < n; j++) { const p = P(j); if (j) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }\n  ctx.closePath(); ctx.stroke();\n  ctx.strokeStyle = colors.ink; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 5;\n  ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();\n  ctx.strokeStyle = colors.c2; ctx.lineWidth = 4; ctx.setLineDash([12, 8]);\n  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + hn); ctx.stroke();\n  ctx.setLineDash([]);\n  ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2 * Math.PI); ctx.fill();\n  sub(cx + 16, cy + hn * 0.55, 'h', 'n', colors.c2);\n  sub(cx - 20, cy + r + 50, 'b', 'n', colors.c1);\n  ctx.fillStyle = colors.ink; ctx.font = \"34px 'JetBrains Mono', monospace\";\n  ctx.fillText('n = ' + n, 12, 42);\n}\ndraw();\nstate.shown = n;\nif (document.fonts) document.fonts.ready.then(() => { if (state.shown === n) draw(); });\n\\end{js}\n\\end{columns}\n\n\\slide{Area of a Disk: Let $n\\to\\infty$}\n\\begin{columns}[1 1, parallel]\nRearrange the $n$ triangles into a strip, alternating up and down\n\\pause\nThe strip has height $\\textcolor{c2}{h_n}$ and base $\\tfrac12P_n$, so its area is $\\tfrac12\\,\\textcolor{c2}{h_n}P_n=A_n$\n\\pause\nAs $n\\to\\infty$, the height $\\textcolor{c2}{h_n}\\to r$ and the perimeter $P_n\\to2\\pi r$, the circumference\n\\pause\n\\begin{align}\n\\text{Area of disk} &= \\lim_{n\\to\\infty}\\tfrac12\\,\\textcolor{c2}{h_n}P_n\n\\pause\n\\phantom{\\text{Area of disk}} &= \\tfrac12\\cdot r\\cdot2\\pi r=\\boxed{\\pi r^2}\n\\end{align}\n\\columnbreak\n\\begin{js}[size=800x480, frames=3, alt=\"The triangles of a 12-sided polygon slide into a strip, alternating up and down, of height h_n and base half the perimeter; then the same strip for 48 triangles, which is nearly a rectangle\"]\nconst n = local === 2 ? 48 : 12;\nconst cx = 400, cy = 235, r = 190;\nconst b = 2 * r * Math.sin(Math.PI / n), hh = r * Math.cos(Math.PI / n);\nconst x0 = (w - ((n / 2) * b + b / 2)) / 2 + 20, top = 70;\nconst ease = (u) => 1 - Math.pow(1 - u, 3);\nfunction sub(x, y, a, s, color) {\n  ctx.fillStyle = color;\n  ctx.font = \"italic 40px 'Spectral', serif\";\n  ctx.fillText(a, x, y);\n  const wa = ctx.measureText(a).width;\n  ctx.font = \"italic 28px 'Spectral', serif\";\n  ctx.fillText(s, x + wa + 1, y + 10);\n}\nfunction tri(px, py, phi, fill) {\n  const ux = Math.cos(phi), uy = Math.sin(phi), vx = -uy, vy = ux;\n  ctx.beginPath(); ctx.moveTo(px, py);\n  ctx.lineTo(px + hh * ux + b / 2 * vx, py + hh * uy + b / 2 * vy);\n  ctx.lineTo(px + hh * ux - b / 2 * vx, py + hh * uy - b / 2 * vy);\n  ctx.closePath();\n  ctx.fillStyle = fill; ctx.fill();\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = n > 20 ? 1 : 2; ctx.stroke();\n}\nfunction scene(e) {\n  ctx.clearRect(0, 0, w, h);\n  if (e < 1) {\n    ctx.globalAlpha = 1 - e; ctx.strokeStyle = colors.ink; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.stroke();\n    ctx.globalAlpha = 1;\n  }\n  for (let k = 0; k < n; k++) {\n    const phi0 = -Math.PI / 2 + 2 * Math.PI * k / n + Math.PI / n;\n    const tx = k % 2 === 0 ? x0 + (k / 2 + 0.5) * b : x0 + ((k + 1) / 2) * b;\n    const ty = k % 2 === 0 ? top : top + hh;\n    const phi1 = k % 2 === 0 ? Math.PI / 2 : -Math.PI / 2;\n    let d = phi1 - phi0;\n    d = ((d + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;\n    const ek = ease(Math.min(1, Math.max(0, (e - 0.4 * k / n) / 0.6)));\n    tri(cx + (tx - cx) * ek, cy + (ty - cy) * ek, phi0 + d * ek, k % 2 === 0 ? colors.pale : colors.sand);\n  }\n  ctx.fillStyle = colors.ink; ctx.font = \"34px 'JetBrains Mono', monospace\";\n  ctx.fillText('n = ' + n, 12, 42);\n  if (e >= 1) {\n    const yb = top + hh + 34, xr = x0 + (n / 2) * b;\n    ctx.strokeStyle = colors.ink; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(xr, yb);\n    ctx.moveTo(x0, yb - 12); ctx.lineTo(x0, yb + 12); ctx.moveTo(xr, yb - 12); ctx.lineTo(xr, yb + 12); ctx.stroke();\n    ctx.fillStyle = colors.ink; ctx.font = \"40px 'Spectral', serif\";\n    const xm = (x0 + xr) / 2 - 40;\n    ctx.fillText('½', xm, yb + 58);\n    sub(xm + 26, yb + 58, 'P', 'n', colors.ink);\n    ctx.strokeStyle = colors.c2; ctx.lineWidth = 3;\n    ctx.beginPath(); ctx.moveTo(x0 - 22, top); ctx.lineTo(x0 - 22, top + hh);\n    ctx.moveTo(x0 - 34, top); ctx.lineTo(x0 - 10, top); ctx.moveTo(x0 - 34, top + hh); ctx.lineTo(x0 - 10, top + hh); ctx.stroke();\n    sub(x0 - 84, top + hh / 2 + 12, 'h', 'n', colors.c2);\n  }\n}\nif (local === 1) {\n  onFrame((t) => scene(Math.min(t / 2.4, 1)));\n} else {\n  onFrame(() => scene(local === 2 ? 1 : 0));\n}\n\\end{js}\n\\end{columns}\n\n% ------------------------------------------------------------------\n\\slide{Area Under a Line}\n\\begin{columns}[5 7, parallel]\n\\begin{example}{Area Under a Line}\nFind the area under $y=x+1$ and above the $x$-axis, between $x=0$ and $x=1$\n\\end{example}\n\\pause\n\\textcolor{c1}{Square}: area $1$\n\\\\[0.4em]\n\\textcolor{c2}{Triangle}: area $\\tfrac12\\cdot1\\cdot1=0.5$\n\\pause\n$$\\text{Area}=1+0.5=1.5$$\n\\columnbreak\n\\begin{js}[size=560x720, alt=\"The line y = x + 1 from 0 to 1; the region under it is split into a unit square and a triangle with legs 1 and 1\"]\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.3, x1 = 1.6, y0 = -0.3;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst f = (x) => x + 1;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nfunction axes(dx, dy) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dx), Y(y0)); ctx.lineTo(X(k * dx), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dy)); ctx.lineTo(X(x1), Y(k * dy)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dx), X(k * dx), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dy), X(0) - 12, Y(k * dy));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(0.5, 0.5);\n  if (local >= 1) {\n    ctx.globalAlpha = 0.3;\n    ctx.fillStyle = colors.c1; ctx.fillRect(X(0), Y(1), X(1) - X(0), Y(0) - Y(1));\n    ctx.fillStyle = colors.c2; ctx.beginPath(); ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(1), Y(1)); ctx.lineTo(X(1), Y(2)); ctx.closePath(); ctx.fill();\n    ctx.globalAlpha = 1;\n    ctx.strokeStyle = colors.c1; ctx.lineWidth = 3; ctx.strokeRect(X(0), Y(1), X(1) - X(0), Y(0) - Y(1));\n    ctx.strokeStyle = colors.c2; ctx.beginPath(); ctx.moveTo(X(0), Y(1)); ctx.lineTo(X(1), Y(1)); ctx.lineTo(X(1), Y(2)); ctx.closePath(); ctx.stroke();\n    ctx.font = \"40px 'Spectral', serif\"; ctx.textAlign = 'center';\n    ctx.fillStyle = colors.c1; ctx.fillText('1', X(0.5), Y(0.5) + 14);\n    ctx.fillStyle = colors.c2; ctx.fillText('0.5', X(0.7), Y(1.3) + 14);\n    ctx.textAlign = 'left';\n  } else {\n    ctx.globalAlpha = 0.6; ctx.fillStyle = colors.area;\n    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(1)); ctx.lineTo(X(1), Y(2)); ctx.lineTo(X(1), Y(0)); ctx.closePath(); ctx.fill();\n    ctx.globalAlpha = 1;\n  }\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(f(x0))); ctx.lineTo(X(x1), Y(f(x1))); ctx.stroke();\n  ctx.fillStyle = colors.curve; ctx.font = \"italic 36px 'Spectral', serif\";\n  ctx.fillText('y = x + 1', X(0.1), Y(2.15));\n}\ndraw();\nstate.shown = local;\nif (document.fonts) document.fonts.ready.then(() => { if (state.shown === local) draw(); });\n\\end{js}\n\\end{columns}\n\n\\slide{Area Under a Parabola}\n\\begin{columns}[7 5, parallel]\n\\begin{example}{Area Under a Parabola}\nFind the area under $y=x^2+1$ and above the $x$-axis, between $x=0$ and $x=1$\n\\end{example}\n\\pause\nSquares and triangles do not fit this region exactly\n\\pause\n\\textbf{Plan:} approximate the region with rectangles, then take more and more rectangles\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with the region under it from x = 0 to x = 1 shaded\n\\end{plot}\n\\end{columns}\n\n\\slide{Left Endpoints, $n=2$}\n\\begin{columns}[7 5, parallel]\nTwo rectangles of width $0.5$, with heights given by $f(x)=x^2+1$ at the left endpoints $0$ and $0.5$\n\\pause\n\\begin{align}\nL_2 &= 0.5\\cdot f(0)+0.5\\cdot f(0.5)\n\\pause\n\\phantom{L_2} &= 0.5\\cdot1+0.5\\cdot1.25\n\\pause\n\\phantom{L_2} &= 1.125\n\\end{align}\n\\pause\nEach rectangle lies below the curve, so $L_2$ is an \\alert{underestimate}\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 2\nrtype = left\nreadout = false\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with two rectangles of width 0.5 whose heights come from the left endpoints\n\\end{plot}\n\\end{columns}\n\n\\slide{Right Endpoints, $n=2$}\n\\begin{columns}[7 5, parallel]\nHeights given by $f(x)=x^2+1$ at the right endpoints $0.5$ and $1$\n\\pause\n\\begin{align}\nR_2 &= 0.5\\cdot f(0.5)+0.5\\cdot f(1)\n\\pause\n\\phantom{R_2} &= 0.5\\cdot1.25+0.5\\cdot2\n\\pause\n\\phantom{R_2} &= 1.625\n\\end{align}\n\\pause\nEach rectangle sticks out above the curve, so $R_2$ is an \\alert{overestimate}\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 2\nrtype = right\nreadout = false\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with two rectangles of width 0.5 whose heights come from the right endpoints\n\\end{plot}\n\\end{columns}\n\n\\slide{Midpoints, $n=2$}\n\\begin{columns}[7 5, parallel]\nHeights given by $f(x)=x^2+1$ at the midpoints $0.25$ and $0.75$\n\\pause\n\\begin{align}\nM_2 &= 0.5\\cdot f(0.25)+0.5\\cdot f(0.75)\n\\pause\n\\phantom{M_2} &= 0.5\\cdot1.0625+0.5\\cdot1.5625\n\\pause\n\\phantom{M_2} &= 1.3125\n\\end{align}\n\\pause\nPart of each rectangle sticks out above the curve and part falls short, so the picture does not tell us whether $M_2$ is too big or too small\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 2\nrtype = mid\nreadout = false\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with two rectangles of width 0.5 whose heights come from the midpoints\n\\end{plot}\n\\end{columns}\n\n\\slide{Which Estimate Is Closest?}\n\\begin{columns}[4 4 4]\n\\begin{center}\n$L_2=1.125$\n\\end{center}\n\\begin{plot}\nf = x^2 + 1\ndomain = -0.1:1.1\nrange = -0.1:2.1\narea = 0:1\nriemann = 2\nrtype = left\nreadout = false\naspect = equal\nsize = 400\nxticks = 0.5\nyticks = 0.5\nalt = Left endpoint rectangles, estimate 1.125\n\\end{plot}\n\\columnbreak\n\\begin{center}\n$M_2=1.3125$\n\\end{center}\n\\begin{plot}\nf = x^2 + 1\ndomain = -0.1:1.1\nrange = -0.1:2.1\narea = 0:1\nriemann = 2\nrtype = mid\nreadout = false\naspect = equal\nsize = 400\nxticks = 0.5\nyticks = 0.5\nalt = Midpoint rectangles, estimate 1.3125\n\\end{plot}\n\\columnbreak\n\\begin{center}\n$R_2=1.625$\n\\end{center}\n\\begin{plot}\nf = x^2 + 1\ndomain = -0.1:1.1\nrange = -0.1:2.1\narea = 0:1\nriemann = 2\nrtype = right\nreadout = false\naspect = equal\nsize = 400\nxticks = 0.5\nyticks = 0.5\nalt = Right endpoint rectangles, estimate 1.625\n\\end{plot}\n\\end{columns}\n\n\\slide{Left Endpoints, $n=4$}\n\\begin{columns}[7 5, parallel]\nFour rectangles of width $0.25$, with left endpoints $0,\\ 0.25,\\ 0.5,\\ 0.75$\n\\pause\n\\begin{align}\nL_4 &= 0.25\\left[f(0)+f(0.25)+f(0.5)+f(0.75)\\right]\n\\pause\n\\phantom{L_4} &= 0.25\\left[1+1.0625+1.25+1.5625\\right]\n\\pause\n\\phantom{L_4} &= 0.25\\cdot4.875=1.21875\n\\end{align}\n\\pause\nCloser than $L_2=1.125$, and still an \\alert{underestimate}\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 4\nrtype = left\nreadout = false\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with four left endpoint rectangles of width 0.25\n\\end{plot}\n\\end{columns}\n\n\\slide{More Rectangles}\n\\begin{columns}[1 1, parallel]\n\\begin{plot}\nf = x^2 + 1\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 2\nrtype = left\nreadout = false\nanimate = n: 2 -> 64\nframes = 6\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Left endpoint rectangles under y = x squared plus 1, with 2, 4, 8, 16, 32, then 64 rectangles\n\\end{plot}\n\\columnbreak\n\\begin{table}\nRectangles & Left sum\n$n=2$ & $1.125$\n\\uncover<1->{$n=4$} & \\uncover<1->{$1.21875$}\n\\uncover<2->{$n=8$} & \\uncover<2->{$1.2734375$}\n\\uncover<3->{$n=16$} & \\uncover<3->{$1.3027\\ldots$}\n\\uncover<4->{$n=32$} & \\uncover<4->{$1.3178\\ldots$}\n\\uncover<5->{$n=64$} & \\uncover<5->{$1.3255\\ldots$}\n\\end{table}\n\\uncover<5->{The left sums increase toward the area}\n\\end{columns}\n\n\\slide{The Exact Area: $n$ Rectangles}\n\\begin{columns}[7 5, parallel]\nCut $[0,1]$ into $n$ pieces of width $1/n$, with left endpoints $0,\\ 1/n,\\ 2/n,\\ \\dots,\\ (n-1)/n$\n$$L_n=\\frac1n\\left[f\\!\\left(\\frac0n\\right)+f\\!\\left(\\frac1n\\right)+\\cdots+f\\!\\left(\\frac{n-1}{n}\\right)\\right]$$\n\\pause\n\\textbf{Key idea:} let the number of rectangles go to infinity\n\\begin{box}\n$$\\text{Area}=\\lim_{n\\to\\infty}L_n$$\n\\end{box}\n\\columnbreak\n\\begin{plot}\nf = x^2 + 1\nlabel = y=x^2+1 @ 0.45\ndomain = -0.15:1.15\nrange = -0.15:2.15\narea = 0:1\nriemann = 10\nrtype = left\nreadout = false\naspect = equal\nsize = 600\nxticks = 0.5\nyticks = 0.5\nalt = Graph of y = x squared plus 1 with ten left endpoint rectangles\n\\end{plot}\n\\end{columns}\n\n\\slide{Computing $L_n$}\nEach height is $f(i/n)=\\textcolor{c1}{i^2/n^2}+\\textcolor{c2}{1}$\n\\pause\n\\begin{align}\nL_n &= \\frac1n\\left[\\left(\\textcolor{c1}{\\frac{0^2}{n^2}}+\\textcolor{c2}{1}\\right)+\\left(\\textcolor{c1}{\\frac{1^2}{n^2}}+\\textcolor{c2}{1}\\right)+\\cdots+\\left(\\textcolor{c1}{\\frac{(n-1)^2}{n^2}}+\\textcolor{c2}{1}\\right)\\right]\n\\pause\n\\phantom{L_n} &= \\textcolor{c1}{\\frac1{n^3}\\left[0^2+1^2+\\cdots+(n-1)^2\\right]}+\\textcolor{c2}{\\frac1n\\,(\\underbrace{1+1+\\cdots+1}_{n\\text{ terms}})}\n\\pause\n\\phantom{L_n} &= \\textcolor{c1}{\\frac1{n^3}\\left[1^2+2^2+\\cdots+(n-1)^2\\right]}+\\textcolor{c2}{1}\n\\end{align}\n\n\\slide{Using the Sum of Squares}\n\\begin{theorem}{Sum of Squares}\n$$1^2+2^2+3^2+\\cdots+m^2=\\frac{m(m+1)(2m+1)}{6}$$\n\\end{theorem}\n\\pause\nWith $m=n-1$:\n\\begin{align}\nL_n &= \\frac1{n^3}\\cdot\\frac{(n-1)\\,n\\,(2n-1)}{6}+1\n\\pause\n\\phantom{L_n} &= \\frac{2n^2-3n+1}{6n^2}+1=\\frac13-\\frac1{2n}+\\frac1{6n^2}+1\n\\end{align}\n\n\\slide{Letting $n\\to\\infty$}\n\\begin{align}\nL_n &= \\frac13-\\frac1{2n}+\\frac1{6n^2}+1\n\\end{align}\n\\pause\n\\begin{align}\n\\text{Area} &= \\lim_{n\\to\\infty}L_n\n\\pause\n\\phantom{\\text{Area}} &= \\lim_{n\\to\\infty}\\left(\\frac13-\\frac1{2n}+\\frac1{6n^2}+1\\right)\n\\pause\n\\phantom{\\text{Area}} &= \\frac13+0+0+1=\\boxed{\\frac43=1.333\\ldots}\n\\end{align}\n\\pause\nOf the three estimates with $n=2$, the midpoint estimate $M_2=1.3125$ is closest\n\n% ------------------------------------------------------------------\n\\slide{Rectangles on $[a,b]$}\n\\begin{js}[size=1600x400, alt=\"A curve over the interval from a to b, divided into six subintervals with endpoints a, x_1, ..., x_5, b; each rectangle has the height of the curve at its right endpoint, and the third rectangle is marked with its width delta x and height f(x_3)\"]\nconst f = (x) => 0.78 + 0.22 * Math.sin(1.1 * x - 0.8) + 0.03 * x;\nconst L = 40, R = 30, T = 15, B = 75, x0 = 0, x1 = 6.6, y0 = -0.12;\nconst s = (w - L - R) / (x1 - x0);\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst a = 0.4, b = 6.2, n = 6, dx = (b - a) / n;\nfunction sub(x, y, m, k, color, align) {\n  ctx.font = \"italic 36px 'Spectral', serif\";\n  const wm = ctx.measureText(m).width;\n  ctx.font = \"italic 26px 'Spectral', serif\";\n  const wk = ctx.measureText(k).width;\n  const x2 = align === 'center' ? x - (wm + wk) / 2 : x;\n  ctx.fillStyle = color;\n  ctx.font = \"italic 36px 'Spectral', serif\"; ctx.fillText(m, x2, y);\n  ctx.font = \"italic 26px 'Spectral', serif\"; ctx.fillText(k, x2 + wm + 1, y + 9);\n  return x2 + wm + wk + 2;\n}\nfunction arrow(xa, ya, xb, yb) {\n  const ang = Math.atan2(yb - ya, xb - xa);\n  ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();\n  [[xa, ya, ang + Math.PI], [xb, yb, ang]].forEach((p) => {\n    ctx.beginPath(); ctx.moveTo(p[0], p[1]);\n    ctx.lineTo(p[0] - 14 * Math.cos(p[2] - 0.4), p[1] - 14 * Math.sin(p[2] - 0.4));\n    ctx.moveTo(p[0], p[1]);\n    ctx.lineTo(p[0] - 14 * Math.cos(p[2] + 0.4), p[1] - 14 * Math.sin(p[2] + 0.4));\n    ctx.stroke();\n  });\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  for (let i = 1; i <= n; i++) {\n    const xl = a + (i - 1) * dx, xr = a + i * dx, hv = f(xr);\n    ctx.globalAlpha = i === 3 ? 0.35 : 0.55;\n    ctx.fillStyle = i === 3 ? colors.c1 : colors.area;\n    ctx.fillRect(X(xl), Y(hv), X(xr) - X(xl), Y(0) - Y(hv));\n    ctx.globalAlpha = 1;\n    ctx.strokeStyle = i === 3 ? colors.c1 : colors.curve2; ctx.lineWidth = i === 3 ? 3 : 2;\n    ctx.strokeRect(X(xl), Y(hv), X(xr) - X(xl), Y(0) - Y(hv));\n  }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), 4); ctx.stroke();\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let k = 0; k <= 300; k++) { const x = 0.15 + 6.3 * k / 300; if (k) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  for (let i = 1; i <= n; i++) {\n    const xr = a + i * dx;\n    ctx.fillStyle = colors.c2; ctx.beginPath(); ctx.arc(X(xr), Y(f(xr)), 8, 0, 2 * Math.PI); ctx.fill();\n  }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  for (let i = 0; i <= n; i++) {\n    const xv = X(a + i * dx);\n    ctx.beginPath(); ctx.moveTo(xv, Y(0) - 8); ctx.lineTo(xv, Y(0) + 8); ctx.stroke();\n    if (i === 0) sub(xv, Y(0) + 46, 'a', '', colors.ink, 'center');\n    else if (i === n) sub(xv, Y(0) + 46, 'b', '', colors.ink, 'center');\n    else sub(xv, Y(0) + 46, 'x', String(i), colors.ink, 'center');\n  }\n  const xl3 = X(a + 2 * dx), xr3 = X(a + 3 * dx), top3 = Y(f(a + 3 * dx));\n  ctx.strokeStyle = colors.c1; ctx.lineWidth = 2.5;\n  arrow(xl3 + 6, Y(0.1), xr3 - 6, Y(0.1));\n  ctx.fillStyle = colors.c1; ctx.font = \"italic 36px 'Spectral', serif\"; ctx.textAlign = 'center';\n  ctx.fillText('Δx', (xl3 + xr3) / 2, Y(0.1) - 14);\n  ctx.textAlign = 'left';\n  arrow(xr3 - 22, Y(0) - 4, xr3 - 22, top3 + 4);\n  let xe = (xl3 + xr3) / 2 - 62, ye = (Y(0) + top3) / 2 - 10;\n  ctx.fillStyle = colors.c1; ctx.font = \"italic 36px 'Spectral', serif\"; ctx.fillText('f(', xe, ye);\n  xe += ctx.measureText('f(').width;\n  xe = sub(xe, ye, 'x', '3', colors.c1, 'left');\n  ctx.fillStyle = colors.c1; ctx.font = \"italic 36px 'Spectral', serif\"; ctx.fillText(')', xe, ye);\n}\ndraw();\nif (document.fonts) document.fonts.ready.then(draw);\n\\end{js}\nDivide $[a,b]$ into $n$ subintervals of equal width $\\Delta x=(b-a)/n$\n\\\\\nEndpoints: $x_i=a+i\\,\\Delta x$ for $i=0,1,\\dots,n$, so $x_0=a$ and $x_n=b$\n\\pause\nRight endpoints: $\\ R_n=f(x_1)\\,\\Delta x+f(x_2)\\,\\Delta x+\\cdots+f(x_n)\\,\\Delta x$\n\\pause\nLeft endpoints: $\\ L_n=f(x_0)\\,\\Delta x+f(x_1)\\,\\Delta x+\\cdots+f(x_{n-1})\\,\\Delta x$\n\n\\slide{Definition of Area}\n\\textbf{Sigma notation:} $\\displaystyle\\sum_{i=1}^n a_i=a_1+a_2+\\cdots+a_n$ (start at $i=1$, add, and end at $i=n$)\n\\pause\n\\begin{definition}{Area}\nThe area under the graph of a continuous function $f\\ge0$ from $a$ to $b$ is\n$$A=\\lim_{n\\to\\infty}R_n=\\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_i)\\,\\Delta x$$\n\\end{definition}\n\\pause\nLeft endpoints give the same limit:\n$$A=\\lim_{n\\to\\infty}L_n=\\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_{i-1})\\,\\Delta x$$\n\n\\slide{Any Sample Points Work}\n\\begin{columns}[1 1, parallel]\nChoose any \\textbf{sample point} $x_i^*$ in each subinterval and use the height $f(x_i^*)$\n$$\\sum_{i=1}^n f(x_i^*)\\,\\Delta x\\ \\longrightarrow\\ A$$\n\\pause\n\\textbf{Lower sum:} the smallest value of $f$ on each subinterval\n\\pause\n\\textbf{Upper sum:} the largest value of $f$ on each subinterval\n\\pause\nEvery lower sum $\\le A\\le$ every upper sum, and both sums approach $A$ as $n\\to\\infty$\n\\columnbreak\n\\begin{js}[size=800x620, alt=\"Four rectangles under the curve y = 1.8 + 0.9 sin(1.5x) from 0 to 4 with sample points that can be dragged inside their subintervals; then the lower sum, the upper sum, and both sums with 16 rectangles\"]\nconst f = (x) => 1.8 + 0.9 * Math.sin(1.5 * x);\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.35, x1 = 4.3, y0 = -0.35;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nconst mode = local === 3 ? 'both' : local === 2 ? 'upper' : local === 1 ? 'lower' : 'free';\nconst a = 0, b = 4, n = mode === 'both' ? 16 : 4, dx = (b - a) / n;\nif (!state.pts) state.pts = [0.5, 1.5, 2.5, 3.5];\nfunction ext(i, big) {\n  let m = big ? -Infinity : Infinity;\n  for (let k = 0; k <= 80; k++) { const v = f(a + i * dx + dx * k / 80); m = big ? Math.max(m, v) : Math.min(m, v); }\n  return m;\n}\nfunction trunc(v) { return (v < 0 ? '−' : '') + (Math.floor(Math.abs(v) * 1e4) / 1e4).toFixed(4) + '...'; }\nfunction axes(dxt, dyt) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dxt); k * dxt <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dxt), Y(y0)); ctx.lineTo(X(k * dxt), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dyt); k * dyt <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dyt)); ctx.lineTo(X(x1), Y(k * dyt)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dxt); k * dxt <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dxt), X(k * dxt), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dyt); k * dyt <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dyt), X(0) - 12, Y(k * dyt));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction rect(i, hv, fill, alpha, edge) {\n  const xl = a + i * dx;\n  ctx.globalAlpha = alpha; ctx.fillStyle = fill;\n  ctx.fillRect(X(xl), Y(hv), X(xl + dx) - X(xl), Y(0) - Y(hv));\n  ctx.globalAlpha = 1; ctx.strokeStyle = edge; ctx.lineWidth = 2;\n  ctx.strokeRect(X(xl), Y(hv), X(xl + dx) - X(xl), Y(0) - Y(hv));\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  let lo = 0, hi = 0, sum = 0;\n  for (let i = 0; i < n; i++) {\n    const mn = ext(i, false), mx = ext(i, true);\n    lo += mn * dx; hi += mx * dx;\n    if (mode === 'free') { const hv = f(state.pts[i]); sum += hv * dx; rect(i, hv, colors.area, 0.6, colors.curve2); }\n    else if (mode === 'lower') rect(i, mn, colors.c1, 0.3, colors.c1);\n    else if (mode === 'upper') rect(i, mx, colors.c2, 0.25, colors.c2);\n    else { rect(i, mx, colors.c2, 0.18, colors.c2); rect(i, mn, colors.c1, 0.3, colors.c1); }\n  }\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let k = 0; k <= 300; k++) { const x = x0 + (x1 - x0) * k / 300; if (k) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  ctx.font = \"30px 'JetBrains Mono', monospace\"; ctx.textAlign = 'right';\n  if (mode === 'free') {\n    state.pts.forEach((p) => {\n      ctx.strokeStyle = colors.c2; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);\n      ctx.beginPath(); ctx.moveTo(X(p), Y(0)); ctx.lineTo(X(p), Y(f(p))); ctx.stroke(); ctx.setLineDash([]);\n      ctx.fillStyle = colors.c2;\n      ctx.beginPath(); ctx.arc(X(p), Y(f(p)), 8, 0, 2 * Math.PI); ctx.fill();\n      ctx.beginPath(); ctx.arc(X(p), Y(0), 12, 0, 2 * Math.PI); ctx.fill();\n    });\n    ctx.fillStyle = colors.ink; ctx.fillText('sum = ' + trunc(sum), w - 24, 50);\n  } else if (mode === 'lower') { ctx.fillStyle = colors.c1; ctx.fillText('lower sum = ' + trunc(lo), w - 24, 50); }\n  else if (mode === 'upper') { ctx.fillStyle = colors.c2; ctx.fillText('upper sum = ' + trunc(hi), w - 24, 50); }\n  else {\n    ctx.fillStyle = colors.c2; ctx.fillText('upper sum = ' + trunc(hi), w - 24, 50);\n    ctx.fillStyle = colors.c1; ctx.fillText('lower sum = ' + trunc(lo), w - 24, 92);\n  }\n  ctx.fillStyle = colors.ink; ctx.fillText('n = ' + n, w - 24, mode === 'both' ? 134 : 92);\n  ctx.textAlign = 'left';\n}\nconst toX = (e) => { const rc = canvas.getBoundingClientRect(); return x0 + ((e.clientX - rc.left) * w / rc.width - L) / s; };\nif (mode === 'free') {\n  canvas.style.touchAction = 'none';\n  canvas.onpointerdown = (e) => {\n    const xv = toX(e); let best = -1, bd = 0.3;\n    state.pts.forEach((p, i) => { if (Math.abs(p - xv) < bd) { bd = Math.abs(p - xv); best = i; } });\n    if (best < 0) return;\n    state.drag = best; canvas.setPointerCapture(e.pointerId); e.preventDefault();\n  };\n  canvas.onpointermove = (e) => {\n    const xv = toX(e);\n    if (!(state.drag >= 0)) { canvas.style.cursor = state.pts.some((p) => Math.abs(p - xv) < 0.3) ? 'ew-resize' : ''; return; }\n    const i = state.drag;\n    state.pts[i] = Math.min(a + (i + 1) * dx, Math.max(a + i * dx, xv));\n  };\n  canvas.onpointerup = () => { state.drag = -1; };\n  canvas.onpointercancel = canvas.onpointerup;\n} else {\n  canvas.onpointerdown = null; canvas.onpointermove = null; canvas.onpointerup = null; canvas.onpointercancel = null;\n  canvas.style.cursor = '';\n}\nonFrame(() => draw());\n\\end{js}\n\\end{columns}\n\n\\slide{Example: A Right Endpoint Sum}\n\\begin{columns}[7 5, parallel]\n\\textbf{Example:} compute $R_4$ for $f(x)=x^2$ on $[1,3]$\n\\pause\n$\\Delta x=(3-1)/4=0.5$ and $x_i=1+0.5\\,i$\n\\\\\nRight endpoints: $x_1,\\dots,x_4=1.5,\\ 2,\\ 2.5,\\ 3$\n\\pause\n\\begin{align}\nR_4 &= 0.5\\left[f(1.5)+f(2)+f(2.5)+f(3)\\right]\n\\pause\n\\phantom{R_4} &= 0.5\\left[2.25+4+6.25+9\\right]\n\\pause\n\\phantom{R_4} &= 0.5\\cdot21.5=10.75\n\\end{align}\n\\pause\n$f$ is increasing, so $R_4$ is an overestimate\n\\begin{flushright}\n\\accent{Next slide: You Try}\n\\end{flushright}\n\\columnbreak\n\\begin{plot}\nf = x^2\ndomain = -0.2:3.3\nrange = -0.3:9.6\narea = 1:3\nriemann = 4\nrtype = right\nreadout = false\naspect = equal\nsize = 600\nxticks = 1\nyticks = 1\nalt = Graph of y = x squared with four right endpoint rectangles of width 0.5 between x = 1 and x = 3\n\\end{plot}\n\\end{columns}\n\n\\slide[valign=center]{You Try}\n\\begin{youtry}[time=none]{Right Endpoints}\nCompute $R_3$ for $f(x)=x^2$ on $[0,3]$\n\\pause\n\\timer{60}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[7 5, parallel]\nCompute $R_3$ for $f(x)=x^2$ on $[0,3]$\n\\pause\nWidth $\\Delta x=(3-0)/3=1$, right endpoints $1,\\ 2,\\ 3$\n\\pause\n\\begin{align}\nR_3 &= f(1)\\cdot1+f(2)\\cdot1+f(3)\\cdot1\n\\pause\n\\phantom{R_3} &= 1+4+9=14\n\\end{align}\n\\pause\nThe function $f(x)=x^2$ is increasing on $[0,3]$, so $R_3$ is an overestimate (the exact area turns out to be $9$)\n\\columnbreak\n\\begin{plot}\nf = x^2\ndomain = -0.2:3.3\nrange = -0.3:9.6\narea = 0:3\nriemann = 3\nrtype = right\nreadout = false\naspect = equal\nsize = 600\nxticks = 1\nyticks = 1\nalt = Graph of y = x squared on [0, 3] with three right endpoint rectangles of width 1\n\\end{plot}\n\\end{columns}\n\n% ==================================================================\n\\section{The Distance Problem}\n\n\\slide{Free Fall: Distance Is Area Under Velocity}\n\\begin{columns}[1 1, parallel]\nA dropped object falls with velocity $v(t)=9.8t$ m/s after $t$ seconds\n\\\\[0.5em]\nOn a short time interval $v$ is nearly constant, so distance $\\approx$ velocity $\\times$ time: the area of a rectangle\n\\begin{uncover}<6->\nDistance fallen in $3$ seconds $=$ area of the triangle:\n$$\\tfrac12\\cdot3\\cdot29.4=44.1\\text{ meters}$$\nAfter $t$ seconds: $d=\\tfrac12\\cdot t\\cdot gt=\\tfrac12gt^2$, the free-fall formula ($g=9.8$ m/s$^2$)\n\\end{uncover}\n\\columnbreak\n\\begin{only}<0-5>\n\\begin{plot}\nf = 9.8x\ndomain = -0.25:3.4\nrange = -3:32\narea = 0:3\nriemann = 3\nrtype = left\nanimate = n: 3 -> 96\nframes = 6\nreadout = false\nxticks = 1\nyticks = 10\nxlabel = t\nylabel = v\nsize = 800x600\nalt = Velocity v = 9.8t for t from 0 to 3 seconds, with left endpoint rectangles: 3, 6, 12, 24, 48, then 96 of them\n\\end{plot}\n\\end{only}\n\\begin{only}<6->\n\\begin{plot}\nf = 9.8x\ndomain = -0.25:3.4\nrange = -3:32\narea = 0:3\nxticks = 1\nyticks = 10\nxlabel = t\nylabel = v\nsize = 800x600\nalt = Velocity v = 9.8t for t from 0 to 3 seconds, with the triangle under it shaded\n\\end{plot}\n\\end{only}\n\\begin{flushright}\n\\accent{Next slide: You Try}\n\\end{flushright}\n\\end{columns}\n\n\\slide[valign=center]{You Try}\n\\begin{youtry}[time=none]{Estimating Distance}\nA cyclist's speed is recorded every $10$ seconds. Use left and right endpoints to find a lower and an upper estimate for the distance traveled in $30$ seconds\n\\begin{table}[noheader]\nTime (s) & $0$ & $10$ & $20$ & $30$\nSpeed (m/s) & $4$ & $6$ & $7$ & $8$\n\\end{table}\n\\pause\n\\timer{90}\n\\end{youtry}\n\n\\slide{You Try: Solution}\nA cyclist's speed is recorded every $10$ seconds. Find a lower and an upper estimate for the distance traveled in $30$ seconds\n\\begin{table}[noheader]\nTime (s) & $0$ & $10$ & $20$ & $30$\nSpeed (m/s) & $4$ & $6$ & $7$ & $8$\n\\end{table}\n\\pause\n\\begin{align}\n\\text{Left endpoints:}\\quad L_3 &= 10\\cdot4+10\\cdot6+10\\cdot7=170\\text{ m}\n\\pause\n\\text{Right endpoints:}\\quad R_3 &= 10\\cdot6+10\\cdot7+10\\cdot8=210\\text{ m}\n\\end{align}\n\\pause\nThe speed increases, so $170\\le\\text{distance}\\le210$ meters\n\n% ==================================================================\n\\section{The Definite Integral}\n\n\\slide{The Definite Integral}\n\\begin{definition}{Definite Integral}\nLet $f$ be defined on $[a,b]$. Divide $[a,b]$ into $n$ subintervals of width $\\Delta x=(b-a)/n$ and choose sample points $x_i^*$. The \\textbf{definite integral} of $f$ from $a$ to $b$ is\n$$\\int_a^b f(x)\\,dx=\\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_i^*)\\,\\Delta x$$\nwhen this limit exists and is the same for every choice of sample points. Then $f$ is \\textbf{integrable} on $[a,b]$\n\\end{definition}\n\\pause\nEvery continuous function on $[a,b]$ is integrable, and so is every function with finitely many jump discontinuities\n\n\\slide{Reading the Notation}\n$$\\lim_{n\\to\\infty}\\sum_{i=1}^n \\textcolor{c1}{f(x_i^*)}\\,\\textcolor{c2}{\\Delta x}\\qquad\\longrightarrow\\qquad\\int_a^b \\textcolor{c1}{f(x)}\\,\\textcolor{c2}{dx}$$\n\\begin{itemize}\n\\item Leibniz chose the integral sign $\\int$, an elongated S, because an integral is a limit of sums\n\\item $\\textcolor{c1}{f(x)}$ is the \\textbf{integrand}; $a$ and $b$ are the lower and upper \\textbf{limits of integration}\n\\item $\\textcolor{c2}{dx}$ names the variable, and the letter does not matter: $\\int_a^b f(x)\\,dx=\\int_a^b f(t)\\,dt$\n\\item The sum $\\sum_{i=1}^n f(x_i^*)\\,\\Delta x$ is a \\textbf{Riemann sum}\n\\item If $f\\ge0$, then $\\int_a^b f(x)\\,dx$ is the area under the graph of $f$ from $a$ to $b$\n\\end{itemize}\n\n\\slide{Net Area}\n\\begin{columns}[7 5, parallel]\nIf $f$ takes negative values, the rectangles below the $x$-axis have negative heights $f(x_i^*)$ and count negatively\n\\pause\n$$\\int_a^b f(x)\\,dx=\\textcolor{c1}{A_1}-\\textcolor{c2}{A_2}$$\n$\\textcolor{c1}{A_1}$: area above the $x$-axis and below the graph\n\\\\[0.3em]\n$\\textcolor{c2}{A_2}$: area below the $x$-axis and above the graph\n\\pause\nThe definite integral is a \\textbf{net area}\n\\columnbreak\n\\begin{js}[size=470x760, alt=\"Graph of y = 1 minus x squared from 0 to 2; the region above the x-axis from 0 to 1 is labeled A_1 and the region below the x-axis from 1 to 2 is labeled A_2\"]\nconst f = (x) => 1 - x * x;\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.25, x1 = 2.3, y0 = -3.3;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nfunction axes(dx, dy) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dx), Y(y0)); ctx.lineTo(X(k * dx), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dy)); ctx.lineTo(X(x1), Y(k * dy)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dx), X(k * dx), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dy), X(0) - 12, Y(k * dy));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction region(lo, hi, color) {\n  ctx.globalAlpha = 0.35; ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(X(lo), Y(0));\n  for (let k = 0; k <= 100; k++) { const x = lo + (hi - lo) * k / 100; ctx.lineTo(X(x), Y(f(x))); }\n  ctx.lineTo(X(hi), Y(0)); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;\n}\nfunction sub(x, y, m, k, color) {\n  ctx.fillStyle = color;\n  ctx.font = \"italic 44px 'Spectral', serif\"; ctx.fillText(m, x, y);\n  const wm = ctx.measureText(m).width;\n  ctx.font = \"italic 30px 'Spectral', serif\"; ctx.fillText(k, x + wm + 1, y + 10);\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  region(0, 1, colors.c1);\n  region(1, 2, colors.c2);\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let k = 0; k <= 300; k++) { const x = x0 + (x1 - x0) * k / 300; if (k) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  sub(X(0.22), Y(0.3), 'A', '1', colors.c1);\n  sub(X(1.42), Y(-0.8), 'A', '2', colors.c2);\n  ctx.fillStyle = colors.curve; ctx.font = \"italic 34px 'Spectral', serif\";\n  ctx.fillText('y = 1 − x²', X(0.9), Y(-3.0));\n}\ndraw();\nif (document.fonts) document.fonts.ready.then(draw);\n\\end{js}\n\\end{columns}\n\n\\slide{A Riemann Sum With Negative Terms}\n\\begin{columns}[7 5, parallel]\n\\begin{example}{Right Endpoints}\nCompute $R_4$ for $f(x)=1-x^2$ on $[0,2]$\n\\end{example}\n\\pause\n$\\Delta x=(2-0)/4=0.5$; right endpoints $0.5,\\ 1,\\ 1.5,\\ 2$\n\\pause\n\\begin{align}\nR_4 &= 0.5\\left[f(0.5)+f(1)+f(1.5)+f(2)\\right]\n\\pause\n\\phantom{R_4} &= 0.5\\left[\\textcolor{c1}{0.75}+0\\textcolor{c2}{\\;-\\;1.25\\;-\\;3}\\right]\n\\pause\n\\phantom{R_4} &= 0.5\\,(-3.5)=-1.75\n\\end{align}\n\\pause\nRectangles below the $x$-axis count negatively\n\\columnbreak\n\\begin{js}[size=470x760, alt=\"Graph of y = 1 minus x squared from 0 to 2 with four right endpoint rectangles of width 0.5; one rectangle lies above the x-axis and two lie below it\"]\nconst f = (x) => 1 - x * x;\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.25, x1 = 2.3, y0 = -3.3;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nfunction axes(dx, dy) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dx), Y(y0)); ctx.lineTo(X(k * dx), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dy)); ctx.lineTo(X(x1), Y(k * dy)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dx), X(k * dx), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dy), X(0) - 12, Y(k * dy));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  const n = 4, dx = 2 / n;\n  for (let i = 1; i <= n; i++) {\n    const xl = (i - 1) * dx, hv = f(i * dx), col = hv >= 0 ? colors.c1 : colors.c2;\n    ctx.globalAlpha = 0.3; ctx.fillStyle = col;\n    ctx.fillRect(X(xl), Math.min(Y(hv), Y(0)), X(xl + dx) - X(xl), Math.abs(Y(hv) - Y(0)));\n    ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = 2;\n    ctx.strokeRect(X(xl), Math.min(Y(hv), Y(0)), X(xl + dx) - X(xl), Math.abs(Y(hv) - Y(0)));\n  }\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let k = 0; k <= 300; k++) { const x = x0 + (x1 - x0) * k / 300; if (k) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  for (let i = 1; i <= n; i++) { ctx.fillStyle = colors.ink; ctx.beginPath(); ctx.arc(X(i * dx), Y(f(i * dx)), 7, 0, 2 * Math.PI); ctx.fill(); }\n}\ndraw();\nif (document.fonts) document.fonts.ready.then(draw);\n\\end{js}\n\\end{columns}\n\n\\slide{Riemann Sums Approach the Net Area}\n\\begin{columns}[7 5, parallel]\n\\begin{table}\nRectangles & Right sum\n$n=4$ & $-1.75$\n\\uncover<1->{$n=8$} & \\uncover<1->{$-1.1875$}\n\\uncover<2->{$n=16$} & \\uncover<2->{$-0.921875$}\n\\uncover<3->{$n=32$} & \\uncover<3->{$-0.7929\\ldots$}\n\\uncover<4->{$n=64$} & \\uncover<4->{$-0.7294\\ldots$}\n\\end{table}\n\\begin{uncover}<4->\nAs $n\\to\\infty$, the right sums approach the net area\n$$\\int_0^2(1-x^2)\\,dx=\\textcolor{c1}{A_1}-\\textcolor{c2}{A_2}=-\\tfrac23=-0.666\\ldots$$\nSection 5.3 gives this exact value\n\\end{uncover}\n\\columnbreak\n\\begin{js}[size=470x760, frames=5, alt=\"Right endpoint rectangles for y = 1 minus x squared from 0 to 2, with 4, 8, 16, 32, then 64 rectangles; rectangles above the x-axis and below it have different colors\"]\nconst f = (x) => 1 - x * x;\nconst N = [4, 8, 16, 32, 64];\nconst n = N[Math.min(local, 4)];\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.25, x1 = 2.3, y0 = -3.3;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nfunction axes(dx, dy) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dx), Y(y0)); ctx.lineTo(X(k * dx), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dy)); ctx.lineTo(X(x1), Y(k * dy)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dx), X(k * dx), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dy), X(0) - 12, Y(k * dy));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  const dx = 2 / n;\n  for (let i = 1; i <= n; i++) {\n    const xl = (i - 1) * dx, hv = f(i * dx), col = hv >= 0 ? colors.c1 : colors.c2;\n    ctx.globalAlpha = 0.3; ctx.fillStyle = col;\n    ctx.fillRect(X(xl), Math.min(Y(hv), Y(0)), X(xl + dx) - X(xl), Math.abs(Y(hv) - Y(0)));\n    ctx.globalAlpha = 1; ctx.strokeStyle = col; ctx.lineWidth = n > 20 ? 1 : 2;\n    ctx.strokeRect(X(xl), Math.min(Y(hv), Y(0)), X(xl + dx) - X(xl), Math.abs(Y(hv) - Y(0)));\n  }\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4; ctx.beginPath();\n  for (let k = 0; k <= 300; k++) { const x = x0 + (x1 - x0) * k / 300; if (k) ctx.lineTo(X(x), Y(f(x))); else ctx.moveTo(X(x), Y(f(x))); }\n  ctx.stroke();\n  ctx.fillStyle = colors.ink; ctx.font = \"32px 'JetBrains Mono', monospace\";\n  ctx.fillText('n = ' + n, X(1.2), Y(0.9));\n}\ndraw();\nstate.shown = n;\nif (document.fonts) document.fonts.ready.then(() => { if (state.shown === n) draw(); });\n\\end{js}\n\\end{columns}\n\n\\slide{Integrals From Geometry: A Quarter Disk}\n\\begin{columns}[7 5, parallel]\n\\begin{example}{A Quarter Disk}\nEvaluate $\\displaystyle\\int_0^1\\sqrt{1-x^2}\\,dx$ by interpreting it as an area\n\\end{example}\n\\pause\nSquaring $y=\\sqrt{1-x^2}$ gives $x^2+y^2=1$ with $y\\ge0$: the upper half of the circle of radius $1$\n\\pause\nFor $0\\le x\\le1$, the region is a quarter of a disk of radius $1$\n$$\\int_0^1\\sqrt{1-x^2}\\,dx=\\tfrac14\\cdot\\pi\\cdot1^2=\\boxed{\\frac\\pi4}$$\n\\columnbreak\n\\begin{plot}\nf = sqrt(1 - x^2)\ndomain = -0.25:1.25\nrange = -0.25:1.25\narea = 0:1\naspect = equal\nsize = 660\nxticks = 0.5\nyticks = 0.5\nalt = The quarter circle y = square root of 1 minus x squared for x from 0 to 1, with the quarter disk under it shaded\n\\end{plot}\n\\end{columns}\n\n\\slide{Integrals From Geometry: Net Area}\n\\begin{columns}[7 5, parallel]\n\\begin{example}{Net Area of a Line}\nEvaluate $\\displaystyle\\int_0^3(x-1)\\,dx$ by interpreting it as a net area\n\\end{example}\n\\pause\nThe graph is the line through $(1,0)$ with slope $1$\n\\pause\n$\\textcolor{c1}{A_1}=\\tfrac12\\cdot2\\cdot2=2$, above the $x$-axis\n\\\\[0.3em]\n$\\textcolor{c2}{A_2}=\\tfrac12\\cdot1\\cdot1=0.5$, below the $x$-axis\n\\pause\n$$\\int_0^3(x-1)\\,dx=\\textcolor{c1}{A_1}-\\textcolor{c2}{A_2}=2-0.5=\\boxed{1.5}$$\n\\columnbreak\n\\begin{js}[size=620x620, alt=\"The line y = x minus 1 from 0 to 3; the triangle above the x-axis from 1 to 3 is labeled A_1 and the triangle below the x-axis from 0 to 1 is labeled A_2\"]\nconst f = (x) => x - 1;\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.4, x1 = 3.4, y0 = -1.4;\nconst s = (w - L - R) / (x1 - x0), y1 = y0 + (h - T - B) / s;\nconst X = (x) => L + (x - x0) * s, Y = (y) => h - B - (y - y0) * s;\nconst tick = (v) => (v < 0 ? '−' : '') + (Math.abs(v) % 1 === 0 ? String(Math.abs(v)) : Math.abs(v).toFixed(1));\nfunction axes(dx, dy) {\n  ctx.strokeStyle = colors.grid; ctx.lineWidth = 1;\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(k * dx), Y(y0)); ctx.lineTo(X(k * dx), Y(y1)); ctx.stroke(); }\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) { ctx.beginPath(); ctx.moveTo(X(x0), Y(k * dy)); ctx.lineTo(X(x1), Y(k * dy)); ctx.stroke(); }\n  ctx.strokeStyle = colors.axis; ctx.lineWidth = 2;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(0)); ctx.lineTo(X(x1), Y(0)); ctx.moveTo(X(0), Y(y0)); ctx.lineTo(X(0), Y(y1)); ctx.stroke();\n  ctx.fillStyle = colors.text; ctx.font = \"26px 'JetBrains Mono', monospace\";\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  for (let k = Math.ceil(x0 / dx); k * dx <= x1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dx), X(k * dx), Y(0) + 10);\n  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';\n  for (let k = Math.ceil(y0 / dy); k * dy <= y1 + 1e-9; k++) if (k) ctx.fillText(tick(k * dy), X(0) - 12, Y(k * dy));\n  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';\n}\nfunction triangle(xa, xb, color) {\n  ctx.globalAlpha = 0.35; ctx.fillStyle = color;\n  ctx.beginPath(); ctx.moveTo(X(xa), Y(0)); ctx.lineTo(X(xb), Y(0)); ctx.lineTo(X(xa === 1 ? xb : xa), Y(f(xa === 1 ? xb : xa))); ctx.closePath(); ctx.fill();\n  ctx.globalAlpha = 1;\n}\nfunction sub(x, y, m, k, color) {\n  ctx.fillStyle = color;\n  ctx.font = \"italic 44px 'Spectral', serif\"; ctx.fillText(m, x, y);\n  const wm = ctx.measureText(m).width;\n  ctx.font = \"italic 30px 'Spectral', serif\"; ctx.fillText(k, x + wm + 1, y + 10);\n}\nfunction draw() {\n  ctx.clearRect(0, 0, w, h);\n  axes(1, 1);\n  triangle(1, 3, colors.c1);\n  triangle(0, 1, colors.c2);\n  ctx.strokeStyle = colors.curve; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(f(x0))); ctx.lineTo(X(x1), Y(f(x1))); ctx.stroke();\n  sub(X(2.25), Y(0.45), 'A', '1', colors.c1);\n  sub(X(0.12), Y(-0.45), 'A', '2', colors.c2);\n}\ndraw();\nif (document.fonts) document.fonts.ready.then(draw);\n\\end{js}\n\\begin{flushright}\n\\accent{Next slide: You Try}\n\\end{flushright}\n\\end{columns}\n\n\\slide[valign=center]{You Try}\n\\begin{youtry}[time=none]{Net Area}\nEvaluate $\\displaystyle\\int_0^5(x-2)\\,dx$ by interpreting it as a net area\n\\pause\n\\timer{60}\n\\end{youtry}\n\n\\slide{You Try: Solution}\n\\begin{columns}[7 5, parallel]\nEvaluate $\\displaystyle\\int_0^5(x-2)\\,dx$ by interpreting it as a net area\n\\pause\nThe graph is the line through $(2,0)$ with slope $1$\n\\pause\n$\\textcolor{c1}{A_1}=\\tfrac12\\cdot3\\cdot3=4.5$, above the $x$-axis\n\\\\[0.3em]\n$\\textcolor{c2}{A_2}=\\tfrac12\\cdot2\\cdot2=2$, below the $x$-axis\n\\pause\n$$\\int_0^5(x-2)\\,dx=\\textcolor{c1}{A_1}-\\textcolor{c2}{A_2}=4.5-2=\\boxed{2.5}$$\n\\columnbreak\n\\begin{js}[size=640x640, alt=\"The line y = x minus 2 from 0 to 5; the triangle above the x-axis from 2 to 5 is labeled A_1 and the triangle below the x-axis from 0 to 2 is labeled A_2\"]\nconst f = (x) => x - 2;\nconst L = 70, R = 20, T = 20, B = 50, x0 = -0.4, x1 = 5.4, e; ctx.lineWidth = 4;\n  ctx.beginPath(); ctx.moveTo(X(x0), Y(f(x0))); ctx.lineTo(X(x1), Y(f(x1))); ctx.stroke();\n  sub(X(3.85), Y(0.6), 'A', '1', colors.c1);\n  sub(X(0.2), Y(-0.75), 'A', '2', colors.c2);\n}\ndraw();\nif (document.fonts) document.fonts.ready.then(draw);\n\\end{js}\n\\end{columns}\n\n% ------------------------------------------------------------------\n\\slide{Extra Example: Speedometer Readings}\nA car's speedometer is read every $5$ seconds (speeds converted to feet per second). Estimate the distance traveled in $30$ seconds\n\\begin{table}[noheader]\nTime (s) & $0$ & $5$ & $10$ & $15$ & $20$ & $25$ & $30$\nSpeed (ft/s) & $25$ & $31$ & $35$ & $43$ & $47$ & $45$ & $41$\n\\end{table}\n\\pause\n\\begin{align}\n\\text{Left endpoints:}\\quad L_6 &= 5\\,(25+31+35+43+47+45)=1130\\text{ ft}\n\\pause\n\\text{Right endpoints:}\\quad R_6 &= 5\\,(31+35+43+47+45+41)=1210\\text{ ft}\n\\end{align}\n\\pause\nThe speed rises and then falls, so neither estimate is guaranteed to be too small or too large; more frequent readings give better estimates\n\n% ==================================================================\n\\slide{Summary}\n\\begin{itemize}\n\\item \\textbf{Area} under the graph of a continuous $f\\ge0$: $\\ A=\\displaystyle\\lim_{n\\to\\infty}R_n=\\lim_{n\\to\\infty}L_n$\n\\item \\textbf{Riemann sum}: $\\displaystyle\\sum_{i=1}^n f(x_i^*)\\,\\Delta x$, with $\\Delta x=(b-a)/n$ and a sample point $x_i^*$ in each subinterval\n\\item \\textbf{Definite integral}: $\\displaystyle\\int_a^b f(x)\\,dx=\\lim_{n\\to\\infty}\\sum_{i=1}^n f(x_i^*)\\,\\Delta x$\n\\item \\textbf{Net area}: $\\displaystyle\\int_a^b f(x)\\,dx=A_1-A_2$\n\\item \\textbf{Distance} traveled is the area under the velocity graph (when $v\\ge0$)\n\\end{itemize}\n\n\\slide{Coming Up}\n\\textbf{Problem set} for Lecture 21: posted on the course website after class\n\\begin{table}\nDate & Topic\nWed 11/18 & Section 5.2: properties of the integral; Section 5.3: the Fundamental Theorem of Calcu
